// ---------- Análise (Campeonato › Esquemas táticos) ----------
function mapaZonasEP(lista, comNota = true, espelho = false) {
  const conta = Object.fromEntries(EP.zonas.map(z => [z, { n: 0, g: 0 }]));
  for (const { e } of lista) { const c = conta[e.zona_ep]; if (c) { c.n++; if (contactoGanho(e)) c.g++; } }
  const total = Math.max(1, lista.length); const max = Math.max(1, ...Object.values(conta).map(c => c.n));
  const W = 68; const alfa = n => (n ? 0.12 + 0.68 * n / max : 0);
  const rect = (x, y, w, h, z, rot) => { const c = conta[z]; return `<g class="zona"><rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill-opacity:${alfa(c.n)}"/><text x="${x + w / 2}" y="${y + h / 2 - 1.2}" class="${alfa(c.n) > 0.5 ? 'claro' : ''}">${rot}</text><text x="${x + w / 2}" y="${y + h / 2 + 2.4}" class="sub ${alfa(c.n) > 0.5 ? 'claro' : ''}">${fmtNum(c.n / total * 100, 0)}%</text><title>${z}: ${c.n} (${c.n ? fmtNum(c.g / c.n * 100, 0) : 0}% de 1.º contacto ganho)</title></g>`; };
  const [c0, c1, c2] = COLS_EP;
  // Batidos da direita: o 1.º poste fica à direita, como se vê no campo.
  const [cA, cC] = espelho ? [c2, c0] : [c0, c2];
  const zonas = rect(cA[0], 0, cA[1] - cA[0], 16.5, 'Zona 1', '1') + rect(c1[0], 0, c1[1] - c1[0], 16.5, 'Zona 2', '2') + rect(cC[0], 0, cC[1] - cC[0], 16.5, 'Zona 3', '3') + rect(M.areaY0, 16.5, M.areaY1 - M.areaY0, 11, 'Zona 4', '4');
  const linhas = `<g class="linhas-v"><rect x="0" y="0" width="${W}" height="30"/><rect x="${M.areaY0}" y="0" width="${M.areaY1 - M.areaY0}" height="16.5"/><rect x="${M.peqY0}" y="0" width="${M.peqY1 - M.peqY0}" height="5.5"/><rect x="${W / 2 - 3.66}" y="-1.6" width="7.32" height="1.6"/><path d="M${W / 2 - 7.3} 16.5 A9.15 9.15 0 0 0 ${W / 2 + 7.3} 16.5"/></g>`;
  const fora = conta['Fora de área'], bal = conta.Baliza;
  const semZona = lista.length - Object.values(conta).reduce((a, c) => a + c.n, 0);
  const pc = n => ` (${fmtNum(n / total * 100, 0)}%)`;
  const resto = `Baliza: <b>${bal.n}</b>${bal.n ? pc(bal.n) : ''} · Fora de área: <b>${fora.n}</b>${fora.n ? pc(fora.n) : ''}${semZona ? ` · Sem zona registada: <b>${semZona}</b>${pc(semZona)}` : ''}`;
  return `<svg class="mapa-zonas" viewBox="-2 -5 72 37" role="img" aria-label="Zonas onde cai a bola">${zonas}${linhas}<text x="${(c0[0] + c0[1]) / 2 - 6}" y="-2.4" class="lado-poste fim">${espelho ? '2.º' : '1.º'} poste</text><text x="${(c2[0] + c2[1]) / 2 + 6}" y="-2.4" class="lado-poste">${espelho ? '1.º' : '2.º'} poste</text></svg>
    <p class="mapa-fora">${resto}${comNota ? ' · Zona 1 é sempre o primeiro poste (o lado de onde se bate).' : ''}</p>`;
}
// Três mapas lado a lado: todos os esquemas e, depois, só os batidos de cada lado.
function mapasPorLadoEP(lista, rotulo = '') {
  const fig = (titulo, ls, espelho = false) => `<figure class="ep-mapa"><figcaption><b>${titulo}</b><span>${ls.length} ${ls.length === 1 ? 'esquema' : 'esquemas'}</span></figcaption>${ls.length ? mapaZonasEP(ls, false, espelho) : '<div class="ep-mapa-vazio">Sem esquemas deste lado.</div>'}</figure>`;
  return `${rotulo ? `<h3 class="ep-mapas-rot">${rotulo}</h3>` : ''}<div class="ep-mapas">${fig('Gerais', lista)}${fig('Lado esquerdo', lista.filter(x => x.e.corredor === 'Esquerdo'))}${fig('Lado direito', lista.filter(x => x.e.corredor === 'Direito'), true)}</div>`;
}

// ---------- Importação da folha de esquemas táticos ----------
const COLS_FOLHA_EP = {
  equipa: /^(equipa|clube)$/i, adversario: /^advers[aá]rio$/i, treinador: /^treinador$/i, jornada: /^(j|jornada)$/i,
  lado: /^lado$/i, distancia: /^dist[aâ]ncia$/i, tipo: /^(etd|tipo|esquema)$/i, mecanismo: /^mecanismo$/i, bola: /^tipo de bola$/i,

  tdef: /^tipo de defesa$/i, hxh: /^jogadores\s*hxh/i

function detetarFolhaEsquemas(linhas) {
  for (let ih = 0; ih < Math.min(5, linhas.length); ih++) {
    const cab = linhas[ih].map(c => String(c ?? '').trim());
    const idx = Object.fromEntries(Object.entries(COLS_FOLHA_EP).map(([k, re]) => [k, cab.findIndex(c => re.test(c))]));
    if (['equipa', 'adversario', 'tipo', 'contacto', 'zona'].every(k => idx[k] >= 0)) return { formato: 'esquemas', idx, linhas: linhas.slice(ih + 1) };
  }

}
// Equipa da folha → equipa dos jogos do campeonato (correspondências guardadas, nome parecido ou escolhida na pré-visualização).
function sugerirEquipaLiga(nome, equipasLiga, escolhas) {

  const mapa = App.d.mapas.find(m => m.tipo === 'equipa' && norm(m.original) === norm(nome)); if (mapa) return equipasLiga.find(e => norm(e) === norm(mapa.normalizado)) || null;

}
function analisarFolhaEsquemas(tab, partidas, escolhas = {}) {

  const registos = [], semJogo = new Map(), ambiguos = new Map(), divergentes = new Map(), treinadores = new Map(); let vazias = 0;
  tab.linhas.forEach((l, i) => {
    const eq = v(l, 'equipa'), adv = v(l, 'adversario');
    if (!eq && !adv) { vazias++; return; }
    const E = corresp[eq], A = corresp[adv];
    if (!E || !A) { semJogo.set(`${eq} – ${adv}`, (semJogo.get(`${eq} – ${adv}`) || 0) + 1); return; }
    const jornada = parseNum(v(l, 'jornada'));
    let cands = partidas.filter(p => (norm(p.casa) === norm(E) && norm(p.fora) === norm(A)) || (norm(p.casa) === norm(A) && norm(p.fora) === norm(E)));
    if (jornada !== null) {
      const naJornada = cands.filter(p => p.jornada === jornada);
      // Jogo adiado ou jornada registada de outra forma: se o confronto só existe uma vez, usa-o e avisa.
      if (!naJornada.length && cands.length === 1) divergentes.set(`${eq} – ${adv}`, `J${jornada} na folha, ${cands[0].jornada != null ? 'J' + cands[0].jornada : 'sem jornada'} na aplicação`);

    const semente = `${p.id}|${i}`;
    const batida = tipo ? pontoBatidaEP(tipo, ladoEP, dist, semente + 'b') : null, queda = pontoQuedaEP(zona, ladoEP, semente + 'q');
    registos.push({
      partida: p, lado, equipa: p[lado], tipo: 'esquema_tatico', momento: 'Esquema tático', sub_momento: tipo, ep_tipo: tipo || 'Livre', corredor: ladoEP, distancia: dist,
      mecanismo: normEP(EP.mecanismos, v(l, 'mecanismo')), tipo_bola: normEP(EP.bolas, v(l, 'bola')), primeiro_contacto: normEP(EP.contactos, v(l, 'contacto')),
      zona_ep: zona, resultado: normEP(EP.resultados, v(l, 'resultado')), segunda_vaga: normEP(EP.resultados, v(l, 'vaga')),
      jogador: normNome(v(l, 'batedor')), referencia: normNome(v(l, 'referencia')),
      tipo_defesa: /^h\s*x\s*h$/i.test(v(l, 'tdef')) ? 'HxH' : (v(l, 'tdef') || null), hxh: v(l, 'hxh') ? v(l, 'hxh').split(/[;,]/).map(x => normNome(x)).filter(Boolean) : null,
      zona_x: queda?.x ?? null, zona_y: queda?.y ?? null, passe_x: batida?.x ?? null, passe_y: batida?.y ?? null, local_aprox: true, origem: 'folha_ep'
    });
  });
  const avisos = [];
  if (semJogo.size) avisos.push(`${[...semJogo.values()].reduce((a, b) => a + b, 0)} linhas sem jogo do campeonato correspondente (${[...semJogo.keys()].slice(0, 6).join('; ')}${semJogo.size > 6 ? '…' : ''}).`);

async function importarFolhaEP(btn) {

    if (novas.length) await App.db.upsert('mapeamento_nomes', novas.map(n => ({ tipo: 'equipa', original: n, normalizado: A.corresp[n] })), 'tipo,original');
    // Treinadores (só preenche os que faltam).

// ---------- Campeonato › Classificação e rankings ----------
// Só campeonatos: uma competição com poucas equipas nos dados (ex.: um jogo europeu) não é uma liga e fica de fora.
// O campeonato com mais registos vem primeiro.
function competicoesLiga() {
  const m = new Map();
  for (const r of App.d.liga || []) { const o = m.get(r.competicao) || { eq: new Set(), n: 0 }; o.eq.add(norm(r.equipa)); o.n++; m.set(r.competicao, o); }
  return [...m].filter(([, o]) => o.eq.size >= 4).sort((a, b) => b[1].n - a[1].n || a[0].localeCompare(b[0], 'pt')).map(([c]) => c);
}
function classificacaoAte(competicao, ateJornada) {
  const t = {};
  for (const r of App.d.liga || []) {
    if (norm(r.competicao) !== norm(competicao) || r.jornada > ateJornada || !Number.isFinite(r.golos) || !Number.isFinite(r.golos_sofridos)) continue;
    const x = (t[r.equipa] ||= { equipa: r.equipa, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0, forma: [] });
    x.j++; x.gm += r.golos; x.gs += r.golos_sofridos;
    const res = r.golos > r.golos_sofridos ? 'V' : r.golos === r.golos_sofridos ? 'E' : 'D';
    x[res.toLowerCase()]++; x.forma.push([r.jornada, res]);
  }
  return Object.values(t).map(x => ({ ...x, pts: 3 * x.v + x.e, dg: x.gm - x.gs, forma: x.forma.sort((a, b) => a[0] - b[0]).slice(-5).map(f => f[1]) }))
    .sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gm - a.gm || a.equipa.localeCompare(b.equipa, 'pt'));
}
function metricasLigaDisponiveis(liga) { return new Set(METRICAS_EQ.filter(d => liga.some(l => valorEq(d, l) !== null)).map(d => d.id)); }

// ---- Visão geral do pré-jogo ----
// Pares ataque/defesa: o que uma equipa produz e o que a outra concede da mesma coisa.
const PARES_PRE = [['xg', 'xg_sofrido', 'xG'], ['remates', 'remates_sofridos', 'Remates'], ['toques_area', 'toques_area_sof', 'Toques na área'], ['entradas_area', 'entradas_area_sof', 'Entradas na área'], ['op_criadas', 'op_sofridas', 'Oportunidades']];
function rankingLiga(liga, defs) {
  const equipas = [...new Set(liga.map(l => l.equipa))]; const r = {};
  for (const d of defs) {
    const vs = equipas.map(e => ({ e, v: media(liga.filter(l => l.equipa === e).map(l => valorEq(d, l))) })).filter(x => Number.isFinite(x.v));
    if (vs.length < 2) continue;
    const ord = vs.sort((a, b) => (d.melhor === -1 ? a.v - b.v : b.v - a.v));
    r[d.id] = { d, n: ord.length, med: media(ord.map(x => x.v)), pos: e => { const i = ord.findIndex(x => x.e === e); return i < 0 ? null : { p: i + 1, v: ord[i].v }; } };
  }
  return r;
}
function htmlVisaoPre(liga, adv, nossa, defs) {
  const rk = rankingLiga(liga, defs); const ids = Object.keys(rk);
  if (!adv || !ids.length) return '';
  const nomeCurto = e => esc(e);
  // 1. Pontos fortes e fracos (só métricas com melhor/pior).
  const itens = ids.map(id => ({ r: rk[id], x: rk[id].pos(adv) })).filter(o => o.x && o.r.d.melhor);
  const terco = o => Math.ceil(o.r.n / 3);
  const fortes = itens.filter(o => o.x.p <= terco(o)).sort((a, b) => a.x.p - b.x.p).slice(0, 5);
  const fracos = itens.filter(o => o.x.p > o.r.n - terco(o)).sort((a, b) => b.x.p - a.x.p).slice(0, 5);
  const lista = (arr, vazio) => arr.length ? `<ul class="pj-alertas">${arr.map(o => `
    <li><div class="pj-al-nome">${esc(o.r.d.nome)} <span class="pre-area">${esc(o.r.d.area)}</span></div>
      <div class="pj-al-val"><b>${fmtEq(o.r.d, o.x.v)}</b> <span>${o.x.p}.º de ${o.r.n} · média da liga ${fmtEq(o.r.d, o.r.med)}</span></div></li>`).join('')}</ul>` : `<p class="fraco">${vazio}</p>`;
  const estilo = ids.map(id => rk[id]).filter(r => !r.d.melhor && r.pos(adv)).map(r => {
    const x = r.pos(adv); const q = x.p <= Math.ceil(r.n / 3) ? 'alto' : x.p > r.n - Math.ceil(r.n / 3) ? 'baixo' : 'médio';
    return `${esc(r.d.nome)}: <b>${fmtEq(r.d, x.v)}</b> (${q}, ${x.p}.º)`;
  });
  // 2. Confronto: ataque deles vs a nossa defesa e o inverso.
  let confronto = '';
  if (nossa) {
    const linha = (ida, idd, rot, atacante, defensor, nos) => {
      const ra = rk[ida], rd = rk[idd]; if (!ra || !rd) return '';
      const a = ra.pos(atacante), d = rd.pos(defensor); if (!a || !d) return '';
      // Quem leva vantagem: comparação das posições (1.º = melhor ataque / melhor defesa).
      const n = Math.max(ra.n, rd.n), dif = a.p - d.p, lim = Math.max(2, Math.round(n / 3));
      const atacaMelhor = dif <= -lim, defendeMelhor = dif >= lim;
      const bomParaNos = nos === 'ataque' ? atacaMelhor : defendeMelhor, mauParaNos = nos === 'ataque' ? defendeMelhor : atacaMelhor;
      const tag = bomParaNos ? '<span class="pre-tag bom">vantagem</span>' : mauParaNos ? '<span class="pre-tag mau">atenção</span>' : '<span class="pre-tag">equilíbrio</span>';
      const cel = (def, x) => `<td><b>${fmtEq(def, x.v)}</b><span class="pre-pos">${x.p}.º</span></td>`;
      return `<tr><th scope="row">${esc(rot)}</th>${cel(ra.d, a)}${cel(rd.d, d)}<td class="pre-ver">${tag}</td></tr>`;
    };
    const tab = (titulo, cabA, cabD, linhas) => linhas ? `<div class="pre-conf"><h3>${titulo}</h3><table class="pj-tabela pre-conf-tab"><thead><tr><th></th><th>${cabA}</th><th>${cabD}</th><th class="pre-ver"></th></tr></thead><tbody>${linhas}</tbody></table></div>` : '';
    const ataqueDeles = PARES_PRE.map(([a, d, r]) => linha(a, d, r, adv, nossa, 'defesa')).join('');
    const nossoAtaque = PARES_PRE.map(([a, d, r]) => linha(a, d, r, nossa, adv, 'ataque')).join('');
    const t1 = tab('O ataque deles contra a nossa defesa', 'Eles criam', 'Nós concedemos', ataqueDeles);
    const t2 = tab('O nosso ataque contra a defesa deles', 'Nós criamos', 'Eles concedem', nossoAtaque);
    if (t1 || t2) confronto = `<h3 class="pre-sub">Confronto direto das médias</h3><p class="nota">Médias por jogo e posição na liga (1.º = melhor ataque ou melhor defesa). Vantagem ou atenção quando a diferença de posições é de um terço da liga ou mais.</p><div class="pj-duas pre-confs">${t1}${t2}</div>`;
  }
  // 3. Como chega ao jogo: últimos 5 jogos vs o resto da época.
  const ls = liga.filter(l => l.equipa === adv).sort((a, b) => a.jornada - b.jornada);
  let forma = '';
  if (ls.length >= 8) {
    const ult = ls.slice(-5), ant = ls.slice(0, -5);
    const fr = ids.map(id => rk[id].d).filter(d => d.melhor).map(d => {
      const vu = media(ult.map(l => valorEq(d, l))), va = media(ant.map(l => valorEq(d, l))), sd = desvio(ls.map(l => valorEq(d, l)));
      if (!Number.isFinite(vu) || !Number.isFinite(va) || !sd) return null;
      return { d, vu, va, z: (vu - va) / sd * d.melhor };
    }).filter(x => x && Math.abs(x.z) >= LIMIAR_TENDENCIA).sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
    const sobe = fr.filter(x => x.z > 0).slice(0, 3), desce = fr.filter(x => x.z < 0).slice(0, 3);
    const frase = (x, t) => `<li class="${t}"><span class="pj-icone" aria-hidden="true">${t === 'bom' ? '▲' : '▼'}</span><span><b>${esc(x.d.nome)}</b>: ${fmtEq(x.d, x.vu)} nos últimos 5 jogos, contra ${fmtEq(x.d, x.va)} antes.</span></li>`;
    forma = `<h3 class="pre-sub">Como chega ao jogo</h3><p class="nota">Últimos 5 jogos (J${ult[0].jornada}–J${ult.at(-1).jornada}) comparados com as ${ant.length} jornadas anteriores. ▲ melhorou · ▼ piorou.</p>` +
      (sobe.length || desce.length ? `<ul class="pj-conclusoes">${sobe.map(x => frase(x, 'bom')).join('')}${desce.map(x => frase(x, 'mau')).join('')}</ul>` : '<p class="fraco">Sem mudanças claras em relação ao resto da época.</p>');
  }
  return `

// Junta a cada onze a linha do jogo correspondente (pelo adversário e pela jornada).
async function importarEstatOnzes(eq, f) {
  let linhas;
  try { linhas = await lerFicheiroTabela(f); } catch (e) { toast('Não foi possível ler o ficheiro.', 'erro'); return; }
  const cab = (linhas[0] || []).map(c => String(c ?? '').replace(/\s+/g, ' ').trim());
  const col = re => cab.findIndex(c => re.test(c));
  const iEq = col(/^(equipa|team)$/i), iAdv = col(/^(advers[aá]rio|opponent)$/i), iJ = col(/^(j|round|matchday)$/i), iComp = col(/^(competi[cç][aã]o|competition)$/i);
  if (iEq < 0 || iAdv < 0) { toast('O ficheiro precisa das colunas Equipa e Adversário (uma linha por jogo).', 'erro'); return; }
  const texto = new Set([iEq, iAdv, iJ, iComp, col(/^jornada$/i), col(/^local$/i), col(/^resultados?$/i)]);
  const onzes = onzesAdv(eq); const feitos = new Set(); const semOnze = [];
  for (const l of linhas.slice(1)) {
    const a = String(l[iEq] ?? '').trim(), b = String(l[iAdv] ?? '').trim();
    const adv = mesmaEq(a, eq) ? b : mesmaEq(b, eq) ? a : null; if (!adv) continue;
    const j = iJ >= 0 ? parseNum(l[iJ]) : null;
    let cand = onzes.filter(o => mesmaEq(o.adversario, adv) && !feitos.has(o.id));
    if (cand.length > 1 && j != null) cand = cand.filter(o => o.jornada === j);
    if (cand.length > 1 && iComp >= 0) cand = cand.filter(o => norm(o.competicao || o.rotulo || '').includes(norm(l[iComp]).split(' ')[0]));
    const o = cand[0]; if (!o) { semOnze.push(adv); continue; }
    const metricas = {};
    cab.forEach((c, i) => { if (!c || texto.has(i)) return; const v = parseNum(l[i]); if (v !== null) metricas[c] = v; });
    try { await App.db.atualizar('onzes', { id: o.id }, { estatisticas: { fonte: 'wyscout', ficheiro: f.name, metricas } }); feitos.add(o.id); }
    catch (e) { toast(traduzErro(e), 'erro'); return; }
  }
  toast(`Estatísticas juntas a ${feitos.size} ${feitos.size === 1 ? 'onze' : 'onzes'}.${semOnze.length ? ` Sem onze registado: ${semOnze.join(', ')}.` : ''}`, feitos.size ? 'ok' : 'erro');
  if (feitos.size) await recarregar();
}

// ---- PDF 16:9: um diapositivo por secção (forma, plantel e cada um dos 3 últimos onzes) ----
// Cada secção é desenhada como no ecrã e ajustada ao diapositivo (escolhe a largura que deixa o conteúdo maior).
async function exportarObservacao16x9(eq, progresso) {
  const secoes = $$('#vista .obs-secao').filter(s => !s.classList.contains('so-ecra'));
  const caixa = document.createElement('div'); caixa.className = 'sl-render obs-render'; caixa.setAttribute('aria-hidden', 'true');
  document.body.appendChild(caixa);
  try {
    for (const s of secoes) {
      const sl = document.createElement('div');
      const copia = s.cloneNode(true);
      copia.querySelectorAll('button:not(.cj-bot), .so-ecra, .acoes-esq, input, [data-editar-onze]').forEach(x => x.remove());
      if (s.id === 'obs-forma') { sl.className = 'sl obs-sl-forma'; sl.appendChild(copia); caixa.appendChild(sl); continue; }
      const plantel = s.id === 'obs-plantel';
      sl.className = `sl obs-sl${plantel ? ' obs-sl-plantel' : ''}`;
      sl.innerHTML = `<div class="obs-sl-pos"><div class="obs-sl-in"></div></div><p class="sl-rodape">Departamento de Análise</p>`;
      const dentro = sl.querySelector('.obs-sl-in'); dentro.appendChild(copia); caixa.appendChild(sl);
      const pos = sl.querySelector('.obs-sl-pos');
      // Escala com transform (o Safari trata mal o "zoom" na captura: textos partidos e campos deformados).
      const escalar = z => { dentro.style.transformOrigin = '0 0'; dentro.style.transform = `scale(${z})`; };
      if (plantel) {
        // Coluna do símbolo à esquerda e campo com proporções de campo; o maior zoom em que os jogadores cabem.
        const AH = 900; pos.style.left = '130px'; pos.style.top = '60px';
        let z = 1.6;
        for (; z > 0.7; z -= 0.05) {
          const h = AH / z, wCampo = h * 1.12;
          dentro.style.width = `${300 + 40 + wCampo}px`; dentro.style.height = `${h}px`;
          const c = dentro.querySelector('.pl-campo');
          if (!c || (c.scrollHeight <= c.clientHeight + 1 && dentro.scrollHeight <= dentro.clientHeight + 1)) break;
        }
        escalar(z);
        continue;
      }
      // Onze: experimenta várias larguras e fica com a que dá o maior tamanho.
      const AW = 1620, AH = 880; let melhor = { z: 0, w: AW };
      for (const w of [1100, 1200, 1300, 1400, 1500, 1600]) {
        dentro.style.width = `${w}px`; ajustarEstatisticasOnzes(dentro);
        const h = dentro.scrollHeight; const z = Math.min(AW / w, AH / h);
        if (z > melhor.z) melhor = { z, w };
      }
      dentro.style.width = `${melhor.w}px`; ajustarEstatisticasOnzes(dentro); escalar(melhor.z);
      pos.style.left = `${(1920 - melhor.w * melhor.z) / 2}px`; pos.style.top = '60px';
    }
    const html = caixa.innerHTML; caixa.remove();
    await gerarPdfDiapositivos(html, `Observação ${eq} ${hojeIso()}`, progresso, 'obs-render');
  } finally { caixa.remove(); }
}

// As estatísticas do onze têm de caber na altura do campo: reduz a letra e o espaço entre linhas até caberem.
function ajustarEstatisticasOnzes(raiz) {
  for (const est of raiz.querySelectorAll('.on-dir .on-est')) {
    const dir = est.closest('.on-dir'); let k = 1; est.style.setProperty('--k', k);
    if (getComputedStyle(dir).minHeight === '0px') continue; // ecrã estreito: uma coluna, sem limite de altura
    while (k > 0.6 && (dir.scrollHeight > dir.clientHeight + 1 || est.scrollHeight > est.clientHeight + 1)) { k = Math.round((k - 0.04) * 100) / 100; est.style.setProperty('--k', k); }
  }
}

    posicao: ex?.posicao || posicaoTm(j.position) || null,
    data_nascimento: /^\d{4}-\d{2}-\d{2}$/.test(j.birthDate || '') ? j.birthDate : ex?.data_nascimento ?? null,
    altura: j.heightCm >= 120 && j.heightCm <= 230 ? j.heightCm : ex?.altura ?? null,
    pe: peTm(j.foot) ?? ex?.pe ?? null, numero: num >= 0 && num <= 99 ? num : ex?.numero ?? null, nacionalidade: j.nationality || ex?.nacionalidade || null,

  const novo = await App.db.inserir('jogadores_adversarios', dados); (App.d.plantelAdv ||= []).push(novo); return 'novo';

// ---- Editor de onze ----
// ---- Ficha de jogo do Transfermarkt -> onze ----
// Lê a página (HTML) da ficha de jogo: sistema, titulares com a posição no campo, banco,
// substituições e cartões de cada equipa. Não grava nada: devolve os dados para o diálogo.
function lerFichaTm(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const txt = el => (el?.textContent || '').replace(/\s+/g, ' ').trim();
  const idDe = href => (String(href || '').match(/\/spieler\/(\d+)/) || [])[1] || null;
  const slugDe = href => (String(href || '').match(/^\/([^/]+)\//) || [])[1] || '';
  const minutoDe = el => {
    const m = String(el?.getAttribute('style') || '').match(/background-position:\s*-?(\d+)px\s+-?(\d+)px/);
    if (!m) { const n = parseInt(txt(el), 10); return Number.isFinite(n) ? n : null; }
    return Math.floor(Number(m[2]) / 36) * 10 + Math.floor(Number(m[1]) / 36) + 1;
  };
  // Nomes completos (o campo só mostra o apelido): banco e acontecimentos têm o nome inteiro.
  const nomes = {};
  for (const a of doc.querySelectorAll('a[href*="/spieler/"]')) { const id = idDe(a.getAttribute('href')); const t = a.getAttribute('title') || ''; if (id && t && !nomes[id]) nomes[id] = t.trim(); }
  const equipas = [...doc.querySelectorAll('.formation-subtitle')].map(sub => {
    const box = sub.closest('.large-6') || sub.parentElement.parentElement;
    const link = box.querySelector('.sb-vereinslink') || box.querySelector('a[href*="/verein/"]');
    const sis = txt(sub).replace(/^[^:]*:\s*/, '');
    const titulares = [...box.querySelectorAll('.formation-player-container')].map(c => {
      const a = c.querySelector('.formation-number-name a') || c.querySelector('a[href*="/spieler/"]');
      const st = c.getAttribute('style') || ''; const pc = k => { const m = st.match(new RegExp(k + ':\\s*([\\d.]+)%')); return m ? Number(m[1]) : null; };
      return { id: idDe(a?.getAttribute('href')), slug: slugDe(a?.getAttribute('href')), curto: txt(a), numero: parseInt(txt(c.querySelector('.tm-shirt-number')), 10) || null, top: pc('top'), left: pc('left') };
    }).filter(t => t.curto);
    const banco = [...box.querySelectorAll('table.ersatzbank tr')].map(tr => {
      const a = tr.querySelector('a[href*="/spieler/"]'); if (!a) return null;
      const tds = tr.querySelectorAll('td');
      return { id: idDe(a.getAttribute('href')), slug: slugDe(a.getAttribute('href')), curto: txt(a), numero: parseInt(txt(tds[0]), 10) || null, pos: txt(tds[2]) };
    }).filter(Boolean);
    return { nome: txt(link), sistemaTm: sis, titulares, banco };
  });
  // Acontecimentos: substituições e cartões (os golos não entram no onze).
  const subs = [], cartoes = [];
  for (const li of doc.querySelectorAll('.sb-ereignisse li')) {
    const min = minutoDe(li.querySelector('.sb-sprite-uhr-klein'));
    const ein = li.querySelector('.sb-aktion-wechsel-ein a[href*="/spieler/"]'), aus = li.querySelector('.sb-aktion-wechsel-aus a[href*="/spieler/"]');
    if (ein && aus) { subs.push({ entra: idDe(ein.getAttribute('href')), sai: idDe(aus.getAttribute('href')), min }); continue; }
    const marca = li.querySelector('.sb-aktion-spielstand .sb-sprite');
    const a = li.querySelector('.sb-aktion-aktion a[href*="/spieler/"]');
    if (marca && a) { const c = marca.className; const tipo = /sb-gelbrot|sb-rot/.test(c) ? 'vermelho' : /sb-gelb/.test(c) ? 'amarelo' : null; if (tipo) cartoes.push({ id: idDe(a.getAttribute('href')), tipo, min }); }
  }
  // Jogo: jornada, data e resultado.
  const dados = txt(doc.querySelector('.sb-spieldaten'));
  const jornada = parseInt((dados.match(/(\d+)\.\s*jornada/i) || [])[1], 10);
  const dm = dados.match(/(\d{2})\/(\d{2})\/(\d{2,4})/);
  const data = dm ? `${dm[3].length === 2 ? '20' + dm[3] : dm[3]}-${dm[2]}-${dm[1]}` : null;
  const res = (txt(doc.querySelector('.sb-endstand')).match(/(\d+)\s*:\s*(\d+)/) || []).slice(1).map(Number);
  const partesTitulo = (doc.title || '').split(/\s+-\s+/);
  const competicao = partesTitulo.length >= 3 ? partesTitulo[2].trim() : '';
  return { equipas, subs, cartoes, nomes, jornada: Number.isFinite(jornada) ? jornada : null, data, golos: res.length === 2 ? res : null, competicao };
}

// Converte "4-2-3-1" do Transfermarkt nos sistemas da app.
function sistemaDoTm(s) {
  const t = norm(s); const n = (String(s).match(/\d(?:\s*-\s*\d)+/) || [''])[0].replace(/\s+/g, '');
  if (/losango|diamante|diamond/.test(t) && n === '4-4-2') return '1-4-4-2 losango';
  const k = '1-' + n; if (FORMACOES[k]) return k;
  const cands = Object.keys(FORMACOES).filter(f => f.startsWith(k.slice(0, 5)));
  return cands[0] || '1-4-3-3';
}

// Põe cada titular no lugar do sistema mais próximo da posição no campo do Transfermarkt.
function onzeDaFichaTm(f, iEq, eq) {
  const E = f.equipas[iEq]; const sistema = sistemaDoTm(E.sistemaTm); const slots = FORMACOES[sistema];
  const ps = plantelAdv(eq);
  const nomeDe = j => {
    const p = ps.find(p => p.tm_id && j.id && String(p.tm_id) === String(j.id)) || ps.find(p => norm(p.nome).replace(/\s+/g, '-') === norm(j.slug).replace(/\s+/g, '-')) || ps.find(p => norm(p.nome) === norm(f.nomes[j.id] || j.curto));
    return p?.nome || f.nomes[j.id] || j.curto;
  };
  const tops = E.titulares.map(t => t.top).filter(v => v != null); const tMin = Math.min(...tops), tMax = Math.max(...tops);
  const pos = E.titulares.map(t => ({ t, x: (t.left ?? 40) + 10, y: tMax > tMin ? 13 + (t.top - tMin) * (92 - 13) / (tMax - tMin) : 50 }));
  const pares = [];
  pos.forEach((p, i) => slots.forEach((s, k) => pares.push({ i, k, d: (p.x - s.x) ** 2 + 1.5 * (p.y - s.y) ** 2 })));
  pares.sort((a, b) => a.d - b.d);
  const usadoJ = new Set(), usadoS = new Set(), lugar = {};
  for (const q of pares) if (!usadoJ.has(q.i) && !usadoS.has(q.k)) { usadoJ.add(q.i); usadoS.add(q.k); lugar[q.i] = q.k; }
  const ids = new Set([...E.titulares, ...E.banco].map(j => j.id));
  const cart = id => { const c = f.cartoes.filter(c => c.id === id); return { amarelo: c.some(c => c.tipo === 'amarelo'), vermelho: c.some(c => c.tipo === 'vermelho') }; };
  const saiu = id => f.subs.find(s => s.sai === id)?.min ?? null;
  const titulares = pos.map((p, i) => ({ slot: lugar[i], nome: nomeDe(p.t), saiu: saiu(p.t.id), ...cart(p.t.id) })).filter(t => t.slot != null);
  const porId = Object.fromEntries([...E.titulares, ...E.banco].map(j => [j.id, j]));
  const banco = E.banco.map(b => { const s = f.subs.find(s => s.entra === b.id && ids.has(s.entra)); return { nome: nomeDe(b), entrou: s?.min ?? null, substituiu: s && porId[s.sai] ? nomeDe(porId[s.sai]) : null, amarelo: cart(b.id).amarelo }; });
  const outro = f.equipas[1 - iEq]; const casa = iEq === 0;
  const gp = f.golos ? f.golos[casa ? 0 : 1] : null, gc = f.golos ? f.golos[casa ? 1 : 0] : null;
  return { sistema, titulares, banco, adversario: outro?.nome || null, local: casa ? 'casa' : 'fora', golos_pro: gp, golos_contra: gc, data: f.data, jornada: f.jornada, competicao: f.competicao };
}

function dialogoOnze(eq, o) {
  const ps = plantelAdv(eq);
  const jogosLiga = (App.d.liga || []).filter(l => mesmaEq(l.equipa, eq)).sort((a, b) => b.jornada - a.jornada);

function proporTitulares(eq, sistema, ult) {

  return slots.map((s, i) => { const k = livres.findIndex(p => PAPEL_DA_POS[p.posicao] === s.p); if (k < 0) return null; return { slot: i, nome: livres.splice(k, 1)[0].nome }; }).filter(Boolean);
}

const scoutJogadores = () => App.d.scout || [];
const SEM_CAMPEONATO = 'Sem campeonato';
const registoEquipaScout = eq => (App.d.scoutEq || []).find(r => r.equipa === eq) || null;
function scoutEquipas() {
  const m = new Map();

}

  return scoutEquipas().some(e => !e.campeonato) ? [...c, SEM_CAMPEONATO] : c;

// Cria ou atualiza o registo da equipa (campeonato e link do Transfermarkt).
async function gravarEquipaScout(equipa, dados) {
  if (App.semScoutEquipas) return;
  const ex = registoEquipaScout(equipa);
  const limpo = Object.fromEntries(Object.entries(dados).filter(([, v]) => v !== undefined));
  if (ex) {
    if (Object.entries(limpo).every(([k, v]) => (ex[k] ?? null) === v)) return;
    await App.db.atualizar('scout_equipas', { id: ex.id }, limpo); Object.assign(ex, limpo);
  } else { const n = await App.db.inserir('scout_equipas', { equipa, ...limpo }); (App.d.scoutEq ||= []).push(n); }
}
// Avaliação em uso: a mais recente do jogador.
function avaliacaoScout(id) {

}
const mediaScout = a => { const v = a ? SC_PARAMS.map(p => a[p.k]).filter(Number.isFinite) : []; return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
// Valor de mercado: o Wyscout dá um número (1500000), o Transfermarkt um texto ("1,50 M €").
function valorScout(v) {
  if (v == null || v === '') return null;
  const n = typeof v === 'number' ? v : (/^\d+(\.\d+)?$/.test(String(v).trim()) ? Number(v) : null);
  if (n === null) return String(v);
  if (!n) return '–';
  return n >= 1e6 ? `${fmtNum(n / 1e6, n % 1e6 ? 1 : 0)} M€` : `${fmtNum(n / 1e3, 0)} mil €`;
}
const contratoScout = c => (c && /^\d{4}-\d{2}-\d{2}$/.test(c) ? fmtData(c) : c || null);

  let corpo;
  if (!todasEqs.length) {
    corpo = `<div class="vazio"><p>Ainda não há equipas no Scout.</p><p>${tm ? 'Adicione um campeonato com o link do Transfermarkt (entram logo todas as equipas), importe o plantel de uma equipa, ou importe' : 'Importe'} uma exportação de jogadores do Wyscout (com a coluna da equipa, ou escolhendo a equipa ao importar).</p></div>`;
  } else if (!S.equipa && !S.busca && !S.estado && !S.pos) {
    const grupos = (S.campeonato ? [S.campeonato] : camps).map(c => ({ c, l: eqs.filter(e => campeonatoDe(e) === c) })).filter(g => g.l.length);
    corpo = grupos.map(({ c, l }) => {
      const porImportar = l.filter(e => !e.n && e.tm_url).length;
      return `<section class="bloco"><div class="sc-titulo"><h2>${esc(c)}</h2><span class="nota">${l.length} ${l.length === 1 ? 'equipa' : 'equipas'} · ${l.reduce((s, e) => s + e.n, 0)} jogadores</span>
        <span class="sc-titulo-acoes">${tm && l.some(e => e.tm_url) ? `<button class="btn-link" data-sc-planteis="${esc(c)}">${porImportar ? `Importar plantéis (${porImportar} por importar)` : 'Atualizar plantéis'}</button>` : ''}</span></div>
        <div class="sc-equipas">${l.map(e => `
        <button type="button" class="sc-eq" data-eq="${esc(e.equipa)}">${simboloEquipa(e.equipa, 'sc-simb')}<span><b>${esc(e.equipa)}</b><small>${e.n ? `${e.n} ${e.n === 1 ? 'jogador' : 'jogadores'} · ${e.av} ${e.av === 1 ? 'avaliado' : 'avaliados'}` : 'Plantel por importar'}</small></span></button>`).join('')}</div></section>`;
    }).join('') + htmlMelhoresScout();
  } else corpo = htmlTabelaScout();
  v.innerHTML = `
    <div class="cabecalho-vista"><div><h1>Scout</h1><p class="nota">Só visível para o departamento. Carregue num jogador para o avaliar.</p></div></div>
    <div class="filtros" role="group" aria-label="Filtros">
      ${camps.length ? `<label>Campeonato<select id="sc-camp"><option value="">Todos</option>${camps.map(c => `<option ${c === S.campeonato ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>` : ''}
      <label>Equipa<select id="sc-eq-sel"><option value="">Todas</option>${eqs.map(e => `<option ${e.equipa === S.equipa ? 'selected' : ''}>${esc(e.equipa)}</option>`).join('')}</select></label>
      <label>Posição<select id="sc-pos"><option value="">Todas</option>${SC_POSICOES.map(p => `<option ${p === S.pos ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
      <label>Avaliação<select id="sc-estado"><option value="">Todos</option><option value="sim" ${S.estado === 'sim' ? 'selected' : ''}>Avaliados</option><option value="nao" ${S.estado === 'nao' ? 'selected' : ''}>Por avaliar</option></select></label>
      <label>Procurar<input id="sc-busca" type="search" value="${esc(S.busca)}" placeholder="Nome do jogador" autocomplete="off"></label>
    </div>
    ${botoes}
    <div class="sc-corpo">${corpo}</div>`;
  const redesenhar = () => desenharScout();
  $('#sc-camp')?.addEventListener('change', e => { S.campeonato = e.target.value; S.equipa = ''; redesenhar(); });
  $('#sc-eq-sel').addEventListener('change', e => { S.equipa = e.target.value; redesenhar(); });
  $('#sc-liga')?.addEventListener('click', () => dialogoScoutLiga());
  $$('[data-sc-planteis]').forEach(b => b.addEventListener('click', () => dialogoPlanteisScout(scoutEquipas().filter(e => campeonatoDe(e) === b.dataset.scPlanteis && e.tm_url))));
  $('#sc-eq-tm')?.addEventListener('click', () => dialogoPlanteisScout(scoutEquipas().filter(e => e.equipa === S.equipa)));
  $('#sc-eq-camp')?.addEventListener('click', () => dialogoCampeonatoEquipa(S.equipa));
  $('#sc-pos').addEventListener('change', e => { S.pos = e.target.value; redesenhar(); });
  $('#sc-estado').addEventListener('change', e => { S.estado = e.target.value; redesenhar(); });
  let tBusca; $('#sc-busca').addEventListener('input', e => { clearTimeout(tBusca); tBusca = setTimeout(() => { S.busca = e.target.value; redesenhar(); const i = $('#sc-busca'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); });
  $$('.sc-eq').forEach(b => b.addEventListener('click', () => { S.equipa = b.dataset.eq; redesenhar(); }));
  $$('[data-sc-jog]').forEach(b => b.addEventListener('click', () => dialogoScoutJogador(scoutJogadores().find(p => p.id === b.dataset.scJog))));
  $$('[data-sc-ordem]').forEach(b => b.addEventListener('click', () => { const o = b.dataset.scOrdem; S.ordem = S.ordem === o ? `-${o}` : o; redesenhar(); }));
  $('#sc-tm')?.addEventListener('click', () => dialogoScoutTm(false));
  $('#sc-tm-jog')?.addEventListener('click', () => dialogoScoutTm(true));
  $('#sc-wy').addEventListener('click', () => dialogoScoutWyscout());
  $('#sc-novo').addEventListener('click', () => dialogoScoutJogador(null));
  $('#sc-apagar-eq')?.addEventListener('click', async () => {
    const ps = scoutJogadores().filter(p => p.equipa === S.equipa);
    if (!await confirmar(ps.length ? `Apagar ${S.equipa} do Scout? Saem ${ps.length} jogadores e as avaliações deles.` : `Apagar ${S.equipa} do Scout?`)) return;
    try {
      for (const p of ps) await App.db.apagar('scout_jogadores', { id: p.id });
      const reg = registoEquipaScout(S.equipa); if (reg) await App.db.apagar('scout_equipas', { id: reg.id });
      S.equipa = ''; await recarregar(); toast('Equipa apagada do Scout.');
    } catch (err) { toast(traduzErro(err), 'erro'); }
  });
  $('#sc-voltar')?.addEventListener('click', () => { Object.assign(S, { equipa: '', pos: '', estado: '', busca: '' }); redesenhar(); });
}

// Os jogadores mais bem avaliados (em todas as equipas), na página inicial do Scout.
function htmlMelhoresScout() {
  const l = scoutJogadores().map(p => ({ p, a: avaliacaoScout(p.id) })).filter(x => mediaScout(x.a) !== null)
    .sort((x, y) => mediaScout(y.a) - mediaScout(x.a) || (y.a.potencial || 0) - (x.a.potencial || 0)).slice(0, 10);
  if (!l.length) return '';
  return `<section class="bloco"><h2>Mais bem avaliados</h2><div class="tabela-env"><table class="tabela compacta sc-tabela">
    <thead><tr><th>Jogador</th><th>Equipa</th><th>Posição</th><th class="num">Idade</th>${SC_PARAMS.map(p => `<th>${p.nome}</th>`).join('')}</tr></thead>
    <tbody>${l.map(({ p, a }) => `<tr class="clicavel" data-sc-jog="${esc(p.id)}" tabindex="0"><td><span class="sc-jog">${avatarJogador(p, 'avatar-pequeno')}<b>${esc(p.nome)}</b></span></td><td>${esc(p.equipa)}</td><td>${esc(p.posicao || '–')}</td><td class="num">${idadeScout(p) ?? '–'}</td>${SC_PARAMS.map(x => `<td>${notaScoutHtml(a[x.k], x)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></section>`;
}

function htmlTabelaScout() {
  const S = App.sc;
  const campDe = new Map(scoutEquipas().map(e => [e.equipa, campeonatoDe(e)]));
  let ps = scoutJogadores().filter(p => (!S.equipa || p.equipa === S.equipa) && (S.equipa || !S.campeonato || campDe.get(p.equipa) === S.campeonato) && (!S.pos || p.posicao === S.pos));
  if (S.estado) ps = ps.filter(p => !!avaliacaoScout(p.id) === (S.estado === 'sim'));
  if (S.busca.trim()) { const b = norm(S.busca); ps = ps.filter(p => norm(p.nome).includes(b) || norm(p.nome_wyscout || '').includes(b)); }
  const cols = SC_COLUNAS_WY.filter(c => ps.some(p => valorWy(p, c) !== null));
  const chave = {
    nome: p => p.nome, posicao: p => SC_POSICOES.indexOf(p.posicao) < 0 ? 99 : SC_POSICOES.indexOf(p.posicao), idade: p => idadeScout(p) ?? 99,
    media: p => -(mediaScout(avaliacaoScout(p.id)) ?? -1),
    ...Object.fromEntries(SC_PARAMS.map(x => [x.k, p => -(avaliacaoScout(p.id)?.[x.k] ?? -1)])),
    ...Object.fromEntries(cols.map(c => [c.id, p => -(valorWy(p, c) ?? -1)]))
  };
  const o = S.ordem.replace(/^-/, ''), inv = S.ordem.startsWith('-') ? -1 : 1, f = chave[o] || chave.nome;
  ps.sort((a, b) => { const x = f(a), y = f(b); return inv * (typeof x === 'string' ? x.localeCompare(y, 'pt') : x - y) || a.nome.localeCompare(b.nome, 'pt'); });
  const th = (k, rot, cls = '', titulo = '') => `<th class="${cls}"><button type="button" class="sc-ord ${o === k ? 'ativo' : ''}" data-sc-ordem="${k}" ${titulo ? `title="${esc(titulo)}"` : ''}>${rot}${o === k ? (inv > 0 ? ' ↓' : ' ↑') : ''}</button></th>`;
  const eqInfo = S.equipa ? scoutEquipas().find(e => e.equipa === S.equipa) : null;
  const tm = tmDisponivel();
  const titulo = S.equipa ? `<div class="sc-titulo">${simboloEquipa(S.equipa, 'sc-simb')}<h2>${esc(S.equipa)}</h2><span class="nota">${esc(campeonatoDe(eqInfo))} · ${ps.length} ${ps.length === 1 ? 'jogador' : 'jogadores'}</span>
    ${App.semScoutEquipas ? '' : '<button class="btn-link" id="sc-eq-camp">Alterar campeonato</button>'}${tm && eqInfo?.tm_url ? `<button class="btn-link" id="sc-eq-tm">${eqInfo.n ? 'Atualizar plantel' : 'Importar plantel'} do Transfermarkt</button>` : ''}` : `<div class="sc-titulo"><h2>Jogadores</h2><span class="nota">${ps.length}</span>`;
  const info = S.equipa ? scoutJogadores().find(p => p.equipa === S.equipa && p.wyscout_info)?.wyscout_info : null;
  return `<section class="bloco">
    ${titulo}<span class="sc-titulo-acoes"><button class="btn-link" id="sc-voltar">← Todas as equipas</button>${S.equipa && podeApagar() ? '<button class="btn-link perigo" id="sc-apagar-eq">Apagar equipa</button>' : ''}</span></div>
    ${info ? `<p class="nota">Estatísticas do Wyscout: ${esc([info.ficheiro, info.data ? `importado a ${fmtData(info.data)}` : null].filter(Boolean).join(' · '))}</p>` : ''}
    ${ps.length ? `<div class="tabela-env"><table class="tabela compacta sc-tabela">
      <thead><tr>${th('nome', 'Jogador')}${S.equipa ? '' : '<th>Equipa</th>'}${th('posicao', 'Posição')}${th('idade', 'Idade', 'num')}<th>Valor</th><th>Contrato</th>
        ${cols.map(c => th(c.id, c.rot, 'num', c.titulo)).join('')}${SC_PARAMS.map(x => th(x.k, x.curto, '', x.nome)).join('')}<th></th></tr></thead>
      <tbody>${ps.map(p => { const a = avaliacaoScout(p.id); return `<tr class="clicavel" data-sc-jog="${esc(p.id)}" tabindex="0">
        <td><span class="sc-jog">${avatarJogador(p, 'avatar-pequeno')}<b>${esc(p.nome)}</b></span></td>${S.equipa ? '' : `<td>${esc(p.equipa)}</td>`}
        <td class="sc-nw">${esc(p.posicao || '–')}</td><td class="num">${idadeScout(p) ?? '–'}</td>
        <td class="sc-nw">${esc(valorScout(p.valor_mercado) || '–')}</td><td class="sc-nw">${esc(contratoScout(p.contrato) || '–')}</td>
        ${cols.map(c => { const x = valorWy(p, c); return `<td class="num">${x === null ? '–' : fmtNum(x, /x/.test(c.id) ? 2 : 0)}</td>`; }).join('')}
        ${SC_PARAMS.map(x => `<td>${notaScoutHtml(a?.[x.k], x)}</td>`).join('')}
        <td>${a?.comentario ? `<span class="sc-com" title="${esc(a.comentario)}">💬</span>` : ''}</td></tr>`; }).join('')}</tbody>
    </table></div>` : `<p class="fraco">${S.equipa && !eqInfo?.n ? `O plantel ainda não foi importado.${tm && eqInfo?.tm_url ? ' Use "Importar plantel do Transfermarkt" acima.' : ''}` : 'Nenhum jogador com estes filtros.'}</p>`}
  </section>`;
}

// ---- Ficha do jogador e avaliação ----
function dialogoScoutJogador(p) {
  const novo = !p; p ||= { equipa: App.sc.equipa || '', nome: '' };
  const a = novo ? null : avaliacaoScout(p.id);
  const notas = Object.fromEntries(SC_PARAMS.map(x => [x.k, a?.[x.k] ?? null]));
  const eqs = scoutEquipas().map(e => e.equipa);
  const ida = idadeScout(p);
  const W = p.wyscout || {};
  const chavesW = Object.keys(W).filter(k => Number.isFinite(W[k]));
  const d = document.createElement('dialog'); d.className = 'dialogo dialogo-largo sc-dialogo';
  d.innerHTML = `<form method="dialog" class="pilha" id="sc-form">
    <div class="bloco-cab"><div class="sc-ficha-cab">${novo ? '' : avatarJogador(p, 'avatar-grande')}<div>
      <h2>${novo ? 'Novo jogador' : esc(p.nome)}</h2>
      ${novo ? '' : `<p class="cartao-meta">${esc([p.posicao, ida !== null ? `${ida} anos` : null, p.altura ? `${p.altura} cm` : null, p.pe ? `pé ${p.pe.toLowerCase()}` : null, p.nacionalidade].filter(Boolean).join(' · '))}</p>
      <p class="cartao-meta">${simboloEquipa(p.equipa, 'simb')} ${esc(p.equipa)}${p.valor_mercado ? ` · valor ${esc(valorScout(p.valor_mercado))}` : ''}${p.contrato ? ` · contrato até ${esc(contratoScout(p.contrato))}` : ''}${p.tm_url ? ` · <a href="${esc(p.tm_url)}" target="_blank" rel="noopener">Transfermarkt</a>` : ''}</p>`}
    </div></div><button type="button" class="btn" id="sc-fechar">Fechar</button></div>
    ${novo ? '' : `<fieldset class="sc-aval"><legend>Avaliação${a?.updated_at ? ` <span class="fraco">(última alteração a ${fmtData(String(a.updated_at).slice(0, 10))})</span>` : ''}</legend>
      ${SC_PARAMS.map(x => `<div class="sc-param"><span class="sc-param-nome">${x.nome}</span><div class="sc-botoes" role="radiogroup" aria-label="${x.nome}">
        ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="sc-bot ${notas[x.k] === n ? 'ativo' : ''}" data-param="${x.k}" data-n="${n}" role="radio" aria-checked="${notas[x.k] === n}" title="${esc(x.niveis[n - 1])}">${n}</button>`).join('')}
        </div><span class="sc-nivel" id="sc-nivel-${x.k}">${notas[x.k] ? esc(x.niveis[notas[x.k] - 1]) : '<span class="fraco">sem nota</span>'}</span></div>`).join('')}
      <label>Comentário<textarea name="comentario" rows="4" placeholder="Pontos fortes, pontos a melhorar, contexto da observação…">${esc(a?.comentario || '')}</textarea></label>
    </fieldset>`}
    <details class="mais-detalhes" ${novo ? 'open' : ''}><summary>Dados do jogador</summary>
      <div class="grelha-form">
        <label>Nome<input name="nome" required value="${esc(p.nome || '')}" autocomplete="off"></label>
        <label>Equipa<input name="equipa" required list="sc-eqs" value="${esc(p.equipa || '')}" autocomplete="off"><datalist id="sc-eqs">${eqs.map(e => `<option value="${esc(e)}">`).join('')}</datalist></label>
        <label>Posição<select name="posicao"><option value="">—</option>${SC_POSICOES.map(x => `<option ${x === p.posicao ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <label>Data de nascimento<input name="nascimento" type="date" value="${esc(p.nascimento || '')}"></label>
        <label>Pé<select name="pe"><option value="">—</option>${['Direito', 'Esquerdo', 'Ambos'].map(x => `<option ${x === p.pe ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <label>Altura (cm)<input name="altura" type="number" min="140" max="220" value="${p.altura ?? ''}"></label>
        <label>Nacionalidade<input name="nacionalidade" value="${esc(p.nacionalidade || '')}"></label>
        <label>Valor de mercado<input name="valor_mercado" value="${esc(p.valor_mercado || '')}"></label>
        <label>Contrato até<input name="contrato" value="${esc(p.contrato || '')}"></label>
      </div>
    </details>
    ${chavesW.length ? `<details class="mais-detalhes"><summary>Estatísticas do Wyscout (${chavesW.length})</summary>
      ${p.wyscout_info?.ficheiro ? `<p class="nota">${esc(p.wyscout_info.ficheiro)}${p.nome_wyscout && p.nome_wyscout !== p.nome ? ` · no Wyscout: ${esc(p.nome_wyscout)}` : ''}</p>` : ''}
      <input type="search" id="sc-wy-filtro" placeholder="Filtrar métricas…" autocomplete="off">
      <div class="sc-wy-lista">${chavesW.map(k => `<div class="sc-wy-linha" data-k="${esc(norm(k))}"><span>${esc(k)}</span><b>${fmtNum(W[k], Number.isInteger(W[k]) ? 0 : 2)}</b></div>`).join('')}</div>
    </details>` : ''}
    <p class="erro" id="sc-erro" role="alert"></p>
    <div class="acoes">${!novo && podeApagar() ? '<button type="button" class="btn-link perigo apagar-esq" id="sc-apagar">Apagar jogador</button>' : ''}<button type="button" class="btn" id="sc-cancelar">Cancelar</button><button class="btn btn-prim" id="sc-guardar">${novo ? 'Adicionar' : 'Guardar'}</button></div>
  </form>`;
  document.body.appendChild(d); d.showModal();
  const fechar = () => { d.close(); d.remove(); };
  $('#sc-fechar', d).addEventListener('click', fechar); $('#sc-cancelar', d).addEventListener('click', fechar);
  d.addEventListener('cancel', fechar);
  $$('.sc-bot', d).forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.param, n = Number(b.dataset.n);
    notas[k] = notas[k] === n ? null : n; // carregar outra vez na mesma nota tira-a
    $$(`.sc-bot[data-param="${k}"]`, d).forEach(x => { const on = Number(x.dataset.n) === notas[k]; x.classList.toggle('ativo', on); x.setAttribute('aria-checked', String(on)); });
    const par = SC_PARAMS.find(x => x.k === k); $(`#sc-nivel-${k}`, d).innerHTML = notas[k] ? esc(par.niveis[notas[k] - 1]) : '<span class="fraco">sem nota</span>';
  }));
  $('#sc-wy-filtro', d)?.addEventListener('input', e => { const t = norm(e.target.value); $$('.sc-wy-linha', d).forEach(l => { l.hidden = !!t && !l.dataset.k.includes(t); }); });
  $('#sc-apagar', d)?.addEventListener('click', async () => {
    if (!await confirmar(`Apagar ${p.nome} do Scout (e a avaliação)?`)) return;
    try { await App.db.apagar('scout_jogadores', { id: p.id }); App.d.scout = scoutJogadores().filter(x => x.id !== p.id); App.d.scoutAval = (App.d.scoutAval || []).filter(x => x.jogador_id !== p.id); fechar(); desenharScout(); }
    catch (err) { $('#sc-erro', d).textContent = traduzErro(err); }
  });
  $('#sc-form', d).addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target); const txt = k => String(fd.get(k) || '').trim() || null;
    const dados = { nome: txt('nome'), equipa: equipaScoutExistente(txt('equipa')), posicao: txt('posicao'), nascimento: txt('nascimento'), pe: txt('pe'),
      altura: Number(fd.get('altura')) || null, nacionalidade: txt('nacionalidade'), valor_mercado: txt('valor_mercado'), contrato: txt('contrato') };
    if (!dados.nome || !dados.equipa) { $('#sc-erro', d).textContent = 'Indique o nome e a equipa.'; return; }
    $('#sc-guardar', d).disabled = true;
    try {
      let jog = p;
      if (novo) { jog = await App.db.inserir('scout_jogadores', dados); (App.d.scout ||= []).push(jog); }
      else {
        const mudou = Object.entries(dados).some(([k, v]) => (p[k] ?? null) !== v);
        if (mudou) { await App.db.atualizar('scout_jogadores', { id: p.id }, dados); Object.assign(p, dados); }
        const av = { ...notas, comentario: txt('comentario') };
        const vazia = SC_PARAMS.every(x => !av[x.k]) && !av.comentario;
        if (a) {
          if (SC_PARAMS.some(x => (a[x.k] ?? null) !== av[x.k]) || (a.comentario ?? null) !== av.comentario) {
            const r = await App.db.atualizar('scout_avaliacoes', { id: a.id }, av); Object.assign(a, r?.[0] || av, av);
            if (!r?.[0]) a.updated_at = new Date().toISOString();
          }
        } else if (!vazia) {
          const n = await App.db.inserir('scout_avaliacoes', { jogador_id: p.id, ...av });
          (App.d.scoutAval ||= []).push({ updated_at: new Date().toISOString(), ...n });
        }
      }
      fechar(); desenharScout(); toast(novo ? `${dados.nome} adicionado ao Scout.` : 'Guardado.');
    } catch (err) { $('#sc-guardar', d).disabled = false; $('#sc-erro', d).textContent = traduzErro(err); }
  });
}

// ---- Transfermarkt ----
async function tmGuardarScout(eq, j) {
  const equipa = equipaScoutExistente(eq || j.club) || 'Sem equipa';
  // Mesmo jogador: pelo id do Transfermarkt; senão pelo nome na mesma equipa (também "J. Silva" do Wyscout = "João Silva").
  const daEq = scoutJogadores().filter(p => mesmaEquipa(p.equipa, equipa));
  const parecidos = daEq.filter(p => !p.tm_id && (nomesParecidosEP(j.name, p.nome) || (p.nome_wyscout && nomesParecidosEP(j.name, p.nome_wyscout))));
  const ex = scoutJogadores().find(p => p.tm_id && j.transfermarktId && p.tm_id === String(j.transfermarktId))
    || daEq.find(p => norm(p.nome) === norm(j.name) || norm(p.nome_wyscout || '') === norm(j.name))
    || (parecidos.length === 1 ? parecidos[0] : null);
  const dmY = s => { const m = String(s || '').trim().match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : (String(s || '').trim().replace(/^-$/, '') || null); };
  const num = parseInt(j.shirtNumber, 10);
  const dados = {
    equipa: ex?.equipa || equipa, nome: j.name || ex?.nome,

    nascimento: /^\d{4}-\d{2}-\d{2}$/.test(j.birthDate || '') ? j.birthDate : ex?.nascimento ?? null,
    altura: j.heightCm >= 120 && j.heightCm <= 230 ? j.heightCm : ex?.altura ?? null,
    pe: peTm(j.foot) ?? ex?.pe ?? null, numero: num >= 0 && num <= 99 ? num : ex?.numero ?? null,
    nacionalidade: j.nationality || ex?.nacionalidade || null,
    valor_mercado: (j.marketValue && j.marketValue !== '-' ? j.marketValue : null) || ex?.valor_mercado || null, contrato: dmY(j.contractUntil) || ex?.contrato || null,
    tm_id: j.transfermarktId ? String(j.transfermarktId) : ex?.tm_id ?? null, tm_url: j.sourceUrl || ex?.tm_url || null
  };
  if (/^data:image\//.test(j.photo || '')) { try { dados.foto = await reduzirFoto(j.photo); } catch { /* sem foto */ } }
  if (ex) { await App.db.atualizar('scout_jogadores', { id: ex.id }, dados); Object.assign(ex, dados); return 'atualizado'; }

}
// Importa o plantel de uma equipa (um pedido por jogador, com pausa para não sobrecarregar o Transfermarkt).
// ui: { msg(texto), progresso(0..1), parar() -> true para parar }
async function importarPlantelScout(eq, url, ui, pre = null) {
  const r = pre || await tmChamar(url);
  if (!r.equipa) throw new Error('Esse link não é de uma equipa.');
  if (eq) await gravarEquipaScout(eq, { tm_url: url });
  const lista = r.equipa; let ok = 0; const falhas = []; let eqUsada = eq; const pausa = window.__TMPAUSA ?? 2500;
  for (let i = 0; i < lista.length && !ui.parar(); i++) {
    ui.msg(`${eq ? `${eq}: ` : ''}${i + 1} de ${lista.length} · ${lista[i].name}`);
    try {
      const x = await tmChamar(lista[i].url);
      if (!eqUsada) { eqUsada = equipaScoutExistente(x.jogador.club) || x.jogador.club; await gravarEquipaScout(eqUsada, { tm_url: url }); }
      await tmGuardarScout(eqUsada, x.jogador); ok++;
    } catch (err) { falhas.push(lista[i].name); if (/schema|relation|column/i.test(err.message)) throw err; }
    ui.progresso((i + 1) / lista.length);
    if (i < lista.length - 1 && !ui.parar()) await new Promise(res => setTimeout(res, pausa));
  }
  return { ok, falhas, equipa: eqUsada };
}

// ---- Wyscout: exportação de jogadores (uma linha por jogador) ----
const SC_WY_CAMPOS = {
  jogador: /^(player|jogador|jugador|name|nome)$/i,
  equipa: /^(team|equipa|equipo|clube|club)$/i,
  equipaPeriodo: /(team within selected timeframe|equipa (durante|no|dentro d[oe]) per[ií]odo)/i,
  posicao: /^(position|posi[cç][aã]o|posi[cç][oõ]es|pos\.?)$/i,
  idade: /^(age|idade|edad)$/i,
  nascimento: /^(birthday|date of birth|data de nascimento|nascimento)$/i,
  valor: /^(market value|valor de mercado|valor)$/i,
  contrato: /(contract expires|contrato (expira|termina|até)|fim de contrato|contrato)/i,
  nacionalidade: /^(passport country|birth country|nacionalidade|pa[ií]s( de nascimento| do passaporte)?)$/i,
  pe: /^(foot|p[eé]|p[eé] preferido)$/i,
  altura: /^(height|altura)$/i,
  peso: /^(weight|peso)$/i,
  emprestimo: /^(on loan|emprestado|empr[eé]stimo)$/i
};
async function lerScoutWyscout(ficheiro, equipaPadrao) {
  const linhas = await lerFolha(await ficheiro.arrayBuffer());
  if (!linhas.length) throw new Error(`${ficheiro.name}: o ficheiro está vazio.`);
  const ic = detetarCabecalho(linhas);
  const largura = Math.max(...linhas.map(l => l.length));
  const nomes = nomesColunas(linhas[ic], largura);
  const col = {}; for (const [k, re] of Object.entries(SC_WY_CAMPOS)) { const i = nomes.findIndex(n => re.test(n.trim())); if (i >= 0) col[k] = i; }
  if (col.jogador === undefined) throw new Error(`${ficheiro.name}: não encontrei a coluna dos jogadores (Player / Jogador).`);
  const usadas = new Set(Object.values(col));
  const out = [];
  for (const l of linhas.slice(ic + 1)) {
    const nome = String(l[col.jogador] ?? '').trim();
    if (!nome || /^(total|totais|m[eé]dia|average)\b/i.test(nome)) continue;
    const t = k => (col[k] === undefined ? null : String(l[col[k]] ?? '').trim() || null);
    const equipa = t('equipa') || t('equipaPeriodo') || equipaPadrao || null;
    const met = {};
    nomes.forEach((n, i) => { if (usadas.has(i)) return; const v = parseNum(l[i]); if (v !== null) met[n] = v; });
    let nasc = col.nascimento !== undefined ? parseData(l[col.nascimento]) : null;
    const alt = parseNum(t('altura'));
    out.push({ nome, equipa, posicao: posicaoScoutWy(t('posicao')), posicao_wy: t('posicao'), idade: parseNum(t('idade')), nascimento: nasc,
      valor: col.valor !== undefined && Number.isFinite(parseNum(l[col.valor])) ? String(parseNum(l[col.valor])) : t('valor'), contrato: col.contrato !== undefined ? (parseData(l[col.contrato]) || t('contrato')) : null, nacionalidade: t('nacionalidade'),
      pe: peTm(t('pe')), altura: alt >= 140 && alt <= 230 ? Math.round(alt) : null, metricas: met });
  }
  return { ficheiro: ficheiro.name, linhas: out, temEquipa: col.equipa !== undefined || col.equipaPeriodo !== undefined };
}
function procurarScout(equipa, nome) {
  const daEq = scoutJogadores().filter(p => mesmaEquipa(p.equipa, equipa));
  const exato = daEq.find(p => norm(p.nome_wyscout || '') === norm(nome) || norm(p.nome) === norm(nome)); if (exato) return exato;
  const cand = daEq.filter(p => !p.nome_wyscout && nomesParecidosEP(nome, p.nome));
  return cand.length === 1 ? cand[0] : null;
}
async function gravarScoutWyscout(lidos) {
  let novos = 0, atualizados = 0;
  const hoje = hojeIso();
  for (const f of lidos) for (const r of f.linhas) {
    const equipa = equipaScoutExistente(r.equipa);
    const ex = procurarScout(equipa, r.nome);
    const info = { ficheiro: f.ficheiro, data: hoje };
    // O Transfermarkt é melhor fonte para os dados pessoais: do Wyscout só se preenche o que falta.
    const base = { posicao: r.posicao, idade: r.idade, nascimento: r.nascimento, valor_mercado: r.valor, contrato: r.contrato, nacionalidade: r.nacionalidade, pe: r.pe, altura: r.altura };
    if (ex) {
      const patch = { wyscout: r.metricas, wyscout_info: info, nome_wyscout: r.nome };
      for (const [k, v] of Object.entries(base)) if (v != null && (ex[k] == null || ex[k] === '')) patch[k] = v;
      await App.db.atualizar('scout_jogadores', { id: ex.id }, patch); Object.assign(ex, patch); atualizados++;
    } else {
      const n = await App.db.inserir('scout_jogadores', { equipa, nome: r.nome, nome_wyscout: r.nome, ...Object.fromEntries(Object.entries(base).filter(([, v]) => v != null)), wyscout: r.metricas, wyscout_info: info });
      (App.d.scout ||= []).push(n); novos++;
    }
  }
  return { novos, atualizados };
}
function dialogoScoutWyscout() {
  const eqs = scoutEquipas().map(e => e.equipa);
  const d = document.createElement('dialog'); d.className = 'dialogo dialogo-largo';

  document.body.appendChild(d); d.showModal();
  const fechar = () => { d.close(); d.remove(); desenharScout(); };
  $('#sw-fechar', d).addEventListener('click', fechar); d.addEventListener('cancel', fechar);
  let lidos = [];
  const ler = async () => {
    const fs = [...$('#sw-fich', d).files]; $('#sw-erro', d).textContent = ''; $('#sw-ir', d).disabled = true; lidos = [];

    const erros = [];

    const semEq = lidos.filter(f => f.linhas.some(r => !r.equipa));
    const linhas = lidos.flatMap(f => f.linhas.filter(r => r.equipa));
    const porEq = new Map(); for (const r of linhas) { const e = equipaScoutExistente(r.equipa); const o = porEq.get(e) || { n: 0, ja: 0 }; o.n++; if (procurarScout(e, r.nome)) o.ja++; porEq.set(e, o); }
    $('#sw-resumo', d).innerHTML = porEq.size ? `<div class="tabela-env"><table class="tabela compacta"><thead><tr><th>Equipa</th><th class="num">Jogadores</th><th class="num">Já no Scout</th><th class="num">Novos</th></tr></thead>
      <tbody>${[...porEq].map(([e, o]) => `<tr><td>${esc(e)}${eqs.includes(e) ? '' : ' <span class="fraco">(nova)</span>'}</td><td class="num">${o.n}</td><td class="num">${o.ja}</td><td class="num">${o.n - o.ja}</td></tr>`).join('')}</tbody></table></div>` : '';
    if (semEq.length) erros.push(`${semEq.map(f => f.ficheiro).join(', ')}: sem coluna da equipa. Escreva a equipa acima.`);
    $('#sw-erro', d).textContent = erros.join(' ');
    $('#sw-ir', d).disabled = !linhas.length || semEq.length > 0;
  };
  $('#sw-fich', d).addEventListener('change', ler);
  let tEq; $('#sw-eq', d).addEventListener('input', () => { clearTimeout(tEq); tEq = setTimeout(ler, 400); });
  $('#sw-form', d).addEventListener('submit', async e => {
    e.preventDefault(); const b = $('#sw-ir', d); b.disabled = true; b.textContent = 'A importar…';
    try {
      const r = await gravarScoutWyscout(lidos);
      const eqsF = [...new Set(lidos.flatMap(f => f.linhas.map(x => equipaScoutExistente(x.equipa))))];
      if (eqsF.length === 1) App.sc.equipa = eqsF[0];
      fechar(); toast(`Wyscout importado: ${r.novos} ${r.novos === 1 ? 'jogador novo' : 'jogadores novos'}, ${r.atualizados} ${r.atualizados === 1 ? 'atualizado' : 'atualizados'}.`);
    } catch (err) { b.disabled = false; b.textContent = 'Importar'; $('#sw-erro', d).textContent = traduzErro(err); }
  });
}

// ---------- Dados › Verificação e Codificação › Estado por jornada ----------

// Semelhança entre dois nomes normalizados (0 a 1), pela distância de edição.
function semelhanca(a, b) {
  if (a === b) return 1;
  const m = a.length, n = b.length; if (!m || !n) return 0;
  let ant = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(ant[j] + 1, cur[j - 1] + 1, ant[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    ant = cur;
  }
  return 1 - ant[n] / Math.max(m, n);
}
const PRIMEIRA_PARTE = ['0-15', '15-30', '30-45'], SEGUNDA_PARTE = ['45-60', '60-75', '75-90'];
const ehParte = (p, n) => new RegExp(`^${n}`).test(String(p || '').trim());

// Todas as verificações, sobre as oportunidades e os esquemas táticos codificados.
function verificarDados() {
  const alvos = App.idx.alvos || [];
  const golos = [], equipaFora = [], duplicados = [], parteTempo = [];
  for (const a of alvos) {
    const ops = App.idx.eventosAlvo[a.key] || [], eps = App.idx.esquemasAlvo[a.key] || [];
    // 1. Golos codificados (oportunidades) contra o resultado do jogo.
    if (ops.length && Number.isFinite(a.golosCasa) && Number.isFinite(a.golosFora)) {
      const g = { casa: 0, fora: 0 };
      for (const e of ops) if (e.resultado === 'Golo') { const l = ladoNoAlvo(e, a); if (l) g[l]++; }
      if (g.casa !== a.golosCasa || g.fora !== a.golosFora) golos.push({ a, g });
    }
    for (const e of [...ops, ...eps]) {
      // 2. Equipa que não joga este jogo.
      if (e.equipa && !mesmaEquipa(e.equipa, a.casa) && !mesmaEquipa(e.equipa, a.fora) && norm(e.equipa) !== norm(a.casa) && norm(e.equipa) !== norm(a.fora)) equipaFora.push({ a, e });
      // 3. Parte e tempo que não batem (1.ª parte com 45-60 fica de fora: são os descontos).
      if (e.tempo && e.parte) {
        if ((ehParte(e.parte, 1) && SEGUNDA_PARTE.slice(1).includes(e.tempo)) || (ehParte(e.parte, 2) && PRIMEIRA_PARTE.includes(e.tempo))) parteTempo.push({ a, e });
      }
    }
    // 4. Registos repetidos: tudo igual dentro do mesmo jogo.
    // Só nas oportunidades: os esquemas táticos não têm minuto e repetem-se com frequência (mesmo batedor, mesma zona).
    const grupos = {};
    for (const e of ops) {
      const k = [e.tipo, e.ep_tipo, norm(e.equipa || e.lado), e.parte, e.tempo, e.minuto, norm(e.jogador), norm(e.assistente), norm(e.referencia), e.momento, e.sub_momento, e.mecanismo, e.resultado, e.segunda_vaga, e.zona_ep,
        ...posicaoParaComparar(e)].join('|');
      (grupos[k] ||= []).push(e);
    }
    for (const g of Object.values(grupos)) if (g.length > 1) duplicados.push({ a, evs: g });
  }
  return { golos, equipaFora, duplicados, parteTempo, nomes: variantesDeNomes(), treinadores: variantesDeTreinadores() };
}
// Nomes de jogadores escritos de formas diferentes na mesma equipa.
function variantesDeNomes() {
  const porEquipa = {};
  for (const e of App.d.eventos) {
    const eq = chaveEquipaCanonica(equipaDoEvento(e) || ''); if (!eq) continue;
    for (const campo of ['jogador', 'assistente', 'referencia']) {
      const v = String(e[campo] || '').trim(); if (!v || v === '-') continue;
      const m = ((porEquipa[eq] ||= {})[v] ||= { nome: v, n: 0, evs: [] }); m.n++; m.evs.push([e, campo]);
    }
  }
  const pares = [];
  for (const [eq, nomes] of Object.entries(porEquipa)) {
    const lista = Object.values(nomes);
    const usados = new Set();
    for (let i = 0; i < lista.length; i++) {
      if (usados.has(i)) continue;
      const grupo = [lista[i]];
      for (let j = i + 1; j < lista.length; j++) {
        if (usados.has(j)) continue;
        const a = norm(lista[i].nome), b = norm(lista[j].nome);
        const pa = a.split(' '), pb = b.split(' ');
        const mesmo = a === b || semelhanca(a, b) >= 0.86 || (a.length > 3 && b.length > 3 && pa[0] === pb[0] && (pa.length === 1 || pb.length === 1) && (b.startsWith(a + ' ') || a.startsWith(b + ' ')));
        if (mesmo) { grupo.push(lista[j]); usados.add(j); }
      }
      if (grupo.length > 1) { usados.add(i); grupo.sort((x, y) => y.n - x.n); pares.push({ equipa: eq, grupo }); }
    }
  }
  return pares.sort((x, y) => x.equipa.localeCompare(y.equipa, 'pt'));
}
function variantesDeTreinadores() {
  const porEquipa = {};
  for (const p of App.d.partidas) for (const [eq, t, campo] of [[p.casa, p.treinador_casa, 'treinador_casa'], [p.fora, p.treinador_fora, 'treinador_fora']]) {
    if (!t) continue; const k = chaveEquipaCanonica(eq);
    const m = ((porEquipa[k] ||= {})[t] ||= { nome: t, n: 0, refs: [] }); m.n++; m.refs.push([p, campo]);
  }
  const out = [];
  for (const [eq, nomes] of Object.entries(porEquipa)) {
    const lista = Object.values(nomes); const vistos = new Set();
    for (const x of lista) {
      if (vistos.has(x.nome)) continue;
      const grupo = lista.filter(y => !vistos.has(y.nome) && (norm(y.nome) === norm(x.nome) || semelhanca(norm(y.nome), norm(x.nome)) >= 0.86));
      grupo.forEach(y => vistos.add(y.nome));
      if (grupo.length > 1) out.push({ equipa: eq, grupo: grupo.sort((a, b) => b.n - a.n), treinador: true });
    }
  }
  return out;
}
// Ponto do evento para comparar: a zona, quando o ponto é aproximado (folhas importadas); o ponto, quando foi marcado no campo.
function posicaoParaComparar(e) {
  if (e.local_aprox || e.origem === 'folha_ep') return [e.zona_ep || (e.zona_x != null ? zonaFinalizacao(e.zona_x, e.zona_y) : ''), e.passe_x != null ? zonaPasse(e.passe_x, e.passe_y) : ''];
  return [e.zona_x != null ? Math.round(e.zona_x) : '', e.zona_y != null ? Math.round(e.zona_y) : ''];
}
const rotuloCurto = a => rotuloAlvo(a);
function descreverEvento(e) {
  const tipo = e.ep_tipo ? e.ep_tipo : 'Oportunidade';
  return [tipo, e.parte, e.tempo, e.jogador, e.resultado].filter(Boolean).join(' · ');
}
