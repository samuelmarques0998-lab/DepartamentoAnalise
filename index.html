// ---- Estado da codificação por jornada ----
function temDadosLiga(a, eq) { return (App.d.liga || []).some(r => norm(r.competicao) === norm(a.competicao) && r.jornada === a.jornada && mesmaEquipa(r.equipa, eq)); }
function desenharEstadoCodificacao() {
  const v = $('#vista'); App.estCod ||= {};
  const alvos = (App.idx.alvos || []).filter(a => a.partida && a.jornada != null);
  const comps = [...new Set(alvos.map(a => a.competicao))].sort();
  if (!comps.length) { v.innerHTML = '<div class="cabecalho-vista"><h1>Estado da codificação</h1></div><div class="vazio"><p>Importe o ficheiro da liga para ver os jogos de cada jornada.</p></div>'; return; }
  const E = App.estCod; if (!comps.includes(E.comp)) E.comp = comps.find(c => alvos.some(a => a.competicao === c && a.ladoNosso)) || comps[0];
  const lista = alvos.filter(a => a.competicao === E.comp);
  const jornadas = [...new Set(lista.map(a => a.jornada))].sort((a, b) => a - b);
  const jogado = a => Number.isFinite(a.golosCasa) && Number.isFinite(a.golosFora);
  const contar = (evs, a) => { const c = { casa: 0, fora: 0 }; for (const e of evs) { const l = ladoNoAlvo(e, a); if (l) c[l]++; } return c; };
  let jog = 0, opOk = 0, epOk = 0;
  const linhas = jornadas.map(j => {
    const jogos = lista.filter(a => a.jornada === j).sort((a, b) => a.casa.localeCompare(b.casa, 'pt'));
    const cels = jogos.map(a => {
      const op = contar(App.idx.eventosAlvo[a.key] || [], a), ep = contar(App.idx.esquemasAlvo[a.key] || [], a);
      const temOp = op.casa + op.fora > 0, temEp = ep.casa + ep.fora > 0;
      if (jogado(a)) { jog++; if (temOp) opOk++; if (temEp) epOk++; }
      const est = !jogado(a) ? 'futuro' : temOp && temEp ? 'completo' : temOp || temEp ? 'parcial' : 'falta';
      const ind = (rot, c, tem, chave) => `<button type="button" class="ec-ind ${tem ? 'sim' : 'nao'}" data-cod="${chave}" data-alvo="${esc(a.key)}" ${jogado(a) && pode() ? '' : 'disabled'} title="${rot}: ${c.casa} ${esc(a.casa)} · ${c.fora} ${esc(a.fora)}">${rot} ${tem ? `${c.casa}·${c.fora}` : '—'}</button>`;
      return `<div class="ec-jogo ${est}"${a.ladoNosso ? ' data-nosso="1"' : ''}>
        <span class="ec-eqs">${esc(a.casa)} <b>${jogado(a) ? `${a.golosCasa}–${a.golosFora}` : '–'}</b> ${esc(a.fora)}</span>
        ${jogado(a) ? `<span class="ec-inds">${ind('OP', op, temOp, 'op')}${ind('EP', ep, temEp, 'ep')}</span>` : '<span class="ec-inds fraco">por jogar</span>'}
        ${jogado(a) && ehDep() ? `<span class="ec-dados">${[a.casa, a.fora].map(eq => `<button type="button" class="ec-ind ec-dd ${temDadosLiga(a, eq) ? 'sim' : 'nao'}" data-dados="${esc(a.key)}" data-eq="${esc(eq)}" title="${temDadosLiga(a, eq) ? 'Já tem' : 'Sem'} dados estatísticos de ${esc(eq)}: carregar a exportação do Wyscout">Dados ${esc(eq)}</button>`).join('')}</span>` : ''}
      </div>`;
    }).join('');
    const feitos = jogos.filter(a => jogado(a)).length;
    return `<div class="ec-linha"><span class="ec-j">J${j}<small>${feitos}/${jogos.length}</small></span><div class="ec-jogos">${cels}</div></div>`;
  }).join('');
  const pct = (x, t) => (t ? Math.round(x / t * 100) : 0);
  v.innerHTML = `
    <div class="cabecalho-vista"><div><h1>Estado da codificação</h1><p class="nota">Jogos de cada jornada com oportunidades (OP) e esquemas táticos (EP) codificados (números da equipa da casa · fora)${ehDep() ? ', e os dados estatísticos de cada equipa: «Dados» abre o carregamento da exportação do Wyscout' : ''}.</p></div></div>
    <div class="filtros"><label>Competição<select id="ec-comp">${comps.map(c => `<option ${c === E.comp ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>${ehDep() ? '<button class="btn" id="ec-wy">Carregar Team stats (Wyscout)</button>' : ''}</div>
    <section class="placar">
      <div class="placar-cel"><span class="placar-rot">Jogos realizados</span><b class="placar-val">${jog}</b></div>
      <div class="placar-cel"><span class="placar-rot">Oportunidades</span><b class="placar-val">${opOk}<small>/${jog}</small></b><span class="placar-sub">${pct(opOk, jog)}% dos jogos codificados</span></div>
      <div class="placar-cel"><span class="placar-rot">Esquemas táticos</span><b class="placar-val">${epOk}<small>/${jog}</small></b><span class="placar-sub">${pct(epOk, jog)}% dos jogos codificados</span></div>
    </section>
    <div class="ec-legenda"><span class="ec-jogo completo">Completo</span><span class="ec-jogo parcial">Falta OP ou EP</span><span class="ec-jogo falta">Por codificar</span><span class="ec-jogo futuro">Por jogar</span></div>
    <section class="bloco ec-grelha">${linhas}</section>`;
  $('#ec-comp').addEventListener('change', e => { E.comp = e.target.value; desenharEstadoCodificacao(); });
  $('#ec-wy')?.addEventListener('click', () => dialogoDadosEquipa({ competicao: E.comp }, null));
  $$('[data-dados]', v).forEach(b => b.addEventListener('click', () => dialogoDadosEquipa(App.idx.alvo[b.dataset.dados], b.dataset.eq)));
  $$('[data-cod]', v).forEach(b => b.addEventListener('click', () => {
    const a = App.idx.alvo[b.dataset.alvo];
    if (b.dataset.cod === 'op') { Object.assign(App.cod, { alvo: a.key, side: a.ladoNosso || 'casa' }); location.hash = 'codificacao'; }
    else { App.codEP ||= { form: {}, ponto: 'batida', filtro: 'todos' }; Object.assign(App.codEP, { alvo: a.key, side: a.ladoNosso || 'casa' }); location.hash = 'codesquemas'; }
  }));
}

// ---------- Dados estatísticos de cada equipa por jogo (exportação "Team stats" do Wyscout) ----------
// O ficheiro traz a época toda da equipa (e, se exportado "com dados do adversário", também a linha do adversário).
// A app reconhece os jogos do campeonato, ignora o resto (taças, Europa, linhas de médias) e grava no formato da liga.

// Quando o nome do Wyscout não chega ao da liga só pela regra geral.
const ALIAS_WY = { '% posse': 'Posse', posse: 'Posse', 'comprimento medio de passes': 'Comprimento médio de passe', '% passes inteligentes certos': '% Passes Inteligentes' };
const IGNORAR_WY = /^(data|jogo|competi[cç][aã]o|dura[cç][aã]o|equipa|sistema|golos|golos sofridos)$/i;
const OUTRAS_COMP_WY = /ta[cç]a|cup|copa|europa|champions|conference|amig|friendl|supertaça/i;

function chaveSolta(nome) { const pct = /%/.test(nome); return (pct ? '% ' : '') + norm(String(nome).replace(/%/g, ' ')); }

// Cabeçalhos agrupados do Wyscout -> um nome por coluna, como no ficheiro da liga:
// "Remates / à baliza" (3 colunas) -> Remates, Remates à baliza, % Remates à baliza
// "Perdas / curto/ médio / longo" (4) -> Perdas, Perdas curto, Perdas médio, Perdas longo
// "Entradas na grande área (corridas/cruzamentos)" (3) -> Entradas na grande área, … corridas, … cruzamentos
function colunasWyscout(cab) {
  const txt = i => String(cab[i] ?? '').replace(/\s+/g, ' ').trim();
  const out = []; let i = 0;
  while (i < cab.length) {
    const base = txt(i); let n = 0;
    while (i + 1 + n < cab.length && !txt(i + 1 + n)) n++;
    if (!base) { out.push(null); i++; continue; }
    if (!n) out.push(base.replace(/[,\s]+$/, ''));
    else {
      const m = base.match(/^(.*?)\s*\((.*)\)\s*$/);
      const raiz = (m ? m[1] : base.split('/')[0]).trim();
      const subs = (m ? m[2].split('/') : base.split('/').slice(1)).map(s => s.trim()).filter(Boolean);
      const nomes = [raiz];
      // Primeiro as sub-colunas com nome; a seguinte é a percentagem da primeira; as restantes ficam numeradas.
      for (let k = 0; k < n; k++) nomes.push(k < subs.length ? `${raiz} ${subs[k]}` : k === subs.length ? `% ${raiz} ${subs[0] || ''}`.trim() : `${raiz} (${k + 1})`);
      out.push(...nomes);
    }
    i += n + 1;
  }
  return out;
}

// Liga cada coluna à métrica com o mesmo nome no ficheiro da liga (as que não existem ficam com o nome do Wyscout).
function mapaMetricasLiga() {
  const m = new Map();
  for (const r of App.d.liga || []) for (const k of Object.keys(r.metricas || {})) if (!m.has(chaveSolta(k))) m.set(chaveSolta(k), k);
  return m;
}
function nomeNaLiga(nome, mapa) {
  const c = chaveSolta(nome);
  return mapa.get(c) || ALIAS_WY[c] || ALIAS_WY[norm(nome)] || nome;
}

// Lê o ficheiro: um registo por jogo, com as métricas de cada equipa.
function analisarTeamStats(linhas) {
  const ih = linhas.findIndex(l => l.some(c => /^data$/i.test(String(c).trim())) && l.some(c => /^equipa$/i.test(String(c).trim())));
  if (ih < 0) return { erro: 'Não encontrei o cabeçalho do Wyscout (colunas Data, Jogo, Equipa…). Exporte em Team stats › Excel.' };
  const nomes = colunasWyscout(linhas[ih]);
  const col = re => nomes.findIndex(n => n && re.test(n));
  const iD = col(/^data$/i), iJ = col(/^jogo$/i), iC = col(/^competi[cç][aã]o$/i), iE = col(/^equipa$/i);
  const mapa = mapaMetricasLiga();
  const metricasIdx = nomes.map((n, i) => (n && !IGNORAR_WY.test(n) && i !== iD && i !== iJ && i !== iC && i !== iE ? i : -1)).filter(i => i >= 0);
  const desconhecidas = new Set();
  const grupos = new Map();
  let ant = null; // no CSV, a linha do adversário vem logo a seguir, sem data nem jogo
  for (const l of linhas.slice(ih + 1)) {
    let data = parseData(l[iD]), jogo = String(l[iJ] ?? '').trim();
    if (!data && !jogo && ant && String(l[iE] ?? '').trim()) ({ data, jogo } = ant);
    if (!data) { ant = null; continue; } // linhas de médias e vazias
    ant = { data, jogo };
    const k = `${data}|${jogo}`;
    if (!grupos.has(k)) grupos.set(k, { data, texto: jogo, comp: String(l[iC] ?? '').trim(), linhas: [] });
    const met = {};
    for (const i of metricasIdx) {
      const v = parseNum(l[i]); if (v === null) continue;
      const nm = nomeNaLiga(nomes[i], mapa); if (mapa.size && ![...mapa.values()].includes(nm)) desconhecidas.add(nm);
      met[nm] = v;
    }
    grupos.get(k).linhas.push({ equipa: String(l[iE] ?? '').trim(), met });
  }
  const jogos = [...grupos.values()].map(g => ({ ...g, ...(lerTextoJogo(g.texto) || {}) })).filter(g => g.casa);
  return { jogos, desconhecidas: [...desconhecidas], nMetricas: metricasIdx.length };
}

// Nome da equipa como aparece nos jogos do campeonato (senão, o nome do ficheiro com a correspondência de nomes).
function nomeEquipaLiga(nome, partidas, igual, id) {
  for (const p of partidas) { if (igual(p.casa, nome)) return p.casa; if (igual(p.fora, nome)) return p.fora; }
  return id.equipa(nome);
}
// Jornada provável de um jogo novo: a do nosso jogo da mesma semana (±3 dias); senão, a seguinte à última jornada das duas equipas.
function adivinharJornada(g, comp, partidas, igual) {
  const t = Date.parse(g.data);
  const nosso = (App.d.jogos || []).filter(j => norm(j.competicao) === norm(comp) && j.data && j.jornada != null && Math.abs(Date.parse(j.data) - t) <= 3 * 864e5)
    .sort((a, b) => Math.abs(Date.parse(a.data) - t) - Math.abs(Date.parse(b.data) - t))[0];
  if (nosso) return nosso.jornada;
  const js = partidas.filter(p => [g.casa, g.fora].some(e => igual(p.casa, e) || igual(p.fora, e))).map(p => p.jornada).filter(Number.isFinite);
  return js.length ? Math.max(...js) + 1 : null;
}

// Associa cada jogo do ficheiro ao jogo do campeonato e prepara os registos (um por equipa).
function prepararDadosLiga(analise, comp) {
  const id = criarIdentificador(App.cfg, App.d.mapas || []);
  const igual = (a, b) => mesmaEquipa(a, b) || norm(id.equipa(a)) === norm(id.equipa(b));
  const partidas = (App.d.partidas || []).filter(p => norm(p.competicao) === norm(comp));
  const existe = (jornada, equipa) => (App.d.liga || []).find(r => norm(r.competicao) === norm(comp) && r.jornada === jornada && igual(r.equipa, equipa)) || null;
  const out = []; let ignorados = 0;
  for (const g of analise.jogos) {
    if (OUTRAS_COMP_WY.test(g.comp)) { ignorados++; continue; }
    let p = partidas.find(p => igual(p.casa, g.casa) && igual(p.fora, g.fora));
    // Jogo do campeonato que ainda não existe na app (ex.: jornada posterior ao último ficheiro da liga): fica como jogo novo, com a jornada a confirmar.
    if (!p) p = { novo: true, competicao: comp, jornada: adivinharJornada(g, comp, partidas, igual), casa: nomeEquipaLiga(g.casa, partidas, igual, id), fora: nomeEquipaLiga(g.fora, partidas, igual, id), jogo_id: null };
    const lado = { casa: null, fora: null };
    for (const l of g.linhas) { if (!lado.casa && igual(l.equipa, g.casa)) lado.casa = l.met; else if (!lado.fora && igual(l.equipa, g.fora)) lado.fora = l.met; }
    // Linhas com nomes que não reconheço: a 1.ª é a da casa ou a da fora, conforme a que já foi encontrada.
    const resto = g.linhas.filter(l => l.met !== lado.casa && l.met !== lado.fora);
    if (!lado.casa && resto.length) lado.casa = resto.shift().met;
    if (!lado.fora && resto.length) lado.fora = resto.shift().met;
    const registos = [];
    for (const s of ['casa', 'fora']) {
      const met = lado[s]; if (!met || !Object.keys(met).length) continue;
      const o = lado[s === 'casa' ? 'fora' : 'casa'];
      const m = { ...met };
      // O que o Wyscout não dá diretamente vem do adversário.
      if (o && m['xG Sofrido'] == null && Number.isFinite(o['Golos esperados'])) m['xG Sofrido'] = o['Golos esperados'];
      if (o && m['Remates contra'] == null && Number.isFinite(o['Remates'])) m['Remates contra'] = o['Remates'];
      if (o && m['Remates contra no alvo'] == null && Number.isFinite(o['Remates à baliza'])) m['Remates contra no alvo'] = o['Remates à baliza'];
      const equipa = s === 'casa' ? p.casa : p.fora, adversario = s === 'casa' ? p.fora : p.casa;
      const golos = Number.isFinite(g.gc) ? (s === 'casa' ? g.gc : g.gf) : null, sofridos = Number.isFinite(g.gc) ? (s === 'casa' ? g.gf : g.gc) : null;
      registos.push({ lado: s, competicao: p.competicao, jornada: p.jornada, equipa, adversario, local: s, golos, golos_sofridos: sofridos, metricas: m, atual: existe(p.jornada, equipa) });
    }
    if (registos.length) out.push({ p, g, registos });
  }
  out.sort((a, b) => a.p.jornada - b.p.jornada);
  return { jogos: out, ignorados };
}

async function guardarDadosLiga(jogos) {
  const E = App.epoca; const agora = new Date().toISOString();
  for (const j of jogos.filter(j => j.p.novo)) {
    const p = j.p, gc = Number.isFinite(j.g.gc) ? j.g.gc : null, gf = Number.isFinite(j.g.gf) ? j.g.gf : null;
    for (const r of j.registos) r.jornada = p.jornada;
    const id = criarIdentificador(App.cfg, App.d.mapas || []);
    const nosso = id.eNos(p.casa) ? 'casa' : id.eNos(p.fora) ? 'fora' : null;
    if (nosso) {
      const adv = nosso === 'casa' ? p.fora : p.casa;
      const [jg] = await App.db.upsert('jogos', [{ epoca: E, competicao: p.competicao, jornada: p.jornada, adversario: adv, data: j.g.data || null, local: nosso,
        golos_marcados: nosso === 'casa' ? gc : gf, golos_sofridos: nosso === 'casa' ? gf : gc }], 'epoca,competicao,jornada,adversario');
      p.jogo_id = jg?.id || null;
    }
    const [pg] = await App.db.upsert('partidas', [{ epoca: E, competicao: p.competicao, jornada: p.jornada, casa: p.casa, fora: p.fora, golos_casa: gc, golos_fora: gf, jogo_id: p.jogo_id, updated_at: agora }], 'epoca,competicao,casa,fora');
    if (pg) { p.id = pg.id; p.novo = false; }
  }
  const liga = jogos.flatMap(j => j.registos.map(r => ({ epoca: E, competicao: r.competicao, jornada: r.jornada, equipa: r.equipa, adversario: r.adversario, local: r.local,
    golos: r.golos, golos_sofridos: r.golos_sofridos, metricas: r.metricas, updated_at: agora })));
  await App.db.upsert('estatisticas_liga', liga, 'epoca,competicao,jornada,equipa,adversario');
  // Jogos da nossa equipa: também nas estatísticas do jogo (relatório da equipa e pós-jogo).
  const eq = [];
  for (const j of jogos) {
    if (!j.p.jogo_id) continue;
    for (const r of j.registos) eq.push({ jogo_id: j.p.jogo_id, lado: eNossaEquipa(r.equipa) ? 'nos' : 'adversario', equipa: r.equipa, metricas: r.metricas, updated_at: agora });
  }
  if (eq.length) await App.db.upsert('estatisticas_equipa', eq, 'jogo_id,lado');
  return liga.length;
}

// Diálogo aberto a partir de um jogo (Estado por jornada › Dados <equipa>).
function dialogoDadosEquipa(a, equipa) {
  const d = document.createElement('dialog'); d.className = 'dialogo dialogo-largo dd';
  d.innerHTML = `<div class="pilha">
      <h2>${equipa ? `Dados de ${esc(equipa)}` : 'Dados estatísticos (Wyscout)'}</h2>
      <p class="nota sem-margem">${equipa ? `J${a.jornada} · ${esc(a.casa)} – ${esc(a.fora)}` : esc(a.competicao)}</p>
      <label class="dd-ficheiro"><span>Exportação <b>Team stats</b> do Wyscout${equipa ? ` de ${esc(equipa)}` : ''} (Excel ou CSV), de preferência com os dados do adversário</span>
        <input type="file" accept=".xlsx,.xls,.csv" id="dd-f"></label>
      <p class="nota">Pode trazer a época toda: a app vai buscar este jogo e mostra os outros jogos do campeonato que estão no ficheiro.</p>
      <div id="dd-res"></div>
      <div class="acoes"><button class="btn" id="dd-cancelar">Cancelar</button><button class="btn btn-prim" id="dd-guardar" disabled>Guardar</button></div>
    </div>`;
  document.body.appendChild(d); d.showModal(); d.addEventListener('close', () => d.remove());
  $('#dd-cancelar', d).addEventListener('click', () => d.close());
  let prep = null;
  const chaveJogo = j => `${norm(j.p.casa)}|${norm(j.p.fora)}`;
  const esteJogo = j => !!equipa && (j.p.id === a.partida?.id || (j.p.jornada === a.jornada && mesmaEquipa(j.p.casa, a.casa) && mesmaEquipa(j.p.fora, a.fora)));
  const semJornada = () => $$('[data-dd]:checked', d).some(c => { const i = $(`[data-jor="${c.dataset.dd}"]`, d); return i && !(Number(i.value) >= 1); });
  const atualizarBotao = () => { const n = $$('[data-dd]:checked', d).length; const b = $('#dd-guardar', d); b.disabled = !n || semJornada(); b.textContent = n ? `Guardar ${n} ${n === 1 ? 'jogo' : 'jogos'}` : 'Guardar'; };
  $('#dd-f', d).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return; const res = $('#dd-res', d);
    try {
      const an = analisarTeamStats(await lerFicheiroTabela(f));
      if (an.erro) { res.innerHTML = `<p class="erro-txt">${esc(an.erro)}</p>`; return; }
      prep = prepararDadosLiga(an, a.competicao);
      if (!prep.jogos.length) { res.innerHTML = `<p class="erro-txt">Nenhum jogo do ficheiro corresponde a jogos de ${esc(a.competicao)}. Confirme a equipa e os nomes em Definições › Correspondência de nomes.</p>`; return; }
      const meu = equipa ? prep.jogos.find(esteJogo) : null;
      const KEYS = ['Golos esperados', 'xG Sofrido', 'Remates', 'Remates à baliza', 'Posse', '% Passes certos', 'PPDA', 'Toques na área'];
      const previa = (() => {
        if (!equipa) return '';
        if (!meu) return `<p class="aviso">Este jogo não está no ficheiro. Confirme que exportou ${esc(equipa)} e que o jogo já tem estatísticas no Wyscout.</p>`;
        const r = meu.registos.find(r => mesmaEquipa(r.equipa, equipa)) || meu.registos[0];
        return `<h3>${esc(r.equipa)} neste jogo</h3><div class="tabela-env"><table class="tabela compacta"><thead><tr><th></th><th class="num">Atual</th><th class="num">Ficheiro</th></tr></thead><tbody>
          ${KEYS.filter(k => r.metricas[k] != null || r.atual?.metricas?.[k] != null).map(k => `<tr><td>${esc(k)}</td><td class="num">${r.atual?.metricas?.[k] != null ? fmtNum(r.atual.metricas[k], 2) : '–'}</td><td class="num"><b>${r.metricas[k] != null ? fmtNum(r.metricas[k], 2) : '–'}</b></td></tr>`).join('')}
          </tbody></table></div><p class="nota">${Object.keys(r.metricas).length} métricas lidas${meu.registos.length > 1 ? `, e também as de ${esc(meu.registos.find(x => x !== r).equipa)} (vêm no mesmo ficheiro)` : ' (sem a linha do adversário: exporte com os dados do adversário para ter os dois lados)'}.</p>`;
      })();
      const estado = j => { if (j.p.novo) return ['novo', 'Jogo novo na app']; const n = j.registos.filter(r => r.atual).length; return n === 0 ? ['novo', 'Sem dados'] : n < j.registos.length ? ['parcial', 'Falta uma equipa'] : ['tem', 'Já tem dados (substitui)']; };
      res.innerHTML = `${previa}
        <h3>Jogos do campeonato no ficheiro (${prep.jogos.length})</h3>
        <div class="dd-lista">${prep.jogos.map(j => { const [cls, txt] = estado(j); const marcar = esteJogo(j) || cls !== 'tem';
          return `<label class="dd-jogo ${cls} ${esteJogo(j) ? 'este' : ''}"><input type="checkbox" data-dd="${esc(chaveJogo(j))}" ${marcar ? 'checked' : ''}>
            ${j.p.novo ? `<span class="dd-j">J<input type="number" min="1" max="60" class="dd-jor" data-jor="${esc(chaveJogo(j))}" value="${j.p.jornada ?? ''}" aria-label="Jornada" title="Confirme a jornada"></span>` : `<span class="dd-j">J${j.p.jornada}</span>`}<span>${esc(j.p.casa)} <b>${Number.isFinite(j.g.gc) ? `${j.g.gc}–${j.g.gf}` : '–'}</b> ${esc(j.p.fora)}</span>
            <span class="dd-est">${txt}${j.registos.length < 2 ? ' · só uma equipa no ficheiro' : ''}</span></label>`; }).join('')}</div>
        ${prep.jogos.some(j => j.p.novo) ? '<p class="nota">Jogos novos: ainda não estão nos jogos do campeonato da app (o último ficheiro da liga é anterior). Confirme a jornada; o jogo é criado ao guardar.</p>' : ''}
        ${prep.ignorados ? `<p class="nota">${prep.ignorados} ${prep.ignorados === 1 ? 'jogo ignorado' : 'jogos ignorados'} por não serem de ${esc(a.competicao)} (taças, Europa, outras ligas).</p>` : ''}
        ${an.desconhecidas.length ? `<p class="nota">Métricas que não existiam na liga (ficam guardadas com o nome do Wyscout): ${esc(an.desconhecidas.join(', '))}.</p>` : ''}`;
      $$('[data-dd]', d).forEach(c => c.addEventListener('change', atualizarBotao));
      $$('[data-jor]', d).forEach(i => i.addEventListener('input', atualizarBotao));
      atualizarBotao();
    } catch (err) { res.innerHTML = `<p class="erro-txt">${esc(traduzErro(err.message || String(err)))}</p>`; }
  });
  $('#dd-guardar', d).addEventListener('click', async e => {
    const marcados = new Set($$('[data-dd]:checked', d).map(c => c.dataset.dd));
    const jogos = prep.jogos.filter(j => marcados.has(chaveJogo(j)));
    for (const j of jogos) { const i = $(`[data-jor="${chaveJogo(j)}"]`, d); if (i) j.p.jornada = Number(i.value); }
    e.target.disabled = true; e.target.textContent = 'A guardar…';
    try { const n = await guardarDadosLiga(jogos); d.close(); toast(`${n} ${n === 1 ? 'registo guardado' : 'registos guardados'} em ${jogos.length} ${jogos.length === 1 ? 'jogo' : 'jogos'}.`); await recarregar(); }
    catch (err) { e.target.disabled = false; atualizarBotao(); toast(traduzErro(err.message || String(err)), 'erro'); }
  });
}

// ---------- Adversários de fora da liga: estatísticas Wyscout (Team stats) ----------
// Para equipas que não estão no ficheiro da liga (Liga Europa, Taça…). O ficheiro traz todas as competições
// da equipa; cada jogo fica guardado com as métricas da equipa e as do adversário desse jogo.

// "Scotland. Premiership" -> "Premiership"; "Europe. UEFA Europa League" -> "Liga Europa".
function nomeCompCurto(c) {
  const s = String(c || '').trim(); if (!s) return '';
  if (/europa league/i.test(s)) return 'Liga Europa';
  if (/conference league/i.test(s)) return 'Liga Conferência';
  if (/champions league/i.test(s)) return 'Liga dos Campeões';
  return s.replace(/^[^.]{2,30}\.\s+/, '');
}
// Os amigáveis ficam guardados mas não entram na forma nem nas médias.
const eAmigavel = r => /friendl|amig[aá]ve/i.test(r.competicao || '');
function estatAdv(eq, comAmigaveis = false) { return (App.d.estAdv || []).filter(r => mesmaEq(r.equipa, eq) && (comAmigaveis || !eAmigavel(r))).sort((a, b) => a.data.localeCompare(b.data)); }
function equipaNaLiga(eq) { return (App.d.liga || []).some(l => mesmaEq(l.equipa, eq)); }

// Equipa de um ficheiro Team stats: a que aparece em (quase) todos os jogos.
function equipaDoTeamStats(an) {
  // A 1.ª linha de cada jogo é a da equipa exportada; desempata pelas presenças nos jogos.
  const c = new Map();
  const somar = (e, v) => { if (!e) return; const k = [...c.keys()].find(x => mesmaEq(x, e)) || e; c.set(k, (c.get(k) || 0) + v); };
  for (const g of an.jogos) { somar(g.linhas[0]?.equipa, 1000); for (const e of new Set([g.casa, g.fora].filter(Boolean))) somar(e, 1); }
  return [...c.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || null;
}
async function importarEstatAdversario(eq, f) {
  let an;
  try { an = analisarTeamStats(await lerFicheiroTabela(f)); } catch (e) { toast('Não foi possível ler o ficheiro.', 'erro'); return; }
  if (an.erro) { toast(an.erro, 'erro'); return; }
  const linhas = linhasEstatAdv(an, eq);
  if (!linhas.length) { toast(`O ficheiro não tem jogos de ${eq}. Exporte o Team stats desta equipa.`, 'erro'); return; }
  try { await App.db.upsert('estatisticas_adversario', linhas, 'epoca,equipa,data,adversario'); }
  catch (e) { toast(traduzErro(e), 'erro'); return; }
  const comps = [...new Set(linhas.map(l => nomeCompCurto(l.competicao)).filter(Boolean))];
  toast(`${linhas.length} jogos de ${eq} guardados${comps.length ? ` (${comps.join(', ')})` : ''}.`);
  await recarregar();
}
// Registos (um por jogo) do Team stats de uma equipa, para estatisticas_adversario.
function linhasEstatAdv(an, eq) {
  const linhas = []; let semEquipa = 0;
  for (const g of an.jogos) {
    const nos = g.linhas.find(l => mesmaEq(l.equipa, eq));
    if (!nos) { semEquipa++; continue; }
    const outro = g.linhas.find(l => l !== nos) || null;
    const local = mesmaEq(g.casa, eq) ? 'casa' : mesmaEq(g.fora, eq) ? 'fora' : null;
    if (!local) { semEquipa++; continue; }
    const adversario = local === 'casa' ? g.fora : g.casa;
    const temRes = Number.isFinite(g.gc) && Number.isFinite(g.gf);
    const m = { ...nos.met }, a = outro ? { ...outro.met } : null;

// ---------- Conclusões a partir dos dados estatísticos (Wyscout) ----------
// Adversário da liga: o que o distingue das outras equipas (média por jogo, posição e desvio em relação à liga).
// Adversário de fora da liga: o que muda dentro da própria equipa (últimos 5, casa/fora, Europa/campeonato).

// Métricas parecidas contam como um só tema (fica a mais saliente).
const GRUPO_EQ = { xg: 'fin', remates: 'fin', remates_alvo_pct: 'fin2', toques_area: 'area', entradas_area: 'area', entradas_conducao: 'area2', entradas_cruz: 'area3',
  xg_sofrido: 'fin_s', remates_sofridos: 'fin_s', remates_sofridos_alvo: 'fin_s2', toques_area_sof: 'area_s', entradas_area_sof: 'area_s',
  posse: 'posse', passes_pct: 'passe', passes_posse: 'posse2', passe_longo_pct: 'longo' };
const ladoDaArea = d => (d.area === 'Defesa' ? 'defesa' : 'ataque');
const mediaDe = v => (v.length ? v.reduce((s, x) => s + x, 0) / v.length : null);
const desvioDe = v => { if (v.length < 2) return null; const m = mediaDe(v); return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1)); };
function leituraEq(d, alto) {
  if (!d.melhor) return 'Traço de estilo.';
  return (alto === (d.melhor > 0)) ? 'Ponto forte.' : 'Ponto fraco.';
}
// Todas as candidatas (por ordem de saliência, sem repetir a métrica), com as sugeridas marcadas.
function marcarSugeridas(cands, max, total) {
  const sug = new Set(escolherConclusoes(cands.filter(c => c.forte), max, total));
  const vistos = new Set(); const out = [];
  // No máximo 7 por contexto (Europa, casa/fora, últimos 5…), para a lista não ficar só com um tema.
  const porCtx = {};
  for (const c of [...cands].sort((a, b) => (sug.has(b) - sug.has(a)) || b.s - a.s)) {
    const ctx = c.id.split(':').length > 2 ? c.id.split(':')[1] : 'liga';
    if (vistos.has(c.id) || (!sug.has(c) && (porCtx[ctx] || 0) >= 7)) continue;
    vistos.add(c.id); porCtx[ctx] = (porCtx[ctx] || 0) + 1; out.push({ ...c, sugerida: sug.has(c) });
  }
  return out.slice(0, 16);
}
// Escolhe as mais salientes: uma por tema, no máximo 4 de cada lado.
function escolherConclusoes(cands, max = 3, total = 5) {
  const out = [], grupos = new Set(), porLado = { ataque: 0, defesa: 0 };
  for (const c of cands.sort((a, b) => b.s - a.s)) {
    const g = GRUPO_EQ[c.d.id] || c.d.id;
    if (out.length >= total || grupos.has(g) || porLado[c.lado] >= max) continue;
    grupos.add(g); porLado[c.lado]++; out.push(c);
  }
  return out;
}

function conclusoesWyLiga(adv, comp, liga, todas = false) {
  const porEq = {};
  for (const L of liga) (porEq[L.equipa] ||= []).push(L);
  const eqs = Object.keys(porEq).filter(e => porEq[e].length >= 3);
  const nome = eqs.find(e => mesmaEq(e, adv)); if (!nome) return [];
  const cands = [];
  for (const d of METRICAS_EQ) {
    if (d.ops) continue;
    const medias = eqs.map(e => ({ e, m: mediaDe(porEq[e].map(L => valorEq(d, L)).filter(Number.isFinite)) })).filter(x => x.m !== null);
    if (medias.length < 6) continue;
    const eu = medias.find(x => x.e === nome); if (!eu) continue;
    const vals = medias.map(x => x.m); const mu = mediaDe(vals), sd = desvioDe(vals); if (!sd) continue;
    const z = (eu.m - mu) / sd;
    const ordem = [...medias].sort((a, b) => b.m - a.m); const pos = ordem.findIndex(x => x.e === nome) + 1;
    const alto = z > 0; const rank = alto ? pos : medias.length - pos + 1;
    const forte = Math.abs(z) >= 1.1 && rank <= 3;
    if (!forte && (!todas || Math.abs(z) < 0.75 || rank > 5)) continue;
    const posTxt = rank === 1 ? `o valor ${alto ? 'mais alto' : 'mais baixo'} da liga` : `${rank}.º ${alto ? 'mais alto' : 'mais baixo'} da liga`;
    cands.push({ d, forte, id: `wy:${d.id}`, lado: ladoDaArea(d), s: Math.abs(z) + (rank === 1 ? 0.3 : 0),
      t: `${d.nome}: ${fmtEq(d, eu.m)}${d.pct || d.id === 'ppda' || d.id === 'intensidade' || d.id === 'passes_posse' ? '' : ' por jogo'}, ${posTxt}`,
      det: `Média da liga ${fmtEq(d, mu)} (${medias.length} equipas). ${leituraEq(d, alto)}${d.id === 'ppda' ? ' Quanto mais baixo, mais alta a pressão.' : ''}` });
  }
  return todas ? marcarSugeridas(cands, 3, 5) : escolherConclusoes(cands);
}

// Diferença entre dois grupos de jogos da mesma equipa: só conta se for grande face à variação jogo a jogo.
function compararGrupos(d, A, B, todos, zMin = 2) {
  const va = A.map(L => valorEq(d, L)).filter(Number.isFinite), vb = B.map(L => valorEq(d, L)).filter(Number.isFinite);
  if (va.length < 3 || vb.length < 3) return null;
  const sd = desvioDe(todos.map(L => valorEq(d, L)).filter(Number.isFinite)); if (!sd) return null;
  const ma = mediaDe(va), mb = mediaDe(vb); const z = (ma - mb) / (sd * Math.sqrt(1 / va.length + 1 / vb.length));
  const rel = Math.abs(ma - mb) / (Math.abs(mb) || 1);
  if (Math.abs(z) < zMin || (!d.pct && rel < 0.12) || (d.pct && Math.abs(ma - mb) < 3)) return null;
  return { ma, mb, z, forte: Math.abs(z) >= 2 && (d.pct ? Math.abs(ma - mb) >= 4 : rel >= 0.15) };
}
function conclusoesWyEquipa(adv, todas = false) {
  const rs = estatAdv(adv); if (rs.length < 6) return [];
  const L = r => ({ m: r.metricas || {}, a: r.metricas_adv || {} });
  const todos = rs.map(L);
  const ult = rs.slice(-5), antes = rs.slice(0, -5);
  const casa = rs.filter(r => r.local === 'casa'), fora = rs.filter(r => r.local === 'fora');
  const comps = {}; for (const r of rs) (comps[nomeCompCurto(r.competicao)] ||= []).push(r);
  // Europa: cada competição europeia em separado; conta a Liga Europa (ou, sem ela, a europeia com mais jogos).
  const nomesEur = Object.keys(comps).filter(c => /liga europa|liga dos campe|confer/i.test(c));
  const europa = nomesEur.includes('Liga Europa') ? 'Liga Europa' : nomesEur.sort((a, b) => comps[b].length - comps[a].length)[0] || null;
  const jogosEur = europa ? comps[europa] : [];
  const domestica = Object.keys(comps).filter(c => !nomesEur.includes(c) && !/ta[cç]a|cup/i.test(c)).sort((a, b) => comps[b].length - comps[a].length)[0];
  const cands = [];
  for (const d of METRICAS_EQ) {
    if (d.ops) continue;
    const tenta = (A, B, fn, ctx) => { const r = compararGrupos(d, A.map(L), B.map(L), todos, todas ? 1.5 : 2); if (r && (todas || r.forte)) cands.push({ d, id: `wy:${ctx}:${d.id}`, forte: r.forte, lado: ladoDaArea(d), s: Math.abs(r.z), ...fn(r) }); };
    if (antes.length >= 4) tenta(ult, antes, r => ({ t: `${d.nome} nos últimos 5 jogos: ${fmtEq(d, r.ma)}, contra ${fmtEq(d, r.mb)} antes`,
      det: `${r.ma > r.mb ? 'Subiu' : 'Desceu'} na fase mais recente. ${d.melhor ? ((r.ma > r.mb) === (d.melhor > 0) ? 'Está melhor.' : 'Está pior.') : 'Mudança de estilo.'}` }), 'ult');
    tenta(casa, fora, r => ({ t: `${d.nome}: ${fmtEq(d, r.ma)} em casa e ${fmtEq(d, r.mb)} fora`,
      det: `Diferença grande entre casa (${casa.length} jogos) e fora (${fora.length} jogos).` }), 'local');
    if (europa && domestica) tenta(comps[europa], comps[domestica], r => ({ t: `${d.nome} na ${europa}: ${fmtEq(d, r.ma)}, contra ${fmtEq(d, r.mb)} na ${domestica}`,
      det: `Na ${europa} (${jogosEur.length} jogos) é uma equipa diferente do campeonato (${comps[domestica].length} jogos).` }), `comp-${norm(europa).replace(/ /g, '-')}`);
  }
  return todas ? marcarSugeridas(cands, 3, 4) : escolherConclusoes(cands, 3, 4);
}

    <div class="cpe-print${ed ? ' so-impressao' : ''}">${htmlListaConclusoesPre(adv, C)}</div>
    ${ed ? `<div class="so-ecra cpe">
      <p class="nota sem-margem">Escolha as conclusões que entram no relatório (o PDF só leva as marcadas) e ajuste o texto. As marcadas como «Sugerida» são as que mais se destacam. Fica guardado para ${esc(adv)}.</p>
      ${grupo('Dados estatísticos', I.wy, `Wyscout · ${C.contexto}`)}
      ${grupo('Oportunidades', I.cod, 'codificação · comparação com as outras equipas codificadas')}
      <h3 class="concl-sub">As nossas <span class="nota">(escritas pelo departamento)</span></h3>
      <div class="cpe-lista" id="cpe-extra">${I.extra.map(c => linha(c, true)).join('')}</div>
      <div class="acoes-esq"><button type="button" class="btn" id="cpe-nova">Adicionar conclusão</button><button type="button" class="btn-link" id="cpe-repor">Repor sugestões</button></div>
    </div>` : ''}`;
}
function ligarConclusoesPre(adv, C) {
  const raiz = $('#pre-concl'); if (!raiz || !ehDep()) return;
  const redesenhar = () => { raiz.innerHTML = htmlConclusoesPreEditor(adv, C); };
  const atualizarLista = () => { const l = $('.cpe-print', raiz); if (l) l.innerHTML = htmlListaConclusoesPre(adv, C); };
  let espera = null;
  const guardar = async (imediato = false) => {
    clearTimeout(espera);
    const fazer = async () => {
      const E = { itens: {}, extra: [] };
      for (const el of $$('.cpe-item', raiz)) {
        const v = { on: el.querySelector('.cpe-on').checked, lado: el.querySelector('.cpe-lado').value, t: el.querySelector('.cpe-t').value.trim(), d: el.querySelector('.cpe-d').value.trim() };
        if (el.dataset.extra) { E.extra.push({ id: el.dataset.cid, ...v }); continue; }
        // Só guarda o texto se foi alterado (assim as sugestões continuam a atualizar-se com os dados novos).
        if (v.t === el.dataset.t0) delete v.t; if (v.d === el.dataset.d0) delete v.d;
        E.itens[el.dataset.cid] = v;
      }
      const todas = { ...(App.cfg.conclusoes_pre || {}), [norm(adv)]: E };
      try { await App.db.upsert('configuracao', [{ id: 1, conclusoes_pre: todas, updated_at: new Date().toISOString() }], 'id'); App.cfg.conclusoes_pre = todas; }
      catch (err) { toast(`Não foi possível guardar as conclusões: ${traduzErro(err.message || String(err))}`, 'erro'); }
    };
    if (imediato) await fazer(); else espera = setTimeout(fazer, 600);
  };
  raiz.addEventListener('change', async e => { if (e.target.matches('.cpe-on, .cpe-lado')) { e.target.closest('.cpe-item').classList.toggle('on', e.target.closest('.cpe-item').querySelector('.cpe-on').checked); await guardar(true); atualizarLista(); } });
  raiz.addEventListener('input', e => { if (e.target.matches('.cpe-t, .cpe-d')) guardar(); });
  raiz.addEventListener('focusout', async e => { if (e.target.matches('.cpe-t, .cpe-d')) { await guardar(true); atualizarLista(); } });
  raiz.addEventListener('click', async e => {
    if (e.target.id === 'cpe-nova') {
      const E = estadoConclusoesPre(adv); const novo = { id: `x:${Date.now()}`, on: true, lado: 'ataque', t: 'Nova conclusão', d: '' };
      const todas = { ...(App.cfg.conclusoes_pre || {}), [norm(adv)]: { itens: E.itens || {}, extra: [...(E.extra || []), novo] } };
      await App.db.upsert('configuracao', [{ id: 1, conclusoes_pre: todas, updated_at: new Date().toISOString() }], 'id'); App.cfg.conclusoes_pre = todas; redesenhar();
      setTimeout(() => { const i = $(`[data-cid="${novo.id}"] .cpe-t`); if (i) { i.focus(); i.select(); } }, 50);
    }
    if (e.target.classList.contains('cpe-tirar')) { e.target.closest('.cpe-item').remove(); await guardar(true); atualizarLista(); }
    if (e.target.id === 'cpe-repor' && await confirmar(`Repor as conclusões sugeridas para ${adv}? As alterações ao texto e as conclusões escritas pelo departamento perdem-se.`)) {
      const todas = { ...(App.cfg.conclusoes_pre || {}) }; delete todas[norm(adv)];
      await App.db.upsert('configuracao', [{ id: 1, conclusoes_pre: todas, updated_at: new Date().toISOString() }], 'id'); App.cfg.conclusoes_pre = todas; redesenhar();
    }
  });
}

// ---------- Arquivo do pré-jogo, por jornada ----------
// Cada jornada do nosso campeonato: relatório estatístico (PDF guardado na app) e relatório de observação (vídeo no YouTube).
const ARQ_TIPOS = { estatistico: 'Relatório estatístico', observacao: 'Relatório de observação' };
const ARQ_MAX = 50 * 1024 * 1024;

function idYoutube(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function fmtTamanho(b) { return b == null ? '' : b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1024 / 1024).toFixed(1).replace('.', ',')} MB`; }
// Outras competições no Arquivo: os jogos vêm de Dados › Jogos (ou do Calendário) com esta competição.
// Cada uma aceita também os nomes com que vem nos ficheiros (Wyscout).
const ARQ_OUTRAS = ['Taça de Portugal', 'Liga Europa'];
const ARQ_NOMES = { 'liga europa': ['europe uefa europa league', 'uefa europa league', 'europa league'] };
function mesmaCompArq(nomeJogo, comp) { const n = norm(nomeJogo || ''), c = norm(comp); return n === c || (ARQ_NOMES[c] || []).includes(n); }
function registoArquivo(comp, jornada, tipo) { return (App.d.arquivo || []).find(r => norm(r.competicao) === norm(comp) && r.jornada === jornada && r.tipo === tipo) || null; }

// Jornadas do nosso campeonato (jogos da liga com a nossa equipa).
// Inclui os jogos agendados (Calendário/Jogos) com jornada; o próximo jogo sem jornada fica com a jornada seguinte à última.
function jornadasArquivo(comp) {
  const porJ = new Map();
  for (const a of App.idx.alvos || []) {
    if (!a.ladoNosso || a.jornada == null || norm(a.competicao || '') !== norm(comp)) continue;
    const jogado = Number.isFinite(a.golosCasa) && Number.isFinite(a.golosFora);
    const ja = porJ.get(a.jornada);
    // A linha do ficheiro da liga ganha, a não ser que esteja por jogar e o jogo registado (Dados › Jogos) já tenha resultado.
    if (ja && !(a.partida && !ja.a.partida) && !(jogado && !ja.jogado)) continue;
    porJ.set(a.jornada, { a, jornada: a.jornada, adversario: a.ladoNosso === 'casa' ? a.fora : a.casa, local: a.ladoNosso, jogado });
  }
  const prox = proximoJogo();
  if (prox && prox.jornada == null && (!prox.competicao || norm(prox.competicao) === norm(comp)) && ![...porJ.values()].some(j => !j.jogado && mesmaEq(j.adversario, prox.adversario))) {
    const n = Math.max(0, ...porJ.keys()) + 1; const local = prox.local === 'fora' ? 'fora' : 'casa';
    porJ.set(n, { a: { data: prox.data, golosCasa: null, golosFora: null }, jornada: n, adversario: prox.adversario, local, jogado: false, inferida: true });
  }
  return [...porJ.values()].sort((x, y) => y.jornada - x.jornada);
}

// Jogos de uma competição sem ficheiro da liga (taças, Europa…), a partir dos jogos registados.
// A chave guardada é a jornada, se o jogo a tiver, ou a data (aaaammdd), para não mudar quando entram jogos novos.
function jogosArquivoOutra(comp) {
  const js = (App.d.jogos || []).filter(j => mesmaCompArq(j.competicao, comp) && (j.jornada != null || j.data)).sort(compararJogos);
  return js.map((j, i) => {
    const casa = j.local !== 'fora'; const gm = j.golos_marcados, gs = j.golos_sofridos;
    const jogado = Number.isFinite(gm) && Number.isFinite(gs);
    return { a: { data: j.data, golosCasa: casa ? gm : gs, golosFora: casa ? gs : gm }, jornada: j.jornada ?? Number(String(j.data).replaceAll('-', '')),
      rotulo: j.jornada != null ? `J${j.jornada}` : `${i + 1}.º`, adversario: j.adversario, local: casa ? 'casa' : 'fora', neutro: j.local === 'neutro', jogado };
  }).reverse();
}
function rotuloArq(j) { return j.rotulo || `J${j.jornada}`; }
function nomeArq(j) { return j.rotulo && !/^J\d/.test(j.rotulo) ? `do jogo com ${j.adversario}` : `da jornada ${j.jornada}`; }

function desenharArquivo() {
  const v = $('#vista'); App.arq ||= {};
  if (App.semArquivo) { v.innerHTML = '<div class="cabecalho-vista"><h1>Arquivo</h1></div><div class="vazio"><p>O arquivo ainda não existe na base de dados. Corra o ficheiro <code>schema.sql</code> no Supabase (SQL Editor) e recarregue a página.</p></div>'; return; }
  const ligas = [...new Set((App.idx.alvos || []).filter(a => a.partida && a.ladoNosso && a.jornada != null).map(a => a.competicao))].sort();
  // Outras: só as escolhidas (ARQ_OUTRAS), as restantes competições dos jogos registados não entram.
  const outras = ARQ_OUTRAS.filter(c => !ligas.some(x => norm(x) === norm(c)));
  const comps = [...ligas, ...outras];
  const A = App.arq; if (!comps.includes(A.comp)) A.comp = ligas[0] || comps[0];
  const ehLiga = ligas.includes(A.comp);
  const js = ehLiga ? jornadasArquivo(A.comp) : jogosArquivoOutra(A.comp);
  const un = ehLiga ? ['jornada', 'jornadas'] : ['jogo', 'jogos'];
  const proxima = [...js].reverse().find(j => !j.jogado);
  const editar = pode();
  const nEst = js.filter(j => registoArquivo(A.comp, j.jornada, 'estatistico')).length, nObs = js.filter(j => registoArquivo(A.comp, j.jornada, 'observacao')).length;
  v.innerHTML = `
    <div class="cabecalho-vista"><div><h1>Arquivo</h1>
      <p class="nota">Pré-jogo de cada jogo: o relatório estatístico em PDF (guardado aqui) e o relatório de observação em vídeo (YouTube).</p></div></div>
    <div class="filtros"><label>Competição<select id="arq-comp">${ligas.length ? `<optgroup label="Campeonato">${ligas.map(c => `<option ${c === A.comp ? 'selected' : ''}>${esc(c)}</option>`).join('')}</optgroup>` : ''}<optgroup label="Outras competições">${outras.map(c => `<option ${c === A.comp ? 'selected' : ''}>${esc(c)}</option>`).join('')}</optgroup></select></label>
      ${js.length ? `<span class="nota">${nEst} ${nEst === 1 ? 'relatório estatístico' : 'relatórios estatísticos'} · ${nObs} ${nObs === 1 ? 'vídeo de observação' : 'vídeos de observação'} em ${js.length} ${js.length === 1 ? un[0] : un[1]}</span>` : ''}</div>
    ${!js.length ? `<div class="vazio"><p>${ehLiga ? 'Importe o ficheiro da liga (Dados › Importação) para ver as jornadas.' : `Ainda não há jogos da ${esc(A.comp)}. Registe-os em Dados › Jogos (ou no Calendário) com a competição «${esc(A.comp)}» e aparecem aqui.`}</p></div>` : ''}
    ${(() => {
      // Primeiro o próximo jogo, depois as jornadas já jogadas (da mais recente); as restantes por jogar ficam no fim.
      const jogadas = js.filter(j => j.jogado), futuras = js.filter(j => !j.jogado && j !== proxima).sort((a, b) => a.jornada - b.jornada);
      return `${proxima ? `<h2 class="arq-sec">Próximo jogo</h2><div class="arq-lista">${htmlJornadaArquivo(A.comp, proxima, true, editar)}</div>` : ''}
        ${jogadas.length ? `<h2 class="arq-sec">${ehLiga ? 'Jornadas anteriores' : 'Jogos anteriores'}</h2><div class="arq-lista">${jogadas.map(j => htmlJornadaArquivo(A.comp, j, false, editar)).join('')}</div>` : ''}
        ${futuras.length ? `<details class="arq-futuras"><summary>${ehLiga ? 'Jornadas seguintes' : 'Jogos seguintes'} (${futuras.length})</summary><div class="arq-lista">${futuras.map(j => htmlJornadaArquivo(A.comp, j, false, editar)).join('')}</div></details>` : ''}`;
    })()}`;
  $('#arq-comp')?.addEventListener('change', e => { A.comp = e.target.value; desenharArquivo(); });
  ligarArquivo(v, A.comp, js);
}

function htmlJornadaArquivo(comp, j, proxima, editar) {
  const est = registoArquivo(comp, j.jornada, 'estatistico'), obs = registoArquivo(comp, j.jornada, 'observacao');
  const a = j.a; const nos = j.local === 'casa';
  const res = j.jogado ? `${a.golosCasa}–${a.golosFora}` : null;
  const r = j.jogado ? (nos ? (a.golosCasa > a.golosFora ? 'v' : a.golosCasa < a.golosFora ? 'd' : 'e') : (a.golosFora > a.golosCasa ? 'v' : a.golosFora < a.golosCasa ? 'd' : 'e')) : '';
  const vid = idYoutube(obs?.video_url);
  const k = `${j.jornada}`;
  return `<article class="arq-j ${proxima ? 'proxima' : ''}" data-j="${k}">
    <header class="arq-cab">
      <span class="arq-num">${esc(rotuloArq(j))}</span>
      ${simboloEquipa(j.adversario, 'arq-simb')}
      <div class="arq-jogo"><b>${esc(j.adversario)}</b><span class="nota">${j.neutro ? 'Campo neutro' : nos ? 'Casa' : 'Fora'}${a.data ? ` · ${fmtData(a.data)}` : ''}${proxima ? ' · próximo jogo' : ''}${j.inferida ? ' · jornada a confirmar' : ''}</span></div>
      ${res ? `<span class="arq-res ${r}">${res}</span>` : '<span class="arq-res futuro">por jogar</span>'}
    </header>
    <div class="arq-itens">
      <div class="arq-item ${est ? 'tem' : ''}">
        <span class="arq-tipo">${iconePdf()} ${ARQ_TIPOS.estatistico}</span>
        ${est ? `<span class="arq-fich">${esc(est.ficheiro_nome || 'relatório.pdf')}<small>${fmtTamanho(est.tamanho)}${est.updated_at ? ` · ${fmtData(String(est.updated_at).slice(0, 10))}` : ''}</small></span>
          <span class="arq-acoes"><button class="btn" data-abrir="${k}">Abrir</button>${editar ? `<label class="btn-link">Substituir<input type="file" accept="application/pdf" data-pdf="${k}" hidden></label>${podeApagar() ? `<button class="btn-link perigo" data-tirar-pdf="${k}">Apagar</button>` : ''}` : ''}</span>`
        : `<span class="arq-vazio fraco">Sem PDF.</span>${editar ? `<span class="arq-acoes"><label class="btn btn-prim">Carregar PDF<input type="file" accept="application/pdf" data-pdf="${k}" hidden></label><button class="btn-link" data-gerar="${k}">Gerar no pré-jogo</button></span>` : ''}`}
      </div>
      <div class="arq-item ${obs ? 'tem' : ''}">
        <span class="arq-tipo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg> ${ARQ_TIPOS.observacao}</span>
        ${obs ? `<a class="arq-video" href="${esc(obs.video_url)}" target="_blank" rel="noopener">${vid ? `<img src="https://i.ytimg.com/vi/${vid}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : ''}<span>Ver no YouTube ↗</span></a>
          ${editar ? `<span class="arq-acoes"><button class="btn-link" data-video-editar="${k}">Alterar link</button>${podeApagar() ? `<button class="btn-link perigo" data-video-tirar="${k}">Retirar</button>` : ''}</span>` : ''}`
        : editar ? `<form class="arq-form" data-video="${k}"><input type="url" required placeholder="https://youtu.be/…" aria-label="Link do vídeo no YouTube"><button class="btn">Guardar</button></form><p class="erro-txt" data-video-erro="${k}" role="alert"></p>`
          : '<span class="arq-vazio fraco">Sem vídeo.</span>'}
      </div>
    </div>
  </article>`;
}

function ligarArquivo(v, comp, js) {
  const porJ = Object.fromEntries(js.map(j => [String(j.jornada), j]));
  const base = (j, tipo) => ({ competicao: comp, jornada: j.jornada, adversario: j.adversario, tipo });
  const guardar = async (j, tipo, patch) => {
    const ex = registoArquivo(comp, j.jornada, tipo);
    const dados = { ...base(j, tipo), ...patch, updated_at: new Date().toISOString() };
    if (ex) await App.db.atualizar('arquivo', { id: ex.id }, dados); else await App.db.inserir('arquivo', dados);
  };
  $$('[data-abrir]', v).forEach(b => b.addEventListener('click', async () => {
    const r = registoArquivo(comp, Number(b.dataset.abrir), 'estatistico');
    // A janela abre já (os browsers bloqueiam janelas abertas depois de esperar pela rede) e recebe o link quando chega.
    const w = window.open('', '_blank');
    try { const url = await App.db.arquivoUrl(r.caminho); if (w) w.location = url; else location.href = url; }
    catch (e) { w?.close(); toast(traduzErro(e.message || String(e)), 'erro'); }
  }));
  $$('[data-pdf]', v).forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return; const j = porJ[inp.dataset.pdf];
    if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast('Escolha um ficheiro PDF.', 'erro'); return; }
    if (f.size > ARQ_MAX) { toast('O PDF tem mais de 50 MB.', 'erro'); return; }
    const antigo = registoArquivo(comp, j.jornada, 'estatistico');
    const pasta = norm(comp).replace(/\s+/g, '-');
    const caminho = `${pasta}/${j.rotulo && !/^J\d/.test(j.rotulo) ? j.jornada : `J${String(j.jornada).padStart(2, '0')}`}/estatistico-${Date.now()}.pdf`;
    toast('A carregar o PDF…');
    try {
      await App.db.arquivoGuardar(caminho, f);
      await guardar(j, 'estatistico', { caminho, ficheiro_nome: f.name, tamanho: f.size });
      if (antigo?.caminho && antigo.caminho !== caminho) { try { await App.db.arquivoApagar(antigo.caminho); } catch { /* fica o antigo no Storage */ } }
      toast('Relatório estatístico guardado.'); await recarregar();
    } catch (e) { toast(traduzErro(e.message || String(e)), 'erro'); }
  }));
  $$('[data-tirar-pdf]', v).forEach(b => b.addEventListener('click', async () => {
    const r = registoArquivo(comp, Number(b.dataset.tirarPdf), 'estatistico');
    if (!await confirmar(`Apagar o relatório estatístico ${nomeArq(porJ[b.dataset.tirarPdf])}?`)) return;
    try { if (r.caminho) await App.db.arquivoApagar(r.caminho); await App.db.apagar('arquivo', { id: r.id }); toast('PDF apagado.'); await recarregar(); } catch (e) { toast(traduzErro(e.message || String(e)), 'erro'); }
  }));
  $$('[data-gerar]', v).forEach(b => b.addEventListener('click', () => { const j = porJ[b.dataset.gerar]; App.pre ||= {}; App.pre.adversario = j.adversario; location.hash = 'prejogo'; }));
  $$('form[data-video]', v).forEach(f => f.addEventListener('submit', async e => {
    e.preventDefault(); const j = porJ[f.dataset.video]; const url = $('input', f).value.trim();
    const erro = $(`[data-video-erro="${f.dataset.video}"]`, v);
    if (!idYoutube(url)) { erro.textContent = 'Não parece um link do YouTube (youtube.com/watch?v=… ou youtu.be/…).'; return; }
    try { await guardar(j, 'observacao', { video_url: url }); toast('Vídeo guardado.'); await recarregar(); } catch (err) { erro.textContent = traduzErro(err.message || String(err)); }
  }));
  $$('[data-video-editar]', v).forEach(b => b.addEventListener('click', () => {
    const j = porJ[b.dataset.videoEditar]; const r = registoArquivo(comp, j.jornada, 'observacao');
    const item = b.closest('.arq-item');
    item.querySelector('.arq-video')?.remove(); b.closest('.arq-acoes').remove();
    item.insertAdjacentHTML('beforeend', `<form class="arq-form" data-video="${j.jornada}"><input type="url" required value="${esc(r.video_url)}" aria-label="Link do vídeo no YouTube"><button class="btn">Guardar</button></form><p class="erro-txt" data-video-erro="${j.jornada}" role="alert"></p>`);
    ligarArquivo(item, comp, js);
  }));
  $$('[data-video-tirar]', v).forEach(b => b.addEventListener('click', async () => {
    const r = registoArquivo(comp, Number(b.dataset.videoTirar), 'observacao');
    if (!await confirmar(`Retirar o vídeo de observação ${nomeArq(porJ[b.dataset.videoTirar])}? O vídeo continua no YouTube.`)) return;
    try { await App.db.apagar('arquivo', { id: r.id }); await recarregar(); } catch (e) { toast(traduzErro(e.message || String(e)), 'erro'); }
  }));
}

      <p class="instrucao">${I.tipo === 'esquemas' ? 'A folha de esquemas táticos (colunas Equipa, Adversário, Treinador, Lado, Distância, ETD, Mecanismo, Tipo de Bola, 1º Contacto, Zona, Outcome, 2a vaga, Batedor, Referência; a coluna Jornada é opcional mas necessária na 2.ª volta). Importe primeiro o ficheiro da liga. Importar a folha outra vez substitui os esquemas que vieram dela nos mesmos jogos; os codificados na app não são tocados.' : I.tipo === 'oportunidades' ? 'A folha de codificação de oportunidades por zonas (colunas Clube, Jornada, Adversário, Momento, Sub-Momento, Mecanismo, Zona de Finalização, Golo?…). Importe primeiro o ficheiro da liga, para as oportunidades ficarem ligadas aos jogos do campeonato. Importar a folha outra vez substitui as oportunidades que vieram dela nos mesmos jogos; as codificadas na app não são tocadas.' : eq
        ? 'No Wyscout, abra a página da equipa, separador <b>Estatísticas</b> (Team stats), e exporte para Excel ou CSV. Cada jogo tem duas linhas: a equipa e o adversário. O ficheiro da vossa equipa entra nos vossos jogos; os <b>Team stats de adversários</b> (pode escolher vários ficheiros de uma vez) ficam guardados para a observação e o pré-jogo. Também aceita o ficheiro de estatísticas da liga (uma linha por equipa e por jornada).'
        : 'Aceita a exportação de um <b>jogador</b> do Wyscout (todos os jogos dele: só entram os desta época com a vossa equipa, e os jogos da liga ganham a data) ou as estatísticas dos jogadores de um jogo. O nome do jogador é sugerido a partir do nome do ficheiro.'}</p>
      <label class="zona-ficheiro" id="i-zona">
        <input type="file" id="i-ficheiro" accept=".xlsx,.xls,.csv,.tsv,.txt" ${I.tipo === 'jogadores' || I.tipo === 'equipa' ? 'multiple' : ''}>
        <span class="zona-titulo">${I.loteAdv ? `${I.loteAdv.length} ${I.loteAdv.length === 1 ? 'ficheiro' : 'ficheiros'} de adversários` : I.lote ? `${I.lote.length} ficheiros` : I.ficheiro ? esc(I.ficheiro.name) : I.tipo === 'jogadores' ? 'Arraste os ficheiros para aqui' : 'Arraste o ficheiro para aqui'}</span>
        <span class="zona-sub">${I.ficheiro || I.lote || I.loteAdv ? 'Clique ou arraste outros ficheiros para trocar' : I.tipo === 'jogadores' ? 'ou clique para escolher; pode escolher os ficheiros de vários jogadores de uma vez' : 'ou clique para escolher (.xlsx, .xls, .csv ou .txt)'}</span>
      </label>
      <div id="i-analise"></div>
    </section>
    <section class="bloco" id="i-historico"></section>`;
  $$('input[name=imp-tipo]', v).forEach(r => r.addEventListener('change', () => { Object.assign(I, { tipo: r.value, tab: null, ficheiro: null, analise: null, lote: null, loteAdv: null }); desenharImportacao(); }));
  const zona = $('#i-zona');
  $('#i-ficheiro').addEventListener('change', e => lerFicheiros([...e.target.files]));
  ['dragenter', 'dragover'].forEach(t => zona.addEventListener(t, e => { e.preventDefault(); zona.classList.add('arrastar'); }));
  ['dragleave', 'drop'].forEach(t => zona.addEventListener(t, () => zona.classList.remove('arrastar')));
  zona.addEventListener('drop', e => { e.preventDefault(); lerFicheiros([...e.dataTransfer.files]); });
  if (I.loteAdv) desenharLoteAdv(); else if (I.lote) desenharLote(); else if (I.tab) desenharAnalise();
  desenharHistorico();
}

function lerFicheiros(fs) {
  if (!fs.length) return;
  if (fs.length > 1 && App.imp.tipo === 'jogadores') return lerLote(fs);
  if (App.imp.tipo === 'equipa') return lerTeamStatsEquipas(fs);
  if (fs.length > 1) toast('Este tipo de importação aceita um ficheiro de cada vez: usei o primeiro.', 'erro');
  return lerFicheiro(fs[0]);
}

async function lerFicheiro(f) {
  const I = App.imp; I.lote = null; I.loteAdv = null;
  try {
    const linhas = await lerFicheiroTabela(f);
    if (!linhas.length) throw new Error('O ficheiro está vazio.');
    I.ficheiro = f;
    if (I.tipo === 'esquemas') {
      I.tab = detetarFolhaEsquemas(linhas); I.escolhasEP = {};
      if (!I.tab) throw new Error('não encontrei as colunas da folha de esquemas táticos (Equipa, Adversário, ETD, 1º Contacto, Zona).');
    } else if (I.tipo === 'oportunidades') {
      I.tab = detetarFolhaOportunidades(linhas);
      if (!I.tab) throw new Error('não encontrei as colunas da folha de oportunidades (Clube, Adversário, Momento, Zona de Finalização, Golo?).');
    } else I.tab = (I.tipo === 'equipa' && detetarFormatoLiga(linhas)) || prepararTabela(linhas, I.tipo === 'equipa' ? PAPEIS_EQUIPA : PAPEIS_JOGADOR);
    I.equipaNossa = null; I.criarJogos = true;
    // Ficheiro de um só jogador (sem coluna do nome): adivinha o jogador pelo nome do ficheiro.
    I.jogadorNome = I.tipo === 'jogadores' ? adivinharJogador(f.name) : null;
    I.jogoId = null;
    desenharImportacao();
  } catch (err) {
    toast(`Não consegui ler o ficheiro: ${err.message}`, 'erro');
  }
}

function analisarAtual() {
  const I = App.imp;
  I.analise = I.tipo === 'equipa'
    ? analisarEquipa(I.tab, App.cfg, App.d.mapas, App.d.jogos)
    : analisarJogadores(I.tab, App.cfg, App.d.mapas, App.d.jogos, { jogoId: I.jogoId, ladoPadrao: I.lado, jogador: chaveDoNome(I.jogadorNome), criarJogos: I.criarJogos !== false });
}

      : `${n} registos de jogadores em ${nJogos} ${nJogos === 1 ? 'jogo' : 'jogos'} (${nos} da vossa equipa, ${n - nos} do adversário). ${A.nMetricas} métricas por jogador.`;
  }
  $('#i-analise').innerHTML = `
    <h2>Colunas</h2>
    <p class="nota">Detetei automaticamente as colunas principais. Corrija se alguma estiver errada; todas as restantes colunas numéricas são guardadas como métricas.</p>
    <div class="papeis">
      ${papeis.map(p => `<label>${PAPEIS[p].rotulo}<select data-papel="${p}"><option value="">— nenhuma —</option>${T.colunas.map((c, i) => `<option value="${i}" ${T.papeis[p] === i ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`).join('')}
    </div>
    ${!eq && (T.papeis.jogador === null || T.papeis.jogador === undefined) ? `<div class="grelha-2">
      <label>Jogador deste ficheiro<input id="i-jogador" list="i-jogadores" value="${esc(I.jogadorNome || '')}" autocomplete="off" placeholder="Nome do jogador"><datalist id="i-jogadores">${App.d.plantel.map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist></label>
      ${T.papeis.jogo !== null && T.papeis.jogo !== undefined ? `<label class="em-linha caixa"><input type="checkbox" id="i-criar" ${I.criarJogos !== false ? 'checked' : ''}> Criar os jogos da vossa equipa que ainda não existem na app (por exemplo, taças e jogos europeus)</label>` : ''}
    </div>` : ''}
    ${semData && (T.papeis.jogo === null || T.papeis.jogo === undefined) ? `<div class="grelha-2">
      <label>Jogo deste ficheiro<select id="i-jogo"><option value="">Escolha o jogo…</option>${jogos.map(j => `<option value="${j.id}" ${I.jogoId === j.id ? 'selected' : ''}>${esc(rotuloJogo(j))}</option>`).join('')}</select></label>
      ${T.papeis.equipa === null || T.papeis.equipa === undefined ? `<label>Os jogadores são de<select id="i-lado"><option value="nos" ${I.lado === 'nos' ? 'selected' : ''}>${esc(App.cfg.nome_clube || 'Nós')}</option><option value="adversario" ${I.lado === 'adversario' ? 'selected' : ''}>Adversário</option></select></label>` : ''}
    </div>` : ''}
    ${A.avisos.length ? `<ul class="avisos" role="status">${A.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
    ${n ? `<h2>Pré-visualização</h2><p class="destaque">${esc(resumo)}${A.ignoradas ? ` <span class="fraco">${A.ignoradas} linhas ignoradas (sem data, totais ou sem jogo).</span>` : ''}</p>
      ${eq ? tabelaPreviaEquipa(A.jogos) : tabelaPreviaJogadores(A.linhas)}
      <div class="acoes-esq"><button class="btn btn-prim" id="i-importar">Importar ${n} ${eq ? (n === 1 ? 'jogo' : 'jogos') : 'registos'}</button></div>` : ''}`;
  $$('[data-papel]').forEach(s => s.addEventListener('change', () => {
    const p = s.dataset.papel; const val = s.value === '' ? null : Number(s.value);

    T.papeis[p] = val; desenharAnalise();

  $('#i-criar')?.addEventListener('change', e => { I.criarJogos = e.target.checked; desenharAnalise(); });
  $('#i-jogo')?.addEventListener('change', e => { I.jogoId = e.target.value || null; desenharAnalise(); });
  $('#i-lado')?.addEventListener('change', e => { I.lado = e.target.value; desenharAnalise(); });

      <td>${j.local === 'casa' ? 'Casa' : j.local === 'fora' ? 'Fora' : '–'}</td>
      <td class="num">${Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos) ? `${j.golos_marcados}–${j.golos_sofridos}` : '–'}</td>
      <td>${j.existe ? 'Atualiza' : '<b>Novo</b>'}${j.metricasAdv ? '' : ' <span class="fraco">(sem linha do adversário)</span>'}</td></tr>`).join('')}</tbody></table></div>`;

function tabelaPreviaJogadores(linhas) {
  const mostrar = linhas.slice(0, 40);
  return `<div class="tabela-env"><table class="tabela compacta">
    <thead><tr><th>Jogo</th><th>Estado</th><th>Jogador</th><th>Equipa</th><th>Posição</th><th class="num">Minutos</th><th class="num">Métricas</th></tr></thead>
    <tbody>${mostrar.map(l => `<tr><td>${esc(rotuloJogo(l.jogo, true))}${l.jogo.competicao && l.novoJogo ? ` <span class="fraco">${esc(l.jogo.competicao)}</span>` : ''}</td>
      <td>${l.novoJogo ? '<b>Jogo novo</b>' : l.atualizaData ? `Liga a ${esc(quandoJogo(l.jogo, true))} (+ data${l.resultadoNovo ? ' e resultado' : ''})` : 'Jogo existente'}</td><td>${esc(l.jogador)}</td><td><span class="ponto-cor ${l.lado === 'nos' ? 'nos' : 'adv'}"></span>${esc(l.equipa || '')}</td>
      <td>${esc(l.posicao || '–')}</td><td class="num">${fmtNum(l.minutos, 0)}</td><td class="num">${Object.keys(l.metricas).length}</td></tr>`).join('')}</tbody></table></div>

async function registarImportacao(tipo, linhas, resumo, ficheiro = App.imp.ficheiro) {
  let caminho = null; let avisoFicheiro = null;
  try { caminho = await App.db.carregarFicheiro(ficheiro); } catch (err) { avisoFicheiro = err.message; }
  const imp = await App.db.inserir('importacoes', { tipo, ficheiro: ficheiro.name, caminho_storage: caminho, linhas, resumo });
  return { imp, avisoFicheiro };
}

async function importarEquipa(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const existentes = {}; for (const j of App.d.jogos) existentes[`${j.data}|${norm(j.adversario)}`] = j;
    const novos = A.jogos.filter(j => !j.existe).length;
    const { imp, avisoFicheiro } = await registarImportacao('equipa', A.jogos.length, { novos, atualizados: A.jogos.length - novos });
    // Mantém os valores já registados quando o ficheiro não os traz.
    const linhasJogos = A.jogos.map(j => {
      const ex = existentes[`${j.data}|${norm(j.adversario)}`] || {};
      return {
        data: j.data, adversario: ex.adversario || j.adversario, competicao: j.competicao ?? ex.competicao ?? null, local: j.local ?? ex.local ?? null,
        golos_marcados: j.golos_marcados ?? ex.golos_marcados ?? null, golos_sofridos: j.golos_sofridos ?? ex.golos_sofridos ?? null
      };
    });
    const guardados = await App.db.upsert('jogos', linhasJogos, 'data,adversario');
    const idPorChave = {}; for (const g of guardados) idPorChave[`${g.data}|${norm(g.adversario)}`] = g.id;
    const agora = new Date().toISOString(); const est = [];
    for (const j of A.jogos) {
      const jogo_id = idPorChave[`${j.data}|${norm(j.adversario)}`]; if (!jogo_id) continue;
      est.push({ jogo_id, lado: 'nos', equipa: j.equipaNos, metricas: j.metricasNos, importacao_id: imp.id, updated_at: agora });
      if (j.metricasAdv) est.push({ jogo_id, lado: 'adversario', equipa: j.equipaAdv, metricas: j.metricasAdv, importacao_id: imp.id, updated_at: agora });
    }
    await App.db.upsert('estatisticas_equipa', est, 'jogo_id,lado');
    terminarImportacao(`${A.jogos.length} ${A.jogos.length === 1 ? 'jogo importado' : 'jogos importados'} (${novos} ${novos === 1 ? 'novo' : 'novos'}).`, avisoFicheiro);
  } catch (err) { btn.disabled = false; btn.textContent = 'Tentar outra vez'; toast(err.message, 'erro'); }
}

async function importarJogadores(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const { novos, avisoFicheiro } = await gravarJogadores(A, App.imp.ficheiro);
    terminarImportacao(A.umJogador ? `${A.linhas.length} jogos de ${A.linhas[0].jogador} importados${novos ? ` (${novos} ${novos === 1 ? 'jogo novo criado' : 'jogos novos criados'})` : ''}.` : `${A.linhas.length} registos de jogadores importados.`, avisoFicheiro);
  } catch (err) { btn.disabled = false; btn.textContent = 'Tentar outra vez'; toast(err.message, 'erro'); }
}

// Grava uma análise de jogadores (um ficheiro). Devolve o número de jogos novos criados.
async function gravarJogadores(A, ficheiro) {
  const { imp, avisoFicheiro } = await registarImportacao('jogadores', A.linhas.length, { jogador: A.umJogador ? A.linhas[0]?.jogador : null, jogos_novos: A.nNovos || 0 }, ficheiro);
  const agora = new Date().toISOString();
  // 1) Jogos novos (de outras competições) e 2) datas em falta nos jogos que vieram do ficheiro da liga.
  const novos = [...new Set(A.linhas.filter(l => l.novoJogo).map(l => l.novoJogo))];
  if (novos.length) {
    const guardados = await App.db.upsert('jogos', novos.map(j => ({ data: j.data, adversario: j.adversario, competicao: j.competicao, local: j.local, golos_marcados: j.golos_marcados, golos_sofridos: j.golos_sofridos })), 'data,adversario');
    for (const l of A.linhas) if (l.novoJogo) l.jogo_id = guardados.find(g => g.data === l.novoJogo.data && norm(g.adversario) === norm(l.novoJogo.adversario))?.id;
  }
  for (const l of A.linhas) {
    const patch = { ...(l.atualizaData ? { data: l.atualizaData } : {}), ...(l.resultadoNovo || {}) };
    if (l.jogo_id && Object.keys(patch).length) await App.db.atualizar('jogos', { id: l.jogo_id }, patch);
  }
  await App.db.upsert('estatisticas_jogador', A.linhas.filter(l => l.jogo_id).map(l => ({
    jogo_id: l.jogo_id, jogador: l.jogador, lado: l.lado, equipa: l.equipa, posicao: l.posicao, minutos: l.minutos, metricas: l.metricas, importacao_id: imp.id, updated_at: agora
  })), 'jogo_id,jogador,lado');
  return { novos: new Set(novos.map(j => `${j.data}|${norm(j.adversario)}`)).size, avisoFicheiro };
}

function chaveDoNome(nome) { const pj = App.d.plantel.find(p => norm(p.nome) === norm(nome)); return pj ? chaveEstat(pj) : nome; }

// ---- Vários ficheiros de jogadores de uma vez ----
async function lerLote(fs) {
  const I = App.imp; const lote = [];
  for (const f of fs) {
    const item = { ficheiro: f, jogadorNome: adivinharJogador(f.name) };
    try {
      const linhas = await lerFicheiroTabela(f); if (!linhas.length) throw new Error('o ficheiro está vazio');
      item.tab = prepararTabela(linhas, PAPEIS_JOGADOR);
    } catch (err) { item.erro = err.message; }
    lote.push(item);
  }
  Object.assign(I, { lote, tab: null, ficheiro: null, analise: null, jogoId: null });
  desenharImportacao();
}
function analisarItem(item) {
  item.analise = null; if (item.erro) return;
  const T = item.tab;
  if ((T.papeis.data === null || T.papeis.data === undefined) && (T.papeis.jogo === null || T.papeis.jogo === undefined)) { item.problema = 'sem datas nem jogos: importe este ficheiro sozinho para escolher o jogo'; return; }
  if ((T.papeis.jogador === null || T.papeis.jogador === undefined) && !item.jogadorNome) { item.problema = 'indique o jogador'; return; }
  item.problema = null;
  item.analise = analisarJogadores(T, App.cfg, App.d.mapas, App.d.jogos, { jogoId: null, ladoPadrao: 'nos', jogador: chaveDoNome(item.jogadorNome), criarJogos: true });
}
function desenharLote() {
  const I = App.imp; const lote = I.lote;
  lote.forEach(analisarItem);
  const validos = lote.filter(it => it.analise?.linhas.length);
  const estado = it => it.erro ? `<span class="erro-txt">Não consegui ler: ${esc(it.erro)}</span>` : it.problema ? `<span class="erro-txt">${esc(it.problema)}</span>`
    : !it.analise.linhas.length ? `<span class="erro-txt">Sem jogos desta época com a vossa equipa${it.analise.avisos[0] ? `: ${esc(it.analise.avisos[0])}` : ''}</span>`
    : `${it.analise.linhas.length} ${it.analise.linhas.length === 1 ? 'jogo' : 'jogos'}${it.analise.nNovos ? `, ${it.analise.nNovos} ${it.analise.nNovos === 1 ? 'jogo novo' : 'jogos novos'}` : ''}`;
  const semJogadorCol = it => it.tab && (it.tab.papeis.jogador === null || it.tab.papeis.jogador === undefined);
  $('#i-analise').innerHTML = `
    <h2>${lote.length} ficheiros</h2>
    <p class="nota">O jogador de cada ficheiro é sugerido pelo nome do ficheiro: confirme antes de importar. Cada ficheiro traz a época toda do jogador, por isso importar outra vez atualiza os jogos que já existiam.</p>
    <div class="tabela-env"><table class="tabela compacta lote">
      <thead><tr><th>Ficheiro</th><th>Jogador</th><th>Estado</th></tr></thead>
      <tbody>${lote.map((it, k) => `<tr><td>${esc(it.ficheiro.name)}</td>
        <td>${semJogadorCol(it) ? `<input data-lote="${k}" list="i-jogadores" value="${esc(it.jogadorNome || '')}" autocomplete="off" placeholder="Nome do jogador" aria-label="Jogador de ${esc(it.ficheiro.name)}">` : '<span class="fraco">vários (coluna do ficheiro)</span>'}</td>
        <td>${estado(it)}</td></tr>`).join('')}</tbody>
    </table></div>

async function importarLote(btn) {
  const I = App.imp; const itens = I.lote.filter(it => it.analise?.linhas.length);
  btn.disabled = true; let feitos = 0, jogos = 0, novos = 0; const falhas = [], avisos = [];
  for (const it of itens) {
    btn.textContent = `A importar ${feitos + falhas.length + 1} de ${itens.length}…`;
    try {
      analisarItem(it); // com os jogos já atualizados pelos ficheiros anteriores
      if (!it.analise?.linhas.length) throw new Error('sem jogos');
      const r = await gravarJogadores(it.analise, it.ficheiro);
      feitos++; jogos += it.analise.linhas.length; novos += r.novos; if (r.avisoFicheiro) avisos.push(r.avisoFicheiro);
      await carregarDados();
    } catch (err) { falhas.push(`${it.jogadorNome || it.ficheiro.name} (${err.message})`); }
  }
  I.lote = null;
  if (falhas.length) toast(`Não foi possível importar: ${falhas.join('; ')}`, 'erro');
  terminarImportacao(`${feitos} ${feitos === 1 ? 'jogador importado' : 'jogadores importados'} (${jogos} registos de jogos${novos ? `, ${novos} ${novos === 1 ? 'jogo novo' : 'jogos novos'}` : ''}).`, avisos[0]);
}

async function importarLiga(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  // O ficheiro fica na época selecionada (os dados em memória — e o que é substituído — são só dessa época).
  const E = App.epoca;
  try {
    const todos = [...A.jogos, ...A.porJogar];
    const { imp, avisoFicheiro } = await registarImportacao('liga', A.liga.length, { equipa: A.nossa, jogos: A.jogos.length, por_jogar: A.porJogar.length });
    // Jogos da vossa equipa: mantém o que já estava registado (data, notas) quando o ficheiro não traz o valor.
    const ex = {}; for (const j of App.d.jogos) ex[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`] = j;
    const linhasJogos = todos.map(j => {
      const e = ex[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`] || {};
      return { epoca: E, competicao: j.competicao, jornada: j.jornada, adversario: e.adversario || j.adversario, data: e.data ?? null, local: j.local ?? e.local ?? null,
        golos_marcados: j.golos_marcados ?? e.golos_marcados ?? null, golos_sofridos: j.golos_sofridos ?? e.golos_sofridos ?? null };
    });
    const guardados = await App.db.upsert('jogos', linhasJogos, 'epoca,competicao,jornada,adversario');
    const idPor = {}; for (const g of guardados) idPor[`${norm(g.competicao)}|${g.jornada}|${norm(g.adversario)}`] = g.id;
    const agora = new Date().toISOString(); const est = [];
    for (const j of A.jogos) {
      const jogo_id = idPor[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`]; if (!jogo_id) continue;
      est.push({ jogo_id, lado: 'nos', equipa: j.equipaNos, metricas: j.metricasNos, importacao_id: imp.id, updated_at: agora });
      if (j.metricasAdv) est.push({ jogo_id, lado: 'adversario', equipa: j.equipaAdv, metricas: j.metricasAdv, importacao_id: imp.id, updated_at: agora });
    }
    if (est.length) await App.db.upsert('estatisticas_equipa', est, 'jogo_id,lado');
    await App.db.upsert('estatisticas_liga', A.liga.map(r => ({
      epoca: E, competicao: r.competicao, jornada: r.jornada, equipa: r.equipa, adversario: r.adversario, local: r.local,
      golos: r.golos, golos_sofridos: r.golos_sofridos, metricas: r.metricas, importacao_id: imp.id, updated_at: agora
    })), 'epoca,competicao,jornada,equipa,adversario');
    // Acrescenta/atualiza; nunca apaga outras jornadas. Só sai um registo antigo quando a mesma equipa, na mesma jornada,
    // aparece no ficheiro com outro adversário (o jogo foi corrigido).
    const novas = new Set(A.liga.map(r => `${norm(r.competicao)}|${r.jornada}|${norm(r.equipa)}|${norm(r.adversario)}`));
    const eqJor = new Set(A.liga.map(r => `${norm(r.competicao)}|${r.jornada}|${norm(r.equipa)}`));
    const antigos = (App.d.liga || []).filter(r => !r.deTeamStats && eqJor.has(`${norm(r.competicao)}|${r.jornada}|${norm(r.equipa)}`) && !novas.has(`${norm(r.competicao)}|${r.jornada}|${norm(r.equipa)}|${norm(r.adversario)}`));
    for (const r of antigos) await App.db.apagar('estatisticas_liga', { id: r.id });
    // Jogos do campeonato: atualiza jornada e resultado; remove os que já não existem e não têm oportunidades codificadas.
    try {
      const nossaChave = j => `${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`;
      const linhasP = A.partidas.map(p => {
        const nossa = norm(p.casa) === norm(A.nossa) || mesmaEquipa(p.casa, A.nossa) ? 'casa' : norm(p.fora) === norm(A.nossa) || mesmaEquipa(p.fora, A.nossa) ? 'fora' : null;
        const jogo_id = nossa ? idPor[nossaChave({ competicao: p.competicao, jornada: p.jornada, adversario: nossa === 'casa' ? p.fora : p.casa })] || null : null;
        return { ...p, epoca: E, jogo_id, updated_at: agora };
      });
      await App.db.upsert('partidas', linhasP, 'epoca,competicao,casa,fora');
      const chavesP = new Set(linhasP.map(p => `${norm(p.competicao)}|${norm(p.casa)}|${norm(p.fora)}`));
      const comps = new Set(linhasP.map(p => norm(p.competicao)));
      const comEventos = new Set(App.d.eventos.map(e => e.partida_id).filter(Boolean));
      // Só sai um jogo antigo da mesma jornada em que uma das equipas joga outro jogo no ficheiro (e sem codificação).
      const eqNaJornada = new Set(linhasP.flatMap(p => [`${norm(p.competicao)}|${p.jornada}|${norm(p.casa)}`, `${norm(p.competicao)}|${p.jornada}|${norm(p.fora)}`]));
      for (const p of App.d.partidas.filter(p => comps.has(norm(p.competicao)) && !chavesP.has(`${norm(p.competicao)}|${norm(p.casa)}|${norm(p.fora)}`) && !comEventos.has(p.id)
        && (eqNaJornada.has(`${norm(p.competicao)}|${p.jornada}|${norm(p.casa)}`) || eqNaJornada.has(`${norm(p.competicao)}|${p.jornada}|${norm(p.fora)}`)))) await App.db.apagar('partidas', { id: p.id });
    } catch (err) {
      if (/partidas/i.test(err.message)) toast('Os jogos do campeonato não foram guardados: corra outra vez o schema.sql no Supabase para os poder codificar.', 'erro'); else throw err;
    }
    // A equipa escolhida passa a ser reconhecida nas próximas importações.
    const nomes = [App.cfg.nome_clube, ...(App.cfg.nomes_alternativos || [])].map(norm);
    if (!nomes.includes(norm(A.nossa))) {
      const patch = App.cfg.nome_clube ? { nomes_alternativos: [...(App.cfg.nomes_alternativos || []), A.nossa] } : { nome_clube: A.nossa };
      await App.db.upsert('configuracao', [{ id: 1, ...patch, updated_at: agora }], 'id');
    }
    terminarImportacao(`${A.jogos.length} jogos de ${A.nossa} e ${A.liga.length} registos da liga importados${antigos.length ? `; ${antigos.length} ${antigos.length === 1 ? 'jogo corrigido (a equipa tinha outro adversário nessa jornada)' : 'jogos corrigidos (as equipas tinham outro adversário nessas jornadas)'}` : ''}.`, avisoFicheiro);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Tentar outra vez';
    toast(/estatisticas_liga|jornada|importacoes_tipo/i.test(err.message) ? 'A base de dados precisa de ser atualizada para este ficheiro. Corra outra vez o schema.sql no Supabase (SQL Editor).' : err.message, 'erro');
  }
}

// "Player_stats_Volnei.xlsx" -> "Volnei" (procura no plantel pelo nome, apelido ou nome no Wyscout).
function adivinharJogador(ficheiro) {
  const n = norm(ficheiro.replace(/\.[^.]+$/, '').replace(/player|stats|estatisticas|jogador|wyscout/gi, ' '));
  if (!n) return null;
  const pj = App.d.plantel.find(p => [p.nome, p.nome_wyscout].filter(Boolean).some(x => n.includes(norm(x))))
    || App.d.plantel.find(p => { const partes = norm(p.nome).split(' '); return partes.length > 1 && n.split(' ').includes(partes[partes.length - 1]); });
  if (pj) return pj.nome;
  // Só o primeiro nome no ficheiro: aceita se corresponder a um único jogador do plantel.
  const pelo1 = App.d.plantel.filter(p => n.split(' ').includes(norm(p.nome).split(' ')[0]));
  if (pelo1.length === 1) return pelo1[0].nome;
  const palavras = ficheiro.replace(/\.[^.]+$/, '').replace(/player|stats|estat[ií]sticas|jogador|wyscout/gi, ' ').split(/[_\s-]+/).filter(Boolean);
  return palavras.length ? palavras.join(' ') : null;
}

async function importarFolha(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const { imp, avisoFicheiro } = await registarImportacao('oportunidades', A.registos.length, { jogos_novos: A.novos.length });
    // 1) Jogos que faltavam no ficheiro da liga.
    if (A.novos.length) {
      const criados = await App.db.upsert('partidas', A.novos.map(p => ({ epoca: App.epoca, competicao: p.competicao, jornada: p.jornada, casa: p.casa, fora: p.fora })), 'epoca,competicao,casa,fora');
      for (const p of A.novos) p.id = criados.find(c => norm(c.casa) === norm(p.casa) && norm(c.fora) === norm(p.fora))?.id;
    }
    // 2) Treinadores de cada equipa em cada jogo.
    const porPartida = {};
    for (const [k, nome] of A.treinadores) {
      const [chave, lado] = [k.slice(0, k.lastIndexOf('|')), k.slice(k.lastIndexOf('|') + 1)];
      const id = chave.startsWith('n:') ? A.novos.find(p => `n:${p.jornada}|${norm(p.casa)}|${norm(p.fora)}` === chave)?.id : chave;
      if (id) (porPartida[id] ||= {})[lado === 'casa' ? 'treinador_casa' : 'treinador_fora'] = nome;
    }
    for (const [id, patch] of Object.entries(porPartida)) await App.db.atualizar('partidas', { id }, patch);
    // 3) Substitui as oportunidades que vieram antes da folha nos mesmos jogos.
    const ids = [...new Set(A.registos.map(r => r.partida.id).filter(Boolean))];
    for (const id of ids) for (const origem of ['folha', 'folha_z']) await App.db.apagar('eventos', { partida_id: id, origem });
    // 4) Oportunidades (ligadas ao jogo do SCUT quando é o caso).
    const linhas = A.registos.filter(r => r.partida.id).map(r => {
      const { partida, lado, ...ev } = r;
      const jogo_id = partida.jogo_id || null;
      return { ...ev, partida_id: partida.id, jogo_id, lado: jogo_id ? (eNossaEquipa(r.equipa) ? 'nos' : 'adversario') : null };
    });
    await App.db.inserirVarios('eventos', linhas);
    terminarImportacao(`${linhas.length} oportunidades importadas.`, avisoFicheiro);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Tentar outra vez';
    toast(/partida|sub_momento|origem|column|importacoes_tipo/i.test(err.message) ? 'A base de dados precisa de ser atualizada. Corra outra vez o schema.sql no Supabase (SQL Editor).' : err.message, 'erro');
  }
}

// Um ficheiro só, da vossa equipa (ou o ficheiro da liga), segue a importação normal; os restantes são Team stats de outras equipas.
async function lerTeamStatsEquipas(fs) {
  const I = App.imp; const id = criarIdentificador(App.cfg, App.d.mapas || []);
  const itens = [];
  for (const f of fs) {
    let linhas, an;
    try { linhas = await lerFicheiroTabela(f); an = analisarTeamStats(linhas); } catch (e) { itens.push({ f, erro: 'Não foi possível ler o ficheiro.' }); continue; }
    if (an.erro || !an.jogos.length) { itens.push({ f, linhas, erro: an.erro || 'Sem jogos.' }); continue; }
    const eq = equipaDoTeamStats(an);
    itens.push({ f, linhas, an, eq, nossa: !!eq && id.eNos(eq) });
  }
  // Um só ficheiro que não é Team stats de outra equipa: importação normal (vossa equipa ou ficheiro da liga).
  if (fs.length === 1 && (itens[0].nossa || itens[0].erro)) { I.loteAdv = null; return lerFicheiro(fs[0]); }
  I.lote = null; I.tab = null; I.ficheiro = null; I.loteAdv = itens;
  desenharImportacao();
}

    ${itens.map(it => `<tr><td>${esc(it.f.name)}</td>${it.erro ? `<td colspan="4" class="erro-txt">${esc(it.erro)}</td>`
      : it.nossa ? `<td colspan="4" class="fraco">${esc(it.eq)}: é a vossa equipa. Importe este ficheiro sozinho para entrar nos vossos jogos.</td>`
      : `<td><b>${esc(it.eq)}</b></td><td class="num">${it.registos.length}</td><td>${it.registos.length ? datas(it.registos) : '–'}</td><td>${esc([...new Set(it.registos.map(r => nomeCompCurto(r.competicao)).filter(Boolean))].join(', '))}</td>`}</tr>`).join('')}
    </tbody></table></div>
    <div class="acoes-esq"><button class="btn btn-prim" id="i-adv-ok" ${validos.length ? '' : 'disabled'}>Importar ${validos.length} ${validos.length === 1 ? 'equipa' : 'equipas'} (${validos.reduce((s, it) => s + it.registos.length, 0)} jogos)</button><button class="btn" id="i-adv-cancelar">Cancelar</button></div>`;
  $('#i-adv-cancelar').addEventListener('click', () => { I.loteAdv = null; desenharImportacao(); });
  $('#i-adv-ok').addEventListener('click', async e => {
    e.target.disabled = true; e.target.textContent = 'A importar…';
    try {
      for (const it of validos) {
        await App.db.upsert('estatisticas_adversario', it.registos, 'epoca,equipa,data,adversario');
        try { await registarImportacao('equipa', it.registos.length, { equipa: it.eq, adversario: true }, it.f); } catch { /* o histórico é opcional */ }
      }
      toast(`${validos.length} ${validos.length === 1 ? 'equipa importada' : 'equipas importadas'} (${validos.reduce((s, it) => s + it.registos.length, 0)} jogos).`);
      I.loteAdv = null; await recarregar(); desenharImportacao();
    } catch (err) { e.target.disabled = false; e.target.textContent = 'Importar'; toast(traduzErro(err.message || String(err)), 'erro'); }
  });
}

</script>
</body>
</html>
