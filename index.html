        <div>
          <p class="ficha-tipo">Ficha individual</p>
          <h1>${esc(nomeVisivel(J.nome))}</h1>
          ${meta ? `<p class="ficha-meta">${esc(meta)}</p>` : ''}
          <p class="nota">${esc(descricaoFiltros(js))}${pj?.nome_wyscout && pj.nome_wyscout !== pj.nome ? ` · no Wyscout: ${esc(pj.nome_wyscout)}` : ''}${pj?.tm_url && /^https:\/\/([\w-]+\.)?transfermarkt\./.test(pj.tm_url) ? ` · <a class="so-ecra" href="${esc(pj.tm_url)}" target="_blank" rel="noopener">Ver no Transfermarkt</a>` : ''}</p>
        </div>
      </div>
      <div class="ficha-acoes so-ecra">
        <label>Jogador<select id="f-jogador">${nomes.map(n => `<option value="${esc(n)}" ${n === J.nome ? 'selected' : ''}>${esc(nomeVisivel(n))}</option>`).join('')}</select></label>
        ${pode() ? `<button class="btn" id="f-editar">${pj ? 'Editar dados' : 'Adicionar ao plantel'}</button>` : ''}
        ${pj?.tm_url && tmDisponivel() ? '<button class="btn" id="f-tm">Atualizar do Transfermarkt</button>' : ''}
        <button class="btn botao-pdf" id="b-pdf">${iconePdf()}Exportar PDF</button>
      </div>
    </div>
    ${pj?.notas ? `<p class="ficha-notas">${esc(pj.notas)}</p>` : ''}
    ${htmlFiltros(comps)}
    ${p ? `
      <section class="placar" id="f-placar" aria-label="Resumo do jogador"></section>
      <section class="bloco" id="f-perfil"></section>
      <section class="bloco" id="f-evolucao"></section>
      <section class="bloco" id="f-oportunidades"></section>
      <section class="bloco" id="f-jogos"></section>`
      : `<div class="vazio"><p>${esc(nomeVisivel(J.nome))} não tem estatísticas com estes filtros.</p>${pj && !pj.nome_wyscout ? '<p>Se já tem jogos importados, indique o nome usado no Wyscout em "Editar dados".</p>' : ''}</div>`}`;

  ligarFiltros(v, 'jogadores');
  $('#f-jogador').addEventListener('change', e => { J.nome = e.target.value; J.metrica = null; desenharFicha(); });
  $('#b-pdf').addEventListener('click', () => exportarPdf(`Ficha ${nomeVisivel(J.nome)} ${hojeIso()}`));
  $('#f-voltar').addEventListener('click', e => { e.preventDefault(); J.modo = 'plantel'; mostrarVista('jogadores'); });
  $('#f-tm')?.addEventListener('click', e => tmAtualizarJogador(pj, e.currentTarget));
  $('#f-editar')?.addEventListener('click', () => dialogoJogador(pj || { nome: J.nome, nome_wyscout: J.nome, posicao: posicaoLonga(p?.posicao) }));
  if (!p) return;

  const disponiveis = mets.filter(m => Number.isFinite(p.tot[m]) || p.minPond[m]);
  if (!J.metricas || !J.metricas.some(m => disponiveis.includes(m))) {
    J.metricas = [...PADRAO_JOG, 'Shots', 'Passes', 'Passes / accurate %', 'Duels / won %', 'Dribbles', 'Interceptions', 'Touches in penalty area', 'Crosses']
      .filter((m, i, a) => disponiveis.includes(m) && a.indexOf(m) === i);
    if (J.metricas.length < 4) J.metricas = disponiveis.slice(0, 10);
  }
  desenharPlacarJogador(p, js, regs);
  desenharPerfil(p, jogadores, disponiveis, sector);
  desenharEvolucao(regs, disponiveis);
  desenharOportunidadesJogador(js);
  desenharJogoAJogo(regs);
}

function desenharPlacarJogador(p, js, regs) {
  const possiveis = js.length * 90;
  const titular = regs.filter(r => Number(r.minutos) >= 60).length;
  const cel = (rot, val, sub = '') => `<div class="placar-cel"><span class="placar-rot">${rot}</span><span class="placar-val">${val}</span>${sub ? `<span class="placar-sub">${sub}</span>` : ''}</div>`;
  const tot = k => Number.isFinite(p.tot[k]) ? p.tot[k] : null;
  const p90 = k => (tot(k) !== null && p.minutos > 0 ? tot(k) / p.minutos * 90 : null);
  const g = tot('Goals'), a = tot('Assists');
  $('#f-placar').innerHTML = [
    cel('Jogos', p.jogos, `${titular} com 60+ minutos`),
    cel('Minutos', fmtNum(p.minutos, 0), possiveis ? `${fmtNum(p.minutos / possiveis * 100, 0)}% dos possíveis` : ''),
    g !== null ? cel('Golos', fmtNum(g, 0), `${fmtNum(p90('Goals'), 2)} por 90 min`) : '',
    a !== null ? cel('Assistências', fmtNum(a, 0), `${fmtNum(p90('Assists'), 2)} por 90 min`) : '',
    tot('xG') !== null ? cel('xG', fmtNum(tot('xG'), 2), `${fmtNum(p90('xG'), 2)} por 90 min`) : '',
    tot('xA') !== null ? cel('xA', fmtNum(tot('xA'), 2), `${fmtNum(p90('xA'), 2)} por 90 min`) : ''
  ].join('');
}

function desenharPerfil(p, jogadores, disponiveis, sector) {
  const J = App.jog; const el = $('#f-perfil');
  const maxMin = Math.max(...jogadores.map(x => x.minutos));
  const minimo = Math.min(270, Math.round(maxMin * 0.25));
  let grupo = jogadores.filter(x => x.minutos >= minimo || x.nome === p.nome);
  const sectorDe = x => sectorPosicao(jogadorDoPlantel(x.nome)?.posicao) || sectorPosicao(x.posicao);
  const temSector = sector && grupo.filter(x => sectorDe(x) === sector).length >= 3;
  if (J.comparar === 'posicao' && temSector) grupo = grupo.filter(x => sectorDe(x) === sector || x.nome === p.nome);
  const comparaPos = J.comparar === 'posicao' && temSector;

  const linhas = J.metricas.filter(m => disponiveis.includes(m)).map(m => {
    const vals = grupo.map(x => ({ nome: x.nome, v: valorJogador(x, m, true) })).filter(x => x.v !== null);
    const meu = valorJogador(p, m, true);
    if (meu === null || vals.length < 2) return null;
    const lista = vals.map(x => x.v);
    const mn = Math.min(...lista), mx = Math.max(...lista), md = media(lista);
    const pos = 1 + lista.filter(x => x > meu + 1e-9).length; // empates partilham a posição
    const esc01 = x => mx === mn ? 50 : (x - mn) / (mx - mn) * 100;
    return { m, meu, mn, mx, md, pos, n: vals.length, pMeu: esc01(meu), pMd: esc01(md) };
  }).filter(Boolean);

  el.innerHTML = `
    <div class="bloco-cab"><h2>Perfil no plantel</h2>
      <div class="alternar so-ecra" role="radiogroup" aria-label="Comparar com">
        <label class="chip"><input type="radio" name="comparar" value="posicao" ${comparaPos ? 'checked' : ''} ${temSector ? '' : 'disabled'}><span>${esc(sector || 'Mesma posição')}</span></label>
        <label class="chip"><input type="radio" name="comparar" value="plantel" ${comparaPos ? '' : 'checked'}><span>Todo o plantel</span></label>
      </div>
    </div>
    <p class="nota">Valores por 90 minutos (percentagens: média ponderada). Comparação com ${comparaPos ? `os ${({ 'Guarda-redes': 'guarda-redes', Defesa: 'defesas', 'Médio': 'médios', 'Avançado': 'avançados' })[sector]}` : 'todo o plantel'} com pelo menos ${minimo} minutos neste período (${grupo.length} jogadores). A posição no ranking ordena do valor mais alto para o mais baixo; se isso é bom depende da métrica.</p>
    ${linhas.length ? `<div class="perfil">
      <div class="perfil-cab" aria-hidden="true"><span>Métrica</span><span class="num">${esc(nomeVisivel(p.nome).split(' ')[0])}</span><span>Do mínimo ao máximo do grupo</span><span class="num">Ranking</span></div>
      ${linhas.map(l => `<div class="perfil-linha">
        <span class="perfil-met">${esc(l.m)}</span>
        <span class="num perfil-val">${fmtNum(l.meu, ePercentagem(l.m) ? 1 : 2)}</span>
        <span class="faixa" role="img" aria-label="${esc(l.m)}: ${fmtNum(l.meu, 2)}; média do grupo ${fmtNum(l.md, 2)}; entre ${fmtNum(l.mn, 2)} e ${fmtNum(l.mx, 2)}">
          <span class="faixa-min">${fmtNum(l.mn, ePercentagem(l.m) ? 0 : 2)}</span>
          <span class="faixa-pista"><i class="faixa-media" style="left:${l.pMd}%" title="Média do grupo: ${fmtNum(l.md, 2)}"></i><i class="faixa-ponto" style="left:${l.pMeu}%"></i></span>
          <span class="faixa-max">${fmtNum(l.mx, ePercentagem(l.m) ? 0 : 2)}</span>
        </span>
        <span class="num perfil-pos"><b>${l.pos}.º</b> de ${l.n}</span>
      </div>`).join('')}
    </div>
    <div class="legenda-campo"><span><i class="leg-ponto"></i>${esc(nomeVisivel(p.nome))}</span><span><i class="leg-media"></i>Média do grupo</span></div>` : '<p class="fraco">Não há dados suficientes para comparar.</p>'}
    <details class="escolher-metricas so-ecra"><summary>Escolher métricas (${J.metricas.length})</summary>
      <div class="chips-lista">${disponiveis.map(m => `<label class="chip-check"><input type="checkbox" value="${esc(m)}" ${J.metricas.includes(m) ? 'checked' : ''}><span>${esc(m)}</span></label>`).join('')}</div>
    </details>`;
  $$('input[name=comparar]', el).forEach(r => r.addEventListener('change', () => { J.comparar = r.value; desenharPerfil(p, jogadores, disponiveis, sector); }));
  $$('.escolher-metricas input', el).forEach(c => c.addEventListener('change', () => {
    J.metricas = $$('.escolher-metricas input:checked', el).map(x => x.value);
    if (!J.metricas.length) J.metricas = [c.value];
    desenharPerfil(p, jogadores, disponiveis, sector); $('#f-perfil .escolher-metricas').open = true;
    desenharJogoAJogo(App.jog._regs);
  }));
}

function desenharEvolucao(regs, disponiveis) {
  const J = App.jog; const el = $('#f-evolucao');
  if (!J.metrica || !disponiveis.includes(J.metrica)) J.metrica = J.metricas.find(m => disponiveis.includes(m)) || disponiveis[0];
  const k = J.metrica;
  const vals = regs.map(r => Number.isFinite(r.metricas?.[k]) ? r.metricas[k] : null);
  const ult = media(vals.slice(-5)), tot = media(vals);
  App.graficos = App.graficos.filter(g => { if (g.canvas.closest('#f-evolucao')) { g.destroy(); return false; } return true; });
  el.innerHTML = `
    <div class="bloco-cab"><h2>Evolução: ${esc(k)}</h2>
      <label class="em-linha so-ecra">Métrica<select id="f-met">${disponiveis.map(m => `<option ${m === k ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
    </div>
    <p class="destaque">Média por jogo nos últimos ${Math.min(5, vals.filter(Number.isFinite).length)} jogos: <b>${fmtNum(ult, 2)}</b>, contra <b>${fmtNum(tot, 2)}</b> no período.</p>
    <div class="grafico"><canvas aria-label="${esc(k)} por jogo"></canvas></div>
    <h3>Minutos por jogo</h3>
    <div class="grafico baixo"><canvas aria-label="Minutos por jogo"></canvas></div>`;
  $('#f-met', el).addEventListener('change', e => { J.metrica = e.target.value; desenharEvolucao(regs, disponiveis); });
  const labels = regs.map(r => rotuloJogo(r.jogo, true));
  const [c1, c2] = $$('canvas', el);
  const opBarras = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, tooltip: OPCOES_LINHA.plugins.tooltip } };
  novoGrafico(c1, {
    type: 'bar',
    data: { labels, datasets: [{ label: k, data: vals, backgroundColor: COR.nos, borderRadius: 4, maxBarThickness: 30 }] },
    options: { ...opBarras, scales: eixos() }
  });
  novoGrafico(c2, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Minutos', data: regs.map(r => r.minutos), backgroundColor: '#9AA6B8', borderRadius: 3, maxBarThickness: 30 }] },
    options: { ...opBarras, scales: { ...eixos(), y: { ...eixos().y, max: Math.max(90, ...regs.map(r => Number(r.minutos) || 0)), ticks: { stepSize: 45 } } } }
  });
}

function desenharOportunidadesJogador(js) {
  const nome = App.jog.nome; const el = $('#f-oportunidades');
  const ids = new Set(js.map(j => j.id));
  const pj = jogadorDoPlantel(nome);
  const aceites = new Set([nome, pj?.nome, pj?.nome_wyscout].filter(Boolean).map(norm));
  const e1 = x => aceites.has(norm(x));
  const evs = App.d.eventos.filter(e => ids.has(e.jogo_id) && e.lado === 'nos');
  const fin = evs.filter(e => e.tipo === 'oportunidade' && e1(e.jogador));
  const ass = evs.filter(e => e.tipo === 'oportunidade' && e1(e.assistente));
  const et = evs.filter(e => e.tipo === 'esquema_tatico' && e1(e.jogador));
  if (!fin.length && !ass.length && !et.length) {
    el.innerHTML = `<h2>Oportunidades codificadas</h2><p class="fraco">Sem oportunidades codificadas com ${esc(nomeVisivel(nome))} como finalizador ou assistente neste período.</p>`;
    return;
  }
  const golos = fin.filter(e => e.resultado === 'Golo').length;
  const grandes = fin.filter(e => e.qualidade === 'Grande oportunidade');
  const contar = (lista, campo) => Object.entries(lista.reduce((a, e) => { const k = e[campo] || 'Sem indicação'; a[k] = (a[k] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]);
  el.innerHTML = `
    <h2>Oportunidades codificadas</h2>
    <p class="destaque">Finalizou <b>${fin.length}</b> ${fin.length === 1 ? 'oportunidade' : 'oportunidades'} e marcou <b>${golos}</b>${fin.length ? ` (${fmtNum(golos / fin.length * 100, 0)}%)` : ''}. Em grandes oportunidades: ${grandes.filter(e => e.resultado === 'Golo').length} de ${grandes.length}. Assistiu para ${ass.length} ${ass.length === 1 ? 'oportunidade' : 'oportunidades'}${et.length ? `; participou em ${et.length} ${et.length === 1 ? 'esquema tático' : 'esquemas táticos'}` : ''}.</p>
    <div class="dois-campos">
      <figure><figcaption><span class="ponto-cor nos"></span>Onde finalizou</figcaption>${campoSVG({ eventos: fin, metade: true })}${legendaCampo()}</figure>
      <div>
        <div class="tabela-env"><table class="tabela compacta"><thead><tr><th>Última ação</th><th class="num">Oport.</th></tr></thead>
          <tbody>${contar(fin, 'ultima_acao').map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('') || '<tr><td colspan="2" class="fraco">–</td></tr>'}</tbody></table></div>
        <div class="tabela-env"><table class="tabela compacta"><thead><tr><th>Finalização</th><th class="num">Oport.</th></tr></thead>
          <tbody>${contar(fin, 'finalizacao').map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('') || '<tr><td colspan="2" class="fraco">–</td></tr>'}</tbody></table></div>
      </div>
    </div>
    <p class="nota">Conta os eventos em que o nome do jogador foi registado como no plantel ou como no Wyscout.</p>`;
}

function desenharJogoAJogo(regs) {
  App.jog._regs = regs;
  const el = $('#f-jogos'); if (!el) return;
  const cols = App.jog.metricas.slice(0, 6);
  el.innerHTML = `
    <h2>Jogo a jogo</h2>
    <div class="tabela-env"><table class="tabela compacta">
      <thead><tr><th>Data</th><th>Adversário</th><th class="num">Res.</th><th>Pos.</th><th class="num">Min.</th>${cols.map(m => `<th class="num">${esc(m)}</th>`).join('')}</tr></thead>
      <tbody>${regs.slice().reverse().map(r => {
        const res = resultadoJogo(r.jogo);
        return `<tr><td>${fmtData(r.jogo.data)}</td><td>${esc(r.jogo.adversario)} ${r.jogo.local === 'casa' ? '(C)' : r.jogo.local === 'fora' ? '(F)' : ''}</td>
          <td class="num">${res ? `<span class="res res-${res}">${res}</span>${r.jogo.golos_marcados}–${r.jogo.golos_sofridos}` : '–'}</td>
          <td>${esc(r.posicao || '–')}</td><td class="num">${fmtNum(r.minutos, 0)}</td>
          ${cols.map(m => `<td class="num">${fmtNum(r.metricas?.[m], ePercentagem(m) ? 1 : 2)}</td>`).join('')}</tr>`;
      }).join('')}</tbody>
    </table></div>
    <p class="nota">Mostra as primeiras seis métricas escolhidas no perfil.</p>`;
}

// ---------- Plantel ----------
const POSICOES = ['Guarda-redes', 'Defesa central', 'Lateral direito', 'Lateral esquerdo', 'Médio defensivo', 'Médio centro', 'Médio ofensivo', 'Extremo direito', 'Extremo esquerdo', 'Ponta de lança'];
const SECTORES = [['Guarda-redes', 'Guarda-redes'], ['Defesa', 'Defesas'], ['Médio', 'Médios'], ['Avançado', 'Avançados'], [null, 'Sem posição']];
App.plantelPesquisa = '';

function indexarPlantel() {
  const idx = {};
  for (const pj of App.d.plantel) { idx[norm(pj.nome)] = pj; if (pj.nome_wyscout) idx[norm(pj.nome_wyscout)] = pj; }
  App.idx.plantelPorEstat = idx;
}

// Converte abreviaturas (do Wyscout ou portuguesas) para os nomes de posição usados no plantel.
function posicaoLonga(abrev) {
  const p = String(abrev || '').toUpperCase().replace(/[^A-Z]/g, '');
  const mapa = { GR: 0, GK: 0, DC: 1, CB: 1, RCB: 1, LCB: 1, DD: 2, RB: 2, RWB: 2, LD: 2, DE: 3, LB: 3, LWB: 3, LE: 3, MDC: 4, DMF: 4, RDMF: 4, LDMF: 4, MC: 5, CMF: 5, RCMF: 5, LCMF: 5, MO: 6, AMF: 6, RAMF: 6, LAMF: 6, ED: 7, RW: 7, RWF: 7, RM: 7, EE: 8, LW: 8, LWF: 8, LM: 8, PL: 9, CF: 9, ST: 9, FW: 9, SS: 9, CM: 5, DM: 4, AM: 6 };
  if (p in mapa) return POSICOES[mapa[p]];
  const ingles = { goalkeeper: 0, 'centre back': 1, 'center back': 1, 'right back': 2, 'left back': 3, 'defensive midfield': 4, 'central midfield': 5, 'attacking midfield': 6, 'right winger': 7, 'left winger': 8, 'centre forward': 9, 'center forward': 9, 'second striker': 9, 'right midfield': 7, 'left midfield': 8,
    'medio defensivo': 4, 'medio centro': 5, 'medio ofensivo': 6, 'extremo direito': 7, 'extremo esquerdo': 8, 'ponta de lanca': 9, 'avancado centro': 9, 'segundo avancado': 9, 'guarda redes': 0, 'defesa central': 1, 'defesa direito': 2, 'defesa esquerdo': 3, 'lateral direito': 2, 'lateral esquerdo': 3 }[norm(abrev)];
  if (ingles !== undefined) return POSICOES[ingles];
  return POSICOES.find(x => norm(x) === norm(abrev)) || null;
}

function desenharPlantel() {
  const v = $('#vista');
  const todos = App.d.plantel.slice().sort((a, b) => (a.numero ?? 999) - (b.numero ?? 999) || a.nome.localeCompare(b.nome, 'pt'));
  // Minutos e golos de cada jogador, para a linha de resumo do cartão.
  const resumo = {};
  for (const r of App.d.estJog) {
    if (r.lado !== 'nos') continue;
    const pj = jogadorDoPlantel(r.jogador); if (!pj) continue;
    const x = (resumo[pj.id] ||= { jogos: 0, min: 0, golos: 0 });
    if (Number(r.minutos) > 0) x.jogos++;
    x.min += Number(r.minutos) || 0; x.golos += Number(r.metricas?.Goals) || 0;
  }
  const semPlantel = [...new Set(App.d.estJog.filter(r => r.lado === 'nos').map(r => r.jogador))].filter(n => !jogadorDoPlantel(n));
  const q = norm(App.plantelPesquisa);
  const visiveis = q ? todos.filter(pj => norm(`${pj.nome} ${pj.nome_wyscout || ''} ${pj.numero ?? ''} ${pj.posicao || ''}`).includes(q)) : todos;

  const cartao = pj => {
    const r = resumo[pj.id];
    return `<button class="cartao-jogador" data-pj="${pj.id}">
      ${avatarJogador(pj)}
      <span class="cartao-texto">
        <b>${esc(pj.nome)}</b>
        <span class="cartao-meta">${esc(metaJogador(pj)) || '<span class="fraco">Sem dados</span>'}</span>
        ${r ? `<span class="cartao-estat">${r.jogos} ${r.jogos === 1 ? 'jogo' : 'jogos'} · ${fmtNum(r.min, 0)} min${r.golos ? ` · ${r.golos} ${r.golos === 1 ? 'golo' : 'golos'}` : ''}</span>` : ''}
      </span>
    </button>`;
  };

  v.innerHTML = `
    <div class="cabecalho-vista plantel-cab">
      <h1>Plantel</h1>
      <div class="plantel-acoes">
        <span class="fraco">${todos.length} ${todos.length === 1 ? 'jogador' : 'jogadores'}</span>
        ${pode() && !App.semPlantel ? `${tmDisponivel() ? '<button class="btn" id="p-tm">Importar do Transfermarkt</button>' : ''}<button class="btn" id="p-importar">Importar lista</button><button class="btn btn-prim" id="p-novo">Adicionar jogador</button>` : ''}
      </div>
    </div>
    ${App.semPlantel ? `<div class="avisos"><p>A tabela do plantel ainda não existe na base de dados. Corra outra vez o ficheiro <code>schema.sql</code> no Supabase (SQL Editor); os dados que já existem não são apagados.</p></div>` : ''}
    ${todos.length ? `<label class="pesquisa"><span class="sr">Procurar jogador</span><input type="search" id="p-pesquisa" placeholder="Procurar jogador" value="${esc(App.plantelPesquisa)}" autocomplete="off"></label>` : ''}
    ${pode() && semPlantel.length && !App.semPlantel ? `<div class="aviso-suave"><p><b>${semPlantel.length}</b> ${semPlantel.length === 1 ? 'jogador tem' : 'jogadores têm'} estatísticas mas não ${semPlantel.length === 1 ? 'está' : 'estão'} no plantel: ${esc(semPlantel.slice(0, 6).join(', '))}${semPlantel.length > 6 ? '…' : ''}</p><button class="btn" id="p-criar-estat">Adicionar ao plantel</button></div>` : ''}

// Reduz a fotografia a 240×240 px, recortada ao centro (cerca de 15 KB).
function reduzirFoto(ficheiro) {
  return new Promise((resolve, reject) => {
    // Aceita um ficheiro escolhido pelo utilizador ou uma imagem já em data URL (Transfermarkt).
    const img = new Image(); const eTexto = typeof ficheiro === 'string'; const url = eTexto ? ficheiro : URL.createObjectURL(ficheiro);
    const libertar = () => { if (!eTexto) URL.revokeObjectURL(url); };
    img.onload = () => {
      const t = 240, c = document.createElement('canvas'); c.width = c.height = t;
      const lado = Math.min(img.width, img.height);
      const sx = (img.width - lado) / 2, sy = Math.max(0, (img.height - lado) / 2 - lado * 0.08); // ligeiramente acima do centro: rostos
      c.getContext('2d').drawImage(img, sx, Math.min(sy, img.height - lado), lado, lado, 0, 0, t, t);
      libertar(); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { libertar(); reject(new Error('Não consegui ler a imagem.')); };
    img.src = url;
  });
}

function lerListaPlantel(linhas) {
  const P = {
    nome: /^(nome|name|jogador|player)$/i, numero: /^(n\.?º?|n[uú]mero|number|#|nr\.?)$/i, posicao: /^(posi[cç][aã]o|position|pos\.?)$/i,
    nasc: /^(data de nascimento|nascimento|date of birth|birth ?date|dob|nasc\.?)/i, idade: /^(idade|age)$/i,
    altura: /^(altura|height)/i, pe: /^(p[eé]( preferido)?|foot|p[eé] dominante)$/i, wy: /wyscout/i
  };
  let ih = -1, cab = [];
  for (let i = 0; i < Math.min(10, linhas.length); i++) {
    const c = linhas[i].map(x => String(x).trim());
    if (c.some(x => P.nome.test(x))) { ih = i; cab = c; break; }
  }
  if (ih < 0) return [];
  const col = k => cab.findIndex(x => P[k].test(x));
  const C = Object.fromEntries(Object.keys(P).map(k => [k, col(k)]));
  const pe = v => { const s = norm(v); return /^(dir|right|r$|d$)/.test(s) ? 'Direito' : /^(esq|left|l$|e$)/.test(s) ? 'Esquerdo' : /^(amb|both)/.test(s) ? 'Ambos' : null; };
  return linhas.slice(ih + 1).map(l => {
    const nome = String(l[C.nome] ?? '').trim(); if (!nome) return null;
    let nasc = C.nasc >= 0 ? parseData(String(l[C.nasc]).replace(/\s*\(\d+\)\s*$/, '') || l[C.nasc]) : null;
    if (!nasc && C.nasc >= 0 && l[C.nasc] instanceof Date) nasc = parseData(l[C.nasc]);
    const alt = C.altura >= 0 ? parseNum(String(l[C.altura]).replace(/m$/i, '').trim()) : null;
    return {
      nome, numero: C.numero >= 0 ? (parseNum(l[C.numero]) ?? null) : null,
      posicao: C.posicao >= 0 ? (posicaoLonga(l[C.posicao]) || String(l[C.posicao]).trim() || null) : null,
      data_nascimento: nasc,
      altura: alt === null ? null : Math.round(alt < 3 ? alt * 100 : alt),
      pe: C.pe >= 0 ? pe(l[C.pe]) : null,
      nome_wyscout: C.wy >= 0 ? String(l[C.wy] ?? '').trim() || null : null
    };
  }).filter(Boolean);
}

// ---------- Importar do Transfermarkt ----------
// Usa o serviço /api/transfermarkt (pasta api/ do projeto na Vercel), que lê a página
// do jogador ou da equipa e devolve os dados. Só existe na app publicada, ligada ao Supabase.
const tmDisponivel = () => App.db.modo === 'supabase' && !App.semPlantel && pode();

async function tmChamar(url) {
  const ses = await App.db.sb.auth.getSession();
  const token = ses.data.session ? ses.data.session.access_token : '';
  let r, j = null;
  try { r = await fetch('/api/transfermarkt?url=' + encodeURIComponent(url), { headers: { Authorization: 'Bearer ' + token } }); }
  catch { throw new Error('Não consegui ligar ao importador. Verifique a ligação à internet.'); }
  try { j = await r.json(); } catch { /* resposta sem JSON */ }
  if (r.status === 404 && !j) throw new Error('O importador não está publicado. Confirme que a pasta api/ (com transfermarkt.py) foi enviada para o GitHub e a Vercel.');
  if (!r.ok || !j || !j.ok) throw new Error(j && j.erro ? j.erro : 'O importador não respondeu. Tente daqui a pouco.');
  return j;
}

function posicaoTm(raw) {
  const direta = posicaoLonga(raw); if (direta) return direta;
  const t = norm(raw);
  const regras = [['Guarda-redes', ['guarda redes', 'goalkeeper']], ['Lateral direito', ['lateral dir', 'defesa dir', 'right back']], ['Lateral esquerdo', ['lateral esq', 'defesa esq', 'left back']],
    ['Defesa central', ['defesa central', 'centre back', 'center back']], ['Médio defensivo', ['medio defensivo', 'defensive midfield']], ['Médio ofensivo', ['medio ofensivo', 'attacking midfield']],
    ['Extremo direito', ['extremo direito', 'right wing', 'medio direito', 'right midfield']], ['Extremo esquerdo', ['extremo esquerdo', 'left wing', 'medio esquerdo', 'left midfield']],
    ['Ponta de lanca', ['ponta de lanca', 'centre forward', 'center forward', 'segundo avancado', 'second striker']], ['Médio centro', ['medio centro', 'central midfield', 'medio']]];
  for (const [pos, chaves] of regras) if (chaves.some(c => t.includes(c))) return pos === 'Ponta de lanca' ? 'Ponta de lança' : pos;
  if (t.startsWith('defesa')) return 'Defesa central';
  if (t.startsWith('avanc')) return 'Ponta de lança';
  return null;
}
function peTm(raw) { const t = norm(raw); return /^(dir|right)/.test(t) ? 'Direito' : /^(esq|left)/.test(t) ? 'Esquerdo' : /^(amb|both)/.test(t) ? 'Ambos' : null; }

// Procura o jogador no plantel: primeiro pelo ID do Transfermarkt, depois pelo nome.
function tmExistente(j) {
  return App.d.plantel.find(p => p.tm_id && j.transfermarktId && p.tm_id === String(j.transfermarktId))
    || App.d.plantel.find(p => norm(p.nome) === norm(j.name)) || null;
}

async function tmGuardar(j) {
  const ex = tmExistente(j);
  const num = parseInt(j.shirtNumber, 10);
  const dados = {
    posicao: posicaoTm(j.position) ?? ex?.posicao ?? null,
    data_nascimento: /^\d{4}-\d{2}-\d{2}$/.test(j.birthDate || '') ? j.birthDate : ex?.data_nascimento ?? null,
    altura: j.heightCm >= 120 && j.heightCm <= 230 ? j.heightCm : ex?.altura ?? null,
    pe: peTm(j.foot) ?? ex?.pe ?? null,
    numero: num >= 0 && num <= 99 ? num : ex?.numero ?? null,
    nacionalidade: j.nationality || ex?.nacionalidade || null,
    tm_id: j.transfermarktId ? String(j.transfermarktId) : ex?.tm_id ?? null,
    tm_url: j.sourceUrl || ex?.tm_url || null
  };
  // A fotografia só entra se o jogador ainda não tiver uma.
  if (!ex?.foto && /^data:image\//.test(j.photo || '')) { try { dados.foto = await reduzirFoto(j.photo); } catch { /* sem foto */ } }
  if (ex) {
    const [r] = await App.db.atualizar('jogadores', { id: ex.id }, dados);
    Object.assign(ex, r || dados);
    return 'atualizado';
  }
  const novo = await App.db.inserir('jogadores', { nome: j.name, ...dados });
  App.d.plantel.push(novo); indexarPlantel();
  return 'novo';
}

      for (let i = 0; i < lista.length && !parar; i++) {
        msg(`${i + 1} de ${lista.length}: ${lista[i].name}`);
        try { const r = await tmChamar(lista[i].url); await tmGuardar(r.jogador); ok++; } catch { falhas.push(lista[i].name); }
        barra.firstChild.style.width = `${(i + 1) / lista.length * 100}%`;
        if (i < lista.length - 1 && !parar) await new Promise(res => setTimeout(res, pausa));
      }
      ocupado = false; $('#tm-procurar', d).disabled = false; $('#tm-fechar', d).textContent = 'Fechar'; barra.remove();
      msg(`${ok === 1 ? '1 jogador importado' : `${ok} jogadores importados`}${parar ? ' (parado)' : ''}.${falhas.length ? ` Falharam: ${falhas.join(', ')}.` : ''}`, falhas.length > 0);
    });
  };

  $('#tm-form', d).addEventListener('submit', async e => {
    e.preventDefault(); if (ocupado) return;
    const url = $('#tm-url', d).value.trim(); saida.innerHTML = '';
    $('#tm-procurar', d).disabled = true; msg('A procurar no Transfermarkt…');
    try { const r = await tmChamar(url); if (r.equipa) mostrarEquipa(r.equipa); else mostrarJogador(r.jogador); }
    catch (err) { msg(err.message, true); }
    $('#tm-procurar', d).disabled = false;
  });
  $('#tm-url', d).focus();
}

async function tmAtualizarJogador(pj, botao) {
  botao.disabled = true; const texto = botao.textContent; botao.textContent = 'A atualizar…';
  try { const r = await tmChamar(pj.tm_url); await tmGuardar(r.jogador); toast(`${pj.nome}: dados atualizados do Transfermarkt.`); await recarregar(); }
  catch (err) { toast(err.message, 'erro'); botao.disabled = false; botao.textContent = texto; }
}

  finalizacao: ['Pé direito', 'Pé esquerdo', 'Cabeça', 'Outra', 'Sem remate'],
  resultado_op: ['Golo', 'Defesa do GR', 'Fora', 'Bloqueado', 'Ferro', 'Sem remate'],

function chips(nome, opcoes, valor, rotulo) {
  return `<fieldset class="grupo-chips"><legend>${rotulo}</legend><div class="chips">
    ${opcoes.map(o => `<label class="chip"><input type="radio" name="${nome}" value="${esc(o)}" ${o === valor ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}

}

function desenharCodificacao() {

    </div>

function lerFormParaEstado() {
  const f = $('#c-form'); if (!f) return;
  const fd = new FormData(f); const C = App.cod;
  C.tipo = fd.get('tipo') || C.tipo; C.lado = fd.get('lado') || C.lado; C.parte = fd.get('parte') || C.parte;
  for (const k of CAMPOS_FORM) if (fd.has(k)) C.form[k] = fd.get(k);
  if (fd.has('execucao')) C.form.ultima_acao_et = fd.get('execucao');

async function guardarEvento(e) {
  e.preventDefault();
  lerFormParaEstado();
  const C = App.cod; const F = C.form; const op = C.tipo === 'oportunidade';
  const erros = [];
  const minuto = F.minuto === '' || F.minuto === undefined ? null : Number(F.minuto);
  if (minuto === null || !Number.isInteger(minuto) || minuto < 0 || minuto > 130) erros.push('o minuto');
  if (op && !C.zona) erros.push('a zona no campo');
  if (!F.resultado) erros.push('o resultado');
  if (!op && !F.subtipo) erros.push('o tipo de esquema');
  if (F.video_url && !/^https?:\/\//i.test(F.video_url)) erros.push('uma ligação de vídeo válida (começa por https://)');
  const elErro = $('#c-erro');
  if (erros.length) { elErro.textContent = `Falta indicar ${erros.join(', ').replace(/, ([^,]*)$/, ' e $1')}.`; elErro.hidden = false; return; }
  const reg = {
    jogo_id: C.jogoId, tipo: C.tipo, lado: C.lado, minuto, parte: C.parte || null,
    momento: op ? F.momento || null : null, subtipo: op ? null : F.subtipo || null,
    qualidade: op ? F.qualidade || 'Oportunidade' : null,
    ultima_acao: op ? F.ultima_acao || null : F.ultima_acao_et || null,
    finalizacao: op ? F.finalizacao || null : null, resultado: F.resultado,
    zona_x: C.zona ? C.zona.x : null, zona_y: C.zona ? C.zona.y : null,
    jogador: (F.jogador || '').trim() || null, assistente: op ? (F.assistente || '').trim() || null : null,
    video_url: (F.video_url || '').trim() || null, notas: (F.notas || '').trim() || null
  };
  const btn = $('#c-form button.btn-prim'); btn.disabled = true;
  try {
    if (C.editarId) {
      const [r] = await App.db.atualizar('eventos', { id: C.editarId }, reg);
      App.d.eventos = App.d.eventos.map(x => x.id === C.editarId ? (r || { ...x, ...reg }) : x);
      toast('Evento atualizado.');
    } else {
      const r = await App.db.inserir('eventos', reg);
      App.d.eventos.push(r);
      toast(`Evento guardado (${minuto}').`);
    }
    reindexarEventos();
    C.editarId = null; C.zona = null;
    C.form = { qualidade: 'Oportunidade' };
    desenharFormEvento(); desenharListaEventos();
    $('#c-minuto').focus();
  } catch (err) { btn.disabled = false; elErro.textContent = err.message; elErro.hidden = false; }
}

      </tbody>
    </table></div>
    ${lista.length ? `<ol class="lista-eventos">${lista.map(e => `
      <li class="${e.id === C.editarId ? 'a-editar' : ''}">
        <span class="ev-min">${e.minuto ?? '–'}'</span>
        <span class="ponto-cor ${e.lado === 'nos' ? 'nos' : 'adv'}" title="${e.lado === 'nos' ? esc(App.cfg.nome_clube) : esc(jogo.adversario)}"></span>
        <div class="ev-txt">
          <b>${e.tipo === 'oportunidade' ? (e.qualidade === 'Grande oportunidade' ? 'Grande oportunidade' : 'Oportunidade') : esc(e.subtipo || 'Esquema tático')}</b>
          <span class="${e.resultado === 'Golo' ? 'golo' : ''}">${esc(e.resultado || '')}</span>
          <small>${esc([e.momento, e.ultima_acao, e.finalizacao, e.jogador && `${e.jogador}${e.assistente ? ' (assist. ' + e.assistente + ')' : ''}`].filter(Boolean).join(' · '))}</small>
          ${e.notas ? `<small class="fraco">${esc(e.notas)}</small>` : ''}
        </div>
        <div class="ev-acoes">
          ${e.video_url && /^https?:\/\//i.test(e.video_url) ? `<a class="btn-link" href="${esc(e.video_url)}" target="_blank" rel="noopener">Vídeo</a>` : ''}
          ${pode() ? `<button class="btn-link" data-ev-editar="${e.id}">Editar</button><button class="btn-link perigo" data-ev-apagar="${e.id}">Apagar</button>` : ''}
        </div>
      </li>`).join('')}</ol>` : `<p class="fraco vazio-curto">${todos.length ? 'Nenhum evento para este filtro.' : 'Ainda não há eventos codificados neste jogo.'}</p>`}`;
  $$('input[name=filtro]', el).forEach(r => r.addEventListener('change', () => { C.filtro = r.value; desenharListaEventos(); }));
  $$('[data-ev-editar]', el).forEach(b => b.addEventListener('click', () => {
    const ev = App.d.eventos.find(x => x.id === b.dataset.evEditar);
    Object.assign(C, { editarId: ev.id, tipo: ev.tipo, lado: ev.lado, parte: ev.parte || '1.ª parte', zona: ev.zona_x !== null && ev.zona_x !== undefined ? { x: Number(ev.zona_x), y: Number(ev.zona_y) } : null });
    C.form = { ...Object.fromEntries(CAMPOS_FORM.map(k => [k, ev[k] ?? ''])), ultima_acao_et: ev.tipo === 'esquema_tatico' ? ev.ultima_acao : '' };
    desenharFormEvento(); desenharListaEventos();
    $('#c-form-env').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  $$('[data-ev-apagar]', el).forEach(b => b.addEventListener('click', async () => {
    const ev = App.d.eventos.find(x => x.id === b.dataset.evApagar);
    if (!(await confirmar(`Apagar o evento do minuto ${ev.minuto}?`))) return;
    try {
      await App.db.apagar('eventos', { id: ev.id });
      App.d.eventos = App.d.eventos.filter(x => x.id !== ev.id); reindexarEventos();
      if (C.editarId === ev.id) { C.editarId = null; C.form = {}; C.zona = null; }
      if (pode()) desenharFormEvento(); desenharListaEventos(); toast('Evento apagado.');
    } catch (err) { toast(err.message, 'erro'); }
  }));
}

  const v = $('#vista'); const I = App.imp;
  const eq = I.tipo === 'equipa';
  v.innerHTML = `
    <div class="cabecalho-vista"><div><h1>Importação</h1><p class="nota">Arraste a exportação do Wyscout. O ficheiro original fica guardado e os dados entram na base de dados; importar o mesmo jogo outra vez atualiza-o em vez de o duplicar.</p></div></div>
    <div class="segmentado largo" role="radiogroup" aria-label="Tipo de ficheiro">
      <label><input type="radio" name="imp-tipo" value="equipa" ${eq ? 'checked' : ''}><span>Estatísticas de equipa</span></label>
      <label><input type="radio" name="imp-tipo" value="jogadores" ${eq ? '' : 'checked'}><span>Estatísticas de jogadores</span></label>
    </div>
    <section class="bloco">
      <p class="instrucao">${eq
        ? 'No Wyscout, abra a página da vossa equipa, separador <b>Estatísticas</b> (Team stats), e exporte para Excel. Cada jogo tem duas linhas: a vossa equipa e o adversário.'
        : 'No Wyscout, exporte as <b>estatísticas dos jogadores</b> de um jogo (ou de vários, se o ficheiro tiver a coluna da data). O jogo tem de existir: importe primeiro as estatísticas de equipa.'}</p>
      <label class="zona-ficheiro" id="i-zona">
        <input type="file" id="i-ficheiro" accept=".xlsx,.xls,.csv">
        <span class="zona-titulo">${I.ficheiro ? esc(I.ficheiro.name) : 'Arraste o ficheiro para aqui'}</span>
        <span class="zona-sub">${I.ficheiro ? 'Clique ou arraste outro ficheiro para trocar' : 'ou clique para escolher (.xlsx, .xls ou .csv)'}</span>
      </label>
      <div id="i-analise"></div>
    </section>
    <section class="bloco" id="i-historico"></section>`;
  $$('input[name=imp-tipo]', v).forEach(r => r.addEventListener('change', () => { Object.assign(I, { tipo: r.value, tab: null, ficheiro: null, analise: null }); desenharImportacao(); }));
  const zona = $('#i-zona');
  $('#i-ficheiro').addEventListener('change', e => e.target.files[0] && lerFicheiro(e.target.files[0]));
  ['dragenter', 'dragover'].forEach(t => zona.addEventListener(t, e => { e.preventDefault(); zona.classList.add('arrastar'); }));
  ['dragleave', 'drop'].forEach(t => zona.addEventListener(t, () => zona.classList.remove('arrastar')));
  zona.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) lerFicheiro(f); });
  if (I.tab) desenharAnalise();
  desenharHistorico();

async function lerFicheiro(f) {
  const I = App.imp;
  try {
    const buf = await f.arrayBuffer();
    const linhas = lerFolha(buf);
    if (!linhas.length) throw new Error('O ficheiro está vazio.');
    I.ficheiro = f;
    I.tab = prepararTabela(linhas, I.tipo === 'equipa' ? PAPEIS_EQUIPA : PAPEIS_JOGADOR);
    I.jogoId = null;
    desenharImportacao();
  } catch (err) {
    toast(`Não consegui ler o ficheiro: ${err.message}`, 'erro');
  }
}

function analisarAtual() {
  const I = App.imp;
  I.analise = I.tipo === 'equipa'
    ? analisarEquipa(I.tab, App.cfg, App.d.mapas, App.d.jogos)
    : analisarJogadores(I.tab, App.cfg, App.d.mapas, App.d.jogos, { jogoId: I.jogoId, ladoPadrao: I.lado });
}

function desenharAnalise() {
  const I = App.imp; const T = I.tab; const eq = I.tipo === 'equipa';
  analisarAtual();
  const A = I.analise;
  const papeis = eq ? PAPEIS_EQUIPA : PAPEIS_JOGADOR;
  const semData = !eq && (T.papeis.data === null || T.papeis.data === undefined);
  const jogos = App.d.jogos.slice().sort((a, b) => b.data.localeCompare(a.data));
  const n = eq ? A.jogos.length : A.linhas.length;
  let resumo = '';
  if (eq && n) {
    const novos = A.jogos.filter(j => !j.existe).length;
    resumo = `${n} ${n === 1 ? 'jogo encontrado' : 'jogos encontrados'}: ${novos} ${novos === 1 ? 'novo' : 'novos'}, ${n - novos} já ${n - novos === 1 ? 'existia (será atualizado)' : 'existiam (serão atualizados)'}. ${A.nMetricas} métricas por jogo.`;
  } else if (!eq && n) {
    const nJogos = new Set(A.linhas.map(l => l.jogo_id)).size;
    const nos = A.linhas.filter(l => l.lado === 'nos').length;
    resumo = `${n} registos de jogadores em ${nJogos} ${nJogos === 1 ? 'jogo' : 'jogos'} (${nos} da vossa equipa, ${n - nos} do adversário). ${A.nMetricas} métricas por jogador.`;
  }
  $('#i-analise').innerHTML = `
    <h2>Colunas</h2>
    <p class="nota">Detetei automaticamente as colunas principais. Corrija se alguma estiver errada; todas as restantes colunas numéricas são guardadas como métricas.</p>
    <div class="papeis">
      ${papeis.map(p => `<label>${PAPEIS[p].rotulo}<select data-papel="${p}"><option value="">— nenhuma —</option>${T.colunas.map((c, i) => `<option value="${i}" ${T.papeis[p] === i ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`).join('')}
    </div>
    ${semData ? `<div class="grelha-2">
      <label>Jogo deste ficheiro<select id="i-jogo"><option value="">Escolha o jogo…</option>${jogos.map(j => `<option value="${j.id}" ${I.jogoId === j.id ? 'selected' : ''}>${esc(rotuloJogo(j))}</option>`).join('')}</select></label>
      ${T.papeis.equipa === null || T.papeis.equipa === undefined ? `<label>Os jogadores são de<select id="i-lado"><option value="nos" ${I.lado === 'nos' ? 'selected' : ''}>${esc(App.cfg.nome_clube || 'Nós')}</option><option value="adversario" ${I.lado === 'adversario' ? 'selected' : ''}>Adversário</option></select></label>` : ''}
    </div>` : ''}
    ${A.avisos.length ? `<ul class="avisos" role="status">${A.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
    ${n ? `<h2>Pré-visualização</h2><p class="destaque">${esc(resumo)}${A.ignoradas ? ` <span class="fraco">${A.ignoradas} linhas ignoradas (sem data, totais ou sem jogo).</span>` : ''}</p>
      ${eq ? tabelaPreviaEquipa(A.jogos) : tabelaPreviaJogadores(A.linhas)}
      <div class="acoes-esq"><button class="btn btn-prim" id="i-importar">Importar ${n} ${eq ? (n === 1 ? 'jogo' : 'jogos') : 'registos'}</button></div>` : ''}`;
  $$('[data-papel]').forEach(s => s.addEventListener('change', () => {
    const p = s.dataset.papel; const val = s.value === '' ? null : Number(s.value);
    for (const k of Object.keys(T.papeis)) if (k !== p && T.papeis[k] === val && val !== null) T.papeis[k] = null;
    T.papeis[p] = val; desenharAnalise();
  }));
  $('#i-jogo')?.addEventListener('change', e => { I.jogoId = e.target.value || null; desenharAnalise(); });
  $('#i-lado')?.addEventListener('change', e => { I.lado = e.target.value; desenharAnalise(); });
  $('#i-importar')?.addEventListener('click', e => (eq ? importarEquipa : importarJogadores)(e.currentTarget));
}

function tabelaPreviaEquipa(jogos) {
  return `<div class="tabela-env"><table class="tabela compacta">
    <thead><tr><th>Data</th><th>Adversário</th><th>Competição</th><th>Local</th><th class="num">Resultado</th><th>Estado</th></tr></thead>
    <tbody>${jogos.map(j => `<tr><td>${fmtData(j.data)}</td><td>${esc(j.adversario)}</td><td>${esc(j.competicao || '–')}</td>
      <td>${j.local === 'casa' ? 'Casa' : j.local === 'fora' ? 'Fora' : '–'}</td>
      <td class="num">${Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos) ? `${j.golos_marcados}–${j.golos_sofridos}` : '–'}</td>
      <td>${j.existe ? 'Atualiza' : '<b>Novo</b>'}${j.metricasAdv ? '' : ' <span class="fraco">(sem linha do adversário)</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}

function tabelaPreviaJogadores(linhas) {
  const mostrar = linhas.slice(0, 40);
  return `<div class="tabela-env"><table class="tabela compacta">
    <thead><tr><th>Jogo</th><th>Jogador</th><th>Equipa</th><th>Posição</th><th class="num">Minutos</th><th class="num">Métricas</th></tr></thead>
    <tbody>${mostrar.map(l => `<tr><td>${esc(rotuloJogo(l.jogo, true))}</td><td>${esc(l.jogador)}</td><td><span class="ponto-cor ${l.lado === 'nos' ? 'nos' : 'adv'}"></span>${esc(l.equipa || '')}</td>
      <td>${esc(l.posicao || '–')}</td><td class="num">${fmtNum(l.minutos, 0)}</td><td class="num">${Object.keys(l.metricas).length}</td></tr>`).join('')}</tbody></table></div>
    ${linhas.length > mostrar.length ? `<p class="nota">E mais ${linhas.length - mostrar.length} registos.</p>` : ''}`;
}

async function registarImportacao(tipo, linhas, resumo) {
  const I = App.imp; let caminho = null; let avisoFicheiro = null;
  try { caminho = await App.db.carregarFicheiro(I.ficheiro); } catch (err) { avisoFicheiro = err.message; }
  const imp = await App.db.inserir('importacoes', { tipo, ficheiro: I.ficheiro.name, caminho_storage: caminho, linhas, resumo });
  return { imp, avisoFicheiro };
}

async function importarEquipa(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const existentes = {}; for (const j of App.d.jogos) existentes[`${j.data}|${norm(j.adversario)}`] = j;
    const novos = A.jogos.filter(j => !j.existe).length;
    const { imp, avisoFicheiro } = await registarImportacao('equipa', A.jogos.length, { novos, atualizados: A.jogos.length - novos });
    // Mantém os valores já registados quando o ficheiro não os traz.
    const linhasJogos = A.jogos.map(j => {
      const ex = existentes[`${j.data}|${norm(j.adversario)}`] || {};
      return {
        data: j.data, adversario: ex.adversario || j.adversario, competicao: j.competicao ?? ex.competicao ?? null, local: j.local ?? ex.local ?? null,
        golos_marcados: j.golos_marcados ?? ex.golos_marcados ?? null, golos_sofridos: j.golos_sofridos ?? ex.golos_sofridos ?? null
      };
    });
    const guardados = await App.db.upsert('jogos', linhasJogos, 'data,adversario');
    const idPorChave = {}; for (const g of guardados) idPorChave[`${g.data}|${norm(g.adversario)}`] = g.id;
    const agora = new Date().toISOString(); const est = [];
    for (const j of A.jogos) {
      const jogo_id = idPorChave[`${j.data}|${norm(j.adversario)}`]; if (!jogo_id) continue;
      est.push({ jogo_id, lado: 'nos', equipa: j.equipaNos, metricas: j.metricasNos, importacao_id: imp.id, updated_at: agora });
      if (j.metricasAdv) est.push({ jogo_id, lado: 'adversario', equipa: j.equipaAdv, metricas: j.metricasAdv, importacao_id: imp.id, updated_at: agora });
    }
    await App.db.upsert('estatisticas_equipa', est, 'jogo_id,lado');
    terminarImportacao(`${A.jogos.length} ${A.jogos.length === 1 ? 'jogo importado' : 'jogos importados'} (${novos} ${novos === 1 ? 'novo' : 'novos'}).`, avisoFicheiro);
  } catch (err) { btn.disabled = false; btn.textContent = 'Tentar outra vez'; toast(err.message, 'erro'); }
}

async function importarJogadores(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const { imp, avisoFicheiro } = await registarImportacao('jogadores', A.linhas.length, { jogos: [...new Set(A.linhas.map(l => l.jogo_id))].length });
    const agora = new Date().toISOString();
    await App.db.upsert('estatisticas_jogador', A.linhas.map(l => ({
      jogo_id: l.jogo_id, jogador: l.jogador, lado: l.lado, equipa: l.equipa, posicao: l.posicao, minutos: l.minutos, metricas: l.metricas, importacao_id: imp.id, updated_at: agora
    })), 'jogo_id,jogador,lado');
    terminarImportacao(`${A.linhas.length} registos de jogadores importados.`, avisoFicheiro);
  } catch (err) { btn.disabled = false; btn.textContent = 'Tentar outra vez'; toast(err.message, 'erro'); }
}

async function terminarImportacao(msg, avisoFicheiro) {
  Object.assign(App.imp, { tab: null, ficheiro: null, analise: null, jogoId: null });
  await recarregar();
  toast(msg);
  if (avisoFicheiro) toast(`Os dados foram importados, mas o ficheiro original não foi guardado: ${avisoFicheiro}`, 'erro');
}

function desenharHistorico() {
  const el = $('#i-historico');
  const lista = App.d.importacoes.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0, 12);
  el.innerHTML = `<h2>Últimas importações</h2>${lista.length ? `<div class="tabela-env"><table class="tabela compacta">
    <thead><tr><th>Quando</th><th>Tipo</th><th>Ficheiro</th><th class="num">Linhas</th></tr></thead>
    <tbody>${lista.map(i => `<tr><td>${new Date(i.created_at).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${i.tipo === 'equipa' ? 'Equipa' : 'Jogadores'}</td><td>${esc(i.ficheiro)}</td><td class="num">${i.linhas ?? '–'}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="fraco">Ainda não foi importado nenhum ficheiro.</p>'}`;
}

</script>
