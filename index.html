// ---------- Atualização automática ----------
// Quando outra pessoa altera dados (Supabase Realtime), a app recarrega sozinha.
// Se estiver a meio de alguma coisa (formulário com foco, janela aberta), espera e mostra um aviso.
const TABELAS_TEMPO_REAL = ['simbolos_equipas', 'scout_equipas', 'scout_jogadores', 'scout_avaliacoes', 'agenda', 'arquivo', 'configuracao', 'estatisticas_adversario', 'estatisticas_equipa', 'estatisticas_jogador', 'estatisticas_liga', 'eventos', 'jogadores', 'jogadores_adversarios', 'jogos', 'mapeamento_nomes', 'onzes', 'partidas'];
App.rt = { pendente: false, temp: null, ultima: Date.now(), tabelas: new Set(), tudo: false };
function ligarTempoReal() {
  const sb = App.db.sb; if (!sb?.channel) return;
  const ch = sb.channel('app-dados');
  for (const t of TABELAS_TEMPO_REAL) ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => alteracaoRemota(false, t));
  ch.subscribe();
  // Ao voltar ao separador depois de algum tempo (ou se a ligação caiu), confirma se há novidades.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - App.rt.ultima > 5 * 60e3) alteracaoRemota(true); });
  window.addEventListener('online', () => alteracaoRemota(true));
}
function ocupado() {
  if (document.querySelector('dialog[open]')) return true;
  const a = document.activeElement;
  if (a && a.matches?.('input:not([type=radio]):not([type=checkbox]):not([type=button]), textarea, select, [contenteditable=true]') && a.closest('form, .cod-form, #e-form, #c-form')) return true;
  return !!document.querySelector('.sl-render');
}
function alteracaoRemota(forcar = false, tabela = null) {
  // As nossas próprias gravações também chegam por aqui: ignoradas durante uns segundos.
  if (!forcar && Date.now() - (App.db.escrevi || 0) < 4000) return;
  if (tabela) App.rt.tabelas.add(tabela); else App.rt.tudo = true;
  clearTimeout(App.rt.temp);
  App.rt.temp = setTimeout(aplicarAlteracoesRemotas, 1500); // várias alterações seguidas (importações) = uma recarga
}
async function aplicarAlteracoesRemotas() {
  if (ocupado()) { App.rt.pendente = true; avisoAtualizacao(true); clearTimeout(App.rt.temp); App.rt.temp = setTimeout(aplicarAlteracoesRemotas, 10e3); return; }
  App.rt.pendente = false; avisoAtualizacao(false);
  const y = window.scrollY;
  const alt = App.rt.tudo ? null : new Set(App.rt.tabelas); App.rt.tabelas = new Set(); App.rt.tudo = false;
  try { await recarregar(alt); App.rt.ultima = Date.now(); window.scrollTo(0, y); } catch { if (alt) alt.forEach(t => App.rt.tabelas.add(t)); else App.rt.tudo = true; }
}
function avisoAtualizacao(mostrar) {
  let b = document.getElementById('aviso-rt');
  if (!mostrar) { b?.remove(); return; }
  if (b) return;
  b = document.createElement('div'); b.id = 'aviso-rt'; b.className = 'aviso-rt'; b.setAttribute('role', 'status');
  b.innerHTML = 'Há alterações de outra pessoa. <button class="btn-link">Atualizar agora</button>';
  b.querySelector('button').addEventListener('click', () => { document.activeElement?.blur?.(); aplicarAlteracoesRemotas(); });
  document.body.appendChild(b);
}

// ---------- Campo (SVG) ----------
// Coordenadas dos eventos em % (0–100), a atacar para a direita.
function campoSVG({ eventos = [], metade = false, interativo = false, marcador = null, marcadorPasse = null, passes = false, classe = '', setores = false }) {
  const vx = metade ? 51 : -2, vw = metade ? 56 : 109;
  const k = metade ? 0.72 : 1;
  // Linhas do passe até à finalização (por baixo das marcas).
  const linhas = passes ? eventos.filter(e => e.passe_x != null && e.zona_x != null).map(e => `<line class="ev-linha ev-linha-${e.lado}" x1="${e.passe_x * 1.05}" y1="${e.passe_y * 0.68}" x2="${e.zona_x * 1.05}" y2="${e.zona_y * 0.68}"/><circle class="ev-passe ev-${e.lado}" cx="${e.passe_x * 1.05}" cy="${e.passe_y * 0.68}" r="${0.55 * k}"/>`).join('') : '';
  const marcas = eventos.map(e => marcaEvento(e, k)).join('');
  const mx = p => p.x * 1.05, my = p => p.y * 0.68;
  const sel = (marcador && marcadorPasse ? `<line class="marcador-linha" x1="${mx(marcadorPasse)}" y1="${my(marcadorPasse)}" x2="${mx(marcador)}" y2="${my(marcador)}"/>` : '')
    + (marcadorPasse ? `<g class="marcador marcador-passe"><circle cx="${mx(marcadorPasse)}" cy="${my(marcadorPasse)}" r="1.6"/></g>` : '')
    + (marcador ? `<g class="marcador"><circle cx="${mx(marcador)}" cy="${my(marcador)}" r="2.4"/><circle cx="${mx(marcador)}" cy="${my(marcador)}" r="0.7" class="ponto"/></g>` : '');
  return `<svg class="campo ${classe} ${interativo ? 'interativo' : ''}" viewBox="${vx} -2 ${vw} 72" ${interativo ? 'role="img" aria-label="Campo: clique para marcar a zona"' : 'role="img" aria-label="Mapa de eventos no campo"'}>
    <rect class="relva" x="${vx}" y="-2" width="${vw}" height="72"/>
    ${setores ? `<g class="setores">${[0, 2, 4].map(i => `<rect x="${52.5 + i * 6}" y="0" width="6" height="68"/>`).join('')}</g>` : ''}
    <g class="linhas">
      <rect x="0" y="0" width="105" height="68"/>
      <line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/>
      <rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/>
      <rect x="0" y="24.84" width="5.5" height="18.32"/><rect x="99.5" y="24.84" width="5.5" height="18.32"/>
      <path d="M16.5 26.7 A9.15 9.15 0 0 1 16.5 41.3"/><path d="M88.5 26.7 A9.15 9.15 0 0 0 88.5 41.3"/>
      <rect x="-1.5" y="30.34" width="1.5" height="7.32"/><rect x="105" y="30.34" width="1.5" height="7.32"/>
      <circle class="marca-penalti" cx="11" cy="34" r="0.35"/><circle class="marca-penalti" cx="94" cy="34" r="0.35"/><circle class="marca-penalti" cx="52.5" cy="34" r="0.35"/>
    </g>
    ${metade ? '' : '<text class="direcao" x="52.5" y="66.2">ataque →</text>'}
    <g class="eventos">${linhas}${marcas}</g>${sel}
  </svg>`;
}

function marcaEvento(e, k = 1) {
  if (e.zona_x === null || e.zona_x === undefined) return '';
  const x = e.zona_x * 1.05, y = e.zona_y * 0.68;
  const golo = e.resultado === 'Golo';
  const o = typeof dadosOportunidade === 'function' ? dadosOportunidade(e) : {};
  const titulo = `${Number.isFinite(e.minuto) ? `${e.minuto}' ` : o.tempo ? `${o.tempo} ` : ''}${[o.momento, o.sub, o.mecanismo].filter(Boolean).join(' · ') || 'Oportunidade'} · ${e.resultado || ''}${e.jogador ? ' · ' + e.jogador : ''}`;
  const cls = `ev ev-${e.lado} ${golo ? 'ev-golo' : ''} ${e.qualidade === 'Grande oportunidade' ? 'ev-grande' : ''}`;
  if (e.tipo === 'esquema_tatico') {
    return `<rect class="${cls}" x="${x - 1.1 * k}" y="${y - 1.1 * k}" width="${2.2 * k}" height="${2.2 * k}" transform="rotate(45 ${x} ${y})"><title>${esc(titulo)}</title></rect>`;
  }
  return `<circle class="${cls}" cx="${x}" cy="${y}" r="${(e.qualidade === 'Grande oportunidade' ? 1.45 : 1.1) * k}"><title>${esc(titulo)}</title></circle>`;
}

function legendaCampo() {
  return `<div class="legenda-campo">
    <span><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" class="ev ev-nos ev-golo"/></svg>Golo</span>
    <span><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" class="ev ev-nos"/></svg>Oportunidade</span>

function rotuloJogo(j, curto = false) {
  if (!j) return '';
  const local = j.local === 'casa' ? '(C)' : j.local === 'fora' ? '(F)' : '';
  if (curto) return `${quandoJogo(j, true)} ${j.adversario} ${local}`.trim();
  const res = Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos) ? ` ${j.golos_marcados}–${j.golos_sofridos}` : '';
  return `${quandoJogo(j)} · ${j.adversario} ${local}${res}`;
}

function resultadoJogo(j) {
  if (!Number.isFinite(j.golos_marcados) || !Number.isFinite(j.golos_sofridos)) return null;
  return j.golos_marcados > j.golos_sofridos ? 'V' : j.golos_marcados < j.golos_sofridos ? 'D' : 'E';
}

// Sem repetir o mesmo clube escrito de formas diferentes.
function juntarEquipas(nomes) {
  const out = [];
  for (const n of nomes) if (n && !out.some(x => norm(x) === norm(n) || mesmaEquipa(x, n))) out.push(n);
  return out;
}
function equipasConhecidas() {
  const liga = juntarEquipas([...(App.d.liga || []).map(r => r.equipa), ...App.d.jogos.filter(j => (App.d.liga || []).some(r => mesmaEq(r.equipa, j.adversario))).map(j => j.adversario)])
    .sort((a, b) => (eNossaEquipa(b) - eNossaEquipa(a)) || a.localeCompare(b, 'pt'));
  const outras = juntarEquipas([...App.d.jogos.map(j => j.adversario), ...(App.d.estAdv || []).flatMap(r => [r.equipa, r.adversario]),
    ...(App.d.onzes || []).flatMap(o => [o.equipa, o.adversario]), ...(App.d.plantelAdv || []).map(p => p.equipa)])
    .filter(e => !eNossaEquipa(e) && !liga.some(x => mesmaEq(x, e))).sort((a, b) => a.localeCompare(b, 'pt'));
  return { liga, outras };
}

async function gravarSimbolo(nome, valor) {
  const k = norm(nome);
  if (App.semTabelaSimbolos) {
    const atual = { ...(App.cfg.simbolos_equipas || {}) };
    if (valor) atual[k] = valor; else delete atual[k];
    await App.db.upsert('configuracao', [{ id: 1, simbolos_equipas: atual, updated_at: new Date().toISOString() }], 'id');
  } else if (valor) await App.db.upsert('simbolos_equipas', [{ chave: k, imagem: valor, updated_at: new Date().toISOString() }], 'chave');
  else await App.db.apagar('simbolos_equipas', { chave: k });
  const atual = { ...(App.cfg.simbolos_equipas || {}) };
  if (valor) atual[k] = valor; else delete atual[k];
  App.cfg.simbolos_equipas = atual; App.cfgBase && (App.cfgBase.simbolos_equipas = atual);
  if (App.cacheTabelas.simbolos_equipas) delete App.cacheTabelas.simbolos_equipas;
}

// Reduz a imagem para 320 px (nítida na capa do relatório e na impressão) e guarda-a na configuração.
function imagemParaSimbolo(f) {
  return new Promise((ok, falha) => {
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 320 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/png'));
    };
    img.onerror = () => falha(new Error('Não consegui ler a imagem.')); img.src = url;
  });
}
function ligarSimbolos(guardarCfg) {
  const guardar = async (nome, valor) => {
    try { await gravarSimbolo(nome, valor); } catch (err) { toast(traduzErro(err.message || String(err)), 'erro'); return; }
    toast(valor ? `Símbolo de ${nome} guardado.` : `Símbolo de ${nome} removido.`);
    if (App.vista === 'definicoes') mostrarVista('definicoes');
    $('#s-simbolos')?.scrollIntoView({ block: 'start' });
  };
  void guardarSimbolo;
  $$('[data-simbolo]').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    try { await guardar(inp.dataset.simbolo, await imagemParaSimbolo(f)); } catch (err) { toast(err.message, 'erro'); }
  }));
  $$('[data-tirar-simbolo]').forEach(b => b.addEventListener('click', () => guardar(b.dataset.tirarSimbolo, null)));
}

const PADRAO_METRICAS = [/^(xg|golos esperados)$/i, /^(shots|remates)$/i, /(on target|^remates à baliza)$/i, /^(passes \/ accurate %|% passes certos)$/i, /^ppda$/i, /^(recoveries \/ high|recuperações)$/i, /^(possession|posse)/i, /^(touches in penalty area|toques na área)$/i, /^entradas na grande área$/i];
const PADRAO_JOG = ['Goals', 'Golos', 'Assists', 'Assistências', 'xG', 'xA', 'Progressive passes', 'Recoveries', 'Recuperações', 'Passes certos', 'Duelos ganhos'];
// Métricas com nomes diferentes conforme o idioma da exportação.
const SINONIMOS = { golos: ['Goals', 'Golos'], assistencias: ['Assists', 'Assistências'], xg: ['xG'], xa: ['xA'] };
function valorSinonimo(obj, chave) { for (const k of SINONIMOS[chave]) if (Number.isFinite(obj?.[k])) return obj[k]; return null; }
const ePercentagem = k => /%/.test(k);

function chaveXG(mets) { return mets.find(k => /^xg$/i.test(k)) || mets.find(k => /^(expected goals|golos esperados)$/i.test(k)) || null; }

// Data do primeiro jogo da equipa técnica atual (Definições). Separa os dados em "antes" e "desde".
function marcoET() { return App.cfg?.inicio_equipa_tecnica || null; }
const antesDoMarco = j => !j.data || j.data < marcoET();
// Jogos com os filtros de competição e local, sem o filtro de período.
function jogosBaseRelatorio() {
  const f = App.rel;
  // Só jogos já disputados (com resultado ou estatísticas); os jogos por jogar ficam de fora.
  let js = App.d.jogos.filter(j => resultadoJogo(j) || App.idx.estEq[j.id]).sort(compararJogos);
  if (f.competicao !== 'todas') js = js.filter(j => (j.competicao || '') === f.competicao);
  if (f.local !== 'todos') js = js.filter(j => j.local === f.local);
  return js;
}
function jogosDoRelatorio() {
  const f = App.rel; let js = jogosBaseRelatorio();
  if ((f.periodo === 'desde' || f.periodo === 'antes') && marcoET()) js = js.filter(j => (f.periodo === 'antes') === antesDoMarco(j));
  else if (/^\d+$/.test(f.periodo)) js = js.slice(-Number(f.periodo));
  return js;
}
function textoPeriodo(p) {

// Total, equipa técnica anterior e atual: linhas { rot, t, a, d, melhor (1 / -1 / 0), casas, sufixo }.
function htmlAntesDepois(titulo, nota, linhas, nA, nD, legenda = true) {
  // Sem as linhas sem dados, e sem os separadores que ficam sem linhas.
  const temDados = l => !l.sep && (l.a !== null || l.d !== null);
  const ok = linhas.filter((l, i) => l.sep ? (() => { for (const x of linhas.slice(i + 1)) { if (x.sep) return false; if (temDados(x)) return true; } return false; })() : temDados(l));
  if (!ok.some(temDados)) return '';
  const fmt = (x, l) => x === null ? '–' : `${fmtNum(x, l.casas ?? 2)}${l.sufixo || ''}`;
  const dif = l => {
    if (l.semDif) return '<td></td>';
    if (l.a === null || l.d === null) return '<td class="num fraco">–</td>';
    const d = l.d - l.a; const rel = Math.abs(d) / (Math.abs(l.a) || 1);
    const cls = !l.melhor || rel < 0.05 ? '' : (d > 0) === (l.melhor > 0) ? 'bom' : 'mau';
    return `<td class="num"><span class="pj-dif ${cls}">${fmtSinal(d, l.casas ?? 2)}${l.sufixo === '%' ? ' p.p.' : l.sufixo || ''}</span> ${seta(d, l.a)}</td>`;
  };
  return `<h2>${titulo}</h2>
    <p class="nota">${nota}${nD < 5 ? ` Desde a mudança há só ${nD} ${nD === 1 ? 'jogo' : 'jogos'}: as diferenças ainda podem ser ruído.` : ''}</p>
    <div class="tabela-env"><table class="tabela compacta et-comp">
      <thead><tr><th></th><th class="num">Total<small>${nA + nD} ${nA + nD === 1 ? 'jogo' : 'jogos'}</small></th><th class="num">Equipa técnica anterior<small>${nA} ${nA === 1 ? 'jogo' : 'jogos'}</small></th><th class="num">Equipa técnica atual<small>${nD} ${nD === 1 ? 'jogo' : 'jogos'}</small></th><th class="num">Evolução</th></tr></thead>
      <tbody>${ok.map(l => l.sep ? `<tr class="et-sep"><th colspan="5">${esc(l.sep)}</th></tr>` : `<tr><td>${esc(l.rot)}</td><td class="num et-tot">${fmt(l.t ?? null, l)}</td><td class="num">${fmt(l.a, l)}</td><td class="num">${fmt(l.d, l)}</td>${dif(l)}</tr>`).join('')}</tbody>
    </table></div>
    ${legenda ? '<p class="nota">Evolução: equipa técnica atual em relação à anterior. Verde: melhor; vermelho: pior. Sem cor: diferença inferior a 5% ou métrica de estilo.</p>' : ''}`;
}

// Sentido das métricas de equipa do Wyscout: 1 = mais é melhor, -1 = menos é melhor, 0 = estilo (sem melhor nem pior).
const SENTIDO_EQUIPA = [
  [/ppda|faltas|cart(ão|oes|ões)|cards|fouls|perdas|losses|foras de jogo|offsides|contra(?!-?\s?ataque)|against|sofrid|conceded/i, -1],
  [/posse|possession|passes longos|long passes|ritmo|tempo/i, 0],
  [/xg|golos|goals|remates|shots|toques na área|touches in|entradas|penalty area|recupera|recoveries|duelos|duels|passes certos|accurate|cruzamentos certos|cantos|corners|interce|ataques|attacks|assist/i, 1]
];
function sentidoMetricaEquipa(k) { for (const [re, s] of SENTIDO_EQUIPA) if (re.test(k)) return s; return 0; }
// Classe verde/vermelha de uma diferença: depende do sentido da métrica; variações abaixo de 5% ficam sem cor.
function classeDif(k, dif, base) {
  const s = sentidoMetricaEquipa(k); if (!s || dif === null || base === null) return '';
  if (Math.abs(dif) / (Math.abs(base) || 1) < 0.05) return '';
  return (dif > 0) === (s > 0) ? 'bom' : 'mau';
}

function desenharAntesDepoisEquipa(mets, chave) {
  const el = $('#r-et'); if (!el) return;
  const todos = jogosBaseRelatorio(); const m = marcoET();
  if (!m || !todos.some(antesDoMarco) || !todos.some(j => !antesDoMarco(j))) { el.remove(); return; }
  const f = App.rel;
  // Com «todas as competições», um quadro por competição (campeonato primeiro); com uma competição escolhida, só esse.
  const comps = [...new Set(todos.map(j => j.competicao || ''))];
  const ligas = competicoesLiga().map(norm);
  const ordem = comps.sort((a, b) => (ligas.includes(norm(b)) - ligas.includes(norm(a))) || todos.filter(j => (j.competicao || '') === b).length - todos.filter(j => (j.competicao || '') === a).length);
  const grupos = f.competicao === 'todas' && comps.length > 1
    ? ordem.filter(c => { const js = todos.filter(j => (j.competicao || '') === c); return js.some(antesDoMarco) && js.some(j => !antesDoMarco(j)); }).map(c => ({ titulo: `${ligas.includes(norm(c)) ? 'Campeonato' : nomeCompCurto(c) || 'Outros jogos'}${ligas.includes(norm(c)) ? ` · ${c}` : ''}`, js: todos.filter(j => (j.competicao || '') === c) }))
    : [{ titulo: 'Total e por equipa técnica', js: todos }];
  const porComp = f.competicao === 'todas' && comps.length > 1;
  const filtros = [f.competicao === 'todas' ? (!porComp ? 'todas as competições' : grupos.length > 1 ? 'por competição' : 'as outras competições não têm jogos antes e depois da mudança') : f.competicao, f.local === 'todos' ? '' : f.local === 'casa' ? 'em casa' : 'fora'].filter(Boolean).join(', ');
  if (!grupos.length) { el.remove(); return; }
  el.innerHTML = grupos.map((g, i) => quadroAntesDepoisEquipa(g.js, mets, chave, porComp ? `Total e por equipa técnica · ${g.titulo}` : g.titulo,
    i === 0 ? `Médias por jogo (${esc(filtros)}). A nova equipa técnica começou a ${fmtData(m)}; este quadro ignora o filtro de período.` : '', i === grupos.length - 1)).join('<div class="et-quebra"></div>');
}
function quadroAntesDepoisEquipa(base, mets, chave, titulo, nota, legenda = true) {
  const A = base.filter(antesDoMarco), D = base.filter(j => !antesDoMarco(j));
  const media = (js, f) => { const v = js.map(f).filter(Number.isFinite); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const pts = j => { const r = resultadoJogo(j); return r === 'V' ? 3 : r === 'E' ? 1 : r === 'D' ? 0 : null; };
  const xg = chaveXG(mets);
  const comEv = js => js.filter(j => (App.idx.eventos[j.id] || []).some(e => e.tipo === 'oportunidade'));
  const ops = (js, lado) => { const c = comEv(js); return c.length ? c.flatMap(j => App.idx.eventos[j.id] || []).filter(e => e.tipo === 'oportunidade' && e.lado === lado).length / c.length : null; };
  // Cada linha com o total e os dois períodos, pela mesma função.
  const T = [...A, ...D]; const tr = (rot, f, melhor, extra = {}) => ({ rot, t: f(T), a: f(A), d: f(D), melhor, ...extra });
  const L = [
    { sep: 'Resultados (por jogo)' },
    tr('Pontos', js => media(js, pts), 1),
    tr('Golos marcados', js => media(js, j => j.golos_marcados), 1),
    tr('Golos sofridos', js => media(js, j => j.golos_sofridos), -1),
    ...(xg ? [tr('xG criado', js => media(js, j => valor(j, 'nos', xg)), 1), tr('xG sofrido', js => media(js, j => valor(j, 'adversario', xg)), -1)] : []),
    tr('Oportunidades criadas (codificadas)', js => ops(js, 'nos'), 1),
    tr('Oportunidades sofridas (codificadas)', js => ops(js, 'adversario'), -1),
    { sep: 'Métricas-chave (por jogo)' },
    ...chave.filter(k => k !== xg).map(k => tr(k, js => media(js, j => valor(j, 'nos', k)), sentidoMetricaEquipa(k), { casas: ePercentagem(k) ? 1 : 2 }))
  ];
  return htmlAntesDepois(esc(titulo), nota, L, A.length, D.length, legenda);
}

function metricasChave(disponiveis) {
  const escolhidas = (App.cfg.metricas_chave || []).filter(m => disponiveis.includes(m));
  if (escolhidas.length) return escolhidas;
  const out = [];
  for (const re of PADRAO_METRICAS) { const k = disponiveis.find(m => re.test(m) && !out.includes(m)); if (k) out.push(k); }
  return out.length ? out : disponiveis.slice(0, 6);
}

// ---------- Exportação em folhas A4 ----------
// Cada página é uma folha A4 montada aqui (fundo, rodapé e margens próprias) e o conteúdo é distribuído
// pelas folhas medindo a altura de cada bloco. Assim o resultado é igual no Chrome e no Safari, que trata
// mal os elementos fixos e as quebras de página automáticas.
const FUNDO_A4 = 'img/fundo_a4.jpg';
const FUNDO_A4_H = 'img/fundo_a4_h.jpg';
const MM = 96 / 25.4;
// Blocos que nunca se partem entre páginas (se couberem numa página inteira).
const INTEIROS = '.tend-mini, .tend-grelha, figure, .campos-inteiros, .op-tab, .pj-rank, .pj-mapa-linha, .placar, .placar-cel, .grafico, .pj-mini, .cab-impressao, .cabecalho-vista, .pj-jogo, .pj-rank-cab, .campo, svg, img, tr, li, p, h1, h2, h3, h4, h5, label, button, .pre-conf, .pj-individual';
// Elementos que se repetem no topo de cada página quando o bloco continua.
const REPETIR = ':scope > thead, :scope > .pj-mapa-escala:not(.oculta-col)';

function criarFolha(horizontal) {
  const f = document.createElement('div'); f.className = 'folha' + (horizontal ? ' horizontal' : '');
  f.innerHTML = `<img class="folha-fundo" alt="" src="${horizontal ? FUNDO_A4_H : FUNDO_A4}"><div class="folha-corpo"><div class="folha-conteudo"></div></div><div class="folha-rodape">Departamento de Análise</div>`;
  return f;
}
function marcarQuebras(raiz) {
  for (const el of raiz.querySelectorAll('*')) {
    const cs = getComputedStyle(el);
    if (cs.breakBefore === 'page' || cs.pageBreakBefore === 'always') el.dataset.fqAntes = '1';
    if (cs.breakAfter === 'page' || cs.pageBreakAfter === 'always') el.dataset.fqDepois = '1';
    if (cs.breakInside === 'avoid' || cs.pageBreakInside === 'avoid') el.dataset.fqInteiro = '1';
    if (cs.breakAfter === 'avoid' || /^H[1-5]$/.test(el.tagName)) el.dataset.fqColar = '1';
    if (cs.display === 'none') el.dataset.fqOculto = '1';
  }
}
function divisivel(no, alturaNo, limite) {
  if (no.nodeType !== 1 || !no.firstElementChild) return false;
  const grande = alturaNo > limite;
  if (!grande && (no.dataset.fqInteiro || no.matches(INTEIROS))) return false;
  if (no.tagName === 'TABLE' || no.tagName === 'TBODY') return true;
  const cs = getComputedStyle(no);
  if (cs.display.startsWith('inline')) return false;
  if (/flex/.test(cs.display) && !cs.flexDirection.startsWith('column') && !grande) return false;
  if (/grid/.test(cs.display) && cs.gridTemplateColumns.split(' ').length > 1 && no.children.length <= 3 && !grande) return false;
  // Só se parte um bloco cujos filhos são blocos (texto corrido não se parte).
  for (const n of no.childNodes) {
    if (n.nodeType === 3 && n.textContent.trim()) return false;
    if (n.nodeType === 1 && !n.dataset.fqOculto && getComputedStyle(n).display.startsWith('inline')) return false;
  }
  return true;
}
function paginarEmFolhas(nos, raiz, horizontal) {
  let conteudo, limite, colocados = 0, forcar = false;
  const nova = () => {
    const f = criarFolha(horizontal); raiz.appendChild(f);
    conteudo = f.querySelector('.folha-conteudo'); limite = f.querySelector('.folha-corpo').clientHeight; colocados = 0;
    return conteudo;
  };
  const altura = () => conteudo.getBoundingClientRect().height;
  // Mede até ao fundo do último bloco colocado (a margem de baixo pode ficar fora da página).
  const cabe = no => (no ? no.getBoundingClientRect().bottom - conteudo.getBoundingClientRect().top : altura()) <= limite + 0.5;
  function fluir(filhos, destino, reabrir) {
    for (const no of filhos) {
      if (no.nodeType !== 1) { if (no.textContent.trim()) destino.appendChild(no); continue; }
      if (no.dataset.fqOculto) continue;
      if ((forcar || no.dataset.fqAntes) && colocados) destino = reabrir();
      forcar = false;
      destino.appendChild(no);
      const h = no.getBoundingClientRect().height;
      if (cabe(no)) {
        // Um título não fica sozinho no fim da página.
        if (no.dataset.fqColar && colocados && limite - altura() < 30 * MM) { no.remove(); destino = reabrir(); destino.appendChild(no); }
        colocados++;
        if (no.dataset.fqDepois) forcar = true;
        continue;
      }
      no.remove();
      if (divisivel(no, h, limite)) {
        const casca = no.cloneNode(false); casca.dataset.fqParcial = '1'; destino.appendChild(casca);
        const repetidos = [...no.querySelectorAll(REPETIR)].map(x => x.cloneNode(true));
        const reabrirFilho = () => {
          destino = reabrir();
          const c = no.cloneNode(false); c.classList.add('folha-continua'); destino.appendChild(c);
          for (const r of repetidos) c.appendChild(r.cloneNode(true));
          return c;
        };
        fluir([...no.childNodes], casca, reabrirFilho);
        if (!casca.firstElementChild) casca.remove();
        if (no.dataset.fqDepois) forcar = true;
      } else {
        // Leva consigo os títulos e notas que o precedem, para não ficarem sozinhos no fim da página.
        const levar = []; let ant = destino.lastElementChild;
        while (ant && (ant.dataset.fqColar || ant.matches('.nota, .pj-rank-legenda')) && levar.length < colocados - 1) { levar.unshift(ant); ant = ant.previousElementSibling; }
        if (colocados) { levar.forEach(x => x.remove()); destino = reabrir(); levar.forEach(x => destino.appendChild(x)); }
        destino.appendChild(no); colocados++;
        if (no.dataset.fqDepois) forcar = true;
      }
    }
    return destino;
  }
  fluir(nos, nova(), nova);
  // Folhas sem conteúdo (por exemplo, só com cascas vazias) saem.
  for (const f of [...raiz.children]) if (!f.querySelector('.folha-conteudo').textContent.trim() && !f.querySelector('.folha-conteudo img')) f.remove();
}

function paginarImpressao(horizontal = false) {
  const vista = $('#vista'); if (!vista) return () => {};
  const html = document.documentElement;

  const raiz = document.createElement('div'); raiz.className = 'folhas';
  // Trabalha sobre uma cópia: o ecrã volta ao normal sem ter de redesenhar nada.

function prepararImpressao(opcoes = {}) {

// O browser abre a janela de impressão: escolher "Guardar como PDF". O título da página serve de nome ao ficheiro.
function exportarPdf(nomeFicheiro, opcoes = {}) {

// ---- Liga ----
// Registos da liga nas mesmas jornadas e competições do período filtrado.
function ligaDoPeriodo(js) {
  const chaves = new Set(js.filter(j => j.jornada !== null && j.jornada !== undefined).map(j => `${norm(j.competicao)}|${j.jornada}`));
  if (!chaves.size || !App.d.liga?.length) return null;
  const rows = App.d.liga.filter(r => chaves.has(`${norm(r.competicao)}|${r.jornada}`));
  return rows.length ? rows : null;
}
function eNossaEquipa(nome) { return criarIdentificador(App.cfg, App.d.mapas).eNos(nome); }
// Média da liga (média das médias de cada equipa) e posição da vossa equipa (1.º = valor mais alto).
function comparacaoLiga(rows, k) {
  const porEquipa = {};
  for (const r of rows) { const v = r.metricas?.[k]; if (Number.isFinite(v)) (porEquipa[r.equipa] ||= []).push(v); }
  const medias = Object.entries(porEquipa).map(([e, vs]) => ({ e, v: media(vs) }));
  const nossa = medias.find(x => eNossaEquipa(x.e));
  if (medias.length < 2) return null;
  return { media: media(medias.map(x => x.v)), pos: nossa ? 1 + medias.filter(x => x.v > nossa.v + 1e-9).length : null, n: medias.length };
}
function classificacao(competicao) {
  const t = {};
  for (const r of App.d.liga || []) {
    if (norm(r.competicao) !== norm(competicao) || !Number.isFinite(r.golos) || !Number.isFinite(r.golos_sofridos)) continue;
    const x = (t[r.equipa] ||= { equipa: r.equipa, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 });
    x.j++; x.gm += r.golos; x.gs += r.golos_sofridos;
    if (r.golos > r.golos_sofridos) x.v++; else if (r.golos === r.golos_sofridos) x.e++; else x.d++;
  }
  return Object.values(t).map(x => ({ ...x, pts: 3 * x.v + x.e, dg: x.gm - x.gs }))
    .sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gm - a.gm || a.equipa.localeCompare(b.equipa, 'pt'));
}
function competicaoDaClassificacao(js) {
  if (App.rel.competicao !== 'todas') return App.rel.competicao;
  const comJornada = js.filter(j => j.jornada !== null && j.jornada !== undefined);
  return comJornada.length ? comJornada[comJornada.length - 1].competicao : null;
}

function seta(dif, base) {
  if (dif === null || base === null) return '';
  const rel = Math.abs(dif) / (Math.abs(base) || 1);
  if (rel < 0.05) return '<span class="seta" aria-label="estável">→</span>';
  return dif > 0 ? '<span class="seta" aria-label="a subir">↗</span>' : '<span class="seta" aria-label="a descer">↘</span>';
}

// ---- Jogadores ----
function agregarJogadores(js) {
  const ids = new Set(js.map(j => j.id));
  const linhas = App.d.estJog.filter(r => ids.has(r.jogo_id) && r.lado === 'nos');
  const mets = [...new Set(linhas.flatMap(r => Object.keys(r.metricas || {})))].filter(k => !k.startsWith('_')).sort((a, b) => a.localeCompare(b));
  const porJog = {};
  for (const r of linhas) {
    const p = (porJog[r.jogador] ||= { nome: r.jogador, pos: {}, jogos: 0, minutos: 0, tot: {}, pond: {}, minPond: {} });
    const min = Number.isFinite(r.minutos) ? r.minutos : 0;
    if (min > 0 || r.minutos === null) p.jogos++;
    p.minutos += min;
    if (r.posicao) p.pos[r.posicao] = (p.pos[r.posicao] || 0) + 1;
    for (const [k, v] of Object.entries(r.metricas || {})) {
      if (!Number.isFinite(v)) continue;
      if (ePercentagem(k)) { p.pond[k] = (p.pond[k] || 0) + v * (min || 1); p.minPond[k] = (p.minPond[k] || 0) + (min || 1); }
      else p.tot[k] = (p.tot[k] || 0) + v;
    }
  }
  const jogadores = Object.values(porJog).map(p => ({ ...p, posicao: Object.entries(p.pos).sort((a, b) => b[1] - a[1])[0]?.[0] || '' }));
  return { jogadores, mets, linhas };
}

function valorJogador(p, k, por90) {
  if (ePercentagem(k)) return p.minPond[k] ? p.pond[k] / p.minPond[k] : null;
  const t = p.tot[k]; if (!Number.isFinite(t)) return null;
  return por90 ? (p.minutos > 0 ? t / p.minutos * 90 : null) : t;
}

const AREAS_EQ = ['Ataque', 'Defesa', 'Posse'];
// Nome da métrica do ponto de vista do adversário (nas frases).
// Rankings que entram no PDF (duas métricas por área).
const RANKING_CHAVE = { Ataque: ['xg', 'toques_area'], Defesa: ['xg_sofrido', 'ppda'], Posse: ['passes_pct', 'progressivos'] };
const NOME_ADV = { xg: 'xG', toques_area: 'toques na área', remates: 'remates', op_criadas: 'oportunidades', xg_sofrido: 'xG', toques_area_sof: 'toques na área', remates_sofridos: 'remates', op_sofridas: 'oportunidades' };
const DEF_EQ = Object.fromEntries(METRICAS_EQ.map(d => [d.id, d]));
const LS_METRICAS_REL = 'analise_rel_metricas';
// Limiares: um desvio-padrão para assinalar uma diferença; os indicadores individuais são mais exigentes.
const LIMIAR_EQ = 1, LIMIAR_TENDENCIA = 0.75, LIMIAR_IND = 1.25, MIN_MINUTOS = 45;

function valorEq(def, L) {
  if (!L) return null;
  if (def.ops) return L.ops ? L.ops[def.ops] : null;
  const k = def.k && chaveExistente(L.m, def.k); if (k) return L.m[k];
  const ka = def.ka && chaveExistente(L.a, def.ka); return ka ? L.a[ka] : null;
}
const fmtEq = (def, n) => (n === null || n === undefined ? '–' : `${fmtNum(n, def.casas)}${def.pct ? '%' : ''}`);
const fmtDifEq = (def, n) => (n === null || n === undefined ? '–' : `${fmtSinal(n, def.casas)}${def.pct ? ' p.p.' : ''}`);
function desvio(arr) {
  const v = arr.filter(Number.isFinite); if (v.length < 2) return null;
  const m = media(v); return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1));
}
const mesmaEq = (a, b) => !!a && !!b && (norm(a) === norm(b) || mesmaEquipa(a, b));

// ---- Dados ----
function contarOps(a) {
  const evs = (App.idx.eventosAlvo?.[a.key] || []).filter(e => e.tipo === 'oportunidade');
  if (!evs.length) return null;
  const c = { casa: 0, fora: 0 };
  for (const e of evs) { const l = ladoNoAlvo(e, a); if (l) c[l]++; }
  return c;
}
function opsDoJogo(j) {
  const a = App.idx.alvoJogo?.[j.id]; if (!a || !a.ladoNosso) return null;
  const c = contarOps(a); if (!c) return null;
  return { c: c[a.ladoNosso], s: c[a.ladoNosso === 'casa' ? 'fora' : 'casa'] };
}
// Os nossos jogos já disputados, por ordem.
function linhasNossas() {
  return App.d.jogos.filter(j => App.idx.estEq[j.id]?.nos || resultadoJogo(j)).sort(compararJogos)
    .map(j => ({ j, m: App.idx.estEq[j.id]?.nos || {}, a: App.idx.estEq[j.id]?.adversario || {}, ops: opsDoJogo(j) }));
}
// Uma linha por equipa e por jogo do ficheiro da liga, com a linha do adversário ao lado.
function linhasLiga(competicao, ateJornada) {
  if (!competicao) return [];
  const rows = (App.d.liga || []).filter(r => norm(r.competicao) === norm(competicao) && (ateJornada == null || r.jornada <= ateJornada));
  const porChave = {}; for (const r of rows) porChave[`${r.jornada}|${norm(r.equipa)}|${norm(r.adversario)}`] = r;
  const alvoPor = {};
  for (const a of App.idx.alvos || []) {
    if (a.jornada == null || norm(a.competicao) !== norm(competicao)) continue;
    alvoPor[`${a.jornada}|${norm(a.casa)}`] = { a, l: 'casa' }; alvoPor[`${a.jornada}|${norm(a.fora)}`] = { a, l: 'fora' };
  }
  const cache = {};
  return rows.map(r => {
    const op = porChave[`${r.jornada}|${norm(r.adversario)}|${norm(r.equipa)}`];
    const x = alvoPor[`${r.jornada}|${norm(r.equipa)}`]; let ops = null;
    if (x) { const c = (cache[x.a.key] ??= contarOps(x.a)); if (c) ops = { c: c[x.l], s: c[x.l === 'casa' ? 'fora' : 'casa'] }; }
    return { jornada: r.jornada, equipa: r.equipa, adversario: r.adversario, local: r.local, m: r.metricas || {}, a: op?.metricas || {}, ops };
  });
}
function metricasDoRelatorio(disponiveis) {
  const guardadas = App.cfg.relatorio_equipa?.metricas || lsGet(LS_METRICAS_REL);
  const ids = Array.isArray(guardadas) && guardadas.length ? guardadas.filter(id => DEF_EQ[id]) : METRICAS_EQ.map(d => d.id);
  return ids.filter(id => disponiveis.has(id)).map(id => DEF_EQ[id]);
}

// ---- Análise do jogo ----
function analisarMetrica(def, linhas, i, liga) {
  const L = linhas[i]; const x = valorEq(def, L); if (x === null || x === undefined) return null;
  const hist = linhas.slice(0, i).map(l => valorEq(def, l)).filter(Number.isFinite);
  const mu = media(hist), sd = desvio(hist);
  const z = hist.length >= 3 && sd > 0 ? (x - mu) / sd : null;
  // Último jogo anterior com valor (um jogo só com resultado, sem estatísticas, é saltado).
  let ant = null, antJ = null, antSalto = false;
  for (let k = i - 1; k >= 0; k--) { const v = valorEq(def, linhas[k]); if (Number.isFinite(v)) { ant = v; antJ = linhas[k].j; antSalto = k < i - 1; break; } }
  const ult5 = linhas.slice(Math.max(0, i - 4), i + 1).map(l => valorEq(def, l)).filter(Number.isFinite);
  const u5 = ult5.length >= 3 ? media(ult5) : null;
  const zt = hist.length >= 5 && sd > 0 && u5 !== null ? (u5 - mu) / sd : null;
  let recorde = null;
  if (hist.length >= 4) { if (x > Math.max(...hist)) recorde = 'max'; else if (x < Math.min(...hist)) recorde = 'min'; }
  // Valor esperado para ESTE jogo: a nossa média, mais o quanto o adversário se afasta da média da liga
  // (o que as equipas costumam ter contra ele: o que ele concede, ou o que ele cria nas métricas do que sofremos),
  // mais o efeito de jogar em casa ou fora. O peso do adversário cresce com os jogos dele (n / (n + 4)).
  let esperado = null, nEsp = 0, efeitoAdv = null, efeitoLocal = 0, esp = null, muL = null;
  if (liga.length) {
    const outros = liga.filter(l => !eNossaEquipa(l.equipa));
    const vals = outros.map(l => valorEq(def, l)).filter(Number.isFinite);
    const vs = outros.filter(l => mesmaEq(l.adversario, L.j.adversario)).map(l => valorEq(def, l)).filter(Number.isFinite);
    if (vs.length >= 2) { esperado = media(vs); nEsp = vs.length; }
    if (vs.length >= 3 && vals.length >= 10 && mu !== null && hist.length >= 3) {
      muL = media(vals);
      efeitoAdv = (esperado - muL) * vs.length / (vs.length + 4);
      const lado = L.j.local === 'casa' || L.j.local === 'fora' ? outros.filter(l => l.local === L.j.local).map(l => valorEq(def, l)).filter(Number.isFinite) : [];
      if (lado.length >= 10) efeitoLocal = media(lado) - muL;
      esp = mu + efeitoAdv + efeitoLocal;
      if (def.pct) esp = Math.max(0, Math.min(100, esp)); else esp = Math.max(0, esp);
    }
  }
  const sMedia = z !== null ? z * def.melhor : null; // positivo = melhor do que a nossa média
  const zEsp = esp !== null && sd > 0 ? (x - esp) / sd : null;
  // A avaliação usa o esperado quando existe; senão, a nossa média.
  const s = zEsp !== null ? zEsp * def.melhor : sMedia;
  return { def, x, mu, sd, z, s, sMedia, zEsp, esp, efeitoAdv, efeitoLocal, muL, n: hist.length, ant, antJ, antSalto, u5, zt, recorde, esperado, nEsp };
}

// Indicadores individuais: cada jogador comparado com a sua própria média (por 90 min).
function alertasIndividuais(linhas, i) {
  const jogo = linhas[i].j; const anteriores = linhas.slice(0, i).map(l => l.j);
  const regs = (App.idx.estJog[jogo.id] || []).filter(r => r.lado === 'nos' && r.minutos >= MIN_MINUTOS);
  const valor = (r, id) => {
    const def = METRICAS[id]; const v = valorMetricaJogo(r.metricas || {}, id); if (!Number.isFinite(v)) return null;
    if (def.d) { const kd = chaveExistente(r.metricas, def.d); return kd && r.metricas[kd] >= 4 ? v : null; }
    return v / r.minutos * 90;
  };
  const out = [];
  for (const r of regs) {
    const perfil = perfilDoJogador(r.jogador, r); if (!perfil) continue;
    const ids = [...new Set(BLOCOS.flatMap(b => PERFIS[perfil][b]))].filter(id => !METRICAS[id].estilo);
    const hist = anteriores.map(g => (App.idx.estJog[g.id] || []).find(x => x.lado === 'nos' && x.jogador === r.jogador && x.minutos >= MIN_MINUTOS)).filter(Boolean);
    if (hist.length < 3) continue;
    const cand = [];
    for (const id of ids) {
      const x = valor(r, id); if (x === null) continue;
      const h = hist.map(g => valor(g, id)).filter(Number.isFinite); if (h.length < 3) continue;
      const mu = media(h), sd = desvio(h); if (!sd) continue;
      if (x === 0 && METRICAS[id].menos) continue; // zero de algo negativo raramente é notícia
      const s = (x - mu) / sd * (METRICAS[id].menos ? -1 : 1);
      if (Math.abs(s) >= LIMIAR_IND) cand.push({ jogador: r.jogador, minutos: r.minutos, id, x, mu, s, pct: !!METRICAS[id].d });
    }
    cand.sort((a, b) => Math.abs(b.s) - Math.abs(a.s));
    out.push(...cand.filter(c => c.s > 0).slice(0, 2), ...cand.filter(c => c.s < 0).slice(0, 2));
  }
  return { destaque: out.filter(c => c.s > 0).sort((a, b) => b.s - a.s).slice(0, 6), abaixo: out.filter(c => c.s < 0).sort((a, b) => a.s - b.s).slice(0, 6), n: regs.length };
}

function cabecalhoJogo(L, nome) {
  const j = L.j; const res = resultadoJogo(j);
  const gm = j.golos_marcados ?? '–', gs = j.golos_sofridos ?? '–';
  const [casa, fora, gc, gf] = j.local === 'fora' ? [j.adversario, nome, gs, gm] : [nome, j.adversario, gm, gs];
  const xg = valorEq(DEF_EQ.xg, L), xgs = valorEq(DEF_EQ.xg_sofrido, L);
  // Mesma ordem do resultado (casa–fora).
  const emFora = j.local === 'fora'; const par = (a, b) => (emFora ? `${b}–${a}` : `${a}–${b}`);
  const extra = [xg !== null && xgs !== null ? `xG ${par(fmtNum(xg, 2), fmtNum(xgs, 2))}` : '', L.ops ? `oportunidades ${par(L.ops.c, L.ops.s)}` : ''].filter(Boolean).join(' · ');
  return `
    <p class="pj-meta">${[j.competicao, j.jornada != null ? `Jornada ${j.jornada}` : '', j.data ? fmtData(j.data) : '', j.local === 'casa' ? 'Em casa' : j.local === 'fora' ? 'Fora' : ''].filter(Boolean).map(esc).join(' · ')}</p>
    <div class="pj-placar">
      <span class="pj-eq ${j.local === 'fora' ? '' : 'nossa'}">${esc(casa)}</span>
      <span class="pj-res">${gc}<i>–</i>${gf}</span>
      <span class="pj-eq ${j.local === 'fora' ? 'nossa' : ''}">${esc(fora)}</span>
      ${res ? `<span class="res res-${res}" aria-label="${({ V: 'Vitória', E: 'Empate', D: 'Derrota' })[res]}">${res}</span>` : ''}
    </div>
    ${extra ? `<p class="pj-extra">${esc(extra)}</p>` : ''}`;
}

// Frases com as conclusões mais pertinentes do jogo.
function htmlConclusoes(L, an, nome) {
  const j = L.j; const por = id => an.find(a => a.def.id === id);
  const frases = [];
  const xg = por('xg'), xgs = por('xg_sofrido');
  if (xg && xgs && Number.isFinite(j.golos_marcados)) {
    const dif = xg.x - xgs.x; const res = resultadoJogo(j);
    let leitura = '';
    if (res !== 'V' && dif >= 0.5) leitura = ' O desempenho justificava mais do que o resultado.';
    else if (res !== 'D' && dif <= -0.5) leitura = ' O resultado foi melhor do que o desempenho.';
    else if (Math.abs(dif) < 0.3) leitura = ' Um jogo equilibrado em qualidade de oportunidades.';
    const ef = j.golos_marcados - xg.x;
    if (ef >= 1) leitura += ' Muito eficazes na finalização.'; else if (ef <= -1) leitura += ' Faltou eficácia na finalização.';
    frases.push({ t: dif >= 0.3 ? 'bom' : dif <= -0.3 ? 'mau' : 'neutro', h: `${({ V: 'Vitória', E: 'Empate', D: 'Derrota' })[res] || 'Resultado'} por ${j.golos_marcados}–${j.golos_sofridos} com <b>${fmtNum(xg.x, 2)}</b> de xG criado e <b>${fmtNum(xgs.x, 2)}</b> sofrido.${leitura}` });
  }
  // Recordes: em relação à nossa própria época (o ajuste ao adversário entra nas frases seguintes).
  const assinaladas = an.filter(a => a.sMedia !== null && Math.abs(a.sMedia) >= LIMIAR_EQ).sort((a, b) => Math.abs(b.sMedia) - Math.abs(a.sMedia));
  const frase = a => {
    const acima = a.x > a.mu; const forte = Math.abs(a.z) >= 2 ? 'muito ' : '';
    const rec = a.recorde ? ` É o valor mais ${a.recorde === 'max' ? 'alto' : 'baixo'} da época.` : '';
    const ctx = a.esp !== null && Math.sign(a.s) !== Math.sign(a.sMedia) ? ` Mas, contra este adversário, esperava-se ${fmtEq(a.def, a.esp)}: foi ${a.s > 0 ? 'melhor' : 'pior'} do que o esperado.` : '';
    return `<b>${esc(a.def.nome)}</b>: ${fmtEq(a.def, a.x)}, ${forte}${acima ? 'acima' : 'abaixo'} da média da época (${fmtEq(a.def, a.mu)}).${rec}${ctx}`;
  };
  // Recordes da época (o resto das diferenças aparece nas listas abaixo).
  for (const a of assinaladas.filter(a => a.recorde && a.def.melhor).slice(0, 3)) frases.push({ id: a.def.id, t: (Math.sign(a.s) !== Math.sign(a.sMedia) ? a.s : a.sMedia) > 0 ? 'bom' : 'mau', h: frase(a) });
  // Contra este adversário. Primeiro, as métricas em que as duas leituras se contradizem
  // (pior do que a nossa média, mas melhor do que o esperado contra este adversário, ou o contrário).
  const adv = esc(j.adversario);
  const papel = a => a.def.ops ? (a.def.ops === 'c' ? 'ataque' : 'defesa') : /sofrid|_sof$/.test(a.def.id) ? 'defesa' : 'ataque';
  const nomeM = a => esc(a.def.nome.toLowerCase());
  const habitoAdv = a => `contra o ${adv}, as outras equipas têm em média <b>${fmtEq(a.def, a.esperado)}</b> de ${nomeM(a)} (média da liga: ${fmtEq(a.def, a.muL)})`;
  const ditos = new Set(frases.map(f => f.id).filter(Boolean));
  const contra = an.filter(a => !ditos.has(a.def.id) && a.zEsp !== null && a.sMedia !== null && a.def.melhor && Math.abs(a.s) >= 0.8 && Math.abs(a.sMedia) >= 0.5 && Math.sign(a.s) !== Math.sign(a.sMedia))
    .sort((p, q) => Math.abs(q.s) - Math.abs(p.s)).slice(0, 3);
  for (const a of contra) {
    const bom = a.s > 0;
    frases.push({ t: bom ? 'bom' : 'mau', h: `<b>${esc(a.def.nome)}</b>: ${fmtEq(a.def, a.x)}, ${a.x > a.mu ? 'acima' : 'abaixo'} da nossa média (${fmtEq(a.def, a.mu)}), mas ${habitoAdv(a)}. Para este jogo esperava-se <b>${fmtEq(a.def, a.esp)}</b>: ${bom ? 'foi melhor do que o esperado' : 'foi pior do que o esperado'}.` });
  }
  // Depois, em ataque e em defesa, o maior desvio em relação ao esperado (se ainda não foi dito).
  for (const lado of ['ataque', 'defesa']) {
    const c = an.filter(a => !ditos.has(a.def.id) && a.zEsp !== null && a.def.melhor && papel(a) === lado && !contra.includes(a) && Math.abs(a.s) >= LIMIAR_EQ).sort((p, q) => Math.abs(q.s) - Math.abs(p.s))[0];
    if (!c) continue;
    const bom = c.s > 0;
    frases.push({ t: bom ? 'bom' : 'mau', h: `<b>${esc(c.def.nome)}</b>: ${fmtEq(c.def, c.x)}, contra <b>${fmtEq(c.def, c.esp)}</b> esperados para este jogo. A nossa média é ${fmtEq(c.def, c.mu)}; ${habitoAdv(c)}${c.efeitoLocal ? `; a jogar ${j.local === 'casa' ? 'em casa' : 'fora'}` : ''}. ${bom ? 'Melhor' : 'Pior'} do que o esperado.` });
  }
  // Tendências dos últimos 5 jogos.
  const tend = an.filter(a => a.zt !== null && a.def.melhor && Math.abs(a.zt) >= LIMIAR_TENDENCIA).sort((a, b) => Math.abs(b.zt) - Math.abs(a.zt));
  for (const a of [tend.find(a => a.zt * a.def.melhor > 0), tend.find(a => a.zt * a.def.melhor < 0)].filter(Boolean)) {
    const bom = a.zt * a.def.melhor > 0;
    frases.push({ t: bom ? 'bom' : 'mau', h: `Tendência dos últimos 5 jogos: <b>${esc(a.def.nome)}</b> ${bom ? 'a melhorar' : 'a piorar'} (${fmtEq(a.def, a.u5)} por jogo, contra ${fmtEq(a.def, a.mu)} na época).` });
  }
  if (!frases.length) return '<p class="fraco">Sem diferenças relevantes em relação ao habitual.</p>';
  return `<ul class="pj-conclusoes">${frases.map(f => `<li class="${f.t}"><span class="pj-icone" aria-hidden="true">${f.t === 'bom' ? '▲' : f.t === 'mau' ? '▼' : '●'}</span><span>${f.h}</span></li>`).join('')}</ul>`;
}

function htmlMelhoriasPioras(an) {

    <li><div class="pj-al-nome">${esc(a.def.nome)}</div>

    <p class="nota">${an.some(a => a.esp !== null) ? 'O esperado é a nossa média ajustada a este adversário (o que as equipas costumam ter contra ele, ou o que ele costuma ter) e a jogar em casa ou fora, com base no ficheiro da liga. Sem jogos suficientes do adversário (pelo menos 3), a comparação é só com a nossa média. ' : 'Sem o ficheiro da liga com jogos suficientes deste adversário, a comparação é só com a nossa média. '}Assinalado quando o valor se afasta mais de um desvio-padrão, no sentido bom ou mau de cada métrica.</p>`;
}

// Bom/mau em relação à média (para cores).
function classeEq(a) { return a.s === null || !a.def.melhor ? '' : a.s >= LIMIAR_EQ ? 'bom' : a.s <= -LIMIAR_EQ ? 'mau' : ''; }
function desenharMini(a, linhas, i) {
  const cv = $(`canvas[data-mini="${a.def.id}"]`); if (!cv) return;
  // Só os jogos com valor (ex.: jogos da taça sem estatísticas ficam de fora); o último é este jogo.
  const ls = linhas.slice(0, i + 1).filter(l => Number.isFinite(valorEq(a.def, l)));
  const vals = ls.map(l => valorEq(a.def, l)); i = ls.length - 1;
  const mu = media(vals.length > 1 ? vals.slice(0, -1) : vals);
  const c = classeEq(a); const destaque = c === 'bom' ? '#1F7A4D' : c === 'mau' ? '#B42318' : '#13284A';
  novoGrafico(cv, {
    type: 'bar',
    data: {
      labels: ls.map(l => (l.j.jornada != null ? `J${l.j.jornada}` : fmtData(l.j.data, true))),

// ---------- Método de codificação de oportunidades (departamento) ----------
const BOLA_CORRIDA = ['Cruzamento alto', 'Cruzamento rasteiro', 'Cruzamento atrasado', 'Rotura', 'Combinação interior', '1x1', 'Remate exterior', '2.ª bola'];
const MOMENTOS = {
  'Organização': { sub: ['Jogo exterior', 'Jogo interior'] },
  'Transição': { sub: ['Ataque rápido', 'Contra-ataque', 'Recuperação alta'] },
  'Esquema tático': { sub: ['Canto', 'Livre', 'Lançamento', 'Penálti'] }
};
const MEC_ESQUEMA = { Canto: ['Direto', 'Combinado', '2.ª bola'], Livre: ['Remate direto', 'Cruzamento', 'Combinado', '2.ª bola'], 'Lançamento': ['Direto', 'Combinado', '2.ª bola'], 'Penálti': [] };
const TEMPOS = ['0-15', '15-30', '30-45', '45-60', '60-75', '75-90', 'Prolongamento'];
const CORREDORES = ['Esquerdo', 'Centro', 'Direito'];
const POSICOES_EV = ['Guarda-redes', 'Defesa direito', 'Defesa central', 'Defesa esquerdo', 'Médio defensivo', 'Médio centro', 'Médio ofensivo', 'Extremo direito', 'Extremo esquerdo', 'Ponta de lança'];
const RESULTADOS = ['Golo', 'Defesa do GR', 'Fora', 'Bloqueado', 'Ferro'];
const MAIS_DETALHES = { finalizacao: ['Pé direito', 'Pé esquerdo', 'Cabeça', 'Outra'] };

function mecanismosDe(momento, sub) {
  if (momento === 'Esquema tático') return MEC_ESQUEMA[sub] || [];
  return momento ? BOLA_CORRIDA : [];
}
function tempoDoMinuto(m) {
  if (!Number.isFinite(m)) return null;
  if (m > 90 && m <= 95) return '75-90'; // descontos da 2.ª parte
  if (m > 95) return 'Prolongamento';
  return TEMPOS[Math.min(5, Math.floor(Math.max(0, m - 0.0001) / 15))];
}
const parteDoTempo = t => (!t ? null : t === 'Prolongamento' ? 'Prolongamento' : ['0-15', '15-30', '30-45'].includes(t) ? '1.ª parte' : '2.ª parte');

// ---- Normalização (folha antiga e eventos da primeira versão da app) ----
const procurar = (lista, v) => lista.find(x => norm(x) === norm(v)) || null;
function normMomento(v) {
  const t = norm(v);
  if (!t) return null;
  if (t.startsWith('organiza')) return 'Organização';
  if (t.startsWith('transi') || t === 'recuperacao alta') return 'Transição';
  if (t.startsWith('esquema') || t.startsWith('bola parada')) return 'Esquema tático';
  return v;
}
function normSub(momento, v) {
  const t = norm(v);
  if (!t || t === '-') return null;
  if (t.startsWith('lancamento')) return 'Lançamento';
  if (t.startsWith('penal')) return 'Penálti';
  return procurar(MOMENTOS[momento]?.sub || [], v) || procurar(Object.values(MOMENTOS).flatMap(m => m.sub), v) || v.trim();
}
// Um só mecanismo: a última ação que criou a oportunidade ("1x1, Cruzamento Alto" -> Cruzamento alto),
// exceto o remate exterior depois de outra ação ("2ª Bola, Remate Exterior" -> 2.ª bola).
function normMecanismo(momento, sub, v) {
  let partes = String(v ?? '').split(',').map(x => x.trim()).filter(x => x && x !== '-');
  if (!partes.length) return null;
  if (partes.length > 1 && norm(partes[partes.length - 1]) === 'remate exterior') partes = partes.slice(0, -1);
  const raw = partes[partes.length - 1]; const t = norm(raw);
  const segunda = t === '2 bola' || t === '2a bola' || t === 'segunda bola';
  if (momento === 'Esquema tático') {
    if (sub === 'Penálti') return null;
    if (segunda) return '2.ª bola';
    if (t.startsWith('cruzamento')) return sub === 'Livre' ? 'Cruzamento' : 'Direto';
    if (t === 'direto') return sub === 'Livre' ? 'Remate direto' : 'Direto';
    return procurar(MEC_ESQUEMA[sub] || [], raw) || procurar(BOLA_CORRIDA, raw) || raw;
  }
  if (segunda) return '2.ª bola';
  return procurar(BOLA_CORRIDA, raw) || raw;
}
function normPosicao(v) {
  const t = norm(v); if (!t || t === '-') return null;
  if (t === 'guarda redes' || t === 'gr') return 'Guarda-redes';
  const m = { 'lateral direito': 'Defesa direito', 'lateral esquerdo': 'Defesa esquerdo' }[t];
  return m || procurar(POSICOES_EV, v) || v.trim();
}
const normNome = v => { const s = String(v ?? '').trim(); return !s || s === '-' ? null : s; };

// Dados de uma oportunidade, já normalizados (para análises e listas).
function dadosOportunidade(e) {
  const momento = normMomento(e.momento) || (e.tipo === 'esquema_tatico' ? 'Esquema tático' : null);
  const sub = e.sub_momento || (e.tipo === 'esquema_tatico' ? normSub('Esquema tático', e.subtipo) : (norm(e.momento) === 'recuperacao alta' ? 'Recuperação alta' : null));
  return {
    momento, sub, mecanismo: e.mecanismo || e.ultima_acao || null,
    corredor: e.corredor || null, tempo: e.tempo || tempoDoMinuto(e.minuto), parte: e.parte || parteDoTempo(e.tempo || tempoDoMinuto(e.minuto)),
    golo: e.resultado === 'Golo'
  };
}

// ---- Zonas do método antigo (mapa do departamento) ----
// Coordenadas da app: x e y em % (0–100), a atacar para a direita; y pequeno = lado esquerdo de quem ataca.
const M = { comp: 105, larg: 68, area: 16.5, areaY0: 13.84, areaY1: 54.16, peq: 5.5, peqY0: 24.84, peqY1: 43.16 };
const distBaliza = x => (100 - x) / 100 * M.comp;
const metrosY = y => y / 100 * M.larg;
// Faixas do método do departamento: 1-3 junto à baliza (até meio da área), 4-6 até à linha da área, 7-9 até aos 30 m, 10-12 até ao meio-campo.
const FAIXAS_PASSE = [[0, 8.25], [8.25, 16.5], [16.5, 30], [30, 52.5]];
// Faixas usadas até novembro de 2026. As oportunidades importadas da folha nessa altura (origem 'folha') têm o ponto
// gerado dentro destas faixas: ao carregar, o ponto passa para a mesma posição relativa na faixa nova, mantendo o n.º da zona.

const CORR_PASSE = [[0, M.areaY0], [M.areaY0, M.areaY1], [M.areaY1, M.larg]];

  let s = 0; for (const ch of String(semente)) s = (s * 31 + ch.charCodeAt(0)) >>> 0;

  const soEstat = [...new Set(App.d.estJog.filter(r => r.lado === 'nos').map(r => r.jogador))].filter(n => !vistos.has(norm(n))).sort((a, b) => a.localeCompare(b, 'pt'));
  return [...doPlantel, ...soEstat];
}

function idade(dataNasc) {
  if (!dataNasc) return null;
  const [y, m, d] = dataNasc.split('-').map(Number); const h = new Date();
  return h.getFullYear() - y - ((h.getMonth() + 1 < m || (h.getMonth() + 1 === m && h.getDate() < d)) ? 1 : 0);
}
function metaJogador(pj) {
  return [pj.posicao, idade(pj.data_nascimento) !== null ? `${idade(pj.data_nascimento)} anos` : null, pj.altura ? `${pj.altura} cm` : null, pj.pe].filter(Boolean).join(' · ');
}
function avatarJogador(pj, classe = '') {
  const num = pj?.numero ?? null;
  if (pj?.foto) return `<span class="avatar ${classe}"><img src="${esc(pj.foto)}" alt="">${num !== null ? `<b class="avatar-num">${num}</b>` : ''}</span>`;
  const iniciais = String(pj?.nome || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
  return `<span class="avatar avatar-sem-foto ${classe}">${num !== null ? num : esc(iniciais)}</span>`;
}

          <p class="nota">${esc(descricaoFiltros(js))}${pj?.nome_wyscout && pj.nome_wyscout !== pj.nome ? ` · no Wyscout: ${esc(pj.nome_wyscout)}` : ''}${pj?.tm_url && /^https:\/\/([\w-]+\.)?transfermarkt\./.test(pj.tm_url) ? ` · <a class="so-ecra" href="${esc(pj.tm_url)}" target="_blank" rel="noopener">Ver no Transfermarkt</a>` : ''}</p>
        </div>
      </div>
      <div class="ficha-acoes so-ecra">

        ${ehDep() ? `<button class="btn" id="f-editar">${pj ? 'Editar dados' : 'Adicionar ao plantel'}</button>` : ''}

function desenharPlacarJogador(p, js, regs, perfil) {
  const possiveis = js.length * 90;
  const titular = regs.filter(r => Number(r.minutos) >= 60).length;
  const cel = (rot, val, sub = '') => `<div class="placar-cel"><span class="placar-rot">${rot}</span><span class="placar-val">${val}</span>${sub ? `<span class="placar-sub">${sub}</span>` : ''}</div>`;
  const tot = c => valorSinonimo(p.tot, c);
  const p90 = c => (tot(c) !== null && p.minutos > 0 ? tot(c) / p.minutos * 90 : null);
  const g = tot('golos'), a = tot('assistencias');
  if (perfil === 'gr') {
    const v = id => valorMetrica(p, id), tj = id => regs.reduce((acc, r) => acc + (valorMetricaJogo(r.metricas || {}, id) ?? 0), 0);
    const semSofrer = regs.filter(r => (valorMetricaJogo(r.metricas || {}, 'gr_sofridos') ?? 1) === 0 && Number(r.minutos) >= 60).length;
    $('#f-placar').innerHTML = [
      cel('Jogos', p.jogos, `${regs.filter(r => Number(r.minutos) >= 60).length} com 60+ minutos`),
      cel('Minutos', fmtNum(p.minutos, 0), possiveis ? `${fmtNum(p.minutos / possiveis * 100, 0)}% dos possíveis` : ''),
      v('gr_sofridos') !== null ? cel('Golos sofridos', fmtNum(tj('gr_sofridos'), 0), `${fmtNum(v('gr_sofridos'), 2)} por 90 min`) : '',
      v('gr_defesas_pct') !== null ? cel('Defesas', `${fmtNum(v('gr_defesas_pct'), 0)}%`, `${fmtNum(tj('gr_defesas'), 0)} de ${fmtNum(tj('gr_remates'), 0)} remates`) : '',
      v('gr_evitados') !== null ? cel('Golos evitados', fmtSinal(tj('gr_evitados'), 1), 'xG contra − golos sofridos') : '',
      cel('Sem sofrer', semSofrer, 'jogos com 60+ minutos')
    ].join('');
    return;
  }
  $('#f-placar').innerHTML = [
    cel('Jogos', p.jogos, `${titular} com 60+ minutos`),
    cel('Minutos', fmtNum(p.minutos, 0), possiveis ? `${fmtNum(p.minutos / possiveis * 100, 0)}% dos possíveis` : ''),
    g !== null ? cel('Golos', fmtNum(g, 0), `${fmtNum(p90('golos'), 2)} por 90 min`) : '',
    a !== null ? cel('Assistências', fmtNum(a, 0), `${fmtNum(p90('assistencias'), 2)} por 90 min`) : '',
    tot('xg') !== null ? cel('xG', fmtNum(tot('xg'), 2), `${fmtNum(p90('xg'), 2)} por 90 min`) : '',
    tot('xa') !== null ? cel('xA', fmtNum(tot('xa'), 2), `${fmtNum(p90('xa'), 2)} por 90 min`) : ''
  ].join('');
}

// Antes e desde a nova equipa técnica: utilização e métricas do perfil, por 90 minutos.
function desenharAntesDepoisJogador(nome, perfil) {

  const pA = A.length ? de(A) : null, pD = D.length ? de(D) : null, pT = de([...A, ...D]); const T = [...A, ...D];
  if (!A.length || !D.length || (!pA && !pD)) { el.remove(); return; }
  const regs = js => { const ids = new Set(js.map(j => j.id)); return App.d.estJog.filter(r => r.lado === 'nos' && ids.has(r.jogo_id) && norm(r.jogador) === norm(nome)); };
  const tit = js => regs(js).filter(r => Number(r.minutos) >= 60).length;
  const P = PERFIS[perfil] || PERFIS.central;
  const L = [
    { sep: 'Utilização' },
    { rot: 'Jogos', t: pT?.jogos ?? 0, a: pA?.jogos ?? 0, d: pD?.jogos ?? 0, casas: 0, melhor: 0, semDif: true },
    { rot: 'Minutos por jogo da equipa', t: (pT?.minutos ?? 0) / T.length, a: (pA?.minutos ?? 0) / A.length, d: (pD?.minutos ?? 0) / D.length, casas: 0, melhor: 0 },
    { rot: 'Jogos com 60+ minutos (%)', t: tit(T) / T.length * 100, a: tit(A) / A.length * 100, d: tit(D) / D.length * 100, casas: 0, sufixo: '%', melhor: 0 },
    ...BLOCOS.flatMap(b => { const ids = (P[b] || []).filter(id => METRICAS[id]); if (!ids.length) return [];
      return [{ sep: `${b} (por 90 min)` }, ...ids.map(id => { const d = METRICAS[id]; return { rot: d.r, t: pT ? valorMetrica(pT, id) : null, a: pA ? valorMetrica(pA, id) : null, d: pD ? valorMetrica(pD, id) : null, melhor: d.estilo ? 0 : d.menos ? -1 : 1, casas: d.d ? 0 : 2, sufixo: d.d ? '%' : '' }; })]; })
  ];
  el.innerHTML = htmlAntesDepois('Total e por equipa técnica', `Perfil: ${esc(P.nome)}. A nova equipa técnica começou a ${fmtData(m)}; este quadro ignora o filtro de período. Com poucos minutos num dos períodos, os valores por 90 minutos oscilam muito.`, L, A.length, D.length);
}

function desenharPerfil(p, jogadores, perfil) {
  const J = App.jog; const el = $('#f-perfil'); const P = PERFIS[perfil];
  const maxMin = Math.max(...jogadores.map(x => x.minutos));
  const minimo = Math.min(270, Math.round(maxMin * 0.25));
  const base = jogadores.filter(x => x.minutos >= minimo || x.nome === p.nome);
  // Grupo de comparação: mesmo perfil; se forem menos de 3, o mesmo setor (ex.: todos os defesas); senão, o plantel.
  const SETOR = { gr: 'gr', central: 'def', lateral: 'def', medio: 'med', ofensivo: 'ata', pl: 'ata' };
  const mesmoPerfil = base.filter(x => x.nome === p.nome || perfilDoJogador(x.nome, x) === perfil);
  const mesmoSetor = base.filter(x => x.nome === p.nome || SETOR[perfilDoJogador(x.nome, x)] === SETOR[perfil]);
  const opcaoPosicao = mesmoPerfil.length >= 3 ? 'perfil' : mesmoSetor.length >= 3 ? 'setor' : null;
  const porPerfil = J.comparar !== 'plantel' && !!opcaoPosicao;
  const grupo = !porPerfil ? base : opcaoPosicao === 'perfil' ? mesmoPerfil : mesmoSetor;
  const nomeSetor = { gr: 'guarda-redes', def: 'defesas', med: 'médios', ata: 'avançados e extremos' }[SETOR[perfil]];

  const linha = id => {
    const def = METRICAS[id];
    const meu = valorMetrica(p, id); if (meu === null) return null;
    const lista = grupo.map(x => valorMetrica(x, id)).filter(v => v !== null);
    if (lista.length < 2) return { id, def, meu, so: true };
    const mn = Math.min(...lista), mx = Math.max(...lista), md = media(lista);
    const pos = 1 + lista.filter(x => (def.menos ? x < meu - 1e-9 : x > meu + 1e-9)).length;
    const esc01 = x => mx === mn ? 50 : (x - mn) / (mx - mn) * 100;
    return { id, def, meu, mn, mx, md, pos, n: lista.length, pMeu: esc01(meu), pMd: esc01(md) };
  };
  const casas = id => (ePct(id) ? 1 : 2);
  const fmt = (id, v) => `${fmtNum(v, casas(id))}${ePct(id) ? '%' : ''}`;
  const blocos = BLOCOS.map(b => ({ b, linhas: P[b].map(linha).filter(Boolean) })).filter(x => x.linhas.length);
  const temComparacao = blocos.some(x => x.linhas.some(l => !l.so));
  el.innerHTML = `
    <div class="bloco-cab"><h2>Perfil: ${esc(P.nome)}</h2>
      <div class="perfil-controlos so-ecra">
        <label class="em-linha">Métricas de<select id="f-perfil-sel">${Object.entries(PERFIS).map(([k, v]) => `<option value="${k}" ${k === perfil ? 'selected' : ''}>${esc(v.nome)}</option>`).join('')}</select></label>
        <div class="alternar" role="radiogroup" aria-label="Comparar com">
          <label class="chip"><input type="radio" name="comparar" value="posicao" ${porPerfil ? 'checked' : ''} ${opcaoPosicao ? '' : 'disabled'}><span>${opcaoPosicao === 'setor' ? 'Mesmo setor' : 'Mesma posição'}</span></label>
          <label class="chip"><input type="radio" name="comparar" value="plantel" ${porPerfil ? '' : 'checked'}><span>Todo o plantel</span></label>
        </div>
      </div>
    </div>
    <p class="nota">Por 90 minutos; as percentagens são calculadas sobre os totais. Comparação com ${!porPerfil ? 'todo o plantel' : opcaoPosicao === 'perfil' ? `os jogadores com o perfil ${esc(P.nome.toLowerCase())}` : `os ${nomeSetor} (há poucos jogadores com o perfil ${esc(P.nome.toLowerCase())})`} com pelo menos ${minimo} minutos neste período (${grupo.length} ${grupo.length === 1 ? 'jogador' : 'jogadores'}). No ranking, 1.º é o melhor valor do grupo; nas métricas marcadas com "menos é melhor", o valor mais baixo.</p>
    ${blocos.length ? blocos.map(({ b, linhas }) => `
      <h3 class="perfil-bloco">${b}</h3>
      <div class="perfil">
        <div class="perfil-cab" aria-hidden="true"><span>Métrica</span><span class="num">${esc(nomeVisivel(p.nome).split(' ')[0])}</span><span>Do mínimo ao máximo do grupo</span><span class="num">Ranking</span></div>
        ${linhas.map(l => `<div class="perfil-linha">
          <span class="perfil-met">${esc(l.def.r)}${l.def.menos ? ' <small class="menos">menos é melhor</small>' : ''}${l.def.estilo ? ' <small class="menos">estilo, sem ranking</small>' : ''}</span>
          <span class="num perfil-val">${fmt(l.id, l.meu)}</span>
          ${l.so ? '<span class="faixa fraco">Sem dados de outros jogadores</span><span class="num perfil-pos">–</span>' : `
          <span class="faixa" role="img" aria-label="${esc(l.def.r)}: ${fmt(l.id, l.meu)}; média do grupo ${fmt(l.id, l.md)}; entre ${fmt(l.id, l.mn)} e ${fmt(l.id, l.mx)}">
            <span class="faixa-min">${fmtNum(l.mn, casas(l.id))}</span>
            <span class="faixa-pista"><i class="faixa-media" style="left:${l.pMd}%" title="Média do grupo: ${fmt(l.id, l.md)}"></i><i class="faixa-ponto" style="left:${l.pMeu}%"></i></span>
            <span class="faixa-max">${fmtNum(l.mx, casas(l.id))}</span>
          </span>
          <span class="num perfil-pos">${l.def.estilo ? '–' : `<b>${l.pos}.º</b> de ${l.n}`}</span>`}
        </div>`).join('')}
      </div>`).join('') : '<p class="fraco">As métricas deste perfil não existem nos dados importados. Escolha outro perfil acima.</p>'}
    ${temComparacao ? `<div class="legenda-campo"><span><i class="leg-ponto"></i>${esc(nomeVisivel(p.nome))}</span><span><i class="leg-media"></i>Média do grupo</span></div>` : ''}`;
  $$('input[name=comparar]', el).forEach(r => r.addEventListener('change', () => { J.comparar = r.value; desenharPerfil(p, jogadores, perfil); }));
  $('#f-perfil-sel', el).addEventListener('change', e => { J.perfil = e.target.value; J.metrica = null; desenharFicha(); });
}

function desenharEvolucao(regs, disponiveis, perfil) {
  const J = App.jog; const el = $('#f-evolucao'); const P = PERFIS[perfil];
  // Opções: as métricas do perfil (com dados), agrupadas por bloco; depois todas as métricas importadas.
  const comDados = id => regs.some(r => valorMetricaJogo(r.metricas || {}, id) !== null);
  const grupos = BLOCOS.map(b => [b, P[b].filter(comDados)]).filter(([, ids]) => ids.length);
  const valido = v => (v?.startsWith('m:') ? comDados(v.slice(2)) : disponiveis.includes(v?.slice(2)));
  const principal = grupos.find(([b]) => b === BLOCO_PRINCIPAL[perfil]) || grupos[0];
  const preferida = METRICA_PRINCIPAL[perfil] && comDados(METRICA_PRINCIPAL[perfil]) ? METRICA_PRINCIPAL[perfil] : null;
  if (!J.metrica || !valido(J.metrica)) J.metrica = preferida ? `m:${preferida}` : principal ? `m:${principal[1][0]}` : `r:${disponiveis[0]}`;
  const eDef = J.metrica.startsWith('m:'); const id = J.metrica.slice(2);
  const rotulo = eDef ? METRICAS[id].r : id;
  const vals = regs.map(r => { const v = eDef ? valorMetricaJogo(r.metricas || {}, id) : r.metricas?.[id]; return Number.isFinite(v) ? v : null; });
  const ult = media(vals.slice(-5)), tot = media(vals);
  const fv = v => (eDef && ePct(id) ? `${fmtNum(v, 0)}%` : fmtNum(v, 2));
  App.graficos = App.graficos.filter(g => { if (g.canvas.closest('#f-evolucao')) { g.destroy(); return false; } return true; });
  el.innerHTML = `
    <div class="bloco-cab"><h2>Evolução: ${esc(rotulo)}</h2>
      <label class="em-linha so-ecra">Métrica<select id="f-met">
        ${grupos.map(([b, ids]) => `<optgroup label="${b}">${ids.map(m => `<option value="m:${m}" ${J.metrica === `m:${m}` ? 'selected' : ''}>${esc(METRICAS[m].r)}</option>`).join('')}</optgroup>`).join('')}
        <optgroup label="Todas as métricas importadas">${disponiveis.map(m => `<option value="r:${esc(m)}" ${J.metrica === `r:${m}` ? 'selected' : ''}>${esc(m)}</option>`).join('')}</optgroup>
      </select></label>
    </div>
    <p class="destaque">Média por jogo nos últimos ${Math.min(5, vals.filter(Number.isFinite).length)} jogos: <b>${fv(ult)}</b>, contra <b>${fv(tot)}</b> no período.</p>
    <div class="grafico"><canvas aria-label="${esc(rotulo)} por jogo"></canvas></div>
    <h3>Minutos por jogo</h3>
    <div class="grafico baixo"><canvas aria-label="Minutos por jogo"></canvas></div>`;
  $('#f-met', el).addEventListener('change', e => { J.metrica = e.target.value; desenharEvolucao(regs, disponiveis, perfil); });
  const labels = regs.map(r => rotuloJogo(r.jogo, true));
  const [c1, c2] = $$('canvas', el);
  const opBarras = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, tooltip: OPCOES_LINHA.plugins.tooltip } };
  novoGrafico(c1, { type: 'bar', data: { labels, datasets: [{ label: rotulo, data: vals, backgroundColor: COR.nos, borderRadius: 4, maxBarThickness: 30 }] }, options: { ...opBarras, scales: eixos() } });
  novoGrafico(c2, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Minutos', data: regs.map(r => r.minutos), backgroundColor: '#9AA6B8', borderRadius: 3, maxBarThickness: 30 }] },
    options: { ...opBarras, scales: { ...eixos(), y: { ...eixos().y, max: Math.max(90, ...regs.map(r => Number(r.minutos) || 0)), ticks: { stepSize: 45 } } } }
  });
}

function desenharOportunidadesJogador(js) {
  const nome = App.jog.nome; const el = $('#f-oportunidades');
  const ids = new Set(js.map(j => j.id));
  const pj = jogadorDoPlantel(nome);
  const aceites = new Set([nome, pj?.nome, pj?.nome_wyscout].filter(Boolean).map(norm));
  const e1 = x => aceites.has(norm(x));
  // Eventos dos nossos jogos: registados no jogo (lado 'nos') ou na codificação da liga (partida ligada ao jogo, equipa nossa).
  const evs = App.d.eventos.filter(e => {
    if (e.jogo_id && ids.has(e.jogo_id)) return e.lado === 'nos' || (e.equipa && eNossaEquipa(e.equipa));
    const a = e.partida_id ? alvoDoEvento(e) : null;
    return !!(a?.jogo && ids.has(a.jogo.id) && eNossaEquipa(equipaDoEvento(e)));
  });
  const fin = evs.filter(e => e.tipo === 'oportunidade' && e1(e.jogador));
  const ass = evs.filter(e => e.tipo === 'oportunidade' && e1(e.assistente));
  const et = evs.filter(e => e.tipo === 'esquema_tatico' && e1(e.jogador));
  if (!fin.length && !ass.length && !et.length) {
    el.innerHTML = `<h2>Oportunidades codificadas</h2><p class="fraco">Sem oportunidades codificadas com ${esc(nomeVisivel(nome))} como finalizador ou assistente neste período.</p>`;
    return;
  }
  const golos = fin.filter(e => e.resultado === 'Golo').length;
  const grandes = fin.filter(e => e.qualidade === 'Grande oportunidade');
  const contarO = (lista, campo) => Object.entries(lista.reduce((a, e) => { const k = dadosOportunidade(e)[campo] || 'Sem indicação'; a[k] = (a[k] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]);
  el.innerHTML = `
    <h2>Oportunidades codificadas</h2>
    <p class="destaque">Finalizou <b>${fin.length}</b> ${fin.length === 1 ? 'oportunidade' : 'oportunidades'} e marcou <b>${golos}</b>${fin.length ? ` (${fmtNum(golos / fin.length * 100, 0)}%)` : ''}. Em grandes oportunidades: ${grandes.filter(e => e.resultado === 'Golo').length} de ${grandes.length}. Assistiu para ${ass.length} ${ass.length === 1 ? 'oportunidade' : 'oportunidades'}${et.length ? `; participou em ${et.length} ${et.length === 1 ? 'esquema tático' : 'esquemas táticos'}` : ''}.</p>
    <div class="dois-campos">
      <figure><figcaption><span class="ponto-cor nos"></span>Onde finalizou</figcaption>${campoSVG({ eventos: fin, metade: true })}${legendaCampo()}</figure>
      <div>
        <div class="tabela-env"><table class="tabela compacta"><thead><tr><th>Mecanismo</th><th class="num">Oport.</th></tr></thead>
          <tbody>${contarO(fin, 'mecanismo').map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('') || '<tr><td colspan="2" class="fraco">–</td></tr>'}</tbody></table></div>
        <div class="tabela-env"><table class="tabela compacta"><thead><tr><th>Momento</th><th class="num">Oport.</th></tr></thead>
          <tbody>${contarO(fin, 'momento').map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('') || '<tr><td colspan="2" class="fraco">–</td></tr>'}</tbody></table></div>

    <p class="nota">Conta os eventos em que o nome do jogador foi registado como no plantel ou como no Wyscout.</p>`;
}

const POSICOES = ['Guarda-redes', 'Defesa central', 'Lateral direito', 'Lateral esquerdo', 'Médio defensivo', 'Médio centro', 'Médio ofensivo', 'Extremo direito', 'Extremo esquerdo', 'Ponta de lança'];
const SECTORES = [['Guarda-redes', 'Guarda-redes'], ['Defesa', 'Defesas'], ['Médio', 'Médios'], ['Avançado', 'Avançados'], [null, 'Sem posição']];
App.plantelPesquisa = '';

function indexarPlantel() {
  const idx = {};
  for (const pj of App.d.plantel) { idx[norm(pj.nome)] = pj; if (pj.nome_wyscout) idx[norm(pj.nome_wyscout)] = pj; }
  App.idx.plantelPorEstat = idx;
}

// Converte abreviaturas (do Wyscout ou portuguesas) para os nomes de posição usados no plantel.
function posicaoLonga(abrev) {
  const p = String(abrev || '').toUpperCase().replace(/[^A-Z]/g, '');
  const mapa = { GR: 0, GK: 0, DC: 1, CB: 1, RCB: 1, LCB: 1, DD: 2, RB: 2, RWB: 2, LD: 2, DE: 3, LB: 3, LWB: 3, LE: 3, MDC: 4, DMF: 4, RDMF: 4, LDMF: 4, MC: 5, CMF: 5, RCMF: 5, LCMF: 5, MO: 6, AMF: 6, RAMF: 6, LAMF: 6, ED: 7, RW: 7, RWF: 7, RM: 7, EE: 8, LW: 8, LWF: 8, LM: 8, PL: 9, CF: 9, ST: 9, FW: 9, SS: 9, CM: 5, DM: 4, AM: 6 };
  if (p in mapa) return POSICOES[mapa[p]];
  const ingles = { goalkeeper: 0, 'centre back': 1, 'center back': 1, 'right back': 2, 'left back': 3, 'defensive midfield': 4, 'central midfield': 5, 'attacking midfield': 6, 'right winger': 7, 'left winger': 8, 'centre forward': 9, 'center forward': 9, 'second striker': 9, 'right midfield': 7, 'left midfield': 8,
    'medio defensivo': 4, 'medio centro': 5, 'medio ofensivo': 6, 'extremo direito': 7, 'extremo esquerdo': 8, 'ponta de lanca': 9, 'avancado centro': 9, 'segundo avancado': 9, 'guarda redes': 0, 'defesa central': 1, 'defesa direito': 2, 'defesa esquerdo': 3, 'lateral direito': 2, 'lateral esquerdo': 3 }[norm(abrev)];
  if (ingles !== undefined) return POSICOES[ingles];
  return POSICOES.find(x => norm(x) === norm(abrev)) || null;
}

    ${todos.length ? `<label class="pesquisa"><span class="sr">Procurar jogador</span><input type="search" id="p-pesquisa" placeholder="Procurar jogador" value="${esc(App.plantelPesquisa)}" autocomplete="off"></label>` : ''}
    ${ehDep() && semPlantel.length && !App.semPlantel ? `<div class="aviso-suave"><p><b>${semPlantel.length}</b> ${semPlantel.length === 1 ? 'jogador tem' : 'jogadores têm'} estatísticas mas não ${semPlantel.length === 1 ? 'está' : 'estão'} no plantel: ${esc(semPlantel.slice(0, 6).join(', '))}${semPlantel.length > 6 ? '…' : ''}</p><button class="btn" id="p-criar-estat">Adicionar ao plantel</button></div>` : ''}
    <div id="p-grupos">
      ${!todos.length && !App.semPlantel ? `<div class="vazio"><p>O plantel está vazio.</p>${ehDep() ? '<p>Adicione os jogadores um a um, importe uma lista em Excel, ou crie-os a partir das estatísticas já importadas.</p>' : ''}</div>` : ''}
      ${todos.length && !visiveis.length ? `<p class="fraco">Nenhum jogador corresponde a "${esc(App.plantelPesquisa)}".</p>` : ''}
      ${SECTORES.map(([sec, titulo]) => {
        const lista = visiveis.filter(pj => sectorPosicao(pj.posicao) === sec);
        return lista.length ? `<section class="grupo-plantel" aria-label="${titulo}"><h2>${titulo} <span>(${lista.length})</span></h2><div class="grelha-plantel">${lista.map(cartao).join('')}</div></section>` : '';

    const pj = App.d.plantel.find(x => x.id === b.dataset.pj); abrirFicha(chaveEstat(pj));
  }));
  $('#p-novo')?.addEventListener('click', () => dialogoJogador(null));

  });

// Reduz a fotografia a 240×240 px, recortada ao centro (cerca de 15 KB).
function reduzirFoto(ficheiro) {
  return new Promise((resolve, reject) => {
    // Aceita um ficheiro escolhido pelo utilizador ou uma imagem já em data URL (Transfermarkt).
    const img = new Image(); const eTexto = typeof ficheiro === 'string'; const url = eTexto ? ficheiro : URL.createObjectURL(ficheiro);
    const libertar = () => { if (!eTexto) URL.revokeObjectURL(url); };
    img.onload = () => {
      const t = 240, c = document.createElement('canvas'); c.width = c.height = t;
      const lado = Math.min(img.width, img.height);
      const sx = (img.width - lado) / 2, sy = Math.max(0, (img.height - lado) / 2 - lado * 0.08); // ligeiramente acima do centro: rostos
      c.getContext('2d').drawImage(img, sx, Math.min(sy, img.height - lado), lado, lado, 0, 0, t, t);
      libertar(); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { libertar(); reject(new Error('Não consegui ler a imagem.')); };
    img.src = url;
  });
}
