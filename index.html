    if (ev.target.closest('#a-limpar-tudo')) { F.sel = {}; const y = window.scrollY; desenharPaginaOportunidades(); window.scrollTo(0, y); return; }
    const el = ev.target.closest('[data-dim]'); if (el) alternar(el.dataset.dim, el.dataset.dim === 'zpasse' || el.dataset.dim === 'zfin' ? Number(el.dataset.val) : el.dataset.val);
  });
  raiz.addEventListener('keydown', ev => { const el = ev.target.closest('[data-dim]'); if (el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); el.click(); } });
  ativarDicas(raiz);
  desenharTabelaLiga();
}

// Dica que segue o rato (barras, colunas e zonas com data-tip).
function ativarDicas(raiz) {
  let tip = $('#dica-graf');
  if (!tip) { tip = document.createElement('div'); tip.id = 'dica-graf'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
  tip.classList.remove('on');
  const mostrar = (el, x, y) => { tip.textContent = el.dataset.tip; tip.classList.add('on'); const r = tip.getBoundingClientRect(); tip.style.left = Math.min(window.innerWidth - r.width - 8, x + 14) + 'px'; tip.style.top = Math.max(8, y - r.height - 10) + 'px'; };
  raiz.addEventListener('mousemove', e => { const el = e.target.closest('[data-tip]'); if (el) mostrar(el, e.clientX, e.clientY); else tip.classList.remove('on'); });
  raiz.addEventListener('mouseleave', () => tip.classList.remove('on'));
  raiz.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); mostrar(el, r.left, r.top); } });
  raiz.addEventListener('focusout', () => tip.classList.remove('on'));
}

function colunasTempo(ops) {
  const n = TEMPOS.map(t => ops.filter(x => x.o.tempo === t).length);
  const mostrar = TEMPOS.map((t, i) => [t, n[i]]).filter(([t, c]) => t !== 'Prolongamento' || c);
  const max = Math.max(1, ...n);
  return `<div class="ana-colunas">${mostrar.map(([t, c]) => `<div class="ana-col" title="${t}: ${c}"><span class="ana-col-val">${c}</span><span class="ana-col-barra"><i style="height:${c / max * 100}%"></i></span><span class="ana-col-rot">${t === 'Prolongamento' ? '90+' : t}</span></div>`).join('')}</div>`;
}

function desenharTabelaLiga() {
  const el = $('#a-liga'); const F = App.ana;
  const f = { ...F, adversario: 'todos', local: 'todos', momento: 'todos', golos: false };
  const linhas = equipasCodificaveis().map(eq => {
    const js = jogosDaEquipa(eq, f); if (!js.length) return null;
    const cri = oportunidadesDe(eq, { ...f, persp: 'criadas' }, js), sof = oportunidadesDe(eq, { ...f, persp: 'sofridas' }, js);
    const gc = cri.filter(x => x.o.golo).length, gs = sof.filter(x => x.o.golo).length;
    return { eq, j: js.length, c: cri.length / js.length, s: sof.length / js.length, gc, gs, conv: cri.length ? gc / cri.length * 100 : null, convS: sof.length ? gs / sof.length * 100 : null };
  }).filter(Boolean).sort((a, b) => b.c - a.c);
  if (linhas.length < 2) { el.remove(); return; }
  el.innerHTML = `
    <h2>Todas as equipas</h2>
    <p class="nota">Por jogo codificado${F.periodo !== 'todos' ? `, nos últimos ${F.periodo} jogos de cada equipa` : ''}. Clique numa equipa para a analisar.</p>
    <div class="tabela-env"><table class="tabela compacta classificacao">
      <thead><tr><th>Equipa</th><th class="num">Jogos</th><th class="num">Criadas / jogo</th><th class="num">Sofridas / jogo</th><th class="num">Golos</th><th class="num">Conversão</th><th class="num">Conversão sofrida</th></tr></thead>
      <tbody>${linhas.map(l => `<tr class="${l.eq === F.equipa ? 'nossa' : ''} clicavel" data-eq="${esc(l.eq)}" tabindex="0"><td>${esc(l.eq)}</td><td class="num">${l.j}</td><td class="num"><b>${fmtNum(l.c, 1)}</b></td><td class="num">${fmtNum(l.s, 1)}</td><td class="num">${l.gc}–${l.gs}</td><td class="num">${fmtNum(l.conv, 0)}%</td><td class="num">${fmtNum(l.convS, 0)}%</td></tr>`).join('')}</tbody>
    </table></div>`;
  $$('[data-eq]', el).forEach(r => { const ir = () => { F.equipa = r.dataset.eq; F.adversario = 'todos'; F.sel = {}; desenharPaginaOportunidades(); window.scrollTo(0, 0); }; r.addEventListener('click', ir); r.addEventListener('keydown', e => { if (e.key === 'Enter') ir(); }); });
}

// ---------- Relatório de oportunidades e golos (diapositivos 16:9) ----------
// Capa, visão geral, oportunidades criadas por momento, golos marcados, oportunidades sofridas por momento e golos sofridos.
// Nas sofridas, o lado é o da equipa a defender: o esquerdo de quem ataca é o direito de quem defende.

const MOMENTOS_REL = [['Organização', 'Organização', 'jogo exterior e jogo interior', 'o ataque organizado'], ['Transição', 'Transição', 'ataque rápido, contra-ataque e recuperação alta', 'a transição'], ['Esquema tático', 'Esquemas táticos', 'cantos, livres, lançamentos e penáltis', 'os esquemas táticos']];
const TROCA_LADO = { Esquerdo: 'Direito', Direito: 'Esquerdo', Centro: 'Centro' };
const ladoOp = (x, espelho) => espelho ? (TROCA_LADO[x.o.corredor] || x.o.corredor) : x.o.corredor;
// Pontos para os mapas de zonas; nas sofridas o campo é espelhado (lado de quem defende).
function pontosOp(ops, tipo, espelho = false) {
  const [kx, ky] = tipo === 'passe' ? ['passe_x', 'passe_y'] : ['zona_x', 'zona_y'];
  return ops.filter(x => x.e[kx] != null).map(x => ({ x: x.e[kx], y: espelho ? 100 - x.e[ky] : x.e[ky] }));
}

// Linha de baixo da capa: o próximo jogo contra a equipa (competição, casa/fora, data). Edita-se antes de exportar.
function infoCapaOp(eq, F) {
  const prox = App.d.jogos.filter(j => mesmaEquipa(j.adversario, eq) && !resultadoJogo(j) && (!j.data || j.data >= hojeIso())).sort(compararJogos)[0];
  if (prox) return [prox.jornada != null ? `${prox.competicao ? prox.competicao + ' · ' : ''}Jornada ${prox.jornada}` : (prox.competicao || 'Próximo jogo'), prox.local === 'fora' ? 'Fora' : 'Casa', prox.data ? fmtData(prox.data) : ''].filter(Boolean).join(' • ');
  const nj = jogosDaEquipa(eq, F).length;
  return `${nj} ${nj === 1 ? 'jogo codificado' : 'jogos codificados'} • ${fmtData(hojeIso())}`;
}

function relOportunidades(eq, F, opcoes = {}) {
  const jogos = jogosDaEquipa(eq, F); const nj = jogos.length;
  if (!nj) return null;
  const ops = (persp, momento = 'todos') => oportunidadesDe(eq, { ...F, persp, momento, golos: false }, jogos);
  const g = l => l.filter(x => x.o.golo).length;
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
  const pj = n => (n / nj).toFixed(1).replace('.', ',');
  const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const C = ops('criadas'), S = ops('sofridas');

  // Jogos por competição (para o rodapé e a visão geral).
  const porComp = new Map(); for (const a of jogos) { const k = a.competicao || 'Sem competição'; porComp.set(k, (porComp.get(k) || 0) + 1); }
  const comps = [...porComp.entries()].sort((a, b) => b[1] - a[1]);
  const txtJogos = `${pl(nj, 'jogo codificado', 'jogos codificados')}${comps.length > 1 ? `: ${comps.map(([c, n]) => `${n} ${c}`).join(', ')}` : comps[0][0] !== 'Sem competição' ? ` (${comps[0][0]})` : ''}`;
  const pe = `<p class="sl-fonte">Fonte: codificação do Departamento de Análise · ${esc(txtJogos)}</p>`;
  const slide = (corpo, cls = '') => `<section class="sl ${cls}">${corpo}${pe}</section>`;
  const topo = (t, sub, sec) => `<div class="sl-topo">${simboloEquipa(eq, 'sl-topo-simb')}<span class="sl-olho"><b>${esc(eq)}</b>${sec}</span></div>
    <div class="sl-cab"><div class="sl-regua"></div><h1>${t}</h1>${sub ? `<p class="sl-sub">${sub}</p>` : ''}</div>`;

  // Barras com a parte que acabou em golo a escuro (comGolos) ou simples (páginas de golos).
  const barrasG = (titulo, l, fn, { max = 6, total = true, comGolos = true, fixo = null } = {}) => {
    const c = new Map(); for (const x of l) { const k = fn(x); if (!k) continue; const v = c.get(k) || [0, 0]; v[0]++; if (x.o.golo) v[1]++; c.set(k, v); }
    let e = fixo ? fixo.map(k => [k, c.get(k) || [0, 0]]).filter(([, v]) => v[0]) : [...c.entries()].sort((a, b) => b[1][0] - a[1][0] || b[1][1] - a[1][1]);
    const resto = e.slice(max).reduce((s, [, v]) => s + v[0], 0); e = e.slice(0, max);
    const alto = Math.max(1, ...e.map(([, v]) => v[0])); const n = l.length;
    return `<div class="gb"><h3>${titulo}</h3>${e.length ? `<ul>${e.map(([k, [t, gg]]) => `<li><span class="gb-rot">${esc(k)}</span><span class="gb-pista"><i style="width:${t / alto * 100}%">${comGolos && gg ? `<s style="width:${gg / t * 100}%"></s>` : ''}</i></span><span class="gb-val"><b>${t}</b>${total ? `<small> · ${pct(t, n)}</small>` : ''}${comGolos && gg ? `<em>${pl(gg, 'golo', 'golos')}</em>` : ''}</span></li>`).join('')}</ul>${resto ? `<p class="gb-resto">E mais ${resto} noutras categorias.</p>` : ''}` : '<p class="gb-resto">Sem dados.</p>'}</div>`;
  };
  const tempo = (l, comGolos = true) => {
    const t = TEMPOS.filter(x => x !== 'Prolongamento' || l.some(y => y.o.tempo === x)).map(x => [x, l.filter(y => y.o.tempo === x)]);
    const max = Math.max(1, ...t.map(([, a]) => a.length));
    return `<div class="gb"><h3>Tempo</h3><div class="tp">${t.map(([k, a]) => `<div class="tp-col"><span class="tp-val">${a.length}${comGolos && g(a) ? `<em>${g(a)}</em>` : ''}</span><span class="tp-barra"><i style="height:${a.length / max * 100}%">${comGolos && g(a) ? `<s style="height:${g(a) / a.length * 100}%"></s>` : ''}</i></span><span class="tp-rot">${k === 'Prolongamento' ? '90+' : k}</span></div>`).join('')}</div></div>`;
  };
  const mapas = (l, esp) => `<div class="mp">
    <figure><figcaption>Zona do passe</figcaption>${mapaZonas('passe', pontosOp(l, 'passe', esp))}</figure>
    <figure><figcaption>Zona de finalização</figcaption>${mapaZonas('fin', pontosOp(l, 'fin', esp))}</figure>
    <p class="mp-nota">${esp ? 'Lados da equipa a defender: à esquerda do desenho fica o lado esquerdo da equipa.' : 'Lados da equipa a atacar, para cima.'}</p></div>`;
  const legenda = cls => `<div class="leg"><span><i class="leg-t ${cls}"></i>Oportunidades</span><span><i class="leg-g ${cls}"></i>Acabaram em golo</span></div>`;
  const tituloLado = esp => esp ? 'Lado (a defender)' : 'Lado';

  // ---- Capa ----
  const capa = `<section class="sl sl-capa"><div class="capa-centro">
      <div class="capa-sobre">Oportunidades e golos</div>
      <h1 class="capa-titulo">${esc(eq.toUpperCase())}</h1>
      ${simboloEquipa(eq, 'capa-simb')}
      <div class="capa-info">${String(opcoes.capa ?? infoCapaOp(eq, F)).split('•').map(t => t.trim()).filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('<i></i>')}</div>
    </div></section>`;

  // ---- Visão geral ----
  const barraMom = l => { const t = l.length; return `<div class="vg-pilha">${MOMENTOS_REL.map(([m], i) => { const n = l.filter(x => x.o.momento === m).length; return n ? `<span class="m${i}" style="flex:${n}"><b>${n}</b>${pct(n, t)}</span>` : ''; }).join('')}</div>`; };
  const golMom = l => MOMENTOS_REL.map(([m, nome], i) => { const s = l.filter(x => x.o.momento === m); return `<span><i class="m${i}"></i>${nome}: ${s.length} oport. · ${pl(g(s), 'golo', 'golos')}</span>`; }).join('');
  const linhaNum = (rot, a, b) => `<tr><th>${rot}</th><td>${a}</td><td>${b}</td></tr>`;
  const concl = opcoes.conclusoes || conclusoesOportunidades(eq, C, S, nj, F);
  const vg = slide(`${topo('Visão geral', `O que ${esc(eq)} cria e o que sofre, em ${pl(nj, 'jogo codificado', 'jogos codificados')}.`, 'Observação')}
    <div class="vg"><div class="vg-esq">
        <table class="vg-tab"><thead><tr><th></th><th>A criar</th><th>A sofrer</th></tr></thead><tbody>
          ${linhaNum('Oportunidades', C.length, S.length)}${linhaNum('Por jogo', pj(C.length), pj(S.length))}
          ${linhaNum('Golos', g(C), g(S))}${linhaNum('Golos por jogo', pj(g(C)), pj(g(S)))}${linhaNum('Conversão', pct(g(C), C.length), pct(g(S), S.length))}
        </tbody></table>
        <div class="vg-mom"><h3>Por momento: a criar</h3>${barraMom(C)}<div class="vg-leg">${golMom(C)}</div></div>
        <div class="vg-mom"><h3>Por momento: a sofrer</h3>${barraMom(S)}<div class="vg-leg">${golMom(S)}</div></div>
      </div>
      <div class="vg-dir"><h2>Conclusões</h2><ol>${concl.map(([t, d, lado]) => `<li class="${lado === 'defesa' ? 'defesa' : 'ataque'}"><b><i class="vg-tag">${lado === 'defesa' ? 'Defesa' : 'Ataque'}</i>${esc(t)}</b><span>${esc(d)}</span></li>`).join('')}</ol></div></div>`, 'sl-vg');

  // ---- Oportunidades de um momento ----
  const pagMomento = (persp, [m, nome, desc]) => {
    const l = ops(persp, m), n = l.length, esp = persp === 'sofridas';
    const sub = `${pl(n, 'oportunidade', 'oportunidades')} (${pj(n)} por jogo) e ${pl(g(l), 'golo', 'golos')}${n ? ` (${pct(g(l), n)} de conversão)` : ''}: ${desc}.`;
    return slide(`${topo(nome, sub, esp ? 'Oportunidades sofridas' : 'Oportunidades criadas')}
      <div class="pg ${persp}">
        <div class="pg-c1">${barrasG('Sub-momento', l, x => x.o.sub, { max: 4 })}${barrasG('Mecanismo', l, x => x.o.mecanismo, { max: 6 })}${n && n < 10 ? `<p class="pg-aviso">Amostra pequena: ${pl(n, 'oportunidade', 'oportunidades')} em ${pl(nj, 'jogo', 'jogos')}. Ler como casos, não como padrão.</p>` : ''}</div>
        <div class="pg-c2">${barrasG(tituloLado(esp), l, x => ladoOp(x, esp), { fixo: CORREDORES })}${tempo(l)}</div>
        <div class="pg-c3">${mapas(l, esp)}</div>
        <div class="pg-jog">${barrasG('Quem finaliza', l, x => x.e.jogador, { max: 4, total: false })}${barrasG('Quem faz o último passe', l, x => x.e.assistente, { max: 4, total: false })}</div>
        ${legenda(persp)}
      </div>`);
  };
  // ---- Golos (marcados ou sofridos), com a mesma estrutura ----
  const pagGolos = persp => {
    const l = ops(persp).filter(x => x.o.golo), n = l.length, esp = persp === 'sofridas';
    const tit = esp ? 'Golos sofridos' : 'Golos marcados';
    const o = { comGolos: false };
    return slide(`${topo(tit, `${pl(n, 'golo', 'golos')} (${pj(n)} por jogo): por momento, como e onde nasceram, e quem ${esp ? 'marcou' : 'marca'}.`, tit)}
      <div class="pg golos ${persp}">
        <div class="pg-c1">${barrasG('Sub-momento', l, x => x.o.sub, { ...o, max: 5 })}${barrasG('Mecanismo', l, x => x.o.mecanismo, { ...o, max: 5 })}</div>
        <div class="pg-c2">${barrasG('Momento', l, x => x.o.momento, { ...o, fixo: MOMENTOS_REL.map(([k]) => k) })}${barrasG(tituloLado(esp), l, x => ladoOp(x, esp), { ...o, fixo: CORREDORES })}${tempo(l, false)}</div>
        <div class="pg-c3">${mapas(l, esp)}</div>
        <div class="pg-jog">${barrasG(esp ? 'Quem marcou' : 'Quem marca', l, x => x.e.jogador, { ...o, max: 4, total: false })}${barrasG('Quem fez o último passe', l, x => x.e.assistente, { ...o, max: 4, total: false })}</div>
      </div>`);
  };
  return [capa, vg,
    ...MOMENTOS_REL.map(m => pagMomento('criadas', m)), pagGolos('criadas'),
    ...MOMENTOS_REL.map(m => pagMomento('sofridas', m)), pagGolos('sofridas')].join('');
}

// ---------- Conclusões: o que mais sobressai ----------
// Compara a equipa com as outras equipas codificadas (mesmo período) e fica com os desvios mais fortes, sempre com o número que os sustenta.
// Cada candidato tem um peso (desvio padronizado); escolhem-se os maiores, no máximo um por tema, com ataque e defesa equilibrados.
// Os jogos contra a própria equipa ficam de fora (senão as oportunidades dela entravam na comparação ao contrário),
// e só contam equipas com pelo menos 3 jogos codificados.
function baseLigaOportunidades(F, excluir = null) {
  const f = { ...F, adversario: 'todos', local: 'todos', momento: 'todos', golos: false };
  return equipasCodificaveis().map(eq => {
    let js = jogosDaEquipa(eq, f);
    if (excluir) js = js.filter(a => !mesmaEquipa(a.casa, excluir) && !mesmaEquipa(a.fora, excluir) && norm(a.casa) !== norm(excluir) && norm(a.fora) !== norm(excluir));
    if (js.length < 3) return null;
    return { eq, nj: js.length, C: oportunidadesDe(eq, { ...f, persp: 'criadas' }, js), S: oportunidadesDe(eq, { ...f, persp: 'sofridas' }, js) };
  }).filter(Boolean);
}
function conclusoesOportunidades(eq, C, S, nj, F = App.ana) {
  const g = l => l.filter(x => x.o.golo).length;
  const p100 = x => Math.round(x * 100) + '%';
  const pj = n => (n / nj).toFixed(1).replace('.', ',');
  const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const ord = n => `${n}.ª`;
  const liga = baseLigaOportunidades(F, eq);
  const outros = liga.filter(t => !mesmaEquipa(t.eq, eq) && norm(t.eq) !== norm(eq));
  const cand = [];
  const add = (score, tema, lado, t, d, grupo = null) => { if (Number.isFinite(score)) cand.push({ score, tema, lado, t, d, grupo }); };
  const paiSub = k => Object.keys(MOMENTOS).find(m => MOMENTOS[m].sub.includes(k)) || null;

  if (outros.length >= 3) {
    const T = outros.length + 1;
    // Volume e conversão (ranking entre as equipas codificadas)
    const rank = (val, vals, desc = true) => 1 + vals.filter(v => desc ? v > val : v < val).length;
    const zEquipas = (val, vals) => { const m = vals.reduce((a, b) => a + b, 0) / vals.length; const sd = Math.sqrt(vals.reduce((a, b) => a + (b - m) ** 2, 0) / Math.max(1, vals.length - 1)) || 1; return [(val - m) / sd, m]; };
    const cpg = C.length / nj, spg = S.length / nj;
    const vc = outros.map(t => t.C.length / t.nj), vs = outros.map(t => t.S.length / t.nj);
    const [zc, mc] = zEquipas(cpg, vc), [zs, ms] = zEquipas(spg, vs);
    const rc = rank(cpg, vc), rs = rank(spg, vs, false);
    add(Math.abs(zc), 'volume', 'ataque', zc > 0 ? `Das equipas que mais oportunidades criam` : `Cria pouco`, `${pj(C.length)} por jogo (${ord(zc > 0 ? rc : T + 1 - rank(cpg, vc, false))} de ${T}); a média das outras equipas é ${mc.toFixed(1).replace('.', ',')}.`);
    add(Math.abs(zs), 'volume', 'defesa', zs < 0 ? `Das equipas que menos oportunidades concedem` : `Concede muitas oportunidades`, `${pj(S.length)} por jogo (${ord(zs < 0 ? rs : T + 1 - rank(spg, vs))} ${zs < 0 ? 'que menos concede' : 'que mais concede'} de ${T}); a média das outras equipas é ${ms.toFixed(1).replace('.', ',')}.`);
    // Proporções contra a liga (teste binomial simples)
    const pooled = k => outros.flatMap(t => t[k]);
    const LC = pooled('C'), LS = pooled('S');
    const zProp = (k, n, K, N) => { if (!n || !N) return [0, 0, 0]; const p = k / n, q = K / N; if (q <= 0 || q >= 1) return [0, p, q]; return [(p - q) / Math.sqrt(q * (1 - q) / n), p, q]; };
    const conv = (l, L, lado) => {
      const [z, p, q] = zProp(g(l), l.length, g(L), L.length);
      if (l.length < 10) return;
      const t = lado === 'ataque' ? (z > 0 ? 'Muito eficaz a finalizar' : 'Pouco eficaz a finalizar') : (z > 0 ? 'Os adversários marcam muito do que criam' : 'Os adversários convertem pouco');
      add(Math.abs(z) * 0.9, 'conversao', lado, t, `${p100(p)} das oportunidades ${lado === 'ataque' ? 'criadas' : 'sofridas'} acabam em golo (${pl(g(l), 'golo', 'golos')} em ${l.length}); nas outras equipas, ${p100(q)}.`);
    };
    conv(C, LC, 'ataque'); conv(S, LS, 'defesa');
    const DIMS = [
      ['momento', x => x.o.momento, k => ({ 'Organização': 'organização', 'Transição': 'transição', 'Esquema tático': 'esquemas táticos' })[k] || k.toLowerCase(), 'em '],
      ['sub', x => x.o.sub, k => k.toLowerCase(), 'em '],
      ['mecanismo', x => x.o.mecanismo, k => k.toLowerCase(), 'com '],
      ['lado', null, k => k === 'Centro' ? 'pelo corredor central' : `pelo ${k === 'Esquerdo' ? 'lado esquerdo' : 'lado direito'}`, ''],
      ['tempo', x => x.o.tempo, k => k === 'Prolongamento' ? 'nos descontos e prolongamento' : `entre os ${k.replace('-', ' e os ')} minutos`, '']];
    for (const [lado, l, L, esp] of [['ataque', C, LC, false], ['defesa', S, LS, true]]) {
      if (l.length < 10) continue;
      for (const [dim, fn0, rot, prep] of DIMS) {
        const fn = fn0 || (x => ladoOp(x, esp));
        const cats = new Set(l.map(fn).concat(L.map(fn)).filter(Boolean));
        for (const k of cats) {
          const kk = l.filter(x => fn(x) === k), KK = L.filter(x => fn(x) === k);
          const [z, p, q] = zProp(kk.length, l.length, KK.length, L.length);
          if (Math.abs(p - q) < 0.06) continue;
          if (z > 0 && kk.length < 4) continue;
          if (z < 0 && l.length * q < 6) continue;
          const verbo = lado === 'ataque' ? (z > 0 ? 'Cria muito' : 'Cria pouco') : (z > 0 ? 'Sofre muito' : 'Sofre pouco');
          const gs = g(kk);
          add(Math.abs(z) * (dim === 'momento' ? 1.1 : dim === 'tempo' ? 0.8 : 1), dim, lado, `${verbo} ${prep}${rot(k)}`,
            `${kk.length} das ${l.length} oportunidades ${lado === 'ataque' ? 'criadas' : 'sofridas'} (${p100(p)}); nas outras equipas, ${p100(q)}.${gs ? ` ${pl(gs, 'acabou em golo', 'acabaram em golo')}.` : ''}`,
            dim === 'momento' ? `${k}|${z > 0}` : dim === 'sub' && paiSub(k) ? `${paiSub(k)}|${z > 0}` : null);
        }
      }
      // Golos por momento (só com golos suficientes)
      const G = g(l), GL = g(L);
      if (G >= 4) for (const [m, nome, , art] of MOMENTOS_REL) {
        const k = l.filter(x => x.o.golo && x.o.momento === m).length, K = L.filter(x => x.o.golo && x.o.momento === m).length;
        const [z, p, q] = zProp(k, G, K, GL);
        if (z <= 0 || k < 3 || p - q < 0.12) continue;
        add(z * 1.15, 'golos-momento', lado, `${p >= .5 ? 'Metade ou mais' : 'Grande parte'} dos golos ${lado === 'ataque' ? 'marcados' : 'sofridos'} vem ${art.startsWith('os ') ? 'dos' : art.startsWith('a ') ? 'da' : 'do'} ${art.replace(/^(os|a|o) /, '')}`,
          `${k} de ${G} golos (${p100(p)}); nas outras equipas, ${p100(q)}.`);
      }
    }
    // Sub-momento mais eficaz (ataque), contra a mesma situação nas outras equipas
    for (const k of new Set(C.map(x => x.o.sub).filter(Boolean))) {
      const kk = C.filter(x => x.o.sub === k), KK = LC.filter(x => x.o.sub === k);
      if (kk.length < 5 || g(kk) < 2 || KK.length < 10) continue;
      const [z, p, q] = zProp(g(kk), kk.length, g(KK), KK.length);
      if (z > 0 && p - q >= 0.1) add(z, 'eficacia', 'ataque', `${k}: o caminho mais eficaz`, `${pl(g(kk), 'golo', 'golos')} em ${kk.length} oportunidades (${p100(p)}); nas outras equipas, ${p100(q)} nesta situação.`);
    }
    // Dependência de um finalizador (ataque)
    const topo = l => { const c = contarPor(l.filter(x => x.o.golo), x => x.e.jogador).sort((a, b) => b[1] - a[1])[0]; return c ? [c[0], c[1] / g(l)] : null; };
    const tp = topo(C); const tps = outros.map(t => topo(t.C)?.[1]).filter(Number.isFinite);
    if (tp && g(C) >= 5 && tps.length >= 3) { const [z] = zEquipas(tp[1], tps); if (z > 0) add(z * 0.9, 'finalizador', 'ataque', `Muito dependente de ${tp[0]}`, `Marca ${Math.round(tp[1] * g(C))} dos ${g(C)} golos (${p100(tp[1])}); nas outras equipas, o melhor marcador tem em média ${p100(tps.reduce((a, b) => a + b, 0) / tps.length)}.`); }
  }

  // Escolha: os maiores desvios, um por tema e por lado, com ataque e defesa equilibrados.
  const fortes = cand.filter(c => c.score >= 1.5).sort((a, b) => b.score - a.score);
  const out = [], vistos = new Set();
  const pega = filtro => { for (const c of fortes) { if (out.length >= 6) return; const k = `${c.lado}|${c.tema}`; const kg = c.grupo && `${c.lado}|g|${c.grupo}`; if (vistos.has(k) || (kg && vistos.has(kg)) || !filtro(c)) continue; if (out.filter(x => x.lado === c.lado).length >= 4) continue; vistos.add(k); if (kg) vistos.add(kg); out.push(c); } };
  pega(c => c.lado === 'ataque' && out.filter(x => x.lado === 'ataque').length < 2);
  pega(c => c.lado === 'defesa' && out.filter(x => x.lado === 'defesa').length < 2);
  pega(() => true);
  // Sem outras equipas para comparar (ou sem desvios fortes): resumo factual.
  if (out.length < 3) {
    const base = [];
    base.push({ lado: 'ataque', t: `Cria ${pj(C.length)} e sofre ${pj(S.length)} oportunidades por jogo`, d: `${pj(g(C))} golos marcados e ${pj(g(S))} sofridos por jogo.` });
    const top = MOMENTOS_REL.map(m => ({ m, l: C.filter(x => x.o.momento === m[0]) })).sort((a, b) => b.l.length - a.l.length)[0];
    if (top?.l.length) base.push({ lado: 'ataque', t: `${top.m[3][0].toUpperCase() + top.m[3].slice(1)} é a base do ataque`, d: `${p100(top.l.length / Math.max(1, C.length))} das oportunidades e ${g(top.l)} dos ${g(C)} golos.` });
    const ms = MOMENTOS_REL.map(m => ({ m, l: S.filter(x => x.o.momento === m[0]) })).sort((a, b) => g(b.l) - g(a.l) || b.l.length - a.l.length)[0];
    if (ms?.l.length) base.push({ lado: 'defesa', t: `A sofrer, o maior perigo vem ${ms.m[3].startsWith('os ') ? 'dos' : ms.m[3].startsWith('a ') ? 'da' : 'do'} ${ms.m[3].replace(/^(os|a|o) /, '')}`, d: `${g(ms.l)} dos ${g(S)} golos sofridos e ${ms.l.length} das ${S.length} oportunidades sofridas.` });
    const efic = contarPor(C, x => x.o.sub).filter(([, n]) => n >= 5).map(([k, n]) => [k, n, g(C.filter(x => x.o.sub === k))]).filter(([, , gg]) => gg >= 2).sort((a, b) => b[2] / b[1] - a[2] / a[1])[0];
    if (efic) base.push({ lado: 'ataque', t: `${efic[0]}: o caminho mais eficaz`, d: `${pl(efic[2], 'golo', 'golos')} em ${efic[1]} oportunidades (${p100(efic[2] / efic[1])} de conversão).` });
    const fins = contarPor(C, x => x.e.jogador).sort((a, b) => b[1] - a[1]);
    if (fins.length >= 2 && C.length) base.push({ lado: 'ataque', t: `${fins[0][0]} e ${fins[1][0]} concentram as finalizações`, d: `${fins[0][1] + fins[1][1]} das ${C.length} oportunidades (${p100((fins[0][1] + fins[1][1]) / C.length)}).` });
    const tm = TEMPOS.map(t => [t, g(C.filter(x => x.o.tempo === t)), g(S.filter(x => x.o.tempo === t))]).sort((a, b) => b[1] - a[1])[0];
    if (tm && tm[1] >= 2) base.push({ lado: 'ataque', t: `Perigo entre os ${tm[0] === 'Prolongamento' ? '90 minutos e o fim' : tm[0].replace('-', ' e os ') + ' minutos'}`, d: `Marca ${tm[1]} dos ${g(C)} golos nesse período${tm[2] ? ` e sofre ${tm[2]} dos ${g(S)}` : ''}.` });
    for (const b of base) if (out.length < 6 && !out.some(o => o.t === b.t)) out.push(b);
  }
  out.sort((a, b) => (a.lado === 'ataque' ? 0 : 1) - (b.lado === 'ataque' ? 0 : 1));
  return out.map(c => [c.t, c.d, c.lado]);
}

// ---------- Conclusões do recorte (página Oportunidades) ----------
// As conclusões acompanham os filtros por clique: a equipa é comparada com as outras equipas no MESMO recorte
// (ex.: organização da equipa contra a organização das outras). Não se repete o que já está filtrado.
const DIMS_COMPARAVEIS = ['momento', 'sub', 'mecanismo', 'lado', 'parte', 'tempo', 'zpasse', 'zfin'];
function conclusoesRecorte(eq, F, sel, valor) {
  const esp = F.persp === 'sofridas', soGolos = !!F.golos;
  const f = { ...F, momento: 'todos' };
  const jogos = jogosDaEquipa(eq, f); const nj = jogos.length;
  const base = oportunidadesDe(eq, { ...f, golos: soGolos }, jogos);
  const filtra = (l, s, menos) => l.filter(x => Object.entries(s).every(([d, v]) => d === menos || String(valor(x, d, esp)) === String(v)));
  const selL = Object.fromEntries(Object.entries(sel).filter(([d]) => DIMS_COMPARAVEIS.includes(d)));
  const g = l => l.filter(x => x.o.golo).length;
  const p100 = x => Math.round(x * 100) + '%';
  const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const coisa = soGolos ? ['golo', 'golos'] : ['oportunidade', 'oportunidades'];
  const T = filtra(base, sel); const n = T.length;
  const fBase = { ...f, adversario: 'todos', local: 'todos' };
  const outros = equipasCodificaveis().filter(e => norm(e) !== norm(eq) && !mesmaEquipa(e, eq)).map(e => {
    const js = jogosDaEquipa(e, fBase).filter(a => !mesmaEquipa(a.casa, eq) && !mesmaEquipa(a.fora, eq) && norm(a.casa) !== norm(eq) && norm(a.fora) !== norm(eq));
    return js.length >= 3 ? { e, nj: js.length, ops: oportunidadesDe(e, { ...fBase, golos: soGolos }, js) } : null;
  }).filter(Boolean);
  const res = { contexto: [], itens: [], aviso: '' };
  if (outros.length < 3) { res.aviso = 'Ainda não há outras equipas codificadas suficientes (pelo menos 3, com 3 jogos cada) para comparar.'; return res; }
  const L = outros.flatMap(t => t.ops); const LR = filtra(L, selL);
  const zProp = (k, nn, K, N) => { if (!nn || !N) return [0, 0, 0]; const p = k / nn, q = K / N; if (q <= 0 || q >= 1) return [0, p, q]; return [(p - q) / Math.sqrt(q * (1 - q) / nn), p, q]; };
  const ROT = {
    momento: k => ({ 'Organização': 'organização', 'Transição': 'transição', 'Esquema tático': 'esquemas táticos' })[k] || String(k).toLowerCase(),
    sub: k => String(k).toLowerCase(), mecanismo: k => String(k).toLowerCase(),
    lado: k => k === 'Centro' ? 'corredor central' : k === 'Esquerdo' ? 'lado esquerdo' : 'lado direito',
    parte: k => String(k), tempo: k => k === 'Prolongamento' ? 'descontos e prolongamento' : `${k} min`,
    zpasse: k => `passe da zona ${k}`, zfin: k => `finalização na zona ${k}`
  };
  const PREP = { momento: 'em ', sub: 'em ', mecanismo: 'com ', lado: 'pelo ', parte: 'na ', tempo: 'aos ', zpasse: 'com ', zfin: 'com ' };
  // Contexto: o peso de cada filtro ativo, comparado com as outras equipas.
  for (const d of Object.keys(selL)) {
    const sem = filtra(base, sel, d).length, semL = filtra(L, selL, d).length;
    const [, p, q] = zProp(n, sem, LR.length, semL);
    const v = sel[d]; const nome = d === 'zpasse' ? `Passe da zona ${v}` : d === 'zfin' ? `Finalização na zona ${v}` : d === 'lado' ? (v === 'Centro' ? 'Corredor central' : `Lado ${String(v).toLowerCase()}`) : d === 'tempo' ? `${v} min` : String(v);
    if (sem) res.contexto.push(`${nome}: ${n} de ${sem} ${coisa[1]} (${p100(p)}); nas outras equipas, ${semL ? p100(q) : '–'}.`);
  }
  if (n < 10) { res.aviso = `Amostra pequena (${pl(n, ...coisa)}): sem conclusões fortes neste recorte.`; return res; }
  const cand = [];
  const verbo = mais => esp ? (soGolos ? (mais ? 'Sofre muitos golos' : 'Sofre poucos golos') : (mais ? 'Sofre muito' : 'Sofre pouco')) : (soGolos ? (mais ? 'Marca muitos golos' : 'Marca poucos golos') : (mais ? 'Cria muito' : 'Cria pouco'));
  const paiSub = k => Object.keys(MOMENTOS).find(m => MOMENTOS[m].sub.includes(k)) || null;
  for (const d of DIMS_COMPARAVEIS) {
    if (sel[d] != null) continue;
    const cats = new Set(T.map(x => valor(x, d, esp)).concat(LR.map(x => valor(x, d, esp))).filter(v => v != null && v !== ''));
    for (const k of cats) {
      const kk = T.filter(x => String(valor(x, d, esp)) === String(k)), KK = LR.filter(x => String(valor(x, d, esp)) === String(k));
      const [z, p, q] = zProp(kk.length, n, KK.length, LR.length);
      if (Math.abs(p - q) < 0.07) continue;
      if (z > 0 && kk.length < 4) continue;
      if (z < 0 && n * q < 6) continue;
      const gs = soGolos ? 0 : g(kk);
      cand.push({ score: Math.abs(z) * (d === 'tempo' || d === 'parte' ? 0.8 : 1), tema: d, grupo: d === 'momento' ? `${k}|${z > 0}` : d === 'sub' && paiSub(k) ? `${paiSub(k)}|${z > 0}` : null,
        t: `${verbo(z > 0)} ${PREP[d]}${ROT[d](k)}`, d: `${kk.length} das ${n} ${coisa[1]} ${Object.keys(sel).length ? 'deste recorte' : esp ? (soGolos ? 'sofridos' : 'sofridas') : (soGolos ? 'marcados' : 'criadas')} (${p100(p)}); nas outras equipas, ${p100(q)}.${gs ? ` ${pl(gs, 'acabou em golo', 'acabaram em golo')}.` : ''}` });
    }
  }
  if (!soGolos) {
    const [z, p, q] = zProp(g(T), n, g(LR), LR.length);
    cand.push({ score: Math.abs(z) * 0.9, tema: 'conversao', t: esp ? (z > 0 ? 'Os adversários convertem muito' : 'Os adversários convertem pouco') : (z > 0 ? 'Muito eficaz a finalizar' : 'Pouco eficaz a finalizar'), d: `${p100(p)} acabam em golo (${pl(g(T), 'golo', 'golos')} em ${n}); nas outras equipas, ${p100(q)}.` });
  }
  if (!sel.jogo) {
    const taxa = n / Math.max(1, nj), vs = outros.map(t => filtra(t.ops, selL).length / t.nj);
    const m = vs.reduce((a, b) => a + b, 0) / vs.length, sd = Math.sqrt(vs.reduce((a, b) => a + (b - m) ** 2, 0) / Math.max(1, vs.length - 1)) || 1;
    const z = (taxa - m) / sd, pos = 1 + vs.filter(v => v > taxa).length;
    const txt = esp ? (soGolos ? 'golos sofridos' : 'oportunidades sofridas') : (soGolos ? 'golos marcados' : 'oportunidades criadas');
    cand.push({ score: Math.abs(z), tema: 'volume', t: `${z > 0 ? 'Muitas' : 'Poucas'} ${txt} ${Object.keys(selL).length ? 'neste recorte' : 'por jogo'}`, d: `${taxa.toFixed(1).replace('.', ',')} por jogo (${pos}.ª de ${vs.length + 1} equipas, da que tem mais para a que tem menos); a média das outras é ${m.toFixed(1).replace('.', ',')}.` });
  }
  const vistos = new Set();
  for (const c of cand.filter(c => c.score >= 1.5).sort((a, b) => b.score - a.score)) {
    if (res.itens.length >= 4) break;
    const kg = c.grupo && 'g|' + c.grupo;
    if (vistos.has(c.tema) || (kg && vistos.has(kg))) continue;
    vistos.add(c.tema); if (kg) vistos.add(kg); res.itens.push([c.t, c.d]);
  }
  if (!res.itens.length) res.aviso = 'Neste recorte não há desvios fortes em relação às outras equipas.';
  return res;
}

// ---------- Exportar o relatório em PDF 16:9 ----------
// O Safari ignora o tamanho de página pedido pelo CSS (sai em A4). Por isso cada diapositivo é desenhado numa imagem
// e o PDF é montado aqui, com páginas 16:9 em qualquer browser.
const LIBS_PDF = {
  screenshot: ['modernScreenshot', 'https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.0/dist/index.js'],
  jspdf: ['jspdf', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js']
};
function carregarScript([global, url]) {
  if (window[global]) return Promise.resolve(window[global]);
  return new Promise((ok, falha) => { const s = document.createElement('script'); s.src = url; s.onload = () => ok(window[global]); s.onerror = () => falha(new Error('Não consegui carregar ' + url)); document.head.appendChild(s); });
}
// Letras do Google Fonts embutidas no PDF (sem isto o Safari desenha os diapositivos com letras de substituição,
// e os textos mais largos partem linha e ficam tapados).
let cssLetrasPdf = null;
async function letrasParaPdf() {
  if (cssLetrasPdf !== null) return cssLetrasPdf;
  try {
    const link = [...document.querySelectorAll('link[rel=stylesheet]')].find(l => /fonts\.googleapis/.test(l.href));
    if (!link) return (cssLetrasPdf = '');
    let css = await (await fetch(link.href)).text();
    // Só os blocos latinos (os outros alfabetos não são usados).
    const blocos = css.split('}').filter(b => /@font-face/.test(b)).map(b => b + '}').filter(b => !/unicode-range/.test(b) || /U\+0000-00FF/i.test(b));
    const dataUrl = async u => { const r = await fetch(u); const bl = await r.blob(); return await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(bl); }); };
    const out = [];
    for (const b of blocos) { const m = b.match(/url\(([^)]+)\)/); if (!m) continue; out.push(b.replace(m[0], `url(${await dataUrl(m[1].replace(/['"]/g, ''))})`)); }
    cssLetrasPdf = out.join('\n');
  } catch { cssLetrasPdf = ''; }
  return cssLetrasPdf;
}
async function gerarPdfDiapositivos(html, nomeFicheiro, progresso = () => {}, classeExtra = '') {
  const [ms, jp] = await Promise.all([carregarScript(LIBS_PDF.screenshot), carregarScript(LIBS_PDF.jspdf)]);
  const caixa = document.createElement('div');
  caixa.className = `sl-render ${classeExtra}`.trim(); caixa.setAttribute('aria-hidden', 'true'); caixa.innerHTML = html;
  document.body.appendChild(caixa);
  try {
    await (document.fonts?.ready || Promise.resolve());
    const cssLetras = await letrasParaPdf();
    await Promise.all([...caixa.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
    // Corpo de cada diapositivo que não cabe na altura disponível: encolhe por igual.
    for (const c of caixa.querySelectorAll('.et-corpo')) { const h = c.scrollHeight; if (h > 700) c.style.transform = `scale(${(700 / h).toFixed(3)})`; }
    const sls = [...caixa.querySelectorAll('.sl')];
    const pdf = new jp.jsPDF({ orientation: 'landscape', unit: 'px', format: [1920, 1080], hotfixes: ['px_scaling'], compress: true });
    for (let i = 0; i < sls.length; i++) {
      progresso(i + 1, sls.length);
      const opts = { width: 1920, height: 1080, scale: 1.6, quality: 0.92, backgroundColor: '#E9E6E0', ...(cssLetras ? { font: { cssText: cssLetras } } : {}) };
      // O Safari às vezes falha as imagens na primeira passagem: a primeira página é desenhada duas vezes.
      if (i === 0) await ms.domToJpeg(sls[i], opts).catch(() => {});
      const img = await ms.domToJpeg(sls[i], opts);
      if (i) pdf.addPage([1920, 1080], 'landscape');
      pdf.addImage(img, 'JPEG', 0, 0, 1920, 1080, undefined, 'FAST');
    }
    pdf.save(nomeFicheiro.replace(/[\\/:*?"<>|]+/g, '-').trim() + '.pdf');
  } finally { caixa.remove(); }
}

// Antes de exportar: rever a linha da capa e as conclusões (ficam guardadas enquanto a app estiver aberta).
App.relOpEdit = App.relOpEdit || {};

  const S = oportunidadesDe(eq, { ...F, persp: 'sofridas', momento: 'todos', golos: false }, jogos);
  const ed = App.relOpEdit[chave] || { capa: infoCapaOp(eq, F), conclusoes: conclusoesOportunidades(eq, C, S, jogos.length, F) };

  const linha = (c, i) => `<div class="exp-concl" data-i="${i}">
      <select aria-label="Ataque ou defesa"><option value="ataque" ${c[2] !== 'defesa' ? 'selected' : ''}>Ataque</option><option value="defesa" ${c[2] === 'defesa' ? 'selected' : ''}>Defesa</option></select>
      <div><input type="text" value="${esc(c[0])}" aria-label="Conclusão"><textarea rows="2" aria-label="Detalhe">${esc(c[1])}</textarea></div>
      <button class="btn-link perigo" type="button" data-tirar aria-label="Tirar esta conclusão">Tirar</button></div>`;
  const desenhar = () => {
    d.innerHTML = `<h2>Oportunidades e golos (16:9): ${esc(eq)}</h2>
      <p class="nota">10 diapositivos 16:9: capa, visão geral, oportunidades criadas por momento, golos marcados, oportunidades sofridas por momento e golos sofridos.</p>
      <label class="exp-campo">Linha de baixo da capa<input type="text" id="exp-capa" value="${esc(ed.capa)}"><small class="nota">Separe as partes com •, por exemplo: 4ª ELIMINATÓRIA • Estádio Nacional do Jamor • 22 nov 2026</small></label>
      <h3 class="exp-tit">Conclusões da visão geral</h3>
      <p class="nota sem-margem">Escolhidas pelos maiores desvios em relação às outras equipas codificadas. Pode reescrever, tirar ou acrescentar.</p>
      <div id="exp-lista">${ed.conclusoes.map(linha).join('')}</div>
      <div class="exp-acoes-lista"><button class="btn-link" type="button" id="exp-mais">+ Acrescentar conclusão</button><button class="btn-link" type="button" id="exp-repor">Repor as automáticas</button></div>
      <div class="acoes"><button class="btn" value="nao" type="button">Cancelar</button><button class="btn btn-prim" value="sim" type="button" id="exp-ok">Exportar PDF</button></div>`;
  };
  const ler = () => {
    ed.capa = $('#exp-capa', d).value;
    ed.conclusoes = $$('.exp-concl', d).map(el => [$('input', el).value.trim(), $('textarea', el).value.trim(), $('select', el).value]).filter(c => c[0] || c[1]);
    App.relOpEdit[chave] = ed;
  };
  desenhar(); document.body.appendChild(d); d.showModal();
  d.addEventListener('cancel', () => d.remove());
  d.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.matches('[data-tirar]')) { ler(); ed.conclusoes.splice(Number(b.closest('.exp-concl').dataset.i), 1); desenhar(); return; }
    if (b.id === 'exp-mais') { ler(); ed.conclusoes.push(['', '', 'ataque']); desenhar(); $$('.exp-concl input', d).at(-1)?.focus(); return; }
    if (b.id === 'exp-repor') { ed.conclusoes = conclusoesOportunidades(eq, C, S, jogos.length, F); ed.capa = infoCapaOp(eq, F); desenhar(); return; }
    if (b.value === 'nao') { ler(); d.close(); d.remove(); return; }
    if (b.id === 'exp-ok') {
      ler(); b.disabled = true;
      try {
        await gerarPdfDiapositivos(relOportunidades(eq, F, ed), `Oportunidades e golos ${eq} ${hojeIso()}`, (i, n) => { b.textContent = `A preparar ${i}/${n}…`; });
        d.close(); d.remove(); toast('PDF exportado.');
      } catch (err) {
        console.error(err); b.disabled = false; b.textContent = 'Exportar PDF';
        toast('Não foi possível gerar o PDF: ' + (err.message || err), 'erro');
      }
    }
  });
}

// ---------- Relatório de esquemas táticos (diapositivos 16:9) ----------
// Capa, visão geral (números + conclusões) e, para cantos e livres a favor e contra: onde cai a bola e como se bate.

function dadosRelEP(eq) {
  const fav = esquemasDaEquipa(eq, 'favor'), con = esquemasDaEquipa(eq, 'contra');
  const jogos = [...new Map([...fav.jogos, ...con.jogos].map(a => [a.key, a])).values()];
  const adv = a => { const m = ladoDaEquipa(a, eq); return m === 'casa' ? a.fora : a.casa; };
  const L = (lista, t) => lista.filter(x => x.e.ep_tipo === t).map(x => ({ ...x, opp: adv(x.a), hxh: x.e.hxh || [], tdef: x.e.tipo_defesa || null }));
  return { jogos, nj: Math.max(1, jogos.length), L: { favor: { Canto: L(fav.lista, 'Canto'), Livre: L(fav.lista, 'Livre') }, contra: { Canto: L(con.lista, 'Canto'), Livre: L(con.lista, 'Livre') } } };
}
const estEP = l => ({ n: l.length, c: l.filter(x => contactoGanho(x.e)).length, r: l.filter(x => comRemate(x.e)).length, g: l.filter(x => eGolo(x.e)).length });
const pctEP = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
const topoEP = (l, fn) => { const c = contarPor(l, fn); return c[0] ? { k: c[0][0], n: c[0][1] } : null; };

// Conclusões automáticas (o utilizador escolhe, reescreve ou tira antes de exportar).
function conclusoesEsquemas(eq) {
  const { nj, L } = dadosRelEP(eq);
  const pj = n => (n / nj).toFixed(1).replace('.', ',');
  const out = [];
  const outras = equipasComEsquemas().filter(e => !mesmaEquipa(e, eq)).map(e => { const d = dadosRelEP(e); return { e, d, fc: estEP(d.L.favor.Canto), cc: estEP(d.L.contra.Canto) }; }).filter(o => o.fc.n + o.cc.n >= 8);
  const posicao = (v, vals, desc = true) => 1 + vals.filter(x => desc ? x > v : x < v).length;
  // Cantos a favor: volume e primeira bola
  const fc = L.favor.Canto, sfc = estEP(fc);
  if (fc.length >= 5) {
    const cg = sfc.c / sfc.n;
    let rk = '';
    if (outras.length >= 3) { const vals = outras.map(o => o.fc.n ? o.fc.c / o.fc.n : 0); rk = ` (${posicao(cg, vals)}.º de ${outras.length + 1} no 1.º contacto)`; }
    out.push(['ataque', cg >= 0.3 ? 'Ganha muitas primeiras bolas nos cantos' : sfc.n / nj >= 5 ? 'Muitos cantos, pouca primeira bola' : 'Pouca primeira bola nos cantos',
      `${pj(sfc.n)} cantos por jogo (${sfc.n} em ${nj} jogos) e ganha o 1.º contacto em ${pctEP(sfc.c, sfc.n)}${rk}. Remata em ${pctEP(sfc.r, sfc.n)} e marcou ${sfc.g} ${sfc.g === 1 ? 'golo' : 'golos'}.`]);
    // Como bate
    const mec = topoEP(fc, x => x.e.mecanismo), bola = topoEP(fc, x => x.e.tipo_bola), zona = topoEP(fc, x => /^\d/.test(x.e.zona_ep || '') ? x.e.zona_ep : null);
    const bat = contarPor(fc, x => x.e.jogador).slice(0, 2);
    if (mec && bola) out.push(['ataque', `Canto ${mec.k.toLowerCase()} e ${bola.k.toLowerCase()}${zona ? `, sobretudo à zona ${zona.k}` : ''}`,
      `${pctEP(mec.n, fc.length)} ${mec.k.toLowerCase()}s, ${pctEP(bola.n, fc.length)} ${bola.k.toLowerCase()}s${zona ? `; a zona ${zona.k} é a mais procurada (${zona.n} de ${fc.length})` : ''}.${bat.length ? ` ${bat.map(([n, c]) => `${n} (${c})`).join(' e ')} ${bat.length > 1 ? 'batem' : 'bate'} ${pctEP(bat.reduce((s, [, c]) => s + c, 0), fc.length)} dos cantos.` : ''}`]);
    // Alvo e marcação HxH
    const ref = topoEP(fc, x => x.e.referencia);
    const comH = fc.filter(x => x.hxh.length);
    if (ref && ref.n >= 3) {
      let d = `Referência em ${ref.n} cantos (${pctEP(ref.n, fc.length)}).`;
      if (comH.length >= 3) {
        const m = contarPor(comH.flatMap(x => x.hxh.map(h => ({ h }))), y => y.h).slice(0, 3);
        const doRef = comH.filter(x => x.hxh.some(h => mesmaEquipa(h, ref.k) || norm(h) === norm(ref.k))).length;
        d += ` ${doRef ? `Foi marcado HxH em ${doRef} dos ${comH.length} cantos com registo` : `Com marcação HxH registada em ${comH.length} cantos`}; ${m.filter(([h]) => norm(h) !== norm(ref.k)).slice(0, 2).map(([h, n]) => `${h} (${n})`).join(' e ')} também costumam ter marcação individual.`;
      }
      out.push(['ataque', `${ref.k} é o alvo${comH.length >= 3 ? ' — e os adversários sabem' : ''}`, d]);
    }
  }
  // Livres a favor
  const fl = L.favor.Livre, sfl = estEP(fl);
  if (fl.length >= 5 && (sfl.g || sfl.r / sfl.n >= 0.4)) out.push(['ataque', sfl.g ? 'Perigo nos livres' : 'Os livres dão remate', `${fl.length} livres: 1.º contacto em ${pctEP(sfl.c, sfl.n)}, remate em ${pctEP(sfl.r, sfl.n)} e ${sfl.g} ${sfl.g === 1 ? 'golo' : 'golos'}.`]);
  // Cantos contra: tipo de defesa e controlo
  const cc = L.contra.Canto, scc = estEP(cc);
  if (cc.length >= 5) {
    const def = topoEP(cc.filter(x => x.tdef), x => x.tdef);
    const ctrl = scc.c / scc.n <= 0.25 && !scc.g;
    out.push(['defesa', `${def && def.n >= cc.length / 2 ? `Defende os cantos ${def.k === 'HxH' ? 'homem a homem' : def.k.toLowerCase()}` : 'Cantos contra'}${ctrl ? ' e controla-os' : scc.g ? ', mas sofre' : ''}`,
      `${def ? `${def.k} em ${def.n} de ${cc.length} cantos contra (${new Set(cc.filter(x => x.tdef === def.k).map(x => x.opp)).size} jogos). ` : ''}O adversário ganha o 1.º contacto em ${pctEP(scc.c, scc.n)}, remata em ${pctEP(scc.r, scc.n)} e marcou ${scc.g}.`]);
  }
  // Livres contra
  const cl = L.contra.Livre, scl = estEP(cl);
  if (cl.length >= 5) {
    const mec = topoEP(cl, x => x.e.mecanismo);
    const golos = cl.filter(x => eGolo(x.e)).map(x => x.opp);
    const fraco = scl.c / scl.n >= 0.35 || scl.g;
    out.push(['defesa', fraco ? 'Os livres laterais são o ponto fraco' : 'Defende bem os livres',
      `${mec ? `${mec.n} de ${cl.length} livres contra são ${mec.k.toLowerCase()}s. ` : ''}O adversário ganha a 1.ª bola em ${pctEP(scl.c, scl.n)}, remata em ${pctEP(scl.r, scl.n)}${scl.g ? ` e marcou ${scl.g} ${scl.g === 1 ? 'golo' : 'golos'} (${[...new Set(golos)].join(', ')})` : ' e não marcou'}.`]);
  }
  return out.slice(0, 6);
}

function relEsquemas(eq, ed) {
  const { jogos, nj, L } = dadosRelEP(eq);
  if (!jogos.length) return null;
  const pj = n => (n / nj).toFixed(1).replace('.', ',');
  const nomesJ = jogos.map(a => { const m = ladoDaEquipa(a, eq); return m === 'casa' ? a.fora : a.casa; });
  const pe = `<p class="sl-fonte">Fonte: codificação do Departamento de Análise · ${nj} ${nj === 1 ? 'jogo codificado' : 'jogos codificados'}${nj <= 6 ? ` (${esc(nomesJ.join(', '))})` : ''}</p>`;
  const slide = (c, cls = '') => `<section class="sl ${cls}">${c}${pe}</section>`;
  const topo = (t, sub, sec) => `<div class="sl-topo">${simboloEquipa(eq, 'sl-topo-simb')}<span class="sl-olho"><b>${esc(eq)}</b>${sec}</span></div>
    <div class="sl-cab"><div class="sl-regua"></div><h1>${t}</h1>${sub ? `<p class="sl-sub">${sub}</p>` : ''}</div>`;
  const capa = `<section class="sl sl-capa"><div class="capa-centro">
      <div class="capa-sobre">Esquemas táticos</div><h1 class="capa-titulo">${esc(eq.toUpperCase())}</h1>${simboloEquipa(eq, 'capa-simb')}
      <div class="capa-info">${String(ed.capa || '').split('•').map(t => t.trim()).filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('<i></i>')}</div></div></section>`;
  const S = { f: { c: estEP(L.favor.Canto), l: estEP(L.favor.Livre) }, c: { c: estEP(L.contra.Canto), l: estEP(L.contra.Livre) } };
  const lin = (rot, a, b) => `<tr><th>${rot}</th><td>${a}</td><td>${b}</td></tr>`;
  const bloco = (t, k) => `<tr class="vg-sep"><th colspan="3">${t}</th></tr>
    ${lin('Por jogo', `${pj(S.f[k].n)} <small>(${S.f[k].n})</small>`, `${pj(S.c[k].n)} <small>(${S.c[k].n})</small>`)}${lin('1.º contacto ganho', pctEP(S.f[k].c, S.f[k].n), pctEP(S.c[k].c, S.c[k].n))}${lin('Com remate', pctEP(S.f[k].r, S.f[k].n), pctEP(S.c[k].r, S.c[k].n))}${lin('Golos', S.f[k].g, S.c[k].g)}`;
  const concl = ed.conclusoes || [];
  const vg = slide(`${topo('Visão geral', `Cantos e livres de ${esc(eq)} e dos adversários, em ${nj} ${nj === 1 ? 'jogo codificado' : 'jogos codificados'}.`, 'Esquemas táticos')}
    <div class="vg"><div class="vg-esq"><table class="vg-tab et-tab"><thead><tr><th></th><th>A favor</th><th>Contra</th></tr></thead><tbody>${bloco('Cantos', 'c')}${bloco('Livres', 'l')}</tbody></table>
      <p class="et-nota">1.º contacto ganho: a primeira bola é da equipa que bate. Com remate: inclui a 2.ª vaga.</p></div>
    ${concl.length ? `<div class="vg-dir"><h2>Conclusões</h2><ol>${concl.map(([l, t, d]) => `<li class="${l === 'defesa' ? 'defesa' : 'ataque'}"><b><i class="vg-tag">${l === 'defesa' ? 'Defesa' : 'Ataque'}</i>${esc(t)}</b><span>${esc(d)}</span></li>`).join('')}</ol></div>` : ''}</div>`, 'sl-vg');
  const tabelaHxH = l => {
    const com = l.filter(x => x.hxh.length); if (!com.length) return '';
    const jI = new Set(com.map(x => x.opp)); const m = new Map();
    for (const x of com) for (const h of x.hxh) { const o = m.get(h) || { j: new Set(), c: 0 }; o.j.add(x.opp); o.c++; m.set(h, o); }
    const ls = [...m.entries()].sort((a, b) => b[1].j.size - a[1].j.size || b[1].c - a[1].c).slice(0, 6);
    return `<div><h3>Referências marcadas pelo adversário</h3><div class="tabela-env"><table class="tabela compacta ep-jogadores-tab"><thead><tr><th>Jogador</th><th class="num">Jogos</th><th class="num">Cantos</th></tr></thead>
      <tbody>${ls.map(([n, o]) => `<tr><td>${esc(n)}</td><td class="num"><b>${o.j.size}</b>/${jI.size}</td><td class="num">${o.c}/${com.length}</td></tr>`).join('')}</tbody></table></div>
      <p class="et-nota">Em ${com.length} dos ${l.length} cantos (${jI.size} jogos) foi registado quem o adversário marcou homem a homem.</p></div>`;
  };
  const tabelaDefesa = l => {
    if (!l.some(x => x.tdef)) return '';
    const tipos = [...new Set(l.map(x => x.tdef).filter(Boolean))];
    const gr = [...tipos.map(t => [t, l.filter(x => x.tdef === t)]), ['Sem registo', l.filter(x => !x.tdef)]].filter(([, g]) => g.length);
    return `<section class="bloco"><h2>Tipo de defesa nos cantos</h2><div class="tabela-env"><table class="tabela compacta et-def"><thead><tr><th>Defesa de ${esc(eq)}</th><th class="num">Cantos</th><th class="num">Jogos</th><th class="num">1.º contacto do adversário</th><th class="num">Remates</th><th class="num">Golos</th></tr></thead>
      <tbody>${gr.map(([k, g]) => { const s = estEP(g); return `<tr><td><b>${esc(k)}</b></td><td class="num"><b>${g.length}</b> (${pctEP(g.length, l.length)})</td><td class="num">${new Set(g.map(x => x.opp)).size}</td><td class="num">${pctEP(s.c, g.length)}</td><td class="num">${s.r}</td><td class="num">${s.g}</td></tr>`; }).join('')}</tbody></table></div></section>`;
  };
  const pags = [];
  for (const [p, sec, suf] of [['favor', 'Esquemas ofensivos', 'a favor'], ['contra', 'Esquemas defensivos', 'contra']]) {
    for (const t of ['Canto', 'Livre']) {
      const l = L[p][t]; if (!l.length) continue;
      const n = l.length, s = estEP(l), esq = l.filter(x => x.e.corredor === 'Esquerdo').length, dir = l.filter(x => x.e.corredor === 'Direito').length;
      const cel = (rot, val, sub = '') => `<div class="placar-cel"><span class="placar-rot">${rot}</span><span class="placar-val">${val}</span>${sub ? `<span class="placar-sub">${sub}</span>` : ''}</div>`;
      const nome = `${t}s ${suf}`;
      const placar = `<section class="placar">${cel(`${t}s por jogo`, pj(n), `${n} em ${nj} jogos · ${esq} da esquerda · ${dir} da direita`)}${cel('1.º contacto ganho', pctEP(s.c, n), `${s.c} de ${n}`)}${cel('Com remate', pctEP(s.r, n), `${s.r} (inclui 2.ª vaga)`)}${cel('Golos', s.g, s.g ? `1 golo a cada ${Math.round(n / s.g)}` : 'nenhum')}</section>`;
      pags.push(slide(`${topo(nome, p === 'favor' ? 'Onde cai a bola: zona 1 é sempre o 1.º poste, o mais próximo de onde se bate.' : 'Onde cai a bola, nos esquemas dos adversários: zona 1 é sempre o 1.º poste. Lado visto por quem bate.', sec)}
        <div class="et-corpo">${placar}<section class="bloco ep-onde">${mapasPorLadoEP(l)}<div class="ana-grelha dois ep-onde-barras">${barras('1.º contacto', contarPor(l, x => x.e.primeiro_contacto), n)}${barras('Resultado', contarPor(l, x => x.e.resultado), n)}</div></section></div>`));
      const temJog = l.some(x => x.e.jogador || x.e.referencia);
      const comDef = p === 'contra' && t === 'Canto' && l.some(x => x.tdef);
      const hxh = p === 'favor' ? tabelaHxH(l) : '';
      pags.push(slide(`${topo(nome, temJog ? 'Como se bate e quem bate.' : 'Como se bate.', sec)}
        <div class="et-corpo"><section class="bloco"><h2>Como se bate</h2><div class="ana-grelha ${t === 'Livre' || comDef ? 'quatro' : 'tres'}">
          ${barras('Mecanismo', contarPor(l, x => x.e.mecanismo), n)}${barras('Tipo de bola', contarPor(l, x => x.e.tipo_bola), n)}${barras('Lado', contarPor(l, x => x.e.corredor), n)}${t === 'Livre' ? barras('Distância', contarPor(l, x => x.e.distancia), n) : ''}${comDef ? barras(`Como defende ${esc(eq)}`, contarPor(l, x => x.tdef || 'Sem registo'), n) : ''}</div></section>
          ${temJog ? `<section class="bloco ep-jogadores"><h2>Jogadores</h2><div class="ana-grelha ${hxh ? 'tres et-jog3' : 'dois'}">${tabelaJogadoresEP('Batedores', l, 'jogador', 6)}${tabelaJogadoresEP('Referências', l, 'referencia', 6)}${hxh}</div></section>`
            : `${comDef ? tabelaDefesa(l) : ''}<section class="bloco"><h2>Jogos</h2>${barras(`${t}s por adversário`, contarPor(l, x => x.opp), n, { max: 10 })}</section>`}
        </div>`));
    }
  }
  return [capa, vg, ...pags].join('');
}

App.relEPEdit = App.relEPEdit || {};
function dialogoExportarEsquemas(eq) {
  const chave = norm(eq);
  const ed = App.relEPEdit[chave] || { capa: infoCapaOp(eq, App.ana || {}), conclusoes: conclusoesEsquemas(eq).map(([l, t, d]) => [t, d, l]) };
  const d = document.createElement('dialog'); d.className = 'dialogo dialogo-largo';
  const linha = (c, i) => `<div class="exp-concl" data-i="${i}">
      <select aria-label="Ataque ou defesa"><option value="ataque" ${c[2] !== 'defesa' ? 'selected' : ''}>Ataque</option><option value="defesa" ${c[2] === 'defesa' ? 'selected' : ''}>Defesa</option></select>
      <div><input type="text" value="${esc(c[0])}" aria-label="Conclusão"><textarea rows="2" aria-label="Detalhe">${esc(c[1])}</textarea></div>
      <button class="btn-link perigo" type="button" data-tirar aria-label="Tirar esta conclusão">Tirar</button></div>`;
  const desenhar = () => {
    d.innerHTML = `<h2>Esquemas táticos (16:9): ${esc(eq)}</h2>
      <p class="nota">Diapositivos 16:9: capa, visão geral com as conclusões e, para cantos e livres a favor e contra, onde cai a bola e como se bate.</p>
      <label class="exp-campo">Linha de baixo da capa<input type="text" id="exp-capa" value="${esc(ed.capa)}"><small class="nota">Separe as partes com •, por exemplo: LIGA EUROPA • Fase de liga • 26 nov 2026</small></label>
      <h3 class="exp-tit">Conclusões da visão geral</h3>
      <p class="nota sem-margem">Sugeridas a partir dos dados. Pode reescrever, tirar ou acrescentar.</p>
      <div id="exp-lista">${ed.conclusoes.map(linha).join('')}</div>
      <div class="exp-acoes-lista"><button class="btn-link" type="button" id="exp-mais">+ Acrescentar conclusão</button><button class="btn-link" type="button" id="exp-repor">Repor as automáticas</button></div>
      <div class="acoes"><button class="btn" value="nao" type="button">Cancelar</button><button class="btn btn-prim" type="button" id="exp-ok">Exportar PDF</button></div>`;
  };
  const ler = () => {
    ed.capa = $('#exp-capa', d).value;
    ed.conclusoes = $$('.exp-concl', d).map(el => [$('input', el).value.trim(), $('textarea', el).value.trim(), $('select', el).value]).filter(c => c[0] || c[1]);
    App.relEPEdit[chave] = ed;
  };
  desenhar(); document.body.appendChild(d); d.showModal();
  d.addEventListener('cancel', () => d.remove());
  d.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.matches('[data-tirar]')) { ler(); ed.conclusoes.splice(Number(b.closest('.exp-concl').dataset.i), 1); desenhar(); return; }
    if (b.id === 'exp-mais') { ler(); ed.conclusoes.push(['', '', 'ataque']); desenhar(); $$('.exp-concl input', d).at(-1)?.focus(); return; }
    if (b.id === 'exp-repor') { ed.conclusoes = conclusoesEsquemas(eq).map(([l, t, dd]) => [t, dd, l]); desenhar(); return; }
    if (b.value === 'nao') { ler(); d.close(); d.remove(); return; }
    if (b.id === 'exp-ok') {
      ler(); b.disabled = true;
      try {
        const html = relEsquemas(eq, { capa: ed.capa, conclusoes: ed.conclusoes.map(([t, dd, l]) => [l, t, dd]) });
        await gerarPdfDiapositivos(html, `Esquemas táticos ${eq} ${hojeIso()}`, (i, n) => { b.textContent = `A preparar ${i}/${n}…`; }, 'sl-et');
        d.close(); d.remove(); toast('PDF exportado.');
      } catch (err) { console.error(err); b.disabled = false; b.textContent = 'Exportar PDF'; toast('Não foi possível gerar o PDF.', 'erro'); }
    }
  });
}

// Ponto a marcar primeiro no campo: o passe (depois passa sozinho para a finalização), exceto quando não há passe.
function pontoInicial() { return C_SEM_PASSE() ? 'fin' : 'passe'; }
function C_SEM_PASSE() { const f = App.cod?.form || {}; return f.sub_momento === 'Penálti' || ['Remate exterior', 'Remate direto'].includes(f.mecanismo); }
// ---------- Codificação de oportunidades (todos os jogos do campeonato) ----------
const CAMPOS_FORM = ['minuto', 'tempo', 'momento', 'sub_momento', 'mecanismo', 'corredor', 'resultado', 'jogador', 'posicao_finalizador', 'assistente', 'posicao_passe', 'qualidade', 'finalizacao', 'video_url', 'notas'];

function reindexarEventos() {
  const ev = {}; for (const r of App.d.eventos) if (r.jogo_id) (ev[r.jogo_id] ||= []).push(r);
  App.idx.eventos = ev;
  indexarAlvos();
}

function chips(nome, opcoes, valor, rotulo, extra = '') {
  return `<fieldset class="grupo-chips"><legend>${rotulo}${extra}</legend><div class="chips">
    ${opcoes.map(o => `<label class="chip"><input type="radio" name="${nome}" value="${esc(o)}" ${o === valor ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}
  </div></fieldset>`;
}

// Cor das marcas: SCUT a azul quando joga; nos outros jogos, casa a azul e fora a laranja.
function corLado(a, lado) { return a.ladoNosso ? (lado === a.ladoNosso ? 'nos' : 'adversario') : (lado === 'casa' ? 'nos' : 'adversario'); }
const paraCampo = (a, e) => ({ ...e, lado: corLado(a, ladoNoAlvo(e, a)) });

// Cores das equipas nas páginas de codificação (pedido do departamento). Equipas fora da lista: bordô / preto.
const CORES_EQUIPAS = [
  ['#FFFFFF', ['leiria']],
  ['#1A1A1A', ['portimonense', 'amarante', 'academica', 'farense']],
  ['#C8102E', ['penafiel', 'benfica', 'leixoes', 'avs']],
  ['#1E8449', ['sporting']],
  ['#F2C40F', ['lourosa', 'tondela']],
  ['#5DADE2', ['vizela']],
  ['#7A1F2B', ['torreense']],
  ['#6C3483', ['felgueiras']],
  ['#1F4FBF', ['porto', 'feirense']],
  ['#0B2545', ['chaves']]
];
const CORES_CLARAS = new Set(['#FFFFFF', '#F2C40F', '#5DADE2']);
function corDaEquipa(nome) {
  const n = ` ${norm(nome)} `;
  for (const [cor, chaves] of CORES_EQUIPAS) if (chaves.some(k => n.includes(` ${k} `))) return cor;
  return null;
}
// Põe as cores das duas equipas do jogo nas variáveis usadas pelos botões, pontos e marcas no campo.
function aplicarCoresJogo(el, a) {
  if (!el || !a) return;
  const lNos = corLado(a, 'casa') === 'nos' ? 'casa' : 'fora', lAdv = lNos === 'casa' ? 'fora' : 'casa';
  const cn = corDaEquipa(a[lNos]) || '#7A1F2B';
  let ca = corDaEquipa(a[lAdv]) || '#1A1A1A';
  if (ca === cn) ca = cn === '#8A8F94' ? '#1A1A1A' : '#8A8F94'; // mesma cor nas duas equipas: o adversário fica a cinzento
  for (const [k, c] of [['nos', cn], ['adv', ca]]) {
    el.style.setProperty(`--eq-${k}`, c);
    el.style.setProperty(`--eq-${k}-linha`, { '#FFFFFF': '#4B5563', '#F2C40F': '#B8930A', '#5DADE2': '#2E86C1' }[c] || c); // contorno das marcas: cores claras escurecidas para se verem no campo
    el.style.setProperty(`--eq-${k}-borda`, c === '#FFFFFF' ? '#4B5563' : '#fff');
    el.style.setProperty(`--eq-${k}-txt`, CORES_CLARAS.has(c) ? '#17202B' : '#fff');
  }
}

function opcoesAlvos(selecionado) {
  const alvos = App.idx.alvos; const ev = App.idx.eventosAlvo;
  const liga = alvos.filter(a => a.partida).sort((a, b) => (b.jornada ?? 0) - (a.jornada ?? 0) || a.casa.localeCompare(b.casa, 'pt'));
  const outros = alvos.filter(a => !a.partida).sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
  const porJornada = {}; for (const a of liga) (porJornada[a.jornada ?? '–'] ||= []).push(a);
  const opt = a => { const n = (ev[a.key] || []).length; return `<option value="${a.key}" ${a.key === selecionado ? 'selected' : ''}>${n ? '✓ ' : ''}${esc(rotuloAlvo(a, true))}${n ? ` (${n})` : ''}</option>`; };
  return Object.entries(porJornada).sort((a, b) => Number(b[0]) - Number(a[0])).map(([j, ls]) => `<optgroup label="Jornada ${j}">${ls.map(opt).join('')}</optgroup>`).join('')
    + (outros.length ? `<optgroup label="Outros jogos do ${esc(nomeNosso())}">${outros.map(opt).join('')}</optgroup>` : '');
}

function desenharCodificacao() {
  const v = $('#vista'); const C = App.cod;
  const alvos = App.idx.alvos || [];
  if (!alvos.length) {
    v.innerHTML = `<div class="cabecalho-vista"><h1>Codificação</h1></div><div class="vazio"><p>Ainda não há jogos para codificar.</p>${pode() ? '<p>Importe o ficheiro da liga em <a href="#importacao">Importação</a>: os jogos de todas as equipas ficam disponíveis aqui.</p>' : ''}</div>`;
    return;
  }
  if (!C.alvo || !App.idx.alvo[C.alvo]) {
    // Por defeito: o último jogo do SCUT no campeonato com resultado; senão, o mais recente.
    const nossos = alvos.filter(a => a.partida && a.ladoNosso && Number.isFinite(a.golosCasa)).sort((a, b) => (b.jornada ?? 0) - (a.jornada ?? 0));

  }

  v.innerHTML = `
    <div class="cabecalho-vista">
      <div><h1>Codificação</h1><p class="nota">${liga.length ? `${feitos} de ${liga.length} jogos do campeonato codificados.` : 'Importe o ficheiro da liga para codificar os jogos de todas as equipas.'}</p></div>
      <div class="cod-jogo-sel">
        <button class="btn" id="c-ant" aria-label="Jogo anterior">‹</button>

        <button class="btn" id="c-seg" aria-label="Jogo seguinte">›</button>
      </div>
    </div>
    <div class="cod-cab-jogo">
      <span class="cod-equipa ${corLado(a, 'casa')}">${esc(a.casa)}</span>
      <b class="cod-resultado">${Number.isFinite(a.golosCasa) ? `${a.golosCasa} – ${a.golosFora}` : 'vs'}</b>
      <span class="cod-equipa ${corLado(a, 'fora')}">${esc(a.fora)}</span>
      <span class="fraco">${esc([a.competicao, a.jornada != null ? `Jornada ${a.jornada}` : null, a.data ? fmtData(a.data) : null].filter(Boolean).join(' · '))}</span>
      ${a.partida && (a.partida.treinador_casa || a.partida.treinador_fora) ? `<span class="fraco">Treinadores: ${esc(a.partida.treinador_casa || '–')} / ${esc(a.partida.treinador_fora || '–')}</span>` : ''}
      ${a.partida && pode() ? '<button class="btn-link" id="c-treinadores">Treinadores</button>' : ''}
    </div>
    <div class="cod-grelha ${pode() ? '' : 'so-leitura'}">
      ${pode() ? '<section class="bloco cod-form" id="c-form-env"></section>' : `<section class="bloco"><h2>Mapa do jogo</h2>${campoSVG({ eventos: (App.idx.eventosAlvo[a.key] || []).map(e => paraCampo(a, e)), passes: true })}${legendaCampo()}</section>`}
      <section class="bloco cod-lista" id="c-lista"></section>
    </div>`;
  const ordem = [...$('#c-jogo').options].map(o => o.value);
  const ir = k => { if (!k) return; C.alvo = k; C.side = App.idx.alvo[k].ladoNosso || 'casa'; C.editarId = null; C.form = {}; C.zona = null; C.passe = null; desenharCodificacao(); };
  $('#c-jogo').addEventListener('change', e => ir(e.target.value));
  $('#c-ant').addEventListener('click', () => ir(ordem[ordem.indexOf(C.alvo) + 1]));
  $('#c-seg').addEventListener('click', () => ir(ordem[ordem.indexOf(C.alvo) - 1]));
  $('#c-treinadores')?.addEventListener('click', () => dialogoTreinadores(a));
  aplicarCoresJogo(v, a);
  if (pode()) desenharFormEvento();

}

function dialogoTreinadores(a) {
  const d = document.createElement('dialog'); d.className = 'dialogo';
  d.innerHTML = `<form class="pilha" method="dialog"><h2>Treinadores</h2>
    <label>${esc(a.casa)}<input name="tc" value="${esc(a.partida.treinador_casa || '')}"></label>

    <div class="acoes"><button class="btn" value="cancelar" formnovalidate>Cancelar</button><button class="btn btn-prim" value="guardar">Guardar</button></div></form>`;

}

// Nomes conhecidos de cada equipa (plantel do SCUT e oportunidades já codificadas), com a última posição usada.
function nomesDaEquipa(equipa) {
  const nomes = new Map();
  if (eNossaEquipa(equipa) || norm(equipa) === norm(nomeNosso())) {
    for (const p of App.d.plantel) nomes.set(p.nome, normPosicao(p.posicao));
  }
  for (const e of App.d.eventos) {
    if (!mesmaEquipa(equipaDoEvento(e) || '', equipa)) continue;
    if (e.jogador) nomes.set(e.jogador, e.posicao_finalizador || nomes.get(e.jogador) || null);
    if (e.assistente) nomes.set(e.assistente, e.posicao_passe || nomes.get(e.assistente) || null);
  }
  return nomes;
}

async function guardarEvento(e) {
  e.preventDefault();
  lerFormParaEstado();
  const C = App.cod; const F = C.form; const a = App.idx.alvo[C.alvo];
  const erros = [];
  const minuto = F.minuto === '' || F.minuto === undefined || F.minuto === null ? null : Number(F.minuto);
  if (minuto !== null && (!Number.isInteger(minuto) || minuto < 0 || minuto > 130)) erros.push('um minuto válido');
  if (!F.momento) erros.push('o momento');
  else if (!F.sub_momento) erros.push('o sub-momento');
  else if (mecanismosDe(F.momento, F.sub_momento).length && !F.mecanismo) erros.push('o mecanismo');
  if (!F.corredor) erros.push('o lado');
  if (!F.tempo) erros.push('o tempo');
  if (!C.zona) erros.push('o local da finalização no campo');
  if (!F.resultado) erros.push('o resultado');
  if (F.video_url && !/^https?:\/\//i.test(F.video_url)) erros.push('uma ligação de vídeo válida (começa por https://)');
  const elErro = $('#c-erro');
  if (erros.length) { elErro.textContent = `Falta indicar ${erros.join(', ').replace(/, ([^,]*)$/, ' e $1')}.`; elErro.hidden = false; return; }
  const jogo_id = a.jogo?.id || a.partida?.jogo_id || null;
  const penalti = F.sub_momento === 'Penálti';
  const reg = {
    partida_id: a.partida?.id || null, jogo_id, equipa: a[C.side], lado: jogo_id && a.ladoNosso ? (C.side === a.ladoNosso ? 'nos' : 'adversario') : null,
    tipo: 'oportunidade', minuto, tempo: F.tempo, parte: parteDoTempo(F.tempo),
    momento: F.momento, sub_momento: F.sub_momento, mecanismo: penalti ? null : F.mecanismo || null, corredor: F.corredor,
    qualidade: F.qualidade || (penalti ? 'Grande oportunidade' : 'Oportunidade'), finalizacao: F.finalizacao || null, resultado: F.resultado,
    zona_x: C.zona.x, zona_y: C.zona.y, passe_x: penalti ? null : C.passe?.x ?? null, passe_y: penalti ? null : C.passe?.y ?? null, local_aprox: false,
    jogador: normNome(F.jogador), posicao_finalizador: F.posicao_finalizador || null,
    assistente: penalti ? null : normNome(F.assistente), posicao_passe: penalti ? null : F.posicao_passe || null,
    video_url: (F.video_url || '').trim() || null, notas: (F.notas || '').trim() || null
  };
  const btn = $('#c-form button.btn-prim'); btn.disabled = true;
  try {
    if (C.editarId) {
      // Uma oportunidade da folha antiga já tem o passe nas faixas novas: grava-se a marca para não voltar a ser convertida.
      if (App.d.eventos.find(x => x.id === C.editarId)?.origem === 'folha_z') reg.origem = 'folha_z';
      const [r] = await App.db.atualizar('eventos', { id: C.editarId }, reg);
      App.d.eventos = App.d.eventos.map(x => x.id === C.editarId ? (r || { ...x, ...reg }) : x);
      toast('Oportunidade atualizada.');
    } else {
      App.d.eventos.push(await App.db.inserir('eventos', reg));
      toast(`Oportunidade de ${reg.equipa} guardada.`);
    }
    reindexarEventos();
    C.editarId = null; C.zona = null; C.passe = null; C.ponto = pontoInicial();
    C.form = {};
    desenharCodificacao();
  } catch (err) {
    btn.disabled = false;
    elErro.textContent = /partida_id|sub_momento|mecanismo|corredor|passe_x|column/i.test(err.message) ? 'A base de dados precisa de ser atualizada para este método de codificação. Corra outra vez o schema.sql no Supabase (SQL Editor).' : err.message;
    elErro.hidden = false;
  }
}

// ---------- Esquemas táticos (cantos e livres) ----------
// Codificados em todos os jogos do campeonato. Cada esquema pertence à equipa que bate:
// conta "a favor" dessa equipa e "contra" o adversário nesse jogo.
const EP = {
  tipos: ['Canto', 'Livre'],
  lados: ['Esquerdo', 'Centro', 'Direito'],
  distancias: ['Curto', 'Médio', 'Longo'],
  mecanismos: ['Direto', 'Cruzamento', 'Combinado'],
  bolas: ['Aberto', 'Fechado'],
  contactos: ['Ataque', 'Defesa', 'Guarda-redes', 'Fora'],
  zonas: ['Zona 1', 'Zona 2', 'Zona 3', 'Zona 4', 'Baliza', 'Fora de área'],
  resultados: ['Golo', 'Remate fora', 'Remate bloqueado', 'Defesa GR', 'Corte defesa', 'Corte GR', 'Passe', 'Falta atacante', 'Falta defensiva', 'Fora']
};
// Resultados que se escolhem nos botões ("Fora" é posto automaticamente quando o 1.º contacto é fora).
const EP_RES_BOTOES = EP.resultados.filter(r => r !== 'Fora');
// Minuto "35:20" ou "35" → { minuto, segundo }; null se vazio; false se inválido.
function lerMinutoEP(v) {
  const t = String(v ?? '').trim(); if (!t) return null;
  const m = t.match(/^(\d{1,3})(?:[:.,'](\d{1,2}))?$/); if (!m) return false;
  const minuto = Number(m[1]), segundo = m[2] != null ? Number(m[2]) : null;
  if (minuto > 130 || (segundo !== null && segundo > 59)) return false;
  return { minuto, segundo };
}
const fmtMinutoEP = e => Number.isFinite(e.minuto) ? (Number.isFinite(e.segundo) ? `${e.minuto}:${String(e.segundo).padStart(2, '0')}` : `${e.minuto}'`) : '–';
const EP_REMATE = new Set(['Golo', 'Remate fora', 'Remate bloqueado', 'Defesa GR']);
const EP_AJUDA = {
  zonas: 'Zona 1 primeiro poste · 2 centro da baliza · 3 segundo poste (na largura da pequena área) · 4 entrada da área · Baliza: bola dirigida à baliza',

      ${chips('tipo_defesa', ['—', ...EP_DEFESAS], F.tipo_defesa || '—', `Defesa de ${esc(a[C.side === 'casa' ? 'fora' : 'casa'])}`, ' <span class="fraco">(opcional; como defende quem não bate)</span>')}

        </fieldset>`;
      })()}

            <label>Ligação para o vídeo<input name="video_url" type="url" placeholder="https://" value="${esc(F.video_url || '')}"></label>

      </div>
    </form>`;
  const form = $('#e-form');
  form.addEventListener('change', e => {
    const n = e.target.name;
    if (['ponto', 'side', 'ep_tipo', 'corredor', 'primeiro_contacto', 'tipo_defesa'].includes(n)) {
      lerFormEP();
      if (n === 'ponto') C.ponto = e.target.value;
      if (n === 'primeiro_contacto') { if (C.form.primeiro_contacto === 'Fora') { C.form.resultado = 'Fora'; C.form.segunda_vaga = null; } else if (C.form.resultado === 'Fora') C.form.resultado = null; }
      if (n === 'ep_tipo' || n === 'corredor') {
        if (C.form.ep_tipo === 'Canto') { C.form.distancia = null; if (C.form.mecanismo === 'Cruzamento') C.form.mecanismo = null; if (C.form.corredor && CANTO_EP[C.form.corredor]) { C.batida = CANTO_EP[C.form.corredor]; if (!C.queda) C.ponto = 'queda'; } }
        if (C.queda) C.form.zona_ep = C.form.zona_ep === 'Baliza' ? 'Baliza' : zonaQuedaEP(C.queda, C.form.corredor);
      }
      if (n === 'side') C.form.hxh = [];
      desenharFormEP(); if (n === 'side') desenharListaEP();
    }
  });
  const addHxH = () => {
    const i = $('#e-hxh-novo'); const nome = nomeCanonicoEP(a[C.side], i?.value || ''); if (!nome) return;
    lerFormEP(); C.form.hxh = [...new Set([...(C.form.hxh || []), nome])]; desenharFormEP(); $('#e-hxh-novo')?.focus();
  };
  $('#e-hxh-add')?.addEventListener('click', addHxH);
  $('#e-hxh-novo')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addHxH(); } });
  $('#e-campo svg').addEventListener('click', e => {
    const svg = e.currentTarget; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const ponto = { x: Math.round(Math.min(105, Math.max(0, p.x)) / 1.05 * 10) / 10, y: Math.round(Math.min(68, Math.max(0, p.y)) / 0.68 * 10) / 10 };
    lerFormEP();
    if (C.ponto === 'batida') {
      // Perto da linha de fundo e da bandeirola: é canto.
      const canto = distBaliza(ponto.x) < 3 && (metrosY(ponto.y) < 6 || metrosY(ponto.y) > M.larg - 6);
      if (canto) { C.form.ep_tipo = 'Canto'; if (C.form.mecanismo === 'Cruzamento') C.form.mecanismo = null; C.form.corredor = metrosY(ponto.y) < M.larg / 2 ? 'Esquerdo' : 'Direito'; C.batida = CANTO_EP[C.form.corredor]; C.form.distancia = null; }
      else { C.batida = ponto; C.form.ep_tipo ||= 'Livre'; C.form.corredor = ladoBatidaEP(ponto); if (C.form.ep_tipo === 'Livre') C.form.distancia = distanciaBatidaEP(ponto); }
      if (!C.queda) C.ponto = 'queda';
    } else {
      C.queda = ponto;
      if (C.form.zona_ep !== 'Baliza') C.form.zona_ep = zonaQuedaEP(ponto, C.form.corredor);
    }
    if (C.queda && C.form.zona_ep !== 'Baliza') C.form.zona_ep = zonaQuedaEP(C.queda, C.form.corredor);
    desenharFormEP();
  });
  $('#e-limpar')?.addEventListener('click', () => { lerFormEP(); C.batida = null; C.queda = null; C.ponto = 'batida'; desenharFormEP(); });
  $('#e-cancelar')?.addEventListener('click', () => { Object.assign(C, { editarId: null, form: {}, batida: null, queda: null, ponto: 'batida' }); desenharFormEP(); desenharListaEP(); });
  form.addEventListener('submit', guardarEP);
}

async function guardarEP(e) {
  e.preventDefault(); lerFormEP();
  const C = App.codEP; const F = C.form; const a = App.idx.alvo[C.alvo];
  const erros = [];
  const tm = lerMinutoEP(F.minuto); if (tm === false) erros.push('um minuto válido (por exemplo 35 ou 35:20)');
  const minuto = tm ? tm.minuto : null, segundo = tm ? tm.segundo : null;
  if (F.primeiro_contacto === 'Fora') { F.resultado = 'Fora'; F.segunda_vaga = null; }
  if (!F.ep_tipo) erros.push('o tipo');
  if (!F.corredor) erros.push('o lado');
  if (F.ep_tipo === 'Livre' && !F.distancia) erros.push('a distância');
  if (!F.mecanismo) erros.push('o mecanismo');
  if (F.ep_tipo === 'Canto' && F.mecanismo === 'Cruzamento') erros.push('o mecanismo (um canto é direto ou combinado)');
  if (!F.tipo_bola) erros.push('o tipo de bola');
  if (!F.zona_ep) erros.push('a zona onde cai');
  if (!F.primeiro_contacto) erros.push('o 1.º contacto');
  if (!F.resultado) erros.push('o resultado');
  if (F.video_url && !/^https?:\/\//i.test(F.video_url)) erros.push('uma ligação de vídeo válida (começa por https://)');
  const elErro = $('#e-erro');
  if (erros.length) { elErro.textContent = `Falta indicar ${erros.join(', ').replace(/, ([^,]*)$/, ' e $1')}.`; elErro.hidden = false; return; }
  const jogo_id = a.jogo?.id || a.partida?.jogo_id || null;
  const reg = {
    partida_id: a.partida?.id || null, jogo_id, equipa: a[C.side], lado: jogo_id && a.ladoNosso ? (C.side === a.ladoNosso ? 'nos' : 'adversario') : null,
    tipo: 'esquema_tatico', momento: 'Esquema tático', sub_momento: F.ep_tipo, ep_tipo: F.ep_tipo, corredor: F.corredor,
    distancia: F.ep_tipo === 'Livre' ? F.distancia : null, mecanismo: F.mecanismo, tipo_bola: F.tipo_bola, primeiro_contacto: F.primeiro_contacto,
    zona_ep: F.zona_ep, resultado: F.resultado, segunda_vaga: F.segunda_vaga && F.segunda_vaga !== '—' ? F.segunda_vaga : null,
    jogador: nomeCanonicoEP(a[C.side], F.jogador), referencia: nomeCanonicoEP(a[C.side], F.referencia),
    tipo_defesa: F.tipo_defesa && F.tipo_defesa !== '—' ? F.tipo_defesa : null,
    hxh: F.hxh?.length ? F.hxh.map(n => nomeCanonicoEP(a[C.side], n)).filter(Boolean) : null, minuto, segundo, tempo: minuto !== null ? tempoDoMinuto(minuto) : null,
    zona_x: C.queda?.x ?? null, zona_y: C.queda?.y ?? null, passe_x: C.batida?.x ?? null, passe_y: C.batida?.y ?? null, local_aprox: false, origem: 'app',
    video_url: (F.video_url || '').trim() || null, notas: (F.notas || '').trim() || null
  };
  const btn = $('#e-form button.btn-prim'); btn.disabled = true;
  try {
    if (C.editarId) {
      const [r] = await App.db.atualizar('eventos', { id: C.editarId }, reg);
      App.d.eventos = App.d.eventos.map(x => (x.id === C.editarId ? (r || { ...x, ...reg }) : x)); toast('Esquema tático atualizado.');
    } else { App.d.eventos.push(await App.db.inserir('eventos', reg)); toast(`${reg.ep_tipo} de ${reg.equipa} guardado.`); }
    reindexarEventos();
    // Mantém equipa, tipo e lado para o próximo (é comum haver vários cantos seguidos).
    Object.assign(C, { editarId: null, batida: F.ep_tipo === 'Canto' ? CANTO_EP[F.corredor] : null, queda: null, ponto: F.ep_tipo === 'Canto' ? 'queda' : 'batida', form: { ep_tipo: F.ep_tipo, corredor: F.ep_tipo === 'Canto' ? F.corredor : null, jogador: F.ep_tipo === 'Canto' ? F.jogador : null, tipo_defesa: F.tipo_defesa || null, hxh: F.ep_tipo === 'Canto' ? (F.hxh || []) : [] } });
    desenharCodEsquemas();
  } catch (err) {
    btn.disabled = false;
    elErro.textContent = /ep_tipo|primeiro_contacto|zona_ep|segunda_vaga|referencia|tipo_bola|distancia|tipo_defesa|hxh|column/i.test(err.message) ? 'A base de dados precisa de ser atualizada para os esquemas táticos. Corra outra vez o schema.sql no Supabase (SQL Editor).' : err.message;
    elErro.hidden = false;
  }
}

      <li class="${e.id === C.editarId ? 'a-editar' : ''}">
        <span class="ev-min ${Number.isFinite(e.minuto) ? '' : 'ev-tempo'}">${fmtMinutoEP(e)}</span>
        <span class="ponto-cor ${corLado(a, l) === 'nos' ? 'nos' : 'adv'}" title="${esc(a[l] || '')}"></span>
        <div class="ev-txt">
          <b>${esc([e.ep_tipo, e.corredor && `lado ${e.corredor.toLowerCase()}`, e.distancia && e.distancia.toLowerCase(), e.mecanismo, e.tipo_bola && e.tipo_bola.toLowerCase()].filter(Boolean).join(' · '))}</b>
          <span class="${eGolo(e) ? 'golo' : ''}">${esc([e.zona_ep, e.primeiro_contacto && `1.º contacto: ${e.primeiro_contacto.toLowerCase()}`, e.resultado, e.segunda_vaga && `2.ª vaga: ${e.segunda_vaga.toLowerCase()}`].filter(Boolean).join(' · '))}</span>
          <small>${esc([e.jogador && `bate ${e.jogador}`, e.referencia && `referência ${e.referencia}`, e.tipo_defesa && `defesa ${e.tipo_defesa}`, e.hxh?.length && `marcados: ${e.hxh.join(', ')}`].filter(Boolean).join(' · '))}</small>
          ${e.local_aprox ? '<small class="fraco">Local aproximado (importado da folha por zonas)</small>' : ''}
        </div>
        <div class="ev-acoes">
          ${e.video_url && /^https?:\/\//i.test(e.video_url) ? `<a class="btn-link" href="${esc(e.video_url)}" target="_blank" rel="noopener">Vídeo</a>` : ''}
          <button class="btn-link" data-ep-editar="${e.id}">Editar</button>${podeApagar() ? `<button class="btn-link perigo" data-ep-apagar="${e.id}">Apagar</button>` : ''}

  $$('input[name=e-filtro]', el).forEach(r => r.addEventListener('change', () => { C.filtro = r.value; desenharListaEP(); }));

    Object.assign(C, { editarId: ev.id, side: ladoNoAlvo(ev, a) || 'casa', ponto: 'queda',
