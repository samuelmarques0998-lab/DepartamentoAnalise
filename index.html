// Importa uma lista de jogadores (Excel ou CSV) com colunas como Nome, Número, Posição, Nascimento, Altura, Pé.
function dialogoImportarPlantel() {
  const d = document.createElement('dialog'); d.className = 'dialogo dialogo-largo';
  d.innerHTML = `<div class="pilha">
    <div class="bloco-cab"><h2>Importar lista de jogadores</h2><button class="btn" data-fechar>Fechar</button></div>
    <p class="nota sem-margem">Um ficheiro Excel ou CSV com uma linha por jogador. Colunas reconhecidas: Nome, Número, Posição, Data de nascimento (ou Idade), Altura, Pé, Nome no Wyscout. Jogadores que já existem (mesmo nome) são atualizados.</p>
    <label class="zona-ficheiro"><input type="file" id="ip-ficheiro" accept=".xlsx,.xls,.csv"><span class="zona-titulo">Escolher ficheiro</span><span class="zona-sub">.xlsx, .xls ou .csv</span></label>
    <div id="ip-previa"></div>
  </div>`;
  document.body.appendChild(d); d.showModal();
  d.addEventListener('close', () => d.remove());
  d.addEventListener('click', e => { if (e.target.closest('[data-fechar]')) d.close(); });
  $('#ip-ficheiro', d).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const linhas = await lerFolha(await f.arrayBuffer());
      const lista = lerListaPlantel(linhas);
      if (!lista.length) throw new Error('Não encontrei uma coluna com o nome dos jogadores.');
      $('#ip-previa', d).innerHTML = `<p class="destaque">${lista.length} jogadores encontrados.</p>
        <div class="tabela-env"><table class="tabela compacta"><thead><tr><th>N.º</th><th>Nome</th><th>Posição</th><th>Nascimento</th><th class="num">Altura</th><th>Pé</th></tr></thead>
        <tbody>${lista.map(j => `<tr><td>${j.numero ?? '–'}</td><td>${esc(j.nome)}</td><td>${esc(j.posicao || '–')}</td><td>${j.data_nascimento ? fmtData(j.data_nascimento) : '–'}</td><td class="num">${j.altura ?? '–'}</td><td>${esc(j.pe || '–')}</td></tr>`).join('')}</tbody></table></div>
        <div class="acoes-esq"><button class="btn btn-prim" id="ip-importar">Importar ${lista.length} jogadores</button></div>`;
      $('#ip-importar', d).addEventListener('click', async ev => {
        ev.currentTarget.disabled = true;
        // Mantém o que já existe quando a lista não traz o valor.
        const ex = Object.fromEntries(App.d.plantel.map(p => [norm(p.nome), p]));
        const regs = lista.map(j => { const a = ex[norm(j.nome)] || {}; const r = { nome: a.nome || j.nome };
          for (const k of ['numero', 'posicao', 'data_nascimento', 'altura', 'pe', 'nome_wyscout', 'foto', 'notas']) r[k] = j[k] ?? a[k] ?? null; return r; });
        try { await App.db.upsert('jogadores', regs, 'nome'); d.close(); toast(`${regs.length} jogadores importados.`); await recarregar(); }
        catch (err) { toast(err.message, 'erro'); ev.currentTarget.disabled = false; }
      });
    } catch (err) { $('#ip-previa', d).innerHTML = `<p class="erro">${esc(err.message)}</p>`; }
  });
}

function lerListaPlantel(linhas) {
  const P = {
    nome: /^(nome|name|jogador|player)$/i, numero: /^(n\.?º?|n[uú]mero|number|#|nr\.?)$/i, posicao: /^(posi[cç][aã]o|position|pos\.?)$/i,
    nasc: /^(data de nascimento|nascimento|date of birth|birth ?date|dob|nasc\.?)/i, idade: /^(idade|age)$/i,
    altura: /^(altura|height)/i, pe: /^(p[eé]( preferido)?|foot|p[eé] dominante)$/i, wy: /wyscout/i
  };
  let ih = -1, cab = [];
  for (let i = 0; i < Math.min(10, linhas.length); i++) {
    const c = linhas[i].map(x => String(x).trim());
    if (c.some(x => P.nome.test(x))) { ih = i; cab = c; break; }
  }
  if (ih < 0) return [];
  const col = k => cab.findIndex(x => P[k].test(x));
  const C = Object.fromEntries(Object.keys(P).map(k => [k, col(k)]));
  const pe = v => { const s = norm(v); return /^(dir|right|r$|d$)/.test(s) ? 'Direito' : /^(esq|left|l$|e$)/.test(s) ? 'Esquerdo' : /^(amb|both)/.test(s) ? 'Ambos' : null; };
  return linhas.slice(ih + 1).map(l => {
    const nome = String(l[C.nome] ?? '').trim(); if (!nome) return null;
    let nasc = C.nasc >= 0 ? parseData(String(l[C.nasc]).replace(/\s*\(\d+\)\s*$/, '') || l[C.nasc]) : null;
    if (!nasc && C.nasc >= 0 && l[C.nasc] instanceof Date) nasc = parseData(l[C.nasc]);
    const alt = C.altura >= 0 ? parseNum(String(l[C.altura]).replace(/m$/i, '').trim()) : null;
    return {
      nome, numero: C.numero >= 0 ? (parseNum(l[C.numero]) ?? null) : null,
      posicao: C.posicao >= 0 ? (posicaoLonga(l[C.posicao]) || String(l[C.posicao]).trim() || null) : null,
      data_nascimento: nasc,
      altura: alt === null ? null : Math.round(alt < 3 ? alt * 100 : alt),
      pe: C.pe >= 0 ? pe(l[C.pe]) : null,
      nome_wyscout: C.wy >= 0 ? String(l[C.wy] ?? '').trim() || null : null
    };
  }).filter(Boolean);
}

// ---------- Importar do Transfermarkt ----------
// Usa o serviço /api/transfermarkt (pasta api/ do projeto na Vercel), que lê a página
// do jogador ou da equipa e devolve os dados. Só existe na app publicada, ligada ao Supabase.
const tmDisponivel = () => App.db.modo === 'supabase' && !App.semPlantel && ehDep();

async function tmChamar(url) {
  const ses = await App.db.sb.auth.getSession();
  const token = ses.data.session ? ses.data.session.access_token : '';
  let r, j = null;
  try { r = await fetch('/api/transfermarkt?url=' + encodeURIComponent(url), { headers: { Authorization: 'Bearer ' + token } }); }
  catch { throw new Error('Não consegui ligar ao importador. Verifique a ligação à internet.'); }
  try { j = await r.json(); } catch { /* resposta sem JSON */ }
  if (r.status === 404 && !j) throw new Error('O importador não está publicado. Confirme que a pasta api/ (com transfermarkt.py) foi enviada para o GitHub e a Vercel.');
  if (!r.ok || !j || !j.ok) throw new Error(j && j.erro ? j.erro : 'O importador não respondeu. Tente daqui a pouco.');
  return j;
}

function posicaoTm(raw) {
  const direta = posicaoLonga(raw); if (direta) return direta;
  const t = norm(raw);
  const regras = [['Guarda-redes', ['guarda redes', 'goalkeeper']], ['Lateral direito', ['lateral dir', 'defesa dir', 'right back']], ['Lateral esquerdo', ['lateral esq', 'defesa esq', 'left back']],
    ['Defesa central', ['defesa central', 'centre back', 'center back']], ['Médio defensivo', ['medio defensivo', 'defensive midfield']], ['Médio ofensivo', ['medio ofensivo', 'attacking midfield']],
    ['Extremo direito', ['extremo direito', 'right wing', 'medio direito', 'right midfield']], ['Extremo esquerdo', ['extremo esquerdo', 'left wing', 'medio esquerdo', 'left midfield']],
    ['Ponta de lanca', ['ponta de lanca', 'centre forward', 'center forward', 'segundo avancado', 'second striker']], ['Médio centro', ['medio centro', 'central midfield', 'medio']]];
  for (const [pos, chaves] of regras) if (chaves.some(c => t.includes(c))) return pos === 'Ponta de lanca' ? 'Ponta de lança' : pos;
  if (t.startsWith('defesa')) return 'Defesa central';
  if (t.startsWith('avanc')) return 'Ponta de lança';
  return null;
}
function peTm(raw) { const t = norm(raw); return /^(dir|right)/.test(t) ? 'Direito' : /^(esq|left)/.test(t) ? 'Esquerdo' : /^(amb|both)/.test(t) ? 'Ambos' : null; }

// Procura o jogador no plantel: primeiro pelo ID do Transfermarkt, depois pelo nome.
function tmExistente(j) {
  return App.d.plantel.find(p => p.tm_id && j.transfermarktId && p.tm_id === String(j.transfermarktId))
    || App.d.plantel.find(p => norm(p.nome) === norm(j.name)) || null;
}

async function tmGuardar(j) {
  const ex = tmExistente(j);
  const num = parseInt(j.shirtNumber, 10);
  const dados = {
    posicao: posicaoTm(j.position) ?? ex?.posicao ?? null,
    data_nascimento: /^\d{4}-\d{2}-\d{2}$/.test(j.birthDate || '') ? j.birthDate : ex?.data_nascimento ?? null,
    altura: j.heightCm >= 120 && j.heightCm <= 230 ? j.heightCm : ex?.altura ?? null,
    pe: peTm(j.foot) ?? ex?.pe ?? null,
    numero: num >= 0 && num <= 99 ? num : ex?.numero ?? null,
    nacionalidade: j.nationality || ex?.nacionalidade || null,
    tm_id: j.transfermarktId ? String(j.transfermarktId) : ex?.tm_id ?? null,
    tm_url: j.sourceUrl || ex?.tm_url || null
  };
  // A fotografia só entra se o jogador ainda não tiver uma.
  if (!ex?.foto && /^data:image\//.test(j.photo || '')) { try { dados.foto = await reduzirFoto(j.photo); } catch { /* sem foto */ } }
  if (ex) {
    const [r] = await App.db.atualizar('jogadores', { id: ex.id }, dados);
    Object.assign(ex, r || dados);
    return 'atualizado';
  }
  const novo = await App.db.inserir('jogadores', { nome: j.name, ...dados });
  App.d.plantel.push(novo); indexarPlantel();
  return 'novo';
}

// ---- Datas (sempre em 'YYYY-MM-DD', sem fusos horários) ----
const hojeLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const paraUTC = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const deUTC = t => new Date(t).toISOString().slice(0, 10);
const somarDias = (iso, n) => deUTC(paraUTC(iso) + n * 86400000);
const diasEntre = (a, b) => Math.round((paraUTC(b) - paraUTC(a)) / 86400000);
const diaSemana = iso => (new Date(paraUTC(iso)).getUTCDay() + 6) % 7; // 0 = segunda
const inicioSemana = iso => somarDias(iso, -diaSemana(iso));
const hhmm = h => (h ? String(h).slice(0, 5) : '');
const mdTexto = n => (n === 0 ? 'MD' : n > 0 ? `MD+${n}` : `MD${n}`);

function jogosComData() { return App.d.jogos.filter(j => j.data).sort((a, b) => a.data.localeCompare(b.data)); }

// Designação do dia em relação aos jogos: MD no dia do jogo, MD+1/MD+2 a seguir, MD-n antes do próximo.
function rotuloMD(iso, jogos) {
  let ant = null, prox = null;
  for (const j of jogos) { if (j.data <= iso) ant = j; if (j.data >= iso && !prox) prox = j; }
  if (prox && prox.data === iso) return 'MD';
  const n = prox ? diasEntre(iso, prox.data) : null, p = ant ? diasEntre(ant.data, iso) : null;
  if (p !== null && p <= 2 && (n === null || p < n)) return `MD+${p}`;
  if (n !== null && n <= 7) return `MD-${n}`;
  if (p !== null && p <= 3) return `MD+${p}`;
  return '';
}

// Filtro das tarefas (só para o departamento, quando há colaboradores): 'todas', 'dep' (sem colaborador) ou o id de um colaborador.

function filtroTarefas() {
  const q = App.cal.quem || 'todas';
  if (!ehDep() || !(App.colaboradores || []).length || q === 'todas') return () => true;
  return e => e.tipo !== 'tarefa' || (q === 'dep' ? !e.atribuido_a : e.atribuido_a === q);

function eventosDoDia(iso) {

  return (App.d.agenda || []).filter(e => e.data === iso && f(e))
    .sort((a, b) => (hhmm(a.hora_inicio) || '99').localeCompare(hhmm(b.hora_inicio) || '99') || a.titulo.localeCompare(b.titulo, 'pt'));
}

  $('#cal-hoje')?.addEventListener('click', () => { C.ref = hojeLocal(); desenharCalendario(); });
  $('#cal-novo')?.addEventListener('click', () => dialogoEvento(null, C.vista === 'semana' ? (inicioSemana(C.ref) <= hojeLocal() && hojeLocal() <= somarDias(inicioSemana(C.ref), 6) ? hojeLocal() : inicioSemana(C.ref)) : C.ref));
  $('#b-pdf')?.addEventListener('click', () => exportarPdf(`Microciclo ${inicioSemana(C.ref)}`, { paisagem: true }));
  if (C.vista === 'mes') desenharMes(); else if (C.vista === 'semana') desenharSemana(); else desenharModelo();
}
function mudarMes(iso, n) { const [y, m] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); return deUTC(t.getTime()); }

// ---- Mês ----
function desenharMes() {
  const C = App.cal; const [y, m] = C.ref.split('-').map(Number);
  const primeiro = `${y}-${String(m).padStart(2, '0')}-01`;
  const inicio = inicioSemana(primeiro); const hoje = hojeLocal(); const jogos = jogosComData();
  const semanas = [];
  for (let s = inicio; ; s = somarDias(s, 7)) {
    semanas.push(s);
    if (Number(somarDias(s, 7).slice(5, 7)) !== m) break;
  }
  const porDia = {}; for (const j of jogos) (porDia[j.data] ||= []).push(j);
  $('#cal-corpo').innerHTML = `
    <div class="cal-mes" role="grid" aria-label="Mês">
      <div class="cal-mes-cab" role="row">${DIAS_SEMANA.map(d => `<span role="columnheader">${d}</span>`).join('')}</div>
      ${semanas.map(s => `<div class="cal-mes-semana" role="row">${[0, 1, 2, 3, 4, 5, 6].map(i => {
        const d = somarDias(s, i); const evs = eventosDoDia(d); const js = porDia[d] || []; const md = rotuloMD(d, jogos);
        return `<button class="cal-dia ${Number(d.slice(5, 7)) !== m ? 'fora' : ''} ${d === hoje ? 'hoje' : ''} ${js.length ? 'com-jogo' : ''}" data-dia="${d}" role="gridcell" aria-label="${fmtData(d)}: ${js.length ? 'jogo, ' : ''}${evs.length} eventos">
          <span class="cal-dia-cab"><b>${Number(d.slice(8))}</b>${md ? `<small>${md}</small>` : ''}</span>
          ${js.map(j => cartaoJogo(j, true)).join('')}
          ${evs.slice(0, 3).map(e => `<span class="cal-mini tipo-${e.tipo} ${e.estado === 'feito' ? 'feito' : ''}">${hhmm(e.hora_inicio) ? `<i>${hhmm(e.hora_inicio)}</i> ` : ''}${esc(e.titulo)}</span>`).join('')}
          ${evs.length > 3 ? `<span class="cal-mais">+${evs.length - 3}</span>` : ''}
        </button>`;
      }).join('')}</div>`).join('')}
    </div>
    ${legendaAgenda()}
    ${ehDep() && !App.semAgenda ? botaoProximosJogos() : ''}`;
  $$('[data-dia]').forEach(b => b.addEventListener('click', () => { C.ref = b.dataset.dia; C.vista = 'semana'; desenharCalendario(); }));
  ligarProximosJogos();
}
function legendaAgenda() {
  return `<div class="legenda-campo cal-legenda">${Object.entries(TIPOS_AGENDA).map(([k, t]) => `<span><i class="cal-ponto tipo-${k}"></i>${t}</span>`).join('')}<span><i class="cal-ponto tipo-jogo"></i>Jogo</span></div>`;
}

// ---- Semana (microciclo) ----
function desenharSemana() {
  const C = App.cal; const s = inicioSemana(C.ref); const hoje = hojeLocal(); const jogos = jogosComData();
  const dias = [0, 1, 2, 3, 4, 5, 6].map(i => somarDias(s, i));
  const jogosSemana = jogos.filter(j => j.data >= s && j.data <= dias[6]);
  // Jogos desta semana, ou o próximo (até 7 dias depois), que ainda não têm microciclo.
  const proximo = jogos.find(j => j.data > dias[6] && diasEntre(dias[6], j.data) <= 7);
  const semMicro = [...jogosSemana, ...(proximo ? [proximo] : [])].filter(j => !(App.d.agenda || []).some(e => e.jogo_id === j.id));
  const tarefas = dias.flatMap(eventosDoDia).filter(e => e.tipo === 'tarefa');
  const ed = pode() && !App.semAgenda;
  $('#cal-corpo').innerHTML = `
    ${ehColab() ? '<p class="nota so-ecra">Aqui aparecem só as suas tarefas e os jogos.</p>' : ''}
    ${ed && ehDep() && semMicro.length ? `<div class="aviso-suave so-ecra">${semMicro.map(j => `<p><b>${esc(j.adversario)}</b> (${fmtData(j.data)}) ainda não tem microciclo.</p><button class="btn btn-prim" data-aplicar="${j.id}">Criar a partir do modelo</button>`).join('</div><div class="aviso-suave so-ecra">')}</div>` : ''}
    <div class="cal-semana">
      ${dias.map(d => {
        const md = rotuloMD(d, jogos); const js = jogos.filter(j => j.data === d);
        return `<section class="cal-col ${d === hoje ? 'hoje' : ''} ${js.length ? 'com-jogo' : ''}" aria-label="${fmtData(d)}">
          <header><span>${DIAS_SEMANA[diaSemana(d)]} <b>${Number(d.slice(8))}</b></span>${md ? `<span class="cal-md">${md}</span>` : ''}</header>
          ${js.map(j => cartaoJogo(j)).join('')}
          ${eventosDoDia(d).map(cartaoEvento).join('')}
          ${ed ? `<button class="cal-adicionar so-ecra" data-novo="${d}" aria-label="Adicionar evento a ${fmtData(d)}">+ Adicionar</button>` : ''}
        </section>`;
      }).join('')}
    </div>
    ${legendaAgenda()}
    ${tarefas.length ? `<section class="bloco cal-tarefas"><h2>Tarefas da semana</h2>
      <div class="tabela-env"><table class="tabela compacta"><thead><tr><th>Dia</th><th>Tarefa</th><th>Responsável</th><th>Estado</th></tr></thead>
      <tbody>${tarefas.map(e => `<tr><td>${DIAS_SEMANA[diaSemana(e.data)]} ${Number(e.data.slice(8))}${e.md != null ? ` <span class="fraco">${mdTexto(e.md)}</span>` : ''}</td><td>${esc(e.titulo)}</td><td>${esc(nomeResponsavel(e))}</td>
        <td>${chipEstado(e)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
  $$('[data-novo]').forEach(b => b.addEventListener('click', () => dialogoEvento(null, b.dataset.novo)));
  $$('[data-evento]').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-estado]')) return; dialogoEvento((App.d.agenda || []).find(x => x.id === b.dataset.evento)); }));
  $$('[data-estado]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); mudarEstado(b.dataset.estado); }));
  $$('[data-aplicar]').forEach(b => b.addEventListener('click', () => aplicarModelo([App.idx.jogo[b.dataset.aplicar]], b)));
}
function chipEstado(e) {
  const est = e.estado || 'por_fazer';
  return pode() && !App.semAgenda
    ? `<button class="estado estado-${est}" data-estado="${e.id}" title="Mudar estado">${ESTADOS[est]}</button>`
    : `<span class="estado estado-${est}">${ESTADOS[est]}</span>`;
}
function cartaoEvento(e) {
  const horas = [hhmm(e.hora_inicio), hhmm(e.hora_fim)].filter(Boolean).join('–');
  return `<div class="cal-evento tipo-${e.tipo} ${e.estado === 'feito' ? 'feito' : ''}" data-evento="${e.id}" role="button" tabindex="0">
    <span class="cal-ev-cab"><span class="cal-ev-tipo">${TIPOS_AGENDA[e.tipo] || ''}</span>${horas ? `<span class="cal-ev-hora">${horas}</span>` : ''}</span>
    <b>${esc(e.titulo)}</b>
    ${e.local || nomeResponsavel(e, '') ? `<small>${esc([e.local, nomeResponsavel(e, '')].filter(Boolean).join(' · '))}</small>` : ''}
    ${e.tipo === 'tarefa' || e.tipo === 'reuniao' || e.estado === 'feito' ? chipEstado(e) : ''}
  </div>`;
}
async function mudarEstado(id) {
  const e = App.d.agenda.find(x => x.id === id); if (!e) return;
  const ordem = ['por_fazer', 'em_curso', 'feito'];
  const novo = ordem[(ordem.indexOf(e.estado || 'por_fazer') + 1) % ordem.length];
  try { await App.db.atualizar('agenda', { id }, { estado: novo }); e.estado = novo; desenharSemana(); }
  catch (err) { toast(err.message, 'erro'); }
}
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-evento]')) { e.preventDefault(); e.target.click(); }
});

// ---- Formulário de evento ----
function dialogoEvento(ev, dataInicial) {
  const ed = pode() && !App.semAgenda; const colab = ehColab();
  const colabs = App.colaboradores || [];
  const responsaveis = [...new Set(['Departamento', 'Equipa técnica', ...(App.d.agenda || []).map(e => e.responsavel).filter(Boolean)])];
  const jogos = jogosComData().slice().reverse();
  const d = document.createElement('dialog'); d.className = 'dialogo';
  const dis = ed ? '' : 'disabled';
  d.innerHTML = `<form class="pilha" method="dialog">
    <h2>${ev ? (ed ? (colab ? 'Editar tarefa' : 'Editar evento') : esc(ev.titulo)) : (colab ? 'Nova tarefa' : 'Novo evento')}</h2>
    <div class="grelha-2">
      <label>Tipo<select name="tipo" ${dis}>${Object.entries(TIPOS_AGENDA).filter(([k]) => !colab || k === 'tarefa').map(([k, t]) => `<option value="${k}" ${(ev?.tipo || (colab ? 'tarefa' : 'treino')) === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Data<input name="data" type="date" required value="${esc(ev?.data || dataInicial || hojeLocal())}" ${dis}></label>
    </div>
    <label>Título<input name="titulo" required value="${esc(ev?.titulo || '')}" placeholder="Ex.: Treino: organização defensiva" ${dis}></label>
    <div class="grelha-2">
      <label>Início<input name="hora_inicio" type="time" value="${hhmm(ev?.hora_inicio)}" ${dis}></label>
      <label>Fim<input name="hora_fim" type="time" value="${hhmm(ev?.hora_fim)}" ${dis}></label>
      <label>Local<input name="local" value="${esc(ev?.local || '')}" ${dis}></label>
      ${colab ? '' : `<label>Responsável<input name="responsavel" list="ev-resp" value="${esc(ev?.responsavel || '')}" ${dis}><datalist id="ev-resp">${responsaveis.map(r => `<option value="${esc(r)}">`).join('')}</datalist></label>`}
      ${!colab && colabs.length ? `<label class="so-tarefa">Atribuir a colaborador<select name="atribuido_a" ${dis}><option value="">Ninguém (só o departamento)</option>${colabs.map(p => `<option value="${p.id}" ${ev?.atribuido_a === p.id ? 'selected' : ''}>${esc(p.nome || p.email)}</option>`).join('')}</select></label>` : ''}
      <label>Estado<select name="estado" ${dis}>${Object.entries(ESTADOS).map(([k, t]) => `<option value="${k}" ${(ev?.estado || 'por_fazer') === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Microciclo do jogo<select name="jogo_id" ${dis}><option value="">–</option>${jogos.map(j => `<option value="${j.id}" ${ev?.jogo_id === j.id ? 'selected' : ''}>${esc(rotuloJogo(j))}</option>`).join('')}</select></label>
    </div>
    <label>Descrição<textarea name="descricao" rows="3" ${dis}>${esc(ev?.descricao || '')}</textarea></label>
    <div class="acoes">
      ${ev && ed && podeApagar() ? '<button type="button" class="btn-link perigo apagar-esq" id="ev-apagar">Apagar</button>' : ''}
      <button class="btn" value="cancelar" formnovalidate>${ed ? 'Cancelar' : 'Fechar'}</button>
      ${ed ? `<button class="btn btn-prim" value="guardar">${ev ? 'Guardar alterações' : colab ? 'Criar tarefa' : 'Criar evento'}</button>` : ''}
    </div>
  </form>`;
  document.body.appendChild(d); d.showModal();
  d.addEventListener('close', () => d.remove());
  const tipo = d.querySelector('[name=tipo]');
  const mostrarEstado = () => { $$('.so-tarefa', d).forEach(el => { el.hidden = tipo.value !== 'tarefa'; }); };
  tipo.addEventListener('change', mostrarEstado); mostrarEstado();
  $('#ev-apagar', d)?.addEventListener('click', async () => {
    d.close();
    if (await confirmar(`Apagar "${ev.titulo}" (${fmtData(ev.data)})?`)) {
      try { await App.db.apagar('agenda', { id: ev.id }); App.d.agenda = App.d.agenda.filter(x => x.id !== ev.id); toast('Evento apagado.'); desenharCalendario(); }
      catch (err) { toast(err.message, 'erro'); }
    }
  });
  d.querySelector('form').addEventListener('submit', async e => {
    if (e.submitter?.value !== 'guardar') return;
    e.preventDefault();
    const f = new FormData(e.target); const val = k => (String(f.get(k) ?? '').trim() || null);
    const jogo = val('jogo_id') ? App.idx.jogo[val('jogo_id')] : null;
    const reg = {
      tipo: val('tipo'), titulo: val('titulo'), data: val('data'), hora_inicio: val('hora_inicio'), hora_fim: val('hora_fim'),
      local: val('local'), responsavel: colab ? (App.perfil.nome || App.perfil.email || null) : val('responsavel'), estado: val('estado') || 'por_fazer',
      descricao: val('descricao'), jogo_id: jogo ? jogo.id : null, md: jogo?.data ? diasEntre(jogo.data, val('data')) : null
    };
    // O colaborador só cria tarefas, sempre atribuídas a si; o departamento escolhe a quem atribuir.
    if (colab) { reg.tipo = 'tarefa'; reg.estado = reg.estado || 'por_fazer'; reg.atribuido_a = App.perfil.id; }
    else if (colabs.length) reg.atribuido_a = reg.tipo === 'tarefa' ? val('atribuido_a') : null;
    if (reg.hora_inicio && reg.hora_fim && reg.hora_fim < reg.hora_inicio) { toast('A hora de fim é anterior à de início.', 'erro'); return; }
    try {
      if (ev) { const [r] = await App.db.atualizar('agenda', { id: ev.id }, reg); Object.assign(ev, r || reg); }
      else App.d.agenda.push(await App.db.inserir('agenda', reg));
      d.close(); toast(ev ? 'Evento atualizado.' : 'Evento criado.');
      App.cal.ref = reg.data; desenharCalendario();
    } catch (err) { toast(err.message, 'erro'); }
  });
}

// ---- Modelo de microciclo ----
async function aplicarModelo(jogos, botao) {
  const modelo = modeloMicrociclo();
  const linhas = jogos.flatMap(j => modelo.map(it => ({
    tipo: it.tipo, titulo: it.titulo, data: somarDias(j.data, Number(it.md)), hora_inicio: it.hora_inicio || null, hora_fim: it.hora_fim || null,
    local: it.local || null, responsavel: it.responsavel || null, estado: it.tipo === 'tarefa' ? 'por_fazer' : null,
    descricao: it.descricao || null, jogo_id: j.id, md: Number(it.md)
  })));
  if (!linhas.length) { toast('O modelo de microciclo está vazio.', 'erro'); return; }
  if (botao) botao.disabled = true;
  try {
    const novos = await App.db.inserirVarios('agenda', linhas);
    App.d.agenda.push(...novos);
    toast(jogos.length === 1 ? `Microciclo de ${jogos[0].adversario} criado (${novos.length} eventos).` : `Microciclos de ${jogos.length} jogos criados (${novos.length} eventos).`);
    desenharCalendario();
  } catch (err) { if (botao) botao.disabled = false; toast(err.message, 'erro'); }
}
function proximosSemMicro() {
  const hoje = hojeLocal();
  return jogosComData().filter(j => j.data >= hoje && !(App.d.agenda || []).some(e => e.jogo_id === j.id));
}
function botaoProximosJogos() {
  const lista = proximosSemMicro();
  return lista.length ? `<div class="aviso-suave so-ecra"><p>${lista.length === 1 ? '1 próximo jogo ainda não tem' : `${lista.length} próximos jogos ainda não têm`} microciclo: ${esc(lista.slice(0, 4).map(j => `${j.adversario} (${fmtData(j.data, true)})`).join(', '))}${lista.length > 4 ? '…' : ''}</p><button class="btn btn-prim" id="cal-aplicar-todos">Criar a partir do modelo</button></div>` : '';
}
function ligarProximosJogos() {
  $('#cal-aplicar-todos')?.addEventListener('click', e => aplicarModelo(proximosSemMicro(), e.currentTarget));
}

function desenharModelo() {
  const ed = pode() && !App.semAgenda; const dis = ed ? '' : 'disabled';
  const ordenar = ls => ls.sort((a, b) => (a.md < 0) - (b.md < 0) || a.md - b.md || (a.hora_inicio || '99').localeCompare(b.hora_inicio || '99'));
  // Ordenado por dia ao abrir e ao guardar; durante a edição, as linhas novas ficam no fim.
  let linhas = ordenar(modeloMicrociclo().map(x => ({ ...x })));
  const opcoesMD = [-6, -5, -4, -3, -2, -1, 1, 2];
  const desenhar = () => {
    $('#cal-corpo').innerHTML = `
      <section class="bloco">
        <p class="nota">A semana-tipo que a app usa para criar o microciclo de cada jogo. MD é o dia do jogo; MD-3 é três dias antes; MD+1 é o dia a seguir. Depois de criado, cada microciclo pode ser ajustado no calendário sem alterar o modelo.</p>
        <div class="tabela-env"><table class="tabela compacta modelo-tabela">
          <thead><tr><th>Dia</th><th>Tipo</th><th>Título</th><th>Início</th><th>Fim</th><th>Responsável</th>${ed ? '<th><span class="sr">Remover</span></th>' : ''}</tr></thead>
          <tbody>${linhas.map((l, i) => `<tr data-i="${i}">
            <td><select data-c="md" ${dis} aria-label="Dia">${opcoesMD.map(n => `<option value="${n}" ${Number(l.md) === n ? 'selected' : ''}>${mdTexto(n)}</option>`).join('')}</select></td>
            <td><select data-c="tipo" ${dis} aria-label="Tipo">${Object.entries(TIPOS_AGENDA).map(([k, t]) => `<option value="${k}" ${l.tipo === k ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
            <td><input data-c="titulo" value="${esc(l.titulo || '')}" ${dis} aria-label="Título"></td>
            <td><input data-c="hora_inicio" type="time" value="${hhmm(l.hora_inicio)}" ${dis} aria-label="Início"></td>
            <td><input data-c="hora_fim" type="time" value="${hhmm(l.hora_fim)}" ${dis} aria-label="Fim"></td>
            <td><input data-c="responsavel" list="ev-resp-m" value="${esc(l.responsavel || '')}" ${dis} aria-label="Responsável"></td>
            ${ed ? `<td><button class="btn-link perigo" data-remover="${i}">Remover</button></td>` : ''}
          </tr>`).join('')}</tbody>
        </table></div>
        <datalist id="ev-resp-m"><option value="Departamento"><option value="Equipa técnica"></datalist>
        ${ed ? `<div class="acoes-esq"><button class="btn" id="m-adicionar">Adicionar linha</button><button class="btn btn-prim" id="m-guardar">Guardar modelo</button><button class="btn-link" id="m-repor">Repor modelo base</button></div>` : ''}
      </section>
      ${ed ? botaoProximosJogos() : ''}`;
    $$('[data-c]').forEach(c => c.addEventListener('change', () => {
      const i = Number(c.closest('tr').dataset.i); linhas[i][c.dataset.c] = c.dataset.c === 'md' ? Number(c.value) : c.value;
    }));
    $$('[data-remover]').forEach(b => b.addEventListener('click', () => { linhas.splice(Number(b.dataset.remover), 1); desenhar(); }));
    $('#m-adicionar')?.addEventListener('click', () => { linhas.push({ md: -1, tipo: 'treino', titulo: '', hora_inicio: '', hora_fim: '', responsavel: '' }); desenhar(); $$('.modelo-tabela input[data-c=titulo]').pop()?.focus(); });
    $('#m-repor')?.addEventListener('click', () => { linhas = ordenar(MODELO_PADRAO.map(x => ({ ...x }))); desenhar(); toast('Modelo base reposto. Clique em "Guardar modelo" para o manter.'); });
    $('#m-guardar')?.addEventListener('click', async () => {
      const limpo = linhas.filter(l => String(l.titulo || '').trim()).map(l => ({ md: Number(l.md), tipo: l.tipo, titulo: l.titulo.trim(), hora_inicio: hhmm(l.hora_inicio) || null, hora_fim: hhmm(l.hora_fim) || null, responsavel: (l.responsavel || '').trim() || null }));
      try {
        await App.db.upsert('configuracao', [{ id: 1, modelo_microciclo: limpo, updated_at: new Date().toISOString() }], 'id');
        App.cfg.modelo_microciclo = limpo; linhas = ordenar(limpo.map(x => ({ ...x }))); toast('Modelo de microciclo guardado.'); desenhar();
      } catch (err) { toast(/modelo_microciclo/.test(err.message) ? 'Falta atualizar a base de dados. Corra outra vez o schema.sql no Supabase.' : err.message, 'erro'); }
    });
    ligarProximosJogos();
  };
  desenhar();
}

// ---------- Visão geral ----------
function jogosOrdenados() { return App.d.jogos.slice().sort(compararJogos); }
const jogoDisputado = j => Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos);

  v.innerHTML = `

    <div class="visao-grelha">
      <section class="bloco visao-proximo">${cartaoProximo(proximo, hoje)}</section>
      <section class="bloco visao-epoca">${cartaoEpoca(disputados, ultimo)}</section>
      <section class="bloco visao-semana">${cartaoSemana(hoje, proximo)}</section>
      ${pode() ? `<section class="bloco visao-dep">${cartaoDepartamento()}</section>` : ''}
    </div>`}`;
  $$('[data-ver-adversario]', v).forEach(b => b.addEventListener('click', () => {

const DIAS_SEMANA_LONGOS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];

// Posição e forma de uma equipa no campeonato (ficheiro da liga).
function situacaoNaLiga(nome, competicao) {
  if (!competicao || !App.d.liga?.length) return null;
  const t = classificacao(competicao); const i = t.findIndex(x => mesmaEquipa(x.equipa, nome) || norm(x.equipa) === norm(nome));
  if (i < 0) return null;
  const forma = App.d.liga.filter(r => norm(r.competicao) === norm(competicao) && (mesmaEquipa(r.equipa, nome) || norm(r.equipa) === norm(nome)) && Number.isFinite(r.golos))
    .sort((a, b) => a.jornada - b.jornada).slice(-5).map(r => (r.golos > r.golos_sofridos ? 'V' : r.golos < r.golos_sofridos ? 'D' : 'E'));

}

// ---------- Análise de oportunidades (todas as equipas do campeonato) ----------
App.ana = { equipa: null, persp: 'criadas', adversario: 'todos', local: 'todos', periodo: 'todos', golos: false, momento: 'todos', mapa: 'zonas' };

function equipasCodificaveis() {
  const s = new Map();
  for (const a of App.idx.alvos || []) for (const n of [a.casa, a.fora]) if (!s.has(norm(n))) s.set(norm(n), n);
  return [...s.values()].sort((a, b) => a.localeCompare(b, 'pt'));
}
const ladoDaEquipa = (a, eq) => (mesmaEquipa(a.casa, eq) || norm(a.casa) === norm(eq) ? 'casa' : mesmaEquipa(a.fora, eq) || norm(a.fora) === norm(eq) ? 'fora' : null);

// Jogos codificados da equipa (com pelo menos uma oportunidade), já filtrados.
function jogosDaEquipa(eq, f) {
  let js = (App.idx.alvos || []).filter(a => ladoDaEquipa(a, eq) && (App.idx.eventosAlvo[a.key] || []).length);
  if (f.local !== 'todos') js = js.filter(a => ladoDaEquipa(a, eq) === f.local);
  if (f.adversario !== 'todos') js = js.filter(a => mesmaEquipa(a[ladoDaEquipa(a, eq) === 'casa' ? 'fora' : 'casa'], f.adversario));
  js.sort((a, b) => (a.jornada ?? 999) - (b.jornada ?? 999) || String(a.data || '').localeCompare(String(b.data || '')));
  if (f.periodo !== 'todos') js = js.slice(-Number(f.periodo));
  return js;
}
function oportunidadesDe(eq, f, jogos) {
  const out = [];
  for (const a of jogos) {
    const meu = ladoDaEquipa(a, eq);
    for (const e of App.idx.eventosAlvo[a.key] || []) {
      const l = ladoNoAlvo(e, a);
      if ((f.persp === 'criadas') !== (l === meu)) continue;
      const o = dadosOportunidade(e);
      if (f.golos && !o.golo) continue;
      if (f.momento !== 'todos' && o.momento !== f.momento) continue;
      out.push({ e, o, a, cor: f.persp === 'criadas' ? 'nos' : 'adversario' });
    }
  }
  return out;
}

function barras(titulo, entradas, total, { max = 10, vazio = 'Sem dados' } = {}) {
  const lista = entradas.filter(([k]) => k).sort((a, b) => b[1] - a[1]);
  const mostrar = lista.slice(0, max); const resto = lista.slice(max).reduce((s, [, n]) => s + n, 0);
  const topo = Math.max(1, ...mostrar.map(([, n]) => n));
  return `<div class="ana-barras"><h3>${titulo}</h3>${mostrar.length ? `<ul>${mostrar.map(([k, n]) => `<li><span class="ana-rot" title="${esc(k)}">${esc(k)}</span><span class="ana-pista"><i style="width:${n / topo * 100}%"></i></span><span class="ana-val">${n}<small>${total ? ` · ${fmtNum(n / total * 100, 0)}%` : ''}</small></span></li>`).join('')}</ul>${resto ? `<p class="nota">E mais ${resto} noutras categorias.</p>` : ''}` : `<p class="fraco">${vazio}</p>`}</div>`;
}
const contarPor = (lista, fn) => { const c = new Map(); for (const x of lista) { const k = fn(x); if (k) c.set(k, (c.get(k) || 0) + 1); } return [...c.entries()]; };

// Meio-campo ofensivo na vertical (baliza em cima), com as zonas do método do departamento.
// pontos: {x, y} (coordenadas) ou {z, g} (zona já calculada e se foi golo). opcoes.dim torna as zonas clicáveis (filtros da página).
function mapaZonas(tipo, pontos, opcoes = {}) {
  const conta = Array(14).fill(0), golos = Array(14).fill(0);
  for (const p of pontos) { const z = p.z ?? (tipo === 'passe' ? zonaPasse(p.x, p.y) : zonaFinalizacao(p.x, p.y)); if (z) { conta[z]++; if (p.g) golos[z]++; } }
  const max = Math.max(1, ...conta.slice(1, 13));
  const alfa = n => (n ? 0.12 + 0.68 * n / max : 0);
  const { dim, sel, dica } = opcoes;
  const attrs = z => dim ? ` role="button" tabindex="0" data-dim="${dim}" data-val="${z}" data-tip="${esc(dica ? dica(z, conta[z], golos[z]) : `Zona ${z}: ${conta[z]}`)}"` : '';
  const cls = z => `zona${dim ? ' clicavel' : ''}${sel != null ? (Number(sel) === z ? ' on' : ' esb') : ''}`;
  const W = 68, rect = (x, y, w, h, z) => `<g class="${cls(z)}"${attrs(z)}><rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill-opacity:${alfa(conta[z])}"/><text x="${x + w / 2}" y="${y + h / 2}" class="${alfa(conta[z]) > 0.5 ? 'claro' : ''}">${conta[z]}</text>${dim ? '' : `<title>Zona ${z}: ${conta[z]}</title>`}</g>`;
  const linhas = `<g class="linhas-v"><rect x="0" y="0" width="${W}" height="${tipo === 'passe' ? 52.5 : 30}"/><rect x="${M.areaY0}" y="0" width="${M.areaY1 - M.areaY0}" height="16.5"/><rect x="${M.peqY0}" y="0" width="${M.peqY1 - M.peqY0}" height="5.5"/><rect x="${W / 2 - 3.66}" y="-1.6" width="7.32" height="1.6"/><path d="M${W / 2 - 7.3} 16.5 A9.15 9.15 0 0 0 ${W / 2 + 7.3} 16.5"/>${tipo === 'passe' ? `<path d="M${W / 2 - 9.15} 52.5 A9.15 9.15 0 0 1 ${W / 2 + 9.15} 52.5"/>` : ''}</g>`;
  let zonas = '';
  if (tipo === 'passe') {
    FAIXAS_PASSE.forEach(([d0, d1], r) => CORR_PASSE.forEach(([y0, y1], c) => { zonas += rect(y0, d0, y1 - y0, d1 - d0, r * 3 + c + 1); }));
    return `<svg class="mapa-zonas" viewBox="-2 -3 72 61" role="img" aria-label="Zonas do passe">${zonas}${linhas}</svg><p class="mapa-fora${dim ? ' clicavel' : ''}${sel != null ? (Number(sel) === 13 ? ' on' : ' esb') : ''}"${attrs(13)}>Meio-campo defensivo (zona 13): <b>${conta[13]}</b></p>`;
  }
  FAIXAS_FIN.forEach(([d0, d1], r) => COLS_FIN.forEach(([y0, y1], c) => { zonas += rect(y0, d0, y1 - y0, d1 - d0, r * 4 + c + 1); }));
  return `<svg class="mapa-zonas" viewBox="-2 -3 72 35" role="img" aria-label="Zonas de finalização">${zonas}${linhas}<g class="${dim ? 'clicavel' : ''}${sel != null ? (Number(sel) === 13 ? ' on' : ' esb') : ''}"${attrs(13)}><text x="${W / 2}" y="24.5" class="fora-area">Fora da área (zona 13): ${conta[13]}</text></g></svg>`;
}

// ---- Página interativa: clicar numa barra, coluna ou zona filtra todos os gráficos (e mostra os lances) ----
const DIM_OP = {
  momento: { rot: 'Momento', fn: x => x.o.momento },
  sub: { rot: 'Sub-momento', fn: x => x.o.sub },
  mecanismo: { rot: 'Mecanismo', fn: x => x.o.mecanismo },

  zfin: { rot: 'Zona de finalização', fn: (x, esp) => x.e.zona_x != null ? zonaFinalizacao(x.e.zona_x, esp ? 100 - x.e.zona_y : x.e.zona_y) : null },
  jogador: { rot: 'Finalizador', fn: x => x.e.jogador },

};
App.ana.sel = App.ana.sel || {};

function desenharPaginaOportunidades() {
  const v = $('#vista'); const F = App.ana; F.sel = F.sel || {};
  const equipas = equipasCodificaveis();
  if (!equipas.length || !App.d.eventos.length) {
    v.innerHTML = `<div class="cabecalho-vista"><h1>Oportunidades</h1></div><div class="vazio"><p>Ainda não há oportunidades codificadas.</p>${pode() ? '<p>Codifique jogos em <a href="#codificacao">Codificação</a> ou importe a folha de oportunidades em <a href="#importacao">Importação</a>.</p>' : ''}</div>`;
    return;
  }
  if (!F.equipa || !equipas.includes(F.equipa)) F.equipa = equipas.find(e => eNossaEquipa(e)) || equipas.find(e => norm(e) === norm(nomeNosso())) || equipas[0];
  const fBase = { ...F, momento: 'todos' };
  const jogos = jogosDaEquipa(F.equipa, fBase);
  const esp = F.persp === 'sofridas';
  const base = oportunidadesDe(F.equipa, { ...fBase, golos: F.golos }, jogos);
  const valor = (x, d) => DIM_OP[d].fn(x, esp);
  const sel = F.sel;
  const filtra = (l, menos) => l.filter(x => Object.entries(sel).every(([d, val]) => d === menos || String(valor(x, d)) === String(val)));
  const ops = filtra(base);
  const adversarios = [...new Set((App.idx.alvos || []).filter(a => ladoDaEquipa(a, F.equipa)).map(a => a[ladoDaEquipa(a, F.equipa) === 'casa' ? 'fora' : 'casa']))].sort((a, b) => a.localeCompare(b, 'pt'));
  const g = l => l.filter(x => x.o.golo).length;
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
  const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const coisa = F.golos ? ['golo', 'golos'] : ['oportunidade', 'oportunidades'];
  const nomeJogo = a => { const adv = a[ladoDaEquipa(a, F.equipa) === 'casa' ? 'fora' : 'casa']; return `${a.jornada != null ? `J${a.jornada} · ` : a.data ? fmtData(a.data, true) + ' · ' : ''}${adv} (${ladoDaEquipa(a, F.equipa) === 'casa' ? 'C' : 'F'})`; };
  const rotVal = (d, val) => d === 'jogo' ? nomeJogo(jogos.find(a => a.key === val) || {}) : d === 'zpasse' || d === 'zfin' ? `Zona ${val}` : val;
  const dica = (k, l, n) => `${k}: ${pl(l.length, ...coisa)}${n ? ` (${pct(l.length, n)})` : ''}${F.golos ? '' : ` · ${pl(g(l), 'golo', 'golos')}${l.length ? ` (${pct(g(l), l.length)} de conversão)` : ''}`}`;

  };
  const tempoI = () => {

  const top = fn => { const c = contarPor(ops, fn).sort((a, b) => b[1] - a[1]); return c[0] || null; };

      <label>Adversário<select id="a-adv"><option value="todos">Todos</option>${adversarios.map(e => `<option ${e === F.adversario ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></label>

      <label>Período<select id="a-periodo"><option value="todos">Todos os jogos</option>${[3, 5, 10].map(n => `<option value="${n}" ${String(F.periodo) === String(n) ? 'selected' : ''}>Últimos ${n} jogos</option>`).join('')}</select></label>

    </section>
    ${rc ? `<section class="bloco ana-concl ${esp ? 'sofridas' : 'criadas'}"><h2>${Object.keys(sel).length ? 'O que sobressai neste recorte' : 'O que sobressai'}</h2>
      <p class="nota sem-margem">${Object.keys(sel).length ? 'Comparado com as outras equipas no mesmo recorte.' : `Os maiores desvios de ${esc(F.equipa)} em relação às outras equipas codificadas.`} Mudam conforme os filtros e os cliques.</p>
      ${rc.contexto.length ? `<p class="ana-concl-ctx">${rc.contexto.map(esc).join('<br>')}</p>` : ''}
      ${rc.itens.length ? `<ol>${rc.itens.map(([t, d]) => `<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join('')}</ol>` : ''}
      ${rc.aviso ? `<p class="fraco">${esc(rc.aviso)}</p>` : ''}</section>` : ''}
    <section class="bloco">
      <div class="ana-grelha tres">
        ${barrasI('momento', 'Momento', { fixo: MOMENTOS_REL.map(([m]) => m) })}
        ${barrasI('sub', 'Sub-momento')}
        ${barrasI('mecanismo', 'Mecanismo')}
      </div>
    </section>
    <section class="bloco">
      <div class="ana-grelha tres">
        ${barrasI('lado', esp ? 'Lado (a defender)' : 'Lado', { fixo: CORREDORES })}
        ${barrasI('parte', 'Parte', { fixo: ['1.ª parte', '2.ª parte', 'Prolongamento'] })}
        ${tempoI()}
      </div>
    </section>
    <section class="bloco">
      <div class="bloco-cab"><h2>Onde</h2></div>
      <div class="ana-mapas">
        <figure><figcaption>Zona do passe</figcaption>${mapaI('passe')}</figure>
        <figure><figcaption>Zona de finalização</figcaption>${mapaI('fin')}</figure>
      </div><p class="nota">${esp ? 'Lados da equipa a defender: à esquerda do desenho fica o lado esquerdo da equipa.' : 'A atacar para cima; o lado esquerdo do desenho é o lado esquerdo de quem ataca.'} Clique numa zona para filtrar.</p>
    </section>

      </div>

    <section class="bloco">

    </section>
    <section class="bloco so-ecra">
      <div class="ana-lances"><h3>${Object.keys(sel).length ? `Os ${pl(ops.length, ...coisa)} com estes filtros` : `Todas as ${coisa[1]}`}</h3>
        <div class="tabela-env ana-lances-tab"><table class="tabela compacta"><thead><tr><th>Jogo</th><th>Tempo</th><th>Momento</th><th>Mecanismo</th><th>Finalizador</th><th>Passe</th><th></th></tr></thead><tbody>
        ${ops.slice(0, 200).map(x => `<tr><td>${esc(nomeJogo(x.a))}</td><td>${esc(x.o.tempo || '')}</td><td>${esc(x.o.sub || x.o.momento || '')}</td><td>${esc(x.o.mecanismo || '')}</td><td>${esc(x.e.jogador || '')}</td><td>${esc(x.e.assistente || '')}</td><td>${x.o.golo ? '<b class="ana-golo">Golo</b>' : ''}</td></tr>`).join('')}
        </tbody></table></div>${ops.length > 200 ? `<p class="nota">Mostram-se as primeiras 200.</p>` : ''}</div>
    </section>` : '<div class="vazio"><p>Esta equipa ainda não tem jogos codificados com estes filtros.</p></div>'}
    <section class="bloco so-ecra" id="a-liga"></section></div>`;
  const raiz = $('.ana-pag', v);
  const mudar = (k, val) => { F[k] = val; if (k === 'equipa') { F.adversario = 'todos'; F.sel = {}; } if (k === 'persp' || k === 'adversario' || k === 'local' || k === 'periodo') F.sel = {}; desenharPaginaOportunidades(); };
  $('#a-equipa').addEventListener('change', e => mudar('equipa', e.target.value));
  $$('input[name=a-persp]').forEach(r => r.addEventListener('change', () => mudar('persp', r.value)));
  $('#a-adv').addEventListener('change', e => mudar('adversario', e.target.value));
  $('#a-local').addEventListener('change', e => mudar('local', e.target.value));
  $('#a-periodo').addEventListener('change', e => mudar('periodo', e.target.value));
  $('#a-golos').addEventListener('change', e => mudar('golos', e.target.checked));
  $('#b-pdf').addEventListener('click', () => exportarPdf(`${F.golos ? 'Golos' : 'Oportunidades'} ${esp ? (F.golos ? 'sofridos' : 'sofridas') : (F.golos ? 'marcados' : 'criadas')} ${F.equipa} ${hojeIso()}`));
  const alternar = (d, val) => { if (String(sel[d]) === String(val)) delete sel[d]; else sel[d] = val; const y = window.scrollY; desenharPaginaOportunidades(); window.scrollTo(0, y); };
  raiz.addEventListener('click', ev => {
