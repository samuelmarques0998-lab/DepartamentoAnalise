      <label class="so-tarefa">Estado<select name="estado" ${dis}>${Object.entries(ESTADOS).map(([k, t]) => `<option value="${k}" ${(ev?.estado || 'por_fazer') === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Microciclo do jogo<select name="jogo_id" ${dis}><option value="">–</option>${jogos.map(j => `<option value="${j.id}" ${ev?.jogo_id === j.id ? 'selected' : ''}>${esc(rotuloJogo(j))}</option>`).join('')}</select></label>
    </div>
    <label>Descrição<textarea name="descricao" rows="3" ${dis}>${esc(ev?.descricao || '')}</textarea></label>
    <div class="acoes">
      ${ev && ed ? '<button type="button" class="btn-link perigo apagar-esq" id="ev-apagar">Apagar</button>' : ''}
      <button class="btn" value="cancelar" formnovalidate>${ed ? 'Cancelar' : 'Fechar'}</button>
      ${ed ? `<button class="btn btn-prim" value="guardar">${ev ? 'Guardar alterações' : 'Criar evento'}</button>` : ''}
    </div>
  </form>`;
  document.body.appendChild(d); d.showModal();
  d.addEventListener('close', () => d.remove());
  const tipo = d.querySelector('[name=tipo]');

  tipo.addEventListener('change', mostrarEstado); mostrarEstado();
  $('#ev-apagar', d)?.addEventListener('click', async () => {
    d.close();
    if (await confirmar(`Apagar "${ev.titulo}" (${fmtData(ev.data)})?`)) {
      try { await App.db.apagar('agenda', { id: ev.id }); App.d.agenda = App.d.agenda.filter(x => x.id !== ev.id); toast('Evento apagado.'); desenharCalendario(); }
      catch (err) { toast(err.message, 'erro'); }
    }
  });
  d.querySelector('form').addEventListener('submit', async e => {
    if (e.submitter?.value !== 'guardar') return;
    e.preventDefault();
    const f = new FormData(e.target); const val = k => (String(f.get(k) ?? '').trim() || null);
    const jogo = val('jogo_id') ? App.idx.jogo[val('jogo_id')] : null;
    const reg = {
      tipo: val('tipo'), titulo: val('titulo'), data: val('data'), hora_inicio: val('hora_inicio'), hora_fim: val('hora_fim'),

  });
}

// ---- Modelo de microciclo ----
async function aplicarModelo(jogos, botao) {
  const modelo = modeloMicrociclo();
  const linhas = jogos.flatMap(j => modelo.map(it => ({
    tipo: it.tipo, titulo: it.titulo, data: somarDias(j.data, Number(it.md)), hora_inicio: it.hora_inicio || null, hora_fim: it.hora_fim || null,
    local: it.local || null, responsavel: it.responsavel || null, estado: it.tipo === 'tarefa' ? 'por_fazer' : null,
    descricao: it.descricao || null, jogo_id: j.id, md: Number(it.md)
  })));
  if (!linhas.length) { toast('O modelo de microciclo está vazio.', 'erro'); return; }
  if (botao) botao.disabled = true;
  try {
    const novos = await App.db.inserirVarios('agenda', linhas);
    App.d.agenda.push(...novos);
    toast(jogos.length === 1 ? `Microciclo de ${jogos[0].adversario} criado (${novos.length} eventos).` : `Microciclos de ${jogos.length} jogos criados (${novos.length} eventos).`);
    desenharCalendario();
  } catch (err) { if (botao) botao.disabled = false; toast(err.message, 'erro'); }
}
function proximosSemMicro() {
  const hoje = hojeLocal();
  return jogosComData().filter(j => j.data >= hoje && !(App.d.agenda || []).some(e => e.jogo_id === j.id));
}
function botaoProximosJogos() {
  const lista = proximosSemMicro();
  return lista.length ? `<div class="aviso-suave so-ecra"><p>${lista.length === 1 ? '1 próximo jogo ainda não tem' : `${lista.length} próximos jogos ainda não têm`} microciclo: ${esc(lista.slice(0, 4).map(j => `${j.adversario} (${fmtData(j.data, true)})`).join(', '))}${lista.length > 4 ? '…' : ''}</p><button class="btn btn-prim" id="cal-aplicar-todos">Criar a partir do modelo</button></div>` : '';
}
function ligarProximosJogos() {
  $('#cal-aplicar-todos')?.addEventListener('click', e => aplicarModelo(proximosSemMicro(), e.currentTarget));
}

function desenharModelo() {
  const ed = pode() && !App.semAgenda; const dis = ed ? '' : 'disabled';
  const ordenar = ls => ls.sort((a, b) => (a.md < 0) - (b.md < 0) || a.md - b.md || (a.hora_inicio || '99').localeCompare(b.hora_inicio || '99'));
  // Ordenado por dia ao abrir e ao guardar; durante a edição, as linhas novas ficam no fim.
  let linhas = ordenar(modeloMicrociclo().map(x => ({ ...x })));
  const opcoesMD = [-6, -5, -4, -3, -2, -1, 1, 2];
  const desenhar = () => {
    $('#cal-corpo').innerHTML = `
      <section class="bloco">
        <p class="nota">A semana-tipo que a app usa para criar o microciclo de cada jogo. MD é o dia do jogo; MD-3 é três dias antes; MD+1 é o dia a seguir. Depois de criado, cada microciclo pode ser ajustado no calendário sem alterar o modelo.</p>
        <div class="tabela-env"><table class="tabela compacta modelo-tabela">
          <thead><tr><th>Dia</th><th>Tipo</th><th>Título</th><th>Início</th><th>Fim</th><th>Responsável</th>${ed ? '<th><span class="sr">Remover</span></th>' : ''}</tr></thead>
          <tbody>${linhas.map((l, i) => `<tr data-i="${i}">
            <td><select data-c="md" ${dis} aria-label="Dia">${opcoesMD.map(n => `<option value="${n}" ${Number(l.md) === n ? 'selected' : ''}>${mdTexto(n)}</option>`).join('')}</select></td>
            <td><select data-c="tipo" ${dis} aria-label="Tipo">${Object.entries(TIPOS_AGENDA).map(([k, t]) => `<option value="${k}" ${l.tipo === k ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
            <td><input data-c="titulo" value="${esc(l.titulo || '')}" ${dis} aria-label="Título"></td>
            <td><input data-c="hora_inicio" type="time" value="${hhmm(l.hora_inicio)}" ${dis} aria-label="Início"></td>
            <td><input data-c="hora_fim" type="time" value="${hhmm(l.hora_fim)}" ${dis} aria-label="Fim"></td>
            <td><input data-c="responsavel" list="ev-resp-m" value="${esc(l.responsavel || '')}" ${dis} aria-label="Responsável"></td>
            ${ed ? `<td><button class="btn-link perigo" data-remover="${i}">Remover</button></td>` : ''}
          </tr>`).join('')}</tbody>
        </table></div>
        <datalist id="ev-resp-m"><option value="Departamento"><option value="Equipa técnica"></datalist>
        ${ed ? `<div class="acoes-esq"><button class="btn" id="m-adicionar">Adicionar linha</button><button class="btn btn-prim" id="m-guardar">Guardar modelo</button><button class="btn-link" id="m-repor">Repor modelo base</button></div>` : ''}
      </section>
      ${ed ? botaoProximosJogos() : ''}`;
    $$('[data-c]').forEach(c => c.addEventListener('change', () => {
      const i = Number(c.closest('tr').dataset.i); linhas[i][c.dataset.c] = c.dataset.c === 'md' ? Number(c.value) : c.value;
    }));
    $$('[data-remover]').forEach(b => b.addEventListener('click', () => { linhas.splice(Number(b.dataset.remover), 1); desenhar(); }));
    $('#m-adicionar')?.addEventListener('click', () => { linhas.push({ md: -1, tipo: 'treino', titulo: '', hora_inicio: '', hora_fim: '', responsavel: '' }); desenhar(); $$('.modelo-tabela input[data-c=titulo]').pop()?.focus(); });
    $('#m-repor')?.addEventListener('click', () => { linhas = ordenar(MODELO_PADRAO.map(x => ({ ...x }))); desenhar(); toast('Modelo base reposto. Clique em "Guardar modelo" para o manter.'); });
    $('#m-guardar')?.addEventListener('click', async () => {
      const limpo = linhas.filter(l => String(l.titulo || '').trim()).map(l => ({ md: Number(l.md), tipo: l.tipo, titulo: l.titulo.trim(), hora_inicio: hhmm(l.hora_inicio) || null, hora_fim: hhmm(l.hora_fim) || null, responsavel: (l.responsavel || '').trim() || null }));
      try {
        await App.db.upsert('configuracao', [{ id: 1, modelo_microciclo: limpo, updated_at: new Date().toISOString() }], 'id');
        App.cfg.modelo_microciclo = limpo; linhas = ordenar(limpo.map(x => ({ ...x }))); toast('Modelo de microciclo guardado.'); desenhar();
      } catch (err) { toast(/modelo_microciclo/.test(err.message) ? 'Falta atualizar a base de dados. Corra outra vez o schema.sql no Supabase.' : err.message, 'erro'); }
    });
    ligarProximosJogos();
  };
  desenhar();
}

// ---------- Visão geral ----------
function jogosOrdenados() { return App.d.jogos.slice().sort(compararJogos); }
const jogoDisputado = j => Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos);

function desenharVisao() {
  const v = $('#vista'); const hoje = hojeLocal();
  const jogos = jogosOrdenados();
  const disputados = jogos.filter(jogoDisputado);
  const proximo = jogos.filter(j => !jogoDisputado(j) && (!j.data || j.data >= hoje))[0] || null;
  const ultimo = disputados[disputados.length - 1] || null;
  const [y, m, d] = hoje.split('-').map(Number);
  v.innerHTML = `
    <div class="cabecalho-vista">
      <div><h1>Visão geral</h1><p class="nota">${DIAS_SEMANA_LONGOS[diaSemana(hoje)]}, ${d} de ${MESES_LONGOS[m - 1]} de ${y}</p></div>
    </div>
    ${!jogos.length ? `<div class="vazio"><p>Ainda não há jogos registados.</p>${pode() ? '<p>Comece por importar o ficheiro da liga em <a href="#importacao">Importação</a>.</p>' : ''}</div>` : `
    <div class="visao-grelha">
      <section class="bloco visao-proximo">${cartaoProximo(proximo, hoje)}</section>
      <section class="bloco visao-epoca">${cartaoEpoca(disputados, ultimo)}</section>
      <section class="bloco visao-semana">${cartaoSemana(hoje, proximo)}</section>
      ${pode() ? `<section class="bloco visao-dep">${cartaoDepartamento()}</section>` : ''}
    </div>`}`;
  $$('[data-ver-adversario]', v).forEach(b => b.addEventListener('click', () => {
    App.ana.equipa = b.dataset.verAdversario; App.ana.persp = 'criadas'; App.ana.adversario = 'todos'; location.hash = 'oportunidades';
  }));
  $$('[data-criar-micro]', v).forEach(b => b.addEventListener('click', async () => { await aplicarModelo([App.idx.jogo[b.dataset.criarMicro]], b); mostrarVista('visao'); }));
  $$('[data-ir-semana]', v).forEach(b => b.addEventListener('click', () => { App.cal.vista = 'semana'; App.cal.ref = b.dataset.irSemana; location.hash = 'calendario'; }));
}
const DIAS_SEMANA_LONGOS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];

// Posição e forma de uma equipa no campeonato (ficheiro da liga).
function situacaoNaLiga(nome, competicao) {
  if (!competicao || !App.d.liga?.length) return null;
  const t = classificacao(competicao); const i = t.findIndex(x => mesmaEquipa(x.equipa, nome) || norm(x.equipa) === norm(nome));
  if (i < 0) return null;
  const forma = App.d.liga.filter(r => norm(r.competicao) === norm(competicao) && (mesmaEquipa(r.equipa, nome) || norm(r.equipa) === norm(nome)) && Number.isFinite(r.golos))
    .sort((a, b) => a.jornada - b.jornada).slice(-5).map(r => (r.golos > r.golos_sofridos ? 'V' : r.golos < r.golos_sofridos ? 'D' : 'E'));
  return { pos: i + 1, n: t.length, ...t[i], forma };
}
const formaHTML = f => f.map(r => `<span class="res res-${r}">${r}</span>`).join('');

function cartaoProximo(j, hoje) {
  if (!j) return '<h2>Próximo jogo</h2><p class="fraco">Não há jogos por disputar registados.</p>';
  const dias = j.data ? diasEntre(hoje, j.data) : null;
  const quando = j.data ? (dias === 0 ? 'Hoje' : dias === 1 ? 'Amanhã' : `Daqui a ${dias} dias`) : (j.jornada != null ? `Jornada ${j.jornada}` : '');
  const sit = situacaoNaLiga(j.adversario, j.competicao);
  // Oportunidades do adversário nos jogos já codificados.
  const adv = equipasCodificaveis().find(e => mesmaEquipa(e, j.adversario) || norm(e) === norm(j.adversario));
  let ops = null;
  if (adv) {
    const f = { persp: 'criadas', adversario: 'todos', local: 'todos', periodo: 'todos', golos: false, momento: 'todos' };
    const js = jogosDaEquipa(adv, f);
    if (js.length) ops = { j: js.length, c: oportunidadesDe(adv, f, js).length / js.length, s: oportunidadesDe(adv, { ...f, persp: 'sofridas' }, js).length / js.length };
  }
  const temMicro = (App.d.agenda || []).some(e => e.jogo_id === j.id);
  return `
    <p class="visao-rot">Próximo jogo</p>
    <div class="visao-jogo">
      <div><h2>${esc(j.adversario)}</h2>
        <p class="visao-detalhe">${j.local === 'casa' ? 'Em casa' : j.local === 'fora' ? 'Fora' : ''}${j.data ? ` · ${DIAS_SEMANA_LONGOS[diaSemana(j.data)].toLowerCase()}, ${fmtData(j.data)}` : ''}${j.competicao ? ` · ${esc(j.competicao)}` : ''}${j.jornada != null && j.data ? ` · J${j.jornada}` : ''}</p></div>
      ${quando ? `<span class="visao-contagem">${quando}</span>` : ''}
    </div>
    <dl class="visao-dados">
      ${sit ? `<div><dt>Classificação</dt><dd><b>${sit.pos}.º</b> · ${sit.pts} pts em ${sit.j} jogos</dd></div><div><dt>Últimos jogos</dt><dd class="visao-forma">${formaHTML(sit.forma) || '–'}</dd></div><div><dt>Golos</dt><dd>${sit.gm} marcados · ${sit.gs} sofridos</dd></div>` : ''}
      ${ops ? `<div><dt>Oportunidades por jogo</dt><dd>${fmtNum(ops.c, 1)} criadas · ${fmtNum(ops.s, 1)} sofridas <span class="fraco">(${ops.j} ${ops.j === 1 ? 'jogo codificado' : 'jogos codificados'})</span></dd></div>` : ''}
    </dl>
    <div class="acoes-esq">
      ${adv && ops ? `<button class="btn" data-ver-adversario="${esc(adv)}">Analisar ${esc(j.adversario)}</button>` : ''}
      ${j.data && pode() && !App.semAgenda && !temMicro ? `<button class="btn btn-prim" data-criar-micro="${j.id}">Criar microciclo</button>` : ''}
      ${!j.data && pode() ? '<span class="nota">Acrescente a data em <a href="#jogos">Jogos</a> para o jogo entrar no calendário.</span>' : ''}
    </div>`;
}

function cartaoEpoca(disputados, ultimo) {
  const comp = ultimo?.competicao;
  const sit = situacaoNaLiga(App.cfg.nome_clube, comp) || (App.d.liga?.length ? situacaoNaLiga((classificacao(comp || '').find(x => eNossaEquipa(x.equipa)) || {}).equipa, comp) : null);

  const opsU = ultimo ? (App.idx.eventos[ultimo.id] || []).filter(x => x.tipo === 'oportunidade') : [];
  return `

      <div><span class="visao-num">${soma(liga.map(j => j.golos_marcados))}–${soma(liga.map(j => j.golos_sofridos))}</span><span class="fraco">golos</span></div>
    </div>
    ${forma.length ? `<p class="visao-forma-linha"><span class="fraco">Últimos ${forma.length}:</span> ${formaHTML(forma)}</p>` : ''}
    ${ultimo ? `<div class="visao-ultimo">
      <p class="visao-rot">Último jogo</p>
      <p><b>${esc(ultimo.adversario)}</b> ${ultimo.local === 'casa' ? '(C)' : ultimo.local === 'fora' ? '(F)' : ''} <span class="res res-${resultadoJogo(ultimo)}">${resultadoJogo(ultimo)}</span>${ultimo.golos_marcados}–${ultimo.golos_sofridos} <span class="fraco">${esc(quandoJogo(ultimo))}</span></p>
      <p class="fraco">${[xg ? `xG ${fmtNum(est.nos?.[xg], 2)}–${fmtNum(est.adversario?.[xg], 2)}` : null, opsU.length ? `oportunidades ${opsU.filter(x => x.lado === 'nos').length}–${opsU.filter(x => x.lado === 'adversario').length}` : null].filter(Boolean).join(' · ') || 'Sem estatísticas importadas'}</p>
    </div>` : ''}
    <p><a href="#relatorio">Ver relatório da equipa</a></p>`;
}

    <ol class="visao-dias">${dias.map(d => {

}

function cartaoDepartamento() {
  const liga = (App.idx.alvos || []).filter(a => a.partida);
  const comOps = liga.filter(a => (App.idx.eventosAlvo[a.key] || []).length);
  const jornadasJogadas = [...new Set(liga.filter(a => Number.isFinite(a.golosCasa)).map(a => a.jornada))].sort((a, b) => b - a);
  const ultimaJ = jornadasJogadas[0];
  const emFalta = ultimaJ != null ? liga.filter(a => a.jornada === ultimaJ && !(App.idx.eventosAlvo[a.key] || []).length) : [];
  const imp = App.d.importacoes.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  const ultimaDe = t => imp.find(i => i.tipo === t);
  const quando = i => (i ? new Date(i.created_at).toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' }) : '–');
  const semEstat = App.d.plantel.filter(p => !App.d.estJog.some(r => r.lado === 'nos' && (norm(r.jogador) === norm(p.nome) || norm(r.jogador) === norm(p.nome_wyscout)))).length;
  return `
    <p class="visao-rot">Departamento</p>
    ${liga.length ? `<div class="visao-progresso"><div class="visao-barra"><i style="width:${comOps.length / liga.length * 100}%"></i></div>
      <p><b>${comOps.length}</b> de ${liga.length} jogos do campeonato codificados${ultimaJ != null ? (emFalta.length ? `; na jornada ${ultimaJ} faltam ${emFalta.length}: ${esc(emFalta.slice(0, 4).map(a => `${a.casa}–${a.fora}`).join(', '))}${emFalta.length > 4 ? '…' : ''}.` : `; a jornada ${ultimaJ} está completa.`) : '.'}</p></div>` : '<p class="fraco">Importe o ficheiro da liga para acompanhar a codificação.</p>'}
    <dl class="visao-dados">
      <div><dt>Ficheiro da liga</dt><dd>${quando(ultimaDe('liga'))}</dd></div>
      <div><dt>Estatísticas de jogadores</dt><dd>${quando(ultimaDe('jogadores'))}</dd></div>
      <div><dt>Folha de oportunidades</dt><dd>${quando(ultimaDe('oportunidades'))}</dd></div>
      ${App.d.plantel.length ? `<div><dt>Plantel sem estatísticas</dt><dd>${semEstat} de ${App.d.plantel.length} jogadores</dd></div>` : ''}
    </dl>

}

// ---------- Análise de oportunidades (todas as equipas do campeonato) ----------
App.ana = { equipa: null, persp: 'criadas', adversario: 'todos', local: 'todos', periodo: 'todos', golos: false, momento: 'todos', mapa: 'zonas' };

function equipasCodificaveis() {
  const s = new Map();
  for (const a of App.idx.alvos || []) for (const n of [a.casa, a.fora]) if (!s.has(norm(n))) s.set(norm(n), n);
  return [...s.values()].sort((a, b) => a.localeCompare(b, 'pt'));
}
const ladoDaEquipa = (a, eq) => (mesmaEquipa(a.casa, eq) || norm(a.casa) === norm(eq) ? 'casa' : mesmaEquipa(a.fora, eq) || norm(a.fora) === norm(eq) ? 'fora' : null);

// Jogos codificados da equipa (com pelo menos uma oportunidade), já filtrados.
function jogosDaEquipa(eq, f) {
  let js = (App.idx.alvos || []).filter(a => ladoDaEquipa(a, eq) && (App.idx.eventosAlvo[a.key] || []).length);
  if (f.local !== 'todos') js = js.filter(a => ladoDaEquipa(a, eq) === f.local);
  if (f.adversario !== 'todos') js = js.filter(a => mesmaEquipa(a[ladoDaEquipa(a, eq) === 'casa' ? 'fora' : 'casa'], f.adversario));
  js.sort((a, b) => (a.jornada ?? 999) - (b.jornada ?? 999) || String(a.data || '').localeCompare(String(b.data || '')));
  if (f.periodo !== 'todos') js = js.slice(-Number(f.periodo));
  return js;
}
function oportunidadesDe(eq, f, jogos) {
  const out = [];
  for (const a of jogos) {
    const meu = ladoDaEquipa(a, eq);
    for (const e of App.idx.eventosAlvo[a.key] || []) {
      const l = ladoNoAlvo(e, a);
      if ((f.persp === 'criadas') !== (l === meu)) continue;
      const o = dadosOportunidade(e);
      if (f.golos && !o.golo) continue;
      if (f.momento !== 'todos' && o.momento !== f.momento) continue;
      out.push({ e, o, a, cor: f.persp === 'criadas' ? 'nos' : 'adversario' });
    }
  }
  return out;
}

function barras(titulo, entradas, total, { max = 10, vazio = 'Sem dados' } = {}) {
  const lista = entradas.filter(([k]) => k).sort((a, b) => b[1] - a[1]);
  const mostrar = lista.slice(0, max); const resto = lista.slice(max).reduce((s, [, n]) => s + n, 0);
  const topo = Math.max(1, ...mostrar.map(([, n]) => n));
  return `<div class="ana-barras"><h3>${titulo}</h3>${mostrar.length ? `<ul>${mostrar.map(([k, n]) => `<li><span class="ana-rot" title="${esc(k)}">${esc(k)}</span><span class="ana-pista"><i style="width:${n / topo * 100}%"></i></span><span class="ana-val">${n}<small>${total ? ` · ${fmtNum(n / total * 100, 0)}%` : ''}</small></span></li>`).join('')}</ul>${resto ? `<p class="nota">E mais ${resto} noutras categorias.</p>` : ''}` : `<p class="fraco">${vazio}</p>`}</div>`;
}
const contarPor = (lista, fn) => { const c = new Map(); for (const x of lista) { const k = fn(x); if (k) c.set(k, (c.get(k) || 0) + 1); } return [...c.entries()]; };

// Meio-campo ofensivo na vertical (baliza em cima), com as zonas do método do departamento.
function mapaZonas(tipo, pontos) {
  const conta = Array(14).fill(0);
  for (const p of pontos) { const z = tipo === 'passe' ? zonaPasse(p.x, p.y) : zonaFinalizacao(p.x, p.y); if (z) conta[z]++; }
  const max = Math.max(1, ...conta.slice(1, 13));
  const alfa = n => (n ? 0.12 + 0.68 * n / max : 0);
  const W = 68, rect = (x, y, w, h, z) => `<g class="zona"><rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill-opacity:${alfa(conta[z])}"/><text x="${x + w / 2}" y="${y + h / 2}" class="${alfa(conta[z]) > 0.5 ? 'claro' : ''}">${conta[z]}</text><title>Zona ${z}: ${conta[z]}</title></g>`;
  const linhas = `<g class="linhas-v"><rect x="0" y="0" width="${W}" height="${tipo === 'passe' ? 52.5 : 30}"/><rect x="${M.areaY0}" y="0" width="${M.areaY1 - M.areaY0}" height="16.5"/><rect x="${M.peqY0}" y="0" width="${M.peqY1 - M.peqY0}" height="5.5"/><rect x="${W / 2 - 3.66}" y="-1.6" width="7.32" height="1.6"/><path d="M${W / 2 - 7.3} 16.5 A9.15 9.15 0 0 0 ${W / 2 + 7.3} 16.5"/>${tipo === 'passe' ? `<path d="M${W / 2 - 9.15} 52.5 A9.15 9.15 0 0 1 ${W / 2 + 9.15} 52.5"/>` : ''}</g>`;
  let zonas = '';
  if (tipo === 'passe') {
    FAIXAS_PASSE.forEach(([d0, d1], r) => CORR_PASSE.forEach(([y0, y1], c) => { zonas += rect(y0, d0, y1 - y0, d1 - d0, r * 3 + c + 1); }));
    return `<svg class="mapa-zonas" viewBox="-2 -3 72 61" role="img" aria-label="Zonas do passe">${zonas}${linhas}</svg><p class="mapa-fora">Meio-campo defensivo (zona 13): <b>${conta[13]}</b></p>`;
  }
  FAIXAS_FIN.forEach(([d0, d1], r) => COLS_FIN.forEach(([y0, y1], c) => { zonas += rect(y0, d0, y1 - y0, d1 - d0, r * 4 + c + 1); }));
  return `<svg class="mapa-zonas" viewBox="-2 -3 72 35" role="img" aria-label="Zonas de finalização">${zonas}${linhas}<text x="${W / 2}" y="24.5" class="fora-area">Fora da área (zona 13): ${conta[13]}</text></svg>`;
}

function desenharPaginaOportunidades() {
  const v = $('#vista'); const F = App.ana;
  const equipas = equipasCodificaveis();
  if (!equipas.length || !App.d.eventos.length) {
    v.innerHTML = `<div class="cabecalho-vista"><h1>Oportunidades</h1></div><div class="vazio"><p>Ainda não há oportunidades codificadas.</p>${pode() ? '<p>Codifique jogos em <a href="#codificacao">Codificação</a> ou importe a folha de oportunidades em <a href="#importacao">Importação</a>.</p>' : ''}</div>`;

  }
  if (!F.equipa || !equipas.includes(F.equipa)) F.equipa = equipas.find(e => eNossaEquipa(e)) || equipas.find(e => norm(e) === norm(nomeNosso())) || equipas[0];
  const jogos = jogosDaEquipa(F.equipa, F);
  const ops = oportunidadesDe(F.equipa, F, jogos);

  const fin = top(x => x.e.jogador), pas = top(x => x.e.assistente);
  const verbo = F.persp === 'criadas' ? 'criadas' : 'sofridas';
  const cel = (rot, val, sub = '') => `<div class="placar-cel"><span class="placar-rot">${rot}</span><span class="placar-val">${val}</span>${sub ? `<span class="placar-sub">${sub}</span>` : ''}</div>`;
  v.innerHTML = `
    ${cabecalhoImpressao()}
    <div class="cabecalho-vista">
      <div><h1>${F.golos ? `Golos ${F.persp === 'criadas' ? 'marcados' : 'sofridos'}` : `Oportunidades ${verbo}`}: ${esc(F.equipa)}</h1>
        <p class="nota">${jogos.length} ${jogos.length === 1 ? 'jogo codificado' : 'jogos codificados'}${jogos.length ? ` (${esc(jogos.map(a => a.jornada != null ? `J${a.jornada}` : fmtData(a.data, true)).join(', '))})` : ''}${F.adversario !== 'todos' ? ` contra ${esc(F.adversario)}` : ''}${F.local !== 'todos' ? `, ${F.local === 'casa' ? 'em casa' : 'fora'}` : ''}.</p></div>
      <button class="btn so-ecra botao-pdf" id="b-pdf">${iconePdf()}Exportar PDF</button>
    </div>
    <div class="filtros so-ecra" role="group" aria-label="Filtros">
      <label>Equipa<select id="a-equipa">${equipas.map(e => `<option ${e === F.equipa ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></label>
      <label>Oportunidades<select id="a-persp"><option value="criadas" ${F.persp === 'criadas' ? 'selected' : ''}>Criadas</option><option value="sofridas" ${F.persp === 'sofridas' ? 'selected' : ''}>Sofridas</option></select></label>
      <label>Adversário<select id="a-adv"><option value="todos">Todos</option>${adversarios.map(e => `<option ${e === F.adversario ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></label>
      <label>Local<select id="a-local"><option value="todos">Casa e fora</option><option value="casa" ${F.local === 'casa' ? 'selected' : ''}>Casa</option><option value="fora" ${F.local === 'fora' ? 'selected' : ''}>Fora</option></select></label>
      <label>Momento<select id="a-momento"><option value="todos">Todos</option>${Object.keys(MOMENTOS).map(m => `<option ${m === F.momento ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
      <label>Período<select id="a-periodo"><option value="todos">Todos os jogos</option>${[3, 5, 10].map(n => `<option value="${n}" ${String(F.periodo) === String(n) ? 'selected' : ''}>Últimos ${n} jogos</option>`).join('')}</select></label>
      <label class="em-linha caixa ana-golos"><input type="checkbox" id="a-golos" ${F.golos ? 'checked' : ''}> Só golos</label>
    </div>
    ${jogos.length ? `
    <section class="placar" aria-label="Resumo">
      ${cel('Jogos', jogos.length)}
      ${cel(F.golos ? 'Golos' : 'Oportunidades', ops.length, jogos.length ? `${fmtNum(ops.length / jogos.length, 1)} por jogo` : '')}
      ${F.golos ? '' : cel('Golos', golos, ops.length ? `${fmtNum(golos / ops.length * 100, 0)}% de conversão` : '')}
      ${cel('Bola corrida / esquemas', `${ops.filter(x => x.o.momento !== 'Esquema tático').length}<i>/</i>${ops.filter(x => x.o.momento === 'Esquema tático').length}`)}
      ${fin ? cel('Mais finalizações', esc(fin[0]), `${fin[1]} ${F.golos ? (fin[1] === 1 ? 'golo' : 'golos') : 'oportunidades'}`) : ''}
      ${pas ? cel('Mais passes', esc(pas[0]), `${pas[1]} ${F.golos ? (pas[1] === 1 ? 'assistência' : 'assistências') : 'oportunidades'}`) : ''}
    </section>
    ${ops.length ? `

        <div class="ana-barras"><h3>Tempo</h3>${colunasTempo(ops)}</div>
      </div>
    </section>
    <section class="bloco">
      <div class="bloco-cab"><h2>Onde</h2>
        <div class="alternar so-ecra" role="radiogroup" aria-label="Mapa"><label class="chip"><input type="radio" name="a-mapa" value="zonas" ${F.mapa === 'zonas' ? 'checked' : ''}><span>Zonas</span></label><label class="chip"><input type="radio" name="a-mapa" value="pontos" ${F.mapa === 'pontos' ? 'checked' : ''}><span>Pontos</span></label></div>
      </div>
      ${F.mapa === 'zonas' ? `<div class="ana-mapas">
        <figure><figcaption>Zona do passe</figcaption>${mapaZonas('passe', ops.filter(x => x.e.passe_x != null).map(x => ({ x: x.e.passe_x, y: x.e.passe_y })))}</figure>
        <figure><figcaption>Zona de finalização</figcaption>${mapaZonas('fin', ops.filter(x => x.e.zona_x != null).map(x => ({ x: x.e.zona_x, y: x.e.zona_y })))}</figure>
      </div><p class="nota">A atacar para cima; o lado esquerdo do desenho é o lado esquerdo de quem ataca.</p>`
      : `${campoSVG({ eventos: ops.map(x => ({ ...x.e, lado: x.cor })), metade: true, passes: true })}${legendaCampo()}<p class="nota">Cada ponto é uma finalização e a linha liga-a ao último passe.${ops.some(x => x.e.local_aprox) ? ' As oportunidades importadas da folha por zonas têm o local aproximado (dentro da zona).' : ''}</p>`}
    </section>
    <section class="bloco">
      <div class="ana-grelha dois">
        ${barras('Quem finaliza', contarPor(ops, x => x.e.jogador), 0, { max: 8 })}

        ${barras('Posição de quem finaliza', contarPor(ops, x => x.e.posicao_finalizador), ops.length)}
        ${barras('Posição de quem faz o passe', contarPor(ops, x => x.e.posicao_passe), ops.length)}

    </section>` : '<div class="vazio"><p>Nenhuma oportunidade com estes filtros.</p></div>'}
    ` : '<div class="vazio"><p>Esta equipa ainda não tem jogos codificados com estes filtros.</p></div>'}
    <section class="bloco" id="a-liga"></section>`;

  $('#a-adv').addEventListener('change', e => mudar('adversario', e.target.value));

  $$('input[name=a-mapa]').forEach(r => r.addEventListener('change', () => mudar('mapa', r.value)));
  $('#b-pdf').addEventListener('click', () => exportarPdf(`Oportunidades ${F.equipa} ${hojeIso()}`));
  desenharTabelaLiga();
}

function colunasTempo(ops) {
  const n = TEMPOS.map(t => ops.filter(x => x.o.tempo === t).length);
  const mostrar = TEMPOS.map((t, i) => [t, n[i]]).filter(([t, c]) => t !== 'Prolongamento' || c);
  const max = Math.max(1, ...n);
  return `<div class="ana-colunas">${mostrar.map(([t, c]) => `<div class="ana-col" title="${t}: ${c}"><span class="ana-col-val">${c}</span><span class="ana-col-barra"><i style="height:${c / max * 100}%"></i></span><span class="ana-col-rot">${t === 'Prolongamento' ? '90+' : t}</span></div>`).join('')}</div>`;
}

function desenharTabelaLiga() {

// ---------- Codificação de oportunidades (todos os jogos do campeonato) ----------
const CAMPOS_FORM = ['minuto', 'tempo', 'momento', 'sub_momento', 'mecanismo', 'corredor', 'resultado', 'jogador', 'posicao_finalizador', 'assistente', 'posicao_passe', 'qualidade', 'finalizacao', 'video_url', 'notas'];

function reindexarEventos() {
  const ev = {}; for (const r of App.d.eventos) if (r.jogo_id) (ev[r.jogo_id] ||= []).push(r);
  App.idx.eventos = ev;
  indexarAlvos();
}

function chips(nome, opcoes, valor, rotulo, extra = '') {
  return `<fieldset class="grupo-chips"><legend>${rotulo}${extra}</legend><div class="chips">
    ${opcoes.map(o => `<label class="chip"><input type="radio" name="${nome}" value="${esc(o)}" ${o === valor ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}
  </div></fieldset>`;
}

// Cor das marcas: SCUT a azul quando joga; nos outros jogos, casa a azul e fora a laranja.
function corLado(a, lado) { return a.ladoNosso ? (lado === a.ladoNosso ? 'nos' : 'adversario') : (lado === 'casa' ? 'nos' : 'adversario'); }
const paraCampo = (a, e) => ({ ...e, lado: corLado(a, ladoNoAlvo(e, a)) });

function opcoesAlvos(selecionado) {
  const alvos = App.idx.alvos; const ev = App.idx.eventosAlvo;
  const liga = alvos.filter(a => a.partida).sort((a, b) => (b.jornada ?? 0) - (a.jornada ?? 0) || a.casa.localeCompare(b.casa, 'pt'));
  const outros = alvos.filter(a => !a.partida).sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
  const porJornada = {}; for (const a of liga) (porJornada[a.jornada ?? '–'] ||= []).push(a);
  const opt = a => { const n = (ev[a.key] || []).length; return `<option value="${a.key}" ${a.key === selecionado ? 'selected' : ''}>${n ? '✓ ' : ''}${esc(rotuloAlvo(a, true))}${n ? ` (${n})` : ''}</option>`; };
  return Object.entries(porJornada).sort((a, b) => Number(b[0]) - Number(a[0])).map(([j, ls]) => `<optgroup label="Jornada ${j}">${ls.map(opt).join('')}</optgroup>`).join('')
    + (outros.length ? `<optgroup label="Outros jogos do ${esc(nomeNosso())}">${outros.map(opt).join('')}</optgroup>` : '');
}

// Nomes conhecidos de cada equipa (plantel do SCUT e oportunidades já codificadas), com a última posição usada.
function nomesDaEquipa(equipa) {
  const nomes = new Map();
  if (eNossaEquipa(equipa) || norm(equipa) === norm(nomeNosso())) {
    for (const p of App.d.plantel) nomes.set(p.nome, normPosicao(p.posicao));
  }
  for (const e of App.d.eventos) {
    if (!mesmaEquipa(equipaDoEvento(e) || '', equipa)) continue;
    if (e.jogador) nomes.set(e.jogador, e.posicao_finalizador || nomes.get(e.jogador) || null);
    if (e.assistente) nomes.set(e.assistente, e.posicao_passe || nomes.get(e.assistente) || null);
  }
  return nomes;
}

function lerFormParaEstado() {
  const f = $('#c-form'); if (!f) return;
  const fd = new FormData(f); const C = App.cod;
  C.side = fd.get('side') || C.side;
  for (const k of CAMPOS_FORM) if (fd.has(k)) C.form[k] = fd.get(k);
  C.form.qualidade = fd.get('qualidade') ? 'Grande oportunidade' : null;
}

  $('#c-form-env').innerHTML = `

      <div class="campo-env">
        <div class="cod-ponto-cab">
          <div class="segmentado pequeno" role="radiogroup" aria-label="O que marcar no campo">
            <label><input type="radio" name="ponto" value="fin" ${C.ponto === 'fin' ? 'checked' : ''}><span>Finalização${C.zona ? ' ✓' : ''}</span></label>

          </div>

          ${C.zona || C.passe ? '<button type="button" class="btn-link" id="c-limpar-zona">Limpar pontos</button>' : ''}
        </div>
        <div id="c-campo" class="lado-${corLado(a, C.side) === 'nos' ? 'nos' : 'adversario'}">${campoSVG({ eventos: outros, interativo: true, marcador: C.zona, marcadorPasse: C.passe, classe: 'com-fantasmas' })}</div>
        <p class="nota zonas-info">${C.zona ? `Zona de finalização ${zonaFinalizacao(C.zona.x, C.zona.y)}` : ''}${C.passe ? `${C.zona ? ' · ' : ''}Zona do passe ${zonaPasse(C.passe.x, C.passe.y)}` : ''}</p>
      </div>
      <div class="grelha-2">
        <label>Quem finaliza<input name="jogador" list="l-jog" value="${esc(F.jogador || '')}" autocomplete="off" id="c-fin"></label>
        <label>Posição<select name="posicao_finalizador" id="c-fin-pos"><option value="">–</option>${POSICOES_EV.map(p => `<option ${F.posicao_finalizador === p ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
        ${penalti ? '' : `<label>Quem faz o passe<input name="assistente" list="l-jog" value="${esc(F.assistente || '')}" autocomplete="off" id="c-pas"></label>
        <label>Posição<select name="posicao_passe" id="c-pas-pos"><option value="">–</option>${POSICOES_EV.map(p => `<option ${F.posicao_passe === p ? 'selected' : ''}>${p}</option>`).join('')}</select></label>`}
      </div>

      ${chips('resultado', RESULTADOS, F.resultado, 'Resultado')}

  const form = $('#c-form');
  form.addEventListener('change', e => {

    if (n === 'ponto') { lerFormParaEstado(); C.ponto = e.target.value; desenharFormEvento(); return; }

      if (n === 'sub_momento') {
        C.form.mecanismo = null;

        if (C.form.sub_momento === 'Penálti') { C.zona ||= { x: 89.6, y: 49 }; C.passe = null; C.ponto = 'fin'; C.form.corredor ||= 'Centro'; }

}

async function guardarEvento(e) {
  e.preventDefault();
  lerFormParaEstado();
  const C = App.cod; const F = C.form; const a = App.idx.alvo[C.alvo];
  const erros = [];
  const minuto = F.minuto === '' || F.minuto === undefined || F.minuto === null ? null : Number(F.minuto);
  if (minuto !== null && (!Number.isInteger(minuto) || minuto < 0 || minuto > 130)) erros.push('um minuto válido');
  if (!F.momento) erros.push('o momento');
  else if (!F.sub_momento) erros.push('o sub-momento');
  else if (mecanismosDe(F.momento, F.sub_momento).length && !F.mecanismo) erros.push('o mecanismo');
  if (!F.corredor) erros.push('o lado');
  if (!F.tempo) erros.push('o tempo');
  if (!C.zona) erros.push('o local da finalização no campo');
  if (!F.resultado) erros.push('o resultado');
  if (F.video_url && !/^https?:\/\//i.test(F.video_url)) erros.push('uma ligação de vídeo válida (começa por https://)');
  const elErro = $('#c-erro');
  if (erros.length) { elErro.textContent = `Falta indicar ${erros.join(', ').replace(/, ([^,]*)$/, ' e $1')}.`; elErro.hidden = false; return; }
  const jogo_id = a.jogo?.id || a.partida?.jogo_id || null;
  const penalti = F.sub_momento === 'Penálti';
  const reg = {
    partida_id: a.partida?.id || null, jogo_id, equipa: a[C.side], lado: jogo_id && a.ladoNosso ? (C.side === a.ladoNosso ? 'nos' : 'adversario') : null,
    tipo: 'oportunidade', minuto, tempo: F.tempo, parte: parteDoTempo(F.tempo),
    momento: F.momento, sub_momento: F.sub_momento, mecanismo: penalti ? null : F.mecanismo || null, corredor: F.corredor,
    qualidade: F.qualidade || (penalti ? 'Grande oportunidade' : 'Oportunidade'), finalizacao: F.finalizacao || null, resultado: F.resultado,
    zona_x: C.zona.x, zona_y: C.zona.y, passe_x: penalti ? null : C.passe?.x ?? null, passe_y: penalti ? null : C.passe?.y ?? null, local_aprox: false,
    jogador: normNome(F.jogador), posicao_finalizador: F.posicao_finalizador || null,
    assistente: penalti ? null : normNome(F.assistente), posicao_passe: penalti ? null : F.posicao_passe || null,
    video_url: (F.video_url || '').trim() || null, notas: (F.notas || '').trim() || null
  };
  const btn = $('#c-form button.btn-prim'); btn.disabled = true;
  try {
    if (C.editarId) {
      const [r] = await App.db.atualizar('eventos', { id: C.editarId }, reg);
      App.d.eventos = App.d.eventos.map(x => x.id === C.editarId ? (r || { ...x, ...reg }) : x);
      toast('Oportunidade atualizada.');
    } else {
      App.d.eventos.push(await App.db.inserir('eventos', reg));
      toast(`Oportunidade de ${reg.equipa} guardada.`);
    }
    reindexarEventos();
    C.editarId = null; C.zona = null; C.passe = null; C.ponto = 'fin';
    C.form = {};
    desenharCodificacao();
  } catch (err) {
    btn.disabled = false;
    elErro.textContent = /partida_id|sub_momento|mecanismo|corredor|passe_x|column/i.test(err.message) ? 'A base de dados precisa de ser atualizada para este método de codificação. Corra outra vez o schema.sql no Supabase (SQL Editor).' : err.message;
    elErro.hidden = false;
  }
}

        <span class="ev-min ${Number.isFinite(e.minuto) ? '' : 'ev-tempo'}">${Number.isFinite(e.minuto) ? `${e.minuto}'` : esc(o.tempo || '–')}</span>
        <span class="ponto-cor ${corLado(a, l) === 'nos' ? 'nos' : 'adv'}" title="${esc(a[l] || '')}"></span>
        <div class="ev-txt">
          <b>${esc([o.momento, o.sub, o.mecanismo].filter(Boolean).join(' · ') || 'Oportunidade')}</b>
          <span class="${o.golo ? 'golo' : ''}">${esc(e.resultado || '')}${e.qualidade === 'Grande oportunidade' ? ' · grande oportunidade' : ''}${o.corredor ? ` · lado ${o.corredor.toLowerCase()}` : ''}</span>
          <small>${esc([e.jogador && `${e.jogador}${e.posicao_finalizador ? ` (${e.posicao_finalizador})` : ''}`, e.assistente && `passe de ${e.assistente}${e.posicao_passe ? ` (${e.posicao_passe})` : ''}`].filter(Boolean).join(' · '))}</small>
          ${e.local_aprox ? '<small class="fraco">Local aproximado (importado da folha por zonas)</small>' : ''}
          ${e.notas ? `<small class="fraco">${esc(e.notas)}</small>` : ''}
        </div>
        <div class="ev-acoes">
          ${e.video_url && /^https?:\/\//i.test(e.video_url) ? `<a class="btn-link" href="${esc(e.video_url)}" target="_blank" rel="noopener">Vídeo</a>` : ''}

    Object.assign(C, { editarId: ev.id, side: ladoNoAlvo(ev, a) || 'casa', ponto: 'fin',

    C.form = { ...Object.fromEntries(CAMPOS_FORM.map(k => [k, ev[k] ?? null])), momento: o.momento, sub_momento: o.sub, mecanismo: o.mecanismo, tempo: o.tempo,

function lerFicheiros(fs) {
  if (!fs.length) return;
  if (fs.length > 1 && App.imp.tipo === 'jogadores') return lerLote(fs);
  if (fs.length > 1) toast('Este tipo de importação aceita um ficheiro de cada vez: usei o primeiro.', 'erro');
  return lerFicheiro(fs[0]);
}

async function lerFicheiro(f) {
  const I = App.imp; I.lote = null;
  try {
    const linhas = await lerFicheiroTabela(f);
    if (!linhas.length) throw new Error('O ficheiro está vazio.');
    I.ficheiro = f;
    if (I.tipo === 'oportunidades') {
      I.tab = detetarFolhaOportunidades(linhas);
      if (!I.tab) throw new Error('não encontrei as colunas da folha de oportunidades (Clube, Adversário, Momento, Zona de Finalização, Golo?).');
    } else I.tab = (I.tipo === 'equipa' && detetarFormatoLiga(linhas)) || prepararTabela(linhas, I.tipo === 'equipa' ? PAPEIS_EQUIPA : PAPEIS_JOGADOR);
    I.equipaNossa = null; I.criarJogos = true;
    // Ficheiro de um só jogador (sem coluna do nome): adivinha o jogador pelo nome do ficheiro.
    I.jogadorNome = I.tipo === 'jogadores' ? adivinharJogador(f.name) : null;
    I.jogoId = null;
    desenharImportacao();
  } catch (err) {
    toast(`Não consegui ler o ficheiro: ${err.message}`, 'erro');
  }
}

function analisarAtual() {
  const I = App.imp;
  I.analise = I.tipo === 'equipa'
    ? analisarEquipa(I.tab, App.cfg, App.d.mapas, App.d.jogos)
    : analisarJogadores(I.tab, App.cfg, App.d.mapas, App.d.jogos, { jogoId: I.jogoId, ladoPadrao: I.lado, jogador: chaveDoNome(I.jogadorNome), criarJogos: I.criarJogos !== false });
}

function desenharAnalise() {

  let resumo = '';
  if (eq && n) {
    const novos = A.jogos.filter(j => !j.existe).length;
    resumo = `${n} ${n === 1 ? 'jogo encontrado' : 'jogos encontrados'}: ${novos} ${novos === 1 ? 'novo' : 'novos'}, ${n - novos} já ${n - novos === 1 ? 'existia (será atualizado)' : 'existiam (serão atualizados)'}. ${A.nMetricas} métricas por jogo.`;

    const nos = A.linhas.filter(l => l.lado === 'nos').length;
    resumo = A.umJogador
      ? `${n} jogos de ${A.linhas[0].jogador}${A.epoca ? ` na época ${A.epoca.slice(0, 4)}/${String(Number(A.epoca.slice(0, 4)) + 1).slice(2)}` : ''}: ${n - A.nNovos > 0 ? `${A.linhas.filter(l => !l.novoJogo).length} ligados a jogos que já existem` : ''}${A.nNovos ? `${n - A.nNovos > 0 ? ', ' : ''}${A.nNovos} ${A.nNovos === 1 ? 'jogo novo' : 'jogos novos'} a criar` : ''}. ${A.nMetricas} métricas por jogo.${A.outrosClubes || A.epocasAnteriores ? ` Ficam de fora ${A.outrosClubes + A.epocasAnteriores} jogos de outros clubes ou épocas anteriores.` : ''}`
      : `${n} registos de jogadores em ${nJogos} ${nJogos === 1 ? 'jogo' : 'jogos'} (${nos} da vossa equipa, ${n - nos} do adversário). ${A.nMetricas} métricas por jogador.`;
  }
  $('#i-analise').innerHTML = `
    <h2>Colunas</h2>
    <p class="nota">Detetei automaticamente as colunas principais. Corrija se alguma estiver errada; todas as restantes colunas numéricas são guardadas como métricas.</p>
    <div class="papeis">
      ${papeis.map(p => `<label>${PAPEIS[p].rotulo}<select data-papel="${p}"><option value="">— nenhuma —</option>${T.colunas.map((c, i) => `<option value="${i}" ${T.papeis[p] === i ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`).join('')}
    </div>
    ${!eq && (T.papeis.jogador === null || T.papeis.jogador === undefined) ? `<div class="grelha-2">
      <label>Jogador deste ficheiro<input id="i-jogador" list="i-jogadores" value="${esc(I.jogadorNome || '')}" autocomplete="off" placeholder="Nome do jogador"><datalist id="i-jogadores">${App.d.plantel.map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist></label>
      ${T.papeis.jogo !== null && T.papeis.jogo !== undefined ? `<label class="em-linha caixa"><input type="checkbox" id="i-criar" ${I.criarJogos !== false ? 'checked' : ''}> Criar os jogos da vossa equipa que ainda não existem na app (por exemplo, taças e jogos europeus)</label>` : ''}
    </div>` : ''}
    ${semData && (T.papeis.jogo === null || T.papeis.jogo === undefined) ? `<div class="grelha-2">
      <label>Jogo deste ficheiro<select id="i-jogo"><option value="">Escolha o jogo…</option>${jogos.map(j => `<option value="${j.id}" ${I.jogoId === j.id ? 'selected' : ''}>${esc(rotuloJogo(j))}</option>`).join('')}</select></label>
      ${T.papeis.equipa === null || T.papeis.equipa === undefined ? `<label>Os jogadores são de<select id="i-lado"><option value="nos" ${I.lado === 'nos' ? 'selected' : ''}>${esc(App.cfg.nome_clube || 'Nós')}</option><option value="adversario" ${I.lado === 'adversario' ? 'selected' : ''}>Adversário</option></select></label>` : ''}
    </div>` : ''}
    ${A.avisos.length ? `<ul class="avisos" role="status">${A.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
    ${n ? `<h2>Pré-visualização</h2><p class="destaque">${esc(resumo)}${A.ignoradas ? ` <span class="fraco">${A.ignoradas} linhas ignoradas (sem data, totais ou sem jogo).</span>` : ''}</p>
      ${eq ? tabelaPreviaEquipa(A.jogos) : tabelaPreviaJogadores(A.linhas)}
      <div class="acoes-esq"><button class="btn btn-prim" id="i-importar">Importar ${n} ${eq ? (n === 1 ? 'jogo' : 'jogos') : 'registos'}</button></div>` : ''}`;
  $$('[data-papel]').forEach(s => s.addEventListener('change', () => {
    const p = s.dataset.papel; const val = s.value === '' ? null : Number(s.value);
    for (const k of Object.keys(T.papeis)) if (k !== p && T.papeis[k] === val && val !== null) T.papeis[k] = null;

  $('#i-criar')?.addEventListener('change', e => { I.criarJogos = e.target.checked; desenharAnalise(); });

  return `<div class="tabela-env"><table class="tabela compacta">
    <thead><tr><th>Data</th><th>Adversário</th><th>Competição</th><th>Local</th><th class="num">Resultado</th><th>Estado</th></tr></thead>
    <tbody>${jogos.map(j => `<tr><td>${fmtData(j.data)}</td><td>${esc(j.adversario)}</td><td>${esc(j.competicao || '–')}</td>

      <td class="num">${Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos) ? `${j.golos_marcados}–${j.golos_sofridos}` : '–'}</td>
      <td>${j.existe ? 'Atualiza' : '<b>Novo</b>'}${j.metricasAdv ? '' : ' <span class="fraco">(sem linha do adversário)</span>'}</td></tr>`).join('')}</tbody></table></div>`;

function tabelaPreviaJogadores(linhas) {
  const mostrar = linhas.slice(0, 40);
  return `<div class="tabela-env"><table class="tabela compacta">
    <thead><tr><th>Jogo</th><th>Estado</th><th>Jogador</th><th>Equipa</th><th>Posição</th><th class="num">Minutos</th><th class="num">Métricas</th></tr></thead>
    <tbody>${mostrar.map(l => `<tr><td>${esc(rotuloJogo(l.jogo, true))}${l.jogo.competicao && l.novoJogo ? ` <span class="fraco">${esc(l.jogo.competicao)}</span>` : ''}</td>
      <td>${l.novoJogo ? '<b>Jogo novo</b>' : l.atualizaData ? `Liga a ${esc(quandoJogo(l.jogo, true))} (+ data${l.resultadoNovo ? ' e resultado' : ''})` : 'Jogo existente'}</td><td>${esc(l.jogador)}</td><td><span class="ponto-cor ${l.lado === 'nos' ? 'nos' : 'adv'}"></span>${esc(l.equipa || '')}</td>
      <td>${esc(l.posicao || '–')}</td><td class="num">${fmtNum(l.minutos, 0)}</td><td class="num">${Object.keys(l.metricas).length}</td></tr>`).join('')}</tbody></table></div>
    ${linhas.length > mostrar.length ? `<p class="nota">E mais ${linhas.length - mostrar.length} registos.</p>` : ''}`;

async function registarImportacao(tipo, linhas, resumo, ficheiro = App.imp.ficheiro) {
  let caminho = null; let avisoFicheiro = null;
  try { caminho = await App.db.carregarFicheiro(ficheiro); } catch (err) { avisoFicheiro = err.message; }
  const imp = await App.db.inserir('importacoes', { tipo, ficheiro: ficheiro.name, caminho_storage: caminho, linhas, resumo });
  return { imp, avisoFicheiro };
}

async function importarEquipa(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const existentes = {}; for (const j of App.d.jogos) existentes[`${j.data}|${norm(j.adversario)}`] = j;
    const novos = A.jogos.filter(j => !j.existe).length;
    const { imp, avisoFicheiro } = await registarImportacao('equipa', A.jogos.length, { novos, atualizados: A.jogos.length - novos });
    // Mantém os valores já registados quando o ficheiro não os traz.
    const linhasJogos = A.jogos.map(j => {
      const ex = existentes[`${j.data}|${norm(j.adversario)}`] || {};
      return {
        data: j.data, adversario: ex.adversario || j.adversario, competicao: j.competicao ?? ex.competicao ?? null, local: j.local ?? ex.local ?? null,
        golos_marcados: j.golos_marcados ?? ex.golos_marcados ?? null, golos_sofridos: j.golos_sofridos ?? ex.golos_sofridos ?? null
      };
    });
    const guardados = await App.db.upsert('jogos', linhasJogos, 'data,adversario');
    const idPorChave = {}; for (const g of guardados) idPorChave[`${g.data}|${norm(g.adversario)}`] = g.id;
    const agora = new Date().toISOString(); const est = [];
    for (const j of A.jogos) {
      const jogo_id = idPorChave[`${j.data}|${norm(j.adversario)}`]; if (!jogo_id) continue;
      est.push({ jogo_id, lado: 'nos', equipa: j.equipaNos, metricas: j.metricasNos, importacao_id: imp.id, updated_at: agora });
      if (j.metricasAdv) est.push({ jogo_id, lado: 'adversario', equipa: j.equipaAdv, metricas: j.metricasAdv, importacao_id: imp.id, updated_at: agora });
    }
    await App.db.upsert('estatisticas_equipa', est, 'jogo_id,lado');
    terminarImportacao(`${A.jogos.length} ${A.jogos.length === 1 ? 'jogo importado' : 'jogos importados'} (${novos} ${novos === 1 ? 'novo' : 'novos'}).`, avisoFicheiro);
  } catch (err) { btn.disabled = false; btn.textContent = 'Tentar outra vez'; toast(err.message, 'erro'); }
}

async function importarJogadores(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const { novos, avisoFicheiro } = await gravarJogadores(A, App.imp.ficheiro);
    terminarImportacao(A.umJogador ? `${A.linhas.length} jogos de ${A.linhas[0].jogador} importados${novos ? ` (${novos} ${novos === 1 ? 'jogo novo criado' : 'jogos novos criados'})` : ''}.` : `${A.linhas.length} registos de jogadores importados.`, avisoFicheiro);
  } catch (err) { btn.disabled = false; btn.textContent = 'Tentar outra vez'; toast(err.message, 'erro'); }
}

// Grava uma análise de jogadores (um ficheiro). Devolve o número de jogos novos criados.
async function gravarJogadores(A, ficheiro) {
  const { imp, avisoFicheiro } = await registarImportacao('jogadores', A.linhas.length, { jogador: A.umJogador ? A.linhas[0]?.jogador : null, jogos_novos: A.nNovos || 0 }, ficheiro);
  const agora = new Date().toISOString();
  // 1) Jogos novos (de outras competições) e 2) datas em falta nos jogos que vieram do ficheiro da liga.
  const novos = [...new Set(A.linhas.filter(l => l.novoJogo).map(l => l.novoJogo))];
  if (novos.length) {
    const guardados = await App.db.upsert('jogos', novos.map(j => ({ data: j.data, adversario: j.adversario, competicao: j.competicao, local: j.local, golos_marcados: j.golos_marcados, golos_sofridos: j.golos_sofridos })), 'data,adversario');
    for (const l of A.linhas) if (l.novoJogo) l.jogo_id = guardados.find(g => g.data === l.novoJogo.data && norm(g.adversario) === norm(l.novoJogo.adversario))?.id;
  }
  for (const l of A.linhas) {
    const patch = { ...(l.atualizaData ? { data: l.atualizaData } : {}), ...(l.resultadoNovo || {}) };
    if (l.jogo_id && Object.keys(patch).length) await App.db.atualizar('jogos', { id: l.jogo_id }, patch);
  }
  await App.db.upsert('estatisticas_jogador', A.linhas.filter(l => l.jogo_id).map(l => ({
    jogo_id: l.jogo_id, jogador: l.jogador, lado: l.lado, equipa: l.equipa, posicao: l.posicao, minutos: l.minutos, metricas: l.metricas, importacao_id: imp.id, updated_at: agora
  })), 'jogo_id,jogador,lado');
  return { novos: new Set(novos.map(j => `${j.data}|${norm(j.adversario)}`)).size, avisoFicheiro };
}

function chaveDoNome(nome) { const pj = App.d.plantel.find(p => norm(p.nome) === norm(nome)); return pj ? chaveEstat(pj) : nome; }

async function lerLote(fs) {
  const I = App.imp; const lote = [];
  for (const f of fs) {
    const item = { ficheiro: f, jogadorNome: adivinharJogador(f.name) };
    try {
      const linhas = await lerFicheiroTabela(f); if (!linhas.length) throw new Error('o ficheiro está vazio');
      item.tab = prepararTabela(linhas, PAPEIS_JOGADOR);
    } catch (err) { item.erro = err.message; }
    lote.push(item);
  }
  Object.assign(I, { lote, tab: null, ficheiro: null, analise: null, jogoId: null });
  desenharImportacao();
}
function analisarItem(item) {
  item.analise = null; if (item.erro) return;
  const T = item.tab;
  if ((T.papeis.data === null || T.papeis.data === undefined) && (T.papeis.jogo === null || T.papeis.jogo === undefined)) { item.problema = 'sem datas nem jogos: importe este ficheiro sozinho para escolher o jogo'; return; }
  if ((T.papeis.jogador === null || T.papeis.jogador === undefined) && !item.jogadorNome) { item.problema = 'indique o jogador'; return; }
  item.problema = null;
  item.analise = analisarJogadores(T, App.cfg, App.d.mapas, App.d.jogos, { jogoId: null, ladoPadrao: 'nos', jogador: chaveDoNome(item.jogadorNome), criarJogos: true });
}
function desenharLote() {
  const I = App.imp; const lote = I.lote;
  lote.forEach(analisarItem);
  const validos = lote.filter(it => it.analise?.linhas.length);

        <td>${semJogadorCol(it) ? `<input data-lote="${k}" list="i-jogadores" value="${esc(it.jogadorNome || '')}" autocomplete="off" placeholder="Nome do jogador" aria-label="Jogador de ${esc(it.ficheiro.name)}">` : '<span class="fraco">vários (coluna do ficheiro)</span>'}</td>
        <td>${estado(it)}</td></tr>`).join('')}</tbody>
    </table></div>
    <datalist id="i-jogadores">${App.d.plantel.map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist>
    <div class="acoes-esq">
      ${validos.length ? `<button class="btn btn-prim" id="i-importar-lote">Importar ${validos.length} ${validos.length === 1 ? 'ficheiro' : 'ficheiros'}</button>` : ''}
      <button class="btn" id="i-cancelar-lote">Cancelar</button>
    </div>`;
  $$('[data-lote]').forEach(inp => inp.addEventListener('change', () => { lote[Number(inp.dataset.lote)].jogadorNome = inp.value.trim() || null; desenharLote(); }));
  $('#i-cancelar-lote').addEventListener('click', () => { I.lote = null; desenharImportacao(); });
  $('#i-importar-lote')?.addEventListener('click', e => importarLote(e.currentTarget));
}
async function importarLote(btn) {
  const I = App.imp; const itens = I.lote.filter(it => it.analise?.linhas.length);
  btn.disabled = true; let feitos = 0, jogos = 0, novos = 0; const falhas = [], avisos = [];
  for (const it of itens) {
    btn.textContent = `A importar ${feitos + falhas.length + 1} de ${itens.length}…`;
    try {
      analisarItem(it); // com os jogos já atualizados pelos ficheiros anteriores
      if (!it.analise?.linhas.length) throw new Error('sem jogos');
      const r = await gravarJogadores(it.analise, it.ficheiro);
      feitos++; jogos += it.analise.linhas.length; novos += r.novos; if (r.avisoFicheiro) avisos.push(r.avisoFicheiro);
      await carregarDados();
    } catch (err) { falhas.push(`${it.jogadorNome || it.ficheiro.name} (${err.message})`); }
  }
  I.lote = null;
  if (falhas.length) toast(`Não foi possível importar: ${falhas.join('; ')}`, 'erro');
  terminarImportacao(`${feitos} ${feitos === 1 ? 'jogador importado' : 'jogadores importados'} (${jogos} registos de jogos${novos ? `, ${novos} ${novos === 1 ? 'jogo novo' : 'jogos novos'}` : ''}).`, avisos[0]);
}

async function terminarImportacao(msg, avisoFicheiro) {

async function importarLiga(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const todos = [...A.jogos, ...A.porJogar];
    const { imp, avisoFicheiro } = await registarImportacao('liga', A.liga.length, { equipa: A.nossa, jogos: A.jogos.length, por_jogar: A.porJogar.length });
    // Jogos da vossa equipa: mantém o que já estava registado (data, notas) quando o ficheiro não traz o valor.
    const ex = {}; for (const j of App.d.jogos) ex[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`] = j;
    const linhasJogos = todos.map(j => {
      const e = ex[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`] || {};
      return { competicao: j.competicao, jornada: j.jornada, adversario: e.adversario || j.adversario, data: e.data ?? null, local: j.local ?? e.local ?? null,
        golos_marcados: j.golos_marcados ?? e.golos_marcados ?? null, golos_sofridos: j.golos_sofridos ?? e.golos_sofridos ?? null };
    });
    const guardados = await App.db.upsert('jogos', linhasJogos, 'competicao,jornada,adversario');
    const idPor = {}; for (const g of guardados) idPor[`${norm(g.competicao)}|${g.jornada}|${norm(g.adversario)}`] = g.id;
    const agora = new Date().toISOString(); const est = [];
    for (const j of A.jogos) {
      const jogo_id = idPor[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`]; if (!jogo_id) continue;
      est.push({ jogo_id, lado: 'nos', equipa: j.equipaNos, metricas: j.metricasNos, importacao_id: imp.id, updated_at: agora });
      if (j.metricasAdv) est.push({ jogo_id, lado: 'adversario', equipa: j.equipaAdv, metricas: j.metricasAdv, importacao_id: imp.id, updated_at: agora });
    }
    if (est.length) await App.db.upsert('estatisticas_equipa', est, 'jogo_id,lado');
    await App.db.upsert('estatisticas_liga', A.liga.map(r => ({
      competicao: r.competicao, jornada: r.jornada, equipa: r.equipa, adversario: r.adversario, local: r.local,
      golos: r.golos, golos_sofridos: r.golos_sofridos, metricas: r.metricas, importacao_id: imp.id, updated_at: agora
    })), 'competicao,jornada,equipa,adversario');
    // O ficheiro é a versão atual da competição: registos que já não constam dele (ex.: um jogo mudado de jornada) são removidos.
    const novas = new Set(A.liga.map(r => `${norm(r.competicao)}|${r.jornada}|${norm(r.equipa)}|${norm(r.adversario)}`));
    const comps = new Set(A.liga.map(r => norm(r.competicao)));
    const antigos = (App.d.liga || []).filter(r => comps.has(norm(r.competicao)) && !novas.has(`${norm(r.competicao)}|${r.jornada}|${norm(r.equipa)}|${norm(r.adversario)}`));
    for (const r of antigos) await App.db.apagar('estatisticas_liga', { id: r.id });
    // Jogos do campeonato: atualiza jornada e resultado; remove os que já não existem e não têm oportunidades codificadas.
    try {
      const nossaChave = j => `${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`;
      const linhasP = A.partidas.map(p => {
        const nossa = norm(p.casa) === norm(A.nossa) || mesmaEquipa(p.casa, A.nossa) ? 'casa' : norm(p.fora) === norm(A.nossa) || mesmaEquipa(p.fora, A.nossa) ? 'fora' : null;
        const jogo_id = nossa ? idPor[nossaChave({ competicao: p.competicao, jornada: p.jornada, adversario: nossa === 'casa' ? p.fora : p.casa })] || null : null;
        return { ...p, jogo_id, updated_at: agora };
      });
      await App.db.upsert('partidas', linhasP, 'competicao,casa,fora');
      const chavesP = new Set(linhasP.map(p => `${norm(p.competicao)}|${norm(p.casa)}|${norm(p.fora)}`));
      const comps = new Set(linhasP.map(p => norm(p.competicao)));
      const comEventos = new Set(App.d.eventos.map(e => e.partida_id).filter(Boolean));
      for (const p of App.d.partidas.filter(p => comps.has(norm(p.competicao)) && !chavesP.has(`${norm(p.competicao)}|${norm(p.casa)}|${norm(p.fora)}`) && !comEventos.has(p.id))) await App.db.apagar('partidas', { id: p.id });
    } catch (err) {
      if (/partidas/i.test(err.message)) toast('Os jogos do campeonato não foram guardados: corra outra vez o schema.sql no Supabase para os poder codificar.', 'erro'); else throw err;
    }
    // A equipa escolhida passa a ser reconhecida nas próximas importações.
    const nomes = [App.cfg.nome_clube, ...(App.cfg.nomes_alternativos || [])].map(norm);
    if (!nomes.includes(norm(A.nossa))) {
      const patch = App.cfg.nome_clube ? { nomes_alternativos: [...(App.cfg.nomes_alternativos || []), A.nossa] } : { nome_clube: A.nossa };
      await App.db.upsert('configuracao', [{ id: 1, ...patch, updated_at: agora }], 'id');
    }
    terminarImportacao(`${A.jogos.length} jogos de ${A.nossa} e ${A.liga.length} registos da liga importados${antigos.length ? `; ${antigos.length} ${antigos.length === 1 ? 'registo antigo removido' : 'registos antigos removidos'}` : ''}.`, avisoFicheiro);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Tentar outra vez';
    toast(/estatisticas_liga|jornada|importacoes_tipo/i.test(err.message) ? 'A base de dados precisa de ser atualizada para este ficheiro. Corra outra vez o schema.sql no Supabase (SQL Editor).' : err.message, 'erro');
  }
}

// "Player_stats_Volnei.xlsx" -> "Volnei" (procura no plantel pelo nome, apelido ou nome no Wyscout).
function adivinharJogador(ficheiro) {
  const n = norm(ficheiro.replace(/\.[^.]+$/, '').replace(/player|stats|estatisticas|jogador|wyscout/gi, ' '));
  if (!n) return null;
  const pj = App.d.plantel.find(p => [p.nome, p.nome_wyscout].filter(Boolean).some(x => n.includes(norm(x))))
    || App.d.plantel.find(p => { const partes = norm(p.nome).split(' '); return partes.length > 1 && n.split(' ').includes(partes[partes.length - 1]); });
  if (pj) return pj.nome;
  // Só o primeiro nome no ficheiro: aceita se corresponder a um único jogador do plantel.
  const pelo1 = App.d.plantel.filter(p => n.split(' ').includes(norm(p.nome).split(' ')[0]));
  if (pelo1.length === 1) return pelo1[0].nome;
  const palavras = ficheiro.replace(/\.[^.]+$/, '').replace(/player|stats|estat[ií]sticas|jogador|wyscout/gi, ' ').split(/[_\s-]+/).filter(Boolean);
  return palavras.length ? palavras.join(' ') : null;
}

async function importarFolha(btn) {
  const A = App.imp.analise; btn.disabled = true; btn.textContent = 'A importar…';
  try {
    const { imp, avisoFicheiro } = await registarImportacao('oportunidades', A.registos.length, { jogos_novos: A.novos.length });
    // 1) Jogos que faltavam no ficheiro da liga.
    if (A.novos.length) {
      const criados = await App.db.upsert('partidas', A.novos.map(p => ({ competicao: p.competicao, jornada: p.jornada, casa: p.casa, fora: p.fora })), 'competicao,casa,fora');
      for (const p of A.novos) p.id = criados.find(c => norm(c.casa) === norm(p.casa) && norm(c.fora) === norm(p.fora))?.id;
    }
    // 2) Treinadores de cada equipa em cada jogo.
    const porPartida = {};
    for (const [k, nome] of A.treinadores) {
      const [chave, lado] = [k.slice(0, k.lastIndexOf('|')), k.slice(k.lastIndexOf('|') + 1)];
      const id = chave.startsWith('n:') ? A.novos.find(p => `n:${p.jornada}|${norm(p.casa)}|${norm(p.fora)}` === chave)?.id : chave;
      if (id) (porPartida[id] ||= {})[lado === 'casa' ? 'treinador_casa' : 'treinador_fora'] = nome;
    }
    for (const [id, patch] of Object.entries(porPartida)) await App.db.atualizar('partidas', { id }, patch);
    // 3) Substitui as oportunidades que vieram antes da folha nos mesmos jogos.
    const ids = [...new Set(A.registos.map(r => r.partida.id).filter(Boolean))];
    for (const id of ids) await App.db.apagar('eventos', { partida_id: id, origem: 'folha' });
    // 4) Oportunidades (ligadas ao jogo do SCUT quando é o caso).
    const linhas = A.registos.filter(r => r.partida.id).map(r => {
      const { partida, lado, ...ev } = r;
      const jogo_id = partida.jogo_id || null;
      return { ...ev, partida_id: partida.id, jogo_id, lado: jogo_id ? (eNossaEquipa(r.equipa) ? 'nos' : 'adversario') : null };
    });
    await App.db.inserirVarios('eventos', linhas);
    terminarImportacao(`${linhas.length} oportunidades importadas.`, avisoFicheiro);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Tentar outra vez';
    toast(/partida|sub_momento|origem|column|importacoes_tipo/i.test(err.message) ? 'A base de dados precisa de ser atualizada. Corra outra vez o schema.sql no Supabase (SQL Editor).' : err.message, 'erro');
  }
}

</script>
