<style>
:root {
  color-scheme: light;
  --fundo: #F3F4F1;
  --papel: #FFFFFF;
  --tinta: #17202B;
  --tinta2: #4B5563;
  --fraco: #5F6672;
  --linha: #DADDD6;
  --linha-forte: #B9BEB5;
  --nos: #2453C9;
  --nos-claro: #E6ECFA;
  --adv: #C77A0F;
  --adv-escuro: #995C06;
  --relva: #D7E3D1;
  --perigo: #B42318;
  --ok: #1F7A4D;
  --raio: 6px;
  --marinho: #13284A;
  --marinho-hover: #1E3864;
  --bordeaux: #5C1E29;
  --dourado: #B88A4A;
  --dourado-claro: #D8B27A;
  --papel-fundo: #EAE7E0;
  --cond: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papel-fundo); color: var(--tinta);
  font: 400 16px/1.5 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { font-family: var(--cond); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -0.005em; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.25rem; margin-bottom: .6rem; }
h3 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
p { margin: 0 0 .75rem; }
a { color: var(--nos); }
code { font-size: .9em; background: var(--fundo); padding: 0 .3em; border-radius: 3px; }
b { font-weight: 600; }
  .so-impressao { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nota { color: var(--fraco); font-size: .92rem; max-width: 72ch; }
.fraco { color: var(--fraco); }
.destaque { font-size: 1.05rem; max-width: 72ch; }
.erro { color: var(--perigo); font-weight: 500; }
:focus-visible { outline: 2px solid var(--nos); outline-offset: 2px; }
#vista:focus { outline: none; }

/* ---------- Botões e campos ---------- */
.btn {
  font: 500 .95rem/1 'Barlow', sans-serif; padding: .62rem 1rem; border-radius: var(--raio);
  border: 1px solid var(--linha-forte); background: var(--papel); color: var(--tinta); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--tinta2); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn-prim { background: var(--marinho); border-color: var(--marinho); color: #fff; }
.btn-prim:hover { background: var(--marinho-hover); }
.btn-perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }
.btn-link { background: none; border: 0; padding: .2rem .1rem; color: var(--nos); font: inherit; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; }
.btn-link:hover { text-decoration-color: currentColor; }
.btn-link.perigo { color: var(--perigo); }
label { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; font-weight: 500; color: var(--tinta2); }
label.em-linha { flex-direction: row; align-items: center; gap: .6rem; }
input:not([type=radio]):not([type=checkbox]):not([type=file]), select, textarea {
  font: 400 1rem/1.3 'Barlow', sans-serif; color: var(--tinta); background: var(--papel);
  border: 1px solid var(--linha-forte); border-radius: var(--raio); padding: .55rem .65rem; min-width: 0; width: 100%;
}
textarea { resize: vertical; line-height: 1.45; }
input:disabled, textarea:disabled { background: var(--fundo); color: var(--tinta2); }
.pilha { display: flex; flex-direction: column; gap: 1rem; }
.grelha-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
.alinhar-fim { align-items: end; }
.acoes, .acoes-esq { display: flex; gap: .6rem; flex-wrap: wrap; }
.acoes { justify-content: flex-end; }

/* ---------- Ecrã de entrada ---------- */
.entrada { box-shadow: 0 18px 40px rgba(10,30,54,.12); }
.ecra-entrada { display: grid; place-items: center; min-height: 100vh; padding: 1rem; }
.entrada { width: 100%; max-width: 420px; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 2rem 1.75rem; }
.entrada h1 { margin: 1.5rem 0 .75rem; }
.entrada-marca .marca { height: 56px; }
.entrada-marca { display: flex; align-items: center; gap: .75rem; font-family: var(--cond); font-weight: 600; color: var(--tinta2); }
.entrada > .btn { width: 100%; }
.separador { display: flex; align-items: center; gap: .75rem; color: var(--fraco); font-size: .85rem; margin: 1.25rem 0; }
.separador::before, .separador::after { content: ''; flex: 1; border-top: 1px solid var(--linha); }
.marca { width: auto; height: 44px; flex: none; object-fit: contain; }
.marca-pequena { height: 30px; }

}
.ecra-entrada .fundo-img { left: 0; }
.com-lateral { --lat: 248px; padding-left: var(--lat); }
.lateral {
  position: fixed; top: 0; bottom: 0; left: 0; width: var(--lat); z-index: 30;
  display: flex; flex-direction: column; gap: 1.5rem; padding: 1.4rem 0 1.1rem;
  background: var(--marinho); color: #E6E3DC; border-right: 1px solid var(--dourado);
}
.lateral-marca { display: flex; align-items: center; gap: .7rem; padding: 0 1.25rem; }
.lateral-marca b { display: block; font-family: var(--cond); font-size: 1.2rem; line-height: 1.1; color: #fff; }
.lateral-marca span { display: block; font-size: .8rem; color: #A9B3C2; }
.lateral-nav { display: flex; flex-direction: column; gap: .15rem; padding: 0 .6rem; }
.lateral-nav a {
  display: flex; align-items: center; gap: .75rem; padding: .62rem .75rem; border-radius: 6px;
  color: #C9CFD8; text-decoration: none; font-weight: 500; position: relative;
}
.lateral-nav a svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lateral-nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.lateral-nav a[aria-current] { background: rgba(255,255,255,.1); color: #fff; }
.lateral-nav a[aria-current]::before { content: ''; position: absolute; left: -.6rem; top: .45rem; bottom: .45rem; width: 3px; border-radius: 0 3px 3px 0; background: var(--dourado-claro); }
.lateral-nav a[aria-current] svg { color: var(--dourado-claro); }
.lateral-nav a:focus-visible { outline-color: var(--dourado-claro); }
.lateral-conta { margin-top: auto; padding: 1rem 1.25rem 0; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; font-size: .85rem; color: #A9B3C2; }
.lateral-conta .conta-email { overflow-wrap: anywhere; }
.etiqueta-demo { background: #FFF4DC; color: #6B4605; border: 1px solid #F0D79E; padding: .15rem .55rem; border-radius: 999px; font-weight: 500; }
.barra-movel { display: none; }
.cortina { position: fixed; inset: 0; z-index: 25; background: rgba(10,30,54,.45); }
@media (max-width: 900px) {
  .com-lateral { --lat: 0px; padding-left: 0; }
  .lateral { width: min(280px, 85vw); transform: translateX(-100%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
  .lateral.aberta { transform: none; visibility: visible; transition: transform .2s ease; }
  .barra-movel {
    display: flex; align-items: center; gap: .75rem; position: sticky; top: 0; z-index: 20;
    padding: .55rem max(16px, env(safe-area-inset-right, 0px)) .55rem max(16px, env(safe-area-inset-left, 0px));
    background: var(--marinho); color: #fff; border-bottom: 1px solid var(--dourado);
  }
  .barra-movel b { font-family: var(--cond); font-size: 1.1rem; }
  .barra-movel span { color: #A9B3C2; font-size: .9rem; margin-left: auto; }
  .botao-menu { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: none; color: #fff; cursor: pointer; }
  .botao-menu svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
}
@media (prefers-reduced-motion: reduce) { .lateral, .lateral.aberta { transition: none; } }

/* ---------- Vistas ---------- */
main#vista { max-width: 1240px; margin: 0 auto; padding-block: 1.9rem 4rem; padding-left: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-left, 0px)); padding-right: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-right, 0px)); }
.cabecalho-vista { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem 1.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.cabecalho-vista h1 + .nota { margin: .35rem 0 0; }
.bloco { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 1.25rem clamp(1rem, 2.5vw, 1.5rem); margin-bottom: 1.25rem; }
.bloco-cab { display: flex; justify-content: space-between; align-items: center; gap: .75rem 1rem; flex-wrap: wrap; margin-bottom: .6rem; }
.bloco-cab h2 { margin: 0; }
.vazio { background: var(--papel); border: 1px dashed var(--linha-forte); border-radius: 10px; padding: 2.5rem 1.5rem; text-align: center; color: var(--tinta2); }
.vazio p:last-child { margin: 0; }
.vazio-curto { padding: 1rem 0; }

/* ---------- Tabelas ---------- */
.tabela-env { overflow-x: auto; margin: 0 0 .75rem; position: relative; }
.tabela { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tabela th { text-align: left; font-weight: 500; color: var(--fraco); font-size: .85rem; padding: .5rem .7rem; border-bottom: 1px solid var(--linha-forte); white-space: nowrap; vertical-align: bottom; }
.tabela td { padding: .55rem .7rem; border-bottom: 1px solid var(--linha); vertical-align: middle; }
.tabela tbody tr:hover td { background: #FAFAF8; }
.tabela .num { text-align: right; white-space: nowrap; }
#f-jogos td:first-child { white-space: nowrap; }
.tabela.compacta td { padding: .4rem .7rem; }
.acoes-linha { text-align: right; white-space: nowrap; }
.acoes-linha .btn-link + .btn-link { margin-left: .75rem; }
.ordenar { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
th[aria-sort=ascending] .ordenar, th[aria-sort=descending] .ordenar { color: var(--tinta); }
.res { display: inline-grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 4px; font-size: .78rem; font-weight: 600; margin-right: .3rem; }
.res-V { background: #DDF1E5; color: #145233; }
.res-E { background: #ECEDEA; color: #3A4150; }
.res-D { background: #FBE2DF; color: #8A1C12; }
.ponto-cor { display: inline-block; width: .65rem; height: .65rem; border-radius: 50%; margin-right: .45rem; vertical-align: 0; flex: none; }
.ponto-cor.nos { background: var(--nos); }
.ponto-cor.adv { background: var(--adv); }
.seta { color: var(--tinta2); }

/* ---------- Chips e segmentados ---------- */
.chip input, .chip-check input, .segmentado input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chips, .chips-lista { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip, .chip-check { flex-direction: row; font-weight: 400; color: var(--tinta); cursor: pointer; position: relative; }
.chip span, .chip-check span {
  display: inline-block; padding: .38rem .75rem; border: 1px solid var(--linha-forte); border-radius: 999px; background: var(--papel);
  font-size: .9rem; line-height: 1.2; user-select: none;
}
.chip:hover span, .chip-check:hover span { border-color: var(--tinta2); }
.chip input:checked + span { background: var(--marinho); border-color: var(--marinho); color: #fff; }
.chip-check input:checked + span { background: var(--nos-claro); border-color: var(--nos); color: #13327F; }
.chip-check input:checked + span::before { content: '✓ '; }
.chip input:focus-visible + span, .chip-check input:focus-visible + span, .segmentado input:focus-visible + span { outline: 2px solid var(--nos); outline-offset: 2px; }
.chip-check input:disabled + span { opacity: .7; cursor: default; }
.grupo-chips { border: 0; padding: 0; margin: 0; min-width: 0; }
.grupo-chips legend { font-size: .9rem; font-weight: 500; color: var(--tinta2); padding: 0; margin-bottom: .35rem; }
.segmentado { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: var(--raio); background: var(--papel); padding: 3px; gap: 3px; max-width: 100%; }
.segmentado label { flex: 1; color: var(--tinta2); font-size: .95rem; cursor: pointer; position: relative; }
.segmentado span { display: block; text-align: center; padding: .48rem .9rem; border-radius: 4px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segmentado label:hover span { color: var(--tinta); }
.segmentado input:checked + span { background: var(--marinho); color: #fff; }
.segmentado.lados .lado-nos input:checked + span { background: var(--nos); }
.segmentado.lados .lado-adv input:checked + span { background: var(--adv-escuro); }
.segmentado.largo { margin-bottom: 1.25rem; }
@media (max-width: 520px) { .segmentado.largo { display: flex; } .segmentado.largo span { white-space: normal; padding-inline: .5rem; } }
.alternar { display: flex; gap: .4rem; flex-wrap: wrap; }

/* ---------- Relatório ---------- */
.filtros { display: flex; flex-wrap: wrap; gap: .75rem 1rem; margin-bottom: 1.25rem; }
.filtros label { min-width: 170px; }
.placar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--marinho); color: #fff; border-bottom: 3px solid var(--dourado);
  border-radius: 10px; margin-bottom: 1.25rem; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.placar-cel { padding: 1rem 1.25rem 1.1rem; border-right: 1px solid #2A3E60; display: flex; flex-direction: column; gap: .15rem; }
.placar-cel:last-child { border-right: 0; }
.placar-rot { font-size: .85rem; color: #B7BFCA; }
.placar-val { font-family: var(--cond); font-weight: 600; font-size: 2.1rem; line-height: 1.05; }

}

function fmtSinal(n, casas = 1) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '–';
  const t = fmtNum(Math.abs(n), casas);
  return n > 0 ? `+${t}` : n < 0 ? `−${t}` : t;
}

function media(arr) {
  const v = arr.filter(x => x !== null && x !== undefined && Number.isFinite(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function soma(arr) {
  return arr.filter(x => Number.isFinite(x)).reduce((a, b) => a + b, 0);
}

function toast(msg, tipo = 'ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${tipo}`;
  el.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'erro' ? 7000 : 3200);
}

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch { /* sem armazenamento */ } }

function confirmar(msg, botao = 'Apagar') {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.className = 'dialogo';
    d.innerHTML = `<p>${esc(msg)}</p><div class="acoes"><button class="btn" value="nao">Cancelar</button><button class="btn btn-perigo" value="sim">${esc(botao)}</button></div>`;
    document.body.appendChild(d);
    d.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      d.close(); d.remove(); resolve(b.value === 'sim');
    });
    d.addEventListener('cancel', () => { d.remove(); resolve(false); });
    d.showModal();
  });
}

// ---------- Acesso aos dados ----------
// Duas implementações com a mesma interface:
//   SupaDB  -> o vosso projeto Supabase
//   LocalDB -> modo de demonstração (dados de exemplo guardados no browser)

const TABELAS_CHAVE = { mapeamento_nomes: ['tipo', 'original'] };
const BUCKET = 'exportacoes-wyscout';

class SupaDB {
  constructor(url, chave) {
    this.modo = 'supabase';
    this.url = url;
    this.sb = window.supabase.createClient(url, chave);
  }
  _ok({ data, error }) {
    if (error) throw new Error(traduzErro(error.message || String(error)));
    return data;
  }
  async sessao() { return this._ok(await this.sb.auth.getSession()).session; }
  async entrar(email, password) { this._ok(await this.sb.auth.signInWithPassword({ email, password })); }
  async sair() { await this.sb.auth.signOut(); }
  async perfil() {
    const { user } = this._ok(await this.sb.auth.getUser());
    const p = this._ok(await this.sb.from('perfis').select('*').eq('id', user.id).maybeSingle());
    return p || { id: user.id, email: user.email, papel: 'equipa_tecnica' };
  }
  // Lê tudo, página a página (o Supabase devolve no máximo 1000 linhas por pedido).
  async listar(tabela, ordem = 'created_at') {
    const pagina = 1000; let todas = []; let de = 0;
    for (;;) {
      let q = this.sb.from(tabela).select('*').order(ordem, { ascending: true });
      if (ordem !== 'id' && !TABELAS_CHAVE[tabela]) q = q.order('id', { ascending: true });
      const linhas = this._ok(await q.range(de, de + pagina - 1));
      todas = todas.concat(linhas);
      if (linhas.length < pagina) return todas;
      de += pagina;
    }
  }
  async upsert(tabela, linhas, onConflict) {
    let out = [];
    for (let i = 0; i < linhas.length; i += 500) {
      const parte = linhas.slice(i, i + 500);
      out = out.concat(this._ok(await this.sb.from(tabela).upsert(parte, { onConflict }).select()));
    }
    return out;
  }
  async inserir(tabela, linha) { return this._ok(await this.sb.from(tabela).insert(linha).select().single()); }
  async atualizar(tabela, filtro, patch) { return this._ok(await this.sb.from(tabela).update(patch).match(filtro).select()); }
  async apagar(tabela, filtro) { this._ok(await this.sb.from(tabela).delete().match(filtro)); }
  async carregarFicheiro(ficheiro) {
    const nome = ficheiro.name.normalize('NFD').replace(/[^\w.-]+/g, '_');
    const caminho = `${new Date().toISOString().slice(0, 10)}/${Date.now()}-${nome}`;
    this._ok(await this.sb.storage.from(BUCKET).upload(caminho, ficheiro, { upsert: false }));
    return caminho;
  }
}

function traduzErro(msg) {
  if (/Invalid login credentials/i.test(msg)) return 'Email ou palavra-passe incorretos.';
  if (/Email not confirmed/i.test(msg)) return 'Este email ainda não foi confirmado. Confirme-o no Supabase (Authentication > Users).';
  if (/row-level security/i.test(msg)) return 'Sem permissão: só utilizadores do departamento podem alterar dados.';
  if (/Failed to fetch|NetworkError/i.test(msg)) return 'Não foi possível ligar ao Supabase. Verifique a internet e o URL do projeto.';
  if (/relation .* does not exist|Could not find the table/i.test(msg)) return 'As tabelas não existem. Corra o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/column .*(tm_id|tm_url|nacionalidade)|'(tm_id|tm_url|nacionalidade)' column/i.test(msg)) return 'Falta atualizar a base de dados para o Transfermarkt. Corra outra vez o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/Bucket not found/i.test(msg)) return 'O espaço de ficheiros não existe. Corra o ficheiro schema.sql no Supabase.';
  return msg;
}

class LocalDB {
  constructor() {
    this.modo = 'demo';
    this.dados = lsGet('analise_demo_v3') || null;
    if (!this.dados) { this.dados = gerarDemo(); this._guardar(); }
  }
  _guardar() { lsSet('analise_demo_v3', this.dados); }
  _t(tabela) { return (this.dados[tabela] ||= []); }
  async sessao() { return { demo: true }; }
  async entrar() {}
  async sair() {}
  async perfil() { return { id: 'demo', email: 'demonstracao@clube.pt', papel: 'departamento' }; }
  async listar(tabela, ordem = 'created_at') {
    const l = this._t(tabela).map(r => structuredClone(r));
    return l.sort((a, b) => String(a[ordem] ?? '').localeCompare(String(b[ordem] ?? '')));
  }
  _completar(tabela, linha) {
    const agora = new Date().toISOString();
    const r = { ...linha };
    if (!TABELAS_CHAVE[tabela] && !r.id) r.id = uuid();
    if (!('created_at' in r) && tabela !== 'configuracao' && !TABELAS_CHAVE[tabela]) r.created_at = agora;
    if (tabela.startsWith('estatisticas')) r.updated_at = agora;
    return r;
  }
  async upsert(tabela, linhas, onConflict) {
    const chaves = onConflict.split(',').map(s => s.trim());
    const t = this._t(tabela); const out = [];
    for (const linha of linhas) {
      const ex = t.find(r => chaves.every(k => String(r[k]) === String(linha[k])));
      if (ex) { Object.assign(ex, linha); if (tabela.startsWith('estatisticas')) ex.updated_at = new Date().toISOString(); out.push(structuredClone(ex)); }
      else { const n = this._completar(tabela, linha); t.push(n); out.push(structuredClone(n)); }
    }
    this._guardar(); return out;
  }
  async inserir(tabela, linha) {
    const n = this._completar(tabela, linha); this._t(tabela).push(n); this._guardar(); return structuredClone(n);
  }
  async atualizar(tabela, filtro, patch) {
    const out = [];
    for (const r of this._t(tabela)) {
      if (Object.entries(filtro).every(([k, v]) => String(r[k]) === String(v))) { Object.assign(r, patch); out.push(structuredClone(r)); }
    }
    this._guardar(); return out;
  }
  async apagar(tabela, filtro) {
    const corresponde = r => Object.entries(filtro).every(([k, v]) => String(r[k]) === String(v));
    const apagados = this._t(tabela).filter(corresponde);
    this.dados[tabela] = this._t(tabela).filter(r => !corresponde(r));
    if (tabela === 'jogos') { // apagar em cascata, como no Supabase
      const ids = new Set(apagados.map(r => r.id));
      for (const t of ['estatisticas_equipa', 'estatisticas_jogador', 'eventos']) this.dados[t] = this._t(t).filter(r => !ids.has(r.jogo_id));
    }
    this._guardar();
  }
  async carregarFicheiro(f) { return `demonstracao/${f.name}`; }
  repor() { this.dados = gerarDemo(); this._guardar(); }
}

// ---------- Dados de demonstração (fictícios) ----------
function gerarDemo() {
  let semente = 20261110;
  const rnd = () => { semente = (semente * 1664525 + 1013904223) % 4294967296; return semente / 4294967296; };
  const entre = (a, b) => a + rnd() * (b - a);
  const inteiro = (a, b) => Math.floor(entre(a, b + 1));
  const escolher = arr => arr[Math.floor(rnd() * arr.length)];
  const r1 = n => Math.round(n * 10) / 10;
  const r2 = n => Math.round(n * 100) / 100;

  const clube = 'SCUT';
  const adversarios = ['Estrela da Serra', 'União de Vale Verde', 'Atlético Costa Norte', 'SC Planície', 'Académico do Rio',
    'Desportivo da Barra', 'GD Alvorada', 'Naval do Sul', 'FC Montalvo', 'Juventude Lezíria', 'Os Mareantes', 'SC Penedo', 'Grupo Recreativo Tojal', 'AD Cabeço'];
  const plantel = [
    ['Rui Calado', 'GR'], ['Tiago Mendes', 'DD'], ['Bruno Faria', 'DC'], ['Hugo Teles', 'DC'], ['Diogo Lapa', 'DE'],
    ['Nuno Brito', 'MDC'], ['André Sousa', 'MC'], ['Filipe Rocha', 'MC'], ['Luís Pinho', 'ED'], ['Gonçalo Reis', 'EE'],
    ['Marco Viana', 'PL'], ['Pedro Lobo', 'PL'], ['Ivo Serrão', 'MC'], ['Sérgio Neto', 'DC'], ['Ricardo Gaio', 'ED'], ['Vasco Leal', 'DD']];

  const dados = {
    configuracao: [{ id: 1, nome_clube: clube, nomes_alternativos: ['Torreense', 'SC União Torreense'], metricas_chave: ['xG', 'Shots', 'Shots / on target', 'Passes / accurate %', 'PPDA', 'Recoveries / high'], criterios: {}, updated_at: new Date().toISOString() }],
    jogos: [], estatisticas_equipa: [], estatisticas_jogador: [], eventos: [], importacoes: [], mapeamento_nomes: [
      { tipo: 'equipa', original: 'G.D. Alvorada', normalizado: 'GD Alvorada' }]
  };

  // Plantel (dados fictícios)
  const POS_LONGA = { GR: 'Guarda-redes', DD: 'Lateral direito', DE: 'Lateral esquerdo', DC: 'Defesa central', MDC: 'Médio defensivo', MC: 'Médio centro', ED: 'Extremo direito', EE: 'Extremo esquerdo', PL: 'Ponta de lança' };
  const ALTURA = { GR: 191, DC: 186, DD: 177, DE: 178, MDC: 183, MC: 178, ED: 174, EE: 175, PL: 184 };
  const numeros = [1, 2, 4, 5, 3, 6, 8, 10, 7, 11, 9, 19, 14, 15, 17, 22];
  dados.jogadores = [...plantel, ['Tomás Arruda', 'GR'], ['Rafael Couto', 'DC']].map(([nome, pos], i) => ({
    id: uuid(), nome, numero: numeros[i] ?? 30 + i, posicao: POS_LONGA[pos],
    data_nascimento: `${1993 + (i * 7) % 12}-${String(1 + (i * 5) % 12).padStart(2, '0')}-${String(3 + (i * 11) % 25).padStart(2, '0')}`,
    altura: ALTURA[pos] + ((i * 3) % 7) - 3, pe: ['DE', 'EE'].includes(pos) || i === 7 ? 'Esquerdo' : i === 12 ? 'Ambos' : 'Direito',
    nome_wyscout: i < plantel.length ? nome : null, foto: null, notas: null, created_at: new Date().toISOString()
  }));

  const inicio = new Date(Date.UTC(2026, 7, 9));
  adversarios.forEach((adv, i) => {
    const d = new Date(inicio.getTime() + i * 7 * 86400000);
    const data = d.toISOString().slice(0, 10);
    const local = i % 2 === 0 ? 'casa' : 'fora';
    const forma = 1 + 0.25 * Math.sin(i / 2.2) + (local === 'casa' ? 0.1 : -0.05);
    const xgN = r2(Math.max(0.3, entre(0.8, 2.0) * forma));
    const xgA = r2(Math.max(0.2, entre(0.5, 1.6) / forma));
    const gm = Math.max(0, Math.round(xgN + entre(-1, 1.1)));
    const gs = Math.max(0, Math.round(xgA + entre(-0.9, 0.9)));
    const id = uuid();
    dados.jogos.push({ id, data, adversario: adv, competicao: i === 6 ? 'Taça' : 'Liga', local, golos_marcados: gm, golos_sofridos: gs, notas: null, created_at: new Date().toISOString() });

    const metricas = (xg, golos, f) => {
      const remates = inteiro(Math.round(7 * f), Math.round(15 * f));
      const enq = inteiro(Math.max(golos, Math.round(remates * 0.25)), Math.max(golos, Math.round(remates * 0.45)));
      const passes = inteiro(Math.round(330 * f), Math.round(470 * f));
      const certos = Math.round(passes * entre(0.74, 0.86));
      const cruz = inteiro(9, 22); const cruzC = Math.round(cruz * entre(0.22, 0.4));
      const duelos = inteiro(85, 120); const duelosG = Math.round(duelos * entre(0.44, 0.56));
      const recup = inteiro(45, 70);
      return {
        'Goals': golos, 'xG': xg, 'Shots': remates, 'Shots / on target': enq, 'Shots / on target %': r1(enq / remates * 100),
        'Passes': passes, 'Passes / accurate': certos, 'Passes / accurate %': r1(certos / passes * 100),
        'Possession, %': 0, 'Crosses': cruz, 'Crosses / accurate': cruzC, 'Crosses / accurate %': r1(cruzC / cruz * 100),
        'Corners': inteiro(2, 9), 'PPDA': r1(entre(7, 14) / f), 'Recoveries': recup, 'Recoveries / high': Math.round(recup * entre(0.12, 0.28) * f),
        'Touches in penalty area': inteiro(Math.round(10 * f), Math.round(26 * f)), 'Duels': duelos, 'Duels / won': duelosG, 'Duels / won %': r1(duelosG / duelos * 100)
      };
    };
    const mN = metricas(xgN, gm, forma), mA = metricas(xgA, gs, 1 / forma);
    const posse = r1(mN['Passes'] / (mN['Passes'] + mA['Passes']) * 100);
    mN['Possession, %'] = posse; mA['Possession, %'] = r1(100 - posse);
    dados.estatisticas_equipa.push({ id: uuid(), jogo_id: id, lado: 'nos', equipa: clube, metricas: mN, importacao_id: null, updated_at: data });
    dados.estatisticas_equipa.push({ id: uuid(), jogo_id: id, lado: 'adversario', equipa: adv, metricas: mA, importacao_id: null, updated_at: data });

    // Jogadores
    const titulares = plantel.slice(0, 11).map(p => [...p, 90]);
    const suplentes = plantel.slice(11).sort(() => rnd() - 0.5).slice(0, 3).map(p => [...p, inteiro(10, 35)]);
    if (i === 4) titulares[10][2] = 0; // lesionado
    const atacantes = ['PL', 'ED', 'EE', 'MC'];
    let golosPorDar = gm;
    [...titulares, ...suplentes].filter(p => p[2] > 0).forEach(([nome, pos, min]) => {
      const peso = (pos === 'PL' ? 3 : pos === 'ED' || pos === 'EE' ? 2 : pos.startsWith('M') ? 1 : 0.3) * min / 90;
      const xg = r2(xgN * peso / 9 * entre(0.5, 1.5));
      const g = golosPorDar > 0 && atacantes.includes(pos) && rnd() < 0.5 ? 1 : 0; golosPorDar -= g;
      const passes = inteiro(pos === 'PL' ? 12 : 25, pos.startsWith('M') ? 70 : 50) * min / 90;
      dados.estatisticas_jogador.push({
        id: uuid(), jogo_id: id, jogador: nome, lado: 'nos', equipa: clube, posicao: pos, minutos: min, importacao_id: null, updated_at: data,
        metricas: {
          'Goals': g, 'Assists': g && rnd() < 0.6 ? 0 : (rnd() < 0.1 ? 1 : 0), 'xG': xg, 'xA': r2(xgN * entre(0, 0.15)),
          'Shots': Math.round(xg * entre(5, 9)), 'Passes': Math.round(passes), 'Passes / accurate %': r1(entre(70, 92)),
          'Progressive passes': Math.round(entre(1, pos.startsWith('M') || pos.startsWith('D') ? 9 : 5) * min / 90),
          'Duels': Math.round(entre(6, 18) * min / 90), 'Duels / won %': r1(entre(38, 65)),
          'Recoveries': Math.round(entre(2, pos.startsWith('D') || pos === 'MDC' ? 11 : 6) * min / 90),
          'Interceptions': Math.round(entre(0, pos.startsWith('D') ? 5 : 2)), 'Dribbles': Math.round(entre(0, atacantes.includes(pos) ? 6 : 2)),
          'Crosses': Math.round(entre(0, ['DD', 'DE', 'ED', 'EE'].includes(pos) ? 6 : 1)), 'Touches in penalty area': Math.round(entre(0, atacantes.includes(pos) ? 6 : 1))
        }
      });
    });

    // Eventos codificados
    const momentos = ['Organização ofensiva', 'Organização ofensiva', 'Transição ofensiva', 'Bola parada', 'Recuperação alta'];
    const ultimas = ['Cruzamento', 'Passe em profundidade', 'Passe atrasado', 'Ação individual', 'Remate de fora da área', 'Ressalto / 2.ª bola'];
    const jogadoresAtaque = plantel.filter(p => ['PL', 'ED', 'EE', 'MC'].includes(p[1])).map(p => p[0]);
    const criarOps = (lado, xg, golos) => {
      const n = Math.max(golos, Math.round(xg * entre(2.6, 3.8)));
      for (let k = 0; k < n; k++) {
        const golo = k < golos;
        const ultima = escolher(ultimas);
        const longe = ultima === 'Remate de fora da área';
        const cabeca = ultima === 'Cruzamento' && rnd() < 0.55;
        dados.eventos.push({
          id: uuid(), jogo_id: id, tipo: 'oportunidade', lado, minuto: inteiro(3, 93), parte: null,
          momento: escolher(momentos), subtipo: null, qualidade: golo || rnd() < 0.35 ? 'Grande oportunidade' : 'Oportunidade',
          ultima_acao: ultima, finalizacao: cabeca ? 'Cabeça' : escolher(['Pé direito', 'Pé direito', 'Pé esquerdo']),
          resultado: golo ? 'Golo' : escolher(['Defesa do GR', 'Fora', 'Bloqueado', 'Fora', 'Ferro']),
          zona_x: r1(longe ? entre(70, 80) : entre(83, 97)), zona_y: r1(longe ? entre(30, 70) : entre(cabeca ? 38 : 30, cabeca ? 62 : 70)),
          jogador: lado === 'nos' ? escolher(jogadoresAtaque) : null, assistente: null, video_url: null, notas: null,
          criado_por: 'demo', created_at: new Date().toISOString()
        });
      }
    };
    criarOps('nos', xgN, gm); criarOps('adversario', xgA, gs);
    for (let k = 0; k < inteiro(1, 3); k++) {
      dados.eventos.push({
        id: uuid(), jogo_id: id, tipo: 'esquema_tatico', lado: rnd() < 0.5 ? 'nos' : 'adversario', minuto: inteiro(5, 90), parte: null,
        momento: null, subtipo: escolher(['Canto', 'Canto', 'Livre lateral', 'Lançamento longo']), qualidade: null,
        ultima_acao: escolher(['Direto ao 1.º poste', 'Direto ao 2.º poste', 'Curto']), finalizacao: null,
        resultado: escolher(['Sem finalização', 'Remate sem perigo', 'Oportunidade']),
        zona_x: r1(entre(88, 96)), zona_y: r1(entre(35, 65)), jogador: null, assistente: null, video_url: null, notas: null,
        criado_por: 'demo', created_at: new Date().toISOString()
      });
    }
  });
  dados.eventos.forEach(e => { e.parte = e.minuto > 45 ? '2.ª parte' : '1.ª parte'; });
  return dados;
}

// ---------- Leitura das exportações Wyscout ----------
// As exportações do Wyscout têm cabeçalhos como "Shots / on target" que ocupam
// várias colunas (total, sucesso, %). As colunas vazias a seguir são nomeadas:
//   "Shots", "Shots / on target", "Shots / on target %"

const PAPEIS = {
  data: { rotulo: 'Data', re: /^(date|data|fecha)$/i },
  jogo: { rotulo: 'Jogo', re: /^(match|jogo|partida|game)$/i },
  competicao: { rotulo: 'Competição', re: /^(competition|competi[cç][aã]o|liga|torneio)$/i },
  equipa: { rotulo: 'Equipa', re: /^(team|equipa|equipo|clube)$/i },
  golos: { rotulo: 'Golos', re: /^(goals|golos|goles)$/i },
  esquema: { rotulo: 'Sistema tático', re: /^(scheme|esquema|sistema|formation)$/i },
  jogador: { rotulo: 'Jogador', re: /^(player|jogador|jugador|name|nome)$/i },
  posicao: { rotulo: 'Posição', re: /^(position|posi[cç][aã]o|pos\.?)$/i },
  minutos: { rotulo: 'Minutos', re: /^(minutes played|minutes|minutos( jogados)?|min\.?)$/i }
};
const PAPEIS_EQUIPA = ['data', 'jogo', 'competicao', 'equipa', 'golos', 'esquema'];
const PAPEIS_JOGADOR = ['jogador', 'equipa', 'posicao', 'minutos', 'data'];

function lerFolha(buffer) {
  const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' })
    .filter(r => r.some(c => String(c).trim() !== ''));
}

function detetarCabecalho(linhas) {
  const reTodos = Object.values(PAPEIS).map(p => p.re);
  for (let i = 0; i < Math.min(15, linhas.length); i++) {
    const textos = linhas[i].filter(c => typeof c === 'string' && c.trim() && parseNum(c) === null);
    if (textos.length >= 3 && textos.some(t => reTodos.some(re => re.test(t.trim())))) return i;
  }
  return 0;
}

function nomesColunas(cabecalho, largura) {
  const nomes = []; const brutos = [];
  for (let i = 0; i < largura; i++) brutos.push(String(cabecalho[i] ?? '').replace(/\s+/g, ' ').trim());
  let i = 0;
  while (i < largura) {
    const base = brutos[i];
    if (!base) { nomes.push(`Coluna ${i + 1}`); i++; continue; }
    let n = 0; while (i + 1 + n < largura && !brutos[i + 1 + n]) n++;
    const partes = base.split(/\s*\/\s*/);
    if (n === 0) nomes.push(base);
    else if (partes.length > 1) {
      nomes.push(partes[0], base);
      for (let k = 2; k <= n; k++) nomes.push(k === 2 ? `${base} %` : `${base} (${k})`);
    } else {
      nomes.push(base);
      for (let k = 1; k <= n; k++) nomes.push(`${base} (${k + 1})`);
    }
    i += n + 1;
  }
  // Nomes repetidos ficam com sufixo.
  const vistos = {};
  return nomes.map(nm => { vistos[nm] = (vistos[nm] || 0) + 1; return vistos[nm] > 1 ? `${nm} (${vistos[nm]})` : nm; });
}

// Prepara a tabela: nomes de colunas, linhas de dados, papéis detetados e colunas numéricas.
function prepararTabela(linhas, papeisPossiveis) {
  const ih = detetarCabecalho(linhas);
  const largura = Math.max(...linhas.map(r => r.length));
  const colunas = nomesColunas(linhas[ih] || [], largura);
  const dadosLinhas = linhas.slice(ih + 1);
  const papeis = {};
  for (const p of papeisPossiveis) {
    const idx = colunas.findIndex((c, i) => PAPEIS[p].re.test(c) && !Object.values(papeis).includes(i));
    papeis[p] = idx >= 0 ? idx : null;
  }
  const numericas = colunas.map((_, ci) => {
    const vals = dadosLinhas.map(r => r[ci]).filter(v => v !== '' && v !== null && v !== undefined);
    if (!vals.length) return false;
    return vals.filter(v => !(v instanceof Date) && parseNum(v) !== null).length / vals.length >= 0.6;
  });
  return { colunas, linhas: dadosLinhas, papeis, numericas };
}

function colunasMetricas(tab) {
  const usadas = new Set(Object.values(tab.papeis).filter(v => v !== null));
  const ignorar = /^(duration|dura[cç][aã]o|age|idade|height|altura|weight|peso|market value|valor de mercado|contract expires|n\.?º|number|#)$/i;
  return tab.colunas.map((c, i) => i).filter(i => tab.numericas[i] && !usadas.has(i) && !ignorar.test(tab.colunas[i]));
}

function lerMetricas(tab, linha) {
  const m = {};
  for (const i of colunasMetricas(tab)) {
    const n = parseNum(linha[i]);
    if (n !== null) m[tab.colunas[i]] = n;
  }
  if (tab.papeis.golos !== null && tab.papeis.golos !== undefined) {
    const g = parseNum(linha[tab.papeis.golos]); if (g !== null) m['Goals'] = g;
  }
  if (tab.papeis.esquema !== null && tab.papeis.esquema !== undefined && linha[tab.papeis.esquema]) m._esquema = String(linha[tab.papeis.esquema]);
  return m;
}

// "Casa - Fora 2:1" -> { casa, fora, gc, gf }
function lerTextoJogo(txt) {
  const s = String(txt ?? '').trim();
  let m = s.match(/^(.+?)\s+[-–]\s+(.+?)\s+(\d+)\s*[:\-–]\s*(\d+)\s*(\(.*\))?$/);
  if (m) return { casa: m[1].trim(), fora: m[2].trim(), gc: Number(m[3]), gf: Number(m[4]) };
  m = s.match(/^(.+?)\s+[-–]\s+(.+)$/);
  if (m) return { casa: m[1].trim(), fora: m[2].trim(), gc: null, gf: null };
  return null;
}

function criarIdentificador(cfg, mapeamentos) {
  const proprios = [cfg.nome_clube, ...(cfg.nomes_alternativos || [])].map(norm).filter(Boolean);
  const mapa = {};
  for (const m of mapeamentos) mapa[`${m.tipo}|${norm(m.original)}`] = m.normalizado;
  return {
    eNos: nome => { const n = norm(mapa[`equipa|${norm(nome)}`] || nome); return !!n && proprios.some(p => n === p); },
    equipa: nome => mapa[`equipa|${norm(nome)}`] || String(nome ?? '').trim(),
    jogador: nome => mapa[`jogador|${norm(nome)}`] || String(nome ?? '').trim(),
    temClube: proprios.length > 0
  };
}

// ---- Estatísticas de equipa: uma linha por equipa e por jogo ----
function analisarEquipa(tab, cfg, mapeamentos, jogosExistentes) {
  const id = criarIdentificador(cfg, mapeamentos);
  const P = tab.papeis; const avisos = [];
  if (!id.temClube) avisos.push('Defina o nome do clube em Definições para identificar as linhas da vossa equipa.');
  if (P.data === null) avisos.push('Não encontrei a coluna da data. Escolha-a acima.');
  if (P.equipa === null && P.jogo === null) avisos.push('Escolha a coluna da equipa ou do jogo.');
  if (avisos.length) return { jogos: [], avisos, ignoradas: 0 };

  const grupos = new Map(); let ignoradas = 0;
  for (const linha of tab.linhas) {
    const data = parseData(linha[P.data]);
    if (!data) { ignoradas++; continue; }
    const txt = P.jogo !== null ? String(linha[P.jogo] ?? '').trim() : '';
    const chave = `${data}|${txt}`;
    if (!grupos.has(chave)) grupos.set(chave, { data, txt, competicao: P.competicao !== null ? String(linha[P.competicao] ?? '').trim() : '', linhas: [] });
    grupos.get(chave).linhas.push(linha);
  }

  const existentes = new Set(jogosExistentes.map(j => `${j.data}|${norm(j.adversario)}`));
  const porChave = new Map();
  for (const g of grupos.values()) {
    const tj = lerTextoJogo(g.txt);
    let linhaNos = null, linhaAdv = null;
    for (const l of g.linhas) {
      const eq = P.equipa !== null ? l[P.equipa] : null;
      if (eq && id.eNos(eq)) linhaNos = linhaNos || l; else linhaAdv = linhaAdv || l;
    }
    if (P.equipa === null) { linhaNos = g.linhas[0]; linhaAdv = g.linhas[1] || null; }
    let local = null, gm = null, gs = null, adversario = null;
    if (tj) {
      if (id.eNos(tj.casa)) { local = 'casa'; adversario = id.equipa(tj.fora); gm = tj.gc; gs = tj.gf; }
      else if (id.eNos(tj.fora)) { local = 'fora'; adversario = id.equipa(tj.casa); gm = tj.gf; gs = tj.gc; }
    }
    if (!linhaNos && P.equipa !== null) {
      avisos.push(`${fmtData(g.data)} — ${g.txt || 'jogo sem descrição'}: a vossa equipa não aparece. Confirme o nome do clube em Definições.`);
      continue;
    }
    if (!adversario && linhaAdv && P.equipa !== null) adversario = id.equipa(linhaAdv[P.equipa]);
    if (!adversario) { avisos.push(`${fmtData(g.data)}: não consegui identificar o adversário.`); continue; }
    const mN = lerMetricas(tab, linhaNos);
    const mA = linhaAdv ? lerMetricas(tab, linhaAdv) : null;
    if (gm === null && Number.isFinite(mN['Goals'])) gm = mN['Goals'];
    if (gs === null && mA && Number.isFinite(mA['Goals'])) gs = mA['Goals'];
    const j = {
      data: g.data, adversario, competicao: g.competicao || null, local, golos_marcados: gm, golos_sofridos: gs,
      equipaNos: P.equipa !== null ? String(linhaNos[P.equipa]) : cfg.nome_clube,
      equipaAdv: linhaAdv && P.equipa !== null ? String(linhaAdv[P.equipa]) : adversario,
      metricasNos: mN, metricasAdv: mA,
      existe: existentes.has(`${g.data}|${norm(adversario)}`)
    };
    porChave.set(`${j.data}|${norm(j.adversario)}`, j); // ficheiros com o mesmo jogo repetido: fica o último
  }
  const jogos = [...porChave.values()].sort((a, b) => a.data.localeCompare(b.data));
  return { jogos, avisos, ignoradas, nMetricas: colunasMetricas(tab).length };
}

// ---- Estatísticas de jogadores ----
// opcoes: { jogoId, ladoPadrao }  (jogoId é usado quando o ficheiro não tem data)
function analisarJogadores(tab, cfg, mapeamentos, jogos, opcoes) {
  const id = criarIdentificador(cfg, mapeamentos);
  const P = tab.papeis; const avisos = [];
  if (P.jogador === null) return { linhas: [], avisos: ['Escolha a coluna com o nome do jogador.'], ignoradas: 0 };
  const porData = {};
  for (const j of jogos) (porData[j.data] ||= []).push(j);
  const resultado = new Map(); let ignoradas = 0; const datasSemJogo = new Set();
  for (const linha of tab.linhas) {
    const bruto = String(linha[P.jogador] ?? '').trim();
    if (!bruto || /^(total|totais|m[eé]dia|average|sum)\b/i.test(bruto)) { ignoradas++; continue; }
    let jogo = null;
    if (P.data !== null && P.data !== undefined) {
      const d = parseData(linha[P.data]);
      const cand = d ? porData[d] || [] : [];
      if (cand.length === 1) jogo = cand[0];
      else if (d) datasSemJogo.add(d);
    } else if (opcoes.jogoId) jogo = jogos.find(j => j.id === opcoes.jogoId);
    if (!jogo) { ignoradas++; continue; }
    let lado = opcoes.ladoPadrao || 'nos'; let equipa = null;
    if (P.equipa !== null && P.equipa !== undefined && linha[P.equipa]) {
      equipa = String(linha[P.equipa]).trim();
      lado = id.eNos(equipa) ? 'nos' : 'adversario';
    }
    const jogador = id.jogador(bruto);
    const minutos = P.minutos !== null && P.minutos !== undefined ? parseNum(linha[P.minutos]) : null;
    const reg = {
      jogo_id: jogo.id, jogo, jogador, lado, equipa: equipa || (lado === 'nos' ? cfg.nome_clube : jogo.adversario),
      posicao: P.posicao !== null && P.posicao !== undefined ? String(linha[P.posicao] ?? '').trim() || null : null,
      minutos, metricas: lerMetricas(tab, linha)
    };
    resultado.set(`${reg.jogo_id}|${reg.jogador}|${reg.lado}`, reg);
  }
  if (P.data === null && !opcoes.jogoId) avisos.push('O ficheiro não tem data: escolha o jogo a que pertence.');
  for (const d of datasSemJogo) avisos.push(`Não há um jogo único registado a ${fmtData(d)}. Importe primeiro as estatísticas de equipa ou crie o jogo em Jogos.`);
  return { linhas: [...resultado.values()], avisos, ignoradas, nMetricas: colunasMetricas(tab).length };
}

function obterLigacao() {
  if (LIGACAO.url && LIGACAO.chave) return { url: LIGACAO.url, chave: LIGACAO.chave };
  return lsGet('analise_ligacao');
}

async function iniciar() {
  const conf = obterLigacao();
  if (!conf) return ecraLigacao();
  try {
    App.db = conf.demo ? new LocalDB() : new SupaDB(conf.url, conf.chave);
    if (!conf.demo) {
      const s = await App.db.sessao();
      if (!s) return ecraEntrar();
      App.db.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
    }
    await entrarNaApp();
  } catch (e) {
    ecraLigacao(e.message);
  }
}

async function entrarNaApp() {

  if (!VISTAS[App.vista]) App.vista = 'relatorio';
  desenharEstrutura();

}

async function carregarDados() {
  const [cfg, jogos, estEq, estJog, eventos, mapas, importacoes] = await Promise.all([
    App.db.listar('configuracao', 'id'), App.db.listar('jogos', 'data'), App.db.listar('estatisticas_equipa', 'updated_at'),
    App.db.listar('estatisticas_jogador', 'updated_at'), App.db.listar('eventos', 'created_at'),
    App.db.listar('mapeamento_nomes', 'original'), App.db.listar('importacoes', 'created_at')]);
  // A tabela do plantel chegou numa versão posterior: se ainda não existir, a app continua a funcionar.
  let plantel = [];
  try { plantel = await App.db.listar('jogadores', 'nome'); App.semPlantel = false; } catch { App.semPlantel = true; }
  App.cfg = { nome_clube: '', nomes_alternativos: [], metricas_chave: [], criterios: {}, ...(cfg[0] || {}) };
  App.cfg.criterios = { ...CRITERIOS_PADRAO, ...Object.fromEntries(Object.entries(App.cfg.criterios || {}).filter(([, v]) => v)) };
  Object.assign(App.d, { jogos, estEq, estJog, eventos, mapas, importacoes, plantel });
  const estEqPorJogo = {}, estJogPorJogo = {}, evPorJogo = {};
  for (const r of estEq) (estEqPorJogo[r.jogo_id] ||= {})[r.lado] = r.metricas || {};
  for (const r of estJog) (estJogPorJogo[r.jogo_id] ||= []).push(r);
  for (const r of eventos) (evPorJogo[r.jogo_id] ||= []).push(r);
  App.idx = { estEq: estEqPorJogo, estJog: estJogPorJogo, eventos: evPorJogo, jogo: Object.fromEntries(jogos.map(j => [j.id, j])) };
  indexarPlantel();
}

function desenharEstrutura() {
  document.body.className = 'com-lateral';
  const demo = App.db.modo === 'demo';
  const clube = esc(App.cfg.nome_clube || 'Clube');
  $('#app').innerHTML = `
    <div class="fundo-img" aria-hidden="true"></div>
    <header class="barra-movel">
      <button class="botao-menu" id="b-menu" aria-label="Abrir menu" aria-controls="lateral" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      ${marcaSVG('marca-pequena')}<b class="nome-clube">${clube}</b><span id="vista-atual"></span>
    </header>
    <aside class="lateral" id="lateral">
      <div class="lateral-marca">${marcaSVG()}<div><b class="nome-clube">${clube}</b><span>Departamento de Análise</span></div></div>
      <nav class="lateral-nav" aria-label="Secções">
        ${Object.entries(VISTAS).filter(([, v]) => !v.so || pode()).map(([k, v]) => `<a href="#${k}" data-vista="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${v.icone}</svg>${v.nome}</a>`).join('')}
      </nav>
      <div class="lateral-conta">
        ${demo ? '<span class="etiqueta-demo" title="Os dados são fictícios e ficam só neste browser">Demonstração</span>' : ''}
        <span class="conta-email">${esc(App.perfil.email || '')}</span>
      </div>
    </aside>
    <div class="cortina" id="cortina" hidden></div>
    <main id="vista" tabindex="-1"></main>`;
  window.onhashchange = () => mostrarVista(location.hash.slice(1));
  const lateral = $('#lateral'), cortina = $('#cortina'), bMenu = $('#b-menu');
  const menu = abrir => {
    lateral.classList.toggle('aberta', abrir); cortina.hidden = !abrir; bMenu.setAttribute('aria-expanded', String(abrir));
    if (abrir) $('.lateral-nav a[aria-current]', lateral)?.focus(); else if (document.activeElement && lateral.contains(document.activeElement)) bMenu.focus();
  };
  bMenu.addEventListener('click', () => menu(true));
  cortina.addEventListener('click', () => menu(false));
  lateral.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    menu(false);
    if (a.dataset.vista === 'jogadores' && App.jog.modo === 'ficha') { App.jog.modo = 'plantel'; if (location.hash === '#jogadores') { e.preventDefault(); mostrarVista('jogadores'); } }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lateral.classList.contains('aberta')) menu(false); });
}

function mostrarVista(nome) {
  if (!VISTAS[nome] || (VISTAS[nome].so && !pode())) nome = 'relatorio';
  App.vista = nome;
  $$('.lateral-nav a').forEach(a => a.toggleAttribute('aria-current', a.dataset.vista === nome));
  const atual = $('#vista-atual'); if (atual) atual.textContent = VISTAS[nome].nome;
  window.scrollTo(0, 0);
  App.graficos.forEach(g => g.destroy()); App.graficos = [];
  const antiga = $('#vista'); const nova = antiga.cloneNode(false); antiga.replaceWith(nova); // limpa os eventos da vista anterior
  if (a11yFoco) nova.focus({ preventScroll: true });
  VISTAS[nome].desenhar();
}
let a11yFoco = false;

async function recarregar() {
  await carregarDados();
  $$('.nome-clube').forEach(m => { m.textContent = App.cfg.nome_clube || 'Clube'; });
  mostrarVista(App.vista);
}

// ---------- Campo (SVG) ----------
// Coordenadas dos eventos em % (0–100), a atacar para a direita.
function campoSVG({ eventos = [], metade = false, interativo = false, marcador = null, classe = '' }) {
  const vx = metade ? 51 : -2, vw = metade ? 56 : 109;
  const marcas = eventos.map(e => marcaEvento(e, metade ? 0.72 : 1)).join('');
  const sel = marcador ? `<g class="marcador"><circle cx="${marcador.x * 1.05}" cy="${marcador.y * 0.68}" r="2.4"/><circle cx="${marcador.x * 1.05}" cy="${marcador.y * 0.68}" r="0.7" class="ponto"/></g>` : '';
  return `<svg class="campo ${classe} ${interativo ? 'interativo' : ''}" viewBox="${vx} -2 ${vw} 72" ${interativo ? 'role="img" aria-label="Campo: clique para marcar a zona"' : 'role="img" aria-label="Mapa de eventos no campo"'}>
    <rect class="relva" x="${vx}" y="-2" width="${vw}" height="72"/>
    <g class="linhas">
      <rect x="0" y="0" width="105" height="68"/>
      <line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/>
      <rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/>
      <rect x="0" y="24.84" width="5.5" height="18.32"/><rect x="99.5" y="24.84" width="5.5" height="18.32"/>
      <path d="M16.5 26.7 A9.15 9.15 0 0 1 16.5 41.3"/><path d="M88.5 26.7 A9.15 9.15 0 0 0 88.5 41.3"/>
      <rect x="-1.5" y="30.34" width="1.5" height="7.32"/><rect x="105" y="30.34" width="1.5" height="7.32"/>
      <circle class="marca-penalti" cx="11" cy="34" r="0.35"/><circle class="marca-penalti" cx="94" cy="34" r="0.35"/><circle class="marca-penalti" cx="52.5" cy="34" r="0.35"/>
    </g>
    ${metade ? '' : '<text class="direcao" x="52.5" y="66.2">ataque →</text>'}
    <g class="eventos">${marcas}</g>${sel}
  </svg>`;
}

function marcaEvento(e, k = 1) {
  if (e.zona_x === null || e.zona_x === undefined) return '';
  const x = e.zona_x * 1.05, y = e.zona_y * 0.68;
  const golo = e.resultado === 'Golo';
  const titulo = `${e.minuto ?? ''}' ${e.tipo === 'esquema_tatico' ? (e.subtipo || 'Esquema tático') : (e.momento || 'Oportunidade')} · ${e.resultado || ''}${e.jogador ? ' · ' + e.jogador : ''}`;
  const cls = `ev ev-${e.lado} ${golo ? 'ev-golo' : ''} ${e.qualidade === 'Grande oportunidade' ? 'ev-grande' : ''}`;
  if (e.tipo === 'esquema_tatico') {
    return `<rect class="${cls}" x="${x - 1.1 * k}" y="${y - 1.1 * k}" width="${2.2 * k}" height="${2.2 * k}" transform="rotate(45 ${x} ${y})"><title>${esc(titulo)}</title></rect>`;
  }
  return `<circle class="${cls}" cx="${x}" cy="${y}" r="${(e.qualidade === 'Grande oportunidade' ? 1.45 : 1.1) * k}"><title>${esc(titulo)}</title></circle>`;
}

function legendaCampo() {
  return `<div class="legenda-campo">
    <span><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" class="ev ev-nos ev-golo"/></svg>Golo</span>
    <span><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" class="ev ev-nos"/></svg>Oportunidade</span>
    <span><svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" transform="rotate(45 5 5)" class="ev ev-nos"/></svg>Esquema tático</span>
    <span class="leg-tamanho">Maior = grande oportunidade</span>
  </div>`;
}

function rotuloJogo(j, curto = false) {
  if (!j) return '';
  const local = j.local === 'casa' ? '(C)' : j.local === 'fora' ? '(F)' : '';
  if (curto) return `${fmtData(j.data, true)} ${j.adversario} ${local}`.trim();
  const res = Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos) ? ` ${j.golos_marcados}–${j.golos_sofridos}` : '';
  return `${fmtData(j.data)} · ${j.adversario} ${local}${res}`;
}

function resultadoJogo(j) {
  if (!Number.isFinite(j.golos_marcados) || !Number.isFinite(j.golos_sofridos)) return null;
  return j.golos_marcados > j.golos_sofridos ? 'V' : j.golos_marcados < j.golos_sofridos ? 'D' : 'E';
}

// ---------- Jogos ----------
function desenharJogos() {
  const jogos = App.d.jogos.slice().sort((a, b) => b.data.localeCompare(a.data));
  const v = $('#vista');
  v.innerHTML = `
    <div class="cabecalho-vista">
      <div><h1>Jogos</h1><p class="nota">${jogos.length} jogos registados. Os jogos são criados ao importar estatísticas de equipa${pode() ? ', ou aqui, para codificar antes de importar' : ''}.</p></div>
      ${pode() ? '<button class="btn btn-prim" id="b-novo-jogo">Criar jogo</button>' : ''}
    </div>
    ${jogos.length ? `<div class="tabela-env"><table class="tabela">
      <thead><tr><th>Data</th><th>Adversário</th><th>Competição</th><th>Local</th><th class="num">Resultado</th><th class="num">Estatísticas</th><th class="num">Jogadores</th><th class="num">Eventos</th>${pode() ? '<th><span class="sr">Ações</span></th>' : ''}</tr></thead>
      <tbody>${jogos.map(j => {
        const est = App.idx.estEq[j.id]; const nj = (App.idx.estJog[j.id] || []).length; const ne = (App.idx.eventos[j.id] || []).length;
        const r = resultadoJogo(j);
        return `<tr>
          <td>${fmtData(j.data)}</td><td><b>${esc(j.adversario)}</b></td><td>${esc(j.competicao || '–')}</td>

function dialogoJogo(j = null) {

// ---------- Relatório da própria equipa ----------
const COR = { nos: '#2453C9', adv: '#C77A0F', tinta: '#17202B', tinta2: '#4B5563', grelha: '#E4E6E1', nosSuave: 'rgba(36,83,201,.45)' };
const PADRAO_METRICAS = [/^xg$/i, /^shots$/i, /on target$/i, /^passes \/ accurate %$/i, /^ppda$/i, /^recoveries \/ high$/i, /possession/i, /touches in penalty/i];
const PADRAO_JOG = ['Goals', 'Assists', 'xG', 'xA', 'Progressive passes', 'Recoveries'];
const ePercentagem = k => /%/.test(k);

function chaveXG(mets) { return mets.find(k => /^xg$/i.test(k)) || mets.find(k => /expected goals/i.test(k)) || null; }

function jogosDoRelatorio() {
  const f = App.rel;
  let js = App.d.jogos.slice().sort((a, b) => a.data.localeCompare(b.data));
  if (f.competicao !== 'todas') js = js.filter(j => (j.competicao || '') === f.competicao);
  if (f.local !== 'todos') js = js.filter(j => j.local === f.local);
  if (f.periodo !== 'todos') js = js.slice(-Number(f.periodo));
  return js;
}

function metricasChave(disponiveis) {
  const escolhidas = (App.cfg.metricas_chave || []).filter(m => disponiveis.includes(m));
  if (escolhidas.length) return escolhidas;
  const out = [];
  for (const re of PADRAO_METRICAS) { const k = disponiveis.find(m => re.test(m) && !out.includes(m)); if (k) out.push(k); }
  return out.length ? out : disponiveis.slice(0, 6);
}

function novoGrafico(canvas, config) {
  Chart.defaults.font.family = "'Barlow', system-ui, sans-serif";
  Chart.defaults.font.size = 13;
  Chart.defaults.color = COR.tinta2;
  const g = new Chart(canvas, config); App.graficos.push(g); return g;
}

  };
}
const OPCOES_LINHA = {

  const metsEq = [...new Set(js.flatMap(j => Object.keys(App.idx.estEq[j.id]?.nos || {})))].filter(k => !k.startsWith('_')).sort((a, b) => a.localeCompare(b));

function valor(j, lado, k) { const m = App.idx.estEq[j.id]?.[lado]; const n = m ? m[k] : null; return Number.isFinite(n) ? n : null; }

function desenharPlacar(js, mets) {
  const res = js.map(resultadoJogo);
  const v = res.filter(r => r === 'V').length, e = res.filter(r => r === 'E').length, d = res.filter(r => r === 'D').length;
  const comRes = v + e + d;
  const gm = soma(js.map(j => j.golos_marcados)), gs = soma(js.map(j => j.golos_sofridos));
  const xg = chaveXG(mets);
  const evs = js.flatMap(j => App.idx.eventos[j.id] || []).filter(x => x.tipo === 'oportunidade');
  const cel = (rot, val, sub = '') => `<div class="placar-cel"><span class="placar-rot">${rot}</span><span class="placar-val">${val}</span>${sub ? `<span class="placar-sub">${sub}</span>` : ''}</div>`;
  $('#r-placar').innerHTML = [
    cel('Jogos', js.length, comRes ? `${v}V ${e}E ${d}D` : ''),
    comRes ? cel('Pontos por jogo', fmtNum((3 * v + e) / comRes, 2)) : '',
    cel('Golos', `${gm}<i>–</i>${gs}`, 'marcados – sofridos'),
    xg ? cel('xG', `${fmtNum(soma(js.map(j => valor(j, 'nos', xg))))}<i>–</i>${fmtNum(soma(js.map(j => valor(j, 'adversario', xg))))}`, 'criado – sofrido') : '',
    evs.length ? cel('Oportunidades', `${evs.filter(x => x.lado === 'nos').length}<i>–</i>${evs.filter(x => x.lado === 'adversario').length}`, 'criadas – sofridas (codificadas)') : ''
  ].join('');
}

function desenharTendencia(js, mets, chave) {
  const el = $('#r-tendencia');
  if (!mets.length) { el.innerHTML = '<h2>Tendência</h2><p class="fraco">Sem estatísticas Wyscout para estes jogos.</p>'; return; }
  if (!App.rel.metrica || !mets.includes(App.rel.metrica)) App.rel.metrica = chave[0] || mets[0];
  const k = App.rel.metrica;
  const nos = js.map(j => valor(j, 'nos', k)), adv = js.map(j => valor(j, 'adversario', k));
  const movel = nos.map((_, i) => media(nos.slice(Math.max(0, i - 4), i + 1)));
  const ult = media(nos.slice(-5)), epoca = media(nos);
  const outras = mets.filter(m => !chave.includes(m));
  el.innerHTML = `
    <div class="bloco-cab"><h2>Tendência: ${esc(k)}</h2></div>
    <p class="destaque">Média nos últimos ${Math.min(5, nos.filter(Number.isFinite).length)} jogos: <b>${fmtNum(ult, 2)}</b>, contra <b>${fmtNum(epoca, 2)}</b> no período (${fmtSinal(ult - epoca, 2)}).</p>
    <div class="seletor-metrica so-ecra" role="radiogroup" aria-label="Métrica">
      ${chave.map(m => `<label class="chip"><input type="radio" name="met" value="${esc(m)}" ${m === k ? 'checked' : ''}><span>${esc(m)}</span></label>`).join('')}
      ${outras.length ? `<select id="met-outra" aria-label="Outra métrica"><option value="">Outra métrica…</option>${outras.map(m => `<option ${m === k ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>` : ''}
    </div>
    <div class="grafico alto"><canvas aria-label="Evolução de ${esc(k)} por jogo"></canvas></div>`;

function desenharComparacao(js, chave) {
  const el = $('#r-comparacao');

  const linhas = chave.map(k => {
    const n = js.map(j => valor(j, 'nos', k)), a = js.map(j => valor(j, 'adversario', k));
    const mn = media(n), ma = media(a), u5 = media(n.slice(-5));
    return { k, mn, ma, dif: mn !== null && ma !== null ? mn - ma : null, u5, var: u5 !== null && mn !== null ? u5 - mn : null };
  });
  el.innerHTML = `
    <h2>Nós e os adversários</h2>
    <p class="nota">Média por jogo. "Adversários" é o que os adversários fizeram nos jogos contra nós; a diferença não diz se é bom ou mau, isso depende da métrica e do modelo de jogo.</p>
    <div class="tabela-env"><table class="tabela">
      <thead><tr><th>Métrica</th><th class="num">${esc(App.cfg.nome_clube || 'Nós')}</th><th class="num">Adversários</th><th class="num">Diferença</th><th class="num">Nós, últimos 5</th><th class="num">Últimos 5 vs. período</th></tr></thead>

function seta(dif, base) {
  if (dif === null || base === null) return '';
  const rel = Math.abs(dif) / (Math.abs(base) || 1);
  if (rel < 0.05) return '<span class="seta" aria-label="estável">→</span>';
  return dif > 0 ? '<span class="seta" aria-label="a subir">↗</span>' : '<span class="seta" aria-label="a descer">↘</span>';
}

// ---- Jogadores ----
function agregarJogadores(js) {
  const ids = new Set(js.map(j => j.id));
  const linhas = App.d.estJog.filter(r => ids.has(r.jogo_id) && r.lado === 'nos');
  const mets = [...new Set(linhas.flatMap(r => Object.keys(r.metricas || {})))].filter(k => !k.startsWith('_')).sort((a, b) => a.localeCompare(b));
  const porJog = {};
  for (const r of linhas) {
    const p = (porJog[r.jogador] ||= { nome: r.jogador, pos: {}, jogos: 0, minutos: 0, tot: {}, pond: {}, minPond: {} });
    const min = Number.isFinite(r.minutos) ? r.minutos : 0;
    if (min > 0 || r.minutos === null) p.jogos++;
    p.minutos += min;
    if (r.posicao) p.pos[r.posicao] = (p.pos[r.posicao] || 0) + 1;
    for (const [k, v] of Object.entries(r.metricas || {})) {
      if (!Number.isFinite(v)) continue;
      if (ePercentagem(k)) { p.pond[k] = (p.pond[k] || 0) + v * (min || 1); p.minPond[k] = (p.minPond[k] || 0) + (min || 1); }
      else p.tot[k] = (p.tot[k] || 0) + v;
    }
  }
  const jogadores = Object.values(porJog).map(p => ({ ...p, posicao: Object.entries(p.pos).sort((a, b) => b[1] - a[1])[0]?.[0] || '' }));
  return { jogadores, mets, linhas };
}

function valorJogador(p, k, por90) {
  if (ePercentagem(k)) return p.minPond[k] ? p.pond[k] / p.minPond[k] : null;
  const t = p.tot[k]; if (!Number.isFinite(t)) return null;
  return por90 ? (p.minutos > 0 ? t / p.minutos * 90 : null) : t;
}

      <div class="chips-lista">${mets.map(m => `<label class="chip-check"><input type="checkbox" value="${esc(m)}" ${sel.includes(m) ? 'checked' : ''}><span>${esc(m)}</span></label>`).join('')}</div>
    </details>
    <div class="tabela-env"><table class="tabela jogadores">
      <thead><tr>${th('nome', 'Jogador', false)}<th>Pos.</th>${th('jogos', 'Jogos')}${th('minutos', 'Minutos')}${sel.map(m => th(m, m)).join('')}</tr></thead>
      <tbody>${jogadores.map(p => `<tr><td><button class="btn-link nome-jogador" data-jogador="${esc(p.nome)}">${esc(nomeVisivel(p.nome))}</button></td><td>${esc(p.posicao)}</td><td class="num">${p.jogos}</td><td class="num">${fmtNum(p.minutos, 0)}</td>
        ${sel.map(m => `<td class="num">${fmtNum(valorJogador(p, m, R.por90), ePercentagem(m) ? 1 : (R.por90 ? 2 : 1))}</td>`).join('')}</tr>`).join('')}</tbody>

}

App.jog = { modo: 'plantel', nome: null, comparar: 'posicao', metrica: null, metricas: null };

function abrirFicha(nome) {

}

// Agrupa posições (abreviaturas portuguesas ou do Wyscout) em quatro sectores.
function sectorPosicao(pos) {
  const longo = { 'guarda-redes': 'Guarda-redes', 'defesa central': 'Defesa', 'lateral direito': 'Defesa', 'lateral esquerdo': 'Defesa', 'médio defensivo': 'Médio', 'médio centro': 'Médio', 'médio ofensivo': 'Médio', 'extremo direito': 'Avançado', 'extremo esquerdo': 'Avançado', 'ponta de lança': 'Avançado', 'segundo avançado': 'Avançado' }[String(pos || '').toLowerCase().trim()];
  if (longo) return longo;
  const p = String(pos || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (!p) return null;
  if (/^(GR|GK|G)$/.test(p)) return 'Guarda-redes';
  if (/^(DC|DD|DE|LD|LE|CB|RCB|LCB|RB|LB|RWB|LWB|DL|DR|DEF)/.test(p)) return 'Defesa';
  if (/^(MDC|MC|MO|MD|ME|DMF|RDMF|LDMF|CMF|RCMF|LCMF|AMF|RAMF|LAMF|CM|DM|AM)/.test(p)) return 'Médio';
  if (/^(ED|EE|PL|AV|PL|CF|ST|SS|RW|LW|RWF|LWF|FW|EXT)/.test(p)) return 'Avançado';
  return null;
}

// Chave de estatísticas de um jogador do plantel (o nome como aparece no Wyscout).
function chaveEstat(pj) { return pj.nome_wyscout || pj.nome; }
function jogadorDoPlantel(chave) { return App.idx.plantelPorEstat?.[norm(chave)] || null; }
function nomeVisivel(chave) { return jogadorDoPlantel(chave)?.nome || chave; }

// Lista para o seletor: plantel primeiro (pelo número), depois quem só tem estatísticas.
function nomesDosJogadores() {
  const doPlantel = App.d.plantel.slice().sort((a, b) => (a.numero ?? 999) - (b.numero ?? 999) || a.nome.localeCompare(b.nome, 'pt')).map(chaveEstat);
  const vistos = new Set(doPlantel.map(norm));
  const soEstat = [...new Set(App.d.estJog.filter(r => r.lado === 'nos').map(r => r.jogador))].filter(n => !vistos.has(norm(n))).sort((a, b) => a.localeCompare(b, 'pt'));
  return [...doPlantel, ...soEstat];
}

function idade(dataNasc) {
  if (!dataNasc) return null;
  const [y, m, d] = dataNasc.split('-').map(Number); const h = new Date();
  return h.getFullYear() - y - ((h.getMonth() + 1 < m || (h.getMonth() + 1 === m && h.getDate() < d)) ? 1 : 0);
}
function metaJogador(pj) {
  return [pj.posicao, idade(pj.data_nascimento) !== null ? `${idade(pj.data_nascimento)} anos` : null, pj.altura ? `${pj.altura} cm` : null, pj.pe].filter(Boolean).join(' · ');
}
function avatarJogador(pj, classe = '') {
  const num = pj?.numero ?? null;
  if (pj?.foto) return `<span class="avatar ${classe}"><img src="${esc(pj.foto)}" alt="">${num !== null ? `<b class="avatar-num">${num}</b>` : ''}</span>`;
  const iniciais = String(pj?.nome || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
  return `<span class="avatar avatar-sem-foto ${classe}">${num !== null ? num : esc(iniciais)}</span>`;
}

    .map(r => ({ ...r, jogo: App.idx.jogo[r.jogo_id] })).sort((a, b) => a.jogo.data.localeCompare(b.jogo.data));
  const sector = sectorPosicao(pj?.posicao) || (p ? sectorPosicao(p.posicao) : null);
  const meta = pj ? [metaJogador(pj), pj.nacionalidade].filter(Boolean).join(' · ') : (p ? [p.posicao, sector].filter(Boolean).join(' · ') : '');

  v.innerHTML = `
