<style>
:root {
  color-scheme: light;
  --fundo: #F3F4F1;
  --papel: #FFFFFF;
  --tinta: #17202B;
  --tinta2: #4B5563;
  --fraco: #5F6672;
  --linha: #DADDD6;
  --linha-forte: #B9BEB5;
  --nos: #2453C9;
  --nos-claro: #E6ECFA;
  --adv: #C77A0F;
  --adv-escuro: #995C06;
  --relva: #D7E3D1;
  --perigo: #B42318;
  --ok: #1F7A4D;
  --raio: 6px;
  --azul-clube: #003870;
  --marinho: #13284A;
  --marinho-hover: #1E3864;
  --bordeaux: #5C1E29;
  --dourado: #B88A4A;
  --dourado-claro: #D8B27A;
  --papel-fundo: #EAE7E0;
  --cond: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papel-fundo); color: var(--tinta);
  font: 400 16px/1.5 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { color: var(--azul-clube); font-family: var(--cond); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -0.005em; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.25rem; margin-bottom: .6rem; }
h3 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
p { margin: 0 0 .75rem; }
a { color: var(--nos); }
code { font-size: .9em; background: var(--fundo); padding: 0 .3em; border-radius: 3px; }
b { font-weight: 600; }
  .so-impressao { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nota { color: var(--fraco); font-size: .92rem; max-width: 72ch; }
.fraco { color: var(--fraco); }
.destaque { font-size: 1.05rem; max-width: 72ch; }
.erro { color: var(--perigo); font-weight: 500; }
:focus-visible { outline: 2px solid var(--nos); outline-offset: 2px; }
#vista:focus { outline: none; }

/* ---------- Botões e campos ---------- */
.btn {
  font: 500 .95rem/1 'Barlow', sans-serif; padding: .62rem 1rem; border-radius: var(--raio);
  border: 1px solid var(--linha-forte); background: var(--papel); color: var(--tinta); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--tinta2); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn-prim { background: var(--marinho); border-color: var(--marinho); color: #fff; }
.btn-prim:hover { background: var(--marinho-hover); }
.btn-perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }
.btn-link { background: none; border: 0; padding: .2rem .1rem; color: var(--nos); font: inherit; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; }
.btn-link:hover { text-decoration-color: currentColor; }
.btn-link.perigo { color: var(--perigo); }
label { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; font-weight: 500; color: var(--tinta2); }
label.em-linha { flex-direction: row; align-items: center; gap: .6rem; }
input:not([type=radio]):not([type=checkbox]):not([type=file]), select, textarea {
  font: 400 1rem/1.3 'Barlow', sans-serif; color: var(--tinta); background: var(--papel);
  border: 1px solid var(--linha-forte); border-radius: var(--raio); padding: .55rem .65rem; min-width: 0; width: 100%;
}
textarea { resize: vertical; line-height: 1.45; }
input:disabled, textarea:disabled { background: var(--fundo); color: var(--tinta2); }
.pilha { display: flex; flex-direction: column; gap: 1rem; }
.grelha-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
.alinhar-fim { align-items: end; }
.acoes, .acoes-esq { display: flex; gap: .6rem; flex-wrap: wrap; }
.acoes { justify-content: flex-end; }

/* ---------- Ecrã de entrada ---------- */
.entrada { box-shadow: 0 18px 40px rgba(10,30,54,.12); }
.ecra-entrada { display: grid; place-items: center; min-height: 100vh; padding: 1rem; }
.entrada { width: 100%; max-width: 420px; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 2rem 1.75rem; }
.entrada h1 { margin: 1.5rem 0 .75rem; }
.entrada-marca .marca { height: 56px; }
.entrada-marca { display: flex; align-items: center; gap: .75rem; font-family: var(--cond); font-weight: 600; color: var(--tinta2); }
.entrada > .btn { width: 100%; }
.separador { display: flex; align-items: center; gap: .75rem; color: var(--fraco); font-size: .85rem; margin: 1.25rem 0; }
.separador::before, .separador::after { content: ''; flex: 1; border-top: 1px solid var(--linha); }
.marca { width: auto; height: 44px; flex: none; object-fit: contain; }
.marca-pequena { height: 30px; }

/* ---------- Vistas ---------- */

/* ---------- Chips e segmentados ---------- */

}

/* ---------- Relatório ---------- */

.placar {

  border-radius: 10px; margin-bottom: 1.25rem; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

/* Perfil por posição */

.cartao-jogador {
  display: flex; align-items: center; gap: .9rem; width: 100%; text-align: left; font: inherit; color: var(--tinta);

.avatar-num { z-index: 1; position: absolute; right: -3px; bottom: -3px; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 12px; background: var(--marinho); color: #fff; border: 2px solid var(--papel); font-family: var(--cond); font-size: .82rem; display: grid; place-items: center; }
.avatar-grande { width: 88px; height: 88px; }

.voltar { display: inline-block; margin-bottom: .75rem; color: var(--tinta2); text-decoration: none; font-weight: 500; }

.foto-campo { display: flex; align-items: center; gap: 1rem; }
.pilha-curta { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; }

/* ---------- Transfermarkt ---------- */
.tm-linha { margin-top: 0; }
.tm-linha label { flex: 1 1 320px; }
.tm-msg { margin: 0; min-height: 1.5em; color: var(--tinta2); font-weight: 500; }
.tm-cartao { display: flex; align-items: center; gap: 1rem; background: var(--fundo); border-radius: 10px; padding: 1rem; margin-bottom: .9rem; }

/* ---------- Ficha do jogador ---------- */
.botao-pdf { display: inline-flex; align-items: center; gap: .45rem; }
.botao-pdf svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ficha-titulo { display: flex; align-items: center; gap: 1.1rem; min-width: 0; }
.ficha-titulo > div { min-width: 0; }
.ficha-tipo { margin: 0 0 .2rem; font-size: .9rem; font-weight: 500; color: var(--bordeaux); }
.ficha-titulo h1 { font-size: 2.3rem; }
.ficha-acoes { display: flex; align-items: flex-end; gap: .75rem; flex-wrap: wrap; }

.grafico.baixo { height: 150px; }
.perfil { display: grid; grid-template-columns: minmax(9rem, 1.1fr) 4.5rem minmax(10rem, 2.4fr) 5.5rem; column-gap: 1rem; }
.perfil-cab, .perfil-linha { display: contents; }

.perfil-linha > span { padding: .55rem 0; border-bottom: 1px solid var(--linha); align-self: stretch; display: flex; align-items: center; }
.perfil-linha .num, .perfil-cab .num { justify-content: flex-end; text-align: right; }
.perfil-val { font-weight: 600; font-family: var(--cond); font-size: 1.1rem; }
.perfil-pos { color: var(--tinta2); font-size: .9rem; gap: .25rem; }
.perfil-pos b { color: var(--tinta); }
.faixa { gap: .6rem; font-size: .78rem; color: var(--fraco); }
.faixa-min, .faixa-max { width: 2.6rem; flex: none; }

.faixa-ponto { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--nos); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--nos); }
.leg-ponto { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--nos); }

@media (max-width: 640px) {
  .perfil { grid-template-columns: minmax(0, 1fr) auto; }
  .perfil-cab { display: none; }
  .perfil-linha .faixa { grid-column: 1 / -1; border-bottom: 1px solid var(--linha); padding-top: 0; }
  .perfil-linha .perfil-met, .perfil-linha .perfil-val { border-bottom: 0; }
  .perfil-linha .perfil-pos { grid-column: 1 / -1; order: 0; border-bottom: 0; padding: 0; justify-content: flex-start; }
}
.cab-impressao { align-items: center; gap: .7rem; padding-bottom: 4mm; margin-bottom: 5mm; border-bottom: 2px solid var(--marinho); }

.cab-impressao span { display: block; font-size: 9pt; color: var(--fraco); }

/* ---------- Campo ---------- */
.campo { display: block; width: 100%; height: auto; border-radius: 6px; }

/* ---------- Codificação ---------- */

.seg-linhas { display: flex; flex-direction: column; gap: .5rem; }

.lista-eventos { list-style: none; margin: 0; padding: 0; }
.lista-eventos li { display: grid; grid-template-columns: 2.6rem auto 1fr auto; gap: .55rem; align-items: start; padding: .6rem 0; border-bottom: 1px solid var(--linha); }
.lista-eventos li.a-editar { background: var(--nos-claro); margin: 0 -.5rem; padding: .6rem .5rem; border-radius: 6px; }
.lista-eventos .ponto-cor { margin: .45rem 0 0; }
.ev-min { font-family: var(--cond); font-weight: 600; font-size: 1.1rem; text-align: right; }
.ev-txt { display: flex; flex-direction: column; min-width: 0; }
.ev-txt b + span { font-size: .92rem; color: var(--tinta2); }
.ev-txt .golo { color: var(--tinta); font-weight: 600; }
.ev-txt small { font-size: .85rem; color: var(--fraco); }
.ev-acoes { display: flex; gap: .6rem; font-size: .9rem; white-space: nowrap; }

/* ---------- Importação ---------- */
.instrucao { max-width: 76ch; }
.zona-ficheiro {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
  border: 2px dashed var(--linha-forte); border-radius: 10px; padding: 2rem 1rem; background: #FAFBF9; text-align: center; cursor: pointer; margin-bottom: 1.25rem;
}
.zona-ficheiro:hover, .zona-ficheiro.arrastar { border-color: var(--nos); background: var(--nos-claro); }
.zona-ficheiro input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.zona-ficheiro:focus-within { outline: 2px solid var(--nos); outline-offset: 2px; }
.zona-titulo { font-family: var(--cond); font-size: 1.2rem; font-weight: 600; color: var(--tinta); }
.zona-sub { font-size: .9rem; color: var(--fraco); }
.papeis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .75rem 1rem; margin-bottom: 1rem; }
.avisos { background: #FFF6E5; border: 1px solid #F0D79E; border-radius: var(--raio); padding: .75rem 1rem .75rem 2rem; margin: 0 0 1rem; color: #5C3D06; }
.avisos li + li { margin-top: .3rem; }
#i-analise h2 { margin-top: .5rem; }

/* ---------- Definições ---------- */
.linha-form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-top: .75rem; }
.linha-form label { flex: 1 1 180px; }
.bloco form > .btn, .bloco > form .btn-prim { align-self: flex-start; }
#f-clube, #f-metricas, #f-criterios { display: flex; flex-direction: column; gap: 1rem; }
#f-clube h2, #f-metricas h2, #f-criterios h2 { margin-bottom: -.4rem; }
#f-clube .nota, #f-metricas .nota, #f-criterios .nota { margin: 0; }

/* ---------- Diálogos e avisos ---------- */
.dialogo { border: 0; border-radius: 12px; padding: 1.5rem; width: min(560px, calc(100vw - 2rem)); box-shadow: 0 20px 50px rgba(23,32,43,.25); color: var(--tinta); }
.dialogo-largo { width: min(820px, calc(100vw - 2rem)); }
.dialogo::backdrop { background: rgba(23,32,43,.45); }
.dialogo p { margin-bottom: 1.25rem; }
#toasts { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 100; max-width: min(420px, calc(100vw - 2rem)); }
.toast { background: var(--tinta); color: #fff; padding: .75rem 1rem; border-radius: 8px; font-size: .95rem; box-shadow: 0 8px 24px rgba(23,32,43,.2); border-left: 4px solid #5FBF8A; }
.toast-erro { border-left-color: #F07468; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: entra .18s ease-out; }
  @keyframes entra { from { transform: translateY(8px); opacity: 0; } }
}

/* Nomes e números de destaque na cor do símbolo */
.cartao-texto b, .tm-cartao b, .perfil-val, .ev-min, .zona-titulo, .nome-jogador, .tabela td b { color: var(--azul-clube); }
.grupo-plantel h2 { color: var(--tinta2); }

/* ---------- Impressão / PDF ---------- */
@media print {
  @page { size: A4; margin: 14mm 12mm; }
  body { background: #fff; font-size: 11pt; }
  .lateral, .barra-movel, .fundo-img, .cortina, .so-ecra, #toasts { display: none !important; }
  .com-lateral { padding-left: 0; }
  main#vista { padding: 0; max-width: none; }
  .so-impressao { display: block !important; }
  .cab-impressao.so-impressao { display: flex !important; }
  .ficha-titulo h1 { font-size: 22pt; }
  .avatar-sem-foto, .avatar-num { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ficha-notas { border: 0; padding: 0; }
  .perfil-linha > span { padding: .3rem 0; }
  .faixa-ponto, .faixa-pista, .faixa-media, .leg-ponto, .res, .ponto-cor { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bloco { border: 0; padding: 0; margin: 0 0 8mm; break-inside: avoid; }
  #r-jogadores { break-inside: auto; }
  .grafico { height: 230px !important; }
  .placar { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); }
  .placar-cel { padding: .7rem .9rem; }
  .placar-val { font-size: 1.5rem; }
  .grafico canvas { max-width: 100% !important; }
  .tabela tbody tr:hover td { background: none; }
  .tabela-env { overflow: visible; }
  .tabela { font-size: 9.5pt; }
  .tabela th { white-space: normal; }
  .tabela td:first-child { white-space: nowrap; }
  a { color: inherit; text-decoration: none; }
}
.classificacao tr.nossa td { background: var(--nos-claro); font-weight: 600; color: var(--azul-clube); }

/* ---------- Calendário ---------- */
:root { --t-treino: #2E7D5B; --t-reuniao: #B07A1E; --t-tarefa: #003870; --t-outro: #7A8494; --t-jogo: #5C1E29; }
.cal-acoes { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.cal-nav { display: inline-flex; gap: .3rem; }
.cal-nav .btn { padding-inline: .8rem; }
.cal-titulo { font-size: 1.05rem !important; color: var(--tinta2) !important; }
.cal-ponto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.cal-ponto.tipo-treino, .cal-mini.tipo-treino::before { background: var(--t-treino); }
.cal-ponto.tipo-reuniao, .cal-mini.tipo-reuniao::before { background: var(--t-reuniao); }
.cal-ponto.tipo-tarefa, .cal-mini.tipo-tarefa::before { background: var(--t-tarefa); }
.cal-ponto.tipo-outro, .cal-mini.tipo-outro::before { background: var(--t-outro); }
.cal-ponto.tipo-jogo { background: var(--t-jogo); }
.cal-legenda { margin-top: .75rem; }

/* Mês */
.cal-mes { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; }
.cal-mes-cab, .cal-mes-semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-mes-cab span { padding: .5rem .6rem; font-size: .82rem; font-weight: 600; color: var(--tinta2); border-bottom: 1px solid var(--linha); }
.cal-dia {
  display: flex; flex-direction: column; align-items: stretch; gap: .2rem; min-height: 112px; min-width: 0; padding: .4rem .45rem .5rem;
  border: 0; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); background: var(--papel); text-align: left; font: inherit; color: var(--tinta); cursor: pointer;
}
.cal-mes-semana .cal-dia:last-child { border-right: 0; }
.cal-mes-semana:last-child .cal-dia { border-bottom: 0; }
.cal-dia:hover { background: #F7F8FB; }
.cal-dia.fora { background: #FAFAF8; color: var(--fraco); }
.cal-dia.fora > *:not(.cal-dia-cab) { opacity: .6; }
.cal-dia.hoje { box-shadow: inset 0 0 0 2px var(--marinho); }
.cal-dia-cab { display: flex; justify-content: space-between; align-items: baseline; }
.cal-dia-cab b { font-family: var(--cond); font-size: 1.05rem; }
.cal-dia.hoje .cal-dia-cab b { color: #fff; background: var(--marinho); border-radius: 999px; padding: 0 .45rem; }
.cal-dia-cab small, .cal-md { font-size: .72rem; font-weight: 600; color: var(--dourado); letter-spacing: .02em; }
.cal-mini { display: block; font-size: .78rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tinta2); }
.cal-mini::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: .3rem; vertical-align: 1px; }
.cal-mini i { font-style: normal; color: var(--fraco); }
.cal-mini.feito { text-decoration: line-through; opacity: .7; }
.cal-mais { font-size: .75rem; color: var(--fraco); }
.cal-jogo { background: var(--t-jogo); color: #fff; border-radius: 6px; padding: .3rem .5rem; font-size: .82rem; line-height: 1.3; display: flex; flex-wrap: wrap; align-items: center; gap: .1rem .35rem; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.cal-jogo b { font-weight: 600; }
.cal-jogo small { width: 100%; opacity: .8; font-size: .75rem; }
.cal-jogo-rot { width: 100%; font-size: .7rem; opacity: .8; font-weight: 600; }
.cal-jogo .res { margin: 0; }
.cal-dia .cal-jogo { font-size: .75rem; padding: .15rem .4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
@media (max-width: 700px) {
  .cal-dia { min-height: 64px; padding: .3rem; }
  .cal-mini { font-size: 0; white-space: normal; display: inline; }
  .cal-mini::before { width: 8px; height: 8px; margin-right: .15rem; }
  .cal-mini i, .cal-mais { display: none; }
  .cal-dia .cal-jogo { font-size: .65rem; padding: .1rem .25rem; }
  .cal-dia-cab small { font-size: .6rem; }
}

/* Semana */
.cal-semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; align-items: start; }
.cal-col { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: .5rem; display: flex; flex-direction: column; gap: .45rem; min-height: 200px; min-width: 0; }
.cal-col.hoje { border-color: var(--marinho); box-shadow: 0 0 0 1px var(--marinho); }
.cal-col.com-jogo { background: #FBF7F7; }
.cal-col header { display: flex; justify-content: space-between; align-items: baseline; padding: .1rem .2rem .35rem; border-bottom: 1px solid var(--linha); font-size: .88rem; color: var(--tinta2); }
.cal-col header b { font-family: var(--cond); font-size: 1.15rem; color: var(--azul-clube); }
.cal-evento { border: 1px solid var(--linha); border-radius: 8px; padding: .4rem .5rem; display: flex; flex-direction: column; gap: .15rem; cursor: pointer; background: var(--papel); min-width: 0; }
.cal-evento:hover { border-color: var(--linha-forte); background: #FAFBFC; }
.cal-evento:focus-visible { outline: 2px solid var(--nos); outline-offset: 1px; }
.cal-evento b { font-weight: 600; font-size: .88rem; line-height: 1.3; overflow-wrap: anywhere; }
.cal-evento small { font-size: .76rem; color: var(--fraco); }
.cal-ev-cab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 .4rem; font-size: .72rem; font-weight: 600; }
.cal-ev-tipo, .cal-ev-hora { white-space: nowrap; }
.cal-ev-tipo::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: .3rem; vertical-align: 1px; }
.tipo-treino .cal-ev-tipo { color: var(--t-treino); } .tipo-treino .cal-ev-tipo::before { background: var(--t-treino); }
.tipo-reuniao .cal-ev-tipo { color: #8A5E12; } .tipo-reuniao .cal-ev-tipo::before { background: var(--t-reuniao); }
.tipo-tarefa .cal-ev-tipo { color: var(--t-tarefa); } .tipo-tarefa .cal-ev-tipo::before { background: var(--t-tarefa); }
.tipo-outro .cal-ev-tipo { color: #5A6371; } .tipo-outro .cal-ev-tipo::before { background: var(--t-outro); }
.cal-ev-hora { color: var(--tinta2); font-variant-numeric: tabular-nums; }
.cal-evento.feito b { text-decoration: line-through; color: var(--fraco); }
.cal-adicionar { margin-top: auto; border: 1px dashed var(--linha-forte); background: none; border-radius: 8px; padding: .35rem; font: inherit; font-size: .82rem; color: var(--tinta2); cursor: pointer; }
.cal-adicionar:hover { border-color: var(--marinho); color: var(--marinho); }
.estado { align-self: flex-start; font: inherit; font-size: .72rem; font-weight: 600; border-radius: 999px; padding: .1rem .55rem; border: 1px solid transparent; cursor: default; }
button.estado { cursor: pointer; }
.estado-por_fazer { background: #EEF0F3; color: #3F4754; border-color: #D8DCE2; }
.estado-em_curso { background: #FFF1D6; color: #6B4605; border-color: #F0D79E; }
.estado-feito { background: #DDF1E5; color: #145233; border-color: #B9E0C8; }
.cal-tarefas { margin-top: 1.25rem; }
.cal-tarefas td:first-child { white-space: nowrap; }
@media (max-width: 1100px) { .cal-semana { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 700px) { .cal-semana { grid-template-columns: minmax(0, 1fr); } .cal-col { min-height: 0; } }

/* Modelo */
.modelo-tabela input, .modelo-tabela select { padding: .35rem .45rem !important; font-size: .9rem !important; }
.modelo-tabela td { padding: .3rem .35rem !important; }
.modelo-tabela td:nth-child(3) { min-width: 240px; }
.modelo-tabela td:nth-child(6) { min-width: 140px; }

@media print {
  .cal-semana { grid-template-columns: repeat(7, minmax(0, 1fr)) !important; gap: 2mm; }
  .cal-col { min-height: 0; padding: 1.5mm; border-radius: 2mm; box-shadow: none !important; }
  .cal-evento { padding: 1mm 1.5mm; break-inside: avoid; }
  .cal-evento b { font-size: 8pt; } .cal-evento small, .cal-ev-cab { font-size: 7pt; }
  .cal-col header { font-size: 8pt; } .cal-col header b { font-size: 11pt; }
  .estado, .cal-ev-tipo::before, .cal-col.com-jogo { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cal-tarefas { break-before: auto; }
}

/* ---------- Codificação (método do departamento) ---------- */
.cod-jogo-sel { display: flex; align-items: center; gap: .35rem; min-width: min(100%, 420px); }
.cod-jogo-sel .seletor-jogo { flex: 1; min-width: 0; }
.cod-jogo-sel .btn { padding-inline: .75rem; }
.cod-cab-jogo { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: .75rem 1rem; margin-bottom: 1.25rem; }
.cod-equipa { font-family: var(--cond); font-weight: 600; font-size: 1.3rem; color: var(--azul-clube); display: inline-flex; align-items: center; gap: .4rem; }
.cod-equipa::before { content: ''; width: .7rem; height: .7rem; border-radius: 50%; background: var(--nos); }
.cod-equipa.adversario::before { background: var(--adv); }
.cod-resultado { font-family: var(--cond); font-size: 1.4rem; }
.cod-ponto-cab { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; margin-bottom: .45rem; }
.cod-ponto-cab .campo-dica { margin: 0; }
.segmentado.pequeno span { padding: .32rem .7rem; font-size: .88rem; }
.zonas-info { margin: .35rem 0 0; min-height: 1.2em; }
.mais-detalhes summary { cursor: pointer; color: var(--tinta2); font-weight: 500; margin-bottom: .6rem; }
.caixa { gap: .5rem; color: var(--tinta); font-weight: 400; }
.caixa input { width: 18px; height: 18px; }
.marcador-passe circle { fill: #fff; stroke: var(--tinta); stroke-width: .45; stroke-dasharray: .8 .5; }
.marcador-linha { stroke: var(--tinta); stroke-width: .35; stroke-dasharray: 1 .7; }
.ev-linha { stroke-width: .22; opacity: .55; }
.ev-linha-nos { stroke: var(--nos); } .ev-linha-adversario { stroke: var(--adv); }
.ev-passe { stroke: none; opacity: .7; }
.ev-passe.ev-nos { fill: var(--nos); } .ev-passe.ev-adversario { fill: var(--adv); }

/* ---------- Análise de oportunidades ---------- */
.ana-golos { align-self: flex-end; padding-bottom: .55rem; }
.ana-grelha { display: grid; gap: 1.5rem 2rem; }
.ana-grelha.tres { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.ana-grelha.dois { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.ana-barras { min-width: 0; }
.ana-barras h3 { margin: 0 0 .6rem; }
.ana-barras ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.ana-barras li { display: grid; grid-template-columns: minmax(6rem, 9.5rem) minmax(0, 1fr) auto; align-items: center; gap: .55rem; font-size: .9rem; }
.ana-rot { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ana-pista { height: 10px; background: #E9ECF1; border-radius: 0 3px 3px 0; overflow: hidden; }
.ana-pista i { display: block; height: 100%; background: var(--nos); border-radius: 0 3px 3px 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.ana-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ana-val small { font-weight: 400; color: var(--fraco); }
.ana-colunas { display: flex; align-items: flex-end; gap: .4rem; height: 150px; padding-top: .3rem; }
.ana-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .2rem; height: 100%; min-width: 0; }
.ana-col-val { font-size: .82rem; font-weight: 600; }
.ana-col-barra { flex: 1; width: 100%; max-width: 34px; display: flex; align-items: flex-end; background: #F1F3F6; border-radius: 3px 3px 0 0; }
.ana-col-barra i { display: block; width: 100%; background: var(--nos); border-radius: 3px 3px 0 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.ana-col-rot { font-size: .72rem; color: var(--fraco); white-space: nowrap; }
.ana-mapas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; align-items: start; }
.ana-mapas figure { margin: 0; }
.ana-mapas figcaption { font-weight: 600; margin-bottom: .4rem; color: var(--azul-clube); font-family: var(--cond); font-size: 1.05rem; }
.mapa-zonas { width: 100%; height: auto; display: block; background: var(--relva); border-radius: 6px; }
.mapa-zonas .zona rect { fill: var(--marinho); stroke: none; }
.mapa-zonas .zona text { font: 600 3.2px 'Barlow', sans-serif; fill: var(--tinta); text-anchor: middle; dominant-baseline: central; }
.mapa-zonas .zona text.claro { fill: #fff; }
.mapa-zonas .linhas-v rect, .mapa-zonas .linhas-v path { fill: none; stroke: #FBFCFA; stroke-width: .3; }
.mapa-zonas .fora-area { font: 600 2.6px 'Barlow', sans-serif; fill: var(--tinta); text-anchor: middle; }
.mapa-fora { margin: .4rem 0 0; font-size: .9rem; color: var(--tinta2); }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: #F3F5F9; }
tr.clicavel:focus-visible { outline: 2px solid var(--nos); outline-offset: -2px; }
@media print { .mapa-zonas, .mapa-zonas .zona rect { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .ana-mapas { grid-template-columns: 1fr 1fr; } }
.lista-eventos li { grid-template-columns: 3.3rem auto 1fr auto; }
.ev-min.ev-tempo { font-size: .85rem; white-space: nowrap; padding-top: .1rem; }
.resumo-cod td:first-child { white-space: nowrap; }
@media (max-width: 520px) { .lista-eventos li { grid-template-columns: 3.1rem auto 1fr; } .lista-eventos .ev-acoes { grid-column: 3; } .cod-equipa { font-size: 1.1rem; } }

/* ---------- Visão geral ---------- */
.visao-grelha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; align-items: start; }
.visao-grelha .bloco { margin: 0; }
@media (max-width: 960px) { .visao-grelha { grid-template-columns: minmax(0, 1fr); } }
.visao-rot { margin: 0 0 .5rem; font-size: .82rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dourado); }
.visao-proximo { border-top: 4px solid var(--marinho); }
.visao-jogo { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.visao-jogo h2 { font-size: 2rem; margin: 0; }
.visao-detalhe { margin: .2rem 0 0; color: var(--tinta2); }
.visao-contagem { background: var(--marinho); color: #fff; border-radius: 999px; padding: .3rem .85rem; font-weight: 600; white-space: nowrap; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.visao-dados { display: grid; gap: .35rem; margin: 1rem 0; }
.visao-dados div { display: grid; grid-template-columns: minmax(9rem, 12rem) minmax(0, 1fr); gap: .75rem; padding: .35rem 0; border-bottom: 1px solid var(--linha); }
.visao-dados dt { color: var(--fraco); font-size: .9rem; }
.visao-dados dd { margin: 0; }
.visao-forma .res, .visao-forma-linha .res { margin-right: .2rem; }
.visao-numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: .75rem; margin-bottom: .75rem; }
.visao-numeros div { display: flex; flex-direction: column; }
.visao-num { font-family: var(--cond); font-size: 1.9rem; font-weight: 600; color: var(--azul-clube); line-height: 1.1; }
.visao-ultimo { border-top: 1px solid var(--linha); margin-top: .75rem; padding-top: .75rem; }
.visao-ultimo p { margin: 0 0 .3rem; }

<script>
// ---------- Utilitários ----------
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// Normaliza nomes para comparação: minúsculas, sem acentos nem pontuação.
function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

// Lê números em formatos variados: 1.25 | 1,25 | 52% | "-" | 1 234
function parseNum(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  let s = String(v).trim().replace(/\s/g, '').replace('%', '');
  if (s === '' || s === '-' || s === '—') return null;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

// Devolve 'YYYY-MM-DD' ou null.
function parseData(v) {
  if (v === null || v === undefined || v === '') return null;
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (v instanceof Date && !isNaN(v)) {
    // As datas do Excel chegam à meia-noite UTC; arredonda ao dia mais próximo.
    return iso(new Date(v.getTime() + 12 * 3600 * 1000));
  }
  if (typeof v === 'number' && v > 20000 && v < 80000) { // número de série do Excel
    const d = new Date(Math.round((v - 25569) * 86400 * 1000) + 12 * 3600 * 1000);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
  if (m) {
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }
  return null;
}

const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function fmtData(iso, curta = false) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return curta ? `${d}/${m}` : `${Number(d)} ${MESES[Number(m) - 1]} ${y}`;
}

// Ordena jogos pela data; quando falta a data (ficheiros por jornada), pela jornada.
function compararJogos(a, b) {
  if (a._ordem && b._ordem && a._ordem !== b._ordem) return a._ordem.localeCompare(b._ordem);
  if (a.data && b.data && a.data !== b.data) return a.data.localeCompare(b.data);
  const ja = a.jornada ?? null, jb = b.jornada ?? null;
  if (ja !== null && jb !== null && ja !== jb) return ja - jb;
  return String(a.data || '').localeCompare(String(b.data || '')) || String(a.competicao || '').localeCompare(String(b.competicao || ''));
}
// Data aproximada para ordenar jogos sem data: parte da jornada mais próxima que tem data (uma semana por jornada).
function calcularOrdemJogos(jogos) {
  const porComp = {};
  for (const j of jogos) if (j.data && j.jornada !== null && j.jornada !== undefined) (porComp[norm(j.competicao)] ||= []).push(j);
  const dia = 86400000;
  for (const j of jogos) {
    if (j.data) { j._ordem = j.data; continue; }
    const ref = (porComp[norm(j.competicao)] || []).slice().sort((a, b) => Math.abs(a.jornada - j.jornada) - Math.abs(b.jornada - j.jornada))[0];
    if (ref && j.jornada !== null && j.jornada !== undefined) {
      j._ordem = new Date(Date.parse(ref.data) + (j.jornada - ref.jornada) * 7 * dia).toISOString().slice(0, 10) + '~';
    } else j._ordem = null;
  }
}

// "9 ago 2026", ou "Jornada 5" / "J5" quando não há data.
function quandoJogo(j, curto = false) {
  if (!j) return '';
  if (j.data) return fmtData(j.data, curto);
  if (j.jornada !== null && j.jornada !== undefined) return curto ? `J${j.jornada}` : `Jornada ${j.jornada}`;
  return '';
}

function fmtNum(n, casas = 1) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '–';
  const arred = Math.round(n * 10 ** casas) / 10 ** casas;
  return arred.toLocaleString('pt-PT', { minimumFractionDigits: Number.isInteger(arred) ? 0 : casas, maximumFractionDigits: casas });
}

function fmtSinal(n, casas = 1) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '–';
  const t = fmtNum(Math.abs(n), casas);
  return n > 0 ? `+${t}` : n < 0 ? `−${t}` : t;
}

function media(arr) {
  const v = arr.filter(x => x !== null && x !== undefined && Number.isFinite(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function soma(arr) {
  return arr.filter(x => Number.isFinite(x)).reduce((a, b) => a + b, 0);
}

function toast(msg, tipo = 'ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${tipo}`;

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch { /* sem armazenamento */ } }

function confirmar(msg, botao = 'Apagar') {
  return new Promise(resolve => {
    const d = document.createElement('dialog');
    d.className = 'dialogo';
    d.innerHTML = `<p>${esc(msg)}</p><div class="acoes"><button class="btn" value="nao">Cancelar</button><button class="btn btn-perigo" value="sim">${esc(botao)}</button></div>`;

    d.addEventListener('click', e => {

      d.close(); d.remove(); resolve(b.value === 'sim');

    d.addEventListener('cancel', () => { d.remove(); resolve(false); });

// ---------- Acesso aos dados ----------
// Duas implementações com a mesma interface:
//   SupaDB  -> o vosso projeto Supabase
//   LocalDB -> modo de demonstração (dados de exemplo guardados no browser)

const TABELAS_CHAVE = { mapeamento_nomes: ['tipo', 'original'] };
const BUCKET = 'exportacoes-wyscout';

class SupaDB {
  constructor(url, chave) {
    this.modo = 'supabase';
    this.url = url;
    this.sb = window.supabase.createClient(url, chave);
  }
  _ok({ data, error }) {
    if (error) throw new Error(traduzErro(error.message || String(error)));
    return data;
  }
  async sessao() { return this._ok(await this.sb.auth.getSession()).session; }
  async entrar(email, password) { this._ok(await this.sb.auth.signInWithPassword({ email, password })); }
  async sair() { await this.sb.auth.signOut(); }
  async perfil() {
    const { user } = this._ok(await this.sb.auth.getUser());
    const p = this._ok(await this.sb.from('perfis').select('*').eq('id', user.id).maybeSingle());
    return p || { id: user.id, email: user.email, papel: 'equipa_tecnica' };
  }
  // Lê tudo, página a página (o Supabase devolve no máximo 1000 linhas por pedido).
  async listar(tabela, ordem = 'created_at') {
    const pagina = 1000; let todas = []; let de = 0;
    for (;;) {
      let q = this.sb.from(tabela).select('*').order(ordem, { ascending: true });
      if (ordem !== 'id' && !TABELAS_CHAVE[tabela]) q = q.order('id', { ascending: true });
      const linhas = this._ok(await q.range(de, de + pagina - 1));
      todas = todas.concat(linhas);
      if (linhas.length < pagina) return todas;
      de += pagina;
    }
  }
  async upsert(tabela, linhas, onConflict) {
    let out = [];
    for (let i = 0; i < linhas.length; i += 500) {
      const parte = linhas.slice(i, i + 500);
      out = out.concat(this._ok(await this.sb.from(tabela).upsert(parte, { onConflict }).select()));
    }
    return out;
  }
  async inserir(tabela, linha) { return this._ok(await this.sb.from(tabela).insert(linha).select().single()); }
  async inserirVarios(tabela, linhas) {
    let out = [];
    for (let i = 0; i < linhas.length; i += 500) out = out.concat(this._ok(await this.sb.from(tabela).insert(linhas.slice(i, i + 500)).select()));
    return out;
  }
  async atualizar(tabela, filtro, patch) { return this._ok(await this.sb.from(tabela).update(patch).match(filtro).select()); }
  async apagar(tabela, filtro) { this._ok(await this.sb.from(tabela).delete().match(filtro)); }
  async carregarFicheiro(ficheiro) {
    const nome = ficheiro.name.normalize('NFD').replace(/[^\w.-]+/g, '_');
    const caminho = `${new Date().toISOString().slice(0, 10)}/${Date.now()}-${nome}`;
    this._ok(await this.sb.storage.from(BUCKET).upload(caminho, ficheiro, { upsert: false }));
    return caminho;
  }
}

function traduzErro(msg) {
  if (/Invalid login credentials/i.test(msg)) return 'Email ou palavra-passe incorretos.';
  if (/Email not confirmed/i.test(msg)) return 'Este email ainda não foi confirmado. Confirme-o no Supabase (Authentication > Users).';
  if (/row-level security/i.test(msg)) return 'Sem permissão: só utilizadores do departamento podem alterar dados.';
  if (/Failed to fetch|NetworkError/i.test(msg)) return 'Não foi possível ligar ao Supabase. Verifique a internet e o URL do projeto.';
  if (/relation .* does not exist|Could not find the table/i.test(msg)) return 'As tabelas não existem. Corra o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/agenda|modelo_microciclo/i.test(msg) && /does not exist|Could not find/i.test(msg)) return 'Falta atualizar a base de dados para o calendário. Corra outra vez o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/column .*(tm_id|tm_url|nacionalidade)|'(tm_id|tm_url|nacionalidade)' column/i.test(msg)) return 'Falta atualizar a base de dados para o Transfermarkt. Corra outra vez o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/Bucket not found/i.test(msg)) return 'O espaço de ficheiros não existe. Corra o ficheiro schema.sql no Supabase.';
  return msg;
}

class LocalDB {
  constructor() {
    this.modo = 'demo';
    this.dados = lsGet('analise_demo_v7') || null;
    if (!this.dados) { this.dados = gerarDemo(); this._guardar(); }
  }
  _guardar() { lsSet('analise_demo_v7', this.dados); }
  _t(tabela) { return (this.dados[tabela] ||= []); }
  async sessao() { return { demo: true }; }
  async entrar() {}
  async sair() {}
  async perfil() { return { id: 'demo', email: 'demonstracao@clube.pt', papel: 'departamento' }; }
  async listar(tabela, ordem = 'created_at') {
    const l = this._t(tabela).map(r => structuredClone(r));
    return l.sort((a, b) => String(a[ordem] ?? '').localeCompare(String(b[ordem] ?? '')));
  }
  _completar(tabela, linha) {
    const agora = new Date().toISOString();
    const r = { ...linha };
    if (!TABELAS_CHAVE[tabela] && !r.id) r.id = uuid();
    if (!('created_at' in r) && tabela !== 'configuracao' && !TABELAS_CHAVE[tabela]) r.created_at = agora;
    if (tabela.startsWith('estatisticas')) r.updated_at = agora;
    return r;
  }
  async upsert(tabela, linhas, onConflict) {
    const chaves = onConflict.split(',').map(s => s.trim());
    const t = this._t(tabela); const out = [];
    for (const linha of linhas) {
      const ex = t.find(r => chaves.every(k => String(r[k]) === String(linha[k])));
      if (ex) { Object.assign(ex, linha); if (tabela.startsWith('estatisticas')) ex.updated_at = new Date().toISOString(); out.push(structuredClone(ex)); }
      else { const n = this._completar(tabela, linha); t.push(n); out.push(structuredClone(n)); }
    }
    this._guardar(); return out;
  }
  async inserir(tabela, linha) {
    const n = this._completar(tabela, linha); this._t(tabela).push(n); this._guardar(); return structuredClone(n);
  }
  async inserirVarios(tabela, linhas) { const out = []; for (const l of linhas) out.push(await this.inserir(tabela, l)); return out; }
  async atualizar(tabela, filtro, patch) {
    const out = [];
    for (const r of this._t(tabela)) {
      if (Object.entries(filtro).every(([k, v]) => String(r[k]) === String(v))) { Object.assign(r, patch); out.push(structuredClone(r)); }
    }
    this._guardar(); return out;
  }
  async apagar(tabela, filtro) {
    const corresponde = r => Object.entries(filtro).every(([k, v]) => String(r[k]) === String(v));
    const apagados = this._t(tabela).filter(corresponde);
    this.dados[tabela] = this._t(tabela).filter(r => !corresponde(r));
    if (tabela === 'jogos') { // apagar em cascata, como no Supabase
      const ids = new Set(apagados.map(r => r.id));
      for (const t of ['estatisticas_equipa', 'estatisticas_jogador', 'eventos']) this.dados[t] = this._t(t).filter(r => !ids.has(r.jogo_id));
    }
    this._guardar();
  }
  async carregarFicheiro(f) { return `demonstracao/${f.name}`; }
  repor() { this.dados = gerarDemo(); this._guardar(); }
}

// ---------- Dados de demonstração (fictícios) ----------
function gerarDemo() {

      linhaLiga(jornada, casa, fora, 'casa', gc, gf, mc, j.data); linhaLiga(jornada, fora, casa, 'fora', gf, gc, mf, j.data);
      gerarOps({ partida_id: p.id }, casa, Math.max(gc, inteiro(3, 10)), gc); gerarOps({ partida_id: p.id }, fora, Math.max(gf, inteiro(2, 9)), gf);
    }
  }

  // Próximos jogos (por disputar) e microciclos criados a partir do modelo.
  const ultimo = dados.jogos[dados.jogos.length - 1];
  [[adversarios[2], 'fora'], [adversarios[5], 'casa'], [adversarios[8], 'fora']].forEach(([adv, local], i) => {
    dados.jogos.push({ id: uuid(), data: new Date(Date.parse(ultimo.data) + (i + 1) * 7 * 86400000).toISOString().slice(0, 10), adversario: adv, competicao: 'Liga', jornada: jornada + i + 1, local, golos_marcados: null, golos_sofridos: null, notas: null, created_at: new Date().toISOString() });
  });
  dados.agenda = [];
  const n = dados.jogos.length;
  for (const j of [dados.jogos[n - 4], dados.jogos[n - 3]]) {
    for (const it of MODELO_PADRAO) {
      const data = new Date(Date.parse(j.data) + it.md * 86400000).toISOString().slice(0, 10);
      dados.agenda.push({ id: uuid(), tipo: it.tipo, titulo: it.titulo, data, hora_inicio: it.hora_inicio || null, hora_fim: it.hora_fim || null, local: it.tipo === 'treino' ? 'Campo 1' : it.tipo === 'reuniao' ? 'Sala de vídeo' : null,
        responsavel: it.responsavel || null, estado: it.tipo === 'tarefa' ? (j === dados.jogos[n - 4] ? 'feito' : 'por_fazer') : null, descricao: null, jogo_id: j.id, md: it.md, created_at: new Date().toISOString() });
    }
  }
  return dados;
}

// ---------- Leitura das exportações Wyscout ----------
// As exportações do Wyscout têm cabeçalhos como "Shots / on target" que ocupam
// várias colunas (total, sucesso, %). As colunas vazias a seguir são nomeadas:
//   "Shots", "Shots / on target", "Shots / on target %"

const PAPEIS = {
  data: { rotulo: 'Data', re: /^(date|data|fecha)$/i },
  jogo: { rotulo: 'Jogo', re: /^(match|jogo|partida|game)$/i },
  competicao: { rotulo: 'Competição', re: /^(competition|competi[cç][aã]o|liga|torneio)$/i },
  equipa: { rotulo: 'Equipa', re: /^(team|equipa|equipo|clube)$/i },
  golos: { rotulo: 'Golos', re: /^(goals|golos|goles)$/i },
  esquema: { rotulo: 'Sistema tático', re: /^(scheme|esquema|sistema|formation)$/i },
  jogador: { rotulo: 'Jogador', re: /^(player|jogador|jugador|name|nome)$/i },
  posicao: { rotulo: 'Posição', re: /^(position|posi[cç][aã]o|pos\.?)$/i },
  minutos: { rotulo: 'Minutos', re: /^(minutes played|minutes|minutos( jogados)?|min\.?):?$/i }
};
const PAPEIS_EQUIPA = ['data', 'jogo', 'competicao', 'equipa', 'golos', 'esquema'];
const PAPEIS_JOGADOR = ['jogador', 'equipa', 'posicao', 'minutos', 'data', 'jogo', 'competicao'];

function lerFolha(buffer) {
  const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' })
    .filter(r => r.some(c => String(c).trim() !== ''));
}

function detetarCabecalho(linhas) {
  const reTodos = Object.values(PAPEIS).map(p => p.re);
  for (let i = 0; i < Math.min(15, linhas.length); i++) {
    const textos = linhas[i].filter(c => typeof c === 'string' && c.trim() && parseNum(c) === null);
    if (textos.length >= 3 && textos.some(t => reTodos.some(re => re.test(t.trim())))) return i;
  }
  return 0;
}

function nomesColunas(cabecalho, largura) {
  const nomes = []; const brutos = [];
  for (let i = 0; i < largura; i++) brutos.push(String(cabecalho[i] ?? '').replace(/\s+/g, ' ').trim());
  let i = 0;
  while (i < largura) {
    const base = brutos[i];
    if (!base) { nomes.push(`Coluna ${i + 1}`); i++; continue; }
    let n = 0; while (i + 1 + n < largura && !brutos[i + 1 + n]) n++;
    const partes = base.split(/\s*\/\s*/);
    if (n === 0) nomes.push(base);
    else if (partes.length > 1) {
      nomes.push(partes[0], base);
      for (let k = 2; k <= n; k++) nomes.push(k === 2 ? `${base} %` : `${base} (${k})`);
    } else {
      nomes.push(base);
      for (let k = 1; k <= n; k++) nomes.push(`${base} (${k + 1})`);
    }
    i += n + 1;
  }
  // Nomes repetidos ficam com sufixo.
  const vistos = {};
  return nomes.map(nm => { vistos[nm] = (vistos[nm] || 0) + 1; return vistos[nm] > 1 ? `${nm} (${vistos[nm]})` : nm; });
}

// Prepara a tabela: nomes de colunas, linhas de dados, papéis detetados e colunas numéricas.
function prepararTabela(linhas, papeisPossiveis) {
  const ih = detetarCabecalho(linhas);
  const largura = Math.max(...linhas.map(r => r.length));
  const colunas = nomesColunas(linhas[ih] || [], largura);
  const dadosLinhas = linhas.slice(ih + 1);
  const papeis = {};
  for (const p of papeisPossiveis) {
    const idx = colunas.findIndex((c, i) => PAPEIS[p].re.test(c) && !Object.values(papeis).includes(i));
    papeis[p] = idx >= 0 ? idx : null;
  }
  const numericas = colunas.map((_, ci) => {
    const vals = dadosLinhas.map(r => r[ci]).filter(v => v !== '' && v !== null && v !== undefined);
    if (!vals.length) return false;
    return vals.filter(v => !(v instanceof Date) && parseNum(v) !== null).length / vals.length >= 0.6;
  });
  return { colunas, linhas: dadosLinhas, papeis, numericas };
}

function colunasMetricas(tab) {
  const usadas = new Set(Object.values(tab.papeis).filter(v => v !== null));
  const ignorar = /^(duration|dura[cç][aã]o|age|idade|height|altura|weight|peso|market value|valor de mercado|contract expires|n\.?º|number|#)$/i;
  return tab.colunas.map((c, i) => i).filter(i => tab.numericas[i] && !usadas.has(i) && !ignorar.test(tab.colunas[i]));
}

function lerMetricas(tab, linha) {
  const m = {};
  for (const i of colunasMetricas(tab)) {
    const n = parseNum(linha[i]);
    if (n !== null) m[tab.colunas[i]] = n;
  }
  if (tab.papeis.golos !== null && tab.papeis.golos !== undefined) {
    const g = parseNum(linha[tab.papeis.golos]); if (g !== null) m['Goals'] = g;
  }
  if (tab.papeis.esquema !== null && tab.papeis.esquema !== undefined && linha[tab.papeis.esquema]) m._esquema = String(linha[tab.papeis.esquema]);
  return m;
}

// "Casa - Fora 2:1" -> { casa, fora, gc, gf }
function lerTextoJogo(txt) {
  const s = String(txt ?? '').trim();
  let m = s.match(/^(.+?)\s+[-–]\s+(.+?)\s+(\d+)\s*[:\-–]\s*(\d+)\s*(\(.*\))?$/);
  if (m) return { casa: m[1].trim(), fora: m[2].trim(), gc: Number(m[3]), gf: Number(m[4]) };
  m = s.match(/^(.+?)\s+[-–]\s+(.+)$/);
  if (m) return { casa: m[1].trim(), fora: m[2].trim(), gc: null, gf: null };
  return null;
}

function criarIdentificador(cfg, mapeamentos) {
  const proprios = [cfg.nome_clube, ...(cfg.nomes_alternativos || [])].map(norm).filter(Boolean);
  const mapa = {};
  for (const m of mapeamentos) mapa[`${m.tipo}|${norm(m.original)}`] = m.normalizado;
  return {
    eNos: nome => { const n = norm(mapa[`equipa|${norm(nome)}`] || nome); return !!n && proprios.some(p => n === p); },
    equipa: nome => mapa[`equipa|${norm(nome)}`] || String(nome ?? '').trim(),
    jogador: nome => mapa[`jogador|${norm(nome)}`] || String(nome ?? '').trim(),
    temClube: proprios.length > 0
  };
}

// ---- Estatísticas de equipa: uma linha por equipa e por jogo ----
function analisarEquipa(tab, cfg, mapeamentos, jogosExistentes) {
  const id = criarIdentificador(cfg, mapeamentos);
  const P = tab.papeis; const avisos = [];
  if (!id.temClube) avisos.push('Defina o nome do clube em Definições para identificar as linhas da vossa equipa.');
  if (P.data === null) avisos.push('Não encontrei a coluna da data. Escolha-a acima.');
  if (P.equipa === null && P.jogo === null) avisos.push('Escolha a coluna da equipa ou do jogo.');
  if (avisos.length) return { jogos: [], avisos, ignoradas: 0 };

  const grupos = new Map(); let ignoradas = 0;
  for (const linha of tab.linhas) {
    const data = parseData(linha[P.data]);
    if (!data) { ignoradas++; continue; }
    const txt = P.jogo !== null ? String(linha[P.jogo] ?? '').trim() : '';
    const chave = `${data}|${txt}`;
    if (!grupos.has(chave)) grupos.set(chave, { data, txt, competicao: P.competicao !== null ? String(linha[P.competicao] ?? '').trim() : '', linhas: [] });
    grupos.get(chave).linhas.push(linha);
  }

  const existentes = new Set(jogosExistentes.map(j => `${j.data}|${norm(j.adversario)}`));
  const porChave = new Map();
  for (const g of grupos.values()) {
    const tj = lerTextoJogo(g.txt);
    let linhaNos = null, linhaAdv = null;
    for (const l of g.linhas) {
      const eq = P.equipa !== null ? l[P.equipa] : null;
      if (eq && id.eNos(eq)) linhaNos = linhaNos || l; else linhaAdv = linhaAdv || l;
    }
    if (P.equipa === null) { linhaNos = g.linhas[0]; linhaAdv = g.linhas[1] || null; }
    let local = null, gm = null, gs = null, adversario = null;
    if (tj) {
      if (id.eNos(tj.casa)) { local = 'casa'; adversario = id.equipa(tj.fora); gm = tj.gc; gs = tj.gf; }
      else if (id.eNos(tj.fora)) { local = 'fora'; adversario = id.equipa(tj.casa); gm = tj.gf; gs = tj.gc; }
    }
    if (!linhaNos && P.equipa !== null) {
      avisos.push(`${fmtData(g.data)} — ${g.txt || 'jogo sem descrição'}: a vossa equipa não aparece. Confirme o nome do clube em Definições.`);
      continue;
    }
    if (!adversario && linhaAdv && P.equipa !== null) adversario = id.equipa(linhaAdv[P.equipa]);
    if (!adversario) { avisos.push(`${fmtData(g.data)}: não consegui identificar o adversário.`); continue; }
    const mN = lerMetricas(tab, linhaNos);
    const mA = linhaAdv ? lerMetricas(tab, linhaAdv) : null;
    if (gm === null && Number.isFinite(mN['Goals'])) gm = mN['Goals'];
    if (gs === null && mA && Number.isFinite(mA['Goals'])) gs = mA['Goals'];
    const j = {
      data: g.data, adversario, competicao: g.competicao || null, local, golos_marcados: gm, golos_sofridos: gs,
      equipaNos: P.equipa !== null ? String(linhaNos[P.equipa]) : cfg.nome_clube,
      equipaAdv: linhaAdv && P.equipa !== null ? String(linhaAdv[P.equipa]) : adversario,
      metricasNos: mN, metricasAdv: mA,
      existe: existentes.has(`${g.data}|${norm(adversario)}`)
    };
    porChave.set(`${j.data}|${norm(j.adversario)}`, j); // ficheiros com o mesmo jogo repetido: fica o último
  }
  const jogos = [...porChave.values()].sort((a, b) => a.data.localeCompare(b.data));
  return { jogos, avisos, ignoradas, nMetricas: colunasMetricas(tab).length };
}

// ---- Estatísticas de jogadores ----
// opcoes: { jogoId, ladoPadrao }  (jogoId é usado quando o ficheiro não tem data)
// Compara nomes de equipas escritos de formas diferentes ("Benfica II" / "Benfica B", "UD Leiria" / "União Leiria").
function chaveEquipa(nome) {
  return norm(nome).replace(/\b(fc|sc|cd|ud|ad|gd|cf|sad|futebol|clube|club|sport|uniao|de|da|do|dos|das)\b/g, ' ')
    .replace(/\b(ii|sub 23|u23)\b/g, 'b').replace(/\s+/g, ' ').trim();
}
function mesmaEquipa(a, b) {
  const x = chaveEquipa(a), y = chaveEquipa(b);
  if (!x || !y) return false;
  if (x === y || x.startsWith(y + ' ') || y.startsWith(x + ' ')) return true;
  const px = x.split(' '), py = y.split(' ');
  return px[0] === py[0] && px[0].length > 3 && (px.length === 1 || py.length === 1) && !px.includes('b') && !py.includes('b');
}
// Início da época (1 de julho) de uma data 'YYYY-MM-DD'.
function inicioEpoca(d) { const [y, m] = d.split('-').map(Number); return `${m >= 7 ? y : y - 1}-07-01`; }

// opcoes: { jogoId, ladoPadrao, jogador (quando o ficheiro é de um só jogador), criarJogos }
function analisarJogadores(tab, cfg, mapeamentos, jogos, opcoes) {
  const id = criarIdentificador(cfg, mapeamentos);
  const P = tab.papeis; const avisos = [];
  const tem = k => P[k] !== null && P[k] !== undefined;
  const umJogador = !tem('jogador');
  if (umJogador && !opcoes.jogador) return { linhas: [], avisos: ['Indique de que jogador é este ficheiro.'], ignoradas: 0, umJogador };
  const nossos = [cfg.nome_clube, ...(cfg.nomes_alternativos || [])].filter(Boolean);
  const eNos = nome => id.eNos(nome) || nossos.some(n => mesmaEquipa(n, nome));

  // Ficheiros com a coluna do jogo ("Casa - Fora 1:0"): só contam os jogos da vossa equipa, na época mais recente.
  const datas = tem('data') ? tab.linhas.map(l => parseData(l[P.data])).filter(Boolean) : [];
  let epoca = null;
  if (tem('jogo') && datas.length) {
    const dosNossos = tab.linhas.filter(l => { const t = lerTextoJogo(l[P.jogo]); return t && (eNos(t.casa) || eNos(t.fora)); }).map(l => parseData(l[P.data])).filter(Boolean).sort();
    if (dosNossos.length) epoca = inicioEpoca(dosNossos[dosNossos.length - 1]);
  }

  const porData = {}; for (const j of jogos) if (j.data) (porData[j.data] ||= []).push(j);
  const usados = new Set(); const novos = new Map();
  const resultado = new Map(); let ignoradas = 0, outrosClubes = 0, epocasAnteriores = 0; const datasSemJogo = new Set();
  for (const linha of tab.linhas) {
    const bruto = umJogador ? opcoes.jogador : String(linha[P.jogador] ?? '').trim();
    if (!bruto || /^(total|totais|m[eé]dia|average|sum)\b/i.test(bruto)) { ignoradas++; continue; }
    const d = tem('data') ? parseData(linha[P.data]) : null;
    let jogo = null, novoJogo = null, atualizaData = false, resultadoNovo = null;
    if (tem('jogo')) {
      const t = lerTextoJogo(linha[P.jogo]);
      if (!t) { ignoradas++; continue; }
      const casa = eNos(t.casa), fora = eNos(t.fora);
      if (!casa && !fora) { outrosClubes++; continue; }
      if (epoca && d && d < epoca) { epocasAnteriores++; continue; }
      const adv = casa ? t.fora : t.casa, local = casa ? 'casa' : 'fora';
      const gm = casa ? t.gc : t.gf, gs = casa ? t.gf : t.gc;
      // 1) mesma data e adversário; 2) jogo sem data com o mesmo adversário e local (de preferência com o mesmo resultado)
      jogo = (d ? (porData[d] || []) : []).find(j => mesmaEquipa(j.adversario, adv)) || null;
      if (!jogo) {
        let cand = jogos.filter(j => !j.data && !usados.has(j.id) && mesmaEquipa(j.adversario, adv) && (!j.local || j.local === local));
        const mesmoRes = cand.filter(j => j.golos_marcados === gm && j.golos_sofridos === gs);
        if (mesmoRes.length) cand = mesmoRes;
        const exato = cand.filter(j => chaveEquipa(j.adversario) === chaveEquipa(adv));
        if (exato.length === 1) cand = exato;
        if (cand.length === 1) { jogo = cand[0]; atualizaData = !!d; }
      }
      // Jogo ainda sem resultado (ex.: "por jogar" no ficheiro da liga): fica com o resultado deste ficheiro.
      if (jogo && !Number.isFinite(jogo.golos_marcados) && Number.isFinite(gm)) resultadoNovo = { golos_marcados: gm, golos_sofridos: gs };
      if (jogo) usados.add(jogo.id);
      else if (d && opcoes.criarJogos !== false) {
        const k = `${d}|${norm(adv)}`;
        if (!novos.has(k)) novos.set(k, { data: d, adversario: id.equipa(adv), competicao: tem('competicao') ? String(linha[P.competicao] ?? '').trim() || null : null, local, golos_marcados: gm, golos_sofridos: gs, novo: true });
        novoJogo = novos.get(k);
      } else { ignoradas++; continue; }
    } else if (tem('data')) {
      const cand = d ? porData[d] || [] : [];
      if (cand.length === 1) jogo = cand[0];
      else if (d) datasSemJogo.add(d);
    } else if (opcoes.jogoId) jogo = jogos.find(j => j.id === opcoes.jogoId);
    if (!jogo && !novoJogo) { ignoradas++; continue; }
    let lado = opcoes.ladoPadrao || 'nos'; let equipa = null;
    if (tem('equipa') && linha[P.equipa]) { equipa = String(linha[P.equipa]).trim(); lado = eNos(equipa) ? 'nos' : 'adversario'; }
    if (tem('jogo') && !tem('equipa')) lado = 'nos';
    const alvo = jogo || novoJogo;
    const reg = {
      jogo_id: jogo ? jogo.id : null, jogo: alvo, novoJogo, atualizaData: atualizaData ? d : null, resultadoNovo,
      jogador: umJogador ? bruto : id.jogador(bruto), lado, equipa: equipa || (lado === 'nos' ? cfg.nome_clube : alvo.adversario),
      posicao: tem('posicao') ? String(linha[P.posicao] ?? '').trim() || null : null,
      minutos: tem('minutos') ? parseNum(linha[P.minutos]) : null, metricas: lerMetricas(tab, linha)
    };
    resultado.set(`${jogo ? jogo.id : `novo|${novoJogo.data}|${novoJogo.adversario}`}|${reg.jogador}|${reg.lado}`, reg);
  }
  if (!tem('data') && !tem('jogo') && !opcoes.jogoId) avisos.push('O ficheiro não tem data: escolha o jogo a que pertence.');
  for (const d of datasSemJogo) avisos.push(`Não há um jogo único registado a ${fmtData(d)}. Importe primeiro as estatísticas de equipa ou crie o jogo em Jogos.`);
  return { linhas: [...resultado.values()], avisos, ignoradas, outrosClubes, epocasAnteriores, epoca, umJogador, nNovos: novos.size, nMetricas: colunasMetricas(tab).length };
}

// ---------- Ficheiros CSV (separador ; ou , e decimais com vírgula) ----------
// Lidos à mão: o leitor de Excel interpreta "1,27" como 127 e nem sempre deteta o ";".
function lerCsv(texto) {
  texto = texto.replace(/^﻿/, '');
  const primeira = texto.split(/\r?\n/, 1)[0];
  const sep = [';', '\t', ','].map(c => [c, primeira.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = []; let linha = [], campo = '', aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false;
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = '';
    } else campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.map(l => l.map(x => x.trim())).filter(l => l.some(x => x !== ''));
}

async function lerFicheiroTabela(f) {
  if (/\.(csv|txt|tsv)$/i.test(f.name)) {
    const buf = await f.arrayBuffer();
    let texto = new TextDecoder('utf-8').decode(buf);
    if (texto.includes(String.fromCharCode(0xFFFD))) texto = new TextDecoder('windows-1252').decode(buf); // ficheiros gravados pelo Excel em Windows
    return lerCsv(texto);
  }
  return lerFolha(await f.arrayBuffer());
}

// ---------- Ficheiro da liga: uma linha por equipa e por jornada, sem datas ----------
const COLS_LIGA = {
  competicao: /^competi[cç][aã]o$|^competition$/i, jornada: /^(j|jornada|round|matchday)$/i, equipa: /^(equipa|team)$/i,
  adversario: /^(advers[aá]rio|opponent)$/i, local: /^(local|venue|casa\/fora)$/i, resultado: /^(resultados?|result|score)$/i,
  golos: /^(golos|goals)$/i, golos_sofridos: /^(golos sofridos|goals conceded|goals against)$/i
};

// Devolve a tabela preparada se o ficheiro tiver o formato da liga; senão null.
function detetarFormatoLiga(linhas) {
  const cab = (linhas[0] || []).map(c => String(c).replace(/\s+/g, ' ').trim());
  const idx = Object.fromEntries(Object.entries(COLS_LIGA).map(([k, re]) => [k, cab.findIndex(c => re.test(c))]));
  // Se houver várias colunas "J"/"Jornada", prefere a numérica.
  const candidatasJ = cab.map((c, i) => i).filter(i => COLS_LIGA.jornada.test(cab[i]));
  const numerica = candidatasJ.find(i => linhas.slice(1, 6).every(l => parseNum(l[i]) !== null || String(l[i] ?? '').trim() === ''));
  if (numerica !== undefined) idx.jornada = numerica;
  const temData = cab.some(c => PAPEIS.data.re.test(c));
  if (temData || idx.equipa < 0 || idx.adversario < 0 || idx.jornada < 0) return null;
  const papeis = new Set(Object.values(idx).filter(i => i >= 0));
  candidatasJ.forEach(i => papeis.add(i));
  const dados = linhas.slice(1);
  const metricas = cab.map((c, i) => i).filter(i => !papeis.has(i) && cab[i] &&
    dados.some(l => parseNum(l[i]) !== null) && dados.every(l => String(l[i] ?? '').trim() === '' || parseNum(l[i]) !== null));
  const equipas = [...new Set(dados.map(l => String(l[idx.equipa] ?? '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));
  return { formato: 'liga', cab, idx, metricas, linhas: dados, equipas };
}

// equipaNossa: nome da equipa no ficheiro (escolhido pelo utilizador ou detetado pelas Definições).
function analisarLiga(tab, cfg, mapeamentos, jogosExistentes, equipaNossa) {
  const id = criarIdentificador(cfg, mapeamentos);
  const I = tab.idx; const avisos = [];
  const nossa = equipaNossa || tab.equipas.find(e => id.eNos(e)) || null;
  const liga = [], jogos = [], porJogar = [];
  const existentes = {};
  for (const j of jogosExistentes) existentes[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`] = j;
  const val = (l, k) => (I[k] >= 0 ? l[I[k]] : null);
  const registo = l => {
    const metricas = {};
    for (const i of tab.metricas) { const n = parseNum(l[i]); if (n !== null) metricas[tab.cab[i]] = n; }
    return metricas;
  };
  // Equipa + adversário: aguenta jogos em atraso registados na mesma jornada.
  const chave = (comp, jor, eq, adv) => `${norm(comp)}|${jor}|${norm(eq)}|${norm(adv)}`;
  const porEquipa = {};
  let ignoradas = 0;
  for (const l of tab.linhas) {
    const jornada = parseNum(val(l, 'jornada')); const equipa = String(val(l, 'equipa') ?? '').trim();
    if (jornada === null || !equipa) { ignoradas++; continue; }
    const competicao = String(val(l, 'competicao') ?? '').trim() || 'Liga';
    const advFicheiro = String(val(l, 'adversario') ?? '').trim();
    const metricas = registo(l);
    const r = {
      competicao, jornada, equipa: id.equipa(equipa), equipaFicheiro: equipa, adversario: id.equipa(advFicheiro), adversarioFicheiro: advFicheiro,
      local: /^casa|^home/i.test(String(val(l, 'local') ?? '')) ? 'casa' : /^fora|^away/i.test(String(val(l, 'local') ?? '')) ? 'fora' : null,
      golos: parseNum(val(l, 'golos')), golos_sofridos: parseNum(val(l, 'golos_sofridos')), metricas,
      jogado: Object.keys(metricas).length > 0
    };
    porEquipa[chave(competicao, jornada, equipa, advFicheiro)] = r;
    if (r.jogado) liga.push(r);
  }
  // Golos sofridos: se a coluna não existir, vêm dos golos do adversário.
  for (const r of liga) if (r.golos_sofridos === null) r.golos_sofridos = porEquipa[chave(r.competicao, r.jornada, r.adversarioFicheiro, r.equipaFicheiro)]?.golos ?? null;
  if (!nossa) avisos.push('Escolha qual é a vossa equipa neste ficheiro.');
  else {
    for (const r of Object.values(porEquipa)) {
      if (norm(r.equipaFicheiro) !== norm(nossa)) continue;
      const adv = porEquipa[chave(r.competicao, r.jornada, r.adversarioFicheiro, r.equipaFicheiro)];
      const ex = existentes[`${norm(r.competicao)}|${r.jornada}|${norm(r.adversario)}`];
      const j = {
        competicao: r.competicao, jornada: r.jornada, adversario: r.adversario, local: r.local,
        golos_marcados: r.jogado ? r.golos : null, golos_sofridos: r.jogado ? r.golos_sofridos : null,
        metricasNos: r.jogado ? r.metricas : null, metricasAdv: r.jogado && adv?.jogado ? adv.metricas : null,
        equipaNos: r.equipa, equipaAdv: r.adversario, existe: !!ex, jogado: r.jogado
      };
      (r.jogado ? jogos : porJogar).push(j);
    }
    jogos.sort((a, b) => a.jornada - b.jornada); porJogar.sort((a, b) => a.jornada - b.jornada);
    if (!jogos.length && !porJogar.length) avisos.push(`A equipa "${nossa}" não tem jogos neste ficheiro.`);
  }
  // Jogos do campeonato (todas as equipas): um por par casa/fora.
  const partidas = new Map();
  for (const r of Object.values(porEquipa)) {
    const casa = r.local === 'fora' ? r.adversario : r.equipa, fora = r.local === 'fora' ? r.equipa : r.adversario;
    if (r.local === null && norm(r.equipa) > norm(r.adversario)) continue; // sem coluna "Local": um registo por par
    const k = `${norm(r.competicao)}|${norm(casa)}|${norm(fora)}`;
    const ehCasa = r.local !== 'fora';
    const atual = partidas.get(k) || { competicao: r.competicao, jornada: r.jornada, casa, fora, golos_casa: null, golos_fora: null };
    if (r.jogado) { atual.golos_casa = ehCasa ? r.golos : r.golos_sofridos; atual.golos_fora = ehCasa ? r.golos_sofridos : r.golos; }
    partidas.set(k, atual);
  }
  return { formato: 'liga', nossa, liga, jogos, porJogar, partidas: [...partidas.values()], avisos, ignoradas, nMetricas: tab.metricas.length, equipas: tab.equipas };
}

// ---------- Folha de codificação de oportunidades (método antigo, por zonas) ----------
const COLS_FOLHA = {
  clube: /^clube$|^equipa$/i, jornada: /^jornada$|^j$/i, adversario: /^advers[aá]rio$/i, treinador: /^treinador$/i, local: /^local$/i,
  momento: /^momento$/i, sub: /^sub.?momento$/i, mecanismo: /^mecanismo$/i, lado: /^lado$/i, parte: /^parte$/i, tempo: /^tempo$/i,
  zonaPasse: /^zona do passe$/i, quemPassa: /^quem faz o passe$/i, posPassa: /^posi[cç][aã]o de quem faz o passe$/i,
  zonaFin: /^zona de finaliza[cç][aã]o$/i, quemFin: /^quem finaliza$/i, posFin: /^posi[cç][aã]o de quem finaliza$/i, golo: /^golo\??$/i
};
function detetarFolhaOportunidades(linhas) {
  for (let ih = 0; ih < Math.min(5, linhas.length); ih++) {
    const cab = linhas[ih].map(c => String(c ?? '').trim());
    const idx = Object.fromEntries(Object.entries(COLS_FOLHA).map(([k, re]) => [k, cab.findIndex(c => re.test(c))]));
    if (['clube', 'adversario', 'momento', 'zonaFin', 'golo'].every(k => idx[k] >= 0)) return { formato: 'oportunidades', idx, linhas: linhas.slice(ih + 1) };
  }
  return null;
}

function analisarFolha(tab, partidas) {
  const I = tab.idx; const v = (l, k) => (I[k] >= 0 ? String(l[I[k]] ?? '').trim() : '');
  const comps = [...new Set(partidas.map(p => p.competicao))];
  const avisos = []; const registos = []; const semJornada = [], vazias = [], localTrocado = [], novos = new Map(), nomesLigados = new Map();
  const treinadores = new Map();
  tab.linhas.forEach((l, i) => {
    if (!v(l, 'clube') && !v(l, 'adversario')) { vazias.push(i + 2); return; }
    const jornada = parseNum(v(l, 'jornada'));
    if (jornada === null) { semJornada.push(i + 2); return; }
    const clube = v(l, 'clube'), adv = v(l, 'adversario');
    // Jogo do campeonato: mesma jornada e as duas equipas; senão, as duas equipas em qualquer jornada.
    const comEquipas = partidas.filter(p => (mesmaEquipa(p.casa, clube) && mesmaEquipa(p.fora, adv)) || (mesmaEquipa(p.fora, clube) && mesmaEquipa(p.casa, adv)));
    let p = comEquipas.find(x => x.jornada === jornada) || (comEquipas.length === 1 ? comEquipas[0] : null);
    if (!p) {
      const emCasa = !/^fora/i.test(v(l, 'local'));
      const k = `${jornada}|${norm(emCasa ? clube : adv)}|${norm(emCasa ? adv : clube)}`;
      if (!novos.has(k)) novos.set(k, { novo: true, competicao: comps[0] || 'Liga', jornada, casa: emCasa ? clube : adv, fora: emCasa ? adv : clube });
      p = novos.get(k);
    }
    const lado = mesmaEquipa(p.casa, clube) ? 'casa' : 'fora';
    if (norm(p[lado]) !== norm(clube)) nomesLigados.set(clube, p[lado]);
    if ((/^casa/i.test(v(l, 'local')) && lado === 'fora') || (/^fora/i.test(v(l, 'local')) && lado === 'casa')) localTrocado.push({ linha: i + 2, jornada, clube, jogador: v(l, 'quemFin') });
    const chaveP = p.novo ? `n:${p.jornada}|${norm(p.casa)}|${norm(p.fora)}` : p.id;
    if (v(l, 'treinador')) treinadores.set(`${chaveP}|${lado}`, v(l, 'treinador'));
    const momento = normMomento(v(l, 'momento')); const sub = normSub(momento, v(l, 'sub'));
    const zf = parseNum(v(l, 'zonaFin')), zp = parseNum(v(l, 'zonaPasse'));
    const semente = `${chaveP}|${i}`;
    const fin = zf >= 1 && zf <= 13 ? pontoNaZona('fin', zf, semente + 'f') : (sub === 'Penálti' ? { x: 89.6, y: 49 } : null);
    const pas = zp >= 1 && zp <= 13 && sub !== 'Penálti' ? pontoNaZona('passe', zp, semente + 'p') : null;
    const parte = /^1/.test(v(l, 'parte')) ? '1.ª parte' : /^2/.test(v(l, 'parte')) ? '2.ª parte' : null;
    const tempo = TEMPOS.find(t => norm(t) === norm(v(l, 'tempo'))) || null;
    registos.push({
      partida: p, lado, equipa: p[lado],
      tipo: 'oportunidade', momento, sub_momento: sub, mecanismo: normMecanismo(momento, sub, v(l, 'mecanismo')),
      corredor: CORREDORES.find(c => norm(c) === norm(v(l, 'lado'))) || null, parte: parte || parteDoTempo(tempo), tempo, minuto: null,
      zona_x: fin?.x ?? null, zona_y: fin?.y ?? null, passe_x: pas?.x ?? null, passe_y: pas?.y ?? null, local_aprox: true,
      assistente: normNome(v(l, 'quemPassa')), posicao_passe: normPosicao(v(l, 'posPassa')),
      jogador: normNome(v(l, 'quemFin')), posicao_finalizador: normPosicao(v(l, 'posFin')),
      resultado: /^s/i.test(v(l, 'golo')) ? 'Golo' : 'Sem golo', qualidade: sub === 'Penálti' ? 'Grande oportunidade' : 'Oportunidade', origem: 'folha'
    });
  });
  if (semJornada.length) avisos.push(`${semJornada.length} linhas sem jornada ficam de fora (jogos fora do campeonato).`);
  if (vazias.length) avisos.push(`${vazias.length} linhas vazias ignoradas.`);
  for (const [a, b] of nomesLigados) avisos.push(`"${a}" foi ligado a "${b}" (nome do ficheiro da liga).`);
  if (localTrocado.length) avisos.push(`${localTrocado.length === 1 ? '1 linha tem' : `${localTrocado.length} linhas têm`} o local trocado em relação ao jogo; ficam na equipa indicada em "Clube": ${localTrocado.slice(0, 4).map(x => `linha ${x.linha} (J${x.jornada}, ${x.clube}${x.jogador ? ', ' + x.jogador : ''})`).join('; ')}.`);
  if (novos.size) avisos.push(`${novos.size} ${novos.size === 1 ? 'jogo não existe' : 'jogos não existem'} no ficheiro da liga e ${novos.size === 1 ? 'vai ser criado' : 'vão ser criados'}: ${[...novos.values()].slice(0, 4).map(p => `J${p.jornada} ${p.casa}–${p.fora}`).join(', ')}.`);
  return { formato: 'oportunidades', registos, novos: [...novos.values()], treinadores, avisos, semJornada: semJornada.length };
}

  Object.assign(App.d, { jogos, estEq, estJog, eventos, mapas, importacoes, plantel, liga, agenda, partidas });
  const estEqPorJogo = {}, estJogPorJogo = {}, evPorJogo = {};
  for (const r of estEq) (estEqPorJogo[r.jogo_id] ||= {})[r.lado] = r.metricas || {};

  indexarPlantel();

}

  return `<img class="marca ${classe}" src="${SIMBOLO}" alt="" width="40" height="44">`;

function desenharEstrutura() {
  document.body.className = 'com-lateral';
  const demo = App.db.modo === 'demo';
  const clube = esc(App.cfg.nome_clube || 'Clube');
  $('#app').innerHTML = `
    <div class="fundo-img" aria-hidden="true"></div>
    <header class="barra-movel">
      <button class="botao-menu" id="b-menu" aria-label="Abrir menu" aria-controls="lateral" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      ${marcaSVG('marca-pequena')}<b class="nome-clube">${clube}</b><span id="vista-atual"></span>
    </header>
    <aside class="lateral" id="lateral">
      <div class="lateral-marca">${marcaSVG()}<div><b class="nome-clube">${clube}</b><span>Departamento de Análise</span></div></div>
      <nav class="lateral-nav" aria-label="Secções">
        ${Object.entries(VISTAS).filter(([, v]) => !v.so || pode()).map(([k, v]) => `<a href="#${k}" data-vista="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${v.icone}</svg>${v.nome}</a>`).join('')}
      </nav>
      <div class="lateral-conta">
        ${demo ? '<span class="etiqueta-demo" title="Os dados são fictícios e ficam só neste browser">Demonstração</span>' : ''}
        <span class="conta-email">${esc(App.perfil.email || '')}</span>
      </div>
    </aside>
    <div class="cortina" id="cortina" hidden></div>
    <main id="vista" tabindex="-1"></main>`;
  window.onhashchange = () => mostrarVista(location.hash.slice(1));
  const lateral = $('#lateral'), cortina = $('#cortina'), bMenu = $('#b-menu');
  const menu = abrir => {
    lateral.classList.toggle('aberta', abrir); cortina.hidden = !abrir; bMenu.setAttribute('aria-expanded', String(abrir));
    if (abrir) $('.lateral-nav a[aria-current]', lateral)?.focus(); else if (document.activeElement && lateral.contains(document.activeElement)) bMenu.focus();
  };
  bMenu.addEventListener('click', () => menu(true));
  cortina.addEventListener('click', () => menu(false));
  lateral.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    menu(false);
    if (a.dataset.vista === 'jogadores' && App.jog.modo === 'ficha') { App.jog.modo = 'plantel'; if (location.hash === '#jogadores') { e.preventDefault(); mostrarVista('jogadores'); } }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lateral.classList.contains('aberta')) menu(false); });
}

function mostrarVista(nome) {
  if (!VISTAS[nome] || (VISTAS[nome].so && !pode())) nome = 'visao';
  App.vista = nome;
  $$('.lateral-nav a').forEach(a => a.toggleAttribute('aria-current', a.dataset.vista === nome));
  const atual = $('#vista-atual'); if (atual) atual.textContent = VISTAS[nome].nome;
  window.scrollTo(0, 0);
  App.graficos.forEach(g => g.destroy()); App.graficos = [];
  const antiga = $('#vista'); const nova = antiga.cloneNode(false); antiga.replaceWith(nova); // limpa os eventos da vista anterior
  if (a11yFoco) nova.focus({ preventScroll: true });
  VISTAS[nome].desenhar();
}
let a11yFoco = false;

async function recarregar() {
  await carregarDados();
  $$('.nome-clube').forEach(m => { m.textContent = App.cfg.nome_clube || 'Clube'; });
  mostrarVista(App.vista);
}

// ---------- Campo (SVG) ----------
// Coordenadas dos eventos em % (0–100), a atacar para a direita.
function campoSVG({ eventos = [], metade = false, interativo = false, marcador = null, marcadorPasse = null, passes = false, classe = '' }) {
  const vx = metade ? 51 : -2, vw = metade ? 56 : 109;
  const k = metade ? 0.72 : 1;
  // Linhas do passe até à finalização (por baixo das marcas).
  const linhas = passes ? eventos.filter(e => e.passe_x != null && e.zona_x != null).map(e => `<line class="ev-linha ev-linha-${e.lado}" x1="${e.passe_x * 1.05}" y1="${e.passe_y * 0.68}" x2="${e.zona_x * 1.05}" y2="${e.zona_y * 0.68}"/><circle class="ev-passe ev-${e.lado}" cx="${e.passe_x * 1.05}" cy="${e.passe_y * 0.68}" r="${0.55 * k}"/>`).join('') : '';
  const marcas = eventos.map(e => marcaEvento(e, k)).join('');
  const mx = p => p.x * 1.05, my = p => p.y * 0.68;
  const sel = (marcador && marcadorPasse ? `<line class="marcador-linha" x1="${mx(marcadorPasse)}" y1="${my(marcadorPasse)}" x2="${mx(marcador)}" y2="${my(marcador)}"/>` : '')
    + (marcadorPasse ? `<g class="marcador marcador-passe"><circle cx="${mx(marcadorPasse)}" cy="${my(marcadorPasse)}" r="1.6"/></g>` : '')
    + (marcador ? `<g class="marcador"><circle cx="${mx(marcador)}" cy="${my(marcador)}" r="2.4"/><circle cx="${mx(marcador)}" cy="${my(marcador)}" r="0.7" class="ponto"/></g>` : '');
  return `<svg class="campo ${classe} ${interativo ? 'interativo' : ''}" viewBox="${vx} -2 ${vw} 72" ${interativo ? 'role="img" aria-label="Campo: clique para marcar a zona"' : 'role="img" aria-label="Mapa de eventos no campo"'}>
    <rect class="relva" x="${vx}" y="-2" width="${vw}" height="72"/>
    <g class="linhas">
      <rect x="0" y="0" width="105" height="68"/>
      <line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/>
      <rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/>
      <rect x="0" y="24.84" width="5.5" height="18.32"/><rect x="99.5" y="24.84" width="5.5" height="18.32"/>
      <path d="M16.5 26.7 A9.15 9.15 0 0 1 16.5 41.3"/><path d="M88.5 26.7 A9.15 9.15 0 0 0 88.5 41.3"/>
      <rect x="-1.5" y="30.34" width="1.5" height="7.32"/><rect x="105" y="30.34" width="1.5" height="7.32"/>
      <circle class="marca-penalti" cx="11" cy="34" r="0.35"/><circle class="marca-penalti" cx="94" cy="34" r="0.35"/><circle class="marca-penalti" cx="52.5" cy="34" r="0.35"/>
    </g>
    ${metade ? '' : '<text class="direcao" x="52.5" y="66.2">ataque →</text>'}
    <g class="eventos">${linhas}${marcas}</g>${sel}
  </svg>`;
}

function marcaEvento(e, k = 1) {
  if (e.zona_x === null || e.zona_x === undefined) return '';
  const x = e.zona_x * 1.05, y = e.zona_y * 0.68;
  const golo = e.resultado === 'Golo';
  const o = typeof dadosOportunidade === 'function' ? dadosOportunidade(e) : {};
  const titulo = `${Number.isFinite(e.minuto) ? `${e.minuto}' ` : o.tempo ? `${o.tempo} ` : ''}${[o.momento, o.sub, o.mecanismo].filter(Boolean).join(' · ') || 'Oportunidade'} · ${e.resultado || ''}${e.jogador ? ' · ' + e.jogador : ''}`;
  const cls = `ev ev-${e.lado} ${golo ? 'ev-golo' : ''} ${e.qualidade === 'Grande oportunidade' ? 'ev-grande' : ''}`;
  if (e.tipo === 'esquema_tatico') {
    return `<rect class="${cls}" x="${x - 1.1 * k}" y="${y - 1.1 * k}" width="${2.2 * k}" height="${2.2 * k}" transform="rotate(45 ${x} ${y})"><title>${esc(titulo)}</title></rect>`;
  }
  return `<circle class="${cls}" cx="${x}" cy="${y}" r="${(e.qualidade === 'Grande oportunidade' ? 1.45 : 1.1) * k}"><title>${esc(titulo)}</title></circle>`;
}

function legendaCampo() {
  return `<div class="legenda-campo">
    <span><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" class="ev ev-nos ev-golo"/></svg>Golo</span>
    <span><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" class="ev ev-nos"/></svg>Oportunidade</span>
    <span><svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" transform="rotate(45 5 5)" class="ev ev-nos"/></svg>Esquema tático</span>
    <span class="leg-tamanho">Maior = grande oportunidade</span>
  </div>`;
}

function rotuloJogo(j, curto = false) {
  if (!j) return '';
  const local = j.local === 'casa' ? '(C)' : j.local === 'fora' ? '(F)' : '';
  if (curto) return `${quandoJogo(j, true)} ${j.adversario} ${local}`.trim();
  const res = Number.isFinite(j.golos_marcados) && Number.isFinite(j.golos_sofridos) ? ` ${j.golos_marcados}–${j.golos_sofridos}` : '';
  return `${quandoJogo(j)} · ${j.adversario} ${local}${res}`;
}

function resultadoJogo(j) {
  if (!Number.isFinite(j.golos_marcados) || !Number.isFinite(j.golos_sofridos)) return null;
  return j.golos_marcados > j.golos_sofridos ? 'V' : j.golos_marcados < j.golos_sofridos ? 'D' : 'E';
}

// ---------- Jogos ----------
function desenharJogos() {
  const jogos = App.d.jogos.slice().sort((a, b) => compararJogos(b, a));
  const v = $('#vista');
  v.innerHTML = `
    <div class="cabecalho-vista">
      <div><h1>Jogos</h1><p class="nota">${jogos.length} jogos registados. Os jogos são criados ao importar estatísticas de equipa${pode() ? ', ou aqui, para codificar antes de importar' : ''}.</p></div>
      ${pode() ? '<button class="btn btn-prim" id="b-novo-jogo">Criar jogo</button>' : ''}
