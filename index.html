// ---------- Relatório da própria equipa ----------
const COR = { nos: '#2453C9', adv: '#C77A0F', tinta: '#17202B', tinta2: '#4B5563', grelha: '#E4E6E1', nosSuave: 'rgba(36,83,201,.45)' };
const PADRAO_METRICAS = [/^(xg|golos esperados)$/i, /^(shots|remates)$/i, /(on target|^remates à baliza)$/i, /^(passes \/ accurate %|% passes certos)$/i, /^ppda$/i, /^(recoveries \/ high|recuperações)$/i, /^(possession|posse)/i, /^(touches in penalty area|toques na área)$/i, /^entradas na grande área$/i];
const PADRAO_JOG = ['Goals', 'Golos', 'Assists', 'Assistências', 'xG', 'xA', 'Progressive passes', 'Recoveries', 'Recuperações', 'Passes certos', 'Duelos ganhos'];
// Métricas com nomes diferentes conforme o idioma da exportação.
const SINONIMOS = { golos: ['Goals', 'Golos'], assistencias: ['Assists', 'Assistências'], xg: ['xG'], xa: ['xA'] };
function valorSinonimo(obj, chave) { for (const k of SINONIMOS[chave]) if (Number.isFinite(obj?.[k])) return obj[k]; return null; }
const ePercentagem = k => /%/.test(k);

function chaveXG(mets) { return mets.find(k => /^xg$/i.test(k)) || mets.find(k => /^(expected goals|golos esperados)$/i.test(k)) || null; }

function jogosDoRelatorio() {
  const f = App.rel;
  // Só jogos já disputados (com resultado ou estatísticas); os jogos por jogar ficam de fora.
  let js = App.d.jogos.filter(j => resultadoJogo(j) || App.idx.estEq[j.id]).sort(compararJogos);
  if (f.competicao !== 'todas') js = js.filter(j => (j.competicao || '') === f.competicao);
  if (f.local !== 'todos') js = js.filter(j => j.local === f.local);
  if (f.periodo !== 'todos') js = js.slice(-Number(f.periodo));
  return js;
}

function metricasChave(disponiveis) {
  const escolhidas = (App.cfg.metricas_chave || []).filter(m => disponiveis.includes(m));
  if (escolhidas.length) return escolhidas;
  const out = [];
  for (const re of PADRAO_METRICAS) { const k = disponiveis.find(m => re.test(m) && !out.includes(m)); if (k) out.push(k); }
  return out.length ? out : disponiveis.slice(0, 6);
}

function novoGrafico(canvas, config) {
  Chart.defaults.font.family = "'Barlow', system-ui, sans-serif";

}

// Os gráficos passam a imagens durante a impressão, para se ajustarem ao tamanho da página.
function graficosParaImpressao() {
  const imgs = [];
  for (const g of App.graficos) {
    const c = g.canvas; if (!c?.isConnected) continue;
    const img = new Image(); img.className = 'grafico-img'; img.alt = c.getAttribute('aria-label') || ''; img.src = c.toDataURL('image/png');
    c.after(img); imgs.push(img);
  }
  document.body.classList.add('a-imprimir');
  return () => { imgs.forEach(i => i.remove()); document.body.classList.remove('a-imprimir'); };
}
// O browser abre a janela de impressão: escolher "Guardar como PDF". O título da página serve de nome ao ficheiro.
function exportarPdf(nomeFicheiro, opcoes = {}) {
  const antes = document.title;
  const estilo = document.createElement('style');
  if (opcoes.paisagem) { estilo.textContent = '@page { size: A4 landscape; margin: 10mm; }'; document.head.appendChild(estilo); }
  document.title = nomeFicheiro.replace(/[\\/:*?"<>|]+/g, '-').trim();
  const limpar = graficosParaImpressao();
  const repor = () => { document.title = antes; estilo.remove(); limpar(); window.removeEventListener('afterprint', repor); };
  window.addEventListener('afterprint', repor);
  window.print();
}

function valor(j, lado, k) { const m = App.idx.estEq[j.id]?.[lado]; const n = m ? m[k] : null; return Number.isFinite(n) ? n : null; }

function desenharPlacar(js, mets) {
  const res = js.map(resultadoJogo);
  const v = res.filter(r => r === 'V').length, e = res.filter(r => r === 'E').length, d = res.filter(r => r === 'D').length;
  const comRes = v + e + d;
  const gm = soma(js.map(j => j.golos_marcados)), gs = soma(js.map(j => j.golos_sofridos));
  const xg = chaveXG(mets);
  const evs = js.flatMap(j => App.idx.eventos[j.id] || []).filter(x => x.tipo === 'oportunidade');
  const cel = (rot, val, sub = '') => `<div class="placar-cel"><span class="placar-rot">${rot}</span><span class="placar-val">${val}</span>${sub ? `<span class="placar-sub">${sub}</span>` : ''}</div>`;
  $('#r-placar').innerHTML = [
    cel('Jogos', js.length, comRes ? `${v}V ${e}E ${d}D` : ''),
    (() => { const comp = competicaoDaClassificacao(js); const t = comp ? classificacao(comp) : []; const i = t.findIndex(x => eNossaEquipa(x.equipa));
      return i >= 0 ? cel('Classificação', `${i + 1}.º`, `${t[i].pts} pts em ${t[i].j} jogos`) : ''; })(),
    comRes ? cel('Pontos por jogo', fmtNum((3 * v + e) / comRes, 2)) : '',
    cel('Golos', `${gm}<i>–</i>${gs}`, 'marcados – sofridos'),
    xg ? cel('xG', `${fmtNum(soma(js.map(j => valor(j, 'nos', xg))))}<i>–</i>${fmtNum(soma(js.map(j => valor(j, 'adversario', xg))))}`, 'criado – sofrido') : '',
    evs.length ? cel('Oportunidades', `${evs.filter(x => x.lado === 'nos').length}<i>–</i>${evs.filter(x => x.lado === 'adversario').length}`, 'criadas – sofridas (codificadas)') : ''
  ].join('');
}

function desenharTendencia(js, mets, chave) {
  const el = $('#r-tendencia');
  if (!mets.length) { el.innerHTML = '<h2>Tendência</h2><p class="fraco">Sem estatísticas Wyscout para estes jogos.</p>'; return; }
  if (!App.rel.metrica || !mets.includes(App.rel.metrica)) App.rel.metrica = chave[0] || mets[0];
  const k = App.rel.metrica;
  const nos = js.map(j => valor(j, 'nos', k)), adv = js.map(j => valor(j, 'adversario', k));
  const movel = nos.map((_, i) => media(nos.slice(Math.max(0, i - 4), i + 1)));
  const ult = media(nos.slice(-5)), epoca = media(nos);
  const outras = mets.filter(m => !chave.includes(m));
  el.innerHTML = `
    <div class="bloco-cab"><h2>Tendência: ${esc(k)}</h2></div>
    <p class="destaque">Média nos últimos ${Math.min(5, nos.filter(Number.isFinite).length)} jogos: <b>${fmtNum(ult, 2)}</b>, contra <b>${fmtNum(epoca, 2)}</b> no período (${fmtSinal(ult - epoca, 2)}).</p>
    <div class="seletor-metrica so-ecra" role="radiogroup" aria-label="Métrica">
      ${chave.map(m => `<label class="chip"><input type="radio" name="met" value="${esc(m)}" ${m === k ? 'checked' : ''}><span>${esc(m)}</span></label>`).join('')}
      ${outras.length ? `<select id="met-outra" aria-label="Outra métrica"><option value="">Outra métrica…</option>${outras.map(m => `<option ${m === k ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>` : ''}
    </div>
    <div class="grafico alto"><canvas aria-label="Evolução de ${esc(k)} por jogo"></canvas></div>`;
  $$('input[name=met]', el).forEach(r => r.addEventListener('change', () => { App.rel.metrica = r.value; desenharTendencia(js, mets, chave); }));
  $('#met-outra', el)?.addEventListener('change', e => { if (e.target.value) { App.rel.metrica = e.target.value; desenharTendencia(js, mets, chave); } });
  App.graficos = App.graficos.filter(g => { if (g.canvas.closest('#r-tendencia')) { g.destroy(); return false; } return true; });
  novoGrafico($('canvas', el), {
    type: 'line',
    data: {
      labels: js.map(j => rotuloJogo(j, true)),
      datasets: [
        { label: App.cfg.nome_clube || 'Nós', data: nos, borderColor: COR.nos, backgroundColor: COR.nos, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: '#fff', pointBorderWidth: 2, tension: 0, spanGaps: true },
        { label: 'Adversário', data: adv, borderColor: COR.adv, backgroundColor: COR.adv, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: '#fff', pointBorderWidth: 2, tension: 0, spanGaps: true, hidden: adv.every(x => x === null) },
        { label: `${App.cfg.nome_clube || 'Nós'}, média móvel de 5 jogos`, data: movel, borderColor: COR.nosSuave, borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 0, tension: 0.3 }
      ]
    },
    options: { ...OPCOES_LINHA, scales: eixos() }
  });
}

// ---- Liga ----
// Registos da liga nas mesmas jornadas e competições do período filtrado.
function ligaDoPeriodo(js) {
  const chaves = new Set(js.filter(j => j.jornada !== null && j.jornada !== undefined).map(j => `${norm(j.competicao)}|${j.jornada}`));
  if (!chaves.size || !App.d.liga?.length) return null;
  const rows = App.d.liga.filter(r => chaves.has(`${norm(r.competicao)}|${r.jornada}`));
  return rows.length ? rows : null;
}
function eNossaEquipa(nome) { return criarIdentificador(App.cfg, App.d.mapas).eNos(nome); }
// Média da liga (média das médias de cada equipa) e posição da vossa equipa (1.º = valor mais alto).
function comparacaoLiga(rows, k) {
  const porEquipa = {};
  for (const r of rows) { const v = r.metricas?.[k]; if (Number.isFinite(v)) (porEquipa[r.equipa] ||= []).push(v); }
  const medias = Object.entries(porEquipa).map(([e, vs]) => ({ e, v: media(vs) }));
  const nossa = medias.find(x => eNossaEquipa(x.e));
  if (medias.length < 2) return null;
  return { media: media(medias.map(x => x.v)), pos: nossa ? 1 + medias.filter(x => x.v > nossa.v + 1e-9).length : null, n: medias.length };
}
function classificacao(competicao) {
  const t = {};
  for (const r of App.d.liga || []) {
    if (norm(r.competicao) !== norm(competicao) || !Number.isFinite(r.golos) || !Number.isFinite(r.golos_sofridos)) continue;
    const x = (t[r.equipa] ||= { equipa: r.equipa, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 });
    x.j++; x.gm += r.golos; x.gs += r.golos_sofridos;
    if (r.golos > r.golos_sofridos) x.v++; else if (r.golos === r.golos_sofridos) x.e++; else x.d++;
  }
  return Object.values(t).map(x => ({ ...x, pts: 3 * x.v + x.e, dg: x.gm - x.gs }))
    .sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gm - a.gm || a.equipa.localeCompare(b.equipa, 'pt'));
}
function competicaoDaClassificacao(js) {
  if (App.rel.competicao !== 'todas') return App.rel.competicao;
  const comJornada = js.filter(j => j.jornada !== null && j.jornada !== undefined);
  return comJornada.length ? comJornada[comJornada.length - 1].competicao : null;
}

function desenharComparacao(js, chave) {
  const el = $('#r-comparacao');
  if (!chave.length) { el.remove(); return; }
  const liga = ligaDoPeriodo(js);
  const linhas = chave.map(k => {
    const n = js.map(j => valor(j, 'nos', k)), a = js.map(j => valor(j, 'adversario', k));
    const mn = media(n), ma = media(a), u5 = media(n.slice(-5));
    return { k, mn, ma, dif: mn !== null && ma !== null ? mn - ma : null, u5, var: u5 !== null && mn !== null ? u5 - mn : null, liga: liga ? comparacaoLiga(liga, k) : null };
  });
  const temLiga = linhas.some(l => l.liga);
  el.innerHTML = `
    <h2>Nós, os adversários e a liga</h2>
    <p class="nota">Média por jogo. "Adversários" é o que os adversários fizeram nos jogos contra nós.${temLiga ? ' "Média da liga" é a média das ' + linhas.find(l => l.liga).liga.n + ' equipas nas mesmas jornadas; a posição ordena do valor mais alto para o mais baixo.' : ''} Se uma diferença é boa ou má depende da métrica e do modelo de jogo.</p>
    <div class="tabela-env"><table class="tabela">
      <thead><tr><th>Métrica</th><th class="num">${esc(App.cfg.nome_clube || 'Nós')}</th>${temLiga ? '<th class="num">Média da liga</th><th class="num">Posição na liga</th>' : ''}<th class="num">Adversários</th><th class="num">Diferença</th><th class="num">Nós, últimos 5</th><th class="num">Últimos 5 vs. período</th></tr></thead>
      <tbody>${linhas.map(l => `<tr><td>${esc(l.k)}</td><td class="num"><b>${fmtNum(l.mn, 2)}</b></td>
        ${temLiga ? `<td class="num">${fmtNum(l.liga?.media, 2)}</td><td class="num">${l.liga?.pos ? `<b>${l.liga.pos}.º</b> de ${l.liga.n}` : '–'}</td>` : ''}
        <td class="num">${fmtNum(l.ma, 2)}</td><td class="num">${fmtSinal(l.dif, 2)}</td><td class="num">${fmtNum(l.u5, 2)}</td><td class="num">${seta(l.var, l.mn)} ${fmtSinal(l.var, 2)}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

function desenharClassificacao(js) {
  const el = $('#r-classificacao'); if (!el) return;
  const comp = competicaoDaClassificacao(js);
  const tabela = comp ? classificacao(comp) : [];
  if (tabela.length < 2) { el.remove(); return; }
  const ultima = Math.max(...App.d.liga.filter(r => norm(r.competicao) === norm(comp)).map(r => r.jornada));
  el.innerHTML = `
    <h2>Classificação</h2>
    <p class="nota">${esc(comp)}, até à jornada ${ultima}, calculada a partir do ficheiro da liga.</p>
    <div class="tabela-env"><table class="tabela compacta classificacao">
      <thead><tr><th class="num">#</th><th>Equipa</th><th class="num">J</th><th class="num">V</th><th class="num">E</th><th class="num">D</th><th class="num">Golos</th><th class="num">DG</th><th class="num">Pts</th></tr></thead>
      <tbody>${tabela.map((x, i) => `<tr class="${eNossaEquipa(x.equipa) ? 'nossa' : ''}"><td class="num">${i + 1}</td><td>${esc(x.equipa)}</td><td class="num">${x.j}</td><td class="num">${x.v}</td><td class="num">${x.e}</td><td class="num">${x.d}</td><td class="num">${x.gm}–${x.gs}</td><td class="num">${fmtSinal(x.dg, 0)}</td><td class="num"><b>${x.pts}</b></td></tr>`).join('')}</tbody>
    </table></div>`;
}

function seta(dif, base) {
  if (dif === null || base === null) return '';
  const rel = Math.abs(dif) / (Math.abs(base) || 1);
  if (rel < 0.05) return '<span class="seta" aria-label="estável">→</span>';
  return dif > 0 ? '<span class="seta" aria-label="a subir">↗</span>' : '<span class="seta" aria-label="a descer">↘</span>';
}

function desenharDesempenho(js, mets) {
  const el = $('#r-desempenho');
  const xg = chaveXG(mets);
  const evs = js.flatMap(j => App.idx.eventos[j.id] || []).filter(x => x.tipo === 'oportunidade');
  if (!xg && !evs.length) { el.remove(); return; }
  const gm = soma(js.map(j => j.golos_marcados)), gs = soma(js.map(j => j.golos_sofridos));
  let html = '<h2>Desempenho e resultado</h2>';
  if (xg) {
    const xf = soma(js.map(j => valor(j, 'nos', xg))), xa = soma(js.map(j => valor(j, 'adversario', xg)));
    const leitura = d => Math.abs(d) < 1.5 ? 'em linha com o esperado' : d > 0 ? 'mais do que o esperado' : 'menos do que o esperado';
    html += `<p class="destaque">Marcámos <b>${gm}</b> golos para <b>${fmtNum(xf)}</b> de xG (${fmtSinal(gm - xf)}, ${leitura(gm - xf)}). Sofremos <b>${gs}</b> para <b>${fmtNum(xa)}</b> de xG (${fmtSinal(gs - xa)}, ${leitura(gs - xa)}).</p>
      <p class="nota">Uma diferença grande e persistente entre golos e xG costuma corrigir-se com o tempo: o xG mostra melhor a qualidade do processo do que o resultado.</p>

  }
  if (evs.length) {
    const lado = l => {
      const e = evs.filter(x => x.lado === l); const g = e.filter(x => x.resultado === 'Golo').length; const go = e.filter(x => x.qualidade === 'Grande oportunidade');

    };
    const c = lado('nos'), s = lado('adversario');
    html += `<h3>Oportunidades codificadas</h3>
      <div class="tabela-env"><table class="tabela compacta">
        <thead><tr><th></th><th class="num">Oportunidades</th><th class="num">Golos</th><th class="num">Conversão</th><th class="num">Grandes oportunidades</th><th class="num">Golos em grandes oportunidades</th></tr></thead>
        <tbody>
          <tr><td><span class="ponto-cor nos"></span>Criadas</td><td class="num">${c.n}</td><td class="num">${c.g}</td><td class="num">${fmtNum(c.conv, 0)}%</td><td class="num">${c.go}</td><td class="num">${c.goG}</td></tr>
          <tr><td><span class="ponto-cor adv"></span>Sofridas</td><td class="num">${s.n}</td><td class="num">${s.g}</td><td class="num">${fmtNum(s.conv, 0)}%</td><td class="num">${s.go}</td><td class="num">${s.goG}</td></tr>
        </tbody></table></div>`;
  }
  el.innerHTML = html;
  if (xg) {
    const acum = arr => { let t = 0; return arr.map(x => (t += (Number.isFinite(x) ? x : 0))); };
    const base = { borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0 };
    novoGrafico($('canvas', el), {
      type: 'line',
      data: {
        labels: js.map(j => rotuloJogo(j, true)),
        datasets: [
          { ...base, label: 'Golos marcados', data: acum(js.map(j => j.golos_marcados)), borderColor: COR.nos, backgroundColor: COR.nos },
          { ...base, label: 'xG criado', data: acum(js.map(j => valor(j, 'nos', xg))), borderColor: COR.nos, backgroundColor: COR.nos, borderDash: [5, 4] },
          { ...base, label: 'Golos sofridos', data: acum(js.map(j => j.golos_sofridos)), borderColor: COR.adv, backgroundColor: COR.adv },
          { ...base, label: 'xG sofrido', data: acum(js.map(j => valor(j, 'adversario', xg))), borderColor: COR.adv, backgroundColor: COR.adv, borderDash: [5, 4] }
        ]
      },
      options: { ...OPCOES_LINHA, plugins: { ...OPCOES_LINHA.plugins, legend: { ...OPCOES_LINHA.plugins.legend, labels: { ...OPCOES_LINHA.plugins.legend.labels, usePointStyle: false, boxWidth: 22, boxHeight: 2 } } }, scales: eixos('Acumulado') }
    });
  }
}

// ---- Jogadores ----
function agregarJogadores(js) {
  const ids = new Set(js.map(j => j.id));
  const linhas = App.d.estJog.filter(r => ids.has(r.jogo_id) && r.lado === 'nos');
  const mets = [...new Set(linhas.flatMap(r => Object.keys(r.metricas || {})))].filter(k => !k.startsWith('_')).sort((a, b) => a.localeCompare(b));
  const porJog = {};
  for (const r of linhas) {
    const p = (porJog[r.jogador] ||= { nome: r.jogador, pos: {}, jogos: 0, minutos: 0, tot: {}, pond: {}, minPond: {} });
    const min = Number.isFinite(r.minutos) ? r.minutos : 0;
    if (min > 0 || r.minutos === null) p.jogos++;
    p.minutos += min;
    if (r.posicao) p.pos[r.posicao] = (p.pos[r.posicao] || 0) + 1;
    for (const [k, v] of Object.entries(r.metricas || {})) {
      if (!Number.isFinite(v)) continue;
      if (ePercentagem(k)) { p.pond[k] = (p.pond[k] || 0) + v * (min || 1); p.minPond[k] = (p.minPond[k] || 0) + (min || 1); }
      else p.tot[k] = (p.tot[k] || 0) + v;
    }
  }
  const jogadores = Object.values(porJog).map(p => ({ ...p, posicao: Object.entries(p.pos).sort((a, b) => b[1] - a[1])[0]?.[0] || '' }));
  return { jogadores, mets, linhas };
}

function valorJogador(p, k, por90) {
  if (ePercentagem(k)) return p.minPond[k] ? p.pond[k] / p.minPond[k] : null;
  const t = p.tot[k]; if (!Number.isFinite(t)) return null;
  return por90 ? (p.minutos > 0 ? t / p.minutos * 90 : null) : t;
}

function desenharJogadores(js) {
  const el = $('#r-jogadores');
  const { jogadores, mets } = agregarJogadores(js);
  if (!jogadores.length) {
    el.innerHTML = `<h2>Jogadores</h2><p class="fraco">Ainda não há estatísticas individuais nestes jogos.${pode() ? ' Importe-as em <a href="#importacao">Importação › Jogadores</a>.' : ''}</p>`;
    return;
  }
  const R = App.rel;
  if (!R.metricasJog || !R.metricasJog.every(m => mets.includes(m))) R.metricasJog = PADRAO_JOG.filter(m => mets.includes(m)).slice(0, 5);
  if (!R.metricasJog.length) R.metricasJog = mets.slice(0, 4);
  const sel = R.metricasJog;
  const valorOrdem = p => R.ordem.col === 'nome' ? p.nome : R.ordem.col === 'jogos' ? p.jogos : R.ordem.col === 'minutos' ? p.minutos : valorJogador(p, R.ordem.col, R.por90) ?? -Infinity;
  jogadores.sort((a, b) => {
    const va = valorOrdem(a), vb = valorOrdem(b);
    const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return R.ordem.desc ? -c : c;
  });
  const th = (col, txt, num = true) => {
    const ativo = R.ordem.col === col;
    return `<th class="${num ? 'num' : ''}" aria-sort="${ativo ? (R.ordem.desc ? 'descending' : 'ascending') : 'none'}"><button class="ordenar" data-col="${esc(col)}">${esc(txt)}${ativo ? (R.ordem.desc ? ' ↓' : ' ↑') : ''}</button></th>`;
  };
  el.innerHTML = `
    <div class="bloco-cab"><h2>Jogadores</h2>
      <div class="alternar so-ecra" role="radiogroup" aria-label="Valores">
        <label class="chip"><input type="radio" name="p90" value="1" ${R.por90 ? 'checked' : ''}><span>Por 90 min</span></label>
        <label class="chip"><input type="radio" name="p90" value="0" ${R.por90 ? '' : 'checked'}><span>Totais</span></label>
      </div>
    </div>
    <details class="escolher-metricas so-ecra"><summary>Colunas: ${sel.map(esc).join(', ')}</summary>
      <div class="chips-lista">${mets.map(m => `<label class="chip-check"><input type="checkbox" value="${esc(m)}" ${sel.includes(m) ? 'checked' : ''}><span>${esc(m)}</span></label>`).join('')}</div>
    </details>
    <div class="tabela-env"><table class="tabela jogadores">
      <thead><tr>${th('nome', 'Jogador', false)}<th>Pos.</th>${th('jogos', 'Jogos')}${th('minutos', 'Minutos')}${sel.map(m => th(m, m)).join('')}</tr></thead>
      <tbody>${jogadores.map(p => `<tr><td><button class="btn-link nome-jogador" data-jogador="${esc(p.nome)}">${esc(nomeVisivel(p.nome))}</button></td><td>${esc(p.posicao)}</td><td class="num">${p.jogos}</td><td class="num">${fmtNum(p.minutos, 0)}</td>

  { id: 'intensidade', area: 'Posse', nome: 'Intensidade de jogo', k: ['Intensidade de jogo', 'Match tempo'], melhor: 1, casas: 1 }
];
const AREAS_EQ = ['Ataque', 'Defesa', 'Posse'];
// Nome da métrica do ponto de vista do adversário (nas frases).
const NOME_ADV = { xg: 'xG', toques_area: 'toques na área', remates: 'remates', op_criadas: 'oportunidades', xg_sofrido: 'xG', toques_area_sof: 'toques na área', remates_sofridos: 'remates', op_sofridas: 'oportunidades' };
const DEF_EQ = Object.fromEntries(METRICAS_EQ.map(d => [d.id, d]));
const LS_METRICAS_REL = 'analise_rel_metricas';
// Limiares: um desvio-padrão para assinalar uma diferença; os indicadores individuais são mais exigentes.
const LIMIAR_EQ = 1, LIMIAR_TENDENCIA = 0.75, LIMIAR_IND = 1.25, MIN_MINUTOS = 45;

function valorEq(def, L) {
  if (!L) return null;
  if (def.ops) return L.ops ? L.ops[def.ops] : null;
  const k = def.k && chaveExistente(L.m, def.k); if (k) return L.m[k];
  const ka = def.ka && chaveExistente(L.a, def.ka); return ka ? L.a[ka] : null;
}
const fmtEq = (def, n) => (n === null || n === undefined ? '–' : `${fmtNum(n, def.casas)}${def.pct ? '%' : ''}`);
const fmtDifEq = (def, n) => (n === null || n === undefined ? '–' : `${fmtSinal(n, def.casas)}${def.pct ? ' p.p.' : ''}`);
function desvio(arr) {
  const v = arr.filter(Number.isFinite); if (v.length < 2) return null;
  const m = media(v); return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1));
}
const mesmaEq = (a, b) => !!a && !!b && (norm(a) === norm(b) || mesmaEquipa(a, b));

// ---- Dados ----
function contarOps(a) {
  const evs = (App.idx.eventosAlvo?.[a.key] || []).filter(e => e.tipo === 'oportunidade');
  if (!evs.length) return null;
  const c = { casa: 0, fora: 0 };
  for (const e of evs) { const l = ladoNoAlvo(e, a); if (l) c[l]++; }
  return c;
}
function opsDoJogo(j) {
  const a = App.idx.alvoJogo?.[j.id]; if (!a || !a.ladoNosso) return null;
  const c = contarOps(a); if (!c) return null;
  return { c: c[a.ladoNosso], s: c[a.ladoNosso === 'casa' ? 'fora' : 'casa'] };
}
// Os nossos jogos já disputados, por ordem.
function linhasNossas() {
  return App.d.jogos.filter(j => App.idx.estEq[j.id]?.nos || resultadoJogo(j)).sort(compararJogos)
    .map(j => ({ j, m: App.idx.estEq[j.id]?.nos || {}, a: App.idx.estEq[j.id]?.adversario || {}, ops: opsDoJogo(j) }));
}
// Uma linha por equipa e por jogo do ficheiro da liga, com a linha do adversário ao lado.
function linhasLiga(competicao, ateJornada) {
  if (!competicao) return [];
  const rows = (App.d.liga || []).filter(r => norm(r.competicao) === norm(competicao) && (ateJornada == null || r.jornada <= ateJornada));
  const porChave = {}; for (const r of rows) porChave[`${r.jornada}|${norm(r.equipa)}|${norm(r.adversario)}`] = r;
  const alvoPor = {};
  for (const a of App.idx.alvos || []) {
    if (a.jornada == null || norm(a.competicao) !== norm(competicao)) continue;
    alvoPor[`${a.jornada}|${norm(a.casa)}`] = { a, l: 'casa' }; alvoPor[`${a.jornada}|${norm(a.fora)}`] = { a, l: 'fora' };
  }
  const cache = {};
  return rows.map(r => {
    const op = porChave[`${r.jornada}|${norm(r.adversario)}|${norm(r.equipa)}`];
    const x = alvoPor[`${r.jornada}|${norm(r.equipa)}`]; let ops = null;
    if (x) { const c = (cache[x.a.key] ??= contarOps(x.a)); if (c) ops = { c: c[x.l], s: c[x.l === 'casa' ? 'fora' : 'casa'] }; }
    return { jornada: r.jornada, equipa: r.equipa, adversario: r.adversario, m: r.metricas || {}, a: op?.metricas || {}, ops };
  });
}
function metricasDoRelatorio(disponiveis) {
  const guardadas = App.cfg.relatorio_equipa?.metricas || lsGet(LS_METRICAS_REL);
  const ids = Array.isArray(guardadas) && guardadas.length ? guardadas.filter(id => DEF_EQ[id]) : METRICAS_EQ.map(d => d.id);
  return ids.filter(id => disponiveis.has(id)).map(id => DEF_EQ[id]);
}

// ---- Análise do jogo ----
function analisarMetrica(def, linhas, i, liga) {
  const L = linhas[i]; const x = valorEq(def, L); if (x === null || x === undefined) return null;
  const hist = linhas.slice(0, i).map(l => valorEq(def, l)).filter(Number.isFinite);
  const mu = media(hist), sd = desvio(hist);
  const z = hist.length >= 3 && sd > 0 ? (x - mu) / sd : null;
  const ant = i > 0 ? valorEq(def, linhas[i - 1]) : null;
  const ult5 = linhas.slice(Math.max(0, i - 4), i + 1).map(l => valorEq(def, l)).filter(Number.isFinite);
  const u5 = ult5.length >= 3 ? media(ult5) : null;
  const zt = hist.length >= 5 && sd > 0 && u5 !== null ? (u5 - mu) / sd : null;
  let recorde = null;
  if (hist.length >= 4) { if (x > Math.max(...hist)) recorde = 'max'; else if (x < Math.min(...hist)) recorde = 'min'; }
  // O que as equipas costumam fazer contra este adversário (excluindo o nosso jogo).
  let esperado = null, nEsp = 0;
  if (liga.length) {
    const vs = liga.filter(l => mesmaEq(l.adversario, L.j.adversario) && !eNossaEquipa(l.equipa)).map(l => valorEq(def, l)).filter(Number.isFinite);
    if (vs.length >= 2) { esperado = media(vs); nEsp = vs.length; }
  }
  const s = z !== null ? z * def.melhor : null; // positivo = melhor do que o habitual
  return { def, x, mu, sd, z, s, n: hist.length, ant, u5, zt, recorde, esperado, nEsp };
}

// Indicadores individuais: cada jogador comparado com a sua própria média (por 90 min).
function alertasIndividuais(linhas, i) {
  const jogo = linhas[i].j; const anteriores = linhas.slice(0, i).map(l => l.j);
  const regs = (App.idx.estJog[jogo.id] || []).filter(r => r.lado === 'nos' && r.minutos >= MIN_MINUTOS);
  const valor = (r, id) => {
    const def = METRICAS[id]; const v = valorMetricaJogo(r.metricas || {}, id); if (!Number.isFinite(v)) return null;
    if (def.d) { const kd = chaveExistente(r.metricas, def.d); return kd && r.metricas[kd] >= 4 ? v : null; }
    return v / r.minutos * 90;
  };
  const out = [];
  for (const r of regs) {
    const perfil = perfilDoJogador(r.jogador, r); if (!perfil) continue;
    const ids = [...new Set(BLOCOS.flatMap(b => PERFIS[perfil][b]))].filter(id => !METRICAS[id].estilo);
    const hist = anteriores.map(g => (App.idx.estJog[g.id] || []).find(x => x.lado === 'nos' && x.jogador === r.jogador && x.minutos >= MIN_MINUTOS)).filter(Boolean);
    if (hist.length < 3) continue;
    const cand = [];
    for (const id of ids) {
      const x = valor(r, id); if (x === null) continue;
      const h = hist.map(g => valor(g, id)).filter(Number.isFinite); if (h.length < 3) continue;
      const mu = media(h), sd = desvio(h); if (!sd) continue;
      if (x === 0 && METRICAS[id].menos) continue; // zero de algo negativo raramente é notícia
      const s = (x - mu) / sd * (METRICAS[id].menos ? -1 : 1);
      if (Math.abs(s) >= LIMIAR_IND) cand.push({ jogador: r.jogador, minutos: r.minutos, id, x, mu, s, pct: !!METRICAS[id].d });
    }
    cand.sort((a, b) => Math.abs(b.s) - Math.abs(a.s));
    out.push(...cand.filter(c => c.s > 0).slice(0, 2), ...cand.filter(c => c.s < 0).slice(0, 2));
  }
  return { destaque: out.filter(c => c.s > 0).sort((a, b) => b.s - a.s).slice(0, 6), abaixo: out.filter(c => c.s < 0).sort((a, b) => a.s - b.s).slice(0, 6), n: regs.length };
}

      <button class="btn" id="pj-seg" ${i === linhas.length - 1 ? 'disabled' : ''} aria-label="Jogo seguinte">›</button>

    <section class="bloco pj-secao" id="pj-visao">

function cabecalhoJogo(L, nome) {
  const j = L.j; const res = resultadoJogo(j);
  const gm = j.golos_marcados ?? '–', gs = j.golos_sofridos ?? '–';
  const [casa, fora, gc, gf] = j.local === 'fora' ? [j.adversario, nome, gs, gm] : [nome, j.adversario, gm, gs];
  const xg = valorEq(DEF_EQ.xg, L), xgs = valorEq(DEF_EQ.xg_sofrido, L);
  const extra = [xg !== null && xgs !== null ? `xG ${fmtNum(xg, 2)}–${fmtNum(xgs, 2)}` : '', L.ops ? `oportunidades ${L.ops.c}–${L.ops.s}` : ''].filter(Boolean).join(' · ');
  return `
    <p class="pj-meta">${[j.competicao, j.jornada != null ? `Jornada ${j.jornada}` : '', j.data ? fmtData(j.data) : '', j.local === 'casa' ? 'Em casa' : j.local === 'fora' ? 'Fora' : ''].filter(Boolean).map(esc).join(' · ')}</p>
    <div class="pj-placar">
      <span class="pj-eq ${j.local === 'fora' ? '' : 'nossa'}">${esc(casa)}</span>
      <span class="pj-res">${gc}<i>–</i>${gf}</span>
      <span class="pj-eq ${j.local === 'fora' ? 'nossa' : ''}">${esc(fora)}</span>
      ${res ? `<span class="res res-${res}" aria-label="${({ V: 'Vitória', E: 'Empate', D: 'Derrota' })[res]}">${res}</span>` : ''}
    </div>
    ${extra ? `<p class="pj-extra">${esc(extra)}</p>` : ''}`;
}

// Frases com as conclusões mais pertinentes do jogo.
function htmlConclusoes(L, an, nome) {
  const j = L.j; const por = id => an.find(a => a.def.id === id);
  const frases = [];
  const xg = por('xg'), xgs = por('xg_sofrido');
  if (xg && xgs && Number.isFinite(j.golos_marcados)) {
    const dif = xg.x - xgs.x; const res = resultadoJogo(j);
    let leitura = '';
    if (res !== 'V' && dif >= 0.5) leitura = ' O desempenho justificava mais do que o resultado.';
    else if (res !== 'D' && dif <= -0.5) leitura = ' O resultado foi melhor do que o desempenho.';
    else if (Math.abs(dif) < 0.3) leitura = ' Um jogo equilibrado em qualidade de oportunidades.';
    const ef = j.golos_marcados - xg.x;
    if (ef >= 1) leitura += ' Muito eficazes na finalização.'; else if (ef <= -1) leitura += ' Faltou eficácia na finalização.';
    frases.push({ t: dif >= 0.3 ? 'bom' : dif <= -0.3 ? 'mau' : 'neutro', h: `${({ V: 'Vitória', E: 'Empate', D: 'Derrota' })[res] || 'Resultado'} por ${j.golos_marcados}–${j.golos_sofridos} com <b>${fmtNum(xg.x, 2)}</b> de xG criado e <b>${fmtNum(xgs.x, 2)}</b> sofrido.${leitura}` });
  }
  const assinaladas = an.filter(a => a.s !== null && Math.abs(a.s) >= LIMIAR_EQ).sort((a, b) => Math.abs(b.s) - Math.abs(a.s));
  const frase = a => {
    const acima = a.x > a.mu; const forte = Math.abs(a.z) >= 2 ? 'muito ' : '';
    const rec = a.recorde ? ` É o valor mais ${a.recorde === 'max' ? 'alto' : 'baixo'} da época.` : '';
    return `<b>${esc(a.def.nome)}</b>: ${fmtEq(a.def, a.x)}, ${forte}${acima ? 'acima' : 'abaixo'} da média da época (${fmtEq(a.def, a.mu)}).${rec}`;
  };
  // Recordes da época (o resto das diferenças aparece nas listas abaixo).
  for (const a of assinaladas.filter(a => a.recorde && a.def.melhor).slice(0, 3)) frases.push({ t: a.s > 0 ? 'bom' : 'mau', h: frase(a) });
  // Contra este adversário: comparação com o que as outras equipas costumam fazer.
  const adv = esc(j.adversario);
  for (const [ids, papel] of [[['xg', 'toques_area', 'remates', 'op_criadas'], 'ataque'], [['xg_sofrido', 'toques_area_sof', 'remates_sofridos', 'op_sofridas'], 'defesa']]) {
    const c = ids.map(por).filter(a => a && a.esperado > 0).map(a => ({ a, rel: (a.x - a.esperado) / a.esperado })).sort((p, q) => Math.abs(q.rel) - Math.abs(p.rel))[0];
    if (!c || Math.abs(c.rel) < 0.2) continue;
    const bom = c.rel * c.a.def.melhor > 0;
    frases.push({ t: bom ? 'bom' : 'mau', h: papel === 'ataque'
      ? `Contra o ${adv}, as equipas costumam ter <b>${fmtEq(c.a.def, c.a.esperado)}</b> de ${esc(NOME_ADV[c.a.def.id] || c.a.def.nome.toLowerCase())}; nós tivemos <b>${fmtEq(c.a.def, c.a.x)}</b> (${fmtSinal(c.rel * 100, 0)}%).`
      : `O ${adv} costuma ter <b>${fmtEq(c.a.def, c.a.esperado)}</b> de ${esc(NOME_ADV[c.a.def.id] || c.a.def.nome.toLowerCase())} por jogo; contra nós ${c.rel > 0 ? 'chegou a' : 'ficou-se por'} <b>${fmtEq(c.a.def, c.a.x)}</b> (${fmtSinal(c.rel * 100, 0)}%).` });
  }
  // Tendências dos últimos 5 jogos.
  const tend = an.filter(a => a.zt !== null && a.def.melhor && Math.abs(a.zt) >= LIMIAR_TENDENCIA).sort((a, b) => Math.abs(b.zt) - Math.abs(a.zt));
  for (const a of [tend.find(a => a.zt * a.def.melhor > 0), tend.find(a => a.zt * a.def.melhor < 0)].filter(Boolean)) {
    const bom = a.zt * a.def.melhor > 0;
    frases.push({ t: bom ? 'bom' : 'mau', h: `Tendência dos últimos 5 jogos: <b>${esc(a.def.nome)}</b> ${bom ? 'a melhorar' : 'a piorar'} (${fmtEq(a.def, a.u5)} por jogo, contra ${fmtEq(a.def, a.mu)} na época).` });
  }
  if (!frases.length) return '<p class="fraco">Sem diferenças relevantes em relação ao habitual.</p>';
  return `<ul class="pj-conclusoes">${frases.map(f => `<li class="${f.t}"><span class="pj-icone" aria-hidden="true">${f.t === 'bom' ? '▲' : f.t === 'mau' ? '▼' : '●'}</span><span>${f.h}</span></li>`).join('')}</ul>`;
}

// ---- 3. Campeonato ----
const rotulosPontos = {
  id: 'rotulosPontos',
  afterDatasetsDraw(ch, _args, opts) {
    const { ctx, scales: { x, y } } = ch;
    ctx.save();
    if (opts.mx !== null && opts.mx !== undefined && opts.my !== null && opts.my !== undefined) {
      ctx.strokeStyle = '#B9BEB5'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      const px = x.getPixelForValue(opts.mx), py = y.getPixelForValue(opts.my);
      ctx.beginPath(); ctx.moveTo(px, y.top); ctx.lineTo(px, y.bottom); ctx.moveTo(x.left, py); ctx.lineTo(x.right, py); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.textBaseline = 'middle';
    ch.getDatasetMeta(0).data.forEach((pt, k) => {
      const d = ch.data.datasets[0].data[k];
      ctx.font = d.nossa ? "600 12px 'Barlow', sans-serif" : "11px 'Barlow', sans-serif";
      ctx.fillStyle = d.nossa ? COR.nos : COR.tinta2;
      const txt = d.rot.length > 16 ? d.rot.slice(0, 15) + '…' : d.rot;
      const w = ctx.measureText(txt).width; const dir = pt.x + 8 + w > ch.chartArea.right;
      ctx.fillText(txt, dir ? pt.x - 8 - w : pt.x + 8, pt.y);
    });
    ctx.restore();
  }
};
function desenharLigaPj(j, defs, liga) {
  const el = $('#pj-liga'); if (!el) return;
  if (!liga.length) {
    el.innerHTML = `<h2>3. Campeonato</h2><p class="fraco">${j.jornada == null ? 'Este jogo não é do campeonato.' : 'Ainda não há dados do campeonato. Importe o ficheiro da liga (Importação › Estatísticas de equipa).'}</p>`;
    return;
  }
  const equipas = [...new Set(liga.map(l => l.equipa))];
  const medias = {}; // equipa -> id -> média
  for (const e of equipas) {
    const ls = liga.filter(l => l.equipa === e); medias[e] = {};
    for (const d of defs) medias[e][d.id] = media(ls.map(l => valorEq(d, l)));
  }
  const nossa = equipas.find(e => eNossaEquipa(e));
  const linhas = defs.map(d => {
    const vs = equipas.map(e => ({ e, v: medias[e][d.id] })).filter(x => Number.isFinite(x.v));
    if (vs.length < 2) return null;
    const ord = vs.slice().sort((a, b) => (d.melhor === -1 ? a.v - b.v : b.v - a.v));
    const pos = nossa ? ord.findIndex(x => x.e === nossa) + 1 : 0;
    return { d, nos: nossa ? medias[nossa][d.id] : null, pos, n: vs.length, med: media(vs.map(x => x.v)), top: ord[0], fim: ord[ord.length - 1] };
  }).filter(Boolean);
  const comLiga = new Set(linhas.map(l => l.d.id));
  if (!comLiga.has(App.pj.x)) App.pj.x = linhas[0]?.d.id; if (!comLiga.has(App.pj.y)) App.pj.y = linhas[1]?.d.id || linhas[0]?.d.id;
  const opcoes = sel => linhas.map(l => `<option value="${l.d.id}" ${l.d.id === sel ? 'selected' : ''}>${esc(l.d.nome)}</option>`).join('');
  const terco = (pos, n) => (pos <= Math.ceil(n / 3) ? 'bom' : pos > n - Math.ceil(n / 3) ? 'mau' : '');
  el.innerHTML = `
    <h2>3. Campeonato</h2>
    <p class="nota">${esc(j.competicao || '')}, médias por jogo até à jornada ${j.jornada} (${equipas.length} equipas). A posição ordena do melhor para o pior valor; nos indicadores de estilo, do mais alto para o mais baixo.</p>
    ${AREAS_EQ.map(area => { const ls = linhas.filter(l => l.d.area === area); return ls.length ? `
      <h3>${area}</h3>
      <div class="tabela-env"><table class="tabela compacta pj-tabela">
        <thead><tr><th>Métrica</th><th class="num">${esc(App.cfg.nome_clube || 'Nós')}</th><th class="num">Posição</th><th class="num">Média da liga</th><th>Melhor</th><th>Pior</th></tr></thead>
        <tbody>${ls.map(l => `<tr><td>${esc(l.d.nome)}</td><td class="num"><b>${fmtEq(l.d, l.nos)}</b></td>
          <td class="num pj-dif ${l.d.melhor && l.pos ? terco(l.pos, l.n) : ''}">${l.pos ? `<b>${l.pos}.º</b> de ${l.n}` : '–'}</td><td class="num">${fmtEq(l.d, l.med)}</td>
          <td>${esc(l.top.e)} <span class="fraco">${fmtEq(l.d, l.top.v)}</span></td><td>${esc(l.fim.e)} <span class="fraco">${fmtEq(l.d, l.fim.v)}</span></td></tr>`).join('')}</tbody>
      </table></div>` : ''; }).join('')}
    <h3>Comparar duas métricas</h3>
    <div class="filtros so-ecra"><label>Eixo horizontal<select id="pj-x">${opcoes(App.pj.x)}</select></label><label>Eixo vertical<select id="pj-y">${opcoes(App.pj.y)}</select></label></div>
    <div class="grafico alto pj-disp"><canvas aria-label="Equipas do campeonato em duas métricas"></canvas></div>
    <p class="nota">As linhas tracejadas marcam a média da liga.</p>`;
  const dx = DEF_EQ[App.pj.x], dy = DEF_EQ[App.pj.y];
  const pts = equipas.map(e => ({ x: medias[e][dx.id], y: medias[e][dy.id], rot: e, nossa: e === nossa })).filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
  novoGrafico($('canvas', el), {
    type: 'scatter',
    data: { datasets: [{ data: pts, pointRadius: pts.map(p => (p.nossa ? 7 : 4.5)), pointBackgroundColor: pts.map(p => (p.nossa ? COR.nos : '#8A919C')), pointBorderColor: '#fff', pointBorderWidth: 1.5 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, layout: { padding: { right: 8 } },
      plugins: { legend: { display: false }, rotulosPontos: { mx: media(pts.map(p => p.x)), my: media(pts.map(p => p.y)) },
        tooltip: { backgroundColor: '#17202B', callbacks: { label: c => ` ${c.raw.rot}: ${fmtEq(dx, c.raw.x)} · ${fmtEq(dy, c.raw.y)}` } } },
      scales: {
        x: { title: { display: true, text: dx.nome + (dx.melhor === -1 ? ' (menos é melhor)' : '') }, grid: { color: COR.grelha }, reverse: false },
        y: { title: { display: true, text: dy.nome + (dy.melhor === -1 ? ' (menos é melhor)' : '') }, grid: { color: COR.grelha } }
      }
    },
    plugins: [rotulosPontos]
  });
  const mudar = () => { App.pj.x = $('#pj-x').value; App.pj.y = $('#pj-y').value; App.graficos = App.graficos.filter(g => { if (g.canvas.closest('#pj-liga')) { g.destroy(); return false; } return true; }); desenharLigaPj(j, defs, liga); };
  $('#pj-x').addEventListener('change', mudar); $('#pj-y').addEventListener('change', mudar);
}

// ---------- Método de codificação de oportunidades (departamento) ----------
const BOLA_CORRIDA = ['Cruzamento alto', 'Cruzamento rasteiro', 'Cruzamento atrasado', 'Rotura', 'Combinação interior', '1x1', 'Remate exterior', '2.ª bola'];
const MOMENTOS = {
  'Organização': { sub: ['Jogo exterior', 'Jogo interior'] },
  'Transição': { sub: ['Ataque rápido', 'Contra-ataque', 'Recuperação alta'] },
  'Esquema tático': { sub: ['Canto', 'Livre', 'Lançamento', 'Penálti'] }
};
const MEC_ESQUEMA = { Canto: ['Direto', 'Combinado', '2.ª bola'], Livre: ['Remate direto', 'Cruzamento', 'Combinado', '2.ª bola'], 'Lançamento': ['Direto', 'Combinado', '2.ª bola'], 'Penálti': [] };
const TEMPOS = ['0-15', '15-30', '30-45', '45-60', '60-75', '75-90', 'Prolongamento'];
const CORREDORES = ['Esquerdo', 'Centro', 'Direito'];
const POSICOES_EV = ['Guarda-redes', 'Defesa direito', 'Defesa central', 'Defesa esquerdo', 'Médio defensivo', 'Médio centro', 'Médio ofensivo', 'Extremo direito', 'Extremo esquerdo', 'Ponta de lança'];
const RESULTADOS = ['Golo', 'Defesa do GR', 'Fora', 'Bloqueado', 'Ferro'];
const MAIS_DETALHES = { finalizacao: ['Pé direito', 'Pé esquerdo', 'Cabeça', 'Outra'] };

function mecanismosDe(momento, sub) {
  if (momento === 'Esquema tático') return MEC_ESQUEMA[sub] || [];
  return momento ? BOLA_CORRIDA : [];
}
function tempoDoMinuto(m) {
  if (!Number.isFinite(m)) return null;
  if (m > 90 && m <= 95) return '75-90'; // descontos da 2.ª parte
  if (m > 95) return 'Prolongamento';
  return TEMPOS[Math.min(5, Math.floor(Math.max(0, m - 0.0001) / 15))];
}
const parteDoTempo = t => (!t ? null : t === 'Prolongamento' ? 'Prolongamento' : ['0-15', '15-30', '30-45'].includes(t) ? '1.ª parte' : '2.ª parte');

// ---- Normalização (folha antiga e eventos da primeira versão da app) ----
const procurar = (lista, v) => lista.find(x => norm(x) === norm(v)) || null;
function normMomento(v) {
  const t = norm(v);
  if (!t) return null;
  if (t.startsWith('organiza')) return 'Organização';
  if (t.startsWith('transi') || t === 'recuperacao alta') return 'Transição';
  if (t.startsWith('esquema') || t.startsWith('bola parada')) return 'Esquema tático';
  return v;
}
function normSub(momento, v) {

// ---- Zonas do método antigo (mapa do departamento) ----
// Coordenadas da app: x e y em % (0–100), a atacar para a direita; y pequeno = lado esquerdo de quem ataca.
const M = { comp: 105, larg: 68, area: 16.5, areaY0: 13.84, areaY1: 54.16, peq: 5.5, peqY0: 24.84, peqY1: 43.16 };
const distBaliza = x => (100 - x) / 100 * M.comp;

const FAIXAS_PASSE = [[0, 16.5], [16.5, 25], [25, 35], [35, 52.5]];
const CORR_PASSE = [[0, M.areaY0], [M.areaY0, M.areaY1], [M.areaY1, M.larg]];
const FAIXAS_FIN = [[0, 5.5], [5.5, 11], [11, 16.5]];
const COLS_FIN = [[M.areaY0, M.peqY0], [M.peqY0, M.larg / 2], [M.larg / 2, M.peqY1], [M.peqY1, M.areaY1]];

function zonaPasse(x, y) {
  if (x === null || x === undefined || y === null || y === undefined) return null;
  const d = distBaliza(Number(x)), ym = metrosY(Number(y));
  if (d > 52.5) return 13;
  const r = FAIXAS_PASSE.findIndex(([a, b]) => d < b || b === 52.5);
  const c = ym < M.areaY0 ? 0 : ym > M.areaY1 ? 2 : 1;
  return r * 3 + c + 1;
}

  if (x === null || x === undefined || y === null || y === undefined) return null;
  const d = distBaliza(Number(x)), ym = metrosY(Number(y));
  if (d > M.area || ym < M.areaY0 || ym > M.areaY1) return 13;
  const r = d < 5.5 ? 0 : d < 11 ? 1 : 2;
  const c = COLS_FIN.findIndex(([a, b]) => ym < b); return r * 4 + (c < 0 ? 3 : c) + 1;
}

function pontoNaZona(tipo, zona, semente) {
  let s = 0; for (const ch of String(semente)) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const entre = ([a, b]) => { const m = (b - a) * 0.15; return a + m + rnd() * (b - a - 2 * m); };

    else { d = entre(FAIXAS_PASSE[Math.ceil(zona / 3) - 1]); ym = entre(CORR_PASSE[(zona - 1) % 3]); }

    else { d = entre(FAIXAS_FIN[Math.ceil(zona / 4) - 1]); ym = entre(COLS_FIN[(zona - 1) % 4]); }

  return { x: Math.round((100 - d / M.comp * 100) * 10) / 10, y: Math.round(ym / M.larg * 1000) / 10 };

// Agrupa posições (abreviaturas portuguesas ou do Wyscout) em quatro sectores.
function sectorPosicao(pos) {
  const longo = { 'guarda-redes': 'Guarda-redes', 'defesa central': 'Defesa', 'lateral direito': 'Defesa', 'lateral esquerdo': 'Defesa', 'médio defensivo': 'Médio', 'médio centro': 'Médio', 'médio ofensivo': 'Médio', 'extremo direito': 'Avançado', 'extremo esquerdo': 'Avançado', 'ponta de lança': 'Avançado', 'segundo avançado': 'Avançado' }[String(pos || '').toLowerCase().trim()];
  if (longo) return longo;
  const p = String(pos || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (!p) return null;
  if (/^(GR|GK|G)$/.test(p)) return 'Guarda-redes';
  if (/^(DC|DD|DE|LD|LE|CB|RCB|LCB|RB|LB|RWB|LWB|DL|DR|DEF)/.test(p)) return 'Defesa';
  if (/^(MDC|MC|MO|MD|ME|DMF|RDMF|LDMF|CMF|RCMF|LCMF|AMF|RAMF|LAMF|CM|DM|AM)/.test(p)) return 'Médio';
  if (/^(ED|EE|PL|AV|PL|CF|ST|SS|RW|LW|RWF|LWF|FW|EXT)/.test(p)) return 'Avançado';
  return null;
}

// Chave de estatísticas de um jogador do plantel (o nome como aparece no Wyscout).
function chaveEstat(pj) { return pj.nome_wyscout || pj.nome; }
function jogadorDoPlantel(chave) { return App.idx.plantelPorEstat?.[norm(chave)] || null; }
function nomeVisivel(chave) { return jogadorDoPlantel(chave)?.nome || chave; }

// Lista para o seletor: plantel primeiro (pelo número), depois quem só tem estatísticas.
function nomesDosJogadores() {
  const doPlantel = App.d.plantel.slice().sort((a, b) => (a.numero ?? 999) - (b.numero ?? 999) || a.nome.localeCompare(b.nome, 'pt')).map(chaveEstat);
  const vistos = new Set(doPlantel.map(norm));
  const soEstat = [...new Set(App.d.estJog.filter(r => r.lado === 'nos').map(r => r.jogador))].filter(n => !vistos.has(norm(n))).sort((a, b) => a.localeCompare(b, 'pt'));
  return [...doPlantel, ...soEstat];
}

function idade(dataNasc) {
  if (!dataNasc) return null;
  const [y, m, d] = dataNasc.split('-').map(Number); const h = new Date();
  return h.getFullYear() - y - ((h.getMonth() + 1 < m || (h.getMonth() + 1 === m && h.getDate() < d)) ? 1 : 0);
}
function metaJogador(pj) {
  return [pj.posicao, idade(pj.data_nascimento) !== null ? `${idade(pj.data_nascimento)} anos` : null, pj.altura ? `${pj.altura} cm` : null, pj.pe].filter(Boolean).join(' · ');
}
function avatarJogador(pj, classe = '') {
  const num = pj?.numero ?? null;
  if (pj?.foto) return `<span class="avatar ${classe}"><img src="${esc(pj.foto)}" alt="">${num !== null ? `<b class="avatar-num">${num}</b>` : ''}</span>`;
  const iniciais = String(pj?.nome || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
  return `<span class="avatar avatar-sem-foto ${classe}">${num !== null ? num : esc(iniciais)}</span>`;
}

function desenharFicha() {
  const v = $('#vista');
  const nomes = nomesDosJogadores();
  if (!nomes.length) { App.jog.modo = 'plantel'; desenharPlantel(); return; }
  const J = App.jog;
  if (!J.nome || !nomes.some(n => norm(n) === norm(J.nome))) {
    const { jogadores } = agregarJogadores(App.d.jogos);
    J.nome = jogadores.sort((a, b) => b.minutos - a.minutos)[0]?.nome || nomes[0];
  }
  J.nome = nomes.find(n => norm(n) === norm(J.nome)) || J.nome;
  const pj = jogadorDoPlantel(J.nome);
  const js = jogosDoRelatorio();
  const comps = [...new Set(App.d.jogos.map(j => j.competicao).filter(Boolean))].sort();
  const { jogadores, mets } = agregarJogadores(js);
  const p = jogadores.find(x => norm(x.nome) === norm(J.nome));
  const ids = new Set(js.map(j => j.id));
  const regs = App.d.estJog.filter(r => norm(r.jogador) === norm(J.nome) && r.lado === 'nos' && ids.has(r.jogo_id))
    .map(r => ({ ...r, jogo: App.idx.jogo[r.jogo_id] })).sort((a, b) => compararJogos(a.jogo, b.jogo));
  const sector = sectorPosicao(pj?.posicao) || (p ? sectorPosicao(p.posicao) : null);
  const meta = pj ? [metaJogador(pj), pj.nacionalidade].filter(Boolean).join(' · ') : (p ? [p.posicao, sector].filter(Boolean).join(' · ') : '');

  v.innerHTML = `
    ${cabecalhoImpressao()}
    <a class="voltar so-ecra" href="#jogadores" id="f-voltar">← Plantel</a>
    <div class="cabecalho-vista">
      <div class="ficha-titulo">
        ${avatarJogador(pj || { nome: nomeVisivel(J.nome) }, 'avatar-grande')}
        <div>
          <p class="ficha-tipo">Ficha individual</p>
          <h1>${esc(nomeVisivel(J.nome))}</h1>
          ${meta ? `<p class="ficha-meta">${esc(meta)}</p>` : ''}
          <p class="nota">${esc(descricaoFiltros(js))}${pj?.nome_wyscout && pj.nome_wyscout !== pj.nome ? ` · no Wyscout: ${esc(pj.nome_wyscout)}` : ''}${pj?.tm_url && /^https:\/\/([\w-]+\.)?transfermarkt\./.test(pj.tm_url) ? ` · <a class="so-ecra" href="${esc(pj.tm_url)}" target="_blank" rel="noopener">Ver no Transfermarkt</a>` : ''}</p>
        </div>
      </div>
      <div class="ficha-acoes so-ecra">
        <label>Jogador<select id="f-jogador">${nomes.map(n => `<option value="${esc(n)}" ${n === J.nome ? 'selected' : ''}>${esc(nomeVisivel(n))}</option>`).join('')}</select></label>
        ${pode() ? `<button class="btn" id="f-editar">${pj ? 'Editar dados' : 'Adicionar ao plantel'}</button>` : ''}
        ${pj?.tm_url && tmDisponivel() ? '<button class="btn" id="f-tm">Atualizar do Transfermarkt</button>' : ''}
        <button class="btn botao-pdf" id="b-pdf">${iconePdf()}Exportar PDF</button>
      </div>
    </div>
    ${pj?.notas ? `<p class="ficha-notas">${esc(pj.notas)}</p>` : ''}
    ${htmlFiltros(comps)}
    ${p ? `
      <section class="placar" id="f-placar" aria-label="Resumo do jogador"></section>
      <section class="bloco" id="f-perfil"></section>
      <section class="bloco" id="f-evolucao"></section>
      <section class="bloco" id="f-oportunidades"></section>
      <section class="bloco" id="f-jogos"></section>`
      : `<div class="vazio"><p>${esc(nomeVisivel(J.nome))} não tem estatísticas com estes filtros.</p>${pj && !pj.nome_wyscout ? '<p>Se já tem jogos importados, indique o nome usado no Wyscout em "Editar dados".</p>' : ''}</div>`}`;

  ligarFiltros(v, 'jogadores');
  $('#f-jogador').addEventListener('change', e => { J.nome = e.target.value; J.metrica = null; J.perfil = null; desenharFicha(); });
  $('#b-pdf').addEventListener('click', () => exportarPdf(`Ficha ${nomeVisivel(J.nome)} ${hojeIso()}`));
  $('#f-voltar').addEventListener('click', e => { e.preventDefault(); J.modo = 'plantel'; mostrarVista('jogadores'); });
  $('#f-tm')?.addEventListener('click', e => tmAtualizarJogador(pj, e.currentTarget));
  $('#f-editar')?.addEventListener('click', () => dialogoJogador(pj || { nome: J.nome, nome_wyscout: J.nome, posicao: posicaoLonga(p?.posicao) }));
  if (!p) return;

  const disponiveis = mets.filter(m => Number.isFinite(p.tot[m]) || p.minPond[m]);
  // Perfil de métricas: o escolhido na página, ou o da posição do jogador (central por defeito).
  const perfil = J.perfil || perfilDoJogador(J.nome, p) || 'central';
  desenharPlacarJogador(p, js, regs, perfil);
  desenharPerfil(p, jogadores, perfil);
  desenharEvolucao(regs, disponiveis, perfil);
  desenharOportunidadesJogador(js);
  desenharJogoAJogo(regs, perfil);
}

function desenharPlacarJogador(p, js, regs, perfil) {
  const possiveis = js.length * 90;
  const titular = regs.filter(r => Number(r.minutos) >= 60).length;
  const cel = (rot, val, sub = '') => `<div class="placar-cel"><span class="placar-rot">${rot}</span><span class="placar-val">${val}</span>${sub ? `<span class="placar-sub">${sub}</span>` : ''}</div>`;
  const tot = c => valorSinonimo(p.tot, c);
  const p90 = c => (tot(c) !== null && p.minutos > 0 ? tot(c) / p.minutos * 90 : null);
  const g = tot('golos'), a = tot('assistencias');
  if (perfil === 'gr') {
    const v = id => valorMetrica(p, id), tj = id => regs.reduce((acc, r) => acc + (valorMetricaJogo(r.metricas || {}, id) ?? 0), 0);
    const semSofrer = regs.filter(r => (valorMetricaJogo(r.metricas || {}, 'gr_sofridos') ?? 1) === 0 && Number(r.minutos) >= 60).length;
    $('#f-placar').innerHTML = [
      cel('Jogos', p.jogos, `${regs.filter(r => Number(r.minutos) >= 60).length} com 60+ minutos`),
      cel('Minutos', fmtNum(p.minutos, 0), possiveis ? `${fmtNum(p.minutos / possiveis * 100, 0)}% dos possíveis` : ''),
      v('gr_sofridos') !== null ? cel('Golos sofridos', fmtNum(tj('gr_sofridos'), 0), `${fmtNum(v('gr_sofridos'), 2)} por 90 min`) : '',
      v('gr_defesas_pct') !== null ? cel('Defesas', `${fmtNum(v('gr_defesas_pct'), 0)}%`, `${fmtNum(tj('gr_defesas'), 0)} de ${fmtNum(tj('gr_remates'), 0)} remates`) : '',
      v('gr_evitados') !== null ? cel('Golos evitados', fmtSinal(tj('gr_evitados'), 1), 'xG contra − golos sofridos') : '',
      cel('Sem sofrer', semSofrer, 'jogos com 60+ minutos')
    ].join('');
    return;
  }
  $('#f-placar').innerHTML = [
    cel('Jogos', p.jogos, `${titular} com 60+ minutos`),
    cel('Minutos', fmtNum(p.minutos, 0), possiveis ? `${fmtNum(p.minutos / possiveis * 100, 0)}% dos possíveis` : ''),
    g !== null ? cel('Golos', fmtNum(g, 0), `${fmtNum(p90('golos'), 2)} por 90 min`) : '',
    a !== null ? cel('Assistências', fmtNum(a, 0), `${fmtNum(p90('assistencias'), 2)} por 90 min`) : '',
    tot('xg') !== null ? cel('xG', fmtNum(tot('xg'), 2), `${fmtNum(p90('xg'), 2)} por 90 min`) : '',
    tot('xa') !== null ? cel('xA', fmtNum(tot('xa'), 2), `${fmtNum(p90('xa'), 2)} por 90 min`) : ''
  ].join('');
}

function desenharPerfil(p, jogadores, perfil) {
  const J = App.jog; const el = $('#f-perfil'); const P = PERFIS[perfil];
  const maxMin = Math.max(...jogadores.map(x => x.minutos));
  const minimo = Math.min(270, Math.round(maxMin * 0.25));
  const base = jogadores.filter(x => x.minutos >= minimo || x.nome === p.nome);
  // Grupo de comparação: mesmo perfil; se forem menos de 3, o mesmo setor (ex.: todos os defesas); senão, o plantel.
  const SETOR = { gr: 'gr', central: 'def', lateral: 'def', medio: 'med', ofensivo: 'ata', pl: 'ata' };
  const mesmoPerfil = base.filter(x => x.nome === p.nome || perfilDoJogador(x.nome, x) === perfil);
  const mesmoSetor = base.filter(x => x.nome === p.nome || SETOR[perfilDoJogador(x.nome, x)] === SETOR[perfil]);
  const opcaoPosicao = mesmoPerfil.length >= 3 ? 'perfil' : mesmoSetor.length >= 3 ? 'setor' : null;
  const porPerfil = J.comparar !== 'plantel' && !!opcaoPosicao;
  const grupo = !porPerfil ? base : opcaoPosicao === 'perfil' ? mesmoPerfil : mesmoSetor;
  const nomeSetor = { gr: 'guarda-redes', def: 'defesas', med: 'médios', ata: 'avançados e extremos' }[SETOR[perfil]];

  const linha = id => {
    const def = METRICAS[id];
    const meu = valorMetrica(p, id); if (meu === null) return null;
    const lista = grupo.map(x => valorMetrica(x, id)).filter(v => v !== null);
    if (lista.length < 2) return { id, def, meu, so: true };
    const mn = Math.min(...lista), mx = Math.max(...lista), md = media(lista);
    const pos = 1 + lista.filter(x => (def.menos ? x < meu - 1e-9 : x > meu + 1e-9)).length;
    const esc01 = x => mx === mn ? 50 : (x - mn) / (mx - mn) * 100;
    return { id, def, meu, mn, mx, md, pos, n: lista.length, pMeu: esc01(meu), pMd: esc01(md) };
  };
  const casas = id => (ePct(id) ? 1 : 2);
  const fmt = (id, v) => `${fmtNum(v, casas(id))}${ePct(id) ? '%' : ''}`;
  const blocos = BLOCOS.map(b => ({ b, linhas: P[b].map(linha).filter(Boolean) })).filter(x => x.linhas.length);
  const temComparacao = blocos.some(x => x.linhas.some(l => !l.so));
  el.innerHTML = `
    <div class="bloco-cab"><h2>Perfil: ${esc(P.nome)}</h2>
      <div class="perfil-controlos so-ecra">
        <label class="em-linha">Métricas de<select id="f-perfil-sel">${Object.entries(PERFIS).map(([k, v]) => `<option value="${k}" ${k === perfil ? 'selected' : ''}>${esc(v.nome)}</option>`).join('')}</select></label>
        <div class="alternar" role="radiogroup" aria-label="Comparar com">
          <label class="chip"><input type="radio" name="comparar" value="posicao" ${porPerfil ? 'checked' : ''} ${opcaoPosicao ? '' : 'disabled'}><span>${opcaoPosicao === 'setor' ? 'Mesmo setor' : 'Mesma posição'}</span></label>
          <label class="chip"><input type="radio" name="comparar" value="plantel" ${porPerfil ? '' : 'checked'}><span>Todo o plantel</span></label>
        </div>
      </div>
    </div>
    <p class="nota">Por 90 minutos; as percentagens são calculadas sobre os totais. Comparação com ${!porPerfil ? 'todo o plantel' : opcaoPosicao === 'perfil' ? `os jogadores com o perfil ${esc(P.nome.toLowerCase())}` : `os ${nomeSetor} (há poucos jogadores com o perfil ${esc(P.nome.toLowerCase())})`} com pelo menos ${minimo} minutos neste período (${grupo.length} ${grupo.length === 1 ? 'jogador' : 'jogadores'}). No ranking, 1.º é o melhor valor do grupo; nas métricas marcadas com "menos é melhor", o valor mais baixo.</p>
    ${blocos.length ? blocos.map(({ b, linhas }) => `
      <h3 class="perfil-bloco">${b}</h3>
      <div class="perfil">
        <div class="perfil-cab" aria-hidden="true"><span>Métrica</span><span class="num">${esc(nomeVisivel(p.nome).split(' ')[0])}</span><span>Do mínimo ao máximo do grupo</span><span class="num">Ranking</span></div>
        ${linhas.map(l => `<div class="perfil-linha">
          <span class="perfil-met">${esc(l.def.r)}${l.def.menos ? ' <small class="menos">menos é melhor</small>' : ''}${l.def.estilo ? ' <small class="menos">estilo, sem ranking</small>' : ''}</span>
          <span class="num perfil-val">${fmt(l.id, l.meu)}</span>
          ${l.so ? '<span class="faixa fraco">Sem dados de outros jogadores</span><span class="num perfil-pos">–</span>' : `
          <span class="faixa" role="img" aria-label="${esc(l.def.r)}: ${fmt(l.id, l.meu)}; média do grupo ${fmt(l.id, l.md)}; entre ${fmt(l.id, l.mn)} e ${fmt(l.id, l.mx)}">
            <span class="faixa-min">${fmtNum(l.mn, casas(l.id))}</span>
            <span class="faixa-pista"><i class="faixa-media" style="left:${l.pMd}%" title="Média do grupo: ${fmt(l.id, l.md)}"></i><i class="faixa-ponto" style="left:${l.pMeu}%"></i></span>
            <span class="faixa-max">${fmtNum(l.mx, casas(l.id))}</span>
          </span>
          <span class="num perfil-pos">${l.def.estilo ? '–' : `<b>${l.pos}.º</b> de ${l.n}`}</span>`}
        </div>`).join('')}
      </div>`).join('') : '<p class="fraco">As métricas deste perfil não existem nos dados importados. Escolha outro perfil acima.</p>'}
    ${temComparacao ? `<div class="legenda-campo"><span><i class="leg-ponto"></i>${esc(nomeVisivel(p.nome))}</span><span><i class="leg-media"></i>Média do grupo</span></div>` : ''}`;
  $$('input[name=comparar]', el).forEach(r => r.addEventListener('change', () => { J.comparar = r.value; desenharPerfil(p, jogadores, perfil); }));
  $('#f-perfil-sel', el).addEventListener('change', e => { J.perfil = e.target.value; J.metrica = null; desenharFicha(); });
}

function desenharEvolucao(regs, disponiveis, perfil) {
  const J = App.jog; const el = $('#f-evolucao'); const P = PERFIS[perfil];
  // Opções: as métricas do perfil (com dados), agrupadas por bloco; depois todas as métricas importadas.
  const comDados = id => regs.some(r => valorMetricaJogo(r.metricas || {}, id) !== null);
  const grupos = BLOCOS.map(b => [b, P[b].filter(comDados)]).filter(([, ids]) => ids.length);
  const valido = v => (v?.startsWith('m:') ? comDados(v.slice(2)) : disponiveis.includes(v?.slice(2)));
  const principal = grupos.find(([b]) => b === BLOCO_PRINCIPAL[perfil]) || grupos[0];
  const preferida = METRICA_PRINCIPAL[perfil] && comDados(METRICA_PRINCIPAL[perfil]) ? METRICA_PRINCIPAL[perfil] : null;
  if (!J.metrica || !valido(J.metrica)) J.metrica = preferida ? `m:${preferida}` : principal ? `m:${principal[1][0]}` : `r:${disponiveis[0]}`;
  const eDef = J.metrica.startsWith('m:'); const id = J.metrica.slice(2);
  const rotulo = eDef ? METRICAS[id].r : id;
  const vals = regs.map(r => { const v = eDef ? valorMetricaJogo(r.metricas || {}, id) : r.metricas?.[id]; return Number.isFinite(v) ? v : null; });
  const ult = media(vals.slice(-5)), tot = media(vals);
  const fv = v => (eDef && ePct(id) ? `${fmtNum(v, 0)}%` : fmtNum(v, 2));
  App.graficos = App.graficos.filter(g => { if (g.canvas.closest('#f-evolucao')) { g.destroy(); return false; } return true; });
  el.innerHTML = `
    <div class="bloco-cab"><h2>Evolução: ${esc(rotulo)}</h2>
      <label class="em-linha so-ecra">Métrica<select id="f-met">
        ${grupos.map(([b, ids]) => `<optgroup label="${b}">${ids.map(m => `<option value="m:${m}" ${J.metrica === `m:${m}` ? 'selected' : ''}>${esc(METRICAS[m].r)}</option>`).join('')}</optgroup>`).join('')}
        <optgroup label="Todas as métricas importadas">${disponiveis.map(m => `<option value="r:${esc(m)}" ${J.metrica === `r:${m}` ? 'selected' : ''}>${esc(m)}</option>`).join('')}</optgroup>
      </select></label>
    </div>
    <p class="destaque">Média por jogo nos últimos ${Math.min(5, vals.filter(Number.isFinite).length)} jogos: <b>${fv(ult)}</b>, contra <b>${fv(tot)}</b> no período.</p>
    <div class="grafico"><canvas aria-label="${esc(rotulo)} por jogo"></canvas></div>
    <h3>Minutos por jogo</h3>
    <div class="grafico baixo"><canvas aria-label="Minutos por jogo"></canvas></div>`;
  $('#f-met', el).addEventListener('change', e => { J.metrica = e.target.value; desenharEvolucao(regs, disponiveis, perfil); });
  const labels = regs.map(r => rotuloJogo(r.jogo, true));
  const [c1, c2] = $$('canvas', el);
  const opBarras = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, tooltip: OPCOES_LINHA.plugins.tooltip } };
  novoGrafico(c1, { type: 'bar', data: { labels, datasets: [{ label: rotulo, data: vals, backgroundColor: COR.nos, borderRadius: 4, maxBarThickness: 30 }] }, options: { ...opBarras, scales: eixos() } });
  novoGrafico(c2, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Minutos', data: regs.map(r => r.minutos), backgroundColor: '#9AA6B8', borderRadius: 3, maxBarThickness: 30 }] },
    options: { ...opBarras, scales: { ...eixos(), y: { ...eixos().y, max: Math.max(90, ...regs.map(r => Number(r.minutos) || 0)), ticks: { stepSize: 45 } } } }
  });
}

function desenharOportunidadesJogador(js) {
  const nome = App.jog.nome; const el = $('#f-oportunidades');
  const ids = new Set(js.map(j => j.id));
  const pj = jogadorDoPlantel(nome);
  const aceites = new Set([nome, pj?.nome, pj?.nome_wyscout].filter(Boolean).map(norm));
  const e1 = x => aceites.has(norm(x));
  const evs = App.d.eventos.filter(e => ids.has(e.jogo_id) && e.lado === 'nos');
  const fin = evs.filter(e => e.tipo === 'oportunidade' && e1(e.jogador));
  const ass = evs.filter(e => e.tipo === 'oportunidade' && e1(e.assistente));
  const et = evs.filter(e => e.tipo === 'esquema_tatico' && e1(e.jogador));
  if (!fin.length && !ass.length && !et.length) {
    el.innerHTML = `<h2>Oportunidades codificadas</h2><p class="fraco">Sem oportunidades codificadas com ${esc(nomeVisivel(nome))} como finalizador ou assistente neste período.</p>`;
    return;
  }
  const golos = fin.filter(e => e.resultado === 'Golo').length;
  const grandes = fin.filter(e => e.qualidade === 'Grande oportunidade');
  const contarO = (lista, campo) => Object.entries(lista.reduce((a, e) => { const k = dadosOportunidade(e)[campo] || 'Sem indicação'; a[k] = (a[k] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]);
  el.innerHTML = `
    <h2>Oportunidades codificadas</h2>

const POSICOES = ['Guarda-redes', 'Defesa central', 'Lateral direito', 'Lateral esquerdo', 'Médio defensivo', 'Médio centro', 'Médio ofensivo', 'Extremo direito', 'Extremo esquerdo', 'Ponta de lança'];
const SECTORES = [['Guarda-redes', 'Guarda-redes'], ['Defesa', 'Defesas'], ['Médio', 'Médios'], ['Avançado', 'Avançados'], [null, 'Sem posição']];
App.plantelPesquisa = '';

function indexarPlantel() {
  const idx = {};
  for (const pj of App.d.plantel) { idx[norm(pj.nome)] = pj; if (pj.nome_wyscout) idx[norm(pj.nome_wyscout)] = pj; }
  App.idx.plantelPorEstat = idx;
}

// Converte abreviaturas (do Wyscout ou portuguesas) para os nomes de posição usados no plantel.
function posicaoLonga(abrev) {
  const p = String(abrev || '').toUpperCase().replace(/[^A-Z]/g, '');
  const mapa = { GR: 0, GK: 0, DC: 1, CB: 1, RCB: 1, LCB: 1, DD: 2, RB: 2, RWB: 2, LD: 2, DE: 3, LB: 3, LWB: 3, LE: 3, MDC: 4, DMF: 4, RDMF: 4, LDMF: 4, MC: 5, CMF: 5, RCMF: 5, LCMF: 5, MO: 6, AMF: 6, RAMF: 6, LAMF: 6, ED: 7, RW: 7, RWF: 7, RM: 7, EE: 8, LW: 8, LWF: 8, LM: 8, PL: 9, CF: 9, ST: 9, FW: 9, SS: 9, CM: 5, DM: 4, AM: 6 };
  if (p in mapa) return POSICOES[mapa[p]];
  const ingles = { goalkeeper: 0, 'centre back': 1, 'center back': 1, 'right back': 2, 'left back': 3, 'defensive midfield': 4, 'central midfield': 5, 'attacking midfield': 6, 'right winger': 7, 'left winger': 8, 'centre forward': 9, 'center forward': 9, 'second striker': 9, 'right midfield': 7, 'left midfield': 8,
    'medio defensivo': 4, 'medio centro': 5, 'medio ofensivo': 6, 'extremo direito': 7, 'extremo esquerdo': 8, 'ponta de lanca': 9, 'avancado centro': 9, 'segundo avancado': 9, 'guarda redes': 0, 'defesa central': 1, 'defesa direito': 2, 'defesa esquerdo': 3, 'lateral direito': 2, 'lateral esquerdo': 3 }[norm(abrev)];
  if (ingles !== undefined) return POSICOES[ingles];
  return POSICOES.find(x => norm(x) === norm(abrev)) || null;
}

  const resumo = {};
  for (const r of App.d.estJog) {

    ${todos.length ? `<label class="pesquisa"><span class="sr">Procurar jogador</span><input type="search" id="p-pesquisa" placeholder="Procurar jogador" value="${esc(App.plantelPesquisa)}" autocomplete="off"></label>` : ''}
    ${pode() && semPlantel.length && !App.semPlantel ? `<div class="aviso-suave"><p><b>${semPlantel.length}</b> ${semPlantel.length === 1 ? 'jogador tem' : 'jogadores têm'} estatísticas mas não ${semPlantel.length === 1 ? 'está' : 'estão'} no plantel: ${esc(semPlantel.slice(0, 6).join(', '))}${semPlantel.length > 6 ? '…' : ''}</p><button class="btn" id="p-criar-estat">Adicionar ao plantel</button></div>` : ''}
    <div id="p-grupos">

// Reduz a fotografia a 240×240 px, recortada ao centro (cerca de 15 KB).
function reduzirFoto(ficheiro) {
  return new Promise((resolve, reject) => {
    // Aceita um ficheiro escolhido pelo utilizador ou uma imagem já em data URL (Transfermarkt).
    const img = new Image(); const eTexto = typeof ficheiro === 'string'; const url = eTexto ? ficheiro : URL.createObjectURL(ficheiro);
    const libertar = () => { if (!eTexto) URL.revokeObjectURL(url); };
    img.onload = () => {
      const t = 240, c = document.createElement('canvas'); c.width = c.height = t;
      const lado = Math.min(img.width, img.height);
      const sx = (img.width - lado) / 2, sy = Math.max(0, (img.height - lado) / 2 - lado * 0.08); // ligeiramente acima do centro: rostos
      c.getContext('2d').drawImage(img, sx, Math.min(sy, img.height - lado), lado, lado, 0, 0, t, t);
      libertar(); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { libertar(); reject(new Error('Não consegui ler a imagem.')); };
    img.src = url;
  });
}

function dialogoImportarPlantel() {
  const d = document.createElement('dialog'); d.className = 'dialogo dialogo-largo';
  d.innerHTML = `<div class="pilha">

    <label class="zona-ficheiro"><input type="file" id="ip-ficheiro" accept=".xlsx,.xls,.csv"><span class="zona-titulo">Escolher ficheiro</span><span class="zona-sub">.xlsx, .xls ou .csv</span></label>
    <div id="ip-previa"></div>

        <tbody>${lista.map(j => `<tr><td>${j.numero ?? '–'}</td><td>${esc(j.nome)}</td><td>${esc(j.posicao || '–')}</td><td>${j.data_nascimento ? fmtData(j.data_nascimento) : '–'}</td><td class="num">${j.altura ?? '–'}</td><td>${esc(j.pe || '–')}</td></tr>`).join('')}</tbody></table></div>

      });

  });
}

function lerListaPlantel(linhas) {
  const P = {
    nome: /^(nome|name|jogador|player)$/i, numero: /^(n\.?º?|n[uú]mero|number|#|nr\.?)$/i, posicao: /^(posi[cç][aã]o|position|pos\.?)$/i,
    nasc: /^(data de nascimento|nascimento|date of birth|birth ?date|dob|nasc\.?)/i, idade: /^(idade|age)$/i,
    altura: /^(altura|height)/i, pe: /^(p[eé]( preferido)?|foot|p[eé] dominante)$/i, wy: /wyscout/i
  };
  let ih = -1, cab = [];
  for (let i = 0; i < Math.min(10, linhas.length); i++) {
    const c = linhas[i].map(x => String(x).trim());
    if (c.some(x => P.nome.test(x))) { ih = i; cab = c; break; }
  }
  if (ih < 0) return [];
  const col = k => cab.findIndex(x => P[k].test(x));
  const C = Object.fromEntries(Object.keys(P).map(k => [k, col(k)]));
  const pe = v => { const s = norm(v); return /^(dir|right|r$|d$)/.test(s) ? 'Direito' : /^(esq|left|l$|e$)/.test(s) ? 'Esquerdo' : /^(amb|both)/.test(s) ? 'Ambos' : null; };
  return linhas.slice(ih + 1).map(l => {
    const nome = String(l[C.nome] ?? '').trim(); if (!nome) return null;
    let nasc = C.nasc >= 0 ? parseData(String(l[C.nasc]).replace(/\s*\(\d+\)\s*$/, '') || l[C.nasc]) : null;
    if (!nasc && C.nasc >= 0 && l[C.nasc] instanceof Date) nasc = parseData(l[C.nasc]);
    const alt = C.altura >= 0 ? parseNum(String(l[C.altura]).replace(/m$/i, '').trim()) : null;
    return {
      nome, numero: C.numero >= 0 ? (parseNum(l[C.numero]) ?? null) : null,
      posicao: C.posicao >= 0 ? (posicaoLonga(l[C.posicao]) || String(l[C.posicao]).trim() || null) : null,
      data_nascimento: nasc,
      altura: alt === null ? null : Math.round(alt < 3 ? alt * 100 : alt),
      pe: C.pe >= 0 ? pe(l[C.pe]) : null,
      nome_wyscout: C.wy >= 0 ? String(l[C.wy] ?? '').trim() || null : null
    };
  }).filter(Boolean);
}

// ---------- Importar do Transfermarkt ----------
// Usa o serviço /api/transfermarkt (pasta api/ do projeto na Vercel), que lê a página
// do jogador ou da equipa e devolve os dados. Só existe na app publicada, ligada ao Supabase.
const tmDisponivel = () => App.db.modo === 'supabase' && !App.semPlantel && pode();

async function tmChamar(url) {
  const ses = await App.db.sb.auth.getSession();
  const token = ses.data.session ? ses.data.session.access_token : '';
  let r, j = null;
  try { r = await fetch('/api/transfermarkt?url=' + encodeURIComponent(url), { headers: { Authorization: 'Bearer ' + token } }); }
  catch { throw new Error('Não consegui ligar ao importador. Verifique a ligação à internet.'); }
  try { j = await r.json(); } catch { /* resposta sem JSON */ }
  if (r.status === 404 && !j) throw new Error('O importador não está publicado. Confirme que a pasta api/ (com transfermarkt.py) foi enviada para o GitHub e a Vercel.');
  if (!r.ok || !j || !j.ok) throw new Error(j && j.erro ? j.erro : 'O importador não respondeu. Tente daqui a pouco.');
  return j;
}

function posicaoTm(raw) {
  const direta = posicaoLonga(raw); if (direta) return direta;
  const t = norm(raw);
  const regras = [['Guarda-redes', ['guarda redes', 'goalkeeper']], ['Lateral direito', ['lateral dir', 'defesa dir', 'right back']], ['Lateral esquerdo', ['lateral esq', 'defesa esq', 'left back']],
    ['Defesa central', ['defesa central', 'centre back', 'center back']], ['Médio defensivo', ['medio defensivo', 'defensive midfield']], ['Médio ofensivo', ['medio ofensivo', 'attacking midfield']],
    ['Extremo direito', ['extremo direito', 'right wing', 'medio direito', 'right midfield']], ['Extremo esquerdo', ['extremo esquerdo', 'left wing', 'medio esquerdo', 'left midfield']],
    ['Ponta de lanca', ['ponta de lanca', 'centre forward', 'center forward', 'segundo avancado', 'second striker']], ['Médio centro', ['medio centro', 'central midfield', 'medio']]];
  for (const [pos, chaves] of regras) if (chaves.some(c => t.includes(c))) return pos === 'Ponta de lanca' ? 'Ponta de lança' : pos;
  if (t.startsWith('defesa')) return 'Defesa central';
  if (t.startsWith('avanc')) return 'Ponta de lança';
  return null;
}
function peTm(raw) { const t = norm(raw); return /^(dir|right)/.test(t) ? 'Direito' : /^(esq|left)/.test(t) ? 'Esquerdo' : /^(amb|both)/.test(t) ? 'Ambos' : null; }

// Procura o jogador no plantel: primeiro pelo ID do Transfermarkt, depois pelo nome.
function tmExistente(j) {
  return App.d.plantel.find(p => p.tm_id && j.transfermarktId && p.tm_id === String(j.transfermarktId))
    || App.d.plantel.find(p => norm(p.nome) === norm(j.name)) || null;
}

async function tmGuardar(j) {
  const ex = tmExistente(j);
  const num = parseInt(j.shirtNumber, 10);
  const dados = {
    posicao: posicaoTm(j.position) ?? ex?.posicao ?? null,
    data_nascimento: /^\d{4}-\d{2}-\d{2}$/.test(j.birthDate || '') ? j.birthDate : ex?.data_nascimento ?? null,
    altura: j.heightCm >= 120 && j.heightCm <= 230 ? j.heightCm : ex?.altura ?? null,
    pe: peTm(j.foot) ?? ex?.pe ?? null,
    numero: num >= 0 && num <= 99 ? num : ex?.numero ?? null,
    nacionalidade: j.nationality || ex?.nacionalidade || null,
    tm_id: j.transfermarktId ? String(j.transfermarktId) : ex?.tm_id ?? null,
    tm_url: j.sourceUrl || ex?.tm_url || null
  };
  // A fotografia só entra se o jogador ainda não tiver uma.
  if (!ex?.foto && /^data:image\//.test(j.photo || '')) { try { dados.foto = await reduzirFoto(j.photo); } catch { /* sem foto */ } }
  if (ex) {
    const [r] = await App.db.atualizar('jogadores', { id: ex.id }, dados);
    Object.assign(ex, r || dados);
    return 'atualizado';
  }
  const novo = await App.db.inserir('jogadores', { nome: j.name, ...dados });
  App.d.plantel.push(novo); indexarPlantel();
  return 'novo';
}

    msg(`Encontrei ${lista.length === 1 ? '1 jogador' : `${lista.length} jogadores`}. A importação demora cerca de ${Math.max(1, Math.ceil(lista.length * 4 / 60))} min.`);

      e.currentTarget.remove();

      const barra = document.createElement('div'); barra.className = 'tm-barra'; barra.innerHTML = '<i></i>'; saida.prepend(barra);
      let ok = 0; const falhas = []; const pausa = window.__TMPAUSA ?? 2500;
      for (let i = 0; i < lista.length && !parar; i++) {
        msg(`${i + 1} de ${lista.length}: ${lista[i].name}`);
        try { const r = await tmChamar(lista[i].url); await tmGuardar(r.jogador); ok++; } catch { falhas.push(lista[i].name); }

async function tmAtualizarJogador(pj, botao) {

}

// ---- Datas (sempre em 'YYYY-MM-DD', sem fusos horários) ----
const hojeLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const paraUTC = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const deUTC = t => new Date(t).toISOString().slice(0, 10);
const somarDias = (iso, n) => deUTC(paraUTC(iso) + n * 86400000);
const diasEntre = (a, b) => Math.round((paraUTC(b) - paraUTC(a)) / 86400000);
const diaSemana = iso => (new Date(paraUTC(iso)).getUTCDay() + 6) % 7; // 0 = segunda
const inicioSemana = iso => somarDias(iso, -diaSemana(iso));
const hhmm = h => (h ? String(h).slice(0, 5) : '');
const mdTexto = n => (n === 0 ? 'MD' : n > 0 ? `MD+${n}` : `MD${n}`);

function jogosComData() { return App.d.jogos.filter(j => j.data).sort((a, b) => a.data.localeCompare(b.data)); }

// Designação do dia em relação aos jogos: MD no dia do jogo, MD+1/MD+2 a seguir, MD-n antes do próximo.
function rotuloMD(iso, jogos) {
  let ant = null, prox = null;
  for (const j of jogos) { if (j.data <= iso) ant = j; if (j.data >= iso && !prox) prox = j; }
  if (prox && prox.data === iso) return 'MD';
  const n = prox ? diasEntre(iso, prox.data) : null, p = ant ? diasEntre(ant.data, iso) : null;
  if (p !== null && p <= 2 && (n === null || p < n)) return `MD+${p}`;
  if (n !== null && n <= 7) return `MD-${n}`;
  if (p !== null && p <= 3) return `MD+${p}`;
  return '';
}

function eventosDoDia(iso) {
  return (App.d.agenda || []).filter(e => e.data === iso)
    .sort((a, b) => (hhmm(a.hora_inicio) || '99').localeCompare(hhmm(b.hora_inicio) || '99') || a.titulo.localeCompare(b.titulo, 'pt'));
}

// ---- Semana (microciclo) ----
function desenharSemana() {
  const C = App.cal; const s = inicioSemana(C.ref); const hoje = hojeLocal(); const jogos = jogosComData();
  const dias = [0, 1, 2, 3, 4, 5, 6].map(i => somarDias(s, i));
  const jogosSemana = jogos.filter(j => j.data >= s && j.data <= dias[6]);
  // Jogos desta semana, ou o próximo (até 7 dias depois), que ainda não têm microciclo.
  const proximo = jogos.find(j => j.data > dias[6] && diasEntre(dias[6], j.data) <= 7);
  const semMicro = [...jogosSemana, ...(proximo ? [proximo] : [])].filter(j => !(App.d.agenda || []).some(e => e.jogo_id === j.id));
  const tarefas = dias.flatMap(eventosDoDia).filter(e => e.tipo === 'tarefa');
  const ed = pode() && !App.semAgenda;
  $('#cal-corpo').innerHTML = `
    ${ed && semMicro.length ? `<div class="aviso-suave so-ecra">${semMicro.map(j => `<p><b>${esc(j.adversario)}</b> (${fmtData(j.data)}) ainda não tem microciclo.</p><button class="btn btn-prim" data-aplicar="${j.id}">Criar a partir do modelo</button>`).join('</div><div class="aviso-suave so-ecra">')}</div>` : ''}
    <div class="cal-semana">
      ${dias.map(d => {
        const md = rotuloMD(d, jogos); const js = jogos.filter(j => j.data === d);
        return `<section class="cal-col ${d === hoje ? 'hoje' : ''} ${js.length ? 'com-jogo' : ''}" aria-label="${fmtData(d)}">
          <header><span>${DIAS_SEMANA[diaSemana(d)]} <b>${Number(d.slice(8))}</b></span>${md ? `<span class="cal-md">${md}</span>` : ''}</header>
          ${js.map(j => cartaoJogo(j)).join('')}
          ${eventosDoDia(d).map(cartaoEvento).join('')}
          ${ed ? `<button class="cal-adicionar so-ecra" data-novo="${d}" aria-label="Adicionar evento a ${fmtData(d)}">+ Adicionar</button>` : ''}
        </section>`;
      }).join('')}
    </div>
    ${legendaAgenda()}
    ${tarefas.length ? `<section class="bloco cal-tarefas"><h2>Tarefas da semana</h2>
      <div class="tabela-env"><table class="tabela compacta"><thead><tr><th>Dia</th><th>Tarefa</th><th>Responsável</th><th>Estado</th></tr></thead>
      <tbody>${tarefas.map(e => `<tr><td>${DIAS_SEMANA[diaSemana(e.data)]} ${Number(e.data.slice(8))}${e.md != null ? ` <span class="fraco">${mdTexto(e.md)}</span>` : ''}</td><td>${esc(e.titulo)}</td><td>${esc(e.responsavel || '–')}</td>
        <td>${chipEstado(e)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
  $$('[data-novo]').forEach(b => b.addEventListener('click', () => dialogoEvento(null, b.dataset.novo)));
  $$('[data-evento]').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-estado]')) return; dialogoEvento((App.d.agenda || []).find(x => x.id === b.dataset.evento)); }));
  $$('[data-estado]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); mudarEstado(b.dataset.estado); }));
  $$('[data-aplicar]').forEach(b => b.addEventListener('click', () => aplicarModelo([App.idx.jogo[b.dataset.aplicar]], b)));
}
function chipEstado(e) {
  const est = e.estado || 'por_fazer';
  return pode() && !App.semAgenda
    ? `<button class="estado estado-${est}" data-estado="${e.id}" title="Mudar estado">${ESTADOS[est]}</button>`
    : `<span class="estado estado-${est}">${ESTADOS[est]}</span>`;
}
function cartaoEvento(e) {
  const horas = [hhmm(e.hora_inicio), hhmm(e.hora_fim)].filter(Boolean).join('–');
  return `<div class="cal-evento tipo-${e.tipo} ${e.estado === 'feito' ? 'feito' : ''}" data-evento="${e.id}" role="button" tabindex="0">
    <span class="cal-ev-cab"><span class="cal-ev-tipo">${TIPOS_AGENDA[e.tipo] || ''}</span>${horas ? `<span class="cal-ev-hora">${horas}</span>` : ''}</span>
    <b>${esc(e.titulo)}</b>
    ${e.local || e.responsavel ? `<small>${esc([e.local, e.responsavel].filter(Boolean).join(' · '))}</small>` : ''}
    ${e.tipo === 'tarefa' ? chipEstado(e) : ''}
  </div>`;
}
async function mudarEstado(id) {
  const e = App.d.agenda.find(x => x.id === id); if (!e) return;
  const ordem = ['por_fazer', 'em_curso', 'feito'];
  const novo = ordem[(ordem.indexOf(e.estado || 'por_fazer') + 1) % ordem.length];
  try { await App.db.atualizar('agenda', { id }, { estado: novo }); e.estado = novo; desenharSemana(); }
  catch (err) { toast(err.message, 'erro'); }
}
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-evento]')) { e.preventDefault(); e.target.click(); }
});

// ---- Formulário de evento ----
