<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Departamento de Análise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.2/dist/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --fundo: #F3F4F1;
  --papel: #FFFFFF;
  --tinta: #17202B;
  --tinta2: #4B5563;
  --fraco: #5F6672;
  --linha: #DADDD6;
  --linha-forte: #B9BEB5;
  --nos: #2453C9;
  --nos-claro: #E6ECFA;
  --adv: #C77A0F;
  --adv-escuro: #995C06;
  --eq-nos: #7A1F2B; /* cor do Torreense nos dados (mapas, gráficos) */
  --eq-adv: #1A1A1A; /* cor do adversário nos dados */
  --relva: #D7E3D1;
  --perigo: #B42318;
  --ok: #1F7A4D;
  --raio: 6px;
  --azul-clube: #003870;
  --marinho: #13284A;
  --marinho-hover: #1E3864;
  --bordeaux: #5C1E29;
  --dourado: #B88A4A;
  --dourado-claro: #D8B27A;
  --papel-fundo: #EAE7E0;
  --cond: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papel-fundo); color: var(--tinta);
  font: 400 16px/1.5 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { color: var(--azul-clube); font-family: var(--cond); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -0.005em; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.25rem; margin-bottom: .6rem; }
h3 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
p { margin: 0 0 .75rem; }
a { color: var(--nos); }
code { font-size: .9em; background: var(--fundo); padding: 0 .3em; border-radius: 3px; }
b { font-weight: 600; }
  .so-impressao { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nota { color: var(--fraco); font-size: .92rem; max-width: 72ch; }
.fraco { color: var(--fraco); }
.destaque { font-size: 1.05rem; max-width: 72ch; }
.erro { color: var(--perigo); font-weight: 500; }
:focus-visible { outline: 2px solid var(--nos); outline-offset: 2px; }
#vista:focus { outline: none; }

/* ---------- Botões e campos ---------- */
.btn {
  font: 500 .95rem/1 'Barlow', sans-serif; padding: .62rem 1rem; border-radius: var(--raio);
  border: 1px solid var(--linha-forte); background: var(--papel); color: var(--tinta); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--tinta2); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn-prim { background: var(--marinho); border-color: var(--marinho); color: #fff; }
.btn-prim:hover { background: var(--marinho-hover); }
.btn-perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }
.btn-link { background: none; border: 0; padding: .2rem .1rem; color: var(--nos); font: inherit; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; }
.btn-link:hover { text-decoration-color: currentColor; }
.btn-link.perigo { color: var(--perigo); }
label { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; font-weight: 500; color: var(--tinta2); }
label.em-linha { flex-direction: row; align-items: center; gap: .6rem; }
input:not([type=radio]):not([type=checkbox]):not([type=file]), select, textarea {
  font: 400 1rem/1.3 'Barlow', sans-serif; color: var(--tinta); background: var(--papel);
  border: 1px solid var(--linha-forte); border-radius: var(--raio); padding: .55rem .65rem; min-width: 0; width: 100%;
}
textarea { resize: vertical; line-height: 1.45; }
input:disabled, textarea:disabled { background: var(--fundo); color: var(--tinta2); }
.pilha { display: flex; flex-direction: column; gap: 1rem; }
.grelha-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
.alinhar-fim { align-items: end; }
.acoes, .acoes-esq { display: flex; gap: .6rem; flex-wrap: wrap; }
.acoes { justify-content: flex-end; }

/* ---------- Ecrã de entrada ---------- */
.entrada { box-shadow: 0 18px 40px rgba(10,30,54,.12); }
.ecra-entrada { display: grid; place-items: center; min-height: 100vh; padding: 1rem; }
.entrada { width: 100%; max-width: 420px; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 2rem 1.75rem; }
.entrada h1 { margin: 1.5rem 0 .75rem; }
.entrada-marca .marca { height: 56px; }
.entrada-marca { display: flex; align-items: center; gap: .75rem; font-family: var(--cond); font-weight: 600; color: var(--tinta2); }
.entrada > .btn { width: 100%; }
.separador { display: flex; align-items: center; gap: .75rem; color: var(--fraco); font-size: .85rem; margin: 1.25rem 0; }
.separador::before, .separador::after { content: ''; flex: 1; border-top: 1px solid var(--linha); }
.marca { width: auto; height: 44px; flex: none; object-fit: contain; }
.marca-pequena { height: 30px; }

/* ---------- Fundo e menu lateral ---------- */
.fundo-img {
  position: fixed; inset: 0 0 0 var(--lat, 0px); z-index: -1; pointer-events: none;
  background: var(--papel-fundo) url("img/fundo.jpg") center / cover no-repeat;
}
.ecra-entrada .fundo-img { left: 0; }
.com-lateral { --lat: 248px; padding-left: var(--lat); }
.lateral {
  position: fixed; top: 0; bottom: 0; left: 0; width: var(--lat); z-index: 30;
  display: flex; flex-direction: column; gap: 1.5rem; padding: 1.4rem 0 1.1rem;
  background: var(--marinho); color: #E6E3DC; border-right: 1px solid var(--dourado);
}
.lateral-marca { display: flex; align-items: center; gap: .7rem; padding: 0 1.25rem; }
.lateral-marca b { display: block; font-family: var(--cond); font-size: 1.2rem; line-height: 1.1; color: #fff; }
.lateral-marca span { display: block; font-size: .8rem; color: #A9B3C2; }
.lateral-nav { display: flex; flex-direction: column; gap: .15rem; padding: 0 .6rem; }
.lateral-nav a {
  display: flex; align-items: center; gap: .75rem; padding: .62rem .75rem; border-radius: 6px;
  color: #C9CFD8; text-decoration: none; font-weight: 500; position: relative;
}
.lateral-nav a svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lateral-nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.lateral-nav a[aria-current] { background: rgba(255,255,255,.1); color: #fff; }
.lateral-nav a[aria-current]::before { content: ''; position: absolute; left: -.6rem; top: .45rem; bottom: .45rem; width: 3px; border-radius: 0 3px 3px 0; background: var(--dourado-claro); }
.lateral-nav a[aria-current] svg { color: var(--dourado-claro); }
.lateral-nav a:focus-visible { outline-color: var(--dourado-claro); }
.lateral-conta { margin-top: auto; padding: 1rem 1.25rem 0; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; font-size: .85rem; color: #A9B3C2; }
.lateral-conta .conta-email { overflow-wrap: anywhere; }
.etiqueta-demo { background: #FFF4DC; color: #6B4605; border: 1px solid #F0D79E; padding: .15rem .55rem; border-radius: 999px; font-weight: 500; }
.barra-movel { display: none; }
.cortina { position: fixed; inset: 0; z-index: 25; background: rgba(10,30,54,.45); }
@media (max-width: 900px) {
:where(html:not(.medir)) .com-lateral { --lat: 0px; padding-left: 0; }
:where(html:not(.medir)) .lateral { width: min(280px, 85vw); transform: translateX(-100%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
:where(html:not(.medir)) .lateral.aberta { transform: none; visibility: visible; transition: transform .2s ease; }
:where(html:not(.medir)) .barra-movel {
    display: flex; align-items: center; gap: .75rem; position: sticky; top: 0; z-index: 20;
    padding: .55rem max(16px, env(safe-area-inset-right, 0px)) .55rem max(16px, env(safe-area-inset-left, 0px));
    background: var(--marinho); color: #fff; border-bottom: 1px solid var(--dourado);
  }
:where(html:not(.medir)) .barra-movel b { font-family: var(--cond); font-size: 1.1rem; }
:where(html:not(.medir)) .barra-movel span { color: #A9B3C2; font-size: .9rem; margin-left: auto; }
:where(html:not(.medir)) .botao-menu { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: none; color: #fff; cursor: pointer; }
:where(html:not(.medir)) .botao-menu svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
}
@media (prefers-reduced-motion: reduce) { .lateral, .lateral.aberta { transition: none; } }

/* ---------- Vistas ---------- */
main#vista { max-width: 1240px; margin: 0 auto; padding-block: 1.9rem 4rem; padding-left: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-left, 0px)); padding-right: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-right, 0px)); }
.cabecalho-vista { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem 1.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.cabecalho-vista h1 + .nota { margin: .35rem 0 0; }
.bloco { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 1.25rem clamp(1rem, 2.5vw, 1.5rem); margin-bottom: 1.25rem; }
.bloco-cab { display: flex; justify-content: space-between; align-items: center; gap: .75rem 1rem; flex-wrap: wrap; margin-bottom: .6rem; }
.bloco-cab h2 { margin: 0; }
.vazio { background: var(--papel); border: 1px dashed var(--linha-forte); border-radius: 10px; padding: 2.5rem 1.5rem; text-align: center; color: var(--tinta2); }
.vazio p:last-child { margin: 0; }
.vazio-curto { padding: 1rem 0; }

/* ---------- Tabelas ---------- */
.tabela-env { overflow-x: auto; margin: 0 0 .75rem; position: relative; }
.tabela { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tabela th { text-align: left; font-weight: 500; color: var(--fraco); font-size: .85rem; padding: .5rem .7rem; border-bottom: 1px solid var(--linha-forte); white-space: nowrap; vertical-align: bottom; }
.tabela td { padding: .55rem .7rem; border-bottom: 1px solid var(--linha); vertical-align: middle; }
.tabela tbody tr:hover td { background: #FAFAF8; }
.tabela .num { text-align: right; white-space: nowrap; }
#f-jogos td:first-child, #f-jogos td:nth-child(2) { white-space: nowrap; }
.tabela.compacta td { padding: .4rem .7rem; }
.acoes-linha { text-align: right; white-space: nowrap; }
.acoes-linha .btn-link + .btn-link { margin-left: .75rem; }
.ordenar { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
th[aria-sort=ascending] .ordenar, th[aria-sort=descending] .ordenar { color: var(--tinta); }
.res { display: inline-grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 4px; font-size: .78rem; font-weight: 600; margin-right: .3rem; }
.res-V { background: #DDF1E5; color: #145233; }
.res-E { background: #ECEDEA; color: #3A4150; }
.res-D { background: #FBE2DF; color: #8A1C12; }
.ponto-cor { display: inline-block; width: .65rem; height: .65rem; border-radius: 50%; margin-right: .45rem; vertical-align: 0; flex: none; }
.ponto-cor.nos { background: var(--eq-nos); box-shadow: 0 0 0 1px var(--eq-nos-linha, transparent) inset; }
.ponto-cor.adv { background: var(--eq-adv); box-shadow: 0 0 0 1px var(--eq-adv-linha, transparent) inset; }
.seta { color: var(--tinta2); }

/* ---------- Chips e segmentados ---------- */
.chip input, .chip-check input, .segmentado input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chips, .chips-lista { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip, .chip-check { flex-direction: row; font-weight: 400; color: var(--tinta); cursor: pointer; position: relative; }
.chip span, .chip-check span {
  display: inline-block; padding: .38rem .75rem; border: 1px solid var(--linha-forte); border-radius: 999px; background: var(--papel);
  font-size: .9rem; line-height: 1.2; user-select: none;
}
.chip:hover span, .chip-check:hover span { border-color: var(--tinta2); }
.chip input:checked + span { background: var(--marinho); border-color: var(--marinho); color: #fff; }
.chip-check input:checked + span { background: var(--nos-claro); border-color: var(--nos); color: #13327F; }
.chip-check input:checked + span::before { content: '✓ '; }
.chip input:focus-visible + span, .chip-check input:focus-visible + span, .segmentado input:focus-visible + span { outline: 2px solid var(--nos); outline-offset: 2px; }
.chip-check input:disabled + span { opacity: .7; cursor: default; }
.grupo-chips { border: 0; padding: 0; margin: 0; min-width: 0; }
.grupo-chips legend { font-size: .9rem; font-weight: 500; color: var(--tinta2); padding: 0; margin-bottom: .35rem; }
.segmentado { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: var(--raio); background: var(--papel); padding: 3px; gap: 3px; max-width: 100%; }
.segmentado label { flex: 1; color: var(--tinta2); font-size: .95rem; cursor: pointer; position: relative; }
.segmentado span { display: block; text-align: center; padding: .48rem .9rem; border-radius: 4px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segmentado label:hover span { color: var(--tinta); }
.segmentado input:checked + span { background: var(--marinho); color: #fff; }
.segmentado.lados .lado-nos input:checked + span { background: var(--eq-nos); color: var(--eq-nos-txt, #fff); box-shadow: 0 0 0 1px var(--eq-nos-linha, transparent) inset; }
.segmentado.lados .lado-adv input:checked + span { background: var(--eq-adv); color: var(--eq-adv-txt, #fff); box-shadow: 0 0 0 1px var(--eq-adv-linha, transparent) inset; }
.segmentado.largo { margin-bottom: 1.25rem; }
@media (max-width: 520px) {
:where(html:not(.medir)) .segmentado.largo { display: flex; }
:where(html:not(.medir)) .segmentado.largo span { white-space: normal; padding-inline: .5rem; }
}
.alternar { display: flex; gap: .4rem; flex-wrap: wrap; }

/* ---------- Relatório ---------- */
.filtros { display: flex; flex-wrap: wrap; gap: .75rem 1rem; margin-bottom: 1.25rem; }
.filtros label { min-width: 170px; }
.placar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--marinho); color: #fff; border-bottom: 3px solid var(--dourado);
  border-radius: 10px; margin-bottom: 1.25rem; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.placar-cel { padding: 1rem 1.25rem 1.1rem; border-right: 1px solid #2A3E60; display: flex; flex-direction: column; gap: .15rem; }
.placar-cel:last-child { border-right: 0; }
.placar-rot { font-size: .85rem; color: #B7BFCA; }
.placar-val { font-family: var(--cond); font-weight: 600; font-size: 2.1rem; line-height: 1.05; }
.placar-val i { font-style: normal; color: #7C8796; margin: 0 .12em; }
.placar-sub { font-size: .8rem; color: #93A0AF; }
.seletor-metrica { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .25rem 0 1rem; }
.seletor-metrica select { width: auto; padding: .35rem .6rem; font-size: .9rem; border-radius: 999px; }
.grafico { position: relative; height: 280px; }
.grafico.alto { height: 340px; }
.dois-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; margin-bottom: .75rem; align-items: start; }
.dois-campos figure { margin: 0; }
.dois-campos figcaption { font-weight: 500; margin-bottom: .4rem; display: flex; align-items: center; flex-wrap: wrap; gap: .3rem; }
.escolher-metricas { margin: 0 0 .9rem; }
.escolher-metricas summary { cursor: pointer; color: var(--tinta2); font-size: .92rem; margin-bottom: .5rem; }
.tabela.jogadores td:first-child { white-space: nowrap; }
.nome-jogador { text-align: left; color: var(--tinta); font-weight: 500; }

/* Perfil por posição */
.perfil-controlos { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap; }
.perfil-controlos select { width: auto; padding: .35rem .6rem; }
.perfil-bloco { margin: 1.4rem 0 .4rem; font-size: 1.1rem; padding-bottom: .3rem; border-bottom: 2px solid var(--dourado); display: inline-block; }
.perfil-met small.menos { display: inline-block; margin-left: .4rem; font-size: .72rem; color: var(--fraco); border: 1px solid var(--linha-forte); border-radius: 999px; padding: 0 .4rem; }
@media print { .perfil-bloco { break-after: avoid; } }
:where(html.medir) .perfil-bloco { break-after: avoid; }


/* ---------- Plantel ---------- */
.plantel-cab { align-items: center; }
.plantel-acoes { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap; }
.pesquisa { display: block; margin-bottom: 1.5rem; }
.pesquisa input { font-size: 1.05rem !important; padding: .8rem 1rem !important; border-radius: 10px !important; border-color: var(--linha) !important; }
.grupo-plantel { margin-bottom: 1.6rem; }
.grupo-plantel h2 { font-family: 'Barlow', sans-serif; font-size: .82rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta2); margin-bottom: .6rem; }
.grupo-plantel h2 span { letter-spacing: .04em; }
.grelha-plantel { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: .85rem; }
.cartao-jogador {
  display: flex; align-items: center; gap: .9rem; width: 100%; text-align: left; font: inherit; color: var(--tinta);
  background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: .9rem 1rem; cursor: pointer; min-width: 0;
}
.cartao-jogador:hover { border-color: var(--marinho); }
.cartao-texto { display: flex; flex-direction: column; min-width: 0; gap: .1rem; }
.cartao-texto b { font-family: var(--cond); font-size: 1.2rem; line-height: 1.15; }
.cartao-meta { font-size: .88rem; color: var(--tinta2); line-height: 1.35; }
.cartao-estat { font-size: .8rem; color: var(--fraco); }
.avatar { position: relative; flex: none; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 20%; background: #DDE2EA; }
.avatar-sem-foto { background: var(--marinho); color: #fff; font-family: var(--cond); font-weight: 600; font-size: 1.55rem; }
.avatar-num { z-index: 1; position: absolute; right: -3px; bottom: -3px; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 12px; background: var(--marinho); color: #fff; border: 2px solid var(--papel); font-family: var(--cond); font-size: .82rem; display: grid; place-items: center; }
.avatar-grande { width: 88px; height: 88px; }
.avatar-grande.avatar-sem-foto { font-size: 2.3rem; }
.avatar-grande .avatar-num { min-width: 30px; height: 30px; font-size: 1rem; border-radius: 15px; }
.aviso-suave { display: flex; align-items: center; justify-content: space-between; gap: .75rem 1rem; flex-wrap: wrap; background: var(--papel); border: 1px dashed var(--dourado); border-radius: 10px; padding: .8rem 1rem; margin-bottom: 1.25rem; }
.aviso-suave p { margin: 0; }
.voltar { display: inline-block; margin-bottom: .75rem; color: var(--tinta2); text-decoration: none; font-weight: 500; }
.voltar:hover { color: var(--tinta); }
.foto-campo { display: flex; align-items: center; gap: 1rem; }
.pilha-curta { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; }
.btn-ficheiro { position: relative; flex-direction: row; color: var(--tinta); }
.btn-ficheiro input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.btn-ficheiro:focus-within { outline: 2px solid var(--nos); outline-offset: 2px; }
.sem-margem { margin: -.6rem 0 0; }
.apagar-esq { margin-right: auto; }
.ficha-meta { margin: .15rem 0 .2rem; font-size: 1.02rem; color: var(--tinta2); }
.ficha-notas { background: var(--papel); border-left: 3px solid var(--dourado); padding: .7rem 1rem; border-radius: 0 8px 8px 0; max-width: 80ch; }

/* ---------- Transfermarkt ---------- */
.tm-linha { margin-top: 0; }
.tm-linha label { flex: 1 1 320px; }
.tm-msg { margin: 0; min-height: 1.5em; color: var(--tinta2); font-weight: 500; }
.tm-cartao { display: flex; align-items: center; gap: 1rem; background: var(--fundo); border-radius: 10px; padding: 1rem; margin-bottom: .9rem; }
.tm-cartao b { font-family: var(--cond); font-size: 1.3rem; }
.tm-cartao p { margin: .15rem 0 0; }
.tm-lista { columns: 2 220px; margin: 0 0 1rem; padding-left: 1.2rem; }

/* ---------- Calendário ---------- */
:root { --t-treino: #2E7D5B; --t-reuniao: #B07A1E; --t-tarefa: #003870; --t-outro: #7A8494; --t-jogo: #5C1E29; }

.ec-jogo.completo { background: #E8F3EA; border-color: #B9DAC1; }
.ec-jogo.parcial { background: #FCF1E1; border-color: #EBCB98; }
.ec-jogo.falta { background: #F8E4E1; border-color: #E5B5AE; }

/* ---------- Arquivo ---------- */

.arq-j { background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: .9rem 1.1rem; }

<script>
// ---------- Utilitários ----------
const $ = (sel, root = document) => root.querySelector(sel);

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);

// Normaliza nomes para comparação: minúsculas, sem acentos nem pontuação.
function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

// Lê números em formatos variados: 1.25 | 1,25 | 52% | "-" | 1 234
function parseNum(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  let s = String(v).trim().replace(/\s/g, '').replace('%', '');
  if (s === '' || s === '-' || s === '—') return null;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

// Devolve 'YYYY-MM-DD' ou null.
function parseData(v) {
  if (v === null || v === undefined || v === '') return null;
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (v instanceof Date && !isNaN(v)) {
    // As datas do Excel chegam à meia-noite UTC; arredonda ao dia mais próximo.
    return iso(new Date(v.getTime() + 12 * 3600 * 1000));
  }
  if (typeof v === 'number' && v > 20000 && v < 80000) { // número de série do Excel
    const d = new Date(Math.round((v - 25569) * 86400 * 1000) + 12 * 3600 * 1000);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
  if (m) {
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }

}

const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function fmtData(iso, curta = false) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return curta ? `${d}/${m}` : `${Number(d)} ${MESES[Number(m) - 1]} ${y}`;

// Ordena jogos pela data; quando falta a data (ficheiros por jornada), pela jornada.
function compararJogos(a, b) {
  if (a._ordem && b._ordem && a._ordem !== b._ordem) return a._ordem.localeCompare(b._ordem);
  if (a.data && b.data && a.data !== b.data) return a.data.localeCompare(b.data);
  const ja = a.jornada ?? null, jb = b.jornada ?? null;
  if (ja !== null && jb !== null && ja !== jb) return ja - jb;
  return String(a.data || '').localeCompare(String(b.data || '')) || String(a.competicao || '').localeCompare(String(b.competicao || ''));

// Data aproximada para ordenar jogos sem data: parte da jornada mais próxima que tem data (uma semana por jornada).
function calcularOrdemJogos(jogos) {
  const porComp = {};
  for (const j of jogos) if (j.data && j.jornada !== null && j.jornada !== undefined) (porComp[norm(j.competicao)] ||= []).push(j);
  const dia = 86400000;
  for (const j of jogos) {
    if (j.data) { j._ordem = j.data; continue; }
    const ref = (porComp[norm(j.competicao)] || []).slice().sort((a, b) => Math.abs(a.jornada - j.jornada) - Math.abs(b.jornada - j.jornada))[0];
    if (ref && j.jornada !== null && j.jornada !== undefined) {
      j._ordem = new Date(Date.parse(ref.data) + (j.jornada - ref.jornada) * 7 * dia).toISOString().slice(0, 10) + '~';

  if (j.jornada !== null && j.jornada !== undefined) return curto ? `J${j.jornada}` : `Jornada ${j.jornada}`;

function fmtNum(n, casas = 1) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '–';
  const arred = Math.round(n * 10 ** casas) / 10 ** casas + 0;
  return arred.toLocaleString('pt-PT', { minimumFractionDigits: Number.isInteger(arred) ? 0 : casas, maximumFractionDigits: casas });

function fmtSinal(n, casas = 1) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '–';

const ESCALAO_UNICAS = new Set(['jogos', 'partidas', 'estatisticas_liga', 'arquivo', 'estatisticas_adversario', 'jogadores', 'jogadores_adversarios']);

// ---------- Acesso aos dados ----------
// Duas implementações com a mesma interface:
//   SupaDB  -> o vosso projeto Supabase
//   LocalDB -> modo de demonstração (dados de exemplo guardados no browser)

const TABELAS_CHAVE = { mapeamento_nomes: ['tipo', 'original'], simbolos_equipas: ['chave'] };
const BUCKET = 'exportacoes-wyscout';

class SupaDB {
  constructor(url, chave) {
    this.modo = 'supabase';
    this.url = url;
    this.sb = window.supabase.createClient(url, chave);
  }
  _ok({ data, error }) {
    if (error) throw new Error(traduzErro(error.message || String(error)));
    return data;
  }
  async sessao() { return this._ok(await this.sb.auth.getSession()).session; }
  async entrar(email, password) { this._ok(await this.sb.auth.signInWithPassword({ email, password })); }
  async sair() { try { await cacheIdb.limpar(); } catch { /* sem cache */ } await this.sb.auth.signOut(); }
  async perfil() {
    const { user } = this._ok(await this.sb.auth.getUser());
    const p = this._ok(await this.sb.from('perfis').select('*').eq('id', user.id).maybeSingle());
    return p || { id: user.id, email: user.email, papel: 'equipa_tecnica' };
  }
  // Lê tudo, página a página (o Supabase devolve no máximo 1000 linhas por pedido).
  // opcoes: colunas (por omissão todas), desde (só o alterado a partir desta data), em ([coluna, valores]).
  async listar(tabela, ordem = 'created_at', { colunas = '*', desde = null, em = null } = {}) {
    if (em) {
      const [col, vals] = em; let out = [];
      for (let i = 0; i < vals.length; i += 150) out = out.concat(this._ok(await this.sb.from(tabela).select(colunas).in(col, vals.slice(i, i + 150))));
      return out;
    }
    const pagina = 1000; let todas = []; let de = 0;
    for (;;) {
      let q = this.sb.from(tabela).select(colunas);
      if (desde) q = q.gte('updated_at', desde);
      q = q.order(ordem, { ascending: true });
      if (ordem !== 'id' && !TABELAS_CHAVE[tabela]) q = q.order('id', { ascending: true });
      const linhas = this._ok(await q.range(de, de + pagina - 1));
      todas = todas.concat(linhas);
      if (linhas.length < pagina) return todas;
      de += pagina;
    }
  }
  async upsert(tabela, linhas, onConflict) {
    this.escrevi = Date.now();
    linhas = linhas.map(l => comEpoca(tabela, l));
    let out = [];
    for (let i = 0; i < linhas.length; i += 500) {
      const parte = linhas.slice(i, i + 500);
      out = out.concat(this._ok(await this.sb.from(tabela).upsert(parte, { onConflict: conflitoComEscalao(tabela, onConflict) }).select()));
    }
    return out;
  }
  async inserir(tabela, linha) { this.escrevi = Date.now(); return this._ok(await this.sb.from(tabela).insert(comEpoca(tabela, linha)).select().single()); }
  async inserirVarios(tabela, linhas) {
    this.escrevi = Date.now();
    linhas = linhas.map(l => comEpoca(tabela, l));
    let out = [];
    for (let i = 0; i < linhas.length; i += 500) out = out.concat(this._ok(await this.sb.from(tabela).insert(linhas.slice(i, i + 500)).select()));
    return out;
  }
  async atualizar(tabela, filtro, patch) { this.escrevi = Date.now(); return this._ok(await this.sb.from(tabela).update(patch).match(filtro).select()); }
  async apagar(tabela, filtro) { this.escrevi = Date.now(); this._ok(await this.sb.from(tabela).delete().match(filtro)); }
  async carregarFicheiro(ficheiro) {
    const nome = ficheiro.name.normalize('NFD').replace(/[^\w.-]+/g, '_');
    const caminho = `${new Date().toISOString().slice(0, 10)}/${Date.now()}-${nome}`;
    this._ok(await this.sb.storage.from(BUCKET).upload(caminho, ficheiro, { upsert: false }));
    return caminho;
  }
  // Arquivo do pré-jogo (bucket próprio).
  async arquivoGuardar(caminho, ficheiro) { this._ok(await this.sb.storage.from('arquivo').upload(caminho, ficheiro, { upsert: true, contentType: ficheiro.type || 'application/pdf' })); return caminho; }
  async arquivoUrl(caminho) { const r = this._ok(await this.sb.storage.from('arquivo').createSignedUrl(caminho, 3600)); return r.signedUrl; }
  async arquivoApagar(caminho) { this._ok(await this.sb.storage.from('arquivo').remove([caminho])); }
}

function traduzErro(msg) {
  if (/Invalid login credentials/i.test(msg)) return 'Email ou palavra-passe incorretos.';
  if (/Email not confirmed/i.test(msg)) return 'Este email ainda não foi confirmado. Confirme-o no Supabase (Authentication > Users).';
  if (/row-level security/i.test(msg)) return 'Sem permissão: só utilizadores do departamento podem alterar dados.';
  if (/Failed to fetch|NetworkError/i.test(msg)) return 'Não foi possível ligar ao Supabase. Verifique a internet e o URL do projeto.';
  if (/relation .* does not exist|Could not find the table/i.test(msg)) return 'As tabelas não existem. Corra o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/agenda|modelo_microciclo/i.test(msg) && /does not exist|Could not find/i.test(msg)) return 'Falta atualizar a base de dados para o calendário. Corra outra vez o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/column .*(tm_id|tm_url|nacionalidade)|'(tm_id|tm_url|nacionalidade)' column/i.test(msg)) return 'Falta atualizar a base de dados para o Transfermarkt. Corra outra vez o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/column .*epoca|'epoca' column|epoca.*does not exist|no unique or exclusion constraint/i.test(msg)) return 'Falta atualizar a base de dados para as épocas. Corra outra vez o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/scout_|simbolos_equipas|relatorio_equipa|tm_equipas|jogadores_adversarios|onzes|arquivo/i.test(msg) && /does not exist|Could not find|schema cache/i.test(msg)) return 'Falta atualizar a base de dados para esta opção. Corra outra vez o ficheiro schema.sql no Supabase (SQL Editor).';
  if (/Bucket not found/i.test(msg)) return 'O espaço de ficheiros não existe. Corra o ficheiro schema.sql no Supabase.';
  return msg;
}

class LocalDB {
  constructor() {
    this.modo = 'demo';
    this.dados = lsGet('analise_demo_v9') || null;
    if (!this.dados) { this.dados = gerarDemo(); this._guardar(); }
    for (const t of EPOCA_TABELAS) for (const r of this.dados[t] || []) r.epoca ||= epocaDaLinha(r);
  }
  _guardar() { lsSet('analise_demo_v9', this.dados); }
  _t(tabela) { return (this.dados[tabela] ||= []); }
  async sessao() { return { demo: true }; }
  async entrar() {}
  async sair() {}
  // Na demonstração dá para experimentar o papel de colaborador (localStorage analise_demo_papel = 'colaborador').
  async perfil() { let papel = 'departamento'; try { if (localStorage.getItem('analise_demo_papel') === 'colaborador') papel = 'colaborador'; } catch { /* sem armazenamento */ } return { id: 'demo', email: 'demonstracao@clube.pt', papel }; }
  async listar(tabela, ordem = 'created_at') {
    const l = this._t(tabela).map(r => structuredClone(r));
    return l.sort((a, b) => String(a[ordem] ?? '').localeCompare(String(b[ordem] ?? '')));
  }
  _completar(tabela, linha) {
    const agora = new Date().toISOString();
    const r = { ...comEpoca(tabela, linha) };
    if (!TABELAS_CHAVE[tabela] && !r.id) r.id = uuid();
    if (!('created_at' in r) && tabela !== 'configuracao' && !TABELAS_CHAVE[tabela]) r.created_at = agora;
    if (tabela.startsWith('estatisticas')) r.updated_at = agora;
    return r;
  }
  async upsert(tabela, linhas, onConflict) {
    const chaves = conflitoComEscalao(tabela, onConflict).split(',').map(s => s.trim());
    const t = this._t(tabela); const out = [];
    for (let linha of linhas) {
      linha = comEpoca(tabela, linha);
      const ex = t.find(r => chaves.every(k => (k === 'escalao' ? escalaoDaLinha(r) === escalaoDaLinha(linha) : String(r[k]) === String(linha[k]))));
      if (ex) { Object.assign(ex, linha); if (tabela.startsWith('estatisticas')) ex.updated_at = new Date().toISOString(); out.push(structuredClone(ex)); }
      else { const n = this._completar(tabela, linha); t.push(n); out.push(structuredClone(n)); }
    }
    this._guardar(); return out;
  }
  async inserir(tabela, linha) {
    const n = this._completar(tabela, linha); this._t(tabela).push(n); this._guardar(); return structuredClone(n);
  }
  async inserirVarios(tabela, linhas) { const t = this._t(tabela); const out = linhas.map(l => { const n = this._completar(tabela, l); t.push(n); return structuredClone(n); }); this._guardar(); return out; }
  async atualizar(tabela, filtro, patch) {
    const out = [];
    for (const r of this._t(tabela)) {
      if (Object.entries(filtro).every(([k, v]) => String(r[k]) === String(v))) { Object.assign(r, patch); out.push(structuredClone(r)); }
    }
    this._guardar(); return out;
  }
  async apagar(tabela, filtro) {
    const corresponde = r => Object.entries(filtro).every(([k, v]) => String(r[k]) === String(v));
    const apagados = this._t(tabela).filter(corresponde);
    this.dados[tabela] = this._t(tabela).filter(r => !corresponde(r));
    if (tabela === 'scout_jogadores') { const ids = new Set(apagados.map(r => r.id)); this.dados.scout_avaliacoes = this._t('scout_avaliacoes').filter(r => !ids.has(r.jogador_id)); }
    if (tabela === 'jogos') { // apagar em cascata, como no Supabase
      const ids = new Set(apagados.map(r => r.id));
      for (const t of ['estatisticas_equipa', 'estatisticas_jogador', 'eventos']) this.dados[t] = this._t(t).filter(r => !ids.has(r.jogo_id));
    }
    this._guardar();
  }
  async carregarFicheiro(f) { return `demonstracao/${f.name}`; }
  // Na demonstração os PDF do arquivo ficam só em memória (perdem-se ao recarregar a página).
  async arquivoGuardar(caminho, ficheiro) { (this.ficheiros ||= {})[caminho] = URL.createObjectURL(ficheiro); return caminho; }
  async arquivoUrl(caminho) { const u = this.ficheiros?.[caminho]; if (!u) throw new Error('Na demonstração o PDF só fica disponível até recarregar a página.'); return u; }
  async arquivoApagar(caminho) { if (this.ficheiros) delete this.ficheiros[caminho]; }
  repor() { this.dados = gerarDemo(); this._guardar(); }
}

// ---------- Dados de demonstração (fictícios) ----------
function gerarDemo() {
  let semente = 20261110;
  const rnd = () => { semente = (semente * 1664525 + 1013904223) % 4294967296; return semente / 4294967296; };
  const entre = (a, b) => a + rnd() * (b - a);
  const inteiro = (a, b) => Math.floor(entre(a, b + 1));
  const escolher = arr => arr[Math.floor(rnd() * arr.length)];
  const r1 = n => Math.round(n * 10) / 10;
  const r2 = n => Math.round(n * 100) / 100;

  const clube = 'SCUT';
  const adversarios = ['Estrela da Serra', 'União de Vale Verde', 'Atlético Costa Norte', 'SC Planície', 'Académico do Rio',
    'Desportivo da Barra', 'GD Alvorada', 'Naval do Sul', 'FC Montalvo', 'Juventude Lezíria', 'Os Mareantes', 'SC Penedo', 'Grupo Recreativo Tojal', 'AD Cabeço'];
  const plantel = [
    ['Rui Calado', 'GR'], ['Tiago Mendes', 'DD'], ['Bruno Faria', 'DC'], ['Hugo Teles', 'DC'], ['Diogo Lapa', 'DE'],
    ['Nuno Brito', 'MDC'], ['André Sousa', 'MC'], ['Filipe Rocha', 'MC'], ['Luís Pinho', 'ED'], ['Gonçalo Reis', 'EE'],
    ['Marco Viana', 'PL'], ['Pedro Lobo', 'PL'], ['Ivo Serrão', 'MC'], ['Sérgio Neto', 'DC'], ['Ricardo Gaio', 'ED'], ['Vasco Leal', 'DD']];

  const dados = {
    configuracao: [{ id: 1, nome_clube: clube, nomes_alternativos: ['Torreense', 'SC União Torreense'], metricas_chave: [], criterios: {}, updated_at: new Date().toISOString() }],
    jogos: [], estatisticas_equipa: [], estatisticas_jogador: [], eventos: [], importacoes: [], mapeamento_nomes: [
      { tipo: 'equipa', original: 'G.D. Alvorada', normalizado: 'GD Alvorada' }]
  };

  // Plantel (dados fictícios)
  const POS_LONGA = { GR: 'Guarda-redes', DD: 'Lateral direito', DE: 'Lateral esquerdo', DC: 'Defesa central', MDC: 'Médio defensivo', MC: 'Médio centro', ED: 'Extremo direito', EE: 'Extremo esquerdo', PL: 'Ponta de lança' };
  const ALTURA = { GR: 191, DC: 186, DD: 177, DE: 178, MDC: 183, MC: 178, ED: 174, EE: 175, PL: 184 };
  const numeros = [1, 2, 4, 5, 3, 6, 8, 10, 7, 11, 9, 19, 14, 15, 17, 22];
  dados.jogadores = [...plantel, ['Tomás Arruda', 'GR'], ['Rafael Couto', 'DC']].map(([nome, pos], i) => ({
    id: uuid(), nome, numero: numeros[i] ?? 30 + i, posicao: POS_LONGA[pos],
    data_nascimento: `${1993 + (i * 7) % 12}-${String(1 + (i * 5) % 12).padStart(2, '0')}-${String(3 + (i * 11) % 25).padStart(2, '0')}`,
    altura: ALTURA[pos] + ((i * 3) % 7) - 3, pe: ['DE', 'EE'].includes(pos) || i === 7 ? 'Esquerdo' : i === 12 ? 'Ambos' : 'Direito',
    nome_wyscout: i < plantel.length ? nome : null, foto: null, notas: null, created_at: new Date().toISOString()
  }));

  // Métricas de uma equipa num jogo, com os nomes das colunas do ficheiro da liga.
  const metricasLiga = (xg, golos, f) => {
    const remates = Math.max(golos + 1, inteiro(Math.round(7 * f), Math.round(15 * f)));
    const enq = inteiro(Math.max(golos, Math.round(remates * 0.25)), Math.max(golos, Math.round(remates * 0.45)));
    const passes = inteiro(Math.round(300 * f), Math.round(460 * f)); const certos = Math.round(passes * entre(0.72, 0.86));
    const cruz = inteiro(9, 22); const cruzC = Math.round(cruz * entre(0.22, 0.4));
    const dd = inteiro(30, 55), dda = inteiro(14, 32), dof = inteiro(28, 50);
    const pc = inteiro(8, 30), pm = inteiro(30, 55), pl = inteiro(35, 70);
    const rc = inteiro(22, 48), rm = inteiro(22, 45), rl = Math.round(entre(5, 16) * f);
    const ap = inteiro(Math.round(18 * f), Math.round(34 * f)), apR = Math.round(ap * entre(0.18, 0.4) * Math.sqrt(f));
    const ca = inteiro(1, 7), caR = Math.round(ca * entre(0, 0.6)), bp = inteiro(4, 12), bpR = Math.round(bp * entre(0.15, 0.45));
    const ent = Math.round(entre(14, 30) * f), entC = Math.round(ent * entre(0.3, 0.55));
    const tf = Math.round(entre(45, 80) * f), prog = Math.round(entre(60, 95) * f);
    const pct = (a, b) => (b ? r1(a / b * 100) : 0);
    return {
      'Golos esperados': xg, 'Remates': remates, 'Remates à baliza': enq, '% Remates à baliza': pct(enq, remates),
      'Passes': passes, 'Passes certos': certos, '% Passes certos': pct(certos, passes), 'Posse': 50,
      'Perdas': pc + pm + pl, 'Perdas curto': pc, 'Perdas médio': pm, 'Perdas longo': pl,
      'Recuperações': rc + rm + rl, 'Recuperações curto': rc, 'Recuperações médio': rm, 'Recuperações longo': rl,
      'Ataques posicionais': ap, 'Ataques posicionais com remates': apR, '% Ataques posicionais com remates': pct(apR, ap),
      'Contra-ataques': ca, 'Contra-ataques com remates': caR, '% Contra-ataques com remates': pct(caR, ca),
      'Bolas paradas': bp, 'Bolas paradas com remates': bpR, '% Bolas paradas com remates': pct(bpR, bp), 'Cantos': inteiro(2, 9),
      'Cruzamentos': cruz, 'Cruzamentos certos': cruzC, '% Cruzamentos certos': pct(cruzC, cruz),
      'Passes em profundidade recebidos': Math.round(entre(2, 9) * f), 'Entradas na grande área': ent, 'Entradas na grande área corridas': ent - entC, 'Entradas na grande área cruzamentos': entC,
      'Toques na área': Math.round(entre(10, 24) * f),
      'Duelos defensivos': dd, 'Duelos defensivos ganhos': Math.round(dd * entre(0.55, 0.72)), '% Duelos defensivos ganhos': 0,
      'Duelos aéreos': dda, 'Duelos aéreos ganhos': Math.round(dda * entre(0.38, 0.62)), '% Duelos aéreos ganhos': 0,
      'Duelos ofensivos': dof, 'Interseções': inteiro(28, 52), 'Alívios': inteiro(10, 30), 'Faltas': inteiro(8, 18),
      'Passes para terço final': Math.round(tf * 1.4), 'Passes para terço final certos': tf, 'Passes progressivos': Math.round(prog * 1.3), 'Passes progressivos precisos': prog,
      'Intensidade de jogo': r2(entre(14.5, 18) * Math.sqrt(f)), 'Média de passes por posse': r2(entre(2.6, 4.4) * f), '% de passe longo': r2(entre(7, 17) / f), 'PPDA': r2(entre(7, 14) / f)
    };
  };
  // Completa os valores que dependem do adversário (posse, remates e xG sofridos).
  const parMetricas = (a, b) => {
    for (const m of [a, b]) for (const k of ['Duelos defensivos', 'Duelos aéreos']) m[`% ${k} ganhos`] = m[k] ? r1(m[`${k} ganhos`] / m[k] * 100) : 0;
    a['Posse'] = r2(a['Passes'] / (a['Passes'] + b['Passes']) * 100); b['Posse'] = r2(100 - a['Posse']);
    for (const [x, y] of [[a, b], [b, a]]) { x['xG Sofrido'] = y['Golos esperados']; x['Remates contra'] = y['Remates']; x['Remates contra no alvo'] = y['Remates à baliza']; }
    return [a, b];
  };
  const forca = Object.fromEntries(adversarios.map((a, i) => [a, 0.8 + ((i * 7) % 11) / 22]));
  dados.estatisticas_liga = [];
  const linhaLiga = (jornada, equipa, adversario, local, golos, sofridos, metricas, data) => {
    const m = { ...metricas };
    dados.estatisticas_liga.push({ id: uuid(), competicao: 'Liga', jornada, equipa, adversario, local, golos, golos_sofridos: sofridos, metricas: m, updated_at: data });
  };

  const inicio = new Date(Date.UTC(2026, 7, 9));
  adversarios.forEach((adv, i) => {
    const d = new Date(inicio.getTime() + i * 7 * 86400000);
    const data = d.toISOString().slice(0, 10);
    const local = i % 2 === 0 ? 'casa' : 'fora';
    const forma = 1 + 0.25 * Math.sin(i / 2.2) + (local === 'casa' ? 0.1 : -0.05);
    const xgN = r2(Math.max(0.3, entre(0.8, 2.0) * forma));
    const xgA = r2(Math.max(0.2, entre(0.5, 1.6) / forma));
    const gm = Math.max(0, Math.round(xgN + entre(-1, 1.1)));
    const gs = Math.max(0, Math.round(xgA + entre(-0.9, 0.9)));
    const id = uuid();
    dados.jogos.push({ id, data, adversario: adv, competicao: i === 6 ? 'Taça' : 'Liga', local, golos_marcados: gm, golos_sofridos: gs, notas: null, created_at: new Date().toISOString() });

    const [mN, mA] = parMetricas(metricasLiga(xgN, gm, forma), metricasLiga(xgA, gs, 1 / forma));
    dados.estatisticas_equipa.push({ id: uuid(), jogo_id: id, lado: 'nos', equipa: clube, metricas: mN, importacao_id: null, updated_at: data });
    dados.estatisticas_equipa.push({ id: uuid(), jogo_id: id, lado: 'adversario', equipa: adv, metricas: mA, importacao_id: null, updated_at: data });

    // Jogadores
    const titulares = plantel.slice(0, 11).map(p => [...p, 90]);
    const suplentes = plantel.slice(11).sort(() => rnd() - 0.5).slice(0, 3).map(p => [...p, inteiro(10, 35)]);
    if (i === 4) titulares[10][2] = 0; // lesionado
    const atacantes = ['PL', 'ED', 'EE', 'MC'];
    let golosPorDar = gm;
    [...titulares, ...suplentes].filter(p => p[2] > 0).forEach(([nome, pos, min]) => {
      const peso = (pos === 'PL' ? 3 : pos === 'ED' || pos === 'EE' ? 2 : pos.startsWith('M') ? 1 : 0.3) * min / 90;
      const xg = r2(xgN * peso / 9 * entre(0.5, 1.5));
      const g = golosPorDar > 0 && atacantes.includes(pos) && rnd() < 0.5 ? 1 : 0; golosPorDar -= g;
      const passes = inteiro(pos === 'PL' ? 12 : 25, pos.startsWith('M') ? 70 : 50) * min / 90;
      dados.estatisticas_jogador.push({
        id: uuid(), jogo_id: id, jogador: nome, lado: 'nos', equipa: clube, posicao: pos, minutos: min, importacao_id: null, updated_at: data,
        metricas: (() => {
          const k = min / 90; const n = (a, b) => Math.round(entre(a, b) * k);
          const def = pos.startsWith('D') || pos === 'GR', med = pos.startsWith('M'), ata = ['PL', 'ED', 'EE'].includes(pos), lat = ['DD', 'DE'].includes(pos);
          const pas = n(pos === 'PL' ? 14 : 30, med || pos === 'DC' ? 65 : 45), pasC = Math.round(pas * entre(0.72, 0.9));
          const fr = Math.round(pas * entre(0.25, 0.4)), lg = n(pos === 'DC' || pos === 'GR' ? 4 : 1, pos === 'DC' || pos === 'GR' ? 10 : 4), tf = n(med || lat ? 4 : 1, med || lat ? 11 : 4);
          const dd = n(def ? 6 : 2, def ? 12 : 6), dof = n(ata ? 6 : 1, ata ? 14 : 4), du = dd + dof + n(3, 8), bl = n(2, 6);
          const rem = Math.round(xg * entre(5, 9)) + (ata ? n(0, 2) : 0), dr = n(ata || lat ? 2 : 0, ata || lat ? 7 : 2), cr = n(lat || ata ? 2 : 0, lat || ata ? 7 : 1), perdas = n(6, ata ? 18 : 12);
          return {
            'Golos': g, 'Assistências': g && rnd() < 0.6 ? 0 : (rnd() < 0.1 ? 1 : 0), 'xG': xg, 'xA': r2(xgN * entre(0, 0.15)),

// A biblioteca do Excel (~1 MB) só é descarregada quando é precisa (importações), não ao abrir a app.
async function lerFolha(buffer) {
  if (!window.XLSX) await carregarScript(['XLSX', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']);
  const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' })
    .filter(r => r.some(c => String(c).trim() !== ''));
}

function detetarCabecalho(linhas) {
  const reTodos = Object.values(PAPEIS).map(p => p.re);
  for (let i = 0; i < Math.min(15, linhas.length); i++) {
    const textos = linhas[i].filter(c => typeof c === 'string' && c.trim() && parseNum(c) === null);
    if (textos.length >= 3 && textos.some(t => reTodos.some(re => re.test(t.trim())))) return i;
  }
  return 0;
}

function nomesColunas(cabecalho, largura) {
  const nomes = []; const brutos = [];
  for (let i = 0; i < largura; i++) brutos.push(String(cabecalho[i] ?? '').replace(/\s+/g, ' ').trim());
  let i = 0;
  while (i < largura) {
    const base = brutos[i];
    if (!base) { nomes.push(`Coluna ${i + 1}`); i++; continue; }
    let n = 0; while (i + 1 + n < largura && !brutos[i + 1 + n]) n++;
    const partes = base.split(/\s*\/\s*/);
    if (n === 0) nomes.push(base);
    else if (partes.length > 1) {
      nomes.push(partes[0], base);
      for (let k = 2; k <= n; k++) nomes.push(k === 2 ? `${base} %` : `${base} (${k})`);
    } else {
      nomes.push(base);
      for (let k = 1; k <= n; k++) nomes.push(`${base} (${k + 1})`);
    }
    i += n + 1;
  }
  // Nomes repetidos ficam com sufixo.
  const vistos = {};
  return nomes.map(nm => { vistos[nm] = (vistos[nm] || 0) + 1; return vistos[nm] > 1 ? `${nm} (${vistos[nm]})` : nm; });
}

// Nomes das métricas do Team stats no formato antigo da importação ("Remates / à baliza", "Posse, %", "Perdas / curto/ médio / longo (3)"…)
// -> o mesmo nome do ficheiro da liga / Team stats ("Remates à baliza", "Posse", "Perdas longo"…), para tudo se comparar.
const CANON_FIXOS = { 'posse, %': 'Posse', 'interseções,': 'Interseções', 'comprimento médio de passes': 'Comprimento médio de passe' };
function canonMetrica(k) {
  const t = String(k).replace(/\s+/g, ' ').trim(); const lo = t.toLowerCase();
  if (CANON_FIXOS[lo]) return CANON_FIXOS[lo];
  // Grupos de 4 colunas: total, curto, médio, longo.
  let m = t.match(/^(Perdas|Recuperações) \/ curto\s*\/\s*médio \/ longo( %| \(3\))?$/i);
  if (m) return `${m[1]} ${!m[2] ? 'curto' : m[2].trim() === '%' ? 'médio' : 'longo'}`;
  // Entradas na grande área (corridas/cruzamentos): total, corridas, cruzamentos.
  m = t.match(/^Entradas na grande área \(corridas(\/cruzamentos\))?( %)?$/i);
  if (m) return !m[1] ? 'Entradas na grande área' : m[2] ? 'Entradas na grande área cruzamentos' : 'Entradas na grande área corridas';
  // "A / B %" -> "% A B"; "A / B" -> "A B"
  m = t.match(/^(.+?)\s*\/\s*(.+?)( %)?$/);
  if (m && !/\//.test(m[2])) return m[3] ? `% ${m[1]} ${m[2]}` : `${m[1]} ${m[2]}`;
  return t;
}
// Aplica aos registos já guardados; usa a grafia que já existe noutros dados (liga / Team stats) quando só muda maiúsculas.
function canonMetricas(met, grafias) {
  if (!met) return met;
  let mudou = false; const out = {};
  for (const [k, v] of Object.entries(met)) {
    if (k.startsWith('_')) { out[k] = v; continue; }
    let c = canonMetrica(k); c = grafias?.get(c.toLowerCase()) || c;
    if (c !== k) mudou = true;
    if (!(c in out) || c === k) out[c] = v;
  }
  return mudou ? out : met;
}

// Prepara a tabela: nomes de colunas, linhas de dados, papéis detetados e colunas numéricas.
function prepararTabela(linhas, papeisPossiveis) {
  const ih = detetarCabecalho(linhas);
  const largura = Math.max(...linhas.map(r => r.length));
  const colunas = nomesColunas(linhas[ih] || [], largura);
  const dadosLinhas = linhas.slice(ih + 1);
  const papeis = {};
  for (const p of papeisPossiveis) {
    const idx = colunas.findIndex((c, i) => PAPEIS[p].re.test(c) && !Object.values(papeis).includes(i));
    papeis[p] = idx >= 0 ? idx : null;
  }
  const numericas = colunas.map((_, ci) => {
    const vals = dadosLinhas.map(r => r[ci]).filter(v => v !== '' && v !== null && v !== undefined);
    if (!vals.length) return false;
    return vals.filter(v => !(v instanceof Date) && parseNum(v) !== null).length / vals.length >= 0.6;
  });
  return { colunas, linhas: dadosLinhas, papeis, numericas };
}

function colunasMetricas(tab) {
  const usadas = new Set(Object.values(tab.papeis).filter(v => v !== null));
  const ignorar = /^(duration|dura[cç][aã]o|age|idade|height|altura|weight|peso|market value|valor de mercado|contract expires|n\.?º|number|#)$/i;
  return tab.colunas.map((c, i) => i).filter(i => tab.numericas[i] && !usadas.has(i) && !ignorar.test(tab.colunas[i]));
}

function lerMetricas(tab, linha) {
  const m = {};
  for (const i of colunasMetricas(tab)) {
    const n = parseNum(linha[i]);
    if (n !== null) m[canonMetrica(tab.colunas[i])] = n;
  }
  if (tab.papeis.golos !== null && tab.papeis.golos !== undefined) {
    const g = parseNum(linha[tab.papeis.golos]); if (g !== null) m['Goals'] = g;
  }
  if (tab.papeis.esquema !== null && tab.papeis.esquema !== undefined && linha[tab.papeis.esquema]) m._esquema = String(linha[tab.papeis.esquema]);
  return m;
}

// "Casa - Fora 2:1" -> { casa, fora, gc, gf }
function lerTextoJogo(txt) {
  const s = String(txt ?? '').trim();
  let m = s.match(/^(.+?)\s+[-–]\s+(.+?)\s+(\d+)\s*[:\-–]\s*(\d+)\s*(\(.*\))?$/);
  if (m) return { casa: m[1].trim(), fora: m[2].trim(), gc: Number(m[3]), gf: Number(m[4]) };
  m = s.match(/^(.+?)\s+[-–]\s+(.+)$/);
  if (m) return { casa: m[1].trim(), fora: m[2].trim(), gc: null, gf: null };
  return null;
}

function criarIdentificador(cfg, mapeamentos) {
  const proprios = [cfg.nome_clube, ...(cfg.nomes_alternativos || [])].map(norm).filter(Boolean);
  const mapa = {};
  for (const m of mapeamentos) mapa[`${m.tipo}|${norm(m.original)}`] = m.normalizado;
  return {
    // "Torreense U23" / "Torreense Sub-23" também é a vossa equipa (os dados já vêm separados por escalão).
    eNos: nome => { const n = norm(mapa[`equipa|${norm(nome)}`] || nome).replace(/\s+(u\s?23|sub\s?23|u\s?21|sub\s?21|b)$/, ''); return !!n && proprios.some(p => n === p); },
    equipa: nome => mapa[`equipa|${norm(nome)}`] || String(nome ?? '').trim(),
    jogador: nome => mapa[`jogador|${norm(nome)}`] || String(nome ?? '').trim(),
    temClube: proprios.length > 0
  };
}

// ---- Estatísticas de equipa: uma linha por equipa e por jogo ----
function analisarEquipa(tab, cfg, mapeamentos, jogosExistentes) {
  const id = criarIdentificador(cfg, mapeamentos);
  const P = tab.papeis; const avisos = [];
  if (!id.temClube) avisos.push('Defina o nome do clube em Definições para identificar as linhas da vossa equipa.');
  if (P.data === null) avisos.push('Não encontrei a coluna da data. Escolha-a acima.');
  if (P.equipa === null && P.jogo === null) avisos.push('Escolha a coluna da equipa ou do jogo.');
  if (avisos.length) return { jogos: [], avisos, ignoradas: 0 };

  const grupos = new Map(); let ignoradas = 0;
  for (const linha of tab.linhas) {
    const data = parseData(linha[P.data]);
    if (!data) { ignoradas++; continue; }
    const txt = P.jogo !== null ? String(linha[P.jogo] ?? '').trim() : '';
    const chave = `${data}|${txt}`;
    if (!grupos.has(chave)) grupos.set(chave, { data, txt, competicao: P.competicao !== null ? String(linha[P.competicao] ?? '').trim() : '', linhas: [] });
    grupos.get(chave).linhas.push(linha);
  }

  const existentes = new Set(jogosExistentes.map(j => `${j.data}|${norm(j.adversario)}`));
  const porChave = new Map();
  for (const g of grupos.values()) {
    const tj = lerTextoJogo(g.txt);
    let linhaNos = null, linhaAdv = null;
    for (const l of g.linhas) {
      const eq = P.equipa !== null ? l[P.equipa] : null;
      if (eq && id.eNos(eq)) linhaNos = linhaNos || l; else linhaAdv = linhaAdv || l;
    }
    if (P.equipa === null) { linhaNos = g.linhas[0]; linhaAdv = g.linhas[1] || null; }
    let local = null, gm = null, gs = null, adversario = null;
    if (tj) {
      if (id.eNos(tj.casa)) { local = 'casa'; adversario = id.equipa(tj.fora); gm = tj.gc; gs = tj.gf; }
      else if (id.eNos(tj.fora)) { local = 'fora'; adversario = id.equipa(tj.casa); gm = tj.gf; gs = tj.gc; }
    }
    if (!linhaNos && P.equipa !== null) {
      avisos.push(`${fmtData(g.data)} — ${g.txt || 'jogo sem descrição'}: a vossa equipa não aparece. Confirme o nome do clube em Definições.`);
      continue;
    }
    if (!adversario && linhaAdv && P.equipa !== null) adversario = id.equipa(linhaAdv[P.equipa]);
    if (!adversario) { avisos.push(`${fmtData(g.data)}: não consegui identificar o adversário.`); continue; }
    const mN = lerMetricas(tab, linhaNos);
    const mA = linhaAdv ? lerMetricas(tab, linhaAdv) : null;
    if (gm === null && Number.isFinite(mN['Goals'])) gm = mN['Goals'];
    if (gs === null && mA && Number.isFinite(mA['Goals'])) gs = mA['Goals'];
    const j = {
      data: g.data, adversario, competicao: g.competicao || null, local, golos_marcados: gm, golos_sofridos: gs,
      equipaNos: P.equipa !== null ? String(linhaNos[P.equipa]) : cfg.nome_clube,
      equipaAdv: linhaAdv && P.equipa !== null ? String(linhaAdv[P.equipa]) : adversario,
      metricasNos: mN, metricasAdv: mA,
      existe: existentes.has(`${g.data}|${norm(adversario)}`)
    };
    porChave.set(`${j.data}|${norm(j.adversario)}`, j); // ficheiros com o mesmo jogo repetido: fica o último
  }
  const jogos = [...porChave.values()].sort((a, b) => a.data.localeCompare(b.data));
  return { jogos, avisos, ignoradas, nMetricas: colunasMetricas(tab).length };
}

// ---- Estatísticas de jogadores ----
// opcoes: { jogoId, ladoPadrao }  (jogoId é usado quando o ficheiro não tem data)
// Compara nomes de equipas escritos de formas diferentes ("Benfica II" / "Benfica B", "UD Leiria" / "União Leiria").
function chaveEquipa(nome) {
  return norm(nome).replace(/\b(fc|sc|cd|ud|ad|gd|cf|sl|cp|sad|futebol|clube|club|sport|uniao|de|da|do|dos|das)\b/g, ' ')
    .replace(/\b(ii|sub 23|u23)\b/g, 'b').replace(/\s+/g, ' ').trim();
}
function mesmaEquipa(a, b) {
  const x = chaveEquipa(a), y = chaveEquipa(b);
  if (!x || !y) return false;
  const px = x.split(' '), py = y.split(' ');
  // Uma equipa B nunca é a equipa principal ("Benfica B" ≠ "Benfica").
  if (px.includes('b') !== py.includes('b')) return false;
  if (x === y || x.startsWith(y + ' ') || y.startsWith(x + ' ')) return true;
  if (px.includes('b') && px[0] === py[0] && px[0].length > 3) return true; // "Sporting B" / "Sporting CP B"
  return px[0] === py[0] && px[0].length > 3 && (px.length === 1 || py.length === 1) && !px.includes('b') && !py.includes('b');
}
// Início da época (1 de julho) de uma data 'YYYY-MM-DD'.
function inicioEpoca(d) { const [y, m] = d.split('-').map(Number); return `${m >= 7 ? y : y - 1}-07-01`; }

// opcoes: { jogoId, ladoPadrao, jogador (quando o ficheiro é de um só jogador), criarJogos }
function analisarJogadores(tab, cfg, mapeamentos, jogos, opcoes) {
  const id = criarIdentificador(cfg, mapeamentos);
  const P = tab.papeis; const avisos = [];
  const tem = k => P[k] !== null && P[k] !== undefined;
  const umJogador = !tem('jogador');
  if (umJogador && !opcoes.jogador) return { linhas: [], avisos: ['Indique de que jogador é este ficheiro.'], ignoradas: 0, umJogador };
  const nossos = [cfg.nome_clube, ...(cfg.nomes_alternativos || [])].filter(Boolean);
  const eNos = nome => id.eNos(nome) || nossos.some(n => mesmaEquipa(n, nome));

  // Ficheiros com a coluna do jogo ("Casa - Fora 1:0"): só contam os jogos da vossa equipa, na época mais recente.
  const datas = tem('data') ? tab.linhas.map(l => parseData(l[P.data])).filter(Boolean) : [];
  let epoca = null;
  if (tem('jogo') && datas.length) {
    const dosNossos = tab.linhas.filter(l => { const t = lerTextoJogo(l[P.jogo]); return t && (eNos(t.casa) || eNos(t.fora)); }).map(l => parseData(l[P.data])).filter(Boolean).sort();
    if (dosNossos.length) epoca = inicioEpoca(dosNossos[dosNossos.length - 1]);
  }

  const porData = {}; for (const j of jogos) if (j.data) (porData[j.data] ||= []).push(j);
  const usados = new Set(); const novos = new Map();
  const resultado = new Map(); let ignoradas = 0, outrosClubes = 0, epocasAnteriores = 0; const datasSemJogo = new Set();
  for (const linha of tab.linhas) {
    const bruto = umJogador ? opcoes.jogador : String(linha[P.jogador] ?? '').trim();
    if (!bruto || /^(total|totais|m[eé]dia|average|sum)\b/i.test(bruto)) { ignoradas++; continue; }
    const d = tem('data') ? parseData(linha[P.data]) : null;
    let jogo = null, novoJogo = null, atualizaData = false, resultadoNovo = null;
    if (tem('jogo')) {
      const t = lerTextoJogo(linha[P.jogo]);
      if (!t) { ignoradas++; continue; }
      const casa = eNos(t.casa), fora = eNos(t.fora);
      if (!casa && !fora) { outrosClubes++; continue; }
      if (epoca && d && d < epoca) { epocasAnteriores++; continue; }
      const adv = casa ? t.fora : t.casa, local = casa ? 'casa' : 'fora';
      const gm = casa ? t.gc : t.gf, gs = casa ? t.gf : t.gc;
      // 1) mesma data e adversário; 2) jogo sem data com o mesmo adversário e local (de preferência com o mesmo resultado)
      jogo = (d ? (porData[d] || []) : []).find(j => mesmaEquipa(j.adversario, adv)) || null;
      if (!jogo) {
        let cand = jogos.filter(j => !j.data && !usados.has(j.id) && mesmaEquipa(j.adversario, adv) && (!j.local || j.local === local));
        const mesmoRes = cand.filter(j => j.golos_marcados === gm && j.golos_sofridos === gs);
        if (mesmoRes.length) cand = mesmoRes;
        const exato = cand.filter(j => chaveEquipa(j.adversario) === chaveEquipa(adv));
        if (exato.length === 1) cand = exato;
        if (cand.length === 1) { jogo = cand[0]; atualizaData = !!d; }
      }
      // Jogo ainda sem resultado (ex.: "por jogar" no ficheiro da liga): fica com o resultado deste ficheiro.
      if (jogo && !Number.isFinite(jogo.golos_marcados) && Number.isFinite(gm)) resultadoNovo = { golos_marcados: gm, golos_sofridos: gs };
      if (jogo) usados.add(jogo.id);
      else if (d && opcoes.criarJogos !== false) {
        const k = `${d}|${norm(adv)}`;
        if (!novos.has(k)) novos.set(k, { data: d, adversario: id.equipa(adv), competicao: tem('competicao') ? String(linha[P.competicao] ?? '').trim() || null : null, local, golos_marcados: gm, golos_sofridos: gs, novo: true });
        novoJogo = novos.get(k);
      } else { ignoradas++; continue; }
    } else if (tem('data')) {
      const cand = d ? porData[d] || [] : [];
      if (cand.length === 1) jogo = cand[0];
      else if (d) datasSemJogo.add(d);
    } else if (opcoes.jogoId) jogo = jogos.find(j => j.id === opcoes.jogoId);
    if (!jogo && !novoJogo) { ignoradas++; continue; }
    let lado = opcoes.ladoPadrao || 'nos'; let equipa = null;
    if (tem('equipa') && linha[P.equipa]) { equipa = String(linha[P.equipa]).trim(); lado = eNos(equipa) ? 'nos' : 'adversario'; }
    if (tem('jogo') && !tem('equipa')) lado = 'nos';
    const alvo = jogo || novoJogo;
    const reg = {
      jogo_id: jogo ? jogo.id : null, jogo: alvo, novoJogo, atualizaData: atualizaData ? d : null, resultadoNovo,
      jogador: umJogador ? bruto : id.jogador(bruto), lado, equipa: equipa || (lado === 'nos' ? cfg.nome_clube : alvo.adversario),
      posicao: tem('posicao') ? String(linha[P.posicao] ?? '').trim() || null : null,
      minutos: tem('minutos') ? parseNum(linha[P.minutos]) : null, metricas: lerMetricas(tab, linha)
    };
    resultado.set(`${jogo ? jogo.id : `novo|${novoJogo.data}|${novoJogo.adversario}`}|${reg.jogador}|${reg.lado}`, reg);
  }
  if (!tem('data') && !tem('jogo') && !opcoes.jogoId) avisos.push('O ficheiro não tem data: escolha o jogo a que pertence.');
  for (const d of datasSemJogo) avisos.push(`Não há um jogo único registado a ${fmtData(d)}. Importe primeiro as estatísticas de equipa ou crie o jogo em Jogos.`);
  return { linhas: [...resultado.values()], avisos, ignoradas, outrosClubes, epocasAnteriores, epoca, umJogador, nNovos: novos.size, nMetricas: colunasMetricas(tab).length };
}

// ---------- Ficheiros CSV (separador ; ou , e decimais com vírgula) ----------
// Lidos à mão: o leitor de Excel interpreta "1,27" como 127 e nem sempre deteta o ";".
function lerCsv(texto) {
  texto = texto.replace(/^﻿/, '');
  const primeira = texto.split(/\r?\n/, 1)[0];
  const sep = [';', '\t', ','].map(c => [c, primeira.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = []; let linha = [], campo = '', aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false;
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = '';
    } else campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.map(l => l.map(x => x.trim())).filter(l => l.some(x => x !== ''));
}

async function lerFicheiroTabela(f) {
  if (/\.(csv|txt|tsv)$/i.test(f.name)) {
    const buf = await f.arrayBuffer();
    let texto = new TextDecoder('utf-8').decode(buf);
    if (texto.includes(String.fromCharCode(0xFFFD))) texto = new TextDecoder('windows-1252').decode(buf); // ficheiros gravados pelo Excel em Windows
    return lerCsv(texto);
  }
  return lerFolha(await f.arrayBuffer());
}

// ---------- Ficheiro da liga: uma linha por equipa e por jornada, sem datas ----------
const COLS_LIGA = {
  competicao: /^competi[cç][aã]o$|^competition$/i, jornada: /^(j|jornada|round|matchday)$/i, equipa: /^(equipa|team)$/i,
  adversario: /^(advers[aá]rio|opponent)$/i, local: /^(local|venue|casa\/fora)$/i, resultado: /^(resultados?|result|score)$/i,
  golos: /^(golos|goals)$/i, golos_sofridos: /^(golos sofridos|goals conceded|goals against)$/i
};

// Devolve a tabela preparada se o ficheiro tiver o formato da liga; senão null.
function detetarFormatoLiga(linhas) {
  const cab = (linhas[0] || []).map(c => String(c).replace(/\s+/g, ' ').trim());
  const idx = Object.fromEntries(Object.entries(COLS_LIGA).map(([k, re]) => [k, cab.findIndex(c => re.test(c))]));
  // Se houver várias colunas "J"/"Jornada", prefere a numérica.
  const candidatasJ = cab.map((c, i) => i).filter(i => COLS_LIGA.jornada.test(cab[i]));
  const numerica = candidatasJ.find(i => linhas.slice(1, 6).every(l => parseNum(l[i]) !== null || String(l[i] ?? '').trim() === ''));
  if (numerica !== undefined) idx.jornada = numerica;
  const temData = cab.some(c => PAPEIS.data.re.test(c));
  if (temData || idx.equipa < 0 || idx.adversario < 0 || idx.jornada < 0) return null;
  const papeis = new Set(Object.values(idx).filter(i => i >= 0));
  candidatasJ.forEach(i => papeis.add(i));
  const dados = linhas.slice(1);
  const metricas = cab.map((c, i) => i).filter(i => !papeis.has(i) && cab[i] &&
    dados.some(l => parseNum(l[i]) !== null) && dados.every(l => String(l[i] ?? '').trim() === '' || parseNum(l[i]) !== null));
  const equipas = [...new Set(dados.map(l => String(l[idx.equipa] ?? '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));
  return { formato: 'liga', cab, idx, metricas, linhas: dados, equipas };
}

// equipaNossa: nome da equipa no ficheiro (escolhido pelo utilizador ou detetado pelas Definições).
function analisarLiga(tab, cfg, mapeamentos, jogosExistentes, equipaNossa) {
  const id = criarIdentificador(cfg, mapeamentos);
  const I = tab.idx; const avisos = [];
  const nossa = equipaNossa || tab.equipas.find(e => id.eNos(e)) || null;
  const liga = [], jogos = [], porJogar = [];
  const existentes = {};
  for (const j of jogosExistentes) existentes[`${norm(j.competicao)}|${j.jornada}|${norm(j.adversario)}`] = j;
  const val = (l, k) => (I[k] >= 0 ? l[I[k]] : null);
  const registo = l => {
    const metricas = {};
    for (const i of tab.metricas) { const n = parseNum(l[i]); if (n !== null) metricas[tab.cab[i]] = n; }
    return metricas;
  };
  // Equipa + adversário: aguenta jogos em atraso registados na mesma jornada.
  const chave = (comp, jor, eq, adv) => `${norm(comp)}|${jor}|${norm(eq)}|${norm(adv)}`;
  const porEquipa = {};
  let ignoradas = 0;
  for (const l of tab.linhas) {
    const jornada = parseNum(val(l, 'jornada')); const equipa = String(val(l, 'equipa') ?? '').trim();
    if (jornada === null || !equipa) { ignoradas++; continue; }
    const competicao = String(val(l, 'competicao') ?? '').trim() || 'Liga';
    const advFicheiro = String(val(l, 'adversario') ?? '').trim();
    const metricas = registo(l);
    const r = {
      competicao, jornada, equipa: id.equipa(equipa), equipaFicheiro: equipa, adversario: id.equipa(advFicheiro), adversarioFicheiro: advFicheiro,
      local: /^casa|^home/i.test(String(val(l, 'local') ?? '')) ? 'casa' : /^fora|^away/i.test(String(val(l, 'local') ?? '')) ? 'fora' : null,
      golos: parseNum(val(l, 'golos')), golos_sofridos: parseNum(val(l, 'golos_sofridos')), metricas,
      jogado: Object.keys(metricas).length > 0
    };
    porEquipa[chave(competicao, jornada, equipa, advFicheiro)] = r;
    if (r.jogado) liga.push(r);
  }
  // Golos sofridos: se a coluna não existir, vêm dos golos do adversário.
  for (const r of liga) if (r.golos_sofridos === null) r.golos_sofridos = porEquipa[chave(r.competicao, r.jornada, r.adversarioFicheiro, r.equipaFicheiro)]?.golos ?? null;
  if (!nossa) avisos.push('Escolha qual é a vossa equipa neste ficheiro.');
  else {
    for (const r of Object.values(porEquipa)) {
      if (norm(r.equipaFicheiro) !== norm(nossa)) continue;
      const adv = porEquipa[chave(r.competicao, r.jornada, r.adversarioFicheiro, r.equipaFicheiro)];
      const ex = existentes[`${norm(r.competicao)}|${r.jornada}|${norm(r.adversario)}`];
      const j = {
        competicao: r.competicao, jornada: r.jornada, adversario: r.adversario, local: r.local,
        golos_marcados: r.jogado ? r.golos : null, golos_sofridos: r.jogado ? r.golos_sofridos : null,
        metricasNos: r.jogado ? r.metricas : null, metricasAdv: r.jogado && adv?.jogado ? adv.metricas : null,
        equipaNos: r.equipa, equipaAdv: r.adversario, existe: !!ex, jogado: r.jogado
      };
      (r.jogado ? jogos : porJogar).push(j);
    }
    jogos.sort((a, b) => a.jornada - b.jornada); porJogar.sort((a, b) => a.jornada - b.jornada);
    if (!jogos.length && !porJogar.length) avisos.push(`A equipa "${nossa}" não tem jogos neste ficheiro.`);
  }
  // Jogos do campeonato (todas as equipas): um por par casa/fora.
  const partidas = new Map();
  for (const r of Object.values(porEquipa)) {
    const casa = r.local === 'fora' ? r.adversario : r.equipa, fora = r.local === 'fora' ? r.equipa : r.adversario;
    if (r.local === null && norm(r.equipa) > norm(r.adversario)) continue; // sem coluna "Local": um registo por par
    const k = `${norm(r.competicao)}|${norm(casa)}|${norm(fora)}`;
    const ehCasa = r.local !== 'fora';
    const atual = partidas.get(k) || { competicao: r.competicao, jornada: r.jornada, casa, fora, golos_casa: null, golos_fora: null };
    if (r.jogado) { atual.golos_casa = ehCasa ? r.golos : r.golos_sofridos; atual.golos_fora = ehCasa ? r.golos_sofridos : r.golos; }
    partidas.set(k, atual);
  }
  // Uma equipa com dois jogos na mesma jornada indica uma jornada mal escrita no ficheiro (ex.: jogo adiado).
  const porJornada = new Map();
  for (const r of Object.values(porEquipa)) { const k = `${norm(r.competicao)}|${r.jornada}|${norm(r.equipa)}`; if (!porJornada.has(k)) porJornada.set(k, { r, advs: [] }); porJornada.get(k).advs.push(r.adversario); }
  const duplas = [...porJornada.values()].filter(x => x.advs.length > 1);
  if (duplas.length) avisos.push(`Jornada repetida — confirme no ficheiro: ${duplas.slice(0, 6).map(x => `${x.r.equipa} tem ${x.advs.length} jogos na J${x.r.jornada} (${x.advs.join(', ')})`).join('; ')}${duplas.length > 6 ? '…' : ''}.`);
  return { formato: 'liga', nossa, liga, jogos, porJogar, partidas: [...partidas.values()], avisos, ignoradas, nMetricas: tab.metricas.length, equipas: tab.equipas };
}

// ---------- Folha de codificação de oportunidades (método antigo, por zonas) ----------
const COLS_FOLHA = {
  clube: /^clube$|^equipa$/i, jornada: /^jornada$|^j$/i, adversario: /^advers[aá]rio$/i, treinador: /^treinador$/i, local: /^local$/i,
  momento: /^momento$/i, sub: /^sub.?momento$/i, mecanismo: /^mecanismo$/i, lado: /^lado$/i, parte: /^parte$/i, tempo: /^tempo$/i,
  zonaPasse: /^zona do passe$/i, quemPassa: /^quem faz o passe$/i, posPassa: /^posi[cç][aã]o de quem faz o passe$/i,
  zonaFin: /^zona de finaliza[cç][aã]o$/i, quemFin: /^quem finaliza$/i, posFin: /^posi[cç][aã]o de quem finaliza$/i, golo: /^golo\??$/i
};
function detetarFolhaOportunidades(linhas) {
  for (let ih = 0; ih < Math.min(5, linhas.length); ih++) {
    const cab = linhas[ih].map(c => String(c ?? '').trim());
    const idx = Object.fromEntries(Object.entries(COLS_FOLHA).map(([k, re]) => [k, cab.findIndex(c => re.test(c))]));
    if (['clube', 'adversario', 'momento', 'zonaFin', 'golo'].every(k => idx[k] >= 0)) return { formato: 'oportunidades', idx, linhas: linhas.slice(ih + 1) };
  }
  return null;
}

function analisarFolha(tab, partidas) {
  const I = tab.idx; const v = (l, k) => (I[k] >= 0 ? String(l[I[k]] ?? '').trim() : '');
  const comps = [...new Set(partidas.map(p => p.competicao))];
  const avisos = []; const registos = []; const semJornada = [], vazias = [], localTrocado = [], novos = new Map(), nomesLigados = new Map();
  const treinadores = new Map();
  tab.linhas.forEach((l, i) => {
    if (!v(l, 'clube') && !v(l, 'adversario')) { vazias.push(i + 2); return; }
    const jornada = parseNum(v(l, 'jornada'));
    if (jornada === null) { semJornada.push(i + 2); return; }
    const clube = v(l, 'clube'), adv = v(l, 'adversario');
    // Jogo do campeonato: mesma jornada e as duas equipas; senão, as duas equipas em qualquer jornada.
    const comEquipas = partidas.filter(p => (mesmaEquipa(p.casa, clube) && mesmaEquipa(p.fora, adv)) || (mesmaEquipa(p.fora, clube) && mesmaEquipa(p.casa, adv)));
    let p = comEquipas.find(x => x.jornada === jornada) || (comEquipas.length === 1 ? comEquipas[0] : null);
    if (!p) {
      const emCasa = !/^fora/i.test(v(l, 'local'));
      const k = `${jornada}|${norm(emCasa ? clube : adv)}|${norm(emCasa ? adv : clube)}`;
      if (!novos.has(k)) novos.set(k, { novo: true, competicao: comps[0] || 'Liga', jornada, casa: emCasa ? clube : adv, fora: emCasa ? adv : clube });
      p = novos.get(k);
    }
    const lado = mesmaEquipa(p.casa, clube) ? 'casa' : 'fora';
    if (norm(p[lado]) !== norm(clube)) nomesLigados.set(clube, p[lado]);
    if ((/^casa/i.test(v(l, 'local')) && lado === 'fora') || (/^fora/i.test(v(l, 'local')) && lado === 'casa')) localTrocado.push({ linha: i + 2, jornada, clube, jogador: v(l, 'quemFin') });
    const chaveP = p.novo ? `n:${p.jornada}|${norm(p.casa)}|${norm(p.fora)}` : p.id;
    if (v(l, 'treinador')) treinadores.set(`${chaveP}|${lado}`, v(l, 'treinador'));
    const momento = normMomento(v(l, 'momento')); const sub = normSub(momento, v(l, 'sub'));
    const zf = parseNum(v(l, 'zonaFin')), zp = parseNum(v(l, 'zonaPasse'));
    const semente = `${chaveP}|${i}`;
    const fin = zf >= 1 && zf <= 13 ? pontoNaZona('fin', zf, semente + 'f') : (sub === 'Penálti' ? { x: 89.6, y: 49 } : null);
    const pas = zp >= 1 && zp <= 13 && sub !== 'Penálti' ? pontoNaZona('passe', zp, semente + 'p') : null;
    const parte = /^1/.test(v(l, 'parte')) ? '1.ª parte' : /^2/.test(v(l, 'parte')) ? '2.ª parte' : null;
    const tempo = TEMPOS.find(t => norm(t) === norm(v(l, 'tempo'))) || null;
    registos.push({
      partida: p, lado, equipa: p[lado],
      tipo: 'oportunidade', momento, sub_momento: sub, mecanismo: normMecanismo(momento, sub, v(l, 'mecanismo')),
      corredor: CORREDORES.find(c => norm(c) === norm(v(l, 'lado'))) || null, parte: parte || parteDoTempo(tempo), tempo, minuto: null,
      zona_x: fin?.x ?? null, zona_y: fin?.y ?? null, passe_x: pas?.x ?? null, passe_y: pas?.y ?? null, local_aprox: true,
      assistente: normNome(v(l, 'quemPassa')), posicao_passe: normPosicao(v(l, 'posPassa')),
      jogador: normNome(v(l, 'quemFin')), posicao_finalizador: normPosicao(v(l, 'posFin')),
      resultado: /^s/i.test(v(l, 'golo')) ? 'Golo' : 'Sem golo', qualidade: sub === 'Penálti' ? 'Grande oportunidade' : 'Oportunidade', origem: 'folha_z'
    });
  });
  if (semJornada.length) avisos.push(`${semJornada.length} linhas sem jornada ficam de fora (jogos fora do campeonato).`);
  if (vazias.length) avisos.push(`${vazias.length} linhas vazias ignoradas.`);
  for (const [a, b] of nomesLigados) avisos.push(`"${a}" foi ligado a "${b}" (nome do ficheiro da liga).`);
  if (localTrocado.length) avisos.push(`${localTrocado.length === 1 ? '1 linha tem' : `${localTrocado.length} linhas têm`} o local trocado em relação ao jogo; ficam na equipa indicada em "Clube": ${localTrocado.slice(0, 4).map(x => `linha ${x.linha} (J${x.jornada}, ${x.clube}${x.jogador ? ', ' + x.jogador : ''})`).join('; ')}.`);
  if (novos.size) avisos.push(`${novos.size} ${novos.size === 1 ? 'jogo não existe' : 'jogos não existem'} no ficheiro da liga e ${novos.size === 1 ? 'vai ser criado' : 'vão ser criados'}: ${[...novos.values()].slice(0, 4).map(p => `J${p.jornada} ${p.casa}–${p.fora}`).join(', ')}.`);
  return { formato: 'oportunidades', registos, novos: [...novos.values()], treinadores, avisos, semJornada: semJornada.length };
}

const TABELAS_COPIA = [['configuracao', 'id'], ['jogos', 'data'], ['estatisticas_equipa', 'updated_at'], ['estatisticas_jogador', 'updated_at'], ['eventos', 'created_at'],
  ['mapeamento_nomes', 'original'], ['importacoes', 'created_at'], ['jogadores', 'nome'], ['agenda', 'data'], ['partidas', 'jornada'], ['estatisticas_liga', 'updated_at'],
  ['jogadores_adversarios', 'nome'], ['onzes', 'created_at'], ['arquivo', 'jornada'], ['estatisticas_adversario', 'data'], ['simbolos_equipas', 'chave'], ['scout_equipas', 'equipa'], ['scout_jogadores', 'nome'], ['scout_avaliacoes', 'created_at']];
// Chave de cada tabela para repor uma cópia (atualiza ou volta a criar o registo; nunca apaga).
const CHAVE_COPIA = { configuracao: 'id', mapeamento_nomes: 'tipo,original', simbolos_equipas: 'chave' };
const ORDEM_REPOR = ['configuracao', 'simbolos_equipas', 'mapeamento_nomes', 'importacoes', 'jogos', 'partidas', 'jogadores', 'jogadores_adversarios', 'estatisticas_equipa', 'estatisticas_jogador', 'estatisticas_liga', 'estatisticas_adversario', 'eventos', 'onzes', 'arquivo', 'agenda', 'scout_equipas', 'scout_jogadores', 'scout_avaliacoes'];
async function reporCopia(ficheiro, progresso = () => {}) {
  const c = JSON.parse(await ficheiro.text());
  if (c?.aplicacao !== 'Departamento de Análise' || !c.tabelas) throw new Error('Este ficheiro não é uma cópia de segurança da aplicação.');
  let n = 0, saltados = 0;
  for (const t of ORDEM_REPOR) {
    const linhas = c.tabelas[t]; if (!Array.isArray(linhas) || !linhas.length) continue;
    for (let i = 0; i < linhas.length; i += 400) {
      progresso(t, i, linhas.length);
      const bloco = linhas.slice(i, i + 400);
      try { await App.db.upsert(t, bloco, CHAVE_COPIA[t] || 'id'); n += bloco.length; }
      catch {
        // Algum registo choca com outro criado depois da cópia (o mesmo jogo, por exemplo): repõe um a um e salta esses.
        for (const r of bloco) { try { await App.db.upsert(t, [r], CHAVE_COPIA[t] || 'id'); n++; } catch { saltados++; } }
      }
    }
  }
  return { n, saltados };
}
async function descarregarCopia() {
  const tabelas = {}; let n = 0;
  for (const [t, ordem] of TABELAS_COPIA) {
    try { tabelas[t] = await App.db.listar(t, ordem); n += tabelas[t].length; } catch { tabelas[t] = null; /* tabela ainda não criada */ }
  }
  const copia = { aplicacao: 'Departamento de Análise', versao: 1, criada_em: new Date().toISOString(), origem: App.db.modo === 'supabase' ? App.db.url : 'demonstracao', tabelas };
  const blob = new Blob([JSON.stringify(copia)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `copia-seguranca-analise-${hojeIso()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return n;
}

// Cache das tabelas.
// - Em memória: numa atualização automática só se volta a ler o que mudou.
// - No browser (IndexedDB, só com o Supabase): ao abrir a app pedem-se apenas as linhas alteradas desde a última vez
//   (updated_at, marcado pela base de dados) e a lista de chaves, para saber o que foi apagado.
App.cacheTabelas = {};
const CACHE_VERSAO = 1;
const CACHE_SEM_DELTA = new Set(['perfis', 'mapeamento_nomes']); // pequenas ou sem chave simples: leem-se sempre inteiras
const chaveTabela = t => (t === 'simbolos_equipas' ? 'chave' : 'id');
const cacheIdb = {
  _db: null,
  abrir() {
    if (this._db) return this._db;
    this._db = new Promise(res => {
      try {
        const r = indexedDB.open('analise-cache', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('tabelas');
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch { res(null); }
    });
    return this._db;
  },
  async _op(modo, fn) {
